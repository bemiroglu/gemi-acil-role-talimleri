name: Calendar and vessel regression
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify calendar rules
        run: node tests/test-calendar.cjs
      - name: Verify drill workspace and privacy invariants
        run: node tests/test-training.cjs
      - name: Validate vessel profiles and catalog
        run: node tests/test-vessel-profiles.cjs
      - name: Smoke test new vessel onboarding
        run: |
          node scripts/new-vessel.cjs "CI DENEME GEMISI"
          node tests/test-vessel-profiles.cjs
