in addition to the initial danger. Watertight boundaries, suitable isolation, pumping capacity, and environmental spread are assessed using the relevant damage-control information. This card serves as a cross-reference: detailed measures are linked to DAMAGE_COMMON, POLLUTION_COMMON, and FIRE_COMMON rather than repeating those full technical lessons. Training question: What must be checked before pumping in an area containing a damaged fuel tank?"}]},{"id":"NAV-C15","family":"weather_collision","title_tr":"Kurtarma, dış yardım ve hasarlı gemilerin ayrılması","title_en":"Salvage, outside assistance and separation of damaged vessels","paragraphs":[{"tr":"Başka gemiye yardım, römorkör desteği, yerinde kalma, emniyetli uzaklaşma veya gemilerin ayrılması seçenekleri mevcut tehlike, manevra kabiliyeti, gövde bütünlüğü, batma/kirlilik riski ve kaptanlar arası koordinasyonla değerlendirilir. Çatışmış iki teknenin birbirine temas ettiği noktadan ayrılma hareketi, olası bir su girişini artırabileceğinden otomatik manevra olarak öğretilmez. Yardım isteyen başka geminin personel emniyeti de dikkate alınır. Öğretim sorusu: Gemiler hâlen temas hâlindeyken hangi hasar bilgileri eksiktir?","en":"Assisting another vessel, seeking tug support, remaining in position, moving clear safely, or separating damaged vessels are assessed against the current danger, manoeuvring capability, hull integrity, flooding and pollution risk, and coordination between masters. Separating two vessels that are still in contact is not taught as an automatic manoeuvre because doing so may increase water ingress at the damaged area. The safety of personnel aboard any vessel requiring assistance is also considered. Training question: What damage information remains unknown while the vessels are still in contact?"}]},{"id":"NAV-C16","family":"weather_collision","title_tr":"COLREG işaretleri ve gerçek durumun tanımlanması","title_en":"COLREG signals and accurate description of actual status","paragraphs":[{"tr":"Kısıtlı görüş, dar geçit, trafik ayrım düzeni ve kumanda altında olmama gibi kavramlar birbirinin yerine geçmez. Bir geminin çatışması, otomatik olarak COLREG Kural 27'deki “kumanda altında olmayan gemi” niteliğini kazandığı anlamına gelmez; gerçek manevra kabiliyeti şartları değerlendirilir. Işık, alamet ve seda işaretleri ilgili duruma ve gün/geceye uygun seçilir. Öğretim sorusu: Ana makinesi çalışırken çatışma geçiren bir gemi her koşulda kumanda altında değil midir?","en":"Restricted visibility, narrow channels, traffic separation schemes, and being not under command are distinct concepts. A collision does not automatically make a vessel 'not under command' within the meaning of COLREG Rule 27; its actual ability to manoeuvre as required by the Rules must be assessed. Navigation lights, shapes, and sound signals are selected according to the applicable circumstances and whether it is day or night. Training question: Is a vessel that has collided but retains a running main engine necessarily not under command?"}]},{"id":"NAV-C17","family":"weather_collision","title_tr":"VDR, ECDIS, harita ve haberleşme verisinin korunması","title_en":"Preservation of VDR, ECDIS, chart and communications data","paragraphs":[{"tr":"Gerçek olayda kaptanın talimatı ve geçerli SMS hükümleri uyarınca zaman çizelgesi, jurnal, radar/ECDIS görüntüleri, VDR/S-VDR verisi, VHF kayıtları, yazılı emirler, seyir planı ve tanık gözlemleri korunur. Cihazın veriyi otomatik üzerine yazma süresi modele göre değişebilir; belirli bir süre varsayılmaz. Kanıt saklamak, gemide emniyet için gerekli canlı sistemleri tehlikeye düşürmemelidir. Rutin talimde gerçek olayın delil zinciri varmış gibi rapor düzenlenmez. Öğretim sorusu: Gözcü ve makine operatörünün olay saatleri farklıysa hangi özgün kayıtlar karşılaştırılır?","en":"In an actual incident, the relevant timeline, logbook, radar and ECDIS displays, VDR or S-VDR information, VHF records, written instructions, passage plan, and witness observations are preserved in accordance with the master's instructions and the applicable SMS. The interval before equipment overwrites its data varies by model; no fixed duration is assumed. Preserving evidence must not jeopardise live systems necessary for vessel safety. A routine drill does not create a fictitious chain of custody for evidence from a real casualty. Training question: If a lookout and engine operator report different event times, which original records should be compared?"}]},{"id":"NAV-C18","family":"weather_collision","title_tr":"Talim emniyeti, gerçek uygulama ve sonuç değerlendirmesi","title_en":"Drill safety, actual operations and assessment of results","paragraphs":[{"tr":"Talim öncesinde gerçek seyir hareketinin gerekip gerekmediği, mevcut trafik, hava, personel yorgunluğu ve sistem durumu değerlendirilir. Risk doğuran ani rota değişikliği, makine stopu, seyir sisteminin kapatılması veya gerçek acil yayın talim için yapılmaz. Öğretim, haberleşme provası, harita/radar üzerinde vaka çalışması, emniyetli ekipman gösterimi ve izin verilen uygulamalar şeklinde planlanır. Sonuçta ölçülebilir bulgular — görev bilgisi, bildirim sırası, ekipman erişimi, kayıt kalitesi ve geliştirme ihtiyacı — kaydedilir. Öğretim sorusu: Hangi aşamada gerçek uygulamanın durdurulmasına karar verilir?","en":"Before a drill, assess whether any real manoeuvre is required and consider current traffic, weather, crew fatigue, and system condition. Sudden course alterations, stopping propulsion, disabling navigation systems, or making genuine emergency broadcasts are not performed merely to provide a realistic exercise. Training uses communication practice, chart and radar case studies, safe equipment demonstrations, and any specifically authorised practical activity. Record measurable outcomes such as knowledge of duties, reporting sequence, equipment accessibility, record quality, and improvement needs. Training question: At which point should a real practical activity be stopped?"}]},{"id":"HELI-C01","family":"helicopter","title_tr":"Operasyon türleri: iniş, vinç ve havadan yardım","title_en":"Operation types: landing, winching and aerial assistance","paragraphs":[{"tr":"Gemide helikopter bulunmasıyla ilgili her faaliyet aynı değildir. İnişte hava aracı fiziksel olarak onaylı iniş sahasına temas eder; yapısal yük, işaretleme, yangın donanımı ve mürettebatın yaklaşma kuralları değerlendirilir. Vinçle almada helikopter havada kalırken insan veya kurtarma donanımı halatla aktarılır; rotor akımı, halat takılması, statik elektrik ve güverte sınırları öne çıkar. Tıbbi tahliye bu iki yöntemden biriyle veya başka düzenle yapılabilir; tıbbi öncelikler ve hastanın hazırlanması ek değerlendirme gerektirir. Denize zorunlu iniş ise normal transferin değil, hava aracı kazasına müdahale ve SAR faaliyetinin konusudur. Bir gemide iniş alanı bulunmaması vinçle almanın kendiliğinden uygun olduğunu göstermez. Her yöntem için gemi onayı, hava aracı işleticisinin kabiliyeti, meteorolojik koşullar ve operasyon öncesi risk değerlendirmesi aranır.","en":"Not every shipboard activity involving a helicopter is the same. During a landing, the aircraft physically touches an approved landing area; structural loads, markings, firefighting arrangements, and crew approach rules must be considered. In a winching operation, the helicopter remains airborne while a person or rescue equipment is transferred on a cable, making rotor downwash, snagging, static electricity, and deck boundaries especially important. Medical evacuation may use either method or another arrangement and requires additional consideration of clinical priorities and patient preparation. Ditching calls for response to an aircraft accident and search and rescue, not a normal transfer procedure. The absence of a landing area does not by itself establish that winching is suitable. Every method requires evaluation of the ship's approval, aircraft operator's capability, weather, and pre-operational risks."}]},{"id":"HELI-C02","family":"helicopter","title_tr":"Kaptan, HLO/sorumlu zabit, köprüüstü ve uçuş ekibi","title_en":"Master, HLO/responsible officer, bridge and flight crew","paragraphs":[{"tr":"Kaptan geminin seyir, mürettebat ve operasyon emniyetinden; helikopter pilotu hava aracının uçuş emniyetinden sorumludur. Görevli Helicopter Landing Officer (HLO) veya sorumlu zabit, geminin organizasyonunda bu göreve yetkilendirilmişse güverte hazırlığını, haberleşme zincirini ve yangın/kurtarma ekiplerinin konuşlanmasını koordine eder. HLO unvanı her gemide görevli bir kişi bulunduğunu kanıtlamaz; ilgili işletme düzeni esas alınır. Köprüüstü zabiti rota, sürat, konum, geminin hareketleri ve tehlike bilgilerini takip eder. Kurtarma/yangın ekibi, iniş/vinç alanının emniyetinden sorumlu zabitle bağlantılı çalışır. Kimin uçuş ekibiyle doğrudan konuşacağı, geri bildirim vereceği, durdurma/erteleme talebini ileteceği ve personel sayımını yapacağı önceden açıklanır. Bu görevler ortak role cetvelinde açık değilse operasyon öncesi özel görev dağılımı kullanılır.","en":"The master is responsible for the ship's navigation, personnel, and operational safety; the helicopter pilot is responsible for flight safety. A designated Helicopter Landing Officer (HLO) or responsible officer coordinates deck preparation, communications, and the positioning of firefighting and rescue teams when specifically authorised under the ship's organisation. The title HLO does not establish that a person in that role exists on every vessel; the actual operating arrangements govern. The bridge officer monitors course, speed, position, ship motions, and hazards. Rescue and firefighting teams coordinate with the officer responsible for the landing or winching area. Before operations, identify who communicates directly with the aircrew, acknowledges messages, transmits a stop or postponement request, and conducts personnel accountability. If these responsibilities are not included in the general muster list, a task-specific assignment is used."}]},{"id":"HELI-C03","family":"helicopter","title_tr":"Operasyon sahasının sınıflandırılması ve uygunluğu","title_en":"Classification and suitability of operating areas","paragraphs":[{"tr":"Helideck, helikopter iniş/parkına yönelik özel tesis; helicopter landing area, tanımlanmış iniş alanı; winching area, havada asılı kalınarak insan/donanım aktarımı için değerlendirilen alandır. Terimler, onaylı kullanım koşulları birbirine karıştırılmaz. Saha için açıklık, taşıma kapasitesi, giriş–çıkış, yüzeyin durumu, aydınlatma, çevredeki hava akımı, sabit/düşey engeller ve gemi hareketleri incelenir. Antenler, baca gazı, vinçler, direkler, tel/halatlar, açık kapaklar ve gevşek ekipman ayrı tehlike kaynağıdır. Platformun yalnız görsel olarak geniş görünmesi helikopter inişine uygun olduğu anlamına gelmez. Onaylı shipboard helicopter operating area plan ve gemiye özel sınırlamalar, uçuş ekibine iletilen bilginin temelini oluşturur.","en":"A helideck is a purpose-designed facility for helicopter landing and parking; a helicopter landing area is a defined landing area; and a winching area is assessed for transfer of people or equipment while the aircraft hovers. These terms and the conditions under which the respective areas are approved are not interchangeable. Review clearances, load-bearing capacity, access and escape, surface condition, lighting, airflow, fixed or elevated obstructions, and ship motions. Antennas, funnel exhaust, cranes, masts, wires, open hatches, and unsecured equipment present distinct hazards. A platform that looks sufficiently large is not necessarily suitable for landing. The approved shipboard helicopter operating-area plan and vessel-specific limitations are fundamental information for the aircrew."}]},{"id":"HELI-C04","family":"helicopter","title_tr":"Rüzgâr, gemi hareketi, hava akımı ve görüş","title_en":"Wind, ship motion, airflow and visibility","paragraphs":[{"tr":"Helikopter çevresindeki hava akımı; gerçek rüzgâr, gemi hareketi, üstyapı türbülansı, baca egzozu, görüş, yağış, dalga ve geminin yalpa/baş-kıç vurmasıyla etkilenir. Rotorun indüklediği downwash açık kapak, hafif donanım, personel ve hortumları etkileyebilir. Kaptan ve köprüüstü seyir emniyetini gözeterek geminin mevcut yönü/sürati ve olası manevra sınırlarını pilotla paylaşır. Helikopter işleticisi hangi yaklaşma, rüzgâr ve hareket limitlerinde uçuş yapacağını bildirir. Tek bir sabit rota/rüzgâr açısı her gemi ve helikopter için geçerli eğitim emri olarak kullanılmaz. Elverişsiz hava koşullarında erteleme ve alternatif tahliye yöntemleri eğitimde karar noktası olarak incelenir.","en":"Airflow around the helicopter is affected by the actual wind, vessel movement, superstructure turbulence, funnel exhaust, visibility, precipitation, sea conditions, and the ship's roll and pitch. Rotor downwash can disturb open hatches, light equipment, personnel, and hoses. While maintaining navigational safety, the master and bridge share the vessel's present heading and speed and any manoeuvring limitations with the pilot. The helicopter operator specifies the approach, wind, and vessel-motion limits under which it can operate. No single course or wind angle is used as a universal training order for every vessel and helicopter. Postponement and alternative evacuation methods are examined as decision points when weather is unsuitable."}]},{"id":"HELI-C05","family":"helicopter","title_tr":"Haberleşme ve standart geri bildirim","title_en":"Communications and standard read-back","paragraphs":[{"tr":"Helikopterin gemiyi doğru tanıması için çağrı işareti, mevki, gemi hareketi, seyir ve operasyon sahası durumu önceden paylaşılır. Kullanılacak hava-deniz telsiz kanalı/frekans, çağrı/cevap düzeni ve bağlantının kesilmesi hâlinde uygulanacak işaretler uçuş görevlileriyle mutabık kalınır; evrensel tek frekans varsayılmaz. Kritik iletiler kısa ve doğrulamalı iletilir: talep – tekrar – onay. Güverte ekibi ile köprüüstü arasında ayrı dahili haberleşme hattı bulunur. Görsel işaretlerin anlamı işletici prosedürüne dayanır; plansız el işaretleri pilotun kararını yanlış yönlendirebilir. Gerçek tehlike/alarm yayınları ile eğitim amaçlı senaryo konuşmaları ayrıştırılır. Haberleşme başarısızlığında, onaylı kesme/iptal prosedürü esas alınır.","en":"To allow the helicopter to identify the vessel accurately, the call sign, position, ship motion, navigation status, and operating-area condition are shared in advance. The air–sea radio channel or frequency, call-and-response protocol, and signals to be used if communications fail are agreed with the flight crew; a single universal frequency is not assumed. Critical messages are brief and confirmed through request, read-back, and acknowledgment. A separate internal link is maintained between the deck team and bridge. Visual signals derive from the operator's procedures; improvised hand signals could mislead the pilot. Genuine emergency broadcasts are distinguished from scenario communications. If communications fail, the approved abort or cancellation procedure applies."}]},{"id":"HELI-C06","family":"helicopter","title_tr":"Sahadaki yabancı nesne ve rotor emniyeti","title_en":"Foreign-object debris and rotor safety","paragraphs":[{"tr":"Hafif malzemeler, örtüler, boş ambalaj, açık malzeme kutuları, gevşek halat uçları ve personel üzerindeki sallanan eşyalar rotor akımıyla savrularak insanlara veya hava aracına zarar verebilir. Foreign Object Debris (FOD) kavramı, yalnız platformdaki iri cisimleri değil uçuş akımıyla harekete geçebilecek küçük parçaları da kapsar. Koruyucular, personel yaklaşma güzergâhı ve ekipman konumları belirlenir. Rotor ve kuyruk rotor bölgesi, özellikle görüş ve işitme zayıfken yüksek risktir. Pilot/yer ekibi izin vermedikçe helikoptere yaklaşılmaz; görevli personel dahi onaylı giriş–çıkış güzergâhını kullanır. Kazada rotor tamamen emniyete alınmamışken yaklaşma kararının özel riski ayrıca öğretilir.","en":"Light materials, covers, empty packaging, open toolboxes, loose rope ends, and dangling personal equipment can be displaced by rotor downwash and injure people or damage the aircraft. Foreign Object Debris (FOD) includes not only large objects on the platform but also small items that may be moved by airflow. Guards, personnel approach routes, and equipment locations are established. The main- and tail-rotor areas present particular danger when visibility or hearing is impaired. No one approaches the aircraft without the permission of the pilot or ground crew; even authorised personnel use the approved access and departure routes. Training also addresses the special risk of approaching a crashed aircraft before its rotor has been made fully safe."}]},{"id":"HELI-C07","family":"helicopter","title_tr":"Kişisel koruyucu donanım ve personel disiplini","title_en":"Personal protective equipment and personnel discipline","paragraphs":[{"tr":"Görev rolüne göre baş koruma, göz koruması, uygun ayakkabı, işitme koruması, can yeleği/denize düşmeye karşı koruma ve yangın/kurtarma donanımı değerlendirilir. Donanım seçimi operasyon türüne ve ilgili donanım/işletici talimatına göre yapılır. Gevşek koruyucu başlık, açık fermuar, sallanan askılar veya uygun olmayan çanta rotor akımı altında yeni tehlike doğurabilir. Gemi–helikopter personel transferinde yolcunun emniyet bilgilendirmesi, üzerinde taşınmaması gereken eşyalar, güvenli yaklaşma/ayrılma ve talimat dinleme konuları ayrıca ele alınır. Yangın müdahale personelinin koruma düzeyi, olağan güverte görevlilerinin donanımından farklıdır.","en":"Depending on assigned duties, assess head and eye protection, suitable footwear, hearing protection, lifejackets or other man-overboard protection, and firefighting or rescue equipment. Selection follows the type of operation and the relevant equipment and operator instructions. Loose headgear, open zips, dangling straps, and unsuitable bags may become hazards in rotor downwash. During ship–helicopter personnel transfer, passengers receive a safety briefing covering prohibited carried items, safe approach and departure, and compliance with instructions. The protection required for firefighting personnel differs from that used by routine deck personnel."}]},{"id":"HELI-C08","family":"helicopter","title_tr":"Yangından korunma ve helikopter yakıtı tehlikesi","title_en":"Fire prevention and helicopter fuel hazards","paragraphs":[{"tr":"Helikopter yakıtı/yağı, sıcak yüzeyler, elektrikli donanım, rotor sürtünmesi ve olası kaza sonrası sızıntılar farklı yangın kaynakları oluşturur. Yangın ekibi, uygun ajan, pompa/monitör, hortum, kişisel koruyucu ve tahliye yollarının hazır olmasını değerlendirir. Alevi söndürmek, yaralının emniyetli kurtarılmasını ve gövde/kanat çevresindeki ikincil ateşlenme riskinin kontrolünü tek başına tamamlamaz. Söndürücü ajan ve uygulama tekniği hava aracı tipine, yangın bölgesine, geminin donanımına ve onaylı yangın prosedürüne göre seçilir. Eski örnek prosedürde geçen bir müdahale tekniği her hava aracı motoruna, yakıt düzenine veya kaza türüne otomatik olarak uygulanmaz. Helideck ve tesisi bulunmayan gemideki ara sıra yapılan operasyonların SOLAS II-2/18 bakımından farklı statüye sahip olduğu hatırlatılır.","en":"Helicopter fuel and oil, hot surfaces, electrical equipment, rotor friction, and leaks following an accident can create different fire hazards. The firefighting team assesses the readiness of suitable extinguishing agents, pumps or monitors, hoses, personal protection, and escape routes. Extinguishing visible flames does not by itself complete casualty rescue or remove the risk of re-ignition around the fuselage and rotor. Agents and application methods are selected according to aircraft type, fire location, the ship's installed equipment, and approved fire procedures. A technique described in an older example procedure must not be applied automatically to every aircraft engine, fuel arrangement, or accident type. The distinction under SOLAS II-2/18 between vessels fitted with a helideck facility and vessels conducting occasional helicopter operations is noted."}]},{"id":"HELI-C09","family":"helicopter","title_tr":"Helideck yangın suyu, köpük ve kirli akışın kontrolü","title_en":"Helideck firewater, foam and contaminated runoff","paragraphs":[{"tr":"Helikopter yangınında köpük/su kullanımı, yangının sınırlanmasıyla birlikte yağ-yakıtlı akışın güverte ve denize yayılması riskini gündeme getirir. Yangına yaklaşmadan önce saha drenajı, frengiler, toplama imkânı ve komşu sistemlere etki değerlendirilir; yangın söndürme ihtiyacını tehlikeye atacak kontrolsüz izolasyon yapılmaz. Sızıntının denize karışması hâlinde Deniz Kirliliği ortak eğitim kartları kullanılır. İçerik, her gemide aynı tip köpük tesisatı ve aynı kapasitede monitör bulunduğu izlenimi vermez. Yanıcı gaz/hava karışımı, yeniden tutuşma, sıcak yüzey ve yakıt kaynağının kontrolü ayrıntılı risk tartışmasına dâhildir.","en":"Using foam or water at a helicopter fire raises the issue of fuel- and oil-contaminated runoff spreading across the deck or into the sea while the fire is being controlled. Before approach, assess site drainage, scuppers, collection arrangements, and effects on adjacent systems; do not isolate systems indiscriminately where this could compromise firefighting. If a spill reaches the sea, use the shared Marine Pollution training cards. The guidance must not suggest that every ship has the same foam installation or monitor capacity. Flammable vapour–air mixtures, re-ignition, hot surfaces, and control of the fuel source are included in the risk discussion."}]},{"id":"HELI-C10","family":"helicopter","title_tr":"Vinç halatı, statik elektrik ve takılma riski","title_en":"Winch cable, static electricity and snagging hazards","paragraphs":[{"tr":"Helikopterin dönmekte olan rotoru ve hava akımı elektrik yükü oluşumuna neden olabilir. Vinç halatı, sepet veya kurtarma sedyesi güverteye yaklaşırken statik yükün boşalması yaralanma riski yaratır; vinç aparatının temas/boşalma düzeni uçuş ekibi talimatına uygun yürütülür. Personel aparat/halata kendiliğinden müdahale etmez; kablo veya rehber halatı geminin sabit yapılarına bağlamaz. Halatın antenlere, parmaklıklara, arma veya vinç donanımına takılması hem insanı hem hava aracını tehlikeye sokabilir. Kaldırılan kişinin salınması, tekne hareketi ve kurtarma sepetinin yanlış taşınması ayrı konulardır. Görevli zabit bu riskleri anlatır; fiilî vinçli kurtarma ancak yetkili hava mürettebatıyla yapılır.","en":"The helicopter's rotating rotor and airflow can generate electrical charge. As a hoist cable, rescue basket, or stretcher approaches the deck, discharge of static electricity may cause injury; the approved contact or discharge method is directed by the flight crew. Personnel must not take hold of the equipment or cable on their own initiative or secure a guide line to fixed parts of the ship. Snagging on antennas, rails, rigging, or crane gear may endanger both the person being lifted and the aircraft. Swinging of a suspended person, vessel motion, and incorrect handling of a rescue basket are separate hazards. The responsible officer explains these risks; actual winch rescue is undertaken only with authorised aircrew."}]},{"id":"HELI-C11","family":"helicopter","title_tr":"İniş ve vinç sahası: engeller, işaretleme, aydınlatma","title_en":"Landing and winching areas: obstacles, markings and lighting","paragraphs":[{"tr":"İniş ve vinç sahasının işaret ve boşluk şartları aynı değildir. Vinçle alma alanında anten, direk, küpeşte, tente ve diğer yüksek/çıkıntılı unsurların kaldırılması, indirilmesi veya güvenli şekilde bağlanması uçuş güvenliği açısından değerlendirilir. Gece uygulamasında hem engellerin seçilebilir olması hem de pilotun gözünü kamaştırmayan aydınlatma gereklidir. CAP 437 (2026) Bölüm 10 bu konuları ayrıntılı işler; ancak çizimdeki ölçüler, yükseklikler veya “WINCH ONLY” işaretleri onaylı mühendislik/işletme değerlendirmesi yerine tek başına kullanılmaz. Personel, yalnız sahanın yakınını değil vinç kolunun/rotorun etkileyebileceği bitişik mahalleri de dikkate alır.","en":"The marking and clearance requirements for landing and winching areas differ. For winching, the need to remove, lower, or secure antennas, masts, bulwarks, awnings, and other protruding or elevated obstructions is assessed for flight safety. At night, lighting must make hazards visible without dazzling the pilot. CAP 437 (2026), Chapter 10, addresses these topics in detail; however, dimensions, heights, or 'WINCH ONLY' markings in example drawings do not independently replace an approved engineering and operational assessment. Personnel consider not just the immediate operating area but also adjacent spaces that might be affected by the hoist or rotor."}]},{"id":"HELI-C12","family":"helicopter","title_tr":"Yolcu, sedye ve tıbbi tahliye hazırlığı","title_en":"Passengers, stretchers and medical evacuation preparation","paragraphs":[{"tr":"Yaralının gemiden alınması gerektiğinde vaka özeti, bilinç/solunum durumu, bilinen yaralanmalar, hareket ettirme sınırları ve tıbbi gözetim ihtiyacı koordinasyon merkezine ve uçuş ekibine önceden bildirilir. Sedye veya kurtarma sepeti seçimi hava kurtarma ekibinin onaylı sistemine bağlıdır. Hastanın kıyafet/koruyucu, termal korunma, emniyet kemeri ve hatlara takılma tehlikeleri eğitimde açıklanır. Geminin tıbbi personeli ile havadaki kurtarma görevlisi hasta transferinin her aşamasında iletişim kurar. Ağır yaralının düşey ve yatay konumlandırılması, travma şüphesi ve tahliye önceliği uzaktan verilen rastgele direktiflerle belirlenmez; tıbbi ve uçuş ekibi değerlendirmesi esas alınır.","en":"When a casualty must be evacuated by air, the incident summary, consciousness and breathing status, known injuries, movement restrictions, and need for clinical monitoring are communicated to the coordination centre and aircrew in advance. Selection of stretcher or rescue basket depends on the air-rescue team's approved equipment. Training covers clothing and protection, thermal protection, restraints, and risks of snagging on lines. Shipboard medical personnel and the airborne rescue specialist communicate through each stage of the transfer. Vertical or horizontal positioning of a seriously injured patient, suspected trauma, and evacuation priority are determined by medical and flight-team assessment, not arbitrary remote instructions."}]},{"id":"HELI-C13","family":"helicopter","title_tr":"Helikopter kaza türlerinin sınıflandırılması","title_en":"Classification of helicopter accident scenarios","paragraphs":[{"tr":"Motor/kompartıman yangını, yakıt sızıntısı (yangınsız), sert iniş/çarpışma, rotor/kanat teması, güverte üzerinde devrilme, denize zorunlu iniş (ditching) ve vinç arızası farklı risk resimleri doğurur. Bir olayda birden fazla tehlike olabilir. İlk amaç kişileri ikinci bir tehlikeye maruz bırakmadan alanın kontrol edilmesi, alarm/haberleşme ve uygun müdahale kararının verilmesidir. Olayın başlangıç türü, dumanın rengi veya geldiği yer tek başına kesin teşhis sağlamaz. Yakıt sızıntısında ateşleme kaynakları; çarpışmada yakıt, hidrolik, elektrik ve rotor; denize inişte batma, yüzdürme donanımı, akıntı ve yaralıların suya maruz kalması birlikte değerlendirilir.","en":"Engine or compartment fire, fuel leakage without fire, hard landing or collision, rotor or blade contact, overturning on deck, ditching, and hoist failure present different hazard patterns. Several hazards may coexist in one incident. The first priority is to secure the area, raise the alarm, establish communications, and make appropriate response decisions without exposing people to a second danger. The initiating event, smoke colour, or apparent source of smoke alone does not provide a definitive diagnosis. Following a fuel leak, assess ignition sources; after an impact, consider fuel, hydraulic and electrical systems, and rotor hazards; after ditching, consider sinking, flotation equipment, current, and exposure of casualties in the water."}]},{"id":"HELI-C14","family":"helicopter","title_tr":"Denize zorunlu iniş: SAR ve kurtarma botu bağlantısı","title_en":"Emergency ditching: SAR and rescue-boat coordination","paragraphs":[{"tr":"Helikopter denize zorunlu indiğinde mevki ve zamanın kaydı, gözlemin sürdürülmesi, denizdeki insan sayısının tahmini, rüzgâr/akıntı ve hava aracı enkazı tehlikeleri öncelikli konulardır. Kaptan, kendi gemisinin emniyetine göre SAR merkezinin talimatlarını ve olası kurtarma imkânlarını değerlendirir. Kurtarma botunun gerçekten indirilip indirilemeyeceği ve hangi botun kullanılacağı ayrı bir operasyonel karardır; yalnız acil durum listesindeki bir maddeye bakılarak otomatik indirme emri verilmez. Can yeleği, termal koruma, temas sonrası ilk yardım ve kazazedeyi güverteye alma için MOB/SAR/Kurtarma Botu ortak bilgi kartları yeniden kullanılır. Rotor/enkazla temas, takılı vinç kabloları ve ani batma tehlikesi nedeniyle kazaya yaklaşma özel eğitim gerektirir.","en":"If a helicopter ditches, record its position and time, maintain observation, estimate the number of people in the water, and assess wind, current, and aircraft-wreckage hazards. The master considers SAR coordination-centre instructions and available rescue options in the context of the ship's own safety. Whether a rescue boat can safely be launched, and which craft should be used, is a separate operational decision; an emergency checklist entry alone is not an automatic launching order. Shared MOB, SAR, and Rescue Boat cards cover lifejackets, thermal protection, first aid after recovery, and bringing casualties aboard. Approaching the crash site requires specialised training because of rotors, debris, attached hoist cables, and rapid sinking hazards."}]},{"id":"HELI-C15","family":"helicopter","title_tr":"Yangın sonrası tahliye ve ilk yardım","title_en":"Post-fire evacuation and first aid","paragraphs":[{"tr":"Helikopterin çevresinde yangın veya darbe oluştuğunda kurtarıcı önce olayın büyümesini, yakıt kaçağını, rotor/hareketli kısımları, sıcak yüzeyleri ve kaçış yolunu değerlendirir. Yaralının kurtarılmasında korunaklı yaklaşma ile pilot/uçuş ekibinin verdiği bilgiler kıymetlidir. Kazazedeyi gelişigüzel çekmek, kırık/omurga yaralanmasını ağırlaştırabilir; ancak yakın ve ölümcül tehlike acil kurtarmayı gerektirebilir. Eğitim, gemide mevcut yangın kurtarma takımı, sedye, kesici takım ve ilk yardım donanımının nerede bulunduğunun ve hangi yetkiyle kullanılacağının tanıtımını kapsar. İşlevi bilinmeyen özel uçak kilidi veya tahliye bağlantısı üzerinde modelden bağımsız işlem yaptırılmaz.","en":"Where fire or impact has occurred around a helicopter, rescuers first assess escalation risk, fuel leakage, rotors and other moving parts, hot surfaces, and escape routes. Protected approaches and information supplied by the pilot or aircrew are important in casualty rescue. Pulling an injured person without assessment may aggravate fractures or spinal injury, although an immediate life-threatening hazard may require urgent rescue. Training identifies the locations and authorised use of the ship's firefighting and rescue equipment, stretchers, cutting tools, and first-aid supplies. Operators must not attempt model-independent manipulation of unfamiliar aircraft-specific locks or escape attachments."}]},{"id":"HELI-C16","family":"helicopter","title_tr":"Gövde, güverte, üstyapı ve tesislerin ikincil güvenliği","title_en":"Secondary safety of hull, deck, superstructure and installations","paragraphs":[{"tr":"Helikopter operasyonu yalnız uçuş sahasındaki personeli etkilemez. Rotor akımı çevre tesislere, antenlere, açık kapaklara ve denizdeki küçük teknelere etki edebilir. Kaza/çarpışma sonrasında güvertenin taşıyıcı yapısı, yakıt ve hidrolik hatları, elektrik tesisatı, geminin yangın bölmeleri ve tahliye yolları ayrıca değerlendirilir. Kurtarma veya yangın müdahalesi, geminin kendi su alma, kirlilik, yangın ve personel tahliye planlarıyla çakışmamalıdır. Operasyon sırasında belirlenen emniyetli alan ve korunaklı yangın ekibi bekleme yeri, olaya göre değiştirilir. Sert iniş ya da darbe sonrası platformun hizmete dönüşü teknik inceleme ve yetkili onay gerektirebilir.","en":"Helicopter operations affect more than the personnel in the immediate flight area. Rotor downwash can influence neighbouring installations, antennas, open hatches, and small craft on the water. Following a hard landing or impact, assess deck structural strength, fuel and hydraulic lines, electrical installations, the ship's fire boundaries, and escape routes. Rescue and firefighting must not conflict with the ship's own flooding, pollution, fire, or personnel-evacuation arrangements. Designated safe areas and the protected standby position for the firefighting team may need to change with circumstances. Returning a platform to service after a hard landing or impact may require technical examination and competent approval."}]},{"id":"HELI-C17","family":"helicopter","title_tr":"Eğitim/talim sınırı ve gerçek uçuşun değerlendirilmesi","title_en":"Exercise limitations and assessment of real flight operations","paragraphs":[{"tr":"Eğitim salonunda senaryo tartışması, personel ve donanımın yerinde gösterilmesi, telsiz denemesi, boş alanda koordinasyon ve gerçek helikopterle iniş/vinç icrası farklı uygulama düzeyleridir. Tatbikatta helikopter uçması şart değildir; ancak fiilî uçuşun denenmemesi, uçuş yeterliğinin doğrulandığı anlamına da gelmez. Saha üzerinde gerçek köpük boşaltımı, uçak motorunun çalıştırılması, rotor yakınında çalışma, kazazede indirip kaldırma veya kurtarma botu indirme gibi adımlar sadece kapsamı onaylanan plan ve risk değerlendirmesi kapsamında yapılır. Eğitim metni, yapılan ve yalnızca anlatılan hususları kayıtta ayrıştırır. Bu ayrım rapor örneklerinin diline de korunarak yansıtılır.","en":"Classroom scenario discussion, on-site demonstration of personnel and equipment, radio tests, coordination in a clear area, and actual helicopter landing or winching are different levels of activity. A helicopter need not fly during a drill; equally, the absence of a flight test cannot establish operational flight capability. Actual foam discharge on the site, starting an aircraft engine, working close to a rotor, lowering or lifting casualties, and launching a rescue boat occur only within an approved plan and risk assessment. The training record distinguishes what was actually performed from what was merely described. The same distinction is retained in the wording of example reports."}]},{"id":"HELI-C18","family":"helicopter","title_tr":"Bildirim, kayıtlar, debriefing ve öğrenilen dersler","title_en":"Notifications, records, debriefing and lessons learned","paragraphs":[{"tr":"Gerçek operasyonda kayıt; zaman–mevki, çağrı işaretleri/koordinasyon, hava–deniz durumu, seçilen operasyon yöntemi, kritik haberleşmeler, personel ve yük hareketleri, aksaklıklar, varsa yaralanmalar ve teknik bulguları içerir. Talimde ise alarm ve role, ekip hazırlığı, söndürme/ilk yardım araçlarının gösterimi, risk kontrolleri, eğitim verilen konular ve fiilen doğrulanan sistemler kaydedilir. Eksik ekipman veya uygunsuzluk tespit edilirse arıza/iyileştirme yolu işletilir; geçmiş tarihli doldurulmuş bir EK-V metni aynı günün gerçekleşmiş olayı olarak kopyalanmaz. Uygulama sonrası değerlendirme (debriefing), haberleşme gecikmesi, ekip konumu, saha boşluğu ve personel bilgisindeki eksikleri yeni eğitim hedeflerine dönüştürür.","en":"For an actual operation, records include time and position, call signs and coordination, weather and sea conditions, the chosen method, critical messages, movement of personnel and loads, disruptions, any injuries, and technical findings. For a drill, records cover alarms and muster, team preparation, demonstration of firefighting and first-aid equipment, risk controls, subjects taught, and systems actually verified. Where missing equipment or non-conformity is identified, the relevant defect or improvement process is initiated; a previously completed EK-V example is not copied as though it documented today's activity. The post-operation debrief turns communication delays, team-positioning deficiencies, clearance problems, and knowledge gaps into new training objectives."}]}],"version":"3.6.1","policy":"KEGM-ROLE-KANONIK-1.2","families":[{"id":"fire","title_tr":"Yangın Talimleri","title_en":"Fire Emergencies","summary_tr":"Duman/alev ihbarı, personel emniyeti, yangın mahallinin belirlenmesi ve komuta-haberleşme düzeni.","summary_en":"Report of smoke or flame; protection of personnel; identification of the fire location; and command and communications arrangements.","boundary_tr":"Gerçek yangın alarmı, söndürme sistemi, yakıt/enerji kesme ve kapalı mahale giriş işlemleri geminin onaylı talimatına ve fiilî duruma bağlıdır.","boundary_en":"Actual fire alarms, extinguishing-system activation, fuel/power isolation, and entry into enclosed compartments depend on the vessel’s approved instructions and the actual emergency.","evidence":[{"issue_id":"fire-1","code":"EYS.08.002.PR / EYS.08.011.PR","title":"A Tipi Yangın / E Tipi Yangın ile Mücadele Prosedürleri","source":"8. Bölüm Prosedürleri.pdf","pages":"1–2; 14–15","revision":"Rev.014 / 25.03.2023"},{"issue_id":"fire-2","code":"EYS.08.033.PR","title":"Yangın ve Patlama Acil Durum Prosedürü","source":"8. Bölüm Prosedürleri.pdf","pages":"56–57","revision":"Rev.014 / 25.03.2023"},{"issue_id":"fire-3","code":"EYS.08.105.FR","title":"Yangın Kontrol Listesi","source":"ISM Manuel Full Versiyon.pdf","pages":"203","revision":"Form revizyon çizelgesinde 014"}]},{"id":"abandon","title_tr":"Gemiyi Terk","title_en":"Abandon Ship","summary_tr":"Kaptanın terk kararı, role yerleri, personel sayımı, can kurtarma donanımı ve haberleşme.","summary_en":"The master’s decision to abandon ship; muster stations; personnel accountability; life-saving appliances; and emergency communications.","boundary_tr":"Can filikası ile kurtarma/hizmet botu ayrı araçlardır; NENE HATUN için filika varlığı varsayılmaz. Gerçek tehlike yayını talimde yapılmaz.","boundary_en":"Lifeboats, rescue boats and service boats are different types of craft. A lifeboat must not be assumed to be fitted aboard NENE HATUN. No genuine distress transmission is made during a drill.","evidence":[{"issue_id":"AB-001","code":"EYS.08.012.PR","title":"Gemiyi Terk Acil Durum Prosedürü","source":"8. Bölüm Prosedürleri.pdf","pages":"16–17","revision":"Rev.014 / 25.03.2023"},{"issue_id":"AB-002","code":"EYS.08.103.FR","title":"Gemiyi Terk Kontrol Listesi Formu","source":"ISM Manuel Full Versiyon.pdf","pages":"203","revision":"Form revizyon çizelgesinde 014"}]},{"id":"steering","title_tr":"Acil Dümen","title_en":"Emergency Steering","summary_tr":"Dümen kumanda arızasının tanınması, köprüüstü–dümen dairesi haberleşmesi ve alternatif kumanda.","summary_en":"Identification of steering-control failure, bridge-to-steering-gear-room communications, and alternative steering control.","boundary_tr":"Yerel kumanda, sistem geçişleri, enerji ve manevra geminin onaylı teknik şemasına göre uygulanır; talim gerçek arıza veya seyir riski oluşturmamalıdır.","boundary_en":"Local control, control-mode transfer, power supplies, and manoeuvring must follow the vessel’s approved technical diagrams and procedures. A drill must not create a real failure or navigational hazard.","evidence":[{"issue_id":"ST-Q1","code":"EYS.08.010.PR","title":"Dümen Arızası Acil Durum Prosedürü","source":"8. Bölüm Prosedürleri.pdf","pages":"12–13","revision":""},{"issue_id":"ST-Q2","code":"EYS.08.109.FR","title":"Dümen Arızası Kontrol Listesi","source":"ISM Manuel Full Versiyon.pdf","pages":"203","revision":""},{"issue_id":"ST-Q3","code":"EYS.08.010.PR","title":"Dümen arızasında donanım tanımı ve manevra","source":"8. Bölüm Prosedürleri.pdf","pages":"12–13","revision":""},{"issue_id":"ST-Q4","code":"EYS.08.010.PR","title":"Dümen arızasında seyir emniyeti","source":"8. Bölüm Prosedürleri.pdf","pages":"12–13","revision":""}]},{"id":"damage","title_tr":"Karaya Oturma ve Su Alma","title_en":"Grounding and Flooding","summary_tr":"Karaya oturma ve su alma için hasar sınırı, su geçirmez bütünlük, stabilite ve kirlilik etkilerinin değerlendirilmesi.","summary_en":"Assessment of damage boundaries, watertight integrity, stability, and pollution consequences following grounding or flooding.","boundary_tr":"Pompalama, ballast aktarımı ve yeniden yüzdürme kararları gemiye özgü hasar stabilitesi verileri ve yetkili karar olmadan genelleştirilemez.","boundary_en":"Pumping, ballast transfer, and refloating decisions cannot be generalised without vessel-specific damage-stability information and decisions by authorised personnel.","evidence":[]},{"id":"mob_sar","title_tr":"Denize Adam Düştü / SAR","title_en":"Man Overboard / Search and Rescue","summary_tr":"İlk MOB ihbarı, kazazede ile temasın sürdürülmesi, arama koordinasyonu ve emniyetli geri alma.","summary_en":"Initial man-overboard report; maintaining contact with the casualty; search coordination; and safe recovery aboard.","boundary_tr":"Manevra ve kurtarma donanımı seçimi olay, deniz durumu ve gemi kabiliyetine bağlıdır; SAR sonlandırma kararı ilgili koordinasyon yetkisindedir.","boundary_en":"Manoeuvre selection and recovery equipment depend on the incident, sea conditions, and vessel capability. Decisions to terminate SAR activities remain with the relevant coordinating authority.","evidence":[{"issue_id":"MS-Q01","code":"EYS.08.107.FR / EYS.08.108.FR / EYS.08.117.FR","title":"SAR, MOB ve Kurtarma Yardım kontrol listeleri","source":"ISM Manuel Full Versiyon.pdf","pages":"203","revision":""},{"issue_id":"MS-Q03","code":"EYS.08.030.PR","title":"MOB (Man Over Board) Prosedürü","source":"8. Bölüm Prosedürleri.pdf","pages":"51–52","revision":""},{"issue_id":"MS-Q04","code":"EYS.08.030.PR","title":"Denizden kazazede alma ve tıbbi risk","source":"8. Bölüm Prosedürleri.pdf","pages":"51–52","revision":""},{"issue_id":"MS-Q05","code":"EYS.08.030.PR / EYS.08.108.FR","title":"MOB müdahalesi ve raporlama","source":"8. Bölüm Prosedürleri.pdf;ISM Manuel Full Versiyon.pdf","pages":"51–52; 203","revision":""},{"issue_id":"MS-Q02","code":"EYS.08.005.PR / EYS.07.016.PR","title":"Arama Kurtarma Acil Durum / Gemi Operasyonu Prosedürü","source":"8. Bölüm Prosedürleri.pdf;ISM Manuel Full Versiyon.pdf","pages":"5–6; 2","revision":""}]},{"id":"pollution","title_tr":"Deniz Kirliliği","title_en":"Marine Pollution","summary_tr":"Denize kirletici madde yayılımının fark edilmesi, kaynağın güvenli sınırlandırılması ve bildirim zinciri.","summary_en":"Detection of a release of pollutants into the sea, safe containment of its source, and the reporting chain.","boundary_tr":"SOPEP/SMPEP bütün gemilerde birlikte var sayılmaz; yürürlükteki gemi planı, bildirim yetkisi ve kirlilik kayıtları doğrulanmalıdır.","boundary_en":"SOPEP and SMPEP must not be assumed to be held together on every vessel. The vessel’s applicable approved plan, reporting authority, and pollution records must be verified.","evidence":[{"issue_id":"source-8.07","code":"8.07","title":"Deniz Kirliliği — eğitim konusu (kontrollü prosedür kodu değil)","source":"Acil Role Talimleri.pdf","pages":"PDF s. 12","revision":"Tarihsel eğitim kaynağı; ERP güncelliği teyitsiz"}]},{"id":"lifeboat","title_tr":"Filika İndirme / Manevra","title_en":"Lifeboat Launching and Manoeuvring","summary_tr":"Filika indirme, manevra ve geri alma işlemlerindeki görev, tertibat ve emniyet risklerinin eğitsel incelenmesi.","summary_en":"Educational review of responsibilities, launching arrangements, manoeuvring, recovery, and associated safety hazards.","boundary_tr":"Bu eğitim ailesi bütün gemilere otomatik uygulanmaz. Fiilî can filikası envanteri ve indirme tertibatı doğrulanmadan icra önerisi verilmez.","boundary_en":"This training family does not automatically apply to every vessel. Do not propose actual operations without verifying the lifeboat inventory and launching arrangements on the vessel concerned.","evidence":[]},{"id":"boats","title_tr":"Kurtarma ve Hizmet Botları","title_en":"Rescue and Service Boats","summary_tr":"Kurtarma ve hizmet botlarının görev farkları, indirme, personel güvenliği, manevra ve geri alma.","summary_en":"Different missions of rescue and service boats; launching; crew safety; manoeuvring; and recovery.","boundary_tr":"Kurtarma botu sertifikasyon ve kullanım sınırları hizmet botuyla aynı kabul edilmez; matafora/kanca işlemleri üretici prosedürüyle yapılır.","boundary_en":"The certification and operating limits of a rescue boat are not equivalent to those of a service boat. Davit and hook operations must follow the relevant manufacturer’s approved instructions.","evidence":[{"issue_id":"BO-Q05","code":"EYS.09.124.FR","title":"Kurtarma botunun suya indirilmesi / personel ile manevra risk değerlendirmesi (proje kaydındaki konu)","source":"ISM Manuel Full Versiyon.pdf","pages":"204","revision":"Form revizyon çizelgesinde 001"}]},{"id":"confined","title_tr":"Kapalı Mahal Giriş / Kurtarma","title_en":"Enclosed-Space Entry and Rescue","summary_tr":"Kapalı mahale giriş izni, atmosfer ölçümü, gözcü, izolasyon, kurtarma organizasyonu.","summary_en":"Enclosed-space entry permits; atmospheric testing; standby personnel; isolation; and rescue arrangements.","boundary_tr":"Oksijenle havalandırma yapılmaz; tehlikeli mahale plansız kurtarma girişi yapılmaz. Gerçek giriş ancak onaylı izin ve ekipman koşullarında değerlendirilir.","boundary_en":"Never ventilate an enclosed space with oxygen. Never make an unplanned rescue entry into a hazardous space. Actual entry requires the applicable approved permit and equipment safeguards.","evidence":[{"issue_id":"C-01","code":"EYS.07.017.PR / EYS.08.103.PL","title":"Kapalı Mahallere Giriş Prosedürü ve Acil Durum Planı","source":"ISM Manuel Full Versiyon.pdf","pages":"66–68; 295–296","revision":""},{"issue_id":"C-02","code":"EYS.07.017.PR","title":"Atmosfer ölçümleri, izin ve çalışma sınırları","source":"ISM Manuel Full Versiyon.pdf","pages":"66–68","revision":""},{"issue_id":"C-03","code":"EYS.07.103.FR / EYS.09.120.FR","title":"Giriş izni ve risk değerlendirme kayıtları","source":"ISM Manuel Full Versiyon.pdf","pages":"68; 204; 226–228","revision":""},{"issue_id":"C-05","code":"EYS.08.103.PL / EYS.08.017.PR","title":"Kapalı mahalden adam kurtarma","source":"ISM Manuel Full Versiyon.pdf;8. Bölüm Prosedürleri.pdf","pages":"296; 25","revision":""},{"issue_id":"C-06","code":"EYS.08.017.PR / EYS.08.113.FR","title":"Kapalı Mahalden Adam Kurtarma Prosedürü ve kontrol listesi","source":"8. Bölüm Prosedürleri.pdf;ISM Manuel Full Versiyon.pdf","pages":"25; 203","revision":""}]},{"id":"departure","title_tr":"Acil Kalkış / İskeleden Uzaklaşma","title_en":"Emergency Departure / Leaving a Berth","summary_tr":"Acil kalkışta personel, makine, köprüüstü ve kıyı bağlantılarının koordinasyonu.","summary_en":"Coordination of personnel, machinery, the bridge, and shore connections during an emergency departure.","boundary_tr":"Liman izinleri, palamar ve gemi-kıyı bağlantıları, gerçek manevra yetkisi ve gemi hazırlığı doğrulanmadan simülasyon fiilî işlem sayılmaz.","boundary_en":"Port permissions, moorings, ship–shore connections, manoeuvring authority, and vessel readiness must be verified. A simulated departure must not be reported as an actual manoeuvre.","evidence":[]},{"id":"power","title_tr":"Karartma / Ana Makine Arızası","title_en":"Blackout / Main Engine Failure","summary_tr":"Karartma, güç kaynağı ve ana makine arızalarında emniyetli durum, arıza tespiti ve restorasyon öncelikleri.","summary_en":"Safe condition, fault identification, and restoration priorities following loss of electrical power or main-engine failure.","boundary_tr":"Gerçek jeneratör transferi, koruma reseti veya ana makine çalıştırması yetkili başmühendis ve onaylı teknik talimat kapsamındadır.","boundary_en":"Actual generator transfer, protection reset, or main-engine restart is subject to the chief engineer’s authority and the approved vessel-specific technical instructions.","evidence":[{"issue_id":"PWR-Q05","code":"EYS.08.114.FR / EYS.08.118.FR / EYS.08.121.FR","title":"Karartma / Ana Makine Arızası / Elektrik Güç Kaynağı Arızası kontrol listeleri","source":"ISM Manuel Full Versiyon.pdf","pages":"203","revision":"Her biri form revizyon çizelgesinde 014"}]},{"id":"weather_collision","title_tr":"Ağır Hava / Çatışma–Çatma","title_en":"Heavy Weather / Collision and Contact","summary_tr":"Ağır hava hazırlığı, seyir ve personel emniyeti; çatışmada hasar, su alma ve yardım değerlendirmesi.","summary_en":"Heavy-weather preparations, navigational and personnel safety; assessment of damage, flooding, and assistance after collision or contact.","boundary_tr":"Gemi stabilitesi, hava/deniz limitleri, manevra kararları ve dış bildirimler somut olayın şartlarına göre belirlenir.","boundary_en":"Stability limits, weather/sea operating limits, manoeuvring decisions, and external reports depend on the circumstances of the particular incident.","evidence":[]},{"id":"helicopter","title_tr":"Helikopter / Gemi Operasyonları","title_en":"Helicopter / Ship Operations","summary_tr":"Helikopter güverte/yaklaşma, vinçli tahliye, saha acil durumu ve denize zorunlu iniş/SAR koordinasyonu.","summary_en":"Helicopter deck and approach operations; winch evacuation; on-scene emergencies; and ditching/SAR coordination.","boundary_tr":"Helikopter varlığı, operasyonel yetki, statik elektrik, vinçli temas ve uçuş ekibi talimatları doğrulanmadan fiilî operasyon önerisi verilmez.","boundary_en":"Do not propose an actual operation without confirming available aircraft arrangements, operating authority, static-electricity precautions, winch-contact procedures, and aircrew instructions.","evidence":[]}],"flows":[{"key":"abandon/abandon","family":"abandon","flow":"abandon","title_tr":"Gemiyi Terk","title_en":"Abandon Ship","family_title_tr":"Gemiyi Terk","family_title_en":"Abandon Ship","stages":[{"step":1,"title_tr":"Acil durumun gelişimi ve gemiyi terk kararının verilmesi","title_en":"Recognize the emergency and assess abandonment","learning_tr":"Gemiyi terk, personelin kendi kendine başlatacağı bir faaliyet değil; kaptanın olayın ciddiyetini, geminin emniyetli kalma olasılığını ve mevcut tahliye seçeneklerini değerlendirerek yönettiği bir acil durum safhasıdır.","learning_en":"Abandoning ship is directed by the master, not initiated independently by crew members. The master weighs the consequences of staying aboard against leaving the vessel when uncontrolled fire, progressive flooding, stability loss, collision, grounding or another danger arises. The decision considers position, sea state, wind, nearby vessels, likely rescue response, water temperature, visibility and the usability of survival craft. The exercise develops the incident reports and information on which the master's decision depends.","exercise_tr":"Seyir ve olay koşullarını içeren varsayımsal karar tartışması","exercise_en":"Discuss a hypothetical decision on whether to abandon ship, using the navigational situation and developing incident information.","hazard_tr":"Otomatik terk kararı veya fiilî emir üretilmez.","hazard_en":"Do not generate an automatic abandon-ship decision or an actual order to abandon ship.","id":"ABANDON-S01","source_full_tr":["Gemiyi terk, personelin kendi kendine başlatacağı bir faaliyet değil; kaptanın olayın ciddiyetini, geminin emniyetli kalma olasılığını ve mevcut tahliye seçeneklerini değerlendirerek yönettiği bir acil durum safhasıdır. Kontrol altına alınamayan yangın, ilerleyen su alma, denge kaybı, çatışma, karaya oturma veya başka bir tehlikede öncelikle gemi üzerinde kalmanın riski ile gemiden ayrılmanın riski karşılaştırılır. Geminin mevkii, denizin durumu, rüzgâr yönü, yakın gemiler, kurtarma birimlerinin ulaşma süresi, su sıcaklığı, karanlık ve mevcut can kurtarma araçlarının kullanılabilirliği kararı etkiler.","Talimde kaptana ulaşacak bilgiler senaryo sırasına göre geliştirilir: ilk ihbar, can/mal emniyeti, bölmenin durumu, müdahale başarısızlığı, personel sayısı ve yardım imkânı. Toplanma emri ile gemiyi fiilen terk emri farklıdır. Personelin güvenle toplanması, can kurtarma araçlarının hazırlanması ve ayrılmaya karar verilmesi farklı komuta safhalarıdır. Bazı olaylarda dış yardım gelene kadar gemide kalmak daha emniyetli olabilir; karar tek bir değişkene bağlanmaz.","Eğitici örnek soru: “Yangın kontrol altına alınamıyor ancak gövde emniyeti korunuyor; yakın bir kurtarma gemisi yolda. Hangi gelişme terk kararını hızlandırır, hangi tedbirlerle gemide kalma seçeneği sürdürülebilir?”"],"source_full_en":["Abandoning ship is not an action to be initiated independently by individual crew members. It is an emergency phase directed by the master after assessing the severity of the event, the likelihood that the vessel can remain safe, and the available evacuation options. In an uncontrolled fire, progressive flooding, loss of stability, collision, grounding or other threat, the risks of remaining aboard must first be weighed against those of leaving the vessel. The vessel's position, sea state, wind direction, nearby ships, estimated arrival time of rescue units, water temperature, darkness and availability of life-saving appliances all affect the decision.","During the exercise, information reaching the master is developed as the scenario progresses: the initial report, threats to life and property, compartment condition, failure of response measures, personnel numbers and assistance available. An order to muster is distinct from an order actually to abandon ship. Safe assembly of personnel, preparation of life-saving appliances and the decision to leave are separate command phases. In some situations remaining aboard until outside assistance arrives may be safer; the decision must not be reduced to a single factor.","Instructor's scenario question: 'The fire is not controlled, but hull integrity remains intact and a rescue vessel is approaching. Which developments would accelerate the decision to abandon ship, and which precautions could keep remaining aboard a safe option?'"],"source_integrity":"sha256_verified_against_embedded_blocks"},{"step":2,"title_tr":"Alarm, genel anons, role organizasyonu ve personel yoklaması","title_en":"Raise alarm, organize muster and account for personnel","learning_tr":"Personel, genel acil durum alarmının tanınmasını ve talim anonsunun gerçek olayla karışmayacak biçimde yapılmasını öğrenir. Göreve çağrı, genel alarm, yangın/terk talimi duyurusu ve kaptanın komutları rollerine göre ayrıştırılır.","learning_en":"Crew members learn to recognise the general emergency alarm and to distinguish a drill announcement clearly from a real emergency.","exercise_tr":"Eksik personel ve değişen vardiya için role senaryosu","exercise_en":"Rehearse a muster scenario involving a missing crew member and a change of watch.","hazard_tr":"Yetersiz korunan personel tehlikeli mahal aramasına gönderilmez.","hazard_en":"Do not send unprotected personnel to search a hazardous space.","id":"ABANDON-S02","source_full_tr":["Personel, genel acil durum alarmının tanınmasını ve talim anonsunun gerçek olayla karışmayacak biçimde yapılmasını öğrenir. Göreve çağrı, genel alarm, yangın/terk talimi duyurusu ve kaptanın komutları rollerine göre ayrıştırılır. Gemideki rol cetvelinden istasyon, yedek görevli, toplanma sorumlusu, kurtarma botu ekibi, sağlık personeli ve haberleşme görevlileri gösterilir.","Toplanma sırasında bütün personelin hesabı yapılır. Vardiyada kalan köprüüstü ve makine personeli, farklı mahallerde çalışanlar, yaralı/yardıma muhtaç kişi ve ulaşılmayan bir personel için özel senaryo kurulur. Personelin uygun giysi ve ayakkabı ile gelmesi, soğuktan korunma, hareket güzergâhının açıklığı ve panik kontrolü anlatılır. Sayım sonucu kaptana açık, kısa ve yeniden doğrulanabilir bir formatta rapor edilir.","Eğitici örnek: “Toplanma yerinde bir kişi eksik görünürse kimden son görüldüğü bilgisi alınır; tehlikeli mahale izinsiz geri girilmeden kayıp kişi nasıl değerlendirilir?”"],"source_full_en":["Crew members learn to recognise the general emergency alarm and to distinguish a drill announcement clearly from a real emergency. A call to duties, the general alarm, announcements for fire or abandon-ship drills and the master's orders are differentiated according to their purpose. The muster list is used to identify stations, alternates, the person responsible for accounting, the rescue-boat crew, medical personnel and communications personnel.","All persons must be accounted for at muster. Separate scenarios address bridge and engine-room watchkeepers who remain on duty, personnel working in other spaces, an injured or dependent person, and a person who cannot be contacted. Appropriate clothing and footwear, protection against cold, unobstructed access routes and avoidance of panic are explained. The headcount is reported to the master in a clear, concise and independently verifiable form.","Instructor's scenario question: 'If one person appears missing at muster, who should be asked where they were last seen, and how can the missing-person situation be assessed without unauthorised re-entry into a dangerous space?'"],"source_integrity":"sha256_verified_against_embedded_blocks"},{"step":3,"title_tr":"Kişisel can kurtarma donanımları","title_en":"Check personal life-saving appliances","learning_tr":"Can yeleği kişinin suda yüzdürülmesi ve hava yolunun açık tutulmasına yardımcı olan bir can kurtarma aracıdır. Donanımın boy/beden uygunluğu, üreticinin giyme işaretleri, bağların kapatılması ve sıkılması, varsa bacak kayışı…","learning_en":"A lifejacket helps keep a person afloat with the airway clear. Crew practise selecting the correct size, following the manufacturer's donning markings, adjusting straps and any crotch strap, and identifying whistle, light, reflective material and stowage location. Buddy checks assess correct fit without restricting breathing. Immersion suits are introduced as protection against heat loss in cold water, including sizing, closure, hood, gloves and integrity checks. Donning is practised safely, without treating an unverified fitting as approved for use.","exercise_tr":"Gerçek donanımın etiketi üzerinde model uyum ve doğru giyme gösterimi","exercise_en":"Demonstrate correct donning and model identification using the labels on the actual personal life-saving appliances.","hazard_tr":"Model bilinmeden ortak kullanım ve giyme sırası kesinleştirilmez.","hazard_en":"Do not prescribe a universal donning sequence without establishing the equipment model.","id":"ABANDON-S03","source_full_tr":["Can yeleği kişinin suda yüzdürülmesi ve hava yolunun açık tutulmasına yardımcı olan bir can kurtarma aracıdır. Donanımın boy/beden uygunluğu, üreticinin giyme işaretleri, bağların kapatılması ve sıkılması, varsa bacak kayışı, düdük, ışık, reflektif alanlar ve depolandığı yer personel üzerinde gösterilir. Can yeleği gevşek bırakılmaz; aynı zamanda solunumu engelleyecek biçimde aşırı sıkılmaz. Bir başkasının yeleğinin doğru giyildiği eşli kontrolle değerlendirilir.","Dalma giysisi (immersion suit) soğuk suya maruziyette ısı kaybını azaltmak için tasarlanır. Uygun beden seçilir; fermuar, yüz çevresi, eldiven, başlık ve bütünlük kontrol edilir. Kullanıcı emniyetli zeminde oturarak ayak–gövde–kol–başlık sırasıyla giyer; fermuarı ve kapakçıkları üretici şemasına göre kapatır. Bazı giysiler can yeleğiyle birlikte kullanılmak zorundadır; bazılarının yüzdürme özelliği farklıdır. Giysi üzerinde açıkça belirtilen model talimatı belirleyicidir. LSA Code'daki iki dakika içinde giyilebilme koşulu bir tasarım/performans kıstasıdır; talimde tehlikeli bir hız yarışına dönüştürülmez.","Isıl koruyucu yardım malzemesi (thermal protective aid/TPA), dalma giysisinden farklıdır. Genellikle can kurtarma aracına alındıktan sonra ısı kaybını azaltmak için kullanılan bir korunma malzemesidir; can yeleği veya dalma giysisinin doğrudan ikamesi sayılmaz. Hangi malzemenin, kim tarafından ve ne zaman kullanılacağı ayrı anlatılır."],"source_full_en":["A lifejacket is a life-saving appliance designed to support a person afloat and help keep the airway clear. Suitable size, the manufacturer's donning markings, fastening and adjustment of straps, any crotch strap, whistle, light, retroreflective areas and storage location are demonstrated on a wearer. The lifejacket must not be left loose, nor tightened to the point of restricting breathing. Correct donning by another person is assessed using a buddy check.","An immersion suit is designed to reduce heat loss during exposure to cold water. The correct size is selected, and the zip, face seal, gloves, hood and integrity are checked. On a stable surface, the wearer dons the suit in the sequence feet, torso, arms and hood, and closes the zip and flaps according to the manufacturer's diagram. Some suits must be used with a lifejacket; buoyancy characteristics differ between models. The instructions marked on the particular suit are decisive. The two-minute donning performance criterion in the LSA Code is a design/performance requirement and must not be turned into an unsafe speed competition during a drill.","A thermal protective aid (TPA) differs from an immersion suit. It is generally a protective item used after boarding a survival craft to reduce heat loss; it must not be treated as a direct substitute for a lifejacket or immersion suit. The appropriate item, intended user and circumstances of use are explained separately."],"source_integrity":"sha256_verified_against_embedded_blocks"},{"step":4,"title_tr":"Şişirilebilir can salının tanıtılması, yapısı ve tahliye hazırlığı","title_en":"Familiarize crew with liferafts and embarkation","learning_tr":"Can salının üzerindeki kapasite, tip, konteyner kimliği, bakım/servis durumu ve yerleşim noktası tanıtılır. Personel; bağlama tertibatı, painter (salın bağlantı/şişirme halatı), hidrostatik serbest bırakma tertibatı (HRU) ve…","learning_en":"The liferaft's marked capacity, type, container identification, servicing status and stowage position are introduced.","exercise_tr":"Konteyner/HRU/painter üzerinde yerinde tanıtım ve can salı planı incelemesi","exercise_en":"Identify the liferaft container, hydrostatic release unit (HRU) and painter in situ, and review the liferaft arrangement plan.","hazard_tr":"Can salı eğitim uğruna açılmaz; bağlantılar keyfî çözülmez.","hazard_en":"Do not deploy a liferaft merely for demonstration or release its securing arrangements arbitrarily.","id":"ABANDON-S04","source_full_tr":["Can salının üzerindeki kapasite, tip, konteyner kimliği, bakım/servis durumu ve yerleşim noktası tanıtılır. Personel; bağlama tertibatı, painter (salın bağlantı/şişirme halatı), hidrostatik serbest bırakma tertibatı (HRU) ve gerektiğinde kullanılan weak link (kopma bağı) kavramlarını ayırt eder. Bunların farklı görevleri ve yanlış bağlantı durumunda salın gemiyle birlikte sürüklenme veya gereken şekilde çalışmama riski değerlendirilir. Bu parçalar eğitim amacıyla yerinden sökülmez, yeniden bağlanmaz veya kullanılır hâle getirilerek tüketilmez; gerçek hazırlık, yetkili bakım ve üretici prosedürüne tabidir.","Salın denize bırakılması ve şişirilmesinin teorik sırası, gemideki gerçek tipin şeması üzerinden gösterilir. Can salı içindeki giriş alanı, biniş yardımı, tutamak, merdiven, çadır/koruyucu örtü, yüzdürücü hacim, deniz demiri, su tahliye araçları, el pompası, kürek, onarım malzemesi, ışık, işaret ve temel yaşam donanımının işlevleri açıklanır. Gerçek ekipman paketi, salın sınıf ve tipine göre değişir; bütün sayılan malzemelerin gemideki her salda mevcut olduğu varsayılmaz.","Personel mümkün olduğunda suya girmeden, emniyetli biniş noktasından sala erişmeyi hedefler. Suda kalma zorunluluğu, yüksek borda, dalga, rüzgâr altı/üstü ve yorgun kazazedeye yardım gibi alternatifler ayrı senaryo olarak ele alınır. Eğitim, canlı can salının gereksiz yere şişirilmesini veya düşürülmesini gerektirmez."],"source_full_en":["The liferaft's marked capacity, type, container identification, servicing status and stowage position are introduced. Crew members distinguish the securing arrangement, painter (the raft's securing/inflation line), hydrostatic release unit (HRU) and, where applicable, weak link. Their different functions and the risks of incorrect connections—including failure to deploy correctly or being dragged down with the ship—are considered. These fittings are not dismantled, reconnected or consumed for instructional purposes; actual preparation must follow authorised maintenance and manufacturer procedures.","The theoretical sequence for launching and inflating the liferaft is demonstrated using the diagram for the actual type installed aboard. The functions of the entrance, boarding aids, handholds, ladder, canopy, buoyancy chambers, sea anchor, bailers, hand pump, paddles, repair materials, lights, signals and basic survival equipment are explained. The actual equipment pack depends on the class and type of raft: no assumption is made that every listed item is carried in every raft aboard.","Wherever practicable, personnel should aim to board from a safe embarkation position without entering the water. Alternatives involving unavoidable immersion, a high freeboard, sea and wind conditions, or assisting an exhausted survivor are considered as separate scenarios. Training does not require unnecessary inflation or release of a serviceable liferaft."],"source_integrity":"sha256_verified_against_embedded_blocks"},{"step":5,"title_tr":"Can kurtarma haberleşmesi, işaretler ve konumun belirlenmesi","title_en":"Review distress communications and position reporting","learning_tr":"VHF/GMDSS: Gemi istasyonu ve taşınabilir can kurtarma VHF cihazlarının görevleri açıklanır. Tehlike çağrısının ve takibindeki sesli mesajın kimin yetkisiyle yapılacağı, gemi adı/mevkii, tehlikenin niteliği, gemideki kişi sayısı…","learning_en":"Explain the roles of the ship's VHF/GMDSS station and portable survival-craft radios. Practise the information needed for an authorised distress alert and voice message: vessel identity and position, nature of distress, persons aboard and assistance required. Do not transmit a live distress alert during the drill. Introduce EPIRB stowage, registration and approved self-test, together with locating devices and distress signals. Distinguish familiarisation and approved test modes from real activation throughout the exercise.","exercise_tr":"Cihazların durum/etiket tanıtımı ve kurgusal haberleşme örneği","exercise_en":"Demonstrate device labels and status indicators and work through a fictional emergency communications exchange.","hazard_tr":"Gerçek DSC, EPIRB veya piroteknik alarmı tetiklenmez.","hazard_en":"Do not activate a real DSC distress alert, EPIRB or pyrotechnic signal.","id":"ABANDON-S05","source_full_tr":["VHF/GMDSS: Gemi istasyonu ve taşınabilir can kurtarma VHF cihazlarının görevleri açıklanır. Tehlike çağrısının ve takibindeki sesli mesajın kimin yetkisiyle yapılacağı, gemi adı/mevkii, tehlikenin niteliği, gemideki kişi sayısı ve gereken yardım türü gibi bilgi unsurları senaryoda çalışılır. Gerçek DSC veya sesli tehlike çağrısı, talim mesajı olarak yayınlanmaz. Eğitimde senaryo kâğıdı, rol paylaşımı, uygun eğitim prosedürü ve cihazın onaylı test işlevi kullanılabilir.","EPIRB, etkinleştirildiğinde uydu tabanlı arama-kurtarma alarm zincirine katkı sağlayan cihazdır. Braketi/yuvası, kayıt ve bakım etiketi, gerekliyse otomatik salıverme tertibatı ve üreticinin self-test usulü tanıtılır. EPIRB'nin gerçek alarm modunda çalıştırılması normal bir eğitim testi değildir. Testin sıklığı ve yöntemi üretici el kitabındaki sınırlara uygun olmalıdır.","Radar SART ve AIS-SART, kurtarma birimlerinin kazazedeleri yerelleştirmesine yardımcı olan farklı cihaz aileleridir; radar yanıtı ile AIS tabanlı yayın aynı mekanizma değildir. Personelin anten/yükseltme yeri, aktivasyon yöntemi ve varsa test fonksiyonu, gemide mevcut cihazın tipine göre anlatılır.","İşaretler: El maytabı, paraşütlü işaret fişeği, duman kandili, Aldis/projektör, düdük, dümen ve bayrak işaretlerinin amaçları ayırt edilir. Pirotekniklerin gösterimi inert eğitim modeli veya görsel malzemeyle yapılır; yetkili prosedür ve izin olmadan gerçek fişek kullanılmaz."],"source_full_en":["VHF/GMDSS: The purposes of the ship's radio station and portable survival-craft VHF radios are explained. The exercise covers who is authorised to initiate a distress alert and associated voice message, together with the information required: ship's name and position, nature of distress, number of persons aboard and assistance requested. No real DSC or voice distress alert is transmitted as a drill message. Scenario cards, assigned roles, an approved training procedure and an authorised device test function may be used instead.","An EPIRB, when activated, contributes to the satellite-based search-and-rescue alerting chain. Its bracket or housing, registration and service labels, any automatic release arrangement and the manufacturer's self-test procedure are introduced. Activating the EPIRB in its real distress mode is not a routine training test. Self-test frequency and method must comply with the device manufacturer's instructions.","Radar SART and AIS-SART are different device types that assist rescue units in locating survivors; radar response and AIS-based transmission do not use the same mechanism. Antenna/elevated placement, activation procedure and any test function are explained according to the actual equipment carried aboard.","Signals: The functions of handheld flares, rocket parachute flares, smoke signals, Aldis/signalling lamps, whistles, steering-related signals and flags are differentiated. Pyrotechnics are demonstrated with inert training models or visual material; no live flare is used without the authorised procedure and permission."],"source_integrity":"sha256_verified_against_embedded_blocks"},{"step":6,"title_tr":"Can filikası, kurtarma botu ve hizmet botu; indirme kararının verilmesi","title_en":"Distinguish lifeboats, rescue boats and service boats","learning_tr":"Can salı, can filikası (lifeboat), kurtarma botu (rescue boat) ve hizmet botu (service/work boat) ayrı görev ve sertifikasyon kavramlarıdır. Geminin kurtarma botunun bulunması, ayrıca bir can filikasının bulunduğu anlamına gelmez.","learning_en":"Inflatable liferafts, lifeboats, rescue boats and service/work boats have distinct purposes and certification categories. A vessel carrying a rescue boat does not necessarily carry a lifeboat.","exercise_tr":"Gemi envanterine göre indirme öncesi emniyet konuşması; fiziksel faaliyet ancak yetkiyle","exercise_en":"Conduct a pre-launch safety briefing based on the vessel’s actual boat inventory; carry out physical operations only when authorised.","hazard_tr":"Suya indirme/geri alma fiilen yapılmadıysa kayda öyle geçirilir.","hazard_en":"Do not report launching or recovery as completed if no such physical operation took place.","id":"ABANDON-S06","source_full_tr":["Can salı, can filikası (lifeboat), kurtarma botu (rescue boat) ve hizmet botu (service/work boat) ayrı görev ve sertifikasyon kavramlarıdır. Geminin kurtarma botunun bulunması, ayrıca bir can filikasının bulunduğu anlamına gelmez. Bir botun gemiyi terk veya kurtarma görevindeki kullanımı, gerçek donanımın onay ve kullanım sınırlarına göre belirlenir.","NENE HATUN iç çalışma profili: 2026 gemi donanım belgelerinde can filikası yoktur; kurtarma botu ve hizmet botu ayrıdır. Bu bilgi geminin resmî envanterinde güncellik yönünden doğrulanarak uygulama profilinde kullanılabilir; genel HTML'de kurumsal sertifika veya ayrıntılı kapasite tabloları yayımlanmaz.","Gerçek suya indirme faaliyeti planlanıyorsa ayrı işe özgü risk değerlendirmesi yapılır ve izinli/sorumlu personel belirlenir. Hava-deniz durumu, geminin hızı ve konumu, indirme tertibatının emniyeti, insan taşıma yetkisi, vinç/davit, askı sistemleri, haberleşme, kişisel donanım, tehlikeli alanların sınırlandırılması ve botun geri alınabilmesi ele alınır. Talim sırasında botun yanlış yüklenmesi, emniyet tertibatlarının gelişi güzel işletilmesi veya sadece senaryo gereği gerçek emniyet kritik sisteminin devreden çıkarılması kabul edilemez.","Mevzuat ayrımı: SOLAS III/19.3.4.3 can filikalarıyla, III/19.3.4.6 kurtarma botlarıyla ilgilidir. İkinci hüküm kurtarma botunun koşullar elverdiğince aylık, her durumda en az üç ayda bir suya indirilip mürettebatça manevra yaptırılmasına ilişkin genel kuralı içerir; geminin bayrak/sertifika uygulaması ayrıca doğrulanır. NENE HATUN'a can filikası indirme talimi varmış gibi atama yapılmaz. Kurtarma botunun suya indirilmesine yönelik EYS.09.124.FR risk formu, gemide yürürlükteyse ilgili faaliyetin hazırlığında gözden geçirilir."],"source_full_en":["Inflatable liferafts, lifeboats, rescue boats and service/work boats have distinct purposes and certification categories. A vessel carrying a rescue boat does not necessarily carry a lifeboat. Whether a particular boat may be used for abandonment or recovery depends on the approval and operating limitations of the equipment actually installed.","NENE HATUN internal working profile: the vessel's 2026 equipment documents show no lifeboat; the rescue craft and service craft are distinct. This information may be used in the vessel profile after checking that the official inventory is current. Corporate certificates and detailed capacity tables are not published in the generic HTML.","If an actual launching operation is planned, a task-specific risk assessment is carried out and authorised/responsible personnel are designated. Weather and sea conditions, the vessel's speed and position, launching-appliance condition, certification for carrying persons, davit/crane, suspension arrangements, communications, personal protective equipment, exclusion zones and the ability to recover the boat are assessed. Incorrect loading, arbitrary operation of safety devices or disabling a safety-critical system merely to create a drill scenario is unacceptable.","Regulatory distinction: SOLAS III/19.3.4.3 addresses lifeboats, whereas III/19.3.4.6 addresses rescue boats. The latter generally calls for launching and manoeuvring with the assigned crew each month as far as reasonable and practicable, and in any case at least once every three months. Flag and certification requirements applicable to the vessel must also be confirmed. No fictional lifeboat-launching assignment is made for NENE HATUN. If EYS.09.124.FR is the current applicable risk assessment form, it is reviewed when preparing an actual rescue-boat launching activity."],"source_integrity":"sha256_verified_against_embedded_blocks"},{"step":7,"title_tr":"Can salında hayatta kalma, hipotermi, ağır hava ve alternatif kurtarma","title_en":"Survival after abandonment and alternative recovery","learning_tr":"Can salı içinde öncelik, insanların sayısının doğrulanması, yaralıların korunması, ıslaklığın ve ısı kaybının azaltılması, salın dengesinin sağlanması ve kurtarma ekiplerine bulunabilir hâle gelmektir.","learning_en":"In a liferaft, immediate priorities include confirming the number of persons, protecting injured survivors, reducing wet exposure and heat loss, maintaining raft stability and ensuring that rescuers can locate the occupants.","exercise_tr":"Sal içi görev dağılımı ve olaya göre varsayımsal karar çalışması","exercise_en":"Carry out a hypothetical exercise on survival-craft duties and decisions under changing weather and rescue conditions.","hazard_tr":"Tıbbi bakım ve helikopter uygulaması gerçek yetki/koşullara bağlıdır.","hazard_en":"Actual medical care and helicopter-related operations depend on appropriate authorisation and conditions.","id":"ABANDON-S07","source_full_tr":["Can salı içinde öncelik, insanların sayısının doğrulanması, yaralıların korunması, ıslaklığın ve ısı kaybının azaltılması, salın dengesinin sağlanması ve kurtarma ekiplerine bulunabilir hâle gelmektir. Ekip, görev dağılımı yapar; çadır/giriş açıklıkları, havalandırma, deniz demiri, su tahliyesi ve nöbet düzeni sal tipine göre tanıtılır. Su ve yiyecek kaynaklarının kayda alınması, kullanımın yönlendirilmesi ve işaret donanımının uygun zamanda kullanılması ayrı eğitim konusu oluşturur.","Hipotermi, vücudun ürettiğinden daha fazla ısı kaybetmesiyle gelişen tehlikeli durumdur. Soğuk suya girişte ilk şok, solunum kontrolünün kaybı, yüzme/iş yapma becerisinin bozulması ve uzun süreli ısı kaybı birbirinden ayrılır. İlk yardım öğretiminde mümkünse kişinin sudan çıkarılması, rüzgârdan korunması, uygun örtü ve kuru yalıtım sağlanması, bilinç ve solunumun izlenmesi ve tıbbi yardım çağrılması vurgulanır. Bilinci bozuk kişiye ağızdan içecek verilmez; müdahale güncel tıbbi ilk yardım eğitimine göre yürütülür.","Kötü hava, gece ve görüş kaybı; sal seçimi, gemiden ayrılma yönü, biniş, yaralı taşıma, bot manevrası ve arama-kurtarma birimleriyle temas üzerinde etkili olur. Alternatifler arasında başka geminin yardımı, kurtarma botuyla transfer ve yetkili kurtarma ekiplerinin helikopterle tahliyesi bulunabilir. Helikopterin kapasite, menzil ve güvenli yaklaşma durumu cihaz ve olay özelinde değişir; arşivdeki genel sayısal menzil örnekleri güncel, evrensel bilgi gibi kullanılmaz."],"source_full_en":["In a liferaft, immediate priorities include confirming the number of persons, protecting injured survivors, reducing wet exposure and heat loss, maintaining raft stability and ensuring that rescuers can locate the occupants. Duties are assigned. Canopy/entrance openings, ventilation, sea anchor, bailing and watchkeeping arrangements are explained according to the raft type. Recording water and food stores, managing their use and deploying signalling appliances at appropriate times are separate training topics.","Hypothermia is a dangerous condition arising when the body loses heat faster than it produces it. Initial cold-water shock, loss of breathing control, deterioration in swimming or work capability and longer-term cooling are distinguished. First-aid instruction emphasises recovering the person from the water when possible, shielding them from wind, providing appropriate covering and dry insulation, monitoring consciousness and breathing, and seeking medical assistance. Nothing is given orally to an unconscious or impaired-consciousness casualty. Treatment follows current medical first-aid training.","Heavy weather, darkness and loss of visibility affect the choice of survival craft, the direction of departure from the ship, embarkation, casualty transfer, boat manoeuvring and communication with search-and-rescue units. Possible alternatives include assistance from another ship, transfer by rescue boat and helicopter evacuation by authorised rescue teams. Helicopter capacity, range and safe approach conditions are specific to the equipment and circumstances; general historical range figures must not be presented as current universal limits."],"source_integrity":"sha256_verified_against_embedded_blocks"},{"step":8,"title_tr":"Talimin tamamlanması, ekipmanların yeniden hazır duruma alınması ve kayıtlar","title_en":"Restore readiness, debrief and record","learning_tr":"Talimde kullanılan kişisel donanım, haberleşme cihazları, bot/indirme tertibatı ve güvenlik malzemeleri kullanım sonrasında kontrol edilir.","learning_en":"After the exercise, personal equipment, radios, boats/launching arrangements and safety gear used during the drill are inspected.","exercise_tr":"Yapılan, gösterilen, simüle edilen işlemleri ayrı başlıklarla örnek rapora aktarma","exercise_en":"Prepare a sample report distinguishing what was actually done, demonstrated and simulated.","hazard_tr":"Eksik/arıza için yapılmış onarım veya kontrol uydurulmaz.","hazard_en":"Do not fabricate repairs or checks when recording defects or outstanding actions.","id":"ABANDON-S08","source_full_tr":["Talimde kullanılan kişisel donanım, habe
