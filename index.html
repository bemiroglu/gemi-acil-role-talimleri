rleşme cihazları, bot/indirme tertibatı ve güvenlik malzemeleri kullanım sonrasında kontrol edilir. Islak veya kullanılmış ekipman uygun şekilde temizlenip kurutulur, bakım gerektiren malzemeler ilgili usulle ayrılır, eksiklikler kaptana ve teknik sorumlulara bildirilir. Cihaz veya bağlama donanımı gerçek görevi yerine getiremeyecek durumda bırakılmaz.","Kayıt ilkesi: Tarih, saat, gemi/mevki, talimin senaryosu, sorumlu zabit, katılan posta/personel sayısı, gerçek yapılan işlemler, yalnızca simüle edilen adımlar, can kurtarma aracı indirilmişse hangi araç olduğu ve indirme tarihi, haberleşme eğitimi, hipotermi/ağır hava eğitimi, eksiklikler ve düzeltici faaliyetler raporda açıkça ayrılır. EK-V'deki 12 Gemiyi Terk kontrol konusu ve ilgili EYS.08.103.FR kurum içi kontrol listesi referansı gözden geçirilir. EK-VI'nin güverte/makine jurnali talimatı, kurumun güncel kayıt usulüne göre uygulanır. Personel, role ve risk analizi çevrimiçi ayrıca doldurulmaz."],"source_full_en":["After the exercise, personal equipment, radios, boats/launching arrangements and safety gear used during the drill are inspected. Wet or used equipment is cleaned and dried appropriately; items requiring maintenance are segregated under the relevant procedure, and defects are reported to the master and responsible technical personnel. Communications devices or securing arrangements must not be left unfit for their actual emergency function.","Recording principle: The report separately identifies the date, time, vessel/position, scenario, responsible officer, watch or personnel numbers, actions actually performed, steps only simulated, any survival craft actually launched (its identity and launching time), communications training, hypothermia/heavy-weather instruction, deficiencies and corrective actions. The twelve abandon-ship checklist topics in EK-V and the separate institutional emergency checklist EYS.08.103.FR are reviewed without conflating the two. EK-VI deck/engine logbook instructions are applied according to the organisation's current recording procedure. No duplicate online muster or risk-analysis form is completed in this application."],"source_integrity":"sha256_verified_against_embedded_blocks"}]},{"key":"fire/deck","family":"fire","flow":"deck","title_tr":"Güverte Yangını","title_en":"Deck Fire","family_title_tr":"Yangın Talimleri","family_title_en":"Fire Emergencies","stages":[{"step":1,"title_tr":"Senaryonun başlangıcı, yangının fark edilmesi ve ilk bildirim","title_en":"Recognize the fire and make the first report","learning_tr":"İlk fark eden personel, dumanın boyalık kapısı/menfezinden mi yoksa açık güvertede belirli bir ekipmandan mı geldiğini bildirir.","learning_en":"The first person noticing the incident reports whether smoke is emerging from the paint locker's door or vent, or from a particular item of equipment on the open deck.","exercise_tr":"Boyalık ve açık güverteyi yangın planında karşılaştırın; personelden dumanın tam konumunu içeren bir ilk ihbarı senaryo olarak aktarmasını isteyin.","exercise_en":"Compare the paint store and open deck on the fire plan; have the trainee make a simulated first report identifying the exact source of smoke.","hazard_tr":"Solvent buharının tutuşması, kıvılcım kaynakları ve boyalık kapağının kontrolsüz açılması.","hazard_en":"Ignition of solvent vapours, sparks and uncontrolled opening of the paint-store door.","id":"fire-deck-1","source_full_tr":["İlk fark eden personel, dumanın boyalık kapısı/menfezinden mi yoksa açık güvertede belirli bir ekipmandan mı geldiğini bildirir. Alandaki boya, tiner, solventli temizlik malzemesi, aerosol kutu ve varsa basınçlı gaz tehlikesi değerlendirilir. Yanıcı buharın görünür alev çıkmadan önce bile tehlikeli olabileceği, elektrik ve mekanik kıvılcım kaynaklarının buhar–hava karışımıyla ilişkisi öğretilir. Tehlikeli kapalı bölmenin kapağı kontrolsüz açılmaz; rüzgâr yönü güvenli yaklaşma kararında dikkate alınır."],"source_full_en":["The first person detecting the incident reports whether smoke is coming from the paint-locker door or vent, or from particular equipment on the open deck. Paint, thinner, solvent-based cleaning agents, aerosol cans and any pressurised gas in the area are assessed as hazards. Personnel are taught that flammable vapour can be dangerous even before flames become visible, and how electrical or mechanical ignition sources may ignite a vapour–air mixture. A hazardous enclosed compartment is not opened without control; wind direction informs the decision on a safe approach."],"source_integrity":"sha256_verified_against_embedded_blocks"},{"step":2,"title_tr":"Yangın alarmı, genel anons ve haberleşme","title_en":"Raise the alarm and establish communications","learning_tr":"Köprüüstüne mahalin adı, mevcut insan tehlikesi, görülebilen duman yoğunluğu, rüzgâr yönü ve yakın yanıcı stoklar kısa ve doğrulanabilir şekilde aktarılır. Yangın alarmı ve talim duyurusu ayrı işlevleriyle anlatılır.","learning_en":"The bridge is given brief, verifiable information about the space concerned, danger to persons, visible smoke density, wind direction and nearby flammable stocks.","exercise_tr":"Köprüüstüne mahal, personel tehlikesi, duman, rüzgâr ve yanıcı stok bilgisini içeren örnek haberleşme yaptırın; liman/seyir varyantlarını ayırın.","exercise_en":"Role-play a bridge report covering location, people at risk, smoke, wind and flammable stores; contrast alongside and underway conditions.","hazard_tr":"Talim haberleşmesinin gerçek dış yardım veya tehlike bildirimi olarak gönderilmesi.","hazard_en":"A drill communication being transmitted as a genuine external assistance request or distress report.","id":"fire-deck-2","source_full_tr":["Köprüüstüne mahalin adı, mevcut insan tehlikesi, görülebilen duman yoğunluğu, rüzgâr yönü ve yakın yanıcı stoklar kısa ve doğrulanabilir şekilde aktarılır. Yangın alarmı ve talim duyurusu ayrı işlevleriyle anlatılır. Limandaysa iskele operasyonları ve kıyı güvenlik desteğinin nasıl koordine edileceği; seyirdeyse gemi manevrasının dumanın konumu üzerindeki etkileri senaryo üzerinden değerlendirilir. Dış bildirim yalnızca gerçek olay ve yetkili talimatla yapılır."],"source_full_en":["The bridge receives a brief, verifiable report identifying the space, persons at risk, observed smoke density, wind direction and nearby combustible stores. The separate functions of the fire alarm and drill announcement are explained. The scenario considers coordination of quay operations and shore emergency support when alongside, or the effect of ship manoeuvring on smoke direction when underway. External notifications are made only for an actual incident and under authorised instructions."],"source_integrity":"sha256_verified_against_embedded_blocks"},{"step":3,"title_tr":"Role organizasyonu, yoklama ve müdahale ekipleri","title_en":"Muster crew and assign response teams","learning_tr":"Yangın müdahale, emniyet sınırı, sınır soğutma, köprüüstü haberleşmesi ve varsa kirlilik tedbir ekipleri görevlendirme cetvelindeki sorumluluklarına göre tanıtılır.","learning_en":"The responsibilities of the firefighting team, safety-perimeter personnel, boundary-cooling team, bridge communications personnel and, where applicable, pollution-response team are introduced in accordance with the muster list.","exercise_tr":"Role cetvelinden müdahale, sınır soğutma, haberleşme ve kirlilik önleme görevlerini işaretletin; örnek yoklama ve geri çekilme hattını gösterin.","exercise_en":"Use the muster list to identify firefighting, boundary cooling, communications and pollution-control roles; demonstrate a mock headcount and withdrawal route.","hazard_tr":"Boyalık yakınında sayılmamış personel ve müdahale güzergâhına izinsiz giriş.","hazard_en":"Unaccounted personnel near the paint store and unauthorized entry to the response route.","id":"fire-deck-3","source_full_tr":["Yangın müdahale, emniyet sınırı, sınır soğutma, köprüüstü haberleşmesi ve varsa kirlilik tedbir ekipleri görevlendirme cetvelindeki sorumluluklarına göre tanıtılır. Personel sayılır, yetkili zabite rapor edilir; boyalık yakınındaki bakım/personel hareketi ayrıca değerlendirilir. Giriş-çıkış noktası, geri çekilme hattı, yedek müdahale ve hortum güzergâhı belirlenir."],"source_full_en":["The fire attack team, safety perimeter team, boundary-cooling team, bridge communications personnel and any pollution prevention team are introduced according to their muster-list duties. Personnel are accounted for and reported to the responsible officer; maintenance work and personnel movement near the paint locker receive particular attention. The point of entry and exit, withdrawal route, backup team and hose route are identified."],"source_integrity":"sha256_verified_against_embedded_blocks"},{"step":4,"title_tr":"Mahale özgü tehlikeler ve koruyucu donanım","title_en":"Review location-specific hazards and protection","learning_tr":"Çözücü buharının solunması, birikmiş buharın tutuşması ve sıcak yüzey/metal yapıdan yayılan ısı ayrı risklerdir. Uygun SCBA/BA ve yangın giysisi personel üzerinde tanıtılır; EEBD müdahale amacıyla kullanılmaz.","learning_en":"Inhalation of solvent vapours, ignition of accumulated vapour and heat transfer from hot surfaces or metal structures are treated as separate risks.","exercise_tr":"SCBA ve EEBD’nin farklı amaçlarını, koruyucu giysiyi ve cihaz/mahal etiketlerinin nasıl okunacağını ekipman üzerinde gösterin.","exercise_en":"Demonstrate the distinct roles of SCBA and EEBD, protective clothing and how equipment and space labels are read.","hazard_tr":"Yanıcı buharın solunması ve patlamaya dayanımlı donanım etiketinin mutlak güvence sayılması.","hazard_en":"Inhalation of flammable vapours and treating an explosion-protection label as an unconditional safety guarantee.","id":"fire-deck-4","source_full_tr":["Çözücü buharının solunması, birikmiş buharın tutuşması ve sıcak yüzey/metal yapıdan yayılan ısı ayrı risklerdir. Uygun SCBA/BA ve yangın giysisi personel üzerinde tanıtılır; EEBD müdahale amacıyla kullanılmaz. Depolama mahallinin havalandırma/elektrik koruma özelliklerinin gemi yangın planı ve ekipman etiketlerinden kontrol edilmesi öğretilir. “Ex-proof” gibi etiketler bütün koşullarda mutlak emniyet garantisi sayılmaz."],"source_full_en":["Inhalation of solvent vapour, ignition of accumulated vapour and heat transmitted from hot surfaces or metal structures are treated as distinct risks. Suitable self-contained breathing apparatus (SCBA/BA) and firefighting clothing are demonstrated; an emergency escape breathing device (EEBD) is not used for firefighting. Crew learn to verify the storage space's ventilation and electrical protection arrangements against the ship's fire-control plan and equipment labels. An 'Ex-proof' marking is not regarded as an unconditional guarantee of safety."],"source_integrity":"sha256_verified_against_embedded_blocks"},{"step":5,"title_tr":"Bölmenin tecridi, yayılmanın önlenmesi ve sistem kararları","title_en":"Isolate the space and limit spread","learning_tr":"Boyalıkla komşu mahallerin kapı, menfez ve elektrik bağlantıları yangın kontrol planı üzerinden incelenir. Tecrit kararı verilirken uygun havalandırma, yanıcı buharın yayılma yolu, komşu mahallin faaliyeti ve enerji kesintisinin…","learning_en":"Doors, vents and electrical connections of spaces adjoining the paint locker are examined using the fire-control plan.","exercise_tr":"Yangın kontrol planında komşu mahalleri, menfezleri ve enerji bağlantılarını işaretletin; tecrit kararını masa başı senaryoyla tartışın.","exercise_en":"Identify adjacent spaces, vents and power connections on the fire plan; discuss isolation decisions in a tabletop exercise.","hazard_tr":"Uygunsuz havalandırmanın buharı yayması veya hazırlıksız enerji kesilmesinin yeni tehlike yaratması.","hazard_en":"Inappropriate ventilation spreading vapours or unplanned isolation creating another hazard.","id":"fire-deck-5","source_full_tr":["Boyalıkla komşu mahallerin kapı, menfez ve elektrik bağlantıları yangın kontrol planı üzerinden incelenir. Tecrit kararı verilirken uygun havalandırma, yanıcı buharın yayılma yolu, komşu mahallin faaliyeti ve enerji kesintisinin başka tehlike oluşturup oluşturmayacağı ele alınır. Gerçek gemide mevcutsa boyalığa özel sprinkler/su spreyi veya başka sabit sistemin işlevi, korunan hacim ve kumanda konumu açıklanır; belirli bir sistemin her gemide mevcut olduğu varsayılmaz."],"source_full_en":["Doors, vents and electrical connections between the paint locker and adjacent spaces are reviewed against the fire-control plan. Isolation decisions take account of appropriate ventilation, possible migration of flammable vapour, the operating condition of adjoining spaces and any additional danger created by power isolation. If the vessel is equipped with a paint-locker-specific sprinkler, water-spray or other fixed system, its function, protected volume and controls are explained; no particular system is assumed to be fitted on every ship."],"source_integrity":"sha256_verified_against_embedded_blocks"},{"step":6,"title_tr":"Uygun söndürme araçları, yangın suyu ve müdahale taktiği","title_en":"Select appropriate firefighting methods","learning_tr":"Yangın türüne uygun etiketli taşınabilir söndürücüler, köpük uygulanabilirliği ve uygun nozul kullanımı karşılaştırılır. Alevli yanıcı sıvının üstüne uygunsuz kuvvetli su jeti uygulanmasının yangını yayabileceği öğretilir.","learning_en":"Portable extinguishers bearing labels appropriate to the fire type, the suitability of foam and the use of suitable nozzles are compared.","exercise_tr":"Söndürücü etiketleriyle ajan uygunluğunu ve sınır soğutma farkını karşılaştırın; iki su jeti kontrolünü yalnız uygun güvenli test düzeninde açıklayın.","exercise_en":"Compare extinguisher labels, agent suitability and boundary cooling; describe the two-water-jet check only for an authorized safe test arrangement.","hazard_tr":"Yanıcı sıvıya kuvvetli su jetiyle müdahalenin yangını yayması, kaygan güverte ve kirli yangın suyu.","hazard_en":"A forceful water jet spreading burning liquid, slippery decks and contaminated firewater.","id":"fire-deck-6","source_full_tr":["Yangın türüne uygun etiketli taşınabilir söndürücüler, köpük uygulanabilirliği ve uygun nozul kullanımı karşılaştırılır. Alevli yanıcı sıvının üstüne uygunsuz kuvvetli su jeti uygulanmasının yangını yayabileceği öğretilir. Komşu perde ve güvertede sınır soğutma ile yanan solvent yüzeyine doğrudan müdahale arasındaki fark vurgulanır. Yangın pompasının iki jetli testinde güvertede kayma, su tahliyesi ve kirli suyun denize ulaşması riskleri değerlendirilir."],"source_full_en":["Portable extinguishers labelled for the relevant fire class, the suitability of foam and the use of appropriate nozzles are compared. Personnel are taught that an inappropriate high-pressure water jet directed onto burning flammable liquid can spread the fire. The distinction between boundary cooling of adjacent bulkheads and decks and direct attack on a burning solvent surface is emphasised. During a two-jet fire-pump test, risks from slippery decks, water drainage and contaminated runoff reaching the sea are assessed."],"source_integrity":"sha256_verified_against_embedded_blocks"},{"step":7,"title_tr":"Olayın gelişimi, alternatif kararlar ve dış yardımlar","title_en":"Manage developments and outside assistance","learning_tr":"Yangın boya stoklarına, basınçlı kaplara veya komşu tesisata ilerlerse tehlike sınırının büyütülmesi, gemi manevrası, liman operasyonunun durdurulması ve dış itfaiye desteği senaryo üzerinde incelenir.","learning_en":"If the fire spreads to paint stocks, pressure containers or adjacent fittings, the scenario considers extending the danger perimeter, ship manoeuvring, suspension of berth operations and assistance from external firefighters.","exercise_tr":"Boya stokuna yayılma, basınçlı kaplar ve kıyı tesisine yakınlık için kademeli bir karar senaryosu çalıştırın.","exercise_en":"Run a progressive decision exercise involving spread to paint stores, pressurized containers and proximity to shore facilities.","hazard_tr":"Basınçlı kapların ısıya maruziyeti ve kirli söndürme suyunun denize kaçması.","hazard_en":"Heat exposure of pressurized containers and escape of contaminated firefighting water to sea.","id":"fire-deck-7","source_full_tr":["Yangın boya stoklarına, basınçlı kaplara veya komşu tesisata ilerlerse tehlike sınırının büyütülmesi, gemi manevrası, liman operasyonunun durdurulması ve dış itfaiye desteği senaryo üzerinde incelenir. Limandaki bir yangının kıyı tesislerine; seyirdeki bir yangının geminin manevrasına etkileri farklıdır. Yağ/köpük/söndürücü karışımlı suyun denize akması halinde kirlilik prosedürü ile yangın müdahalesinin birlikte yönetilmesi öğretilir."],"source_full_en":["If fire spreads to paint stores, pressure vessels or neighbouring installations, the scenario examines expansion of the danger zone, ship manoeuvring, suspension of port operations and support from shore firefighters. Fire alongside may affect shore facilities, while a fire at sea may affect the ship's manoeuvrability. Where runoff containing oil, foam or extinguishing chemicals reaches the sea, personnel learn to coordinate pollution response procedures with firefighting operations."],"source_integrity":"sha256_verified_against_embedded_blocks"},{"step":8,"title_tr":"Sonlandırma, ekipmanı yeniden hazır hâle getirme ve kayıtlar","title_en":"Restore equipment, debrief and record","learning_tr":"Kapalı boyalıkta yeniden girişin ancak tehlike kontrolü, atmosfer değerlendirmesi ve izinli prosedürle yapılacağı anlatılır. Yangın hortumu, pompa, taşınabilir söndürücü ve BA donanımı kullanım sonrası kontrol edilir.","learning_en":"The lesson explains that re-entry into an enclosed paint locker requires hazards to be controlled, the atmosphere to be assessed and the applicable entry procedure to be authorised.","exercise_tr":"Talim sonrası BA, hortum, pompa ve söndürücü hazırlığını kontrol listesiyle gözden geçirin; gerçek ve simüle faaliyetleri ayrı kayıtlayın.","exercise_en":"Review BA sets, hoses, pumps and extinguisher readiness using a checklist; document performed and simulated actions separately.","hazard_tr":"Atmosferi değerlendirilmeden erken yeniden giriş ve hiç yapılmamış işlemlerin kayda geçirilmesi.","hazard_en":"Premature re-entry without an atmosphere assessment and recording actions that were not carried out.","id":"fire-deck-8","source_full_tr":["Kapalı boyalıkta yeniden girişin ancak tehlike kontrolü, atmosfer değerlendirmesi ve izinli prosedürle yapılacağı anlatılır. Yangın hortumu, pompa, taşınabilir söndürücü ve BA donanımı kullanım sonrası kontrol edilir. Raporda açık güverte mi boyalık mı, rüzgâr, yanıcı stok, tecrit/sınır soğutma, iki jet testi, fiilen yapılan işlemler ve yalnızca senaryoda değerlendirilen tedbirler ayrı ifade edilir."],"source_full_en":["Crew are taught that re-entry into an enclosed paint locker is permitted only after hazard control, atmosphere assessment and the authorised entry procedure. Fire hoses, pump, portable extinguishers and breathing apparatus are inspected after use. The report distinguishes an open-deck incident from a paint-locker incident and records wind, flammable stores, isolation and boundary cooling, the two-jet test, actual actions and measures considered only in the scenario."],"source_integrity":"sha256_verified_against_embedded_blocks"}]},{"key":"fire/accommodation","family":"fire","flow":"accommodation","title_tr":"Yaşam Mahalli Yangını","title_en":"Accommodation Fire","family_title_tr":"Yangın Talimleri","family_title_en":"Fire Emergencies","stages":[{"step":1,"title_tr":"Senaryonun başlangıcı, yangının fark edilmesi ve ilk bildirim","title_en":"Recognize the fire and make the first report","learning_tr":"Dumanın hangi kabinden, çamaşırhaneden veya koridor bölümünden geldiği belirlenir. Isıtıcı, tekstil ürünleri, çamaşır kurutma cihazları, elektrik bağlantıları ve varsa lityum iyon bataryalı cihazlar ayrı kaynak örnekleridir…","learning_en":"The location from which smoke originates is established, whether it is a particular cabin, laundry or corridor section.","exercise_tr":"Kabin, çamaşırhane ve koridor için ayrı ilk ihbar örnekleri oluşturun; ihbarda mahal ve olası içeride kalan kişi bilgisini arayın.","exercise_en":"Create separate first-report examples for a cabin, laundry and corridor, identifying location and possible occupants.","hazard_tr":"Yoğun ve toksik duman; yangın nedeninin kanıt olmadan kesinleştirilmesi.","hazard_en":"Dense toxic smoke and prematurely treating an unverified ignition cause as established fact.","id":"fire-accommodation-1","source_full_tr":["Dumanın hangi kabinden, çamaşırhaneden veya koridor bölümünden geldiği belirlenir. Isıtıcı, tekstil ürünleri, çamaşır kurutma cihazları, elektrik bağlantıları ve varsa lityum iyon bataryalı cihazlar ayrı kaynak örnekleridir; yangının kesin sebebi kanıtsız kabul edilmez. Dumanın hızla görüşü kapatabileceği ve ölümcül gazlar içerebileceği öğretilir. İlk ihbarda kabin numarası/mahal, görülen durum ve içeride kişi olasılığı aktarılır."],"source_full_en":["Identify the cabin, laundry or corridor section from which smoke is emerging. Heaters, textiles, tumble dryers, electrical connections and any lithium-ion-battery devices are considered as different possible sources; no definitive cause is asserted without evidence. Personnel are taught that smoke can rapidly obscure visibility and contain lethal gases. The initial report specifies the cabin number or location, observed conditions and the possibility that someone remains inside."],"source_integrity":"sha256_verified_against_embedded_blocks"},{"step":2,"title_tr":"Yangın alarmı, genel anons ve haberleşme","title_en":"Raise the alarm and establish communications","learning_tr":"Alarmın tanınması, talim anonsunun personeli paniğe sevk etmemesi ve köprüüstü/mahal iletişimi öğretilir. Dumanın merdiven ve koridorları kapatması halinde farklı toplanma güzergâhlarına ilişkin haberleşme seçenekleri açıklanır.","learning_en":"Personnel learn to recognise the alarm, avoid panic when a drill announcement is made, and communicate between the bridge and the affected space.","exercise_tr":"Dumanla kapanmış merdiven/koridor senaryosu üzerinden alternatif toplanma ve tahliye haberleşmesini canlandırın.","exercise_en":"Role-play alternative muster and evacuation communications when smoke blocks a stairway or corridor.","hazard_tr":"Personelin dumanlı kaçış güzergâhına yanlış yönlendirilmesi ve talim anonsundan doğan panik.","hazard_en":"Directing people onto a smoke-filled escape route and confusion caused by drill announcements.","id":"fire-accommodation-2","source_full_tr":["Alarmın tanınması, talim anonsunun personeli paniğe sevk etmemesi ve köprüüstü/mahal iletişimi öğretilir. Dumanın merdiven ve koridorları kapatması halinde farklı toplanma güzergâhlarına ilişkin haberleşme seçenekleri açıklanır. İlgili kabin sakinleri, nöbetçiler, temizlik personeli ve yan mahallerde bulunanların emniyetli tahliyesi eğitimde düşünülür."],"source_full_en":["Training covers recognition of the fire alarm, an unambiguous drill announcement that does not cause panic, and communications between the bridge and the affected space. When smoke blocks stairs and corridors, alternative muster routes and ways of communicating them are explained. The exercise considers the safe evacuation of relevant cabin occupants, watchkeepers, housekeeping personnel and people in adjoining spaces."],"source_integrity":"sha256_verified_against_embedded_blocks"},{"step":3,"title_tr":"Role organizasyonu, yoklama ve müdahale ekipleri","title_en":"Muster crew and assign response teams","learning_tr":"Toplanma istasyonundaki sayım ile yaşam mahalli kabinlerindeki kişi kontrolünün farklı olduğu anlatılır. Eksik personel senaryosu halinde son görüldüğü yer ve olası erişim durumu bildirilebilir; buna karşılık yetersiz donanımlı…","learning_en":"A muster-station headcount is different from confirming the whereabouts of people in individual accommodation cabins. When a person is reported missing, the crew report the last known location and possible access conditions. No inadequately equipped person is sent into a smoke-filled compartment. Entry/exit reporting for the response team, standby breathing-apparatus personnel and first-aid arrangements are demonstrated.","exercise_tr":"Toplanma sayımı ile kabinlerdeki kişi kontrolünü ayrı alıştırmalarla yaptırın; yedek BA ve ilk yardım görevlerini tanıtın.","exercise_en":"Practise muster headcount separately from cabin occupant checks; identify backup BA and first-aid assignments.","hazard_tr":"Eksik personeli aramak için donanımsız kişilerin dumanlı bölgeye girmesi.","hazard_en":"Sending inadequately equipped personnel into smoke-filled areas to search for a missing person.","id":"fire-accommodation-3","source_full_tr":["Toplanma istasyonundaki sayım ile yaşam mahalli kabinlerindeki kişi kontrolünün farklı olduğu anlatılır. Eksik personel senaryosu halinde son görüldüğü yer ve olası erişim durumu bildirilebilir; buna karşılık yetersiz donanımlı personel dumanlı bölmeye gönderilmez. Müdahale ve güvenlik ekiplerinin giriş/çıkış bildirimi, yedek BA ekibi ve ilk yardım organizasyonu gösterilir."],"source_full_en":["The difference between headcount at the muster station and checking whether accommodation cabins are occupied is explained. In a missing-person scenario, the last known location and accessibility can be reported, but inadequately equipped personnel must not be sent into a smoke-filled area. Entry/exit reports by the fire and safety teams, a standby breathing-apparatus team and first-aid arrangements are demonstrated."],"source_integrity":"sha256_verified_against_embedded_blocks"},{"step":4,"title_tr":"Mahale özgü tehlikeler ve koruyucu donanım","title_en":"Review location-specific hazards and protection","learning_tr":"Sentetik döşeme, perde, yatak ve tekstil yangınlarında yoğun dumanın ısı ve toksik gaz tehlikesi taşıdığı açıklanır. Kapıların gelişi güzel açılmasıyla yeni hava girişi ve sıcak gaz hareketi artabilir.","learning_en":"Fires involving synthetic upholstery, curtains, mattresses and textiles can produce dense smoke, heat and toxic gases. Opening doors indiscriminately may introduce more air and increase the movement of hot gases.","exercise_tr":"Yangın kıyafeti ve SCBA’nın görevini gösterin; kapı açılmasının duman ve sıcak gaz hareketine etkisini senaryoda açıklayın.","exercise_en":"Demonstrate the roles of firefighting clothing and SCBA; discuss how opening doors may alter smoke and hot-gas movement.","hazard_tr":"Toksik gaz, ısı ve kontrolsüz kapı açılmasıyla artabilecek hava girişi.","hazard_en":"Toxic gases, heat and increased air admission following uncontrolled door opening.","id":"fire-accommodation-4","source_full_tr":["Sentetik döşeme, perde, yatak ve tekstil yangınlarında yoğun dumanın ısı ve toksik gaz tehlikesi taşıdığı açıklanır. Kapıların gelişi güzel açılmasıyla yeni hava girişi ve sıcak gaz hareketi artabilir. Yangın giysisi, SCBA/BA, koruyucu eldiven, haberleşme ve kişisel ışık ihtiyaçları senaryoyla ilişkilendirilir. Uygun kurtarma taktiği yalnızca eğitimli ve yetkili ekipçe yürütülür."],"source_full_en":["Personnel learn that fires involving synthetic furnishings, curtains, bedding and textiles can produce dense smoke, intense heat and toxic gases. Arbitrarily opening a door may introduce fresh air and increase movement of hot gases. Firefighting clothing, SCBA/BA, protective gloves, communications and personal lighting are linked to the scenario. Rescue tactics are undertaken only by trained, authorised teams."],"source_integrity":"sha256_verified_against_embedded_blocks"},{"step":5,"title_tr":"Bölmenin tecridi, yayılmanın önlenmesi ve sistem kararları","title_en":"Isolate the space and limit spread","learning_tr":"Yangın kapıları, duman damperleri, kabin kapıları, havalandırma ve bölme sınırları yangın planı üzerinden değerlendirilir.","learning_en":"Fire doors, smoke dampers, cabin doors, ventilation systems and compartment boundaries are considered against the fire-control plan.","exercise_tr":"Yangın planında kapı, duman damperi, havalandırma ve kaçış yollarını işaretletin; enerji tecridini acil aydınlatmayla birlikte tartışın.","exercise_en":"Identify fire doors, smoke dampers, ventilation and escape routes on the fire plan; consider isolation together with emergency lighting.","hazard_tr":"Yangın bölmesini korumaya çalışırken tahliye yolunun veya acil aydınlatmanın kaybedilmesi.","hazard_en":"Compromising evacuation routes or emergency lighting while attempting to isolate a fire compartment.","id":"fire-accommodation-5","source_full_tr":["Yangın kapıları, duman damperleri, kabin kapıları, havalandırma ve bölme sınırları yangın planı üzerinden değerlendirilir. Yangın kapısının görevini görebilmesi için uygun kapalı hâlde bulunması ile kaçış yolunun açık tutulması gereklilikleri birlikte öğretilir. Dumanın koridor, merdiven boşluğu, tavan ve havalandırmadan yayılma yolları tanıtılır. Enerji tecridi kararı acil aydınlatma ve tahliye gereksinimlerini gözetir."],"source_full_en":["Fire doors, smoke dampers, cabin doors, ventilation and compartment boundaries are reviewed against the fire-control plan. Crew learn both why fire doors must be properly closed to work and why escape routes must remain passable. Routes by which smoke can spread through corridors, stairwells, ceiling spaces and ventilation are identified. Power-isolation decisions account for emergency lighting and evacuation needs."],"source_integrity":"sha256_verified_against_embedded_blocks"},{"step":6,"title_tr":"Uygun söndürme araçları, yangın suyu ve müdahale taktiği","title_en":"Select appropriate firefighting methods","learning_tr":"Katı yanıcı kaynaklarında uygun su sisi/spreyinin soğutma işlevi; elektrik devresi enerji altında olabileceğinde ayrı risk oluşturması açıklanır.","learning_en":"The cooling role of appropriate water mist or spray on solid combustibles is explained, together with the separate danger where an electrical circuit may still be energised.","exercise_tr":"Su sisi/sprey, elektrik riskleri ve iki jet kontrolünü ayrı örneklerle karşılaştırın; alt mahallerdeki su birikimi etkisini tartışın.","exercise_en":"Contrast water mist/spray, electrical hazards and the two-jet check; review water accumulation in spaces below.","hazard_tr":"Enerji altındaki devrelerle temas ve müdahale suyunun bitişik mahallere yayılması.","hazard_en":"Contact with energized circuits and migration of firefighting water into adjacent spaces.","id":"fire-accommodation-6","source_full_tr":["Katı yanıcı kaynaklarında uygun su sisi/spreyinin soğutma işlevi; elektrik devresi enerji altında olabileceğinde ayrı risk oluşturması açıklanır. Yangın pompasının iki jetli kontrolü ile dumanlı kabine fiilen su verilmesi birbirinden ayrılır. Kabin altındaki ve yanındaki mahallerde sıcaklık ve su birikimi kontrolünün önemi gösterilir. Kurtarma görevleri, yangına müdahale ve tahliye kararları koordineli ele alınır."],"source_full_en":["The cooling function of suitable water mist or spray for solid combustibles is explained, together with the separate hazard posed by electrical circuits that may remain energised. A two-jet check of the fire-pump system is distinguished from actually directing water into a smoke-filled cabin. The importance of monitoring temperature and accumulated water in spaces below or adjacent to the cabin is demonstrated. Rescue duties, fire attack and evacuation decisions are coordinated."],"source_integrity":"sha256_verified_against_embedded_blocks"},{"step":7,"title_tr":"Olayın gelişimi, alternatif kararlar ve dış yardımlar","title_en":"Manage developments and outside assistance","learning_tr":"Koridorun dumanla dolması halinde alternatif kaçış, kapalı kapı ardında kişinin bulunması, eksik kişi bilgisi, yangının çamaşırhane/servis alanına yayılması veya toplanma noktasının etkilenmesi örnek olay gelişmeleridir.","learning_en":"Possible developments include a smoke-filled corridor requiring an alternative escape route, a person behind a closed door, a missing-person report, fire spreading to a laundry or service space, or an affected muster station.","exercise_tr":"Koridor dumanı, mahsur kalma ve etkilenen toplanma noktası varyantlarında emniyetli alternatif kararları tartıştırın.","exercise_en":"Discuss safe alternative decisions for corridor smoke, a trapped occupant and an affected muster station.","hazard_tr":"Güvensiz çıkışa personel yönlendirme ve teyitsiz kayıp kişi bilgisi.","hazard_en":"Routing people through an unsafe exit and relying on unverified missing-person information.","id":"fire-accommodation-7","source_full_tr":["Koridorun dumanla dolması halinde alternatif kaçış, kapalı kapı ardında kişinin bulunması, eksik kişi bilgisi, yangının çamaşırhane/servis alanına yayılması veya toplanma noktasının etkilenmesi örnek olay gelişmeleridir. Sağlık ekipleri ve ilave yardım olanakları senaryo üzerinde değerlendirilir. Çıkış güzergâhı güvensizse personelin tehlikeli güzergâha yönlendirilmemesi temel karardır."],"source_full_en":["Scenario developments include a smoke-filled corridor, an alternative escape route, a person behind a closed door, missing-person information, spread to the laundry or service area, or a threatened muster station. Medical teams and additional assistance are considered. The fundamental decision is not to direct personnel into an unsafe escape route."],"source_integrity":"sha256_verified_against_embedded_blocks"},{"step":8,"title_tr":"Sonlandırma, ekipmanı yeniden hazır hâle getirme ve kayıtlar","title_en":"Restore equipment, debrief and record","learning_tr":"Talim sonunda yangın kapısı ve damperlerinin normal emniyetli durumuna getirildiği, kapatılmış güzergâhların kontrol edildiği, kullanılan BA ve hortumların yeniden hazırlandığı denetlenir.","learning_en":"At the end of the drill, checks confirm that fire doors and dampers are restored to their normal safe condition, any closed routes are reviewed, and breathing apparatus and hoses used during the drill are made ready again.","exercise_tr":"Yangın kapısı/damper durumu ile BA ve hortum hazırlığını kontrol ettirin; raporda fiilen yapılan testleri ayırın.","exercise_en":"Check the safe status of fire doors/dampers and readiness of BA sets and hoses; distinguish actual tests in the report.","hazard_tr":"Talim sonunda yanlış konumda bırakılmış yangın kapısı/damper ve varsayımsal işlem kaydı.","hazard_en":"Fire doors or dampers left in an unsafe position after the drill and fictitious recording of actions.","id":"fire-accommodation-8","source_full_tr":["Talim sonunda yangın kapısı ve damperlerinin normal emniyetli durumuna getirildiği, kapatılmış güzergâhların kontrol edildiği, kullanılan BA ve hortumların yeniden hazırlandığı denetlenir. Raporda hangi mahallin senaryolaştırıldığı, yoklama/eksik kişi, duman nedeniyle tahliye kararı, haberleşme, kapı/damper kontrolü ve ekipman testinin gerçekten uygulanıp uygulanmadığı açıklanır."],"source_full_en":["At the end of the drill, check that fire doors and dampers are returned to their normal safe position, temporarily closed routes are reviewed, and breathing apparatus and hoses used during the exercise are ready again. The report identifies the simulated compartment, muster or missing-person scenario, smoke-related evacuation decision, communications, door and damper checks and whether equipment tests were actually performed."],"source_integrity":"sha256_verified_against_embedded_blocks"}]},{"key":"fire/engine","family":"fire","flow":"engine","title_tr":"Makine Dairesi Yangını","title_en":"Engine-Room Fire","family_title_tr":"Yangın Talimleri","family_title_en":"Fire Emergencies","stages":[{"step":1,"title_tr":"Senaryonun başlangıcı, yangının fark edilmesi ve ilk bildirim","title_en":"Recognize the fire and make the first report","learning_tr":"Vardiya personeli duman veya yangın belirtisinin hangi makine/jeneratör çevresinde olduğunu, yakın yakıt hattını, sıcak yüzey ve elektrik sistemlerini bildirir.","learning_en":"Watchkeeping personnel report which machinery item or generator is near the smoke or suspected fire, together with nearby fuel piping, hot surfaces and electrical systems.","exercise_tr":"Jeneratör ve yakıt hattı çevresindeki belirtiler için mevkii, çalışan makineler ve sevk/elektrik etkisi içeren örnek ilk ihbar hazırlatın.","exercise_en":"Prepare a mock first report for a generator/fuel-line area covering location, running machinery and propulsion/power implications.","hazard_tr":"Basınçlı yakıt püskürmesi, sıcak yüzeyler ve elektrik donanımı; varsayımsal nedenin kesin kabulü.","hazard_en":"Pressurized fuel spray, hot surfaces and electrical equipment; assuming a hypothetical cause is proven.","id":"fire-engine-1","source_full_tr":["Vardiya personeli duman veya yangın belirtisinin hangi makine/jeneratör çevresinde olduğunu, yakın yakıt hattını, sıcak yüzey ve elektrik sistemlerini bildirir. Basınçlı yakıt kaçağının sıcak parçaya püskürmesi, yağ birikimi, izolasyon hasarı, elektrik panosu ve turbocharger/exhaust yüzeyleri olası nedenlerdir; olayın sebebi yalnızca varsayım olarak belirtilir. Hangi makinenin çalışır olduğu, yedek enerji ve sevk üzerindeki etkisi belirlenir."],"source_full_en":["Watchkeepers report the machinery or generator vicinity in which smoke or fire is suspected and identify nearby fuel lines, hot surfaces and electrical equipment. Pressurised fuel spray onto hot components, accumulated oil, damaged insulation, switchboards and turbocharger or exhaust surfaces are possible causes; the cause is described as an assumption until established. Identify the machines operating and any consequences for standby power and propulsion."],"source_integrity":"sha256_verified_against_embedded_blocks"},{"step":2,"title_tr":"Yangın alarmı, genel anons ve haberleşme","title_en":"Raise the alarm and establish communications","learning_tr":"Makine kontrol yeri, köprüüstü ve kaptan arasında kısa komut tekrarlarıyla haberleşme usulü açıklanır. Yangının yeri, görevli personel sayısı, çalışır jeneratörlerin durumu, geminin manevra/DP/elektrik ihtiyacı ve ilk emniyet…","learning_en":"Communication between the engine control position, bridge and master is explained using short instructions and read-backs.","exercise_tr":"Makine kontrol yeri–köprüüstü arasında emir tekrarlı haberleşme canlandırın; alternatif güç durumunu yalnız senaryo üzerinde tartışın.","exercise_en":"Role-play closed-loop communications between engine control and bridge; discuss alternate-power arrangements as a scenario only.","hazard_tr":"Yalnız talim için kritik makineyi durdurmak veya enerji arzını tehlikeye atmak.","hazard_en":"Stopping critical machinery or jeopardizing power supply solely for drill purposes.","id":"fire-engine-2","source_full_tr":["Makine kontrol yeri, köprüüstü ve kaptan arasında kısa komut tekrarlarıyla haberleşme usulü açıklanır. Yangının yeri, görevli personel sayısı, çalışır jeneratörlerin durumu, geminin manevra/DP/elektrik ihtiyacı ve ilk emniyet tedbirleri rapor kapsamına alınır. Gerçek kritik makineler yalnızca talim senaryosu nedeniyle durdurulmaz; alternatif güç kararı simülasyonla çalışılabilir."],"source_full_en":["Communication between the engine control station, bridge and master is explained using concise orders and read-backs. Reports cover the fire location, number of personnel involved, status of running generators, the ship's manoeuvring, dynamic-positioning or electrical requirements and first safety precautions. Critical machinery must not be stopped solely for a drill; the decision about alternative power may be exercised by simulation."],"source_integrity":"sha256_verified_against_embedded_blocks"},{"step":3,"title_tr":"Role organizasyonu, yoklama ve müdahale ekipleri","title_en":"Muster crew and assign response teams","learning_tr":"Yangın ekibi, makine güvenlik/enerji ekibi, yakıt ve havalandırma kontrol görevlisi, köprüüstü ve ilk yardım görevlileri role cetveline göre ayrılır.","learning_en":"The muster list is used to allocate the firefighting team, machinery-safety and power team, persons responsible for fuel and ventilation controls, bridge personnel and first-aid personnel.","exercise_tr":"Role cetveline göre makine tahliye, personel sayımı, yakıt/havalandırma ve yangın ekiplerini eşleştirin.","exercise_en":"Map engine-room evacuation, accountability, fuel/ventilation and firefighting roles to the muster list.","hazard_tr":"Gazlı sabit söndürme öncesinde içeride kalan personelin gözden kaçırılması.","hazard_en":"Overlooking personnel remaining inside before any fixed-gas extinguishing decision.","id":"fire-engine-3","source_full_tr":["Yangın ekibi, makine güvenlik/enerji ekibi, yakıt ve havalandırma kontrol görevlisi, köprüüstü ve ilk yardım görevlileri role cetveline göre ayrılır. Makine dairesinde kimsenin kalmadığının doğrulanması özellikle gazlı sabit söndürme kararında vazgeçilmezdir. Kompartman girişindeki personel sayımı ile geminin genel yoklaması birbirinden ayrılır; içeride kalmış kişi senaryosu tahliye önceliğiyle ele alınır."],"source_full_en":["The firefighting team, machinery safety/power team, fuel and ventilation control personnel, bridge team and first-aid team are assigned according to the muster list. Establishing that no one remains in the machinery space is essential before any decision to use a fixed gaseous extinguishing system. Headcount at the compartment entrance is distinguished from the vessel-wide muster, and a trapped-person scenario is assessed with evacuation as a priority."],"source_integrity":"sha256_verified_against_embedded_blocks"},{"step":4,"title_tr":"Mahale özgü tehlikeler ve koruyucu donanım","title_en":"Review location-specific hazards and protection","learning_tr":"Sıcak boru/egzoz yüzeyi, yakıt spreyi, dönel parçalar, kaygan platform, elektrik arkı, gürültü ve duman bir arada bulunabilir. Yangın kıyafeti, SCBA/BA, haberleşme ve geri çekilme organizasyonu anlatılır.","learning_en":"Hot piping and exhaust surfaces, fuel spray, rotating machinery, slippery platforms, electrical arcs, noise and smoke may be present together.","exercise_tr":"SCBA alarmı, maske sızdırmazlığı ve BA giriş/çıkış kaydını uygun eğitim cihazıyla gösterin; EEBD kullanım sınırını açıklayın.","exercise_en":"Demonstrate SCBA alarms, mask fit and BA entry/exit logging with appropriate training equipment; explain EEBD limitations.","hazard_tr":"Yakıt spreyi, sıcak egzoz, dönel donanım, elektrik arkı ve yetersiz solunum koruması.","hazard_en":"Fuel spray, hot exhaust, rotating machinery, electrical arc and inadequate respiratory protection.","id":"fire-engine-4","source_full_tr":["Sıcak boru/egzoz yüzeyi, yakıt spreyi, dönel parçalar, kaygan platform, elektrik arkı, gürültü ve duman bir arada bulunabilir. Yangın kıyafeti, SCBA/BA, haberleşme ve geri çekilme organizasyonu anlatılır. Yangına giriş için EEBD uygun değildir. BA tüp basıncı, düşük hava alarmı, maske sızdırmazlığı, görev süresi ve giriş/çıkış takibi cihazın gerçek modeline göre gösterilir."],"source_full_en":["Hot pipes and exhaust surfaces, fuel spray, moving machinery, slippery platforms, electrical arcing, noise and smoke may occur together. Firefighting clothing, SCBA/BA, communications and withdrawal arrangements are covered. EEBD equipment is not suitable for entry to fight a fire. Cylinder pressure, low-air alarms, facepiece seal, working duration and entry/exit monitoring are demonstrated using the actual breathing-apparatus model."],"source_integrity":"sha256_verified_against_embedded_blocks"},{"step":5,"title_tr":"Bölmenin tecridi, yayılmanın önlenmesi ve sistem kararları","title_en":"Isolate the space and limit spread","learning_tr":"Yakıt beslemesi, uzaktan/çabuk kapama valfleri, transfer pompaları, fanlar, damperler, makine stopları ve elektrik izolasyonu hangi bölümü etkiledikleri üzerinden öğretilir.","learning_en":"Fuel supply, remote and quick-closing valves, transfer pumps, fans, dampers, machinery shutdowns and electrical isolation are taught by identifying which systems each control affects.","exercise_tr":"Yakıt kesme, damper, fan, stop ve sabit CO₂ kumandalarının yerini plan üzerinde tanıtın; gerçek aktivasyon yerine karar dizisini simüle edin.","exercise_en":"Identify fuel shutoffs, dampers, fans, stops and fixed CO₂ controls on plans; simulate the decision sequence instead of activating equipment.","hazard_tr":"İstem dışı CO₂ boşalması, eksik tahliye, enerji kaybı ve erken yeniden giriş.","hazard_en":"Unintended CO₂ release, incomplete evacuation, loss of power and premature re-entry.","id":"fire-engine-5","source_full_tr":["Yakıt beslemesi, uzaktan/çabuk kapama valfleri, transfer pompaları, fanlar, damperler, makine stopları ve elektrik izolasyonu hangi bölümü etkiledikleri üzerinden öğretilir. Her kritik tecrit, alternatif elektrik, acil dümen, seyir emniyeti, aydınlatma ve personelin tahliyesi üzerindeki etkisiyle birlikte değerlendirilir. Sabit CO₂: Kaptanın yetkili kararı; tüm personelin tahliye ve sayımı; alarm ve hava girişlerinin kontrolü; uygunsuz erken yeniden giriş ve tekrar tutuşma tehlikesi; gerektiğinde uzman desteği anlatılır. Talimde CO₂ boşaltılmaz; yanlışlıkla aktivasyona yol açabilecek kumanda elemanlarına müdahale edilmez."],"source_full_en":["Fuel supplies, remote and quick-closing valves, transfer pumps, fans, dampers, machinery stops and electrical isolation are taught in terms of the systems they affect. Every critical isolation decision is assessed for its consequences for alternative electrical supply, emergency steering, navigation safety, lighting and personnel evacuation. For a fixed CO₂ system, instruction covers the master's authorised decision, evacuation and full accounting of personnel, alarm and air-inlet controls, the dangers of premature re-entry and re-ignition, and specialist assistance where necessary. No CO₂ is discharged in the drill and controls that could cause unintended activation are not operated."],"source_integrity":"sha256_verified_against_embedded_blocks"},{"step":6,"title_tr":"Uygun söndürme araçları, yangın suyu ve müdahale taktiği","title_en":"Select appropriate firefighting methods","learning_tr":"Yakıt/sıvı yangını, makine yüzeyi ve elektrik tehlikesine göre uygun ajan seçimi ayrı ayrı ele alınır. Gemide mevcutsa uygun lokal uygulama/su sisi ile genel hacim koruması arasındaki fark gösterilir; sistemin otomatik veya…","learning_en":"Appropriate extinguishing agents are considered separately for fuel or liquid fires, machinery surfaces and electrical hazards.","exercise_tr":"Yakıt, elektrik ve sıcak yüzey yangınlarında ajan seçimini; lokal koruma ile hacim korumasını karşılaştırın. Güvenli iki jet testini ayrı ele alın.","exercise_en":"Compare agent selection for fuel, electrical and hot-surface fires and local versus total-space protection; treat a safe two-jet test separately.","hazard_tr":"Sıcak yağa kuvvetli su uygulanması, su birikimi, serbest yüzey ve kirlilik.","hazard_en":"Forceful water application to hot oil, accumulated water, free-surface effects and pollution.","id":"fire-engine-6","source_full_tr":["Yakıt/sıvı yangını, makine yüzeyi ve elektrik tehlikesine göre uygun ajan seçimi ayrı ayrı ele alınır. Gemide mevcutsa uygun lokal uygulama/su sisi ile genel hacim koruması arasındaki fark gösterilir; sistemin otomatik veya manuel gerçek tetiklenmesi talim gereği varsayılamaz. İki yangın suyu jetiyle devrenin çalışır olduğu güvenli test alanında gösterilebilir; makine mahallinde su birikmesi, serbest yüzey ve stabilite/kirlilik etkisi değerlendirilir. Sıcak yağ üzerine kontrolsüz kuvvetli su jetiyle müdahale edilmez."],"source_full_en":["Selection of a suitable extinguishing agent is addressed separately for fuel or liquid fires, machinery surfaces and electrical hazards. If fitted, local application or water-mist arrangements are distinguished from total-compartment protection; actual automatic or manual triggering is not presumed as part of a drill. The operation of a two-jet fire-water circuit can be demonstrated in a safe test area while considering water accumulation in machinery spaces, free-surface effects, stability and pollution. An uncontrolled forceful water jet is not directed onto hot oil."],"source_integrity":"sha256_verified_against_embedded_blocks"},{"step":7,"title_tr":"Olayın gelişimi, alternatif kararlar ve dış yardımlar","title_en":"Manage developments and outside assistance","learning_tr":"Yangının jeneratörden diğer sisteme ilerlemesi, tek/çift jeneratör kaybı, köprüüstü manevra kabiliyetinin azalması, acil elektrik sistemine geçiş, makine dairesi personelinin tahliyesi ve sabit sistem kararı senaryo…","learning_en":"Scenario developments include fire spreading between generating units, loss of one or more generators, reduced bridge manoeuvring capability, transfer to emergency electrical supply, evacuation of engine-room personnel and a possible fixed-extinguishing-system decision. Controlling the fire and deciding whether the ship can safely navigate are separate judgments. Any coordination with port authorities, shore fire services or rescue units is addressed within the responsible authority's remit.","exercise_tr":"Tek/çift jeneratör kaybı, acil elektrik ve geminin manevra kabiliyetini etkileyen gelişmeleri masa başında değerlendirin.","exercise_en":"Evaluate scenarios involving loss of one or two generators, emergency power and reduced manoeuvrability.","hazard_tr":"Yangının bastırılması ile sevk/emniyetli seyrin sürdürülebilmesinin aynı kabul edilmesi.","hazard_en":"Assuming that fire suppression automatically means propulsion and safe navigation are restored.","id":"fire-engine-7","source_full_tr":["Yangının jeneratörden diğer sisteme ilerlemesi, tek/çift jeneratör kaybı, köprüüstü manevra kabiliyetinin azalması, acil elektrik sistemine geçiş, makine dairesi personelinin tahliyesi ve sabit sistem kararı senaryo gelişmeleridir. Yangının söndürülmesi ile geminin seyrinin sürdürülmesi aynı karar değildir. Limanda iskele/itfaiye ve sahil desteği, seyirde arama-kurtarma/yardım koordinasyonu uygun yetkiyle değerlendirilir."],"source_full_en":["Scenario developments include fire spreading from a generator to another system, loss of one or two generators, reduced bridge manoeuvring capability, transfer to emergency electrical supply, evacuation of machinery-space personnel and a decision about the fixed extinguishing system. Extinguishing the fire and continuing the voyage are distinct decisions. Alongside, coordination with the berth and shore fire services is considered; at sea, search-and-rescue and assistance coordination is considered under the appropriate authority."],"source_integrity":"sha256_verified_against_embedded_blocks"},{"step":8,"title_tr":"Sonlandırma, ekipmanı yeniden hazır hâle getirme ve kayıtlar","title_en":"Restore equipment, debrief and record","learning_tr":"Kullanılan BA tüpleri, hortum/nozul, pompalar, haberleşme ve emniyet sistemlerinin tekrar kullanıma hazır olması kontrol edilir.","learning_en":"Breathing-apparatus cylinders, hoses and nozzles, pumps, communications and safety systems used during the drill are checked and restored to readiness.","exercise_tr":"BA, hortum, pompa ve haberleşme teçhizatının yeniden hazır oluşunu denetleyin; simüle yakıt/CO₂ işlemlerini jurnale gerçek gibi yazmayın.","exercise_en":"Verify BA, hose, pump and communications readiness; do not journal simulated fuel isolation or CO₂ discharge as actual work.","hazard_tr":"Gerçekleşmemiş makine stopu, yakıt kesme veya CO₂ uygulamasının yapılmış sayılması.","hazard_en":"Reporting a machinery stop, fuel shutoff or CO₂ discharge that did not occur.","id":"fire-engine-8","source_full_tr":["Kullanılan BA tüpleri, hortum/nozul, pompalar, haberleşme ve emniyet sistemlerinin tekrar kullanıma hazır olması kontrol edilir. Talimde yalnızca simüle edilen yakıt kesme, jeneratör stopu veya CO₂ uygulaması, gerçek test yapılmış gibi raporlanmaz. Yangın ve Patlama özel kontrol listesi; pompa/hidrolik makine dairesi özel listesi olaya uygunsa ve güncel form erişimi varsa değerlendirilir. Makine jurnaliyle ilgili gerçek çalışma kayıtları ayrı ve doğru tutulur."],"source_full_en":["Breathing-apparatus cylinders, hoses and nozzles, pumps, communications and safety systems are checked for readiness after use. Fuel isolation, generator stopping or CO₂ operation only simulated in the exercise must not be recorded as an actual test. The specialised Fire and Explosion checklist and pump/hydraulic machinery-space checklist are considered if relevant to the incident and accessible in their current form. Actual machinery log entries are kept accurately and separately."],"source_integrity":"sha256_verified_against_embedded_blocks"}]},{"key":"fire/galley","family":"fire","flow":"galley","title_tr":"Kuzine Yangını","title_en":"Galley Fire","family_title_tr":"Yangın Talimleri","family_title_en":"Fire Emergencies","stages":[{"step":1,"title_tr":"Senaryonun başlangıcı, yangının fark edilmesi ve ilk bildirim","title_en":"Recognize the fire and make the first report","learning_tr":"Aşçı veya kuzine personeli, alevin yağ haznesinde mi, ocak üzerinde taşan yağda mı, yoksa davlumbaz ve havalandırma kanalında mı başladığını ayırt eder.","learning_en":"The cook or galley personnel distinguish whether flames originate in the oil reservoir, cooking oil overflowing onto the range, or the extraction hood and ventilation duct.","exercise_tr":"Kızgın yağ haznesi, taşmış yağ ve davlumbaz/kanal için farklı başlangıç senaryolarını karşılaştırın.","exercise_en":"Compare initial scenarios involving a hot-oil pan, spilled cooking oil and the extraction hood/duct.","hazard_tr":"Su–kızgın yağ teması, sıcak yüzeyler ve kanıtlanmamış yangın nedenini kesin kabul etme.","hazard_en":"Water contacting hot cooking oil, heated surfaces and asserting an unproven ignition cause.","id":"fire-galley-1","source_full_tr":["Aşçı veya kuzine personeli, alevin yağ haznesinde mi, ocak üzerinde taşan yağda mı, yoksa davlumbaz ve havalandırma kanalında mı başladığını ayırt eder. Aşırı ısınma, termostat arızası, yağ birikimi, pişirme cihazının kontrolsüz çalışması ve suyun kızgın yağa teması farklı senaryo tehlikeleridir. Tutuşmanın gerçek nedeni incelenmeden kesin bir kusur veya teknik arıza yazılmaz."],"source_full_en":["The cook or galley crew distinguish flames originating in a fryer oil reservoir, overflowing oil on a cooker, or a hood and ventilation duct. Overheating, thermostat failure, accumulated grease, uncontrolled appliance operation and water contacting hot oil are different scenario hazards. No definite human fault or technical failure is entered before the actual cause has been established."],"source_integrity":"sha256_verified_against_embedded_blocks"},{"step":2,"title_tr":"Yangın alarmı, genel anons ve haberleşme","title_en":"Raise the alarm and establish communications","learning_tr":"Kuzine görevlisi yangını, mahalin kapalı/açık oluşunu, olası yaralıyı, kızgın yağ veya davlumbaz tehlikesini bildirir. Genel yangın alarmı ile talim anonsu ayrılır.","learning_en":"The galley watch reports the fire, whether the space is enclosed or open, possible injuries, and the hazards from hot oil or the extraction hood. The general fire alarm is distinguished from the drill announcement.","exercise_tr":"Kuzine görevlisinin mahal, yaralı ihtimali, yağ ve davlumbaz durumunu raporladığı örnek haberleşmeyi canlandırın.","exercise_en":"Role-play a galley report stating the location, possible injuries, hot-oil involvement and extractor-hood conditions.","hazard_tr":"Yanlış alarm/talim anonsu ve yaşam mahalline yayılan duman nedeniyle oluşabilecek karışıklık.","hazard_en":"Confusion from misleading drill alarms and smoke spreading into accommodation spaces.","id":"fire-galley-2","source_full_tr":["Kuzine görevlisi yangını, mahalin kapalı/açık oluşunu, olası yaralıyı, kızgın yağ veya davlumbaz tehlikesini bildirir. Genel yangın alarmı ile talim anonsu ayrılır. Kapı, havalandırma, gaz/elektrik kontrol noktaları ve yaşam mahallerine duman yayılımı konusunda köprüüstü ve destek ekibi bilgilendirilir. Şok/panik ve yanık yaralanmalarına hazırlık konusu eklenir."],"source_full_en":["Galley staff report the fire, whether the space is open or enclosed, any casualty and hazards from hot oil or the extraction hood. The general fire alarm is distinguished from the drill announcement. The bridge and supporting team are informed of doors, ventilation, gas and electrical controls and possible smoke migration into accommodation. The possibility of shock, panic and burn injuries is included in preparedness."],"source_integrity":"sha256_verified_against_embedded_blocks"},{"step":3,"title_tr":"Role organizasyonu, yoklama ve müdahale ekipleri","title_en":"Muster crew and assign response teams","learning_tr":"Kuzine personelinin emniyetle geri çekilmesi, yemek hizmetindeki diğer personelin sayımı, yaşam mahalline geçiş kapıları ve ilk yardım görevlisi ayrı görevlerdir.","learning_en":"Safe withdrawal of galley personnel, accounting for other catering staff, doors leading into accommodation and first-aid responsibilities are treated as separate tasks.","exercise_tr":"Kuzine personelinin geri çekilmesini, personel sayımını ve ilk yardım ekibiyle koordinasyonu senaryoda gösterin.","exercise_en":"Demonstrate simulated withdrawal and accountability of galley staff and coordination with first aid.","hazard_tr":"Dar kuzinede gereksiz personel yığılması ve sıcak yağ yanıkları.","hazard_en":"Unnecessary crowding in the confined galley and hot-oil burns.","id":"fire-galley-3","source_full_tr":["Kuzine personelinin emniyetle geri çekilmesi, yemek hizmetindeki diğer personelin sayımı, yaşam mahalline geçiş kapıları ve ilk yardım görevlisi ayrı görevlerdir. Yangın ekibinin ihtiyaç duyacağı koruyucu kıyafet ve SCBA/BA; yangın/kızgın yağ yaralanmasının ilk yardım ekibiyle koordinasyonu gösterilir. Kısıtlı mutfak alanında kalabalık personelin müdahale bölgesine girmesinin tehlikesi anlatılır."],"source_full_en":["Safe withdrawal of galley personnel, accounting for other food-service staff, doors leading to accommodation and assignment of a first-aid responder are separate tasks. The fire team's need for protective clothing and SCBA/BA is demonstrated together with coordination with medical responders for fire and hot-oil injuries. Personnel are taught the danger of crowding into a confined galley during intervention."],"source_integrity":"sha256_verified_against_embedded_blocks"},{"step":4,"title_tr":"Mahale özgü tehlikeler ve koruyucu donanım","title_en":"Review location-specific hazards and protection","learning_tr":"Kızgın yağ sıçraması, buhar patlaması/sıçratma etkisi, sıcak metal, gazlı ocak, elektrikli cihaz, yağlı aspirasyon kanalı, kaygan zemin ve yanıcı ambalajların tehlikeleri incelenir.","learning_en":"The hazards reviewed include splashing hot oil, explosive boiling and splatter, hot metal, gas burners, electrical appliances, grease-laden extraction ducts, slippery floors and combustible packaging.","exercise_tr":"Yangın battaniyesi veya uygun kapağın yalnız sınırlı ve uygun küçük olaylarda nasıl değerlendirileceğini anlatın; büyük fritöze yaklaşmayı canlandırmayın.","exercise_en":"Explain the limited applicability of a fire blanket or suitable lid to certain small incidents; do not simulate approaching a large burning fryer.","hazard_tr":"Yağa su/buz atılması, yanan kap taşınması ve ani yağ sıçraması.","hazard_en":"Applying water or ice to burning oil, carrying a burning pan and sudden oil splashing.","id":"fire-galley-4","source_full_tr":["Kızgın yağ sıçraması, buhar patlaması/sıçratma etkisi, sıcak metal, gazlı ocak, elektrikli cihaz, yağlı aspirasyon kanalı, kaygan zemin ve yanıcı ambalajların tehlikeleri incelenir. Yağ yangınında su veya buz kullanılmaz; yanan yağ haznesi taşınmaz. Çok küçük bir tava yangınında uygun kapak veya yangın battaniyesinin kullanımına ilişkin eğitim verilebilse de bu, büyük fritöze elle yaklaşma ya da blanket atma talimatı değildir. Gerektiğinde kapı kapatılır, mahal terk edilir ve profesyonel yangın ekibinin müdahalesi beklenir."],"source_full_en":["Hazards reviewed include splashing hot oil, sudden steam-driven ejection, hot metal, gas burners, electrical appliances, grease-laden extraction ducts, slippery flooring and combustible packaging. Water or ice must never be used on an oil fire, and a container of burning oil must not be carried. Instruction on a suitable lid or fire blanket for a very small pan fire is not a direction to approach a large fryer or throw a blanket onto it. If necessary, close the door, leave the space and await intervention by trained firefighters."],"source_integrity":"sha256_verified_against_embedded_blocks"},{"step":5,"title_tr":"Bölmenin tecridi, yayılmanın önlenmesi ve sistem kararları","title_en":"Isolate the space and limit spread","learning_tr":"Güvenli ısı kaynağı kesme, gaz/elektrik izolasyonu, davlumbaz fan/damper kontrolü ve mutfak ile yaşam mahallinin yangın bölmesi sınırları açıklanır. Gemide derin yağda kızartma cihazı varsa, SOLAS II-2/10.6.","learning_en":"The lesson covers safe isolation of heat sources, gas and electrical supply, extraction-hood fans and dampers, and the fire boundaries between the galley and accommodation.","exercise_tr":"Ocak ısı kaynağı, gaz/elektrik ve davlumbaz tecridini plan/etiket üzerinden tanıtın; varsa derin yağ cihazı koruma sistemini gösterimle açıklayın.","exercise_en":"Use plans/labels to identify heat-source, gas/electric and hood isolation; explain the fryer protection system by demonstration if fitted.","hazard_tr":"Talim sırasında sabit söndürmenin veya gaz/elektrik kumandalarının istem dışı etkinleşmesi.","hazard_en":"Unintended activation of fixed extinguishing or gas/electrical controls during the drill.","id":"fire-galley-5","source_full_tr":["Güvenli ısı kaynağı kesme, gaz/elektrik izolasyonu, davlumbaz fan/damper kontrolü ve mutfak ile yaşam mahallinin yangın bölmesi sınırları açıklanır. Gemide derin yağda kızartma cihazı varsa, SOLAS II-2/10.6.4'ün öngördüğü özel sistem bileşenleri konu olarak öğretilir: onaylı yangın söndürme, birincil/yedek sıcaklık kontrolü, koruma sistemiyle güç kesme ilişkisi, alarm ve manuel kumanda. Bu cihazın veya belirli bir sabit sistemin gemide bulunduğu varsayılmaz. Talim gerçek otomatik söndürme sistemini istem dışı tetiklemez."],"source_full_en":["Safe isolation of heat, gas and electricity, controls for hood fans and dampers, and fire-compartment boundaries between the galley and accommodation are explained. If the ship carries deep-fat frying equipment, training addresses the components required by SOLAS II-2/10.6.4: an approved extinguishing system, primary and backup temperature controls, the relationship between the protection system and power shutdown, alarm and manual controls. Neither the appliance nor a particular fixed system is assumed to exist aboard the ship. The drill must not inadvertently activate an actual automatic extinguishing system."],"source_integrity":"sha256_verified_against_embedded_blocks"},{"step":6,"title_tr":"Uygun söndürme araçları, yangın suyu ve müdahale taktiği","title_en":"Select appropriate firefighting methods","learning_tr":"Kızgın yemek yağı yangınları Avrupa/EN sınıflandırmasında Sınıf F, ABD'de Sınıf K olarak tanımlanır. Gerçek yangında onaylı F/K sınıfına uygun etiketli söndürücü ve varsa uygun sabit kuzine sistemi esas alınır; her köpüklü…","learning_en":"Hot cooking-oil fires are Class F under European/EN classification and Class K in the United States. Actual firefighting relies on an extinguisher labelled and approved for that hazard or an applicable fixed galley system; general foam, CO₂ or dry-powder extinguishers must not automatically be assumed suitable. Explain how wet-chemical agents cool the fuel and form a protective surface layer. The required two-water-jet fire-pump test must never be interpreted as directing water onto burning cooking oil.","exercise_tr":"Sınıf F/K etiketli uygun söndürücüyü diğer tüplerle karşılaştırın; ıslak kimyasal söndürmenin temel etkisini açıklayın.","exercise_en":"Compare appropriately labelled Class F/K extinguishers with other units and explain the basic action of wet chemical agents.","hazard_tr":"Genel amaçlı tüpün kızgın yağa uygun sayılması veya iki su jetli testin yağa su uygulanmasına dönüşmesi.","hazard_en":"Treating a general-purpose extinguisher as suitable for hot oil or directing a water-jet test onto cooking oil.","id":"fire-galley-6","source_full_tr":["Kızgın yemek yağı yangınları Avrupa/EN sınıflandırmasında Sınıf F, ABD'de Sınıf K olarak tanımlanır. Gerçek yangında onaylı F/K sınıfına uygun etiketli söndürücü ve varsa uygun sabit kuzine sistemi esas alınır; her köpüklü, CO₂'li veya genel amaçlı kuru tozlu tüpün kızgın yağ yangınına uygun olduğu varsayılmaz. Islak kimyasal türündeki söndürücüler, soğutma ve yağ yüzeyinde koruyucu tabaka oluşturma işlevleriyle açıklanabilir. Yangın pompasının iki jetli testi, yağa su uygulamasına dönüştürülmez."],"source_full_en":["Cooking-oil fires are classified as Class F in the European/EN system and Class K in the United States. For an actual fire, use an approved extinguisher labelled for Class F/K and any suitable fixed galley system fitted on board; not every foam, CO₂ or general-purpose dry-powder extinguisher is appropriate for hot-oil fires. Wet-chemical agents can be explained by their cooling action and formation of a protective layer on the oil surface. A two-jet fire-pump test must never be turned into a water application onto burning cooking oil."],"source_integrity":"sha256_verified_against_embedded_blocks"},{"step":7,"title_tr":"Olayın gelişimi, alternatif kararlar ve dış yardımlar","title_en":"Manage developments and outside assistance","learning_tr":"Alevin davlumbazda ilerlemesi, dumanın yemekhaneye/koridora ulaşması, yağlı zeminde bir personelin yaralanması, kuzine elektrik/gaz izolasyonu ve yangının kontrol altına alınamaması ayrı gelişme örnekleridir.","learning_en":"Escalation scenarios include flames extending into the extraction hood, smoke spreading towards the mess or passageway, an injury on a greasy floor, electrical or gas isolation, and failure to control the fire. If the initial response is unsuccessful, withdrawal and securing the area take priority. Muster, evacuation routes, fire doors and dampers are reviewed if galley smoke threatens accommodation spaces.","exercise_tr":"Alevin davlumbaza yayılması, yaralı personel ve yaşam mahalli tahliyesi varyantlarıyla geri çekilme kararı çalıştırın.","exercise_en":"Work through escalation involving a hood fire, injured crew and accommodation evacuation, emphasizing withdrawal decisions.","hazard_tr":"Kontrol edilemeyen kızgın yağ yangınına güvensiz biçimde yaklaşma ve duman yayılması.","hazard_en":"Unsafe approach to an uncontrolled hot-oil fire and spreading smoke.","id":"fire-galley-7","source_full_tr":["Alevin davlumbazda ilerlemesi, dumanın yemekhaneye/koridora ulaşması, yağlı zeminde bir personelin yaralanması, kuzine elektrik/gaz izolasyonu ve yangının kontrol altına alınamaması ayrı gelişme örnekleridir. Sıcak yağ yangınına özgü ilk müdahale başarısızsa güvenli geri çekilme ve bölümün emniyete alınması önceliklenir. Mutfak yangınının yaşam mahalli tahliyesine dönüşmesi ihtimaliyle personel sayımı ve kapı/damper kontrolü senaryo üzerinden birlikte çalışılır."],"source_full_en":["Scenario developments include flames spreading through the hood, smoke reaching the messroom or corridor, an injury on a greasy floor, isolation of galley electricity or gas and failure to control the fire. If the initial response appropriate to a cooking-oil fire fails, safe withdrawal and securing the compartment take priority. The potential for a galley fire to require evacuation of accommodation is considered together with headcount and door/damper checks."],"source_integrity":"sha256_verified_against_embedded_blocks"},{"step":8,"title_tr":"Sonlandırma, ekipmanı yeniden hazır hâle getirme ve kayıtlar","title_en":"Restore equipment, debrief and record","learning_tr":"Kuzine cihazı ve varsa davlumbaz/kanal üzerindeki kontrolün eğitimden sonra emniyetli durumda bırakıldığı doğrulanır; söndürücü ve yangın battaniyesi yerinde/servise hazır bulunur.","learning_en":"After the drill it is verified that the cooking appliance and any hood or duct controls have been left in a safe condition; extinguishers and any fire blanket remain in their designated positions and are serviceable.","exercise_tr":"Cihaz, davlumbaz, yangın battaniyesi ve söndürücü hazırlığını kontrol listesinde değerlendirin; gerçek ve varsayımsal işlemleri ayrı yazın.","exercise_en":"Check the readiness of cooking equipment, hood, fire blanket and extinguisher; record real and hypothetical actions separately.","hazard_tr":"Kullanılmış söndürücünün yenilenmeden hizmete bırakılması ve gerçekte yapılmayan testin raporlanması.","hazard_en":"Leaving a discharged extinguisher in service without replacement and documenting a test that was not carried out.","id":"fire-galley-8","source_full_tr":["Kuzine cihazı ve varsa davlumbaz/kanal üzerindeki kontrolün eğitimden sonra emniyetli durumda bırakıldığı doğrulanır; söndürücü ve yangın battaniyesi yerinde/servise hazır bulunur. Gerçekten kullanılan söndürücü yenilenmeden görevde bırakılmaz. Raporda yangının kızgın yağda mı başka bir yanıcı maddede mi varsayıldığı, uygun F/K ajan eğitimi, ısı kaynağı ve davlumbaz kontrolü, yaralı ilk yardım, iki jetli pompa testi, fiilen yapılan/simüle edilen işlem ayrımı yer alır."],"source_full_en":["Confirm that galley equipment and any hood or duct controls are left in a safe state after training; extinguishers and the fire blanket must be correctly stowed and serviceable. An extinguisher actually discharged must not remain in service without being replenished. The report specifies whether the scenario involved hot cooking oil or another combustible material, Class F/K agent instruction, heat-source and hood controls, first aid for casualties, the two-jet fire-pump test, and the distinction between actions performed and those only simulated."],"source_integrity":"sha256_verified_against_embedded_blocks"}]},{"key":"steering/steering","family":"steering","flow":"steering","title_tr":"Acil Dümen","title_en":"Emergency Steering","family_title_tr":"Acil Dümen","family_title_en":"Emergency Steering","stages":[{"step":1,"title_tr":"Senaryo, dümen kumanda kaybının fark edilmesi ve ilk durum resmi","title_en":"Identify steering-control failure","learning_tr":"Eğitim amacı: Personel, dümen arızasını yalnızca “dümen dönmüyor” ifadesiyle değil; emredilen dümen açısı, gerçek dümen göstergesi, alarm, gemi başının tepkisi ve seyir şartları birlikte değerlendirilerek tanımlar.","learning_en":"A steering failure is recognised from the ordered rudder angle, actual rudder-angle indication, alarms, vessel heading response and navigating conditions—not merely from an assertion that the rudder will not move. The exercise may begin with a bridge remote-control failure. Crew distinguish a true lack of rudder response from an erroneous heading repeater, review local control and hydraulic/power indications, and report the vessel's speed, restricted waters and available manoeuvring options.","exercise_tr":"Dümen emri, gerçek açı göstergesi, alarmlar ve gemi başının tepkisini içeren örnek köprüüstü durum çizelgesini yorumlatın.","exercise_en":"Review a simulated bridge status sheet showing ordered and indicated rudder angles, alarms and vessel heading response.","hazard_tr":"Tek bir göstergeye dayanılarak yanlış arıza teşhisi veya gereksiz kumanda devri yapılması.","hazard_en":"Misdiagnosis or unnecessary control transfer based on a single indication.","id":"ST-01","source_full_tr":["Eğitim amacı: Personel, dümen arızasını yalnızca “dümen dönmüyor” ifadesiyle değil; emredilen dümen açısı, gerçek dümen göstergesi, alarm, gemi başının tepkisi ve seyir şartları birlikte değerlendirilerek tanımlar.","Senaryo, örneğin köprüüstündeki otomatik/uzaktan dümen kontrolünün komuta beklenen yanıtı vermemesi üzerinden başlatılır. Olayın yeri, açık deniz/dar geçit/liman gibi manevra sınırlamaları ve mevcut gemi sürati açıklanır.","Dümen göstergesinin gerçekten sabit kalması ile sadece gyro repeaterın yanlış göstermesi ayrı olasılıklar olarak incelenir. Alarm panosu ve lokal kumanda durumu öğretici olarak gösterilir.","Arızanın olası katmanları; komut üretimi, kumanda iletimi, güç ünitesi, hidrolik, gerçek dümen geri beslemesi ve gösterge hatası şeklinde ayrıştırılır. Tüm mekanizmanın aynı anda hasarlı olduğu varsayılmaz.","Köprüüstünün geminin mevkiini, gerçek başını, yakın trafik ve sığlıkları, güvenli seyir alanını belirlemesi gerektiği öğretilir. Arıza anındaki sürat ve geminin mevcut hareketi ilk durum resmine eklenir.","Senaryo ile gerçek arıza birbirinden ayrılır; fiilî alarm üretmek için uzaktan kumanda bağlantısı kesilmez."],"source_full_en":["Learning objective: Crew identify a steering failure not simply as 'the rudder does not move', but by assessing the ordered rudder angle, actual rudder-angle indication, alarms, the ship's heading response and the prevailing navigation conditions together.","For example, the scenario begins when the automatic or remote steering control on the bridge fails to respond as commanded. Explain the ship's location, manoeuvring restrictions such as open sea, a narrow passage or port, and its current speed.","A rudder-angle indicator genuinely remaining fixed is distinguished from an incorrect gyro repeater indication. The alarm panel and the status of local steering control are demonstrated for instruction.","Possible fault layers are distinguished: command generation, transmission of the control order, power unit, hydraulics, actual rudder feedback and indication failure. The entire mechanism is not presumed to have failed at once.","Teach the bridge team to establish the vessel's position, true heading, nearby traffic and shallow water, and a safe navigable area. Speed and current motion when the defect occurs form part of the initial situation assessment.","Distinguish the exercise scenario from an actual failure; do not disconnect remote-control circuits to produce a genuine alarm for training."],"source_integrity":"sha256_verified_against_embedded_blocks"},{"step":2,"title_tr":"Kaptanın seyir emniyeti kararı ve tehlikelerin önlenmesi","title_en":"Maintain navigational safety and command","learning_tr":"Eğitim amacı: Dümen arızası ihtimalinde öncelikli işin donanım tamiri değil, geminin emniyetli kontrolünü kaybetmemesi olduğu kavranır.","learning_en":"Training objective: Understand that, when steering failure is suspected, the first priority is to retain safe control of the ship rather than immediately attempting equipment repairs.","exercise_tr":"Trafik, sığlık ve geminin manevra durumunu içeren harita senaryosuyla kaptanın seyir emniyeti seçeneklerini tartıştırın.","exercise_en":"Use a chart-based traffic and shallow-water scenario to discuss the master's options for maintaining navigational safety.","hazard_tr":"Kontrol kabiliyeti teyit edilmeden manevraya zorlamak ve tamire odaklanırken seyir tehlikesini gözden kaçırmak.","hazard_en":"Forcing manoeuvres before control is confirmed, or overlooking navigational hazards while focusing on repair.","id":"ST-02","source_full_tr":["Eğitim amacı: Dümen arızası ihtimalinde öncelikli işin donanım tamiri değil, geminin emniyetli kontrolünü kaybetmemesi olduğu kavranır.","Kaptanın bilgilendirilmesi, vardiya zabitinin çevre trafiğini izlemesi ve uygun gözcü/destek personelinin görevlendirilmesi işlenir.","Gemi hızı, su derinliği, kıyı/tesis mesafesi, trafik, rüzgâr ve akıntıya bağlı kontrol seçenekleri karşılaştırılır.","Gerekirse ana makine ve iticilerle ilgili olası emniyet tedbirleri kaptanın kararı ve makine dairesi koordinasyonu bağlamında ele alınır. Talim sırasında otomatik olarak pitch sıfırlanması, ana makinenin durdurulması veya iticinin çalıştırılması talimatı verilmez.","Sınırlı dümen kabiliyetinin bulunduğu bir senaryoda Kural 27 bakımından “kumanda altında olmayan” statüsünün doğup doğmadığı olayın gerçek şartlarına göre ayrı değerlendirilir. Senaryo gereği teorik NUC işaretleri tanıtılır; gerçek işaret verilmez.","Demir donanımı, olası römorkör/liman yardımı ve kıyı otoritesiyle irtibat seçenekleri, yalnızca durumun gerektirdiği şartlar altında öğretilir."],"source_full_en":["Learning objective: In a suspected steering failure, the immediate priority is to prevent loss of safe control of the vessel, rather than to start repairing the equipment.","Cover informing the master, the officer of the watch monitoring surrounding traffic, and assignment of suitable lookouts or additional personnel.","Compare the vessel's control options in relation to speed, water depth, proximity to shore or installations, traffic, wind and current.","Potential safety measures involving the main engine and thrusters are considered under the master's authority and in coordination with the engine room. The drill does not direct the automatic reduction of pitch to zero, shutdown of the main engine or activation of thrusters.","In a scenario with limited steering capability, consider separately whether the actual circumstances meet the conditions for being 'not under command' under COLREG Rule 27. The relevant NUC signals may be introduced theoretically, but no real signals are displayed solely for the exercise.","Anchor equipment, possible tug or port assistance and contact with coastal authorities are introduced only under circumstances where they would be warranted."],"source_integrity":"sha256_verified_against_embedded_blocks"},{"step":3,"title_tr":"Risk değerlendirmesi, görev dağılımı ve talim öncesi hazırlık","title_en":"Prepare the drill and assign responsibilities","learning_tr":"Eğitim amacı: Köprüüstü, makine dairesi ve dümen dairesinin birbirinden farklı sorumluluklarının, teknik risklerle birlikte planlanması sağlanır.","learning_en":"Training objective: Plan the distinct responsibilities of bridge, engine room and steering-gear compartment personnel together with the technical risks.","exercise_tr":"Köprüüstü, makine ve dümen dairesi görevlerini bir rol çizelgesi üzerinde eşleştirerek emniyet sınırlarını açıklatın.","exercise_en":"Map bridge, machinery-space and steering-compartment duties on a muster-style task chart and discuss safety limits.","hazard_tr":"Yetkisiz personelin hareketli veya enerjili dümen donanımına yaklaşması; haberleşme kopması.","hazard_en":"Unauthorised approach to moving or energised steering gear; loss of communications.","id":"ST-03","source_full_tr":["Eğitim amacı: Köprüüstü, makine dairesi ve dümen dairesinin birbirinden farklı sorumluluklarının, teknik risklerle birlikte planlanması sağlanır.","Talimin sınırı belirlenir: yalnızca masa başı, mahallinde görsel/tanıtım veya kontrollü doğrudan kumanda uygulaması. Bu üç seviye birbirine karıştırılmaz.","Risk konuşmasında dümenin istemsiz hareketi, yüksek basınçlı yağ, hareketli bağlantılar, elektrik, kaygan döşeme, gürültü, yetersiz aydınlatma, tek kişiyle çalışma, trafik/seyir ortamı, iletişim kaybı ve manevra gecikmesi işlenir.","Köprüüstü kontrol zabiti, makine vardiya personeli, dümen dairesindeki yerel kumanda personeli ve gerekli emniyet gözcüsünün görevleri tanıtılır. Personelin yeterliliği ve ulaşılabilirliği kontrol edilir.","Geminin sistem blok şeması, panel etiketleri, haberleşme aracı, gerçek dümen pozisyonu göstergesi ve kullanılması planlanan alternatif besleme seçeneği önceden belirlenir.","Hangi koşulda talimin derhal sonlandırılacağı açıklanır: beklenmeyen dümen hareketi, kumanda anlaşmazlığı, haberleşme kaybı, arıza alarmı, hidrolik kaçak, personelin tehlike altında kal
