g safe. Explain what should be covered by EK-V, EYS.08.115.FR and relevant deck or engine log and training records. A pump not actually operated, or a transfer not carried out, must not be entered into a final report as 'started' or 'transferred' merely because those words appear in a past-tense example. State matters that could not be assessed or need improvement."],"source_integrity":"sha256_verified_against_embedded_blocks"}]},{"key":"pollution/overflow","family":"pollution","flow":"overflow","title_tr":"Yakıt / Tank Taşması","title_en":"Fuel or Tank Overflow","family_title_tr":"Deniz Kirliliği","family_title_en":"Marine Pollution","stages":[{"step":1,"title_tr":"Olayın başlangıcı ve tank taşmasının tanınması","title_en":"Recognize tank overflow","learning_tr":"Eğitici anlatım: Yakıt alımı veya tanklar arası transfer sırasında seviye göstergesinde beklenenden hızlı yükselme, yüksek seviye alarmı, tank havalığı/taşma hattı çevresinde sıvı belirtisi veya dolum planındaki beklenmedik fark…","learning_en":"During bunkering or a tank transfer, recognise an overflow risk from an unexpected level increase, high-level alarm, evidence around a vent or overflow line, or a discrepancy against the transfer plan. Confirm the information through independent indications and authorised communications before selecting a response. Training must distinguish an observed leak from a spill introduced only in the scenario.","exercise_tr":"Örnek tank dolum çizelgesindeki seviye yükselişi, yüksek seviye alarmı ve havalık belirtisini birlikte değerlendirip ilk ihbarı canlandırın.","exercise_en":"Review a sample tank-filling log, high-level alarm and vent indications together; rehearse the first notification.","hazard_tr":"Doluluk göstergesine aşırı güvenilmesi veya yakıt taşması olan bölgeye korunmasız yaklaşım.","hazard_en":"Overreliance on the level indication or unprotected approach to an overflow area.","id":"C-1","source_full_tr":["Eğitici anlatım: Yakıt alımı veya tanklar arası transfer sırasında seviye göstergesinde beklenenden hızlı yükselme, yüksek seviye alarmı, tank havalığı/taşma hattı çevresinde sıvı belirtisi veya dolum planındaki beklenmedik fark taşma belirtisi olarak değerlendirilir. Bir tankın doluluk derecesi, transferin gerçekten o tanka yönelip yönelmediği ve ölçümün güvenilirliği birlikte incelenir. Personelin tehlikeli bölgeye yaklaşmadan nasıl ilk bildirim yapacağı öğretilir.","Bilgi noktaları: Kullanılabilir tank kapasitesiyle nominal kapasite arasındaki fark; dolum süresi hesabındaki belirsizlik; iskandil–seviye alarmı uyuşmazlığı; taşma/buhar hattının güverte üzerindeki çevresel etkisi. Seviye alarmı arızalıysa veya ölçümler çelişiyorsa devam kararı değil emniyetli durdurma ve değerlendirme esas alınır.","Sınanacak sorular: “Seviye artışı hangi tankta?”, “Hangi hat ve pompadan besleniyor?”, “İlk gözlem nerede yapıldı?”, “Denize ulaştığına ilişkin kanıt var mı?”"],"source_full_en":["Instructor's explanation: During bunkering or transfer between tanks, a faster-than-expected rise in the level indication, a high-level alarm, signs of liquid around a tank vent or overflow line, or an unexpected difference from the filling plan may indicate overflow. Consider the tank's filling level, whether the transfer is actually directed to that tank and the reliability of the measurement together. Teach the initial report without requiring personnel to approach a hazardous area.","Learning points: the difference between usable and nominal tank capacity, uncertainties in filling-time calculations, disagreement between soundings and level alarms, and the environmental effects of overflow or vent lines on deck. Where an alarm is defective or measurements conflict, the priority is safe suspension and assessment, not a decision to continue.","Questions to test: 'Which tank level is rising?', 'Which line and pump feed it?', 'Where was the first observation made?', and 'Is there evidence that oil reached the sea?'"],"source_integrity":"sha256_verified_against_embedded_blocks"},{"step":2,"title_tr":"Alarm, role organizasyonu ve ilk bildirim","title_en":"Activate communications and response roles","learning_tr":"Eğitici anlatım: Olayı ilk fark eden personel, ilgili nöbetçi zabiti ve operasyon sorumlusunu gecikmeden bilgilendirir. Kaptan talim senaryosuna göre organizasyon kararını verir.","learning_en":"Training narrative: The person first observing the event promptly informs the appropriate officer of the watch and operational supervisor. The master determines the drill organisation based on the scenario.","exercise_tr":"Güverte, makine ve köprüüstü arasındaki ihbar zincirini ve “kirlilik talimi” anonsunu rol kartlarıyla deneyin.","exercise_en":"Rehearse deck–engine–bridge reporting and the clearly identified pollution-drill announcement using role cards.","hazard_tr":"Talimin gerçek sızıntı bildirimiyle karışması veya ilgili transfer sorumlusunun habersiz kalması.","hazard_en":"Confusing a drill with a real spill alert or failing to notify the responsible transfer officer.","id":"C-2","source_full_tr":["Eğitici anlatım: Olayı ilk fark eden personel, ilgili nöbetçi zabiti ve operasyon sorumlusunu gecikmeden bilgilendirir. Kaptan talim senaryosuna göre organizasyon kararını verir. Uygun anonsla ekiplere “deniz kirliliği talimi” bildirimi yapılır; görevler gemi role cetveline göre açıklanır. Güverte ve makine ekiplerinin aynı emirleri farklı yorumlamasını önlemek için emir–tekrar–teyit yöntemi kullanılır.","Bilgi noktaları: Operasyon mahallindeki personelin yerinde kalma/uzaklaşma kararı; acil durum müdahale ekibinin katılımı; yangın–kirlilik arasında eşzamanlı risk; sahil yakıt alma birimiyle iletişim. Gerçek kirlilik ihbarı, deniz trafiği uyarısı veya liman yardım çağrısı tatbikat olarak işaretlenmeden gönderilmez.","Sınanacak sorular: “Durdurma emri kime iletilir?”, “Terminal/gemi tarafı arasında alındı teyidi nasıl sağlanır?”, “Kaptana ilk dakika özeti nedir?”"],"source_full_en":["Instructor's explanation: The person first identifying the problem informs the responsible watchkeeping officer and operation supervisor without delay. The master decides the organisation required by the scenario. An appropriate announcement identifies a 'marine pollution drill' and personnel duties are explained according to the muster list. Use order–read-back–confirmation to prevent deck and engineering teams interpreting the same orders differently.","Learning points: whether persons at the transfer site should remain or withdraw; participation of the emergency response team; simultaneous fire and pollution risks; and communication with the shore bunkering team. No real pollution notification, marine traffic warning or request for port assistance is transmitted without clearly identifying and authorising the exercise communication.","Questions to test: 'To whom is the stop order sent?', 'How is receipt confirmed between terminal and vessel?', and 'What does the master's first-minute situation report contain?'"],"source_integrity":"sha256_verified_against_embedded_blocks"},{"step":3,"title_tr":"Yakıt transferinin durdurulması ve emniyetli izolasyon","title_en":"Safely stop and isolate transfer","learning_tr":"Eğitici anlatım: Taşma belirtisi üzerine yakıt aktarma faaliyetinin uygun acil durdurma ve ayırma usulleri gözden geçirilir.","learning_en":"Training narrative: When overflow is suspected, relevant emergency stopping and isolation procedures for fuel transfer are reviewed.","exercise_tr":"Transfer planındaki pompa, hat ve sahil bağlantısı için durdurma ve teyit sırasını şema üzerinde tartışın; gerçek transferi etkilemeyin.","exercise_en":"Discuss the stop-and-confirm sequence for pumps, lines and shore connections on a transfer diagram without altering live transfer operations.","hazard_tr":"Yanlış pompa/valf kumandasıyla yakıt transferinin bozulması veya yeni taşma oluşması.","hazard_en":"Incorrect pump/valve operation disrupting a transfer or causing additional overflow.","id":"C-3","source_full_tr":["Eğitici anlatım: Taşma belirtisi üzerine yakıt aktarma faaliyetinin uygun acil durdurma ve ayırma usulleri gözden geçirilir. Hangi pompanın duracağı, hangi transfer hattının izole edileceği, sahil ve gemi tarafındaki karşılıklı sorumluluklar ve operasyonun yeniden başlamadan önce hangi koşullarda kontrol edileceği öğretilir. “Pompayı durdurmak” ile “basıncın tamamen kalkması” aynı olgu değildir.","Bilgi noktaları: Pompa stopu, ESD'nin gerçek işlevi ve tatbikat sınırlaması; geri akış/geri basma tehlikesi; tankın diğer devrelerle ilişkisi; geçici depolama; yanlış vanaya müdahale riski. Başka tanka transfer, ancak bağlantı, kapasite, tank uygunluğu, stabilite ve onaylı operasyon koşulları teyit edilerek yetkili sorumlu tarafından değerlendirilir. Bu bir otomatik eğitim emri değildir.","Sınanacak sorular: “Hangi işlem durduruldu?”, “Hangi hat hâlen basınç altında?”, “Alternatif tankın kapasitesi ve uygunluğu doğrulandı mı?”"],"source_full_en":["Instructor's explanation: Review suitable emergency shutdown and isolation procedures when overflow is suspected during fuel transfer. Teach which pump would stop, which transfer line would be isolated, the respective responsibilities of ship and shore, and the checks required before the operation could restart. Stopping a pump and fully relieving the line pressure are not the same thing.","Learning points: pump shutdown, the actual function of emergency shutdown (ESD) and drill limitations, backflow or back-pressure, connections to other tanks, temporary storage and the hazard of operating the wrong valve. Transferring to another tank is only considered by the authorised person after confirming piping, capacity, suitability, stability and approved operating conditions; it is not an automatic exercise order.","Questions to test: 'Which operation was stopped?', 'Which line may still be pressurised?', and 'Were the capacity and suitability of an alternative tank verified?'"],"source_integrity":"sha256_verified_against_embedded_blocks"},{"step":4,"title_tr":"Tank ve güverte sızıntı güzergâhının değerlendirilmesi","title_en":"Assess deck drainage and spill paths","learning_tr":"Eğitici anlatım: Taşmanın başladığı varsayılan tankın havalık/taşma yolu ile güverte üzerindeki sızıntı toplama kuyusu, damlama tepsisi, frengiler ve denize boşalabilecek yollar arasındaki ilişki incelenir.","learning_en":"Training narrative: The assumed overflowing tank's vent or overflow route is traced to deck containment wells, drip trays, scuppers and possible discharges to the sea.","exercise_tr":"Havalık, damlama tepsisi, frengi ve güverte drenajı boyunca olası akış yolunu kroki üzerinde izletin.","exercise_en":"Trace a hypothetical spill path from vents and drip trays through scuppers and deck drainage on a sketch.","hazard_tr":"Frengiden denize kontrolsüz boşalma veya kaygan/yanıcı yüzeye giriş.","hazard_en":"Uncontrolled discharge overboard or entry onto a slippery or flammable surface.","id":"C-4","source_full_tr":["Eğitici anlatım: Taşmanın başladığı varsayılan tankın havalık/taşma yolu ile güverte üzerindeki sızıntı toplama kuyusu, damlama tepsisi, frengiler ve denize boşalabilecek yollar arasındaki ilişki incelenir. Personel, denize yağ geçişini önlemek için kaynak–yayılım yolu–toplanma noktası zincirini şematik olarak açıklar. Yağın sıcak yüzeylere, yangın riski bulunan alana veya makine dairesine girmesi olasılığı ayrıca değerlendirilir.","Bilgi noktaları: Tank havalığının kontrolsüz kapatılmaması; uygun scupper tıkaçlarının kullanılması; kaygan yüzey, su birikmesi ve yangın suyu tahliyesi; yanıcı buharla güvenli çalışma mesafesi; personel giriş/çıkış güzergâhı.","Sınanacak sorular: “Yağ denize hangi yoldan ulaşabilir?”, “Hangi fiziksel bariyer bu yolu keser?”, “Bu tedbir başka hangi emniyet riskini artırabilir?”"],"source_full_en":["Instructor's explanation: Examine the relationship between the affected tank's vent or overflow path and deck spill wells, drip trays, scuppers and any route discharging to the sea. Crew describe the source–migration route–collection point chain to explain how oil may be kept from reaching the water. Consider separately the possibility that oil may reach hot surfaces, a fire-risk area or machinery spaces.","Learning points: do not close tank vents without control; suitable scupper plugs, slippery surfaces, standing water and drainage of firefighting water; safe working distance from flammable vapour; and personnel access and escape routes.","Questions to test: 'By which route could oil reach the sea?', 'Which physical barrier interrupts that route?', and 'What other safety risk could that precaution increase?'"],"source_integrity":"sha256_verified_against_embedded_blocks"},{"step":5,"title_tr":"İlk sınırlandırma, temiz malzemeyle tatbikat ve çevresel ölçüm","title_en":"Demonstrate containment with clean materials","learning_tr":"Eğitici anlatım: Kirlilik seti, emici ped, sosis bariyer, uygun kap ve taşınabilir temizleme araçlarının yerleri gösterilir. Temiz bir eğitim alanında malzemelerin yerleştirilme yöntemi anlatılır.","learning_en":"Training narrative: Locations of the spill response kit, absorbent pads, absorbent socks/booms, appropriate containers and portable cleanup equipment are shown. Placement methods are demonstrated in a clean training area.","exercise_tr":"Temiz emici ped, bariyer ve toplama kabını kuru eğitim alanında yerleştirtin; kullanılan malzemeyi tekrar saydırın.","exercise_en":"Set out clean absorbent pads, booms and collection containers in a dry training area; reconcile the equipment inventory afterwards.","hazard_tr":"Eğitim amacıyla gerçek yakıt dökülmesi; kontamine malzemeye uygunsuz temas.","hazard_en":"Deliberately spilling fuel for training or handling contaminated material without protection.","id":"C-5","source_full_tr":["Eğitici anlatım: Kirlilik seti, emici ped, sosis bariyer, uygun kap ve taşınabilir temizleme araçlarının yerleri gösterilir. Temiz bir eğitim alanında malzemelerin yerleştirilme yöntemi anlatılır. Gerçek yangın/kimyasal maruziyet riski bulunan bir alana yetkisiz personel girmez. Güvertede tutulabilen miktar, kaçak sürerken sızabileceği yollar ve gemi kenarındaki tehlikeler değerlendirilir.","Bilgi noktaları: Emici malzemelerin uyumluluğu, malzeme doygunluğu, ikincil kirlenme, güvenli depolama, fotoğraf ve not tutma; kirli malzemenin rastgele sintineye veya denize atılmaması.","Sınanacak sorular: “Bariyerin görevi kaynağı kapatmak mı yoksa yayılımı sınırlamak mı?”, “Kullanılmış ped nasıl toplanır?”, “Denize bulaşma hangi yöntemle gözlenir?”"],"source_full_en":["Instructor's explanation: Show the locations of pollution response kits, absorbent pads and booms, suitable containers and portable cleaning equipment. Demonstrate placement in a clean training area. Unauthorised personnel do not enter a location with an actual fire or chemical-exposure hazard. Assess the amount that may be contained on deck, possible escape routes while leakage continues and hazards alongside the ship.","Learning points: compatibility and saturation of absorbents, secondary contamination, safe storage, photographs and notes. Used contaminated materials are not discarded indiscriminately into bilges or overboard.","Questions to test: 'Does the barrier stop the source or contain its spread?', 'How is a used pad collected?', and 'How can contamination of the sea be observed?'"],"source_integrity":"sha256_verified_against_embedded_blocks"},{"step":6,"title_tr":"Denize yayılım varsa müdahale imkânlarının değerlendirilmesi","title_en":"Review response if release reaches the sea","learning_tr":"Eğitici anlatım: Taşmanın denize ulaştığı varsayılan ikinci olay gelişmesi üzerinden yağ lekesinin ilk tespiti, rüzgâr/akıntı koşulları, kıyıya ve hassas noktalara yaklaşım, bariyer ve skimmer imkânları değerlendirilir.","learning_en":"Training narrative: A second scenario assumes that overflow has reached the sea. Initial observation of the oil slick, wind and current, proximity to shore or sensitive sites, and available booms and skimmers are assessed.","exercise_tr":"Rüzgâr, akıntı ve hassas kıyı alanlarıyla ilgili örnek harita üzerinden bariyer ve geri kazanım seçeneklerini tartışın.","exercise_en":"Discuss containment and recovery options using a scenario chart showing wind, current and sensitive coastal areas.","hazard_tr":"Yetkisiz gemi dışı çalışma, riskli bot indirme veya dispersant kullanımı.","hazard_en":"Unauthorised overside work, unsafe boat launch or unapproved dispersant use.","id":"C-6","source_full_tr":["Eğitici anlatım: Taşmanın denize ulaştığı varsayılan ikinci olay gelişmesi üzerinden yağ lekesinin ilk tespiti, rüzgâr/akıntı koşulları, kıyıya ve hassas noktalara yaklaşım, bariyer ve skimmer imkânları değerlendirilir. Gemi dışına bariyer sermek, bot indirmek veya suda çalışma başlatmak ayrı risk ve izin gerektiren faaliyetlerdir. Talim sırasında gerçek yağ yüzeyde yayılmaz; ekipman yalnızca güvenli ise temiz uygulama olarak denenebilir.","Bilgi noktaları: Bariyerle çevreleme/yönlendirme; skimmerın yağ türüyle uyumu; toplanan yağ-su karışımının güvenli depolaması; gerekli kıyı desteği; personelin suya düşme ve halata kapılma riski. Kimyasal dispersant, yetkili makamın uygun görüşü olmadan kullanılamaz.","Sınanacak sorular: “Hava değiştiğinde bariyer planı nasıl etkilenir?”, “Ekipman yetmezse kimin yardımına başvurulur?”, “Atığın güvenli depolama alanı neresi olur?”"],"source_full_en":["Instructor's explanation: Introduce a second scenario in which overflow is presumed to have reached the sea. Assess first sightings of the oil slick, wind and current, proximity to shore and sensitive areas, and available booms and skimmers. Deploying a boom over the ship's side, launching a boat or working on the water are separate activities requiring their own risk assessment and authorisation. No real oil is released during the drill; clean equipment demonstrations are attempted only when safe.","Learning points: surrounding or diverting a slick with a boom, suitability of the skimmer for the oil type, safe storage of recovered oil–water mixtures, required shore support and risks of falling overboard or becoming caught in lines. Chemical dispersants must not be used without appropriate approval from the competent authority.","Questions to test: 'How would changed weather affect the boom plan?', 'Whose assistance would be requested if equipment is inadequate?', and 'Where would recovered waste be safely stored?'"],"source_integrity":"sha256_verified_against_embedded_blocks"},{"step":7,"title_tr":"SOPEP/ISM bildirim, koordinasyon ve senaryo kaydı","title_en":"Coordinate SOPEP/ISM reporting","learning_tr":"Eğitici anlatım: Kaptanın onaylı kirlilik planından hangi rapor, kıyı temas noktası ve takip iletişimini kullanacağı açıklanır.","learning_en":"Training narrative: The master identifies the reporting procedure, shore contacts and follow-up communications in the ship's approved pollution contingency plan.","exercise_tr":"SOPEP/ISM bildirim alanlarına örnek mevki, madde, miktar belirsizliği ve tedbirleri yazdırın; gerçek alıcıya mesaj göndermeyin.","exercise_en":"Populate example SOPEP/ISM fields for position, substance, quantity uncertainty and actions; do not send a live external report.","hazard_tr":"Tatbikat bildiriminin gerçek kirlilik olayı gibi dış kurumlara iletilmesi.","hazard_en":"Transmitting a simulated pollution event to authorities as an actual incident.","id":"C-7","source_full_tr":["Eğitici anlatım: Kaptanın onaylı kirlilik planından hangi rapor, kıyı temas noktası ve takip iletişimini kullanacağı açıklanır. Olayın tarih-saati, mevkii, kirletici türü, güvenilir miktar tahmini, hasar durumu, alınan tedbirler ve gereken yardım rapor yazımının asgari bilgi çekirdeği olarak öğretilir. Bir talimde gerçek makam araması yerine masa başı bildirim şeması veya önceden izin verilmiş “EXERCISE” haberleşmesi uygulanır.","Bilgi noktaları: İlk raporun belirsizlikleri açıklaması; sonraki raporda miktar ve alan tahmininin güncellenmesi; şirket/DPA/terminal/liman makamı rollerinin karıştırılmaması; gemideki SOPEP ulusal temas listesinin güncelliği.","Sınanacak sorular: “Kim raporu düzenler?”, “Tahmini miktarın kaynağı nedir?”, “Yetkili kıyı irtibatını hangi onaylı listeden buluruz?”"],"source_full_en":["Instructor's explanation: Explain which reports, shore contacts and follow-up communications the master would use under the approved shipboard pollution plan. Teach the basic incident report: date and time, position, pollutant type, reliable estimate of quantity, damage, measures taken and assistance required. During a drill, use a tabletop notification scheme or a previously authorised message explicitly marked 'EXERCISE' instead of calling actual authorities.","Learning points: stating uncertainty in the initial report, revising estimated quantity and affected area in subsequent updates, distinguishing the roles of company, designated person ashore (DPA), terminal and port authorities, and ensuring the SOPEP national contact list carried on board is current.","Questions to test: 'Who prepares the report?', 'What is the basis for the estimated quantity?', and 'Which approved list identifies the authorised shore contact?'"],"source_integrity":"sha256_verified_against_embedded_blocks"},{"step":8,"title_tr":"Talimin kapanışı, ekipman ve kayıtların gözden geçirilmesi","title_en":"Restore equipment, debrief and record","learning_tr":"Eğitici anlatım: Yağ kaçışı kaynağının kontrol altına alınması, müdahale malzemesinin sayımı, kullanılan/kirli ürünlerin ayrıştırılması, operasyonun güvenli koşullara dönmesi, eksikliklerin raporlanması ve günlük kayıtlarının…","learning_en":"At drill closeout, verify whether the assumed source was controlled, account for spill-response materials, segregate contaminated items, confirm safe operating conditions and report deficiencies. Review the ship's log and other applicable records, while making clear which actions were physically performed and which were simulated.","exercise_tr":"Müdahale seti sayımı, temiz/kirli malzeme ayrımı ve simülasyon kayıtlarının kapanış kontrolünü uygulayın.","exercise_en":"Check kit inventory, clean/contaminated material segregation and closure of simulation records.","hazard_tr":"Kirlilik atığının yanlış yönetimi veya yapılmamış işlerin petrol kayıt defterine işlenmesi.","hazard_en":"Improper waste handling or making fictitious Oil Record Book entries.","id":"C-8","source_full_tr":["Eğitici anlatım: Yağ kaçışı kaynağının kontrol altına alınması, müdahale malzemesinin sayımı, kullanılan/kirli ürünlerin ayrıştırılması, operasyonun güvenli koşullara dönmesi, eksikliklerin raporlanması ve günlük kayıtlarının tamamlanması değerlendirilir. Gerçek yakıt operasyonunun yeniden başlatılması, talim liderinin sözlü açıklamasıyla değil, yetkili operasyon kontrol sistemi ve gerekli teyitlerle mümkündür.","Rapor soruları: “Ne simüle edildi, ne fiilen gösterildi?”, “Gerçek kirlilik oluşturuldu mu?”, “Hangi ekipman kullanıldı/gösterildi?”, “Kaçak kaynağı ve denize yayılım durumu nasıl kaydedildi?”, “Düzeltici faaliyet açılması gerekli mi?”","Emniyet kriteri: Gerçek tank taşırılarak eğitim yapılmaz; herhangi bir acil stop, yakıt transferi, vana manevrası veya basınçlı hat müdahalesi, ancak onaylı işletme koşullarında gerçekleştirilir."],"source_full_en":["Instructor's explanation: Assess control of the source, accounting for response materials, separation of used and contaminated products, restoration of safe operating conditions, deficiency reports and completion of relevant log entries. Restarting an actual bunkering or transfer operation requires the authorised operational control system and necessary confirmations; it cannot be authorised by the drill leader's verbal explanation alone.","Report questions: 'What was simulated and what was actually demonstrated?', 'Was any real pollution produced?', 'Which equipment was used or demonstrated?', 'How were the source and the extent of marine spread recorded?', and 'Is corrective action required?'","Safety criterion: Do not deliberately overflow a real tank for training. Emergency stops, fuel transfer, valve operations and work on pressurised lines may be carried out only under approved operating conditions."],"source_integrity":"sha256_verified_against_embedded_blocks"}]},{"key":"pollution/leak","family":"pollution","flow":"leak","title_tr":"Sızıntı ve Döküntü","title_en":"Leak and Spill","family_title_tr":"Deniz Kirliliği","family_title_en":"Marine Pollution","stages":[{"step":1,"title_tr":"İlk sızıntı belirtisi, yer ve maddenin tanımlanması","title_en":"Locate and characterize a suspected leak","learning_tr":"Eğitici anlatım: Yağ lekesi, damlama, basınç değişikliği, anormal pompa davranışı, hazne/seviye düşmesi veya koku birer belirti olarak değerlendirilir. Müdahaleden önce kirletici türü ve kaynağa ilişkin güvenilir veri toplanır.","learning_en":"Training narrative: An oil stain, dripping, changed pressure, abnormal pump behaviour, falling reservoir level or unusual odour may indicate a leak.","exercise_tr":"Örnek fotoğraf ve alarm kayıtlarında sızıntı konumunu, maddeyi, debi belirtisini ve olası yangın etkisini ayrı belirletin.","exercise_en":"Use sample images and alarms to identify leak location, substance, rate indicators and possible fire implications separately.","hazard_tr":"Hidrolik basınç veya sıcak yağ tehlikesi olan kaçağa doğrudan yaklaşma.","hazard_en":"Approaching a leak that may involve pressurised hydraulic fluid or hot oil.","id":"D-1","source_full_tr":["Eğitici anlatım: Yağ lekesi, damlama, basınç değişikliği, anormal pompa davranışı, hazne/seviye düşmesi veya koku birer belirti olarak değerlendirilir. Müdahaleden önce kirletici türü ve kaynağa ilişkin güvenilir veri toplanır. Bir yüzeyin yağla ıslanması, sızıntının o noktadan çıktığını kanıtlamayabilir. Hidrolik yağ sızıntısında basınçlı mikro-jetin çıplak elle aranmasının ağır yaralanma riski taşıdığı açıklanır.","D-S1 özgülü: Manifold–hortum/boru–vana–pompa güzergâhı tanıtılır. D-S2 özgülü: Hidrolik güç ünitesi, basınç, hortum, aktüatör ve damlama havuzu ilişkisi gösterilir."],"source_full_en":["Instructor's explanation: Oil staining, dripping, pressure changes, abnormal pump behaviour, falling reservoir level or odour are assessed as possible leakage signs. Before intervention, gather reliable evidence about the pollutant and its source. An oil-wet surface does not prove the leak originates there. Explain the severe injury risk of searching for a high-pressure hydraulic pinhole jet with a bare hand.","D-S1-specific: Introduce the manifold, hose or pipeline, valve and pump route. D-S2-specific: Show relationships among the hydraulic power unit, pressure, hose, actuator and drip tray."],"source_integrity":"sha256_verified_against_embedded_blocks"},{"step":2,"title_tr":"Emniyetli ilk bildirim ve alan kontrolü","title_en":"Notify and secure the area","learning_tr":"Eğitici anlatım: İlk gören kişi ilgili operatör, nöbetçi zabit veya makine sorumlusuna güvenli mesafeden haber verir. Kaçağın boyutu, yaralanma olasılığı, yangın riski ve sürmekte olan işlemler bildirimde ayrıştırılır.","learning_en":"Training narrative: The first observer reports from a safe distance to the relevant operator, officer of the watch or engineering supervisor.","exercise_tr":"Güvenli mesafeden ilk haber verme, alan sınırlandırma ve personel yoklaması senaryosunu uygulayın.","exercise_en":"Rehearse notification from a safe distance, area isolation and personnel accounting.","hazard_tr":"Kaygan yüzey, tutuşma kaynağı ve kazazede riski değerlendirilmeden müdahale.","hazard_en":"Intervening before assessing slips, ignition sources and potential casualties.","id":"D-2","source_full_tr":["Eğitici anlatım: İlk gören kişi ilgili operatör, nöbetçi zabit veya makine sorumlusuna güvenli mesafeden haber verir. Kaçağın boyutu, yaralanma olasılığı, yangın riski ve sürmekte olan işlemler bildirimde ayrıştırılır. Uygun talim anonsu ve role katılımı sağlanır; yangın müdahale ekibinin nerede hazır bulunacağı ve hangi şartta yaklaşacağı role cetvelinden belirlenir.","D-S1 özgülü: Kıyı tesisi/karşı gemi operatörüyle eşzamanlı durdurma haberleşmesi öne çıkar. D-S2 özgülü: Hidrolik hareketin durdurulması, yükün emniyeti ve hareketli donanımdan uzak durma koşulları öne çıkar."],"source_full_en":["Instructor's explanation: The first observer informs the relevant operator, watchkeeping officer or engineering supervisor from a safe distance. The report distinguishes the scale of leakage, possible injury, fire danger and operations still in progress. Make the appropriate drill announcement and muster; use the muster list to determine where a firefighting team should stand by and under which conditions it may approach.","D-S1-specific: Prioritise simultaneous shutdown communication with a shore facility or another vessel's operator. D-S2-specific: Prioritise stopping hydraulic movement, securing a load and keeping personnel clear of moving equipment."],"source_integrity":"sha256_verified_against_embedded_blocks"},{"step":3,"title_tr":"Kaçağın kaynağını emniyetli biçimde izole etme","title_en":"Isolate source safely","learning_tr":"Eğitici anlatım: Operasyonu durdurmak, devreyi izole etmek ve artık enerjiyi emniyetli biçimde ele almak üç farklı iştir.","learning_en":"Training narrative: Stopping an operation, isolating a circuit and safely controlling stored energy are three distinct tasks.","exercise_tr":"Sistem şemasında durdurma, izolasyon ve artık enerjinin giderilmesini birbirinden ayrı işaretleyin.","exercise_en":"Mark stopping, isolation and residual-energy control as separate steps on a system diagram.","hazard_tr":"Pompa durduğu için hattın basınçsız olduğu sanılarak yanlış valf/bağlantı açılması.","hazard_en":"Opening a line under the false assumption that stopping the pump has removed pressure.","id":"D-3","source_full_tr":["Eğitici anlatım: Operasyonu durdurmak, devreyi izole etmek ve artık enerjiyi emniyetli biçimde ele almak üç farklı iştir. Sistemin şeması ve üreticinin prosedürü kullanılır; durdurulmuş pompanın hattı da basınç veya sıcak sıvı içerebilir. Personel, yaklaşmadan önce uygun koruma ve güvenli çalışma alanı sınırını değerlendirir.","D-S1 özgülü: Transfer stopu, kıyı ve gemi ESD sorumluluğu, kapalı bağlantı altında yağ birikmesi, hortum ayrılmasının tehlikeleri öğretilir. D-S2 özgülü: Hidrolik hatlarda basınç boşaltma, askıda yük, aktüatör hareketi ve enerjisiz durumun teyidi özel konudur. Gerçek basınç boşaltma/onarım yalnızca yetkili bakım usulüyle yapılır."],"source_full_en":["Instructor's explanation: Stopping an operation, isolating the circuit and safely managing stored energy are three distinct activities. Use the system diagram and manufacturer's procedure; a line may still contain pressure or hot liquid after its pump has stopped. Personnel assess appropriate protection and the boundary of a safe working area before approaching.","D-S1-specific: Teach transfer shutdown, ship and shore ESD responsibilities, oil trapped within a closed connection and the hazards of disconnecting a hose. D-S2-specific: Pressure relief in hydraulic lines, suspended loads, actuator movement and confirmation of a de-energised state are particular subjects. Actual pressure release or repair is carried out only under authorised maintenance procedures."],"source_integrity":"sha256_verified_against_embedded_blocks"},{"step":4,"title_tr":"Döküntünün akış yönünü ve güverte drenajını inceleme","title_en":"Check flow paths and deck drains","learning_tr":"Eğitici anlatım: Döküntünün yerçekimi, güverte eğimi, yağmur/yangın suyu, rüzgâr ve gemi hareketi etkisiyle hangi toplanma noktasına ulaştığı değerlendirilir.","learning_en":"Training narrative: Consider how gravity, deck slope, rain or firefighting water, wind and ship movement determine where a spill collects. Show scuppers, oil collection points and connections from deck drainage to the sea.","exercise_tr":"Güverte eğimi ve suyun etkisiyle varsayımsal döküntünün drenaja ilerlemesini plan üzerinde izletin.","exercise_en":"Trace a hypothetical spill path towards drainage on a deck plan, including slope and water effects.","hazard_tr":"Kirliliğin denize yönelmesi veya kirli yüzeyin kayma/yangın tehlikesinin göz ardı edilmesi.","hazard_en":"Allowing pollution to reach the sea or overlooking slip and fire hazards.","id":"D-4","source_full_tr":["Eğitici anlatım: Döküntünün yerçekimi, güverte eğimi, yağmur/yangın suyu, rüzgâr ve gemi hareketi etkisiyle hangi toplanma noktasına ulaştığı değerlendirilir. Frengiler, yağ toplama kuyuları ve drenajın denize bağlantısı gösterilir. Emici sosis/pedlerin sızıntıyı kökten durdurmadığı, ancak yayılımı sınırlayabildiği anlatılır.","D-S1 özgülü: Manifold çevresi damlama tepsisi ve istasyon sınırı. D-S2 özgülü: Vinç/hidrolik donanım altı, hareketli yük yolları ve yağın halat–güverte temasına etkisi."],"source_full_en":["Instructor's explanation: Assess where oil would collect under the combined influence of gravity, deck slope, rainwater or firewater, wind and ship motion. Show scuppers, oil-collection wells and the connection of deck drains to the sea. Absorbent socks or pads may limit spread but do not eliminate the underlying leak.","D-S1-specific: Drip trays around the manifold and the operating-station boundary. D-S2-specific: Areas beneath cranes or hydraulic equipment, moving-load routes and the effect of oil on contact between lines and decks."],"source_integrity":"sha256_verified_against_embedded_blocks"},{"step":5,"title_tr":"Temiz müdahale malzemesiyle ilk sınırlandırma","title_en":"Rehearse containment using clean materials","learning_tr":"Eğitici anlatım: Sızıntı kiti, emici ped, bariyer, geçici toplama kabı ve uygun kıvılcım güvenliği bulunan ekipmanın kullanımı gösterilir.","learning_en":"Training narrative: Demonstrate a spill kit, pads, booms, temporary recovery containers and suitable spark-safe equipment.","exercise_tr":"Temiz emicilerle maket üzerinde sınırlandırma ve uygun KKD seçimi gösterin; gerçek yağ kullanılmasın.","exercise_en":"Demonstrate containment on a mock-up using clean absorbents and appropriate PPE; do not use real oil.","hazard_tr":"Kontamine emicilere korunmasız temas, kıvılcım kaynağı veya uygunsuz atık torbası.","hazard_en":"Unprotected contact with contaminated sorbents, ignition sources or unsuitable waste containers.","id":"D-5","source_full_tr":["Eğitici anlatım: Sızıntı kiti, emici ped, bariyer, geçici toplama kabı ve uygun kıvılcım güvenliği bulunan ekipmanın kullanımı gösterilir. Personelin uygun KKD'yi seçmesi, güvenli alanı belirlemesi ve temiz malzemeyi maket üzerinde serme/toplama yöntemini öğrenmesi amaçlanır. Gerçek yağ kullanılmaz; kirlenmiş malzemenin kontrolsüz taşınması veya güverte drenajına itilmesi uygun değildir.","Eğitim soruları: “Malzeme kapasitesi yetersizse ne yapılır?”, “Kullanılmış malzeme hangi işaretli kaba alınır?”, “Hangi durumda kıyı ekibi çağrılır?”"],"source_full_en":["Instructor's explanation: Demonstrate a spill kit, absorbent pads, barriers, temporary collection containers and suitable equipment with appropriate ignition protection. The objective is to teach personnel to choose suitable PPE, identify a safe area and place or recover clean materials on a mock-up. No real oil is used; contaminated material must not be moved without control or pushed into deck drainage.","Training questions: 'What happens if the material capacity is insufficient?', 'Which marked container receives used material?', and 'When should a shore response team be called?'"],"source_integrity":"sha256_verified_against_embedded_blocks"},{"step":6,"title_tr":"Denize yayılım, bariyer/geri kazanım ve çevresel öncelikler","title_en":"Assess potential marine spread and recovery","learning_tr":"Eğitici anlatım: Kaçağın bordadan suya ulaşması varsayıldığında uygun kirlilik raporu ve saha değerlendirmesi yapılır.","learning_en":"Training narrative: If the scenario assumes that the leak passes over the side into the water, an appropriate pollution report and scene assessment are planned.","exercise_tr":"Hayalî denize yayılım için rüzgâr/akıntı verileriyle bariyer, geri kazanım ve kıyı koruma seçeneklerini karşılaştırın.","exercise_en":"Compare boom, recovery and shoreline-protection options for a simulated overboard spill using wind/current data.","hazard_tr":"Uygun olmayan deniz koşullarında borda dışına çıkma veya botla müdahale.","hazard_en":"Overside or boat intervention in unsuitable sea conditions.","id":"D-6","source_full_tr":["Eğitici anlatım: Kaçağın bordadan suya ulaşması varsayıldığında uygun kirlilik raporu ve saha değerlendirmesi yapılır. Gemi dışına güvenli erişim, rüzgâr/akıntı, dalga, kıyı hassasiyeti, gemi trafiği ve personel emniyeti birlikte düşünülür. Bariyer ve skimmer kullanımına otomatik geçilmez; eldeki araçların yetenekleri ve güvenlik sınırları önceden incelenir.","D-S1 özgülü: Liman/yakıt istasyonu yakınında kıyı desteği ve terminal koordinasyonu. D-S2 özgülü: Lokal hidrolik yağ miktarı belirsizliği ve kaynağın yeniden basınçlanma ihtimali."],"source_full_en":["Instructor's explanation: If leakage is assumed to reach the water alongside, consider the appropriate pollution report and on-scene assessment. Safe outboard access, wind and current, waves, coastal sensitivity, shipping traffic and personnel safety are assessed together. Do not move automatically to boom or skimmer operations: first consider the capacity and safety limitations of the equipment available.","D-S1-specific: Shore assistance and terminal coordination near a port or bunkering station. D-S2-specific: Uncertainty about the amount of local hydraulic oil and the possibility that the source becomes pressurised again."],"source_integrity":"sha256_verified_against_embedded_blocks"},{"step":7,"title_tr":"Kurumsal ve kıyı koordinasyonu, olay veri seti","title_en":"Coordinate shore and company reporting","learning_tr":"Eğitici anlatım: Kaptanın onaylı SOPEP/SMPEP ve ISM zincirine göre hangi bilgileri topladığı anlatılır. Gemi adı/konum/saat, kirletici türü, tahmini miktar, etkilenen alan, durdurulan işlemler, yangın/güvenlik etkisi, istenen…","learning_en":"Review the information gathered under the master's approved SOPEP/SMPEP and ISM reporting chain: vessel identity, position and time, pollutant, estimated volume, affected area, stopped operations, fire or safety implications, assistance required and initial response. An incident report may be updated as additional evidence becomes available. External drill communications require prior authorisation and an explicit EXERCISE designation; otherwise practise them in a tabletop simulation.","exercise_tr":"Kaptan, SOPEP/SMPEP ve kurum içi haberleşme zincirini örnek bildirim formunda eşleştirin.","exercise_en":"Map the master, SOPEP/SMPEP and company communication chain onto a sample notification form.","hazard_tr":"Yanlış miktar/konum bildirmek veya talim sırasında gerçek dış bildirim yapmak.","hazard_en":"Reporting an inaccurate quantity/position or sending a false external notification during a drill.","id":"D-7","source_full_tr":["Eğitici anlatım: Kaptanın onaylı SOPEP/SMPEP ve ISM zincirine göre hangi bilgileri topladığı anlatılır. Gemi adı/konum/saat, kirletici türü, tahmini miktar, etkilenen alan, durdurulan işlemler, yangın/güvenlik etkisi, istenen yardım ve ilk müdahale raporlanır. Olay raporu ve takip bildirimlerinin farklı zamanlarda güncellenebileceği öğretilir.","Talim uygulaması: Gerçek makamlarla irtibat kurulacaksa ön izin, TALİM/EXERCISE tanımı ve iletişim planı gerekir; aksi hâlde dış bildirim masa başında simüle edilir."],"source_full_en":["Instructor's explanation: Explain what information the master collects under the approved SOPEP/SMPEP and SMS chain. Report the ship's name, position and time, pollutant type, estimated quantity, area affected, operations stopped, fire or safety consequences, assistance required and initial response. Teach that the incident report and subsequent notifications may be updated at different times.","Exercise application: If actual authorities are to be contacted, prior permission, an explicit DRILL/EXERCISE identification and a communication plan are required; otherwise the external notification is simulated at a tabletop exercise."],"source_integrity":"sha256_verified_against_embedded_blocks"},{"step":8,"title_tr":"Emniyetli kapanış, bakım ve rapor yazımına hazırlık","title_en":"Close, restore and prepare records","learning_tr":"Eğitici anlatım: Sızıntının durdurulup durdurulmadığı, sistemin emniyetli yeniden devreye alınma şartları, temizlenen/temizlenemeyen alan, kontamine malzeme, ekipman sayımı, kaza veya tatbikat tutanağı ve gerekli bakım/düzeltici…","learning_en":"Review whether the source of leakage was stopped, requirements for safe recommissioning, cleaned and uncleaned areas, contaminated materials, equipment accountability, incident or drill documentation, and maintenance or corrective actions. Never report assumed repair or equipment tests as accomplished. The debrief asks what source was confirmed, whether a transfer was actually stopped, whether pollution reached the water and what follow-up remains.","exercise_tr":"Kaynak izolasyonu, kirli malzeme, bakım ihtiyacı ve güvenli yeniden işletmeye alma şartlarını kapanış kontrol listesinde tartışın.","exercise_en":"Review source isolation, contaminated material, maintenance needs and safe return-to-service conditions on a closure checklist.","hazard_tr":"Onarım tamamlanmadan sistemi devreye alma veya simülasyonu bakım kaydı gibi işleme.","hazard_en":"Restarting a system before repair is verified, or logging a simulated repair as completed work.","id":"D-8","source_full_tr":["Eğitici anlatım: Sızıntının durdurulup durdurulmadığı, sistemin emniyetli yeniden devreye alınma şartları, temizlenen/temizlenemeyen alan, kontamine malzeme, ekipman sayımı, kaza veya tatbikat tutanağı ve gerekli bakım/düzeltici faaliyetler değerlendirilir. Eğer senaryo ekipman arızası içeriyorsa, onarım ve deneme işlemleri eğitim metninde otomatik yapılmış gösterilmez.","Rapor soruları: “Kaynak neresiydi ve nasıl teyit edildi?”, “Transfer veya hidrolik operasyon gerçekten durduruldu mu, yoksa gösterildi mi?”, “Suya geçiş gözlendi mi, yoksa olay senaryosunda mı varsayıldı?”, “Müdahale malzemeleri nasıl kullanıldı?”, “Hangi takip işlemi gerekli?”"],"source_full_en":["Instructor's explanation: Assess whether the leak has stopped, prerequisites for safe restart, cleaned and uncleared areas, contaminated materials, equipment inventory, incident or exercise account and required maintenance or corrective actions. If the scenario includes an equipment defect, repair and testing must not automatically be described in the training narrative as actions already performed.","Report questions: 'Where was the source and how was it verified?', 'Was the transfer or hydraulic operation actually stopped or only demonstrated?', 'Was oil observed entering the water or merely presumed in the scenario?', 'How were response materials used?', and 'What follow-up action is required?'"],"source_integrity":"sha256_verified_against_embedded_blocks"}]},{"key":"lifeboat/lifeboat","family":"lifeboat","flow":"lifeboat","title_tr":"Can Filikası Eğitimi (varsa)","title_en":"Lifeboat Familiarization (if fitted)","family_title_tr":"Filika İndirme / Manevra","family_title_en":"Lifeboat Launching and Manoeuvring","stages":[{"step":1,"title_tr":"Filika türü, talim amacı ve acil durum bağlamı açıklanır","title_en":"Identify lifeboat type, aim and scope","learning_tr":"Ne öğretilir? Talimin amacı, geminin terk edilmesi gerektiğinde filikanın nasıl görevlendirildiğini, hangi personelin indirme işleminden sorumlu olduğunu ve ekipmanın hangi durumda hazır tutulacağını öğretmektir.","learning_en":"What is taught? The purpose of the drill is to teach how a lifeboat is assigned for abandoning ship, which personnel are responsible for launching and what readiness condition must be maintained.","exercise_tr":"Geminin genel yerleşim ve role planı üzerinden filika istasyonları, alternatif yaklaşma güzergâhları, kararma halinde erişim ve görev değişimi konuşulur. İndirme yapılacaksa yerel izinler, uygun operasyon sahası ve hava/deniz koşulları ayrıca değerlendirilir. Bu ilk aşamada gerçek indirme taahhüt edilmez; hangi yöntemlerin emniyetle gösterilebileceği kararlaştırılır. Gemi personeline “filika tertibi sizce hangi kritik kusurlarda kullanılmaz?” sorusu yöneltilerek değerlendirme becerisi ölçülür.","exercise_en":"Practice or demonstration: Lifeboat stations, alternative access routes, access during a blackout and relief of assigned duties are discussed using the general-arrangement and muster plans. If a launch is contemplated, local permissions, a suitable operating area and weather/sea conditions are assessed separately. An actual launch is not promised at this stage; the team decides which methods can safely be demonstrated. Personnel are asked, 'Under which critical defects would you consider this lifeboat arrangement unsafe to operate?' to test their judgment.","hazard_tr":"Dikkat edilecek risk: Kurtarma botunun filika gibi kabul edilmesi, onaylı olmayan botun terk kapasitesine eklenmesi, indirme sisteminin gerçek modelini bilmeden genel bir hareket sırası uygulanması. Bağlantılı kartlar: LB-C01, LB-C02, ABANDON_COMMON.","hazard_en":"Hazards to consider: Treating a rescue boat as a lifeboat, adding a craft without approved abandonment capacity to the ship's survival capacity, or applying a generic operating sequence without knowing the actual launching model. Related cards: LB-C01, LB-C02 and ABANDON_COMMON.","id":"01","source_full_tr":["Ne öğretilir? Talimin amacı, geminin terk edilmesi gerektiğinde filikanın nasıl görevlendirildiğini, hangi personelin indirme işleminden sorumlu olduğunu ve ekipmanın hangi durumda hazır tutulacağını öğretmektir. Can filikası, can salı ve kurtarma botunun görev farkları açıklanır. Geminin onaylı emniyet donanım planında hangi filikanın, nerede, kaç kişilik ve hangi indirme tertibatıyla bulunduğu belirlenir. Filika türünün mataforalı mı serbest düşüşlü mü olduğu, sonraki tüm aşamaları değiştirir.","Uygulama veya gösterim: Geminin genel yerleşim ve role planı üzerinden filika istasyonları, alternatif yaklaşma güzergâhları, kararma halinde erişim ve görev değişimi konuşulur. İndirme yapılacaksa yerel izinler, uygun operasyon sahası ve hava/deniz koşulları ayrıca değerlendirilir. Bu ilk aşamada gerçek indirme taahhüt edilmez; hangi yöntemlerin emniyetle gösterilebileceği kararlaştırılır. Gemi personeline “filika tertibi sizce hangi kritik kusurlarda kullanılmaz?” sorusu yöneltilerek değerlendirme becerisi ölçülür.","Dikkat edilecek risk: Kurtarma botunun filika gibi kabul edilmesi, onaylı olmayan botun terk kapasitesine eklenmesi, indirme sisteminin gerçek modelini bilmeden genel bir hareket sırası uygulanması. Bağlantılı kartlar: LB-C01, LB-C02, ABANDON_COMMON."],"source_full_en":["What is taught? The purpose is to explain how a lifeboat is assigned during abandonment, who is responsible for launching it and in what condition the equipment must be kept ready. Distinguish the duties of lifeboats, liferafts and rescue boats. Using the approved safety equipment plan, identify which lifeboat is carried, its station, capacity and launching arrangement. Whether the lifeboat is davit-launched or free-fall changes all subsequent stages.","Application or demonstration: Review lifeboat stations, alternative access routes, accessibility during a blackout and substitution of assigned personnel using the ship's general arrangement and muster plan. If launching is considered, assess local permissions, a suitable operating area and weather and sea conditions separately. No actual launch is promised at this initial stage; decide what can safely be demonstrated. Ask the crew: 'Which critical defects would make the lifeboat arrangement unfit for use?' to assess judgment.","Hazards: Mistaking a rescue boat for a lifeboat, including an unapproved craft in abandon-ship capacity, or applying a generic movement sequence without knowing the actual launching system model. Related cards: LB-C01, LB-C02, ABANDON_COMMON."],"source_integrity":"sha256_verified_against_embedded_blocks"},{"step":2,"title_tr":"Risk değerlendirmesi, görevlendirme ve durdurma kriterleri belirlenir","title_en":"Assess risks and stop-work criteria","learning_tr":"Ne öğretilir? Fiziksel indirme, motor çalıştırma ve su üstü manevranın her biri farklı risk yaratır. Kaptan veya görevlendirilen yetkili zabit, talim kapsamını “yalnız eğitim”, “insansız indirme”, “asgari işletme ekibiyle…","learning_en":"Launching, running an engine and manoeuvring a lifeboat afloat each create distinct hazards. The master or authorised officer establishes the feasible scope of participation—classroom training, an unmanned launch, a launch with minimum operating crew, or an approved free-fall simulation—based on the actual equipment and conditions, not simply to tick a calendar item. During the toolbox talk, identify the officer, boat commander, launching operator, engine operator, lookout and communications personnel, and review weather, vessel motion, equipment and crew competence.","exercise_tr":"İşbaşı konuşmasında görevli zabit, filika kumandanı, matafora operatörü, motor operatörü, gözcü ve haberleşme personeli tek tek belirlenir. Çevre koşulları, gemi hareketi, alanın başka operasyonlara açık olması, malzeme bütünlüğü, servis belgelerinin güncelliği ve personelin yeterliliği gözden geçirilir. Talimi durdurma kelimesi/işareti, bu komutu kimin ileteceği ve kimin hangi şartta faaliyeti durduracağı açıklanır. Fiziksel eylem yerine yalnız gösterim yapılmasına yol açan sebepler ayrıca not edilir.","exercise_en":"Practice or demonstration: During the toolbox briefing, the responsible officer, boat commander, davit operator, engine operator, safety observer and communications personnel are identified individually. Weather, ship motion, concurrent operations, equipment integrity, validity of service documents and personnel competence are reviewed. The stop word or signal, who may issue it and the conditions requiring suspension are explained. Reasons for choosing demonstration instead of physical operation are recorded separately.","hazard_tr":"Dikkat edilecek risk: Belirsiz emir komutası, eksik ehliyet, yetersiz gözcü, hava koşullarının hızla değişmesi ve talim sırasında hizmet/seyir görevlerinin çakışması. Bağlantılı kartlar: LB-C05, LB-C06, BOAT_LAUNCH_COMMON.","hazard_en":"Hazards to consider: Unclear command authority, inadequate qualifications, insufficient lookout or supervision, rapidly changing weather, and conflict with other service or navigation duties. Related cards: LB-C05, LB-C06 and BOAT_LAUNCH_COMMON.","id":"02","source_full_tr":["Ne öğretilir? Fiziksel indirme, motor çalıştırma ve su üstü manevranın her biri farklı risk yaratır. Kaptan veya görevlendirilen yetkili zabit, talim kapsamını “yalnız eğitim”, “insansız indirme”, “asgari işletme ekibiyle indirme” veya “üreticinin izin verdiği serbest düşüş simülasyonu” gibi ayrı yapılabilirlik düzeylerinde belirler. Seçim, yalnızca takvimdeki kutuyu tamamlamak için yapılmaz.","Uygulama veya gösterim: İşbaşı konuşmasında görevli zabit, filika kumandanı, matafora operatörü, motor operatörü, gözcü ve haberleşme personeli tek tek belirlenir. Çevre koşulları, gemi hareketi, alanın başka operasyonlara açık olması, malzeme bütünlüğü, servis belgelerinin güncelliği ve personelin yeterliliği gözden geçirilir. Talimi durdurma kelimesi/işareti, bu komutu kimin ileteceği ve kimin hangi şartta faaliyeti durduracağı açıklanır. Fiziksel eylem yerine yalnız gösterim yapılmasına yol açan sebepler ayrıca not edilir.","Dikkat edilecek risk: Belirsiz emir komutası, eksik ehliyet, yetersiz gözcü, hava koşullarının hızla değişmesi ve talim sırasında hizmet/seyir görevlerinin çakışması. Bağlantılı kartlar: LB-C05, LB-C06, BOAT_LAUNCH_COMMON."],"source_full_en":["What is taught? Physical launching, running the engine and manoeuvring on the water create distinct risks. The master or authorised officer defines the exercise at an appropriate level, such as classroom instruction only, unmanned launching, launching with the minimum operating crew, or a manufacturer-permitted free-fall simulation. The choice must not be made simply to tick a calendar box.","Application or demonstration: At the pre-job briefing, identify the responsible officer, coxswain, davit operator, engine operator, lookout and communications personnel. Review conditions, ship motion, competing operations, equipment integrity, service-document validity and crew competence. Explain the stop-work word or signal, who gives it and who can halt the activity under which conditions. Record separately why a demonstration may replace physical operation.","Hazards: Unclear command, insufficient qualification, inadequate lookout, rapidly changing weather and conflicts with other service or navigational duties. Related cards: LB-C05, LB-C06, BOAT_LAUNCH_COMMON."],"source_integrity":"sha256_verified_against_embedded_blocks"},{"step":3,"title_tr":"Filika, motor, istasyon ve indirme tertibatı teknik yönden tanıtılır","title_en":"Familiarize crew with craft and launching gear","learning_tr":"Ne öğretilir? Filika gövdesi, can kurtarma donanımı, oturma ve kemer düzeni, motor, aküler, yakıt/soğutma bileşenleri, matafora, telli askı veya serbest düşüş düzeni ve bırakma mekanizmasının görevleri açıklanır.","learning_en":"What is taught? Explain the purpose of the hull, survival equipment, seating and restraints, engine, batteries, fuel/cooling parts, davit, falls or free-fall arrangements, and release gear.","exercise_tr":"Personel filika çevresinde emniyetli güzergâhtan yürür; kumanda ünitesi, indirme tertibatının riskli hareket alanı ve modelin üretici talimatına ait resimler gösterilir. Gerekli hallerde mevcut ekipman kayıtları üzerinden son kontrol ve servis durumu okunur. Motorla ilgili teorik kontrol, gerçek çalışma veya yakıt sistemine müdahale ile eş tutulmaz. Talim öncesi kusur görülürse ilgili kişiye bildirilir ve fiziksel uygulamanın yapılıp yapılmayacağı yeniden değerlendirilir.","exercise_en":"Practice or demonstration: Personnel walk around the boat by a safe route and are shown its control station, hazardous moving envelope and manufacturer drawings for the particular model. Where needed, the latest inspection and service records are reviewed. Explaining engine checks in theory is not equivalent to actually starting the engine or working on its fuel system. If defects are found, they are reported and the suitability of physical operation reassessed.","hazard_tr":"Dikkat edilecek risk: Yük altında askı donanımına müdahale, emniyet çubuğu/kanca üzerinde yetkisiz işlem, kirli veya kapalı mahalde motoru uygunsuz çalıştırma. Bağlantılı kartlar: LB-C03, LB-C04, LB-C08, LB-C14.","hazard_en":"Hazards to consider: Handling a loaded suspension arrangement, unauthorised intervention on safety pins or hooks, or operating the engine improperly in a dirty or enclosed space. Related cards: LB-C03, LB-C04, LB-C08 and LB-C14.","id":"03","source_full_tr":["Ne öğretilir? Filika gövdesi, can kurtarma donanımı, oturma ve kemer düzeni, motor, aküler, yakıt/soğutma bileşenleri, matafora, telli askı veya serbest düşüş düzeni ve bırakma mekanizmasının görevleri açıklanır. Gözle görülebilen hasar, uygunsuz paslanma, aşınma, kaçak, eksik etiket, bozulmuş haberleşme veya servise ilişkin eksik belge talim öncesi karar için önemlidir. Haftalık/aylık kontrolün yetkili servis operasyonel testinden ayrı olduğu belirtilir.","Uygulama veya gösterim: Personel filika çevresinde emniyetli güzergâhtan yürür; kumanda ünitesi, indirme tertibatının riskli hareket alanı ve modelin üretici talimatına ait resimler gösterilir. Gerekli hallerde mevcut ekipman kayıtları üzerinden son kontrol ve servis durumu okunur. Motorla ilgili teorik kontrol, gerçek çalışma veya yakıt sistemine müdahale ile eş tutulmaz. Talim öncesi kusur görülürse ilgili kişiye bildirilir ve fiziksel uygulamanın yapılıp yapılmayacağı yeniden değerlendirilir.","Dikkat edilecek risk: Yük altında askı donanımına müdahale, emniyet çubuğu/kanca üzerinde yetkisiz işlem, kirli veya kapalı mahalde motoru uygunsuz çalıştırma. Bağlantılı kartlar: LB-C03, LB-C04, LB-C08, LB-C14."],"source_full_en":["What is taught? Introduce lifeboat hull, survival equipment, seats and restraints, engine, batteries, fuel and cooling arrangements, davit, falls or free-fall arrangements and release mechanism. Visible damage, inappropriate corrosion, wear, leakage, missing labels, defective communications or missing service records are relevant to pre-drill decisions. Distinguish weekly or monthly checks from an operational test performed by authorised service personnel.","Application or demonstration: Personnel follow a safe route around the craft and identify the control station, hazardous moving parts of the launch arrangement and the manufacturer's illustrations for the actual model. Review the latest checks and service status in the equipment records where necessary. A theoretical engine check is not the same as running the engine or intervening in the fuel system. Report observed defects and reconsider whether the physical exercise may proceed.","Hazards: Intervention on suspension components under load, unauthorised work on safety bars or hooks, or unsafe engine operation in a dirty or enclosed space. Related cards: LB-C03, LB-C04, LB-C08, LB-C14."],"source_integrity":"sha256_verified_against_embedded_blocks"},{"step":4,"title_tr":"Köprüüstü, indirme istasyonu ve filika arasında haberleşme kurulur","title_en":"Establish communications between stations","learning_tr":"Ne öğretilir? Filikanın suya indirilmesi yalnızca indirme operatörünün işlemi değildir; köprüüstü, güverte, filika kumandanı ve emniyet gözcüsü aynı durumsal farkındalığı paylaşır.","learning_en":"What is taught? Launching is not solely the davit operator's task: bridge, deck team, lifeboat commander and safety observer must share situational awareness.","exercise_tr":"Ekipler filikanın indirileceği borda, su sahası ve destek ekibinin konumu hakkında aynı bilgiye sahip olduğunu gösterir. Görevli personel örnek “hazırlık”, “bekle”, “dur”, “iletişim kontrolü” türü haberleşmeleri gerçek kumanda vermeksizin tatbik eder. İşbaşı konuşmasında, gemi köprüüstüne haber verilmeden yapılan lokaldeki herhangi bir hareketin bütün manevrayı etkileyebileceği vurgulanır. Telsizler eğitim kanalında veya uygun dahili modda gösterilir; tehlike haberleşmesi gönderilmez.","exercise_en":"Practice or demonstration: Teams demonstrate shared knowledge of the intended ship's side, water area and support-team locations. Sample 'prepare', 'stand by', 'stop' and 'communications check' messages are rehearsed without issuing actual machinery commands. The briefing emphasises how local movement without bridge notification could affect the entire operation. Radios are demonstrated on an approved exercise channel or internal mode; no distress transmission is made.","hazard_tr":"Dikkat edilecek risk: Kumanda odasından komut verilirken indirme alanında kişinin bulunması, tek bir telsize bağımlılık ve iki takımın aynı anda farklı emir alması. Bağlantılı kartlar: LB-C06, LB-C10, MOB_SAR_COMMON.","hazard_en":"Hazards to consider: People in the launch area when a command is issued remotely, dependence on one radio and conflicting orders received by different teams. Related cards: LB-C06, LB-C10 and MOB_SAR_COMMON.","id":"04","source_full_tr":["Ne öğretilir? Filikanın suya indirilmesi yalnızca indirme operatörünün işlemi değildir; köprüüstü, güverte, filika kumandanı ve emniyet gözcüsü aynı durumsal farkındalığı paylaşır. Telsiz/telefon, el işareti veya sesli ikaz gibi iletişim kanalları geminin düzenine göre seçilir. Kritik emirlerde geri okuma ve teyit yöntemi kullanılır. Kesilen haberleşme veya belirsiz emir, işlemi emniyetli durumda durdurma nedenidir.","Uygulama veya gösterim: Ekipler filikanın indirileceği borda, su sahası ve destek ekibinin konumu hakkında aynı bilgiye sahip olduğunu gösterir. Görevli personel örnek “hazırlık”, “bekle”, “dur”, “iletişim kontrolü” türü haberleşmeleri gerçek kumanda vermeksizin tatbik eder. İşbaşı konuşmasında, gemi köprüüstüne haber verilmeden yapılan lokaldeki herhangi bir hareketin bütün manevrayı etkileyebileceği vurgulanır. Telsizler eğitim kanalında veya uygun dahili modda gösterilir; tehlike haberleşmesi gönderilmez.","Dikkat edilecek risk: Kumanda odasından komut verilirken indirme alanında kişinin bulunması, tek bir telsize bağımlılık ve iki takımın aynı anda farklı emir alması. Bağlantılı kartlar: LB-C06, LB-C10, MOB_SAR_COMMON."],"source_full_en":["What is taught? Launching a lifeboat is not merely an action by the lowering operator: the bridge, deck team, coxswain and safety lookout must share the same situational awareness. Select radio, telephone, hand signals or verbal warnings according to the vessel's arrangement. Read-back and confirmation are used for critical orders. Lost communications or ambiguous commands require the operation to be stopped in a safe condition.","Application or demonstration: Teams demonstrate a common understanding of the side to be used, water area and support-team position. Personnel practise example communications such as 'prepare', 'stand by', 'stop' and 'radio check' without operating actual controls. The briefing emphasises that local movement without informing the bridge can affect the entire manoeuvre. Radios are demonstrated on a training channel or appropriate internal mode; no distress transmission is sent.","Hazards: Personnel remaining in the lowering area when orders are given from the control point, dependence on a single radio and different commands being received by separate teams. Related cards: LB-C06, LB-C10, MOB_SAR_COMMON."],"source_integrity":"sha256_verified_against_embedded_blocks"},{"step":5,"title_tr":"İndirme öncesi emniyet teyidi ve personel yerleşimi değerlendirilir","title_en":"Confirm pre-launch safety and personnel","learning_tr":"Ne öğretilir? İndirme tertibatının emniyetli görünür durumu, filikanın mevcut konumu, çekme/koruma bağlantıları, gemi bordası, su yüksekliği, rüzgâr ve dalga koşulları birlikte değerlendirilir.","learning_en":"What is taught? The visible safe condition of the launching appliance, the lifeboat's position, securing arrangements, hull side, water level, wind and waves are assessed together.","exercise_tr":"Sorumlu zabit, personelden muhtemel tehlikeleri işaretlemesini ister: sarkaç hareketi, halatın sürtünmesi, telin kırılması, askı altında çalışma, iki gemi arasında sıkışma ve alçak serbest borda. Mürettebat filika etrafındaki güvenli toplanma/bekleme bölgelerini tanıtır. Serbest düşüşlü filika varsa oturma/kemer ve simülasyon tertibi ayrıca incelenir; ancak yetkisiz serbest bırakma hareketi yaptırılmaz. Risk ve komuta teyitleri tamamlanmadan hareketli safhaya geçilmez.","exercise_en":"Practice or demonstration: The officer asks the team to identify hazards: pendulum motion, line chafing, wire failure, work beneath a suspended craft, crushing between vessels and low freeboard. Crew point out safe muster and waiting areas around the lifeboat. For a free-fall lifeboat, seating, restraints and simulation arrangements are also examined, without attempting an unauthorised release. No moving phase begins before risk and command checks are completed.","hazard_tr":"Dikkat edilecek risk: Yüksekte asılı araçta gereksiz kişi, filikanın savrulması, kanca göstergesinin yanlış yorumlanması veya mevcut servis kusuruna rağmen işe devam edilmesi. Bağlantılı kartlar: LB-C03, LB-C04, LB-C05, LB-C07.","hazard_en":"Hazards to consider: Unnecessary persons in a suspended craft, boat swing, misreading of hook indications, or proceeding despite an unresolved servicing defect. Related cards: LB-C03, LB-C04, LB-C05 and LB-C07.","id":"05","source_full_tr":["Ne öğretilir? İndirme tertibatının emniyetli görünür durumu, filikanın mevcut konumu, çekme/koruma bağlantıları, gemi bordası, su yüksekliği, rüzgâr ve dalga koşulları birlikte değerlendirilir. Tehlike alanlarına izinsiz yaklaşılmaması, filikanın yük altında personel almaması gereken durumlar ve kurtarma hazırlığı açıklanır. Onaylı sistemin mekanik kilit sırasının yalnızca üretici talimatıyla belirleneceği tekrar edilir.","Uygulama veya gösterim: Sorumlu zabit, personelden muhtemel tehlikeleri işaretlemesini ister: sarkaç hareketi, halatın sürtünmesi, telin kırılması, askı altında çalışma, iki gemi arasında sıkışma ve alçak serbest borda. Mürettebat filika etrafındaki güvenli toplanma/bekleme bölgelerini tanıtır. Serbest düşüşlü filika varsa oturma/kemer ve simülasyon tertibi ayrıca incelenir; ancak yetkisiz serbest bırakma hareketi yaptırılmaz. Risk ve komuta teyitleri tamamlanmadan hareketli safhaya geçilmez.","Dikkat edilecek risk: Yüksekte asılı araçta gereksiz kişi, filikanın savrulması, kanca göstergesinin yanlış yorumlanması veya mevcut servis kusuruna rağmen işe devam edilmesi. Bağlantılı kartlar: LB-C03, LB-C04, LB-C05, LB-C07."],"source_full_en":["What is taught? Assess the visible safe condition of launching equipment, current position of the lifeboat, securing and retaining arrangements, ship's side, water clearance, wind and waves together. Explain exclusion from hazardous areas, circumstances in which personnel must not board a suspended or loaded craft, and rescue readiness. Repeat that the exact mechanical locking sequence is determined only by the manufacturer's approved instructions.","Application or demonstration: Ask personnel to identify swinging loads, rope friction, failure of falls, working beneath a suspended load, crushing between craft and vessel, and low freeboard. Crew identify safe muster and waiting positions around the lifeboat. Where a free-fall lifeboat exists, review seating, restraints and the simulated release arrangement; do not make an unauthorised release movement. Do not proceed to a moving phase before risk and command checks are completed.","Hazards: Unnecessary personnel in a suspended craft, uncontrolled swinging, misinterpreting a hook indicator or continuing despite a service defect. Related cards: LB-C03, LB-C04, LB-C05, LB-C07."],"source_integrity":"sha256_verified_against_embedded_blocks"},{"step":6,"title_tr":"Donanım türüne uygun suya indirme ve motor eğitimi uygulanır veya gösterilir","title_en":"Demonstrate approved launching where applicable","learning_tr":"Ne öğretilir? Mataforalı filikanın kontrollü indirilmesi ile serbest düşüşlü filikanın ayrı eğitim/simülasyon düzeni karıştırılmaz.","learning_en":"What is taught? Controlled lowering of a davit-launched lifeboat must be distinguished from the separate training and simulation arrangement for a free-fall lifeboat.","exercise_tr":"Güvenli ve yetkili bir fiziki uygulama yapılacaksa işlem, tasarlanmış faaliyet planına göre görevlilerce yürütülür; eğitim gözlemcileri emniyet sınırından izler. Yalnız gösterim planlanmışsa, fiilî indirme yapılmadan kontrol noktalarının ve motorun kullanım mantığı açıklanır. Personelli indirme kararı ayrı risk kapısından geçirilir. Motorun fiilen çalıştırılması, indirme ve manevradan bağımsız bir kayıt konusu olarak değerlendirilir. Geçersiz hazırlık veya belirsiz kumanda durumunda süreç durdurulur.","exercise_en":"Practice or demonstration: If a safe authorised physical operation is planned, assigned personnel carry it out to the approved activity plan while trainees observe from within safety boundaries. For demonstration-only training, control points and engine operating principles are explained without actual launching. Carrying persons during lowering requires its own risk assessment. Actual engine operation is recorded separately from launching and manoeuvring. The process is stopped if preparation is invalid or control authority unclear.","hazard_tr":"Dikkat edilecek risk: Filikanın erken bırakılması, ani fren hareketi, motor/pervane kazası, gemiye vurma veya serbest düşüş prosedürünün yanlış simüle edilmesi. Bağlantılı kartlar: LB-C08, LB-C10, LB-C12.","hazard_en":"Hazards to consider: Premature release, abrupt braking movement, engine or propeller injuries, contact with the parent ship, or incorrect simulated free-fall procedures. Related cards: LB-C08, LB-C10 and LB-C12.","id":"06","source_full_tr":["Ne öğretilir? Mataforalı filikanın kontrollü indirilmesi ile serbest düşüşlü filikanın ayrı eğitim/simülasyon düzeni karıştırılmaz. Başlamadan önce güncel onaylı işletme talimatı, havanın ve su sahasının emniyeti, mürettebat görevi ve kumanda teyidi aranır. SOLAS III/19.3.4.3'ün üç aylık suya indirme/manévra gereği ilgili genel çerçeveyi açıklar; III/19.3.4.4'ün serbest düşüşlü filika istisnası ayrıca gösterilir. Serbest bırakma/kanca kumandasına ilişkin ayrıntılı model sırası, genel eğitim metninden uygulama talimatı olarak çıkarılamaz.","Uygulama veya gösterim: Güvenli ve yetkili bir fiziki uygulama yapılacaksa işlem, tasarlanmış faaliyet planına göre görevlilerce yürütülür; eğitim gözlemcileri emniyet sınırından izler. Yalnız gösterim planlanmışsa, fiilî indirme yapılmadan kontrol noktalarının ve motorun kullanım mantığı açıklanır. Personelli indirme kararı ayrı risk kapısından geçirilir. Motorun fiilen çalıştırılması, indirme ve manevradan bağımsız bir kayıt konusu olarak değerlendirilir. Geçersiz hazırlık veya belirsiz kumanda durumunda süreç durdurulur.","Dikkat edilecek risk: Filikanın erken bırakılması, ani fren hareketi, motor/pervane kazası, gemiye vurma veya serbest düşüş prosedürünün yanlış simüle edilmesi. Bağlantılı kartlar: LB-C08, LB-C10, LB-C12."],"source_full_en":["What is taught? Controlled davit launching and the separate free-fall lifeboat exercise or simulation arrangements must not be conflated. Before starting, confirm current approved operating instructions, safe weather and water area, crew duties and command arrangements. SOLAS III/19.3.4.3 provides the general framework for quarterly launching and manoeuvring, while the free-fall lifeboat provision in III/19.3.4.4 is treated separately. A detailed model-specific release or hook sequence cannot be derived from generic training text as an operating instruction.","Application or demonstration: If a safe authorised physical operation is conducted, assigned personnel follow the planned activity and training observers stay outside exclusion zones. If only a demonstration is planned, explain control points and engine operation without launching. Launching with crew aboard requires a separate risk-approval decision. Actual engine operation is considered a recordable activity distinct from lowering or manoeuvring. Stop if preparation is invalid or control authority unclear.","Hazards: Premature release of the lifeboat, sudden brake movement, engine or propeller accident, contact with the parent vessel or incorrect simulation of a free-fall procedure. Related cards: LB-C08, LB-C10, LB-C12."],"source_integrity":"sha256_verified_against_embedded_blocks"},{"step":7,"title_tr":"Su üzerinde filika manevrası, emniyetli dönüş ve geri alma açıklanır","title_en":"Review manoeuvring, return and recovery","learning_tr":"Ne öğretilir? Filikayı yönetme, düşük süratte baş–kıç kontrolü, ana gemiyle çarpışmadan uzaklaşma, akıntı ve rüzgârı değerlendirme, haberleşmeyi sürdürme, dönüş rotası ve geri alma tertibatına yaklaşım öğrenilir.","learning_en":"What is taught? Lifeboat handling, low-speed bow/stern control, moving clear without striking the parent vessel, assessment of wind and current, continued communications, the return route and approach to recovery gear.","exercise_tr":"Fiilen su üstü manevra yapılmışsa süre, ekip ve ana gemiyle haberleşme kapsamında gözlenen hususlar not edilir. Manévra yapılmamışsa sevk ve dümen eğitimleri gösterim olarak kaydedilir. Geri alma, ayrılmış bir plan ve risk kontrolü gerektirir; onaylı üretici tertibi dışında geçici bağlama, kanca sıralaması veya vinç ayarı önerilmez. Filikanın suyla teması ve askıya alınma evrelerinde personelin nerede duracağı tekrar öğretilir.","exercise_en":"Practice or demonstration: If afloat manoeuvring actually occurred, record its duration, crew and observed communication with the parent ship. Otherwise, propulsion and steering training is recorded as demonstration only. Recovery requires its own plan and risk controls; improvised securing arrangements, hook sequences or winch adjustments outside approved manufacturer instructions are not proposed. Personnel are reminded where to stand during water contact and re-suspension of the boat.","hazard_tr":"Dikkat edilecek risk: Ana gemi pervanesi/itici etkisi, filikanın yana vurması, halat kapma, akıntı sürüklenmesi, askı altında çalışma ve haberleşme kaybı. Bağlantılı kartlar: LB-C10, LB-C11, LB-C13, MOB_SAR_COMMON.","hazard_en":"Hazards to consider: Propeller or thruster wash from the parent ship, the lifeboat striking the hull, line entanglement, drift in current, work beneath suspended loads and loss of communications. Related cards: LB-C10, LB-C11, LB-C13 and MOB_SAR_COMMON.","id":"07","source_full_tr":["Ne öğretilir? Filikayı yönetme, düşük süratte baş–kıç kontrolü, ana gemiyle çarpışmadan uzaklaşma, akıntı ve rüzgârı değerlendirme, haberleşmeyi sürdürme, dönüş rotası ve geri alma tertibatına yaklaşım öğrenilir. Eğitim, katılımcıların manevrayı yalnızca “motor çalıştı” olarak değil, su üzerinde kontrol, durum farkındalığı ve iletişim olarak kavramasını amaçlar. Filika kumandanının su sahasındaki trafiği ve motor arızası olasılığını değerlendirme sorumluluğu anlatılır.","Uygulama veya gösterim: Fiilen su üstü manevra yapılmışsa süre, ekip ve ana gemiyle haberleşme kapsamında gözlenen hususlar not edilir. Manévra yapılmamışsa sevk ve dümen eğitimleri gösterim olarak kaydedilir. Geri alma, ayrılmış bir plan ve risk kontrolü gerektirir; onaylı üretici tertibi dışında geçici bağlama, kanca sıralaması veya vinç ayarı önerilmez. Filikanın suyla teması ve askıya alınma evrelerinde personelin nerede duracağı tekrar öğretilir.","Dikkat edilecek risk: Ana gemi pervanesi/itici etkisi, filikanın yana vurması, halat kapma, akıntı sürüklenmesi, askı altında çalışma ve haberleşme kaybı. Bağlantılı kartlar: LB-C10, LB-C11, LB-C13, MOB_SAR_COMMON."],"source_full_en":["What is taught? Lifeboat control includes low-speed bow and stern control, avoiding contact with the parent vessel, assessing current and wind, maintaining communications, the return route and approach to the recovery arrangement. The objective is to understand waterborne control, situational awareness and communications rather than simply noting that 'the engine ran'. Explain the coxswain's responsibility for traffic in the operating area and possible engine failure.","Application or demonstration: When manoeuvring on the water is actually performed, note the duration, crew and observations about communication with the parent vessel. Where it is not performed, describe propulsion and steering instruction as a demonstration. Recovery requires a separate plan and risk controls; do not suggest improvised rigging, hook sequences or winch adjustments outside approved manufacturer arrangements. Reinforce where personnel should stand during water contact and suspension stages.","Hazards: Propeller or thruster wash from the parent vessel, contact with the ship's side, entanglement in lines, drift in current, work beneath a suspended load and lost communications. Related cards: LB-C10, LB-C11, LB-C13, MOB_SAR_COMMON."],"source_integrity":"sha256_verified_against_embedded_blocks"},{"step":8,"title_tr":"Filika hazırlık durumu, eksikler ve EK-V/jurnal kaydı tamamlanır","title_en":"Restore readiness and complete records","learning_tr":"Ne öğretilir? Talim sonu, donanımın asıl saklama ve hazır olma durumunun kontrol edildiği, personelin öğrenme kazanımlarının değerlendirildiği ve gerekli kayıtların düzenlendiği aşamadır.","learning_en":"What is taught? At completion the boat's normal stowed and ready condition is verified, learning outcomes assessed and records completed.","exercise_tr":"Ekip filikanın istife dönmesi, mekanik güvenlik kontrolleri, malzeme eksikleri, enerji/motor düzeni ve haberleşme ekipmanlarının hazır bulunması konularını gözden geçirir. EK-V ve jurnal için olay sırası ve saatler doğrulanır. Katılanların görevleri ve eğitimin hangi bölümünün fiilen yapıldığı açık şekilde kaydedilir. Eğitim yalnız teorikse “filika suya indirildi” veya “geri alındı” gibi tamamlanmış hareket cümleleri kurulmaz.","exercise_en":"Practice or demonstration: The team reviews safe stowage, mechanical securing, missing equipment, power/engine condition and communications readiness. Event sequence and times for EK-V and ship's log are verified. Assigned duties and what was physically done are recorded precisely. If the drill was purely theoretical, statements such as 'the lifeboat was launched' or 'the lifeboat was recovered' must not be used.","hazard_tr":"Dikkat edilecek risk: Geri alma sonrası kancanın yanlış durumu, filikanın istif emniyetinin unutulması, servis gerektiren kusurun talim formunda kaybolması ve gerçeğe aykırı kayıt. Bağlantılı kartlar: LB-C13, LB-C14, LB-C16, REPORTING_COMMON.","hazard_en":"Hazards to consider: Incorrect hook status after recovery, failure to secure the boat in stowage, losing a service defect within a drill form, and false records. Related cards: LB-C13, LB-C14, LB-C16 and REPORTING_COMMON.","id":"08","source_full_tr":["Ne öğretilir? Talim sonu, donanımın asıl saklama ve hazır olma durumunun kontrol edildiği, personelin öğrenme kazanımlarının değerlendirildiği ve gerekli kayıtların düzenlendiği aşamadır. Denize indirme, motor, manevra ve geri alma yapıldıysa hepsi ayrı doğrulanır; herhangi biri yapılamadıysa nedeni ve tamamlanacak faaliyet yazılır. Kritik kusurlar yalnız sözlü debriefing konusu olarak bırakılmaz; yetkili arıza bildirim sistemine işlenmesi değerlendirilir.","Uygulama veya gösterim: Ekip filikanın istife dönmesi, mekanik güvenlik kontrolleri, malzeme eksikleri, enerji/motor düzeni ve haberleşme ekipmanlarının hazır bulunması konularını gözden geçirir. EK-V ve jurnal için olay sırası ve saatler doğrulanır. Katılanların görevleri ve eğitimin hangi bölümünün fiilen yapıldığı açık şekilde kaydedilir. Eğitim yalnız teorikse “filika suya indirildi” veya “geri alındı” gibi tamamlanmış hareket cümleleri kurulmaz.","Dikkat edilecek risk: Geri alma sonrası kancanın yanlış durumu, filikanın istif emniyetinin unutulması, servis gerektiren kusurun talim formunda kaybolması ve gerçeğe aykırı kayıt. Bağlantılı kartlar: LB-C13, LB-C14, LB-C16, REPORTING_COMMON."],"source_full_en":["What is taught? Closeout is the stage for confirming normal stowage and readiness, assessing what personnel learned and completing necessary records. If launching, engine operation, manoeuvring or recovery took place, verify each separately; if one was omitted, state the reason and outstanding activity. Serious defects must not remain only as spoken debriefing points; consider entry in the authorised defect-reporting system.","Application or demonstration: The team reviews return to stowage, mechanical safety checks, missing equipment, electrical and engine arrangements and readiness of communications. Confirm the sequence and times for EK-V and the vessel log. Record personnel duties and which training elements were actually performed. If the exercise was purely theoretical, do not describe the lifeboat as 'launched' or 'recovered'.","Hazards: An incorrect hook position after retrieval, failure to secure the craft for stowage, a service defect being lost in the drill form or a factually inaccurate record. Related cards: LB-C13, LB-C14, LB-C16, REPORTING_COMMON."],"source_integrity":"sha256_verified_against_embedded_blocks"}]},{"key":"
