const THEORETICAL_REPORT_V32={"abandon/abandon":{"tr":"Personele gemiyi terk kararının kaptan tarafından verilmesi, role istasyonlarında yoklama, can salına geçiş hazırlığı, can yeleği kullanımı ve acil haberleşme vasıtaları hakkında teorik eğitim verildi.","en":"The crew received theoretical instruction on the master’s authority to abandon ship, muster and headcount, liferaft embarkation preparations, lifejacket use and emergency communication equipment."},"fire/deck":{"tr":"Personele güverte yangınında yanıcı maddelerin özellikleri, yangın sınıfları, uygun söndürücü seçimi, dumanın yayılması, SCBA kullanımı ve emniyetli geri çekilme konularında teorik eğitim verildi.","en":"The crew received theoretical instruction on combustible materials in deck fires, fire classes, selection of suitable extinguishing agents, smoke spread, SCBA use and safe withdrawal."},"fire/accommodation":{"tr":"Personele yaşam mahalli yangınlarında dumanın koridorlara yayılması, yangın kapılarının işlevi, alternatif kaçış güzergâhları, personel yoklaması ve uygun solunum koruması hakkında teorik eğitim verildi.","en":"The crew received theoretical instruction on smoke propagation in accommodation spaces, fire doors, alternative escape routes, headcount and suitable respiratory protection."},"fire/engine":{"tr":"Personele makine dairesinde yakıt ve yağ yangını tehlikeleri, sıcak yüzeyler, havalandırma ve yakıt izolasyonu kararları, sabit söndürme sistemlerinin güvenli kullanım şartları ve geri çekilme esasları hakkında teorik eğitim verildi.","en":"The crew received theoretical instruction on fuel and lubricating-oil fire hazards in the engine room, hot surfaces, ventilation and fuel-isolation decisions, safety prerequisites for fixed extinguishing systems and withdrawal arrangements."},"fire/galley":{"tr":"Personele kuzinede kızgın yağ yangınlarının özellikleri, pişirme yağı yangını için uygun söndürme maddeleri, ısı kaynağının emniyetli kesilmesi ve kızgın yağ üzerine su uygulanmasının tehlikeleri hakkında teorik eğitim verildi.","en":"The crew received theoretical instruction on cooking-oil fires, suitable extinguishing media, safe isolation of the heat source and the hazards of applying water to burning oil."},"steering/steering":{"tr":"Personele dümen kumanda zinciri, köprüüstü ve yerel kumanda ayrımı, follow-up/non-follow-up kavramları, alternatif güç ve dümen dairesiyle emir tekrarlı haberleşme hakkında teorik eğitim verildi.","en":"The crew received theoretical instruction on the steering control chain, bridge versus local control, follow-up and non-follow-up modes, alternative power and read-back communication with the steering gear compartment."},"mob_sar/MOB":{"tr":"Personele MOB mevki işaretleme, sürekli gözcülük, manevra kararının gemiye bağlı sınırları, pervane ve borda yakınındaki tehlikeler, sudan alma yöntemleri ve hipotermi riski hakkında teorik eğitim verildi.","en":"The crew received theoretical instruction on marking the MOB position, continuous visual watch, vessel-specific manoeuvring decisions, propeller and ship-side hazards, recovery from the water and hypothermia."},"mob_sar/SAR":{"tr":"Personele RCC/MRCC koordinasyonu, olay yeri görevlendirmesi, datum ve sürüklenme hesabı, arama paterni seçimi, SITREP bildirimi ve kazazede kurtarma emniyeti hakkında teorik eğitim verildi.","en":"The crew received theoretical instruction on RCC/MRCC coordination, on-scene roles, datum and drift, search-pattern selection, SITREP reporting and safe recovery of survivors."},"boats/RESCUE":{"tr":"Personele kurtarma botu/FRC ile can filikası ve hizmet botu arasındaki görev farkları, matafora ve kaldırma kancası tehlikeleri, suya indirme izinleri, haberleşme ve geri alma emniyeti hakkında teorik eğitim verildi.","en":"The crew received theoretical instruction on the distinct roles of rescue craft/FRC, lifeboats and service craft, davit and lifting-hook hazards, launch authorisation, communication and safe recovery."},"boats/SERVICE":{"tr":"Personele daughter craft/hizmet botunun görev ve sertifika sınırları, ana gemiyle haberleşme, indirme ve geri alma sırasında askı yükleri, çalışma sahası ve personel emniyeti hakkında teorik eğitim verildi.","en":"The crew received theoretical instruction on the service/daughter craft’s operating and certification limits, communication with the parent vessel, suspended-load hazards during launch and recovery, work areas and crew safety."},"confined/ENTRY":{"tr":"Personele kapalı mahal atmosferinin tehlikeleri, oksijen eksikliği ve toksik gaz riski, giriş izni, izolasyon, uygun havalandırma, ölçüm sırası ve giriş gözcüsünün görevleri hakkında teorik eğitim verildi.","en":"The crew received theoretical instruction on hazardous enclosed-space atmospheres, oxygen deficiency and toxic gases, entry permits, isolation, appropriate ventilation, testing sequence and the duties of the standby attendant."},"confined/RESCUE":{"tr":"Personele kapalı mahalde plansız kurtarma girişinin tehlikeleri, alarm ve girişin durdurulması, SCBA ve kurtarma donanımı, atmosfer izlemesi ve emniyetli tahliye organizasyonu hakkında teorik eğitim verildi.","en":"The crew received theoretical instruction on the dangers of unplanned enclosed-space rescue entry, raising the alarm and preventing entry, SCBA and rescue gear, atmosphere monitoring and safe extraction arrangements."},"damage/Karaya":{"tr":"Personele karaya oturma sonrası gövde hasarı, tank iskandilleri, su geçirmez bölmeler, trim ve meyil değişimi, serbest yüzey etkisi ve geminin kurtarma kararındaki emniyet sınırları hakkında teorik eğitim verildi.","en":"The crew received theoretical instruction on post-grounding hull damage, tank soundings, watertight subdivisions, trim and heel changes, free-surface effect and safety limits for refloating decisions."},"damage/Su":{"tr":"Personele su giriş kaynağının belirlenmesi, sintine ve tank seviye izlemesi, su geçirmez bölmelendirme, pompa kapasitesi, hasar stabilitesi ve geçici sızdırmazlık tedbirleri hakkında teorik eğitim verildi.","en":"The crew received theoretical instruction on identifying water ingress, bilge and tank level monitoring, watertight subdivision, pumping capacity, damage stability and temporary leak-control measures."},"pollution/overflow":{"tr":"Personele yakıt transferinde taşma riski, aktarımın emniyetli durdurulması, güverte drenajlarının korunması, kirletici maddenin sınırlandırılması ve SOPEP/SMPEP bildirim zinciri hakkında teorik eğitim verildi.","en":"The crew received theoretical instruction on fuel-transfer overflow, safe transfer shutdown, protection of deck drains, spill containment and SOPEP/SMPEP reporting arrangements."},"pollution/leak":{"tr":"Personele sızıntı kaynağının tanınması, izolasyon öncelikleri, drenaj ve denize yayılmanın önlenmesi, uygun kişisel koruyucular, kirlenmiş malzeme yönetimi ve olay bildirimleri hakkında teorik eğitim verildi.","en":"The crew received theoretical instruction on identifying leak sources, isolation priorities, preventing discharge through drains, suitable PPE, handling contaminated materials and incident notifications."},"lifeboat/lifeboat":{"tr":"Personele can filikası ile kurtarma botunun farklı kullanım amaçları, filika türleri, indirme ve geri alma tertibatlarının riskleri ve gemi envanterine göre uygulanabilirlik sınırları hakkında teorik eğitim verildi.","en":"The crew received theoretical instruction on the different purposes of lifeboats and rescue boats, lifeboat types, hazards of launching and recovery arrangements and applicability according to the vessel’s actual equipment inventory."},"departure/emergency_departure":{"tr":"Personele acil kalkışta kaptan kararı, liman ve köprüüstü haberleşmesi, görev dağılımı, seyir hazırlığı, palamar emniyeti ve görev öncesi risk değerlendirmesi hakkında teorik eğitim verildi.","en":"The crew received theoretical instruction on the master’s emergency-departure decision, port and bridge communications, task allocation, navigation readiness, mooring safety and pre-departure risk assessment."},"departure/break_away_from_jetty":{"tr":"Personele rıhtım tehdidinin değerlendirilmesi, gemi–kıyı bağlantılarının emniyetli ayrılması, palamar halatlarında kopma bölgeleri, pervane ve rıhtım engelleri ile acil uzaklaşma haberleşmesi hakkında teorik eğitim verildi.","en":"The crew received theoretical instruction on assessing quayside threats, safely disconnecting shore services, mooring snap-back zones, propeller and berth obstructions and emergency breakaway communications."},"power/blackout":{"tr":"Personele blackout ile kısmi güç kaybının farkları, acil jeneratör ve UPS görevleri, güç yönetim sistemi, yük atma ve kritik devrelerin emniyetli geri beslenmesi hakkında teorik eğitim verildi.","en":"The crew received theoretical instruction on blackout versus partial power loss, emergency generator and UPS functions, power management, load shedding and safe restoration of essential electrical circuits."},"power/main_engine_failure":{"tr":"Personele ana makine arızasının belirtileri, sevk kaybında köprüüstü–makine haberleşmesi, kritik sistemlerin korunması, kontrollü arıza teşhisi ve yeniden çalıştırmadan önceki emniyet şartları hakkında teorik eğitim verildi.","en":"The crew received theoretical instruction on main-engine failure indicators, bridge–engine communications during propulsion loss, protection of essential systems, controlled fault diagnosis and prerequisites for safe restart."},"weather_collision/heavy_weather":{"tr":"Personele ağır hava tahminlerinin değerlendirilmesi, emniyetli rota ve sürat seçimi, güverte bağlama tedbirleri, gemi hareketleri ve dinamik stabilite riskleri hakkında teorik eğitim verildi.","en":"The crew received theoretical instruction on heavy-weather forecasts, safe route and speed decisions, securing deck equipment, vessel motions and dynamic stability hazards."},"weather_collision/collision":{"tr":"Personele çatışma riskinin radar/AIS ve gözcülükle değerlendirilmesi, çatışmayı önleme kuralları, hasar ve su alma kontrolü, personel emniyeti ve gerekli dış bildirimler hakkında teorik eğitim verildi.","en":"The crew received theoretical instruction on assessing collision risk through radar/AIS and lookout, collision-avoidance rules, hull damage and flooding checks, crew safety and external notifications."},"helicopter/landing":{"tr":"Personele helikopter iniş sahasının uygunluğu, görev yetkileri, rüzgâr ve gemi hareketi sınırları, rotor güvenliği, haberleşme ve yangın hazırlığı hakkında teorik eğitim verildi.","en":"The crew received theoretical instruction on helideck suitability, assigned responsibilities, wind and ship-motion limits, rotor safety, communications and firefighting readiness."},"helicopter/winching":{"tr":"Personele helikopterle vinçli tahliye koordinasyonu, uçuş ekibi talimatları, statik elektrik tehlikesi, tahliye donanımına güvenli temas ve kazazedenin hazırlanması hakkında teorik eğitim verildi.","en":"The crew received theoretical instruction on helicopter winching coordination, flight-crew instructions, static-electricity hazards, safe contact with hoist equipment and casualty preparation."},"helicopter/helideck_emergency":{"tr":"Personele helikopter sahasında yakıt yangını ve rotor tehlikeleri, alanın izole edilmesi, yangın ekibinin konumlandırılması, kurtarma hazırlığı ve uçuş ekibiyle koordinasyon hakkında teorik eğitim verildi.","en":"The crew received theoretical instruction on helideck fuel-fire and rotor hazards, area isolation, positioning of firefighting teams, rescue readiness and coordination with flight personnel."},"helicopter/ditching":{"tr":"Personele helikopterin denize zorunlu inişi sonrasında SAR koordinasyonu, kazazede gözcülüğü, yaklaşma ve sudan kurtarma emniyeti, hipotermi ve arama faaliyetini sonlandırma yetkisi hakkında teorik eğitim verildi.","en":"The crew received theoretical instruction on SAR coordination after helicopter ditching, survivor lookout, safe approach and recovery, hypothermia and authority to terminate search activities."}};
function printTechnicalAppendix(f){
 const notes=technicalByFamily[f.family]||[];
 return `<section class="printTechnical" aria-label="${L('Yazdırılacak teknik bilgi kartları','Technical knowledge cards for printing')}">
 <div class="printTechnicalHead"><h2>${L('Teknik bilgi kartları','Technical knowledge cards')}</h2><p>${ehtml(label(f,'title'))} · ${notes.length} ${L('kart','cards')}</p></div>
 ${notes.map((c,i)=>`<article class="printTechCard"><h3>${i+1}. ${ehtml(label(c,'title'))}</h3>
 ${c.paragraphs.map(p=>`<p>${ehtml(p[appState.lang]||p.tr)}</p>`).join('')}</article>`).join('')}
 </section>`;
}
function reportExample(f){
 const p=DB.report_samples_v31&&DB.report_samples_v31[f.key];
 let text=p?(p[appState.lang]||p.tr):'';
 if(f.key==='lifeboat/lifeboat' && appState.profile==='general'){
  if(appState.lang==='tr')text=text.replace('NENE HATUN örneğinde gemide can filikası bulunmadığı için gerçek filika indirme faaliyeti gerçekleştirilmedi; eğitim genel tanıtım olarak tamamlandı.','Kullanılan örnek senaryoda can filikasının fiilî indirilmesi gerçekleştirilmedi; indirme ve geri alma safhaları görsel eğitimle değerlendirildi.');
  else text=text.replace('In the NENE HATUN example, no lifeboat was carried and no actual lifeboat launching operation was conducted; the session was completed as general familiarisation.','In the sample scenario, no actual lifeboat launching was performed; launching and recovery were reviewed using visual training material.');
 }
 const theoretical=THEORETICAL_REPORT_V32[f.key];
 if(theoretical)text+='\n\n'+(theoretical[appState.lang]||theoretical.tr);
 return text;
}

function reportView(uid){const f=flowById[uid];if(!f)return missing();const lib=familyById[f.family];const tr=appState.lang==='tr';return `<div class="reportShell">${navBack()}<div class="guideHero"><div class="guideLabel">${ehtml(label(lib,'title'))}</div><h1>${ehtml(label(f,'title'))}</h1>${drillTabs(uid,'report')}</div>
 <section class="sampleBox"><div class="guideLabel">${L('02 · Rapor Yazım Rehberi','02 · Reporting Guide')}</div><h3>${L('Rapor yazım örneği','Sample drill report')}</h3><div class="sampleText">${ehtml(reportExample(f))}</div><div style="margin-top:13px"><button type="button" class="btn primary" data-copy-sample="${uid}">${L('Örnek metni kopyala','Copy example narrative')}</button></div></section>
 <div class="guidanceLead"><section class="guideNote"><div class="guideLabel">${L('Rapor özeti yazılırken','Before completing the report')}</div><h3>${L('Altı temel denetim sorusu','Six essential reporting questions')}</h3><ol>${(tr?[
 'Gemi, gerçek tarih/saat, talim türü ve senaryo doğru belirtildi mi?',
 'İlk ihbar, alarm, role, görev ve haberleşme sırası anlaşılır mı?',
 'Gerçekte çalıştırılan donanım ile yalnızca simüle edilen işlemler ayrıldı mı?',
 'Atlanan veya yapılamayan safhalar ve gerekçeleri belirtildi mi?',
 'Gözlenen emniyet riskleri, eksiklikler ve düzeltici faaliyet sahipleri kaydedildi mi?',
 'İlgili onaylı kontrol listesi, EK-V ve jurnal yükümlülüğü kontrol edildi mi?'
 ]:[
 'Are vessel, actual date/time, drill type and scenario accurate?',
 'Is the alarm, muster, assignment and communication sequence clear?',
 'Are real equipment tests distinguished from simulated activities?',
 'Are omitted or impracticable steps and reasons described?',
 'Are safety observations, deficiencies, owners and corrective actions captured?',
 'Have the approved checklist, applicable EK-V and log requirements been checked?'
 ]).map(x=>`<li>${ehtml(x)}</li>`).join('')}</ol></section><section class="guideNote"><div class="guideLabel">${L('Kaynak evrak ve kayıt','Supporting records')}</div><h3>${L('Kayıt dosyasında nelere bakılmalı?','Supporting documentation to check')}</h3><ul><li>${L('Gemi role cetveli ve yürürlükteki ISM/EYS talim prosedürü','Muster list and current ISM/SMS drill procedure')}</li><li>${L('Varsa ilgili acil durum kontrol listesi, risk değerlendirme kaydı ve talim planı','Relevant emergency checklist, risk assessment and drill plan if applicable')}</li><li>${L('Gemi jurnali ve ekipman test notları','Ship log and equipment-test notes')}</li><li>${L('Eksiklik/düzeltici faaliyet ve yetkili değerlendirmesi','Deficiency/corrective-action tracking and authorised assessment')}</li></ul>${lib.evidence.length?`<div style="font-size:12px;color:var(--muted)">${L('Belge kodları','Document references')}: ${ehtml(lib.evidence.map(x=>x.code).join(' · '))}</div>`:''}</section></div>
 <section class="guideNote"><div class="guideLabel">${L('Talim kapsamı','Drill coverage')}</div><h3>${L('Rapor hazırlanırken gözden geçirilecek aşamalar','Stages to review when preparing the report')}</h3><div class="reportReviewGrid">${f.stages.map(s=>`<article class="reportReviewCard"><div class="reviewCardHead"><span class="reviewCardNo">${s.step}</span><h4>${ehtml(label(s,'title'))}</h4></div><p>${ehtml(label(s,'exercise'))}</p><p class="reviewCardHazard">${ehtml(label(s,'hazard'))}</p></article>`).join('')}</div></section>
 <div class="deepLink"><div><strong>${L('01 · Talim Rehberi','01 · Drill Guidance')}</strong><br/><span>${L('Talim kartına dönün.','Return to the drill card.')}</span></div><a class="btn" href="#/talim/${uid}">${L('Talim kartını aç','Open drill card')} →</a></div></div>`}
function render(){const r=route();let content='';const p=r[0];if(['takvim','yil'].includes(p)){appState.returnRoute=location.hash||rootCalendar()};if(p==='takvim')content=monthView(+r[1]||TODAY.y,+r[2]||TODAY.m,+r[3]||1);else if(p==='yil')content=yearView(+r[1]||TODAY.y);else if(p==='talimler')content=drillsView();else if(p==='talim')content=drillView(r[1]);else if(p==='brifing')content=briefView(r[1]);else if(p==='kayit')content=reportView(r[1]);else if(p==='teknik')content=technicalView(r[1]);else if(p==='aciller')content=emergencyView();else if(p==='acil')content=emergencyDetail(r[1]);else if(p==='ara')content=searchView(r.slice(1).join('/'));else if(p==='kapsam')content=scopeView();else content=missing();document.documentElement.lang=appState.lang;document.title=L('Gemi Acil Role Talimleri | Operatör Sürümü v3.6.1','Shipboard Emergency Drills | Operator Edition v3.6.1');$('#app').innerHTML=appHeader(p)+`<main class="main">${content}</main>`+footer();attachFilters()}
document.addEventListener('click',ev=>{const b=ev.target.closest('[data-copy-sample]');if(!b)return;const f=flowById[b.dataset.copySample];if(!f)return;if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(reportExample(f)).then(()=>{b.textContent=L('Kopyalandı','Copied')}).catch(()=>{b.textContent=L('Panoya erişilemedi','Clipboard unavailable')})}else{const t=document.createElement('textarea');t.value=reportExample(f);document.body.appendChild(t);t.select();const ok=document.execCommand('copy');t.remove();b.textContent=L(ok?'Kopyalandı':'Panoya erişilemedi',ok?'Copied':'Clipboard unavailable')}})

render();
