ması veya seyir emniyetinin bozulması."],"source_full_en":["Learning objective: Plan the distinct responsibilities of the bridge, engine room and steering-gear compartment in conjunction with the technical hazards.","Set the exercise boundary: tabletop discussion only, visual familiarisation on site, or controlled direct-steering practice. These three levels must not be conflated.","The risk briefing covers unintended rudder movement, high-pressure oil, moving linkages, electricity, slippery decks, noise, inadequate lighting, lone working, surrounding traffic and navigational conditions, loss of communications and delayed manoeuvring response.","Introduce the duties of the bridge control officer, engineering watchkeepers, personnel at the local steering station and any necessary safety lookout. Check the competence and availability of the assigned personnel.","Identify in advance the installed steering-system block diagram, panel labels, communication equipment, actual rudder-angle indicator and any proposed alternative power supply.","Explain conditions requiring immediate termination of the exercise: unexpected rudder movement, disagreement about control authority, loss of communications, fault alarm, hydraulic leak, danger to personnel or deterioration of navigational safety."],"source_integrity":"sha256_verified_against_embedded_blocks"},{"step":4,"title_tr":"Köprüüstü–dümen dairesi haberleşmesi ve kumanda devri","title_en":"Transfer communications and control with confirmation","learning_tr":"Eğitim amacı: Köprüüstünün seyir kararını verirken yerel kumanda personelinin emri tereddütsüz anlaması ve icra ettiğini doğrulaması sağlanır.","learning_en":"Training objective: Ensure that the person at the local controls understands bridge orders unambiguously and confirms their execution while the bridge retains responsibility for navigational decisions.","exercise_tr":"Köprüüstü ile dümen dairesi arasında örnek dümen emri, geri okuma ve uygulama teyidini sözlü prova ettirin.","exercise_en":"Conduct a verbal rehearsal of a steering order, read-back and execution confirmation between bridge and steering compartment.","hazard_tr":"Yanlış duyulan emir, teyitsiz kumanda devri veya farklı gösterge referanslarının kullanılması.","hazard_en":"Misheard orders, unconfirmed control transfer or use of inconsistent rudder indications.","id":"ST-04","source_full_tr":["Eğitim amacı: Köprüüstünün seyir kararını verirken yerel kumanda personelinin emri tereddütsüz anlaması ve icra ettiğini doğrulaması sağlanır.","Kullanılacak telsiz, dahili telefon veya onaylı yedek haberleşme aracının görevli personelce yerinde bulunması ve anlaşılırlığının kontrolü anlatılır.","Kumanda devrinin aşamaları açıklanır: köprüüstünden talep, yerel panelde hazırlık ve emniyet teyidi, devrin kabulü, emirleri yalnızca belirlenen kontrol noktasının vermesi, gerçek dümen açısının bildirilmesi.","Örnek emirler, geminin standart dümen kumanda terminolojisine uygun olarak emrin tekrar edilmesi ve sonucu geri bildirme ilkesiyle öğretilir. Uygun ve güvenli eğitim açısı önceden belirlenmeden kesin dümen açısı emredilmez.","“Dümen hangi kumandayı dinliyor?” sorusunun açık cevabı bulunmalıdır. Köprüüstündeki otomatik pilot, joystick ve lokal kumandanın eşzamanlı yetki çatışması yaratmayacağı doğrulanır.","Bir haberleşme aracı kesilirse önceden kararlaştırılan yedek kanal ve emniyetli duruma geçiş planı hatırlatılır; sessizliği onay varsayarak hareket edilmez."],"source_full_en":["Learning objective: Ensure personnel at the local steering station clearly understand orders from the bridge and confirm their execution while the bridge retains responsibility for navigation decisions.","Explain the need for assigned personnel to have access to and verify the clarity of the designated radio, internal telephone or approved backup communication system.","Describe control-transfer stages: request from the bridge, preparation and safety confirmation at the local panel, acceptance of the transfer, issuance of orders solely from the designated control point and reporting of the actual rudder angle.","Sample orders are taught using the vessel's standard helm-order terminology, read-back and confirmation of the outcome. No particular rudder angle is ordered before a safe, appropriate exercise angle has been agreed.","The question 'Which station currently has control of the rudder?' must have an unambiguous answer. Verify that bridge autopilot, joystick and local controls cannot simultaneously create conflicting authority.","If a communication device fails, recall the predetermined backup channel and procedure for reaching a safe condition; silence must not be treated as acknowledgement."],"source_integrity":"sha256_verified_against_embedded_blocks"},{"step":5,"title_tr":"Dümen kumanda sistemlerinin ve arıza göstergelerinin tanıtılması","title_en":"Identify controls, indications and alarms","learning_tr":"Eğitim amacı: Personelin gemiye takılı ana/yardımcı kumanda, güç ünitesi ve göstergeleri tanıması; hangi arızanın hangi alternatifle giderilebileceğini anlaması sağlanır.","learning_en":"Training objective: Familiarise personnel with the installed main and auxiliary controls, power units and indications, and explain which alternative arrangements address which faults.","exercise_tr":"Gemiye ait onaylı sistem şemasında ana/yardımcı kumandayı, alarmları ve güç kaynaklarını gösterin.","exercise_en":"Identify main and alternative controls, alarms and power supplies on the vessel's approved steering-system diagram.","hazard_tr":"Farklı gemi donanımını aynı kabul etmek; koruma ve alarm devrelerine yetkisiz müdahale.","hazard_en":"Assuming all vessel installations are identical; unauthorised interference with protective or alarm circuits.","id":"ST-05","source_full_tr":["Eğitim amacı: Personelin gemiye takılı ana/yardımcı kumanda, güç ünitesi ve göstergeleri tanıması; hangi arızanın hangi alternatifle giderilebileceğini anlaması sağlanır.","Köprüüstü ve dümen dairesindeki işletme şemaları üzerinde kumanda devreleri, güç üniteleri, gerektiğinde acil güç ve yerel panel arasındaki bağlantı gösterilir.","FU/NFU gibi kumanda tiplerinin genel işleyiş farkı anlatılır; gerçek kumanda etiket ve geçiş usulleri yalnız geminin onaylı teknik dokümanı üzerinden tanıtılır.","Dümen açısı göstergeleri, sistem güç kaybı/alarm lambaları, hidrolik basınç/seviye gösterimi ve mevcut izleme sistemleri kavramsal olarak açıklanır. Tüm gemilerde birebir aynı alarm listesi bulunduğu iddia edilmez.","Ana güç ünitesindeki arıza ile uzaktan kumanda arızasının farklı birincil nedenler olabileceği anlatılır. Bir gösterge arızasının dümenin fiziksel olarak kumanda edilemediği anlamına gelmeyebileceği açıklanır.","Köprüüstü ile dümen dairesinde işletme talimatlarının okunabilir ve erişilebilir olmasının SOLAS V/26.3 gereği olduğu hatırlatılır."],"source_full_en":["Learning objective: Familiarise personnel with the vessel's installed main and auxiliary steering controls, power units and indicators, and which alternative arrangement may address a particular fault.","Show the relationships among control circuits, power units, any relevant emergency power supply and the local panel on the bridge and steering-compartment operating diagrams.","Explain the general differences between follow-up (FU) and non-follow-up (NFU) control; actual control labels and changeover procedures are introduced only using the vessel's approved technical documentation.","Rudder-angle indicators, power-loss and alarm lamps, hydraulic pressure and level indications and installed monitoring systems are explained conceptually. No identical alarm list is assumed to apply to all vessels.","Explain that a failure of the main power unit and a remote-control failure can have different primary causes. An indication fault does not necessarily mean the rudder is physically incapable of moving.","Remind personnel that readable, accessible operating instructions on the bridge and in the steering-gear compartment are required by SOLAS V/26.3."],"source_integrity":"sha256_verified_against_embedded_blocks"},{"step":6,"title_tr":"Dümen dairesinden doğrudan kumanda ve alternatif güç değerlendirmesi","title_en":"Review direct steering and alternate power","learning_tr":"Eğitim amacı: SOLAS V/26.4'ün temel unsurunun dümen dairesinden doğrudan kumandanın öğrenilmesi olduğunu göstermek; alternatif güç uygulamasını uygunluk şartına bağlamak.","learning_en":"Training objective: Demonstrate that a core requirement of SOLAS V/26.4 is familiarity with direct control from the steering-gear compartment, while application of alternative power depends on the vessel's arrangements.","exercise_tr":"Dümen dairesindeki doğrudan kumanda yerini ve iletişim düzenini yerinde veya şema üzerinde tanıtın; fiilî kumandayı ayrıca yetkilendirin.","exercise_en":"Identify local steering controls and communication arrangements in situ or on a diagram; authorise any live operation separately.","hazard_tr":"Hareketli hidrolik/elektrik donanımı, kontrol devrinin anlaşılmaması ve istem dışı dümen hareketi.","hazard_en":"Moving hydraulic or electrical machinery, misunderstood control handover and unintended rudder movement.","id":"ST-06","source_full_tr":["Eğitim amacı: SOLAS V/26.4'ün temel unsurunun dümen dairesinden doğrudan kumandanın öğrenilmesi olduğunu göstermek; alternatif güç uygulamasını uygunluk şartına bağlamak.","Köprüüstünden yerel kumandaya geçiş, geminin kurulu sistemine göre onaylı blok şemayla anlatılır. Kimin geçişi yöneteceği ve kimin gerçek dümen açısını okuyacağı belirlenir.","Dümen dairesindeki doğrudan kumandanın, yalnız alarm paneline bakılması veya güç ünitesinin bir düğmesine basılmasıyla aynı iş olmadığı açıklanır. Talimin kapsamına uygun olduğunda gerçek kumanda hareketi emniyetli koşullarda yetkili ekip tarafından uygulanır.","Testte, köprüüstünün dümen emrinin dümen dairesince tekrar edilmesi, dümenin uygun ve kontrollü açıda cevap vermesi, her iki taraftaki gerçek açı bilgisinin karşılaştırılması ve sonuç teyidi öğretilir.","Gemiye takılı uygulanabilir alternatif güç kaynağı varsa işletme ve geçiş düzeni gemiye özgü talimatla tanıtılır. Otomatik devre alma fonksiyonu, akü/generatör ve güç dönüştürme imkânları her gemide aynı kabul edilmez.","Gerçek test, köprüüstü veya makine sisteminde emniyetsiz enerji kaybı, dümenin beklenmeyen harekete geçmesi veya seyir tehlikesi yaratacak şekilde tasarlanmaz. Koşullar uygun değilse yerel panel tanıtımı ve simülasyon yapılır, gerçek kumanda uygulanmış gibi kaydedilmez."],"source_full_en":["Learning objective: Explain that a key element of SOLAS V/26.4 is familiarisation with direct control from the steering-gear compartment, while alternative-power exercises depend on applicability.","Describe transfer from bridge steering to local control using the approved block diagram for the installed system. Designate who manages the changeover and who reads the actual rudder angle.","Explain that direct control from the steering-gear compartment is not the same as merely observing an alarm panel or pressing a power-unit button. If it falls within the drill scope, qualified personnel may perform an actual controlled steering movement under safe conditions.","Teach read-back of the bridge helm order by the steering-gear compartment, response at a suitable controlled rudder angle, comparison of actual-angle indications at both stations and confirmation of the result.","If an applicable alternative power source is fitted, demonstrate its operating and changeover arrangements in accordance with the vessel-specific instructions. Automatic changeover, batteries, generators and power conversion options are not assumed to be identical across vessels.","A real test must not be designed to cause unsafe loss of power to the bridge or machinery, unexpected rudder movement or a navigational hazard. If conditions are unsuitable, conduct local-panel familiarisation and simulation without recording that direct steering was actually performed."],"source_integrity":"sha256_verified_against_embedded_blocks"},{"step":7,"title_tr":"Arıza gelişimi, ikincil seyir tehlikeleri ve normale dönüş","title_en":"Manage secondary hazards and restoration","learning_tr":"Eğitim amacı: Dümen arızasının yalnız ilk müdahaleyle sınırlı kalmadığı; trafik, enerji, iletişim, arıza giderme ve normal işletmeye dönüş kararlarının bir bütün oluşturduğu öğretilir.","learning_en":"Training objective: Teach that steering failure does not end with the initial response; traffic, power, communications, fault investigation and return to normal operation form one decision chain.","exercise_tr":"Arıza, geçici kontrol ve normale dönüş kararlarını zaman çizelgesinde sıralatıp kaptan onayı noktalarını işaretletin.","exercise_en":"Sequence the fault, temporary control and restoration decisions on a timeline, marking the master's approval points.","hazard_tr":"Arıza giderildiği varsayımıyla erken normal kumandaya dönüş veya trafik riskinin ihmal edilmesi.","hazard_en":"Premature return to normal control based on an assumed repair, or neglect of traffic risk.","id":"ST-07","source_full_tr":["Eğitim amacı: Dümen arızasının yalnız ilk müdahaleyle sınırlı kalmadığı; trafik, enerji, iletişim, arıza giderme ve normal işletmeye dönüş kararlarının bir bütün oluşturduğu öğretilir.","Senaryo ilerletilir: yerel kumandadan dümen hareketi sağlansa bile yakın trafik, yetersiz sürat, hidrolik kaçak veya köprüüstü–dümen dairesi haberleşmesinde zayıflama gibi ikinci olaylar tartışılır.","Kaptanın dış yardım, uygun liman/sığınma sahası, römorkör veya sahil otoritesiyle iletişim ihtiyacını hangi olgulara göre değerlendireceği öğretilir.","Gerçek tehlike ve acelelik çağrılarının hukuki eşikleri anlatılır; “Mayday/Pan-Pan yayınlandı” ifadesi sırf tatbikat yürütüldüğü için rapora eklenmez.","Teknik personelin arızayı incelemesi, hangi donanımın devre dışı kaldığı ve olası bakım ihtiyacının nasıl bildirileceği öğretilir. Yetkisiz müdahale veya riskli hidrolik tamir canlı talim içinde gerçekleştirilmez.","Normal kumandaya dönüşte köprüüstü kontrol otoritesinin geri alınması, güç ve alarm durumunun uygunluğu ve yerel panelin emniyete alınması teyit edilir."],"source_full_en":["Learning objective: Explain that a steering failure extends beyond the initial response; traffic, power, communications, diagnosis and decisions about returning to normal control form one connected process.","Develop the scenario: even if local steering restores rudder movement, discuss secondary problems such as nearby traffic, insufficient speed, hydraulic leakage or deteriorating bridge-to-steering-compartment communications.","Teach which factual circumstances the master considers before seeking external help, a suitable port or place of refuge, tug assistance or communication with the coastal authority.","Explain the legal thresholds for actual distress and urgency calls; a statement that 'MAYDAY/PAN PAN was transmitted' must not be included in the report merely because an exercise was held.","Explain technical investigation, reporting which equipment is out of service and identifying possible maintenance needs. Unauthorised intervention or hazardous live hydraulic repair is not conducted as part of the drill.","When normal steering is restored, confirm return of control authority to the bridge, satisfactory power and alarm status, and safe securing of the local panel."],"source_integrity":"sha256_verified_against_embedded_blocks"},{"step":8,"title_tr":"Son kontrol, öğrenme değerlendirmesi ve kayıt","title_en":"Check readiness, debrief and record","learning_tr":"Eğitim amacı: Talimin tamamlanmış sayılması için icra ile belge arasında maddi tutarlılık sağlanır.","learning_en":"Training objective: Ensure material consistency between what was performed and what is entered in the records before declaring the drill complete.","exercise_tr":"Talim kontrol konularını örnek jurnal ve role kaydıyla karşılaştırıp yapılan/simüle edilen işlemleri ayırt ettirin.","exercise_en":"Compare training topics with sample log and drill entries, distinguishing actual actions from simulations.","hazard_tr":"Yapılmayan doğrudan dümen kumandasının yapılmış gibi raporlanması; eksikliklerin kaydedilmemesi.","hazard_en":"Recording local steering operation that did not occur, or omitting deficiencies.","id":"ST-08","source_full_tr":["Eğitim amacı: Talimin tamamlanmış sayılması için icra ile belge arasında maddi tutarlılık sağlanır.","Yürütülen haberleşme testi, doğrudan kumanda, alternatif güç tanıtımı/uygulaması, geri dönüş ve emniyet tedbirleri ayrı ayrı özetlenir.","Her katılımcının ana görev, alternatif kumanda, geri bildirim, risk ve tehlike işareti farkındalığı kısa sorularla değerlendirilir. Eksikliklerin düzeltici işlem veya sonraki eğitime konu olabileceği açıklanır.","Geminin normal dümen kontrolü, kumanda otoritesi, güç üniteleri, alarm durumu ve izleme göstergeleri son kez karşılaştırılır; fiilen işlem yapılan sistemler güvenli işletme düzenine alınır.","EK-V'nin Diğer Role Talimleri alanındaki senaryo anlatımı, dümen arızası kontrol listesinin eğitimle ilişkili konu hatırlatıcısı, güverte/makine jurnali ve varsa kusur/bakım kayıtları arasındaki fark anlatılır.","Talim tarihi, başlama ve bitiş saatleri, yer, katılım, sorumlu kişi, hangi işlemlerin gerçek/simüle olduğu, açık bulgular ve sonuç tutarlı yazılır. SOLAS V/26.6 uyarınca talimin tarih ve ayrıntılarının kaydı esas alınır."],"source_full_en":["Learning objective: Ensure that the actual activities and the documentary description agree materially before a drill is considered complete.","Summarise communications tests, direct-steering operations, alternative-power familiarisation or exercise, restoration and safety precautions separately.","Assess each participant's awareness of assigned duties, alternative control, read-back, risks and danger signs through brief questions. Explain that deficiencies may require corrective action or later training.","Finally compare normal steering control, control authority, power units, alarm status and monitoring indications; return any systems actually operated to their safe operating configuration.","Explain the difference between the EK-V 'Other Drills' scenario account, topics from the steering-failure checklist, deck and engine-room logbooks and any defect or maintenance records.","Record drill date, start and finish times, location, attendance, responsible officer, which activities were actual or simulated, outstanding findings and conclusion consistently. SOLAS V/26.6 requires the date and details of the drill to be recorded."],"source_integrity":"sha256_verified_against_embedded_blocks"}]},{"key":"mob_sar/MOB","family":"mob_sar","flow":"MOB","title_tr":"Denize Adam Düştü","title_en":"Man Overboard","family_title_tr":"Denize Adam Düştü / SAR","family_title_en":"Man Overboard / Search and Rescue","stages":[{"step":1,"title_tr":"Düşmenin fark edilmesi, ilk çağrı ve işaretleme","title_en":"Recognize the fall and make the first call","learning_tr":"Denize düşmeyi ilk gören kişi, olayın iskele/sancak tarafı, yaklaşık mevki ve varsa görülen can yeleği/kişinin durumu ile birlikte “Denize Adam Düştü!” ikazını yüksek ve anlaşılır biçimde bildirir.","learning_en":"The first witness calls 'Man overboard!' clearly and loudly, identifies the side of the vessel, gives the approximate location and reports any visible condition of the casualty or lifejacket. The purpose and safe deployment of a lifebuoy and, where fitted, light/smoke marker are demonstrated. Crew must not lean over the side into danger. A designated lookout keeps visual contact and continuously reports bearing and distance to the bridge.","exercise_tr":"Güverte krokisi üzerinde düşme tarafını, ilk sesli ihbarı ve can simidi/işaretin uygun konumunu senaryo olarak gösterin.","exercise_en":"Use a deck sketch to rehearse the side of the fall, initial shout and location of the lifebuoy or marker.","hazard_tr":"Kazazedeyi izleyen personelin borda dışına sarkması veya konum bilgisinin kaybolması.","hazard_en":"An observer leaning over the side or losing the casualty's location.","id":"MOB-01","source_full_tr":["Denize düşmeyi ilk gören kişi, olayın iskele/sancak tarafı, yaklaşık mevki ve varsa görülen can yeleği/kişinin durumu ile birlikte “Denize Adam Düştü!” ikazını yüksek ve anlaşılır biçimde bildirir. Can simidi ve varsa ışıklı/dumanlı MOB işaretinin kullanım amacı tanıtılır. İşaretin kişinin bulunduğu su alanına ulaşmasını sağlayacak emniyetli yaklaşım açıklanır; personelin kendisini tehlikeye atacak şekilde borda dışına sarkması engellenir. İlk gözcünün kazazedeyi gözden kaybetmeden kaptana yön ve mesafe raporu vermesi öğretilir."],"source_full_en":["The first person seeing someone fall overboard raises a loud, clear 'Man Overboard!' alarm and reports whether the person fell to port or starboard, the approximate position and any observed lifejacket or casualty condition. The purpose of lifebuoys and any MOB light or smoke marker is demonstrated. The safe method of deploying a marker into the water near the person is explained without allowing crew to lean dangerously over the ship's side. The initial lookout learns to maintain visual contact and report bearing and distance to the master."],"source_integrity":"sha256_verified_against_embedded_blocks"},{"step":2,"title_tr":"Alarm, köprüüstü haberi ve MOB mevkii","title_en":"Raise the alarm and mark the MOB position","learning_tr":"Köprüüstü/kaptana ilk mevki ve saat bildirilir. GPS/ECDIS üzerinde MOB işaretinin kullanımı, kayıt edilen verinin kaynak ve doğruluk sınırıyla birlikte açıklanır. Gemi içindeki ilgili alarm/anons talim usulüne uygun yapılır.","learning_en":"The initial position and time are reported to the bridge and master. The use of the MOB function on GPS/ECDIS is explained together with the origin and accuracy limitations of the recorded position.","exercise_tr":"Örnek olay saati ve mevkisini MOB işaretiyle eşleştirin; gerçek alarm ile talim anonsunu ayrı tanıtın.","exercise_en":"Match a simulated incident time and position to an MOB mark; distinguish a real alarm from a drill announcement.","hazard_tr":"Yanlış mevkinin kesin kabul edilmesi veya gerçek tehlike alarmının yanlışlıkla gönderilmesi.","hazard_en":"Treating an inaccurate position as certain or inadvertently transmitting a real distress alert.","id":"MOB-02","source_full_tr":["Köprüüstü/kaptana ilk mevki ve saat bildirilir. GPS/ECDIS üzerinde MOB işaretinin kullanımı, kayıt edilen verinin kaynak ve doğruluk sınırıyla birlikte açıklanır. Gemi içindeki ilgili alarm/anons talim usulüne uygun yapılır. Dahili haberleşme; köprüüstü, güverte, kurtarma botu, makine dairesi ve ilk yardım ekibinin görevlerini koordine edecek biçimde öğrenilir. Gerçek MAYDAY/PAN PAN veya DSC/EPIRB distress alarmı, yalnızca tatbikat yapılıyor diye gönderilmez."],"source_full_en":["Report the initial position and time to the bridge and master. Explain how to mark MOB on GPS/ECDIS while stating the source and accuracy limitations of the recorded position. Make relevant onboard alarms and announcements in accordance with the drill procedure. Internal communications are developed to coordinate the bridge, deck, rescue boat, engine room and first-aid team. A real MAYDAY, PAN PAN, DSC or EPIRB distress alert must not be transmitted merely because a drill is in progress."],"source_integrity":"sha256_verified_against_embedded_blocks"},{"step":3,"title_tr":"Gözcü, role organizasyonu ve personel sayımı","title_en":"Assign lookouts and account for personnel","learning_tr":"Sabit gözcü ve yedek gözcü belirlenir. Kurtarma güvertesinin kim tarafından hazırlanacağı, bot personeli ve indirme yetkisi, telsiz kanalları, olay komutanına kimin rapor vereceği ve gemide olası eksik personelin nasıl…","learning_en":"Assign a dedicated lookout and relief lookout. Establish who prepares the recovery deck, crews the rescue boat, authorises launch, manages radio channels, reports to the incident commander and verifies any missing crew. Conflicting information about the identity or number of persons overboard is checked before being reported as fact. Assigned personnel explain their own muster duties during the drill.","exercise_tr":"Gözcü, yedek gözcü, köprüüstü ve kurtarma ekibi görevlerini bir role planında dağıtın.","exercise_en":"Allocate lookout, backup lookout, bridge and recovery-team duties on a muster-style chart.","hazard_tr":"Gözcülüğün kesilmesi, eksik personel sayımı ve görevli ekibin hazırlıksız kalması.","hazard_en":"Interrupted lookout, incomplete personnel accounting and unprepared recovery teams.","id":"MOB-03","source_full_tr":["Sabit gözcü ve yedek gözcü belirlenir. Kurtarma güvertesinin kim tarafından hazırlanacağı, bot personeli ve indirme yetkisi, telsiz kanalları, olay komutanına kimin rapor vereceği ve gemide olası eksik personelin nasıl doğrulanacağı açıklanır. Gerçek olayda düşen kişi sayısı veya kimliği konusunda çelişkili haber alındığında, kaynağı teyit edilmeden rapora kesin veri yazılmaz. Talimde görevli personel kendi role sorumluluğunu sözlü olarak açıklar."],"source_full_en":["Assign a dedicated lookout and relief lookout. Explain who prepares the recovery deck, the boat crew and authority for launching, radio channels, reporting to the incident commander and how a possible missing crew member is confirmed. In a real event, conflicting reports about the number or identity of persons overboard must not become definitive statements before verification of their source. During the drill, assigned personnel explain their muster duties orally."],"source_integrity":"sha256_verified_against_embedded_blocks"},{"step":4,"title_tr":"Gemi manevrası, çevresel koşullar ve emniyet kararı","title_en":"Assess manoeuvring and environmental conditions","learning_tr":"Geminin sürati, manevra kabiliyeti, itici donanımı, çevre gemiler, sığlık, rüzgâr, akıntı, dalga ve görüş değerlendirilir.","learning_en":"The vessel's speed, manoeuvrability, thrusters, surrounding traffic, shallow water, wind, current, waves and visibility are assessed.","exercise_tr":"Harita üzerinde rüzgâr, akıntı, trafik ve görüşe göre manevra seçeneklerini karşılaştırın; gerçek manevrayı varsaymayın.","exercise_en":"Compare manoeuvring options using charted wind, current, traffic and visibility; do not presume a live manoeuvre.","hazard_tr":"Kazazedeyi gözden kaybetme, sığlığa girme veya kontrolsüz geri dönüş manevrası.","hazard_en":"Losing sight of the casualty, entering shallow water or executing an uncontrolled recovery manoeuvre.","id":"MOB-04","source_full_tr":["Geminin sürati, manevra kabiliyeti, itici donanımı, çevre gemiler, sığlık, rüzgâr, akıntı, dalga ve görüş değerlendirilir. İlk görülen düşmede hızlı geri dönüş ile zaman geçmiş/görüş kaybolmuş olayda sistemli arama ihtiyacı arasındaki fark öğretilir. Anderson/Williamson/Scharnow gibi manevra aileleri kavramsal olarak karşılaştırılır; geminin manevra kitabındaki özellikler esastır. Gerçek deniz manevrası emniyetle yapılmayacaksa dümen/seyir kararı simüle edilir; kontrolsüz sert manevra yapılmaz."],"source_full_en":["Assess speed, handling characteristics, thrusters, other vessels, shallow water, wind, current, waves and visibility. Teach the distinction between a rapid return after an immediately observed fall and a systematic search when time has elapsed or visual contact is lost. Anderson, Williamson and Scharnow turn families are compared conceptually, while the ship's manoeuvring information remains authoritative. If an actual manoeuvre cannot be performed safely, steering and navigation decisions are simulated; uncontrolled hard manoeuvres are prohibited."],"source_integrity":"sha256_verified_against_embedded_blocks"},{"step":5,"title_tr":"Kazazedeye yaklaşma ve görsel takibin sürekliliği","title_en":"Maintain visual contact and plan approach","learning_tr":"Kazazedenin baş/gövde yönü, su akıntısı, kurtarma gemisinin borda salınımı ve pervane bölgesinin tehlikeleri açıklanır.","learning_en":"The casualty's orientation in the water, current, vessel's rolling alongside and hazards near the propeller are discussed.","exercise_tr":"Borda yaklaşma bölgesini ve gözlem hattını gemi planında gösterip güvenli yaklaşımın değişkenlerini sıralatın.","exercise_en":"Identify the recovery side and observation line on a vessel plan and discuss factors influencing a safe approach.","hazard_tr":"Pervane, borda darbesi, salınım ve kazazedenin gemi altında kalması.","hazard_en":"Propeller contact, hull impact, vessel motion and the casualty being drawn beneath the vessel.","id":"MOB-05","source_full_tr":["Kazazedenin baş/gövde yönü, su akıntısı, kurtarma gemisinin borda salınımı ve pervane bölgesinin tehlikeleri açıklanır. Operasyonda yaklaşma açısının tek değişken olmadığı, kontrol edilebilir en güvenli kurtarma alanının kaptan tarafından seçildiği öğretilir. Göz temasının kaybolduğu senaryoda ilk MOB mevkii, geminin izi, sürüklenme ve yeni gözlem bilgisi birlikte değerlendirilir. Gece projektör ve ek gözcü konularına, köprüüstü görüşünün korunması da eklenir."],"source_full_en":["Explain the casualty's position and orientation in the water, current, the recovering vessel's rolling or movement alongside and the dangers around propellers. The approach angle alone is not decisive: the master selects the safest controllable recovery area. If visual contact is lost, assess the original MOB position, vessel track, drift and any new sightings together. At night, the use of searchlights and extra lookouts must also preserve safe visibility from the bridge."],"source_integrity":"sha256_verified_against_embedded_blocks"},{"step":6,"title_tr":"Kurtarma aracı, bot/kepçe ve sudan alma","title_en":"Assess recovery equipment and retrieval","learning_tr":"Gemideki kurtarma botu ile doğrudan bordadan alma, uygun kurtarma ağı/sepete alma ve hizmet botuyla destek seçeneklerinin avantaj–riskleri karşılaştırılır. Botun fiilen indirilmesi, planlı bot taliminden ayrıca izin ve FR-09.","learning_en":"The benefits and hazards of using the ship's rescue boat, recovering directly over the side, an appropriate recovery net or basket, or support from a service boat are compared.","exercise_tr":"Kurtarma botu, ağ/sepet ve doğrudan alma seçeneklerini ekipman planında karşılaştırın; fiilî indirme için ayrı izin arayın.","exercise_en":"Compare rescue boat, net or basket and direct-recovery options against the equipment plan; require separate authorisation for any launch.","hazard_tr":"Askıda yük, kanca/halat tehlikesi, denize düşme ve uygun olmayan alma yönteminin seçilmesi.","hazard_en":"Suspended loads, hook and rope hazards, falling overboard and selecting an unsuitable recovery method.","id":"MOB-06","source_full_tr":["Gemideki kurtarma botu ile doğrudan bordadan alma, uygun kurtarma ağı/sepete alma ve hizmet botuyla destek seçeneklerinin avantaj–riskleri karşılaştırılır. Botun fiilen indirilmesi, planlı bot taliminden ayrıca izin ve FR-09.124 risk değerlendirmesi gerektirebilir. Kurtarma kepçesinin hedefi, kazazedeyi emniyetle destekleyerek gemiye almak; esas sınırlamaları ise bağlantı tertibatı, kaldırma kapasitesi, operatörün görüşü, bordadaki dalga ve kazazedenin durumudur. Özel üretici işletme talimatı olmadan kreyn/sapan yönlendirme adımları talimat olarak verilmez. Yaralı veya hipotermik kişinin yataya yakın pozisyonda kurtarılması öğretilir."],"source_full_en":["Compare direct recovery over the ship's side, deployment of the rescue boat, an appropriate recovery net or basket and support by a service craft, including benefits and risks. Launching the boat for a real operation may require separate authorisation and the EYS.09.124.FR risk assessment in addition to a scheduled boat drill. A recovery scoop supports a person safely during lifting; limitations include attachment arrangements, safe working load, the operator's view, waves alongside and the casualty's condition. No crane or sling operating sequence is prescribed without the manufacturer's specific instructions. Teach recovery of injured or hypothermic casualties in as near-horizontal a position as practicable."],"source_integrity":"sha256_verified_against_embedded_blocks"},{"step":7,"title_tr":"İlk yardım, tıbbi değerlendirme ve tamamlanmamış kurtarma","title_en":"Provide first aid and confirm recovery status","learning_tr":"Kazazede gemiye alındığında ilk yardım ekibinin görevi, hava yolu/solunum/bilinç kontrolü, yaralanma ve soğuk etkisinin değerlendirilmesi, emniyetli sıcak ortama alınması ve gerektiğinde tıbbi tavsiye/ambulans koordinasyonu ele…","learning_en":"Once recovered aboard, the casualty is assessed by the first-aid team for airway, breathing, consciousness, injuries and exposure to cold, then moved to a safe warm area. Medical advice or ambulance support is coordinated if necessary. If recovery is incomplete, discuss an alternative recovery point, assistance from other units and preservation of the last reliable position. A successful rescue is confirmed by evidence and assessment rather than assumed automatically.","exercise_tr":"Mankenli bir senaryoda güvenli alana alma, ilk değerlendirme ve tıbbi destek bildirim sırasını açıklatın.","exercise_en":"Use a manikin scenario to discuss safe transfer, initial assessment and the sequence of medical-support notifications.","hazard_tr":"Soğuk maruziyeti ve travmayı gözden kaçırma; eğitimi gerçek kurtarma kaydı olarak gösterme.","hazard_en":"Overlooking cold exposure or trauma, or recording the exercise as a real rescue.","id":"MOB-07","source_full_tr":["Kazazede gemiye alındığında ilk yardım ekibinin görevi, hava yolu/solunum/bilinç kontrolü, yaralanma ve soğuk etkisinin değerlendirilmesi, emniyetli sıcak ortama alınması ve gerektiğinde tıbbi tavsiye/ambulans koordinasyonu ele alınır. Kazazede alınamamışsa alternatif kurtarma noktası, başka yardım birimi ve kişinin son güvenilir mevkiini korumak için yapılacaklar tartışılır. Olayın “kurtarma başarılı” şeklinde bitirilmesinin otomatik değil, kanıt ve değerlendirmeye bağlı olduğu anlatılır."],"source_full_en":["Once the casualty is aboard, the first-aid team addresses airway, breathing, consciousness, injuries and cold exposure, moves the casualty to a safe warm location and arranges medical advice or ambulance support if required. If recovery fails, discuss an alternative recovery point, assistance from another unit and how to preserve the person's last reliable position. The event must not automatically be declared a successful rescue; completion depends on evidence and assessment."],"source_integrity":"sha256_verified_against_embedded_blocks"},{"step":8,"title_tr":"Talim kapanışı ve rapor hazırlığı","title_en":"Debrief and complete drill records","learning_tr":"MOB anonsu, gözlem ve mevki kaydı, seçilen manevra ve gerekçesi, gerçek/simüle ekipman faaliyeti, varsa bot indirme, kazazede alım yöntemi, ilk yardım, teknik eksiklikler ve kullanılan araçların yeniden hazır hâle getirilmesi…","learning_en":"Review the MOB alert, visual tracking and position log, the selected manoeuvre and rationale, actual or simulated equipment use, any rescue-boat launch, recovery method, first aid, technical deficiencies and restoration of readiness. Use the relevant 'Other drills' and MOB checklist topics as reporting prompts. An action that was only discussed or simulated must not be described as physically performed.","exercise_tr":"Olay çizelgesindeki ilk ihbar, mevki, seçilen yöntem, kullanılan ekipman ve kayıt alanlarını örnek rapora bağlayın.","exercise_en":"Link first report, position, selected method, equipment and record fields on an exercise timeline to a sample report.","hazard_tr":"Simüle edilmiş kurtarma/bot indirmesini gerçekleşmiş göstermek veya ekipmanı hazır duruma getirmemek.","hazard_en":"Reporting simulated recovery or boat launch as actual, or failing to restore equipment readiness.","id":"MOB-08","source_full_tr":["MOB anonsu, gözlem ve mevki kaydı, seçilen manevra ve gerekçesi, gerçek/simüle ekipman faaliyeti, varsa bot indirme, kazazede alım yöntemi, ilk yardım, teknik eksiklikler ve kullanılan araçların yeniden hazır hâle getirilmesi değerlendirilir. EK-V'nin “Diğer Role Talimleri” alanı için MOB senaryosu hazırlanır. İlgili EYS.08.108.FR kontrol konuları ve FR-09.110 risk tehlikeleri rapor öncesinde gözden geçirilir; fiilen yapılmamış işlem rapora yapılmış olarak geçmez."],"source_full_en":["Review the MOB announcement, lookout and position record, selected manoeuvre and rationale, actual versus simulated equipment use, any boat launch, recovery method, first aid, deficiencies and return of equipment to readiness. The MOB scenario is addressed under the 'Other Drills' area of EK-V. Relevant points from EYS.08.108.FR and hazards associated with the referenced risk assessment are reviewed before reporting; no action not actually performed is described as completed."],"source_integrity":"sha256_verified_against_embedded_blocks"}]},{"key":"mob_sar/SAR","family":"mob_sar","flow":"SAR","title_tr":"Arama ve Kurtarma","title_en":"Search and Rescue","family_title_tr":"Denize Adam Düştü / SAR","family_title_en":"Man Overboard / Search and Rescue","stages":[{"step":1,"title_tr":"Yardım çağrısının alınması ve olay resminin kurulması","title_en":"Receive the distress alert and establish the situation","learning_tr":"Gelen haberin kaynağı, olayın zamanı, mevkii, olay türü, tehlikedeki kişi sayısı, varsa son görülme bilgisi ve yardım talebinin niteliği kaydedilir.","learning_en":"The source of the incoming report, incident time and position, type of occurrence, number of people in danger, any last-known sighting and the nature of the request for assistance are recorded.","exercise_tr":"Örnek yardım mesajından mevki, saat, kişi sayısı ve bilgi güvenilirliği alanlarını ayırıp olay kartı oluşturun.","exercise_en":"Extract position, time, persons at risk and confidence level from a simulated assistance message to build an incident card.","hazard_tr":"Eksik/şüpheli bilgiyi kesin kabul etme veya geminin kendi emniyetini göz ardı etme.","hazard_en":"Treating incomplete or uncertain information as certain, or disregarding own-ship safety.","id":"SAR-01","source_full_tr":["Gelen haberin kaynağı, olayın zamanı, mevkii, olay türü, tehlikedeki kişi sayısı, varsa son görülme bilgisi ve yardım talebinin niteliği kaydedilir. Gemi kendi imkanlarıyla ne ölçüde yardım sağlayabileceğini ve kendi personeli/seyir emniyetini nasıl koruyacağını değerlendirir; kaptan bilgilendirilir. Alınan bilginin kesinliği kaynak/teyit düzeyine göre ayrılır: bildirilen koordinat, gözlenen kazazede, tahmin edilen sürüklenme noktası aynı veri değildir."],"source_full_en":["Record the source of an incoming report, incident time and position, type of incident, number of persons at risk, last known sighting if any and nature of assistance requested. Assess how much help the ship can provide while protecting its own crew and navigational safety, and inform the master. Distinguish information by source and verification status: a reported coordinate, an observed casualty and a predicted drift point are not equivalent data."],"source_integrity":"sha256_verified_against_embedded_blocks"},{"step":2,"title_tr":"SAR haberleşmesi ve RCC/MRCC ile ilişki","title_en":"Coordinate communications with RCC/MRCC","learning_tr":"SAR hizmetinin görevleri SMC (Search and Rescue Mission Coordinator), OSC (On-Scene Coordinator) ve fiilen katılan birimlerin görevleri olarak açıklanır.","learning_en":"The roles of the search and rescue service are explained, distinguishing the Search and Rescue Mission Coordinator (SMC), On-Scene Coordinator (OSC) and participating units.","exercise_tr":"RCC/MRCC, SMC, OSC ve katılan gemi rollerini bir haberleşme diyagramında ayırt ettirin.","exercise_en":"Distinguish RCC/MRCC, SMC, OSC and participating vessel roles on a communications diagram.","hazard_tr":"Yetkisiz arama koordinasyonu üstlenme veya tatbikatta gerçek tehlike trafiği üretme.","hazard_en":"Assuming SAR coordination authority without assignment or transmitting real distress traffic during a drill.","id":"SAR-02","source_full_tr":["SAR hizmetinin görevleri SMC (Search and Rescue Mission Coordinator), OSC (On-Scene Coordinator) ve fiilen katılan birimlerin görevleri olarak açıklanır. Kıyı kurtarma koordinasyon merkezinin (RCC/MRCC) operasyonu koordine etmesi, gerekli durumda OSC'nin belirlenmesi ve geminin aldığı talimatların teyit edilmesi öğretilir. Bir gemi kendiliğinden “resmî OSC olarak atandı” varsayımıyla diğer birimlere emir vermez. Geminin mevkisi, yardım kapasitesi, tahmini varış zamanı (ETA), hava-deniz durumu ve kısıtları ilgili makama doğru biçimde iletilir."],"source_full_en":["Explain the respective roles of the Search and Rescue Mission Coordinator (SMC), On-Scene Coordinator (OSC) and participating units. Personnel learn that the rescue coordination centre (RCC/MRCC) coordinates the operation, may designate an OSC and that instructions received by the ship must be confirmed. A ship must not presume it has been officially appointed OSC or issue orders to other units on that basis. It reports its position, capacity to assist, estimated time of arrival, sea and weather conditions, and limitations accurately to the competent authority."],"source_integrity":"sha256_verified_against_embedded_blocks"},{"step":3,"title_tr":"Personel görevleri, kurtarma güvertesi ve sağlık hazırlığı","title_en":"Organize deck crews and medical readiness","learning_tr":"Köprüüstü arama/seyrüsefer ekibi, gözcüler, güverte kurtarma ekibi, kurtarma botu, makine, telsiz ve tıbbi personel hazırlanır. Personel sayımı ve görev dağılımı role cetveliyle ilişkilendirilir.","learning_en":"The bridge search and navigation team, lookouts, deck recovery party, rescue-boat crew, engine personnel, radio operators and medical team prepare for their assignments.","exercise_tr":"Gözcü, kurtarma güvertesi, bot ve ilk yardım ekiplerini gösteren bir hazırlık kontrol tablosu kullanın.","exercise_en":"Use a preparation checklist covering lookouts, recovery deck, boat and first-aid teams.","hazard_tr":"Hazırlıksız kurtarma alanı, yetersiz personel veya donanımın yanlış kullanımına bağlı yaralanma.","hazard_en":"An unprepared recovery area, insufficient personnel or injury from improper equipment use.","id":"SAR-03","source_full_tr":["Köprüüstü arama/seyrüsefer ekibi, gözcüler, güverte kurtarma ekibi, kurtarma botu, makine, telsiz ve tıbbi personel hazırlanır. Personel sayımı ve görev dağılımı role cetveliyle ilişkilendirilir. Kurtarma sepeti/kepçesi, can simidi, ağ, çarmıh, sedye/örtü, kişisel koruyucu donanım ve acil haberleşmenin kullanılabilirliği kontrol edilir. Yardım edilecek kişinin yüzme gücü, yaşı ve yaralanması bilinmiyorsa daha güç koşullara uygun alternatif kurtarma yöntemi hazır tutulur."],"source_full_en":["Prepare the bridge search and navigation team, lookouts, deck recovery team, rescue boat, engineering, radio and medical personnel. Relate headcount and task allocation to the muster list. Check the serviceability of relevant recovery baskets or scoops, lifebuoys, nets, ladders, stretchers or blankets, protective equipment and emergency communications. If the casualty's swimming ability, age or injuries are unknown, keep an alternative recovery method ready for more challenging conditions."],"source_integrity":"sha256_verified_against_embedded_blocks"},{"step":4,"title_tr":"Arama planı için datum, sürüklenme ve bilgi güncelleme","title_en":"Update datum and drift assumptions","learning_tr":"Datum, aramanın hesaplamalı referans alanı olarak öğretilir; sabit bir nokta olarak düşünülmez. Son güvenilir mevki, akıntı, rüzgâr, dalga, geçen süre, hedef tipi ve mevcut görüş durumuyla birlikte değerlendirilir.","learning_en":"The datum is taught as a calculated reference for the search area, not necessarily as a fixed point. The last reliable position is considered together with current, wind, waves, elapsed time, target type and prevailing visibility.","exercise_tr":"Örnek son görülen mevki ve rüzgâr/akıntı verileriyle datumun nasıl değişebileceğini harita üzerinde tartışın.","exercise_en":"Discuss how a search datum may evolve using a sample last-known position and wind/current information.","hazard_tr":"Datumun değişmez nokta sanılması, yanlış veri ile arama alanının daraltılması.","hazard_en":"Treating the datum as fixed or narrowing the search area on unreliable data.","id":"SAR-04","source_full_tr":["Datum, aramanın hesaplamalı referans alanı olarak öğretilir; sabit bir nokta olarak düşünülmez. Son güvenilir mevki, akıntı, rüzgâr, dalga, geçen süre, hedef tipi ve mevcut görüş durumuyla birlikte değerlendirilir. Arama alanı önceden belirlenmiş otorite planına bağlıysa koordinat/istikamet teyit edilir. Yeni radar/AIS/görsel bilgi, bulunan enkaz veya yaşam belirtisi, planın ve arama bölgesinin yeniden değerlendirilmesine yol açabilir. Hesaplanmış datumun hata payı ve verinin kaynağı açık tutulur."],"source_full_en":["Teach datum as a calculated reference for a search area, not as an immutable point. Assess the last reliable position together with current, wind, waves, elapsed time, target type and visibility. Where the search area is based on an authority's plan, confirm its coordinates and headings. New radar, AIS or visual information, wreckage or indications of life may require the search plan and area to be reconsidered. The uncertainty and source of the calculated datum are made explicit."],"source_integrity":"sha256_verified_against_embedded_blocks"},{"step":5,"title_tr":"Arama paternlerinin amaçları ve seçilmesi","title_en":"Assess search patterns and their purposes","learning_tr":"Expanding Square (genişleyen kare), Sector Search (sektör), Parallel Track (paralel tarama), Creeping Line (şerit tarama) ve Trackline (rota hattı araması) paternlerinin hangi arama problemi için düşünülebileceği kavramsal…","learning_en":"Expanding Square, Sector Search, Parallel Track, Creeping Line and Trackline patterns are compared conceptually in terms of the search problems they may address.","exercise_tr":"Arama paternlerini örnek saha büyüklüğü ve bilgi güvenilirliği durumlarıyla eşleştiren kavramsal bir tablo hazırlatın.","exercise_en":"Match search patterns to hypothetical search-area sizes and information confidence in a conceptual table.","hazard_tr":"Örnek paternin gerçek koordinasyon planı veya onaylı seyir rotası sayılması.","hazard_en":"Treating an illustrative pattern as the actual coordinated search plan or an approved route.","id":"SAR-05","source_full_tr":["Expanding Square (genişleyen kare), Sector Search (sektör), Parallel Track (paralel tarama), Creeping Line (şerit tarama) ve Trackline (rota hattı araması) paternlerinin hangi arama problemi için düşünülebileceği kavramsal olarak karşılaştırılır. Paterne yalnızca adı nedeniyle karar verilmez; tahmini olay noktası güvenilirliği, arama alanının şekli, hedef büyüklüğü, görünürlük, deniz durumu, akıntı ve diğer birimlerle çakışma riski dikkate alınır. Arama bacağı uzunluğu, dönüş istikameti, tarama aralığı veya hız gibi sayısal parametreler yerinde gözlem ve IAMSAR'ın geçerli nüshası/koordinatör talimatı doğrulanmadan varsayılmaz. Takip edilen rota ve aranan alan kayıt altına alınır."],"source_full_en":["Compare the purposes of expanding-square, sector, parallel-track, creeping-line and trackline search patterns conceptually. Do not select a pattern merely because of its name: consider confidence in the estimated incident position, search-area shape, target size, visibility, sea state, current and the risk of conflict with other units. Numerical parameters such as leg length, turn direction, track spacing or speed are not assumed without checking observed conditions, the current IAMSAR guidance and the coordinator's instructions. Record the track followed and the area searched."],"source_integrity":"sha256_verified_against_embedded_blocks"},{"step":6,"title_tr":"Temas/tespit sonrası kurtarma kararı ve diğer birimlerle eşgüdüm","title_en":"Plan recovery and coordinate with other units","learning_tr":"Kazazede ya da kurtarma aracı bulunduğunda yeni mevki ve durum bildirilir. Olay yerindeki akıntı, gemi hareketi, pervane ve borda tehlikeleri, kurtarma kapasitesi, bot/sudaki ağ/kepçe seçenekleri ortak çekirdeğe göre…","learning_en":"When a casualty or survival craft is located, report the updated position and situation. Assess current, vessel motion, propeller and hull-side hazards, recovery capacity, and feasible boat, net or scoop recovery methods. For multiple casualties, consider available capacity, immediate medical priorities and safe reception or transfer to other units. Uncontrolled simultaneous interventions or improper use of recovery gear may introduce further hazards.","exercise_tr":"Tespit edilen hedefin raporu, güvenli yaklaşma ve farklı sudan alma seçeneklerini olay kartında karşılaştırın.","exercise_en":"Compare contact reporting, safe approach and recovery options on a simulated sighting card.","hazard_tr":"Pervane/borda teması, diğer SAR birimleriyle çakışan manevra ve koordinasyonsuz bot kullanımı.","hazard_en":"Propeller or hull contact, conflicting manoeuvres with other SAR units and uncoordinated boat use.","id":"SAR-06","source_full_tr":["Kazazede ya da kurtarma aracı bulunduğunda yeni mevki ve durum bildirilir. Olay yerindeki akıntı, gemi hareketi, pervane ve borda tehlikeleri, kurtarma kapasitesi, bot/sudaki ağ/kepçe seçenekleri ortak çekirdeğe göre değerlendirilir. Çok sayıda kazazede varsa kapasite, hava yolu ve tıbbi aciliyet, güvenli kabul alanı ve gerekirse diğer birimlere dağıtım öğretilir. Kurtarma gereçlerinin yanlış kullanılması ya da ekiplerin aynı kişiye eşzamanlı kontrolsüz müdahalesi yeni tehlike yaratabilir."],"source_full_en":["When a casualty or survival craft is sighted, report the new position and condition. Assess local current, ship motion, propellers and ship-side hazards, recovery capacity, and rescue-boat, net or basket options under the common recovery principles. With numerous casualties, instruction covers capacity, airway and medical urgency, a safe receiving area and distribution to other units if required. Incorrect use of recovery appliances or uncontrolled simultaneous intervention by several teams can create additional danger."],"source_integrity":"sha256_verified_against_embedded_blocks"},{"step":7,"title_tr":"Kurtarılanların bakımı, kimlik ve tahliye koordinasyonu","title_en":"Care for survivors and arrange medical support","learning_tr":"Kurtarılan kişi sayısı, kalan kayıp kişiler, ilk tıbbi değerlendirme, sıcaklık/yaralanma durumu ve üst makamla iletişim ele alınır.","learning_en":"The exercise covers the number recovered, persons still missing, initial medical assessment, cold exposure and injuries, and communication with the responsible authority.","exercise_tr":"Kurtarılan kişi sayısı, kalan arananlar, ilk sağlık değerlendirmesi ve yetkili bildirim akışını örnekle gösterin.","exercise_en":"Illustrate recovered persons, those still missing, initial medical assessment and authorised reporting in a sample record.","hazard_tr":"Kişisel bilgilerin gereksiz yayılması, yaralı bakımının gecikmesi ve sayım hatası.","hazard_en":"Unnecessary disclosure of personal details, delayed casualty care and counting errors.","id":"SAR-07","source_full_tr":["Kurtarılan kişi sayısı, kalan kayıp kişiler, ilk tıbbi değerlendirme, sıcaklık/yaralanma durumu ve üst makamla iletişim ele alınır. Kazazedelerin kimlik ve yakınlarına ilişkin bilgiler gerektiği ölçüde, kurumun yetkili kayıt sisteminde ve kişisel veri koruma esaslarıyla yönetilir. Limana sevk, ambulans/uzaktan tıbbi yardım, konaklama/iaşe ve tahliye planı yalnızca olayın gerektirdiği ve yetkili makamla koordine edilmişse uygulanır. Tatbikatta gerçek bir ambulans veya acil servis talebi yapılmış gibi beyan üretilmez."],"source_full_en":["Cover the number of persons recovered, persons still missing, initial medical assessment, exposure and injuries, and communications with the responsible authority. Information identifying casualties and their relatives is handled only to the necessary extent through authorised institutional systems and in accordance with personal-data safeguards. Transfer to port, ambulance or remote medical advice, accommodation, provisions and evacuation arrangements are applied only when justified by the incident and coordinated with the competent authority. A drill report must not suggest that an actual ambulance or emergency-service request was made when none occurred."],"source_integrity":"sha256_verified_against_embedded_blocks"},{"step":8,"title_tr":"Durum raporları, aramanın sonlandırılması ve kapanış","title_en":"Report status, review termination authority and close","learning_tr":"Olay komutanı/koordinatörün verdiği görev, ETA, mevki, aranan alan, yapılan tarama, tespitler, kurtarılan ve kayıp kişi sayıları, kullanılan ekipman, haberleşme ve son durum raporlanır.","learning_en":"The situation report covers tasks assigned by the incident commander or coordinator, ETA, position, search area, searches performed, sightings, numbers recovered and missing, equipment used, communications and current status.","exercise_tr":"Örnek durum raporunu görev, taranan saha, tespit, kurtarma ve sonraki emir başlıklarıyla değerlendirin.","exercise_en":"Review a simulated situation report by assigned task, area searched, detections, recovery and subsequent instructions.","hazard_tr":"Aramayı koordinatör kararı olmaksızın bitmiş sayma veya simülasyonu gerçek görev kaydı olarak yazma.","hazard_en":"Treating the search as terminated without the coordinator's direction, or logging simulation as an actual mission.","id":"SAR-08","source_full_tr":["Olay komutanı/koordinatörün verdiği görev, ETA, mevki, aranan alan, yapılan tarama, tespitler, kurtarılan ve kayıp kişi sayıları, kullanılan ekipman, haberleşme ve son durum raporlanır. Arama sahasından ayrılma veya SAR faaliyetinin sonlandırılması, olayın niteliğine ve koordinatörün yetkisine göre açıklanır. Aramanın gemi tarafından tek başına sona erdirilmesi, ilgili makamın görev devri ve gerçek olay şartları doğrulanmadan genel kural gibi öğretilmez. EK-V “Diğer Role Talimleri” anlatımı ve EYS.08.107.FR konu listesiyle karşılaştırma yapılır."],"source_full_en":["Report the assigned task from the incident commander or coordinator, ETA, positions, search areas and tracks, sightings, numbers rescued and missing, equipment used, communications and latest situation. Explain departure from the search area or termination of SAR activity according to the incident and the coordinator's authority. The ship must not be taught to end a search unilaterally as a general rule without confirmation of the responsible authority's task handover and actual circumstances. Compare the EK-V 'Other Drills' narrative with the subject list of EYS.08.107.FR."],"source_integrity":"sha256_verified_against_embedded_blocks"}]},{"key":"boats/RESCUE","family":"boats","flow":"RESCUE","title_tr":"Kurtarma Botu / FRC","title_en":"Rescue Boat / FRC","family_title_tr":"Kurtarma ve Hizmet Botları","family_title_en":"Rescue and Service Boats","stages":[{"step":1,"title_tr":"Talimin amacı, kurtarma görevi ve senaryo","title_en":"Define rescue-boat scenario and task","learning_tr":"Kurtarma botunun ana görevleri; sudaki kazazedenin bulunması ve alınması, can salına yardım, acil durumdaki küçük tekneye yaklaşma ve gerektiğinde kurtarılan kişinin ana gemiye aktarılması üzerinden anlatılır.","learning_en":"Explain rescue-boat duties through locating and recovering a person in the water, assisting a liferaft, approaching a small craft in distress and transferring survivors to the parent vessel when required. Verify the actual craft class, permitted crew and operating limits, launching arrangement and relevant checklists. Drill objectives include task acceptance, safe preparation, controlled launch, manoeuvring, recovery and retrieval. Decide explicitly which elements can be performed and which remain classroom or tabletop exercises.","exercise_tr":"Kurtarma botunun sertifikalı göreviyle seçilen MOB/kazazede alma senaryosunu eşleştirerek faaliyet kapsamını belirleyin.","exercise_en":"Match the rescue boat's certified role to a simulated MOB or recovery scenario and define the activity scope.","hazard_tr":"Botun onaylı kullanım sınırlarının aşılması veya eğitim senaryosunun gerçek görevle karıştırılması.","hazard_en":"Exceeding approved boat operating limits or confusing an exercise with an actual response.","id":"RESCUE-01","source_full_tr":["Kurtarma botunun ana görevleri; sudaki kazazedenin bulunması ve alınması, can salına yardım, acil durumdaki küçük tekneye yaklaşma ve gerektiğinde kurtarılan kişinin ana gemiye aktarılması üzerinden anlatılır. Botun görevli sayısı, seyir/operasyon sınırları, gerçek araç sınıfı, indirme tertibatı ve ilgili kontrol listeleri doğrulanır. Talim hedefleri; görevin doğru alınması, emniyetli hazırlanma, kontrollü indirme, seyir/manevra, kazazede alma ve geri alınmadır. Senaryoda gerçek operasyon kapsamı ile yalnızca sözlü/masa başı öğretilecek olay gelişmeleri ayrı kararlaştırılır."],"source_full_en":["Explain the rescue boat's principal tasks: finding and recovering a person in the water, assisting a liferaft, approaching a small craft in distress and, where required, transferring survivors to the parent vessel. Verify the approved crew number, navigation and operating limits, actual craft class, launch arrangement and relevant checklists. The drill objectives are correct task acceptance, safe preparation, controlled launch, navigation and manoeuvring, casualty recovery and retrieval of the craft. Decide separately which activities will be performed and which scenario developments will be taught orally or as a tabletop exercise."],"source_integrity":"sha256_verified_against_embedded_blocks"},{"step":2,"title_tr":"Risk değerlendirmesi ve görev dağılımı","title_en":"Risk assessment and crew assignments","learning_tr":"Talim mahallinin hava, deniz, akıntı ve görüş durumu; ana geminin demirleme/seyir hâli, trafik, borda etrafındaki emniyet sahası ve acil destek imkânları değerlendirilir. EYS.09.124.","learning_en":"Assess weather, sea state, current and visibility, whether the parent ship is at anchor or underway, traffic, the safety area alongside and available emergency support. Explain the hazards in EYS.09.124.","exercise_tr":"Hava, deniz, akıntı, trafik ve indirme sahası risklerini botun görev planı üzerinde değerlendirtin.","exercise_en":"Review wind, sea, current, traffic and launching-area hazards against the boat's task plan.","hazard_tr":"Bot/personel düşmesi, ana gemiye çarpma ve emniyetsiz indirme şartları.","hazard_en":"Boat or personnel falls, contact with the mother ship and unsafe launch conditions.","id":"RESCUE-02","source_full_tr":["Talim mahallinin hava, deniz, akıntı ve görüş durumu; ana geminin demirleme/seyir hâli, trafik, borda etrafındaki emniyet sahası ve acil destek imkânları değerlendirilir. EYS.09.124.FR kapsamındaki botun düşmesi, personelin düşüp yaralanması, kaygan zeminde kayıp düşme ve serbest halat/bağların çarpması tehlikeleri personele açıklanır. Motor, pervane ve yaklaşma manevrası gibi ek tehlikeler ayrıca ele alınır. İşbaşı konuşmasında komuta ve durdurma yetkisi belirlenir; acil yardım aracı ve personelin hazırlığı kontrol edilir."],"source_full_en":["Assess weather, sea state, current and visibility at the drill site; whether the parent vessel is anchored or underway; traffic, the safety area alongside and available emergency support. Explain hazards addressed by EYS.09.124.FR: dropping the boat, personnel falling or being injured, slips on slippery surfaces and strikes from freed ropes or securing lines. Consider additional hazards from the engine, propeller and approach manoeuvres. The pre-job briefing assigns command and stop-work authority and checks the readiness of emergency assistance and personnel."],"source_integrity":"sha256_verified_against_embedded_blocks"},{"step":3,"title_tr":"Botun ve personelin hazırlanması","title_en":"Prepare the boat and crew","learning_tr":"Güverte ekibi botun durumunu, görünür yapısal hasar belirtilerini, bağlantı/istif güvenliğini, kaldırma tertibatının uygunluğunu ve bakım kayıtlarına göre faaliyete engel durum bulunup bulunmadığını inceler.","learning_en":"The deck team examines the boat's condition, visible signs of structural damage, stowage and securing arrangements, suitability of lifting appliances and whether maintenance records show any condition preventing use.","exercise_tr":"Bot, bağlantılar, kaldırma tertibatı ve personel KKD'si için görsel hazırlık kontrolünü gösterin.","exercise_en":"Demonstrate a visual readiness check of the boat, securing points, lifting arrangement and crew PPE.","hazard_tr":"Hasarlı donanımın kullanılması, uygunsuz yük dağılımı veya hazırlıksız personel.","hazard_en":"Using damaged equipment, improper weight distribution or inadequately prepared personnel.","id":"RESCUE-03","source_full_tr":["Güverte ekibi botun durumunu, görünür yapısal hasar belirtilerini, bağlantı/istif güvenliğini, kaldırma tertibatının uygunluğunu ve bakım kayıtlarına göre faaliyete engel durum bulunup bulunmadığını inceler. Bot personeli uygun can yeleği ve görevine ilişkin koruyucu donanımla hazırlanır; kurtarma halatları, ağ/sepet, ilk yardım ve temel seyir/haberleşme araçlarının gerekli olanları kontrol edilir. Botun izin verilen görevli sayısı ve ekipman yükü aşılmaz; kurtarma donanımı hareketi engellemeyecek şekilde emniyete alınır."],"source_full_en":["The deck team examines the boat's condition, visible signs of structural damage, secure stowage and attachments, suitability of lifting arrangements and maintenance records for obstacles to operation. Boat crew prepare with appropriate lifejackets and task-specific personal protection; relevant recovery lines, nets or baskets, first aid and basic navigation or communication equipment are checked. The authorised crew number and equipment load must not be exceeded, and recovery gear is secured so it cannot obstruct movement."],"source_integrity":"sha256_verified_against_embedded_blocks"},{"step":4,"title_tr":"Köprüüstü, güverte ve bot arasındaki haberleşme","title_en":"Establish ship-to-boat communications","learning_tr":"Bütün görev yerlerinin birbirini duyabildiği ve komutları aynı anladığı kontrol edilir. Botun hangi nedenle suya indirileceği, geminin makine/itici durumuyla ilişkili emniyet sınırları ve kullanılacak haberleşme yöntemi açıklanır.","learning_en":"Check that all stations can hear one another and understand commands consistently. Explain the reason for launching the boat, safety limits connected with the parent ship's engine and thruster status, and the communication method.","exercise_tr":"Köprüüstü–indirme ekibi–bot arasındaki komutları sözlü geri okuma ile prova ettirin.","exercise_en":"Rehearse commands and read-back between bridge, launching party and boat crew.","hazard_tr":"Birbirini tutmayan komutlar, haberleşme kaybı ve eşzamanlı kontrolsüz hareket.","hazard_en":"Conflicting commands, loss of communication and uncoordinated simultaneous movements.","id":"RESCUE-04","source_full_tr":["Bütün görev yerlerinin birbirini duyabildiği ve komutları aynı anladığı kontrol edilir. Botun hangi nedenle suya indirileceği, geminin makine/itici durumuyla ilişkili emniyet sınırları ve kullanılacak haberleşme yöntemi açıklanır. Komuta zinciri, gönderilen komutun tekrar edilmesi ve teyit edilmesi, olumsuz durumda işlemi durdurma usulü eğitimde uygulanır. Gerçek tehlike/acelelik mesajları, yetkili makamın koordinasyonu olmadan tatbikat amacıyla yayımlanmaz."],"source_full_en":["Confirm all stations can hear one another and interpret commands consistently. Explain the purpose for launching the boat, safety limits arising from the parent vessel's machinery or thruster status and the chosen communication method. Train the command chain, order read-back and confirmation, and the procedure for stopping work when conditions become adverse. Actual distress or urgency messages must not be transmitted during a drill without the coordination of the competent authority."],"source_integrity":"sha256_verified_against_embedded_blocks"},{"step":5,"title_tr":"İndirme öncesi güvenlik ve tertibatın değerlendirilmesi","title_en":"Check launch equipment and safeguards","learning_tr":"Matafora/vinç, kaldırma bağlantısı, botu istifte tutan donanım, kanca ve emniyet tertibatı donanımın onaylı kullanım kılavuzuna göre tanıtılır.","learning_en":"Demonstrate the davit or crane, lifting connections, stowage restraints, hook and safety arrangements in accordance with the approved equipment manual.","exercise_tr":"Onaylı ekipman çizimi üzerinden kanca, fren, emniyet tertibatı ve tehlikeli alanları tanıtın.","exercise_en":"Identify hooks, brakes, safety devices and exclusion zones using the approved launching-equipment diagram.","hazard_tr":"Askıda yük altında kalma, hatalı kanca işlemi ve beklenmeyen bot hareketi.","hazard_en":"Standing beneath a suspended load, incorrect hook operation and unexpected boat movement.","id":"RESCUE-05","source_full_tr":["Matafora/vinç, kaldırma bağlantısı, botu istifte tutan donanım, kanca ve emniyet tertibatı donanımın onaylı kullanım kılavuzuna göre tanıtılır. Personelin hareketli yükün altında kalmaması, gevşek halat ve bağlantıların çalışma alanını kapatmaması, bağlantının yanlış kurulması veya kancanın yanlış zamanda bırakılması gibi tehlikeler anlatılır. Hidrolik veya elektrik güç kesilmesi hâlinde sistemin nasıl emniyete alınacağı genel eğitim konusu olarak açıklanır; gerçek güç kesintisi yaratılmaz."],"source_full_en":["Introduce the davit or crane, lifting connection, stowage securing devices, hooks and safety mechanisms against the equipment's approved operating manual. Explain hazards from standing beneath a moving load, loose ropes or connections obstructing the worksite, incorrect rigging and release of a hook at the wrong moment. Procedures for securing the arrangement after a loss of hydraulic or electrical power are discussed as general instruction; a real loss of power is not induced."],"source_integrity":"sha256_verified_against_embedded_blocks"},{"step":6,"title_tr":"Kontrollü suya indirme ve ayrılma","title_en":"Demonstrate controlled launching where authorized","learning_tr":"Kaptanın verdiği operasyon izni ve gözetimi altında, uygun koşullarda indirme işlemi yetkili personel tarafından üretici prosedürüne göre yürütülür.","learning_en":"With the master's authorisation and oversight and under suitable conditions, authorised personnel launch the boat in accordance with the manufacturer's procedure.","exercise_tr":"Suya indirme karar noktaları ve abort/iptal haberleşmesini senaryo olarak gösterin; gerçek indirme ayrıca yetkilendirilir.","exercise_en":"Demonstrate launch decision points and abort communications as a scenario; any live launch requires separate authorisation.","hazard_tr":"Botun ana gemiye vurması, ani salınım veya yetkisiz indirme.","hazard_en":"Boat impact against the mother ship, sudden swinging or unauthorised launching.","id":"RESCUE-06","source_full_tr":["Kaptanın verdiği operasyon izni ve gözetimi altında, uygun koşullarda indirme işlemi yetkili personel tarafından üretici prosedürüne göre yürütülür. Botun hareketi, ana gemi bordası, iniş hattı, rüzgâr/akıntı ve personelin pozisyonu boyunca izlenir. Suya temas, kancanın serbest bırakılması ve gemiden ayrılma işlemlerinin ayrı doğrulama noktaları olduğu öğretilir. Botun indirilmesi uygun görülmüyorsa, bunun yerine indirme tertibatının güvenli saha tanıtımı ve senaryo üstünden uygulama anlatılır; yalnızca simülasyon yapıldığı raporda belirtilir."],"source_full_en":["Under the master's operating authorisation and supervision, qualified personnel carry out the launch in suitable conditions in accordance with the manufacturer's procedure. Monitor boat movement, the parent vessel's side, lowering track, wind and current, and crew positions throughout. Teach that water contact, hook release and departure from the ship are separate points requiring confirmation. If launch is not approved, replace it with a safe familiarisation of the launch arrangement and a scenario exercise; the report states that only simulation took place."],"source_integrity":"sha256_verified_against_embedded_blocks"},{"step":7,"title_tr":"Manevra, kazazede alma eğitimi ve gemiye dönüş","title_en":"Practise manoeuvring and casualty recovery","learning_tr":"Yetkili bot personeliyle düşük süratte kumanda, dönüş, kontrollü duruş, güvenli yaklaşma, haberleşme, ana gemiden ayrılma ve dönüş kuralları gösterilir.","learning_en":"With authorised crew, demonstrate low-speed steering, turning, controlled stopping, safe approach, communications, departure from the parent ship and return procedures.","exercise_tr":"Düşük süratli manevra ve kazazedeye yaklaşma usulünü manken/şema üzerinden anlatın.","exercise_en":"Explain low-speed manoeuvring and approach to a casualty with a manikin or diagram.","hazard_tr":"Pervane teması, borda sıkışması, kazazedenin bot altında kalması.","hazard_en":"Propeller contact, crush hazards alongside and the casualty being drawn beneath the boat.","id":"RESCUE-07","source_full_tr":["Yetkili bot personeliyle düşük süratte kumanda, dönüş, kontrollü duruş, güvenli yaklaşma, haberleşme, ana gemiden ayrılma ve dönüş kuralları gösterilir. Kurtarma görevi senaryoya dâhilse, kişiye ulaşmadan önce pervane, borda ve bot hareketinin tehlikeleri ele alınır; kazazede yerine eğitim mankeni veya uygun işaret kullanılabilir. Kazazedeyi bot içine alacak araç ve tutuş şekli, yüksekten kontrolsüz kaldırma ve ikinci yaralanma riskleri açısından anlatılır. Talim hedefi, sürat gösterisi değil kontrollü ve tekrarlanabilir kurtarma yetkinliğidir."],"source_full_en":["Qualified boat crew demonstrate low-speed control, turns, controlled stops, safe approach, communications, departure from and return to the parent vessel. When casualty recovery is part of the scenario, review propeller, hull-side and craft-motion hazards before reaching the person; a training dummy or suitable marker may replace a casualty. Explain the means and handholds used to bring the casualty aboard, considering uncontrolled lifting and secondary injury risks. The objective is controlled, repeatable rescue competence, not a display of speed."],"source_integrity":"sha256_verified_against_embedded_blocks"},{"step":8,"title_tr":"Emniyetli geri alma, kontrol ve kayıt","title_en":"Recover, restore and record","learning_tr":"Bot ana gemiye geri yaklaşırken rüzgâr/akıntı, gövde hareketi ve matafora alanı yeniden değerlendirilir. Bağlantının uygun kurulması, kaldırma güzergâhı, personelin güvenli konumu ve indirme/geri alma sistemi üzerindeki yükün…","learning_en":"Reassess wind, current, ship motion and the davit area as the boat approaches the parent ship. Teach correct attachment, lifting path, safe personnel positions and proper control of load on the launch-and-recovery system.","exercise_tr":"Geri alma güzergâhı, kaldırma bağlantıları, personel emniyeti ve kayıtları örnek kontrol listesiyle eşleştirin.","exercise_en":"Match recovery path, lifting connections, crew safety and records to a sample checklist.","hazard_tr":"Yük altına girme, bağlantı hatası ve denize indirilmeyen botun indirilmiş kaydedilmesi.","hazard_en":"Standing beneath a load, incorrect attachment and recording a launch that did not occur.","id":"RESCUE-08","source_full_tr":["Bot ana gemiye geri yaklaşırken rüzgâr/akıntı, gövde hareketi ve matafora alanı yeniden değerlendirilir. Bağlantının uygun kurulması, kaldırma güzergâhı, personelin güvenli konumu ve indirme/geri alma sistemi üzerindeki yükün doğru kontrol edilmesi öğretilir. Bot istif yerine alındıktan sonra emniyet bağları ve kullanıma hazır durumu kontrol edilir; düzensizlik veya arıza belirlenirse takip işlemi açılır. EK-V kaydında hangi botun hangi tarihte suya indirildiği, motor/manevra ve geri alma işlemlerinin hangilerinin fiilen yapıldığı, olası simülasyonlar, risk değerlendirmesi, katılım ve bulgular doğru anlatılır."],"source_full_en":["Reassess wind, current, hull motion and the davit area as the boat approaches the parent vessel. Teach correct attachment, the lifting path, safe crew positions and control of the load on the launch or recovery equipment. Once secured in its stowage, check securing devices and readiness for use; raise follow-up action for any defect. The EK-V report accurately distinguishes which craft was launched and on what date, which engine, manoeuvring and recovery actions were performed, which were simulated, and relevant risk assessment, attendance and findings."],"source_integrity":"sha256_verified_against_embedded_blocks"}]},{"key":"boats/SERVICE","family":"boats","flow":"SERVICE","title_tr":"Hizmet Botu / Daughter Craft","title_en":"Service Boat / Daughter Craft","family_title_tr":"Kurtarma ve Hizmet Botları","family_title_en":"Rescue and Service Boats","stages":[{"step":1,"title_tr":"Görev tanımı ve operasyon sınırı","title_en":"Define the workboat role and boundaries","learning_tr":"Hizmet botunun gemiye bağlı çalışma aracı olarak hangi işlerde kullanılabildiği, görevlerin onaylı operasyon planı ve bot donanımıyla sınırlı olduğu açıklanır.","learning_en":"Explain the activities for which the service/work boat is approved as an auxiliary craft, emphasising that tasks are limited by the authorised operational plan and the actual equipment.","exercise_tr":"Hizmet botunun onaylı görevlerini kurtarma botuyla karşılaştıran görev/sınırlama tablosu hazırlatın.","exercise_en":"Prepare a task-and-limit comparison between the service boat's approved role and that of a rescue boat.","hazard_tr":"Hizmet botunun kendiliğinden sertifikalı kurtarma botu sayılması.","hazard_en":"Treating a service boat automatically as a certified rescue boat.","id":"SERVICE-01","source_full_tr":["Hizmet botunun gemiye bağlı çalışma aracı olarak hangi işlerde kullanılabildiği, görevlerin onaylı operasyon planı ve bot donanımıyla sınırlı olduğu açıklanır. Personel/ekipman taşınması, yakından çalışma, destek görevi veya kurtarma faaliyetine yardım gemiye özel yetki mevcutsa senaryoya alınır. Kurtarma botuyla fiziksel kimlik ve görev farkı anlatılır. Botun izin verilen kişi ve yük sınırı, görev alanı ve kıyı/ana gemiye dönüş imkânları eğitimde vurgulanır."],"source_full_en":["Explain the tasks for which the service craft can be used as a workboat associated with the parent vessel and that operations are limited by its approved plan and equipment. Carrying personnel or equipment, close-quarters work, support missions or assisting a rescue may enter the scenario only where vessel-specific authority exists. Distinguish its physical identity and duties from those of the rescue boat. Emphasise limits on persons, load and operating area, as well as return options to shore or the parent vessel."],"source_integrity":"sha256_verified_against_embedded_blocks"},{"step":2,"title_tr":"Risk ve görev öncesi karar","title_en":"Assess pre-task risks","learning_tr":"İşin niteliğine göre hava-deniz şartları, akıntı, trafik, kıyı/rıhtım yakınlığı, ana gemiyle mesafe, personel transferi veya malzeme yüküne bağlı ilave riskler ele alınır.","learning_en":"Assess weather, sea state, currents, traffic, proximity to shore or berth, distance from the parent ship, and additional risks arising from personnel transfer or cargo carried, according to the task.","exercise_tr":"İş türüne göre trafik, rıhtım, yük, hava ve ana gemiden uzaklık risklerini görev kartında tartıştırın.","exercise_en":"Discuss traffic, berth, cargo, weather and separation-from-mother-ship risks on a task card.","hazard_tr":"Görev dışında kullanım, transfer sırasında personel düşmesi ve uygunsuz deniz şartları.","hazard_en":"Use beyond the assigned task, personnel falls during transfer and unsuitable sea conditions.","id":"SERVICE-02","source_full_tr":["İşin niteliğine göre hava-deniz şartları, akıntı, trafik, kıyı/rıhtım yakınlığı, ana gemiyle mesafe, personel transferi veya malzeme yüküne bağlı ilave riskler ele alınır. Kurtarma botu risk formundaki genel düşme ve sıkışma tehlikeleri, benzer tertibat kullanılıyorsa uyarlanabilir örneklerdir; hizmet botuna ait tek ve yürürlükteki risk formu olduğu varsayılmaz. Görev ve risk kapsamına göre ayrı/ilave değerlendirmenin gerekliliği gösterilir."],"source_full_en":["According to the task, consider weather and sea conditions, current, traffic, proximity to shore or quay, distance from the parent vessel and additional risks from transferring people or carrying material. General fall and crush hazards from the rescue-boat risk assessment may be adapted as examples if the arrangement is similar; that form must not be assumed to be the sole current risk assessment for the service craft. Demonstrate the need for separate or additional assessment based on the task and its risks."],"source_integrity":"sha256_verified_against_embedded_blocks"},{"step":3,"title_tr":"Personel, malzeme ve bot hazırlığı","title_en":"Prepare craft, crew and equipment","learning_tr":"Görevli kişilerin yeterliliği, uygun emniyet donanımı, malzemelerin sabitlenmesi, ağırlık dağılımı, binme düzeni ve botla taşınabilecek yük türleri anlatılır.","learning_en":"Explain crew competence, suitable protective equipment, securing of materials, weight distribution, boarding arrangements and permitted types of cargo.","exercise_tr":"Personel/ekipman yükleme planında sabitleme, yerleşim ve güvenli binme yerlerini işaretletin.","exercise_en":"Mark securing points, stowage and safe boarding positions on a crew-and-equipment loading plan.","hazard_tr":"Yük kayması, dengesizlik ve binme sırasında düşme.","hazard_en":"Shifting loads, loss of stability and falls during boarding.","id":"SERVICE-03","source_full_tr":["Görevli kişilerin yeterliliği, uygun emniyet donanımı, malzemelerin sabitlenmesi, ağırlık dağılımı, binme düzeni ve botla taşınabilecek yük türleri anlatılır. İnsanların kaymasını, yüklere takılmasını veya malzeme kayması nedeniyle bot dengesinin bozulmasını önleyecek önlemler uygulanır. Acil destek ve geri çağırma yöntemi belirlenir. Kurtarma botundan farklı gövde, motor veya kontrol düzeni varsa ayrıca tanıtılır."],"source_full_en":["Explain the qualifications of personnel, appropriate protective equipment, securing of material, weight distribution, boarding arrangements and types of load the craft can carry. Apply precautions against slipping, tripping over loads and loss of stability caused by shifting cargo. Establish the emergency assistance and recall method. Introduce any hull, engine or control arrangement that differs from the rescue boat."],"source_integrity":"sha256_verified_against_embedded_blocks"},{"step":4,"title_tr":"Ana gemiyle haberleşme ve çalışma sahası","title_en":"Agree communications and operating area","learning_tr":"Köprüüstü–hizmet botu iletişimi, görev izinleri, çalışma bölgesinin sınırları, rapor aralıkları ve faaliyet sona erdiğinde geri dönüş haberi personelle değerlendirilir.","learning_en":"Review bridge-to-service-boat communications, task permissions, boundaries of the work area, reporting intervals and the return message when operations finish.","exercise_tr":"Ana gemiyle iletişim, rapor aralıkları ve haberleşme kaybında geri dönüş seçeneğini prova edin.","exercise_en":"Rehearse communication with the mother ship, reporting intervals and a loss-of-contact return option.","hazard_tr":"Haberleşme kaybı nedeniyle görev sahasından kopma ve gemiye emniyetsiz yaklaşma.","hazard_en":"Loss of coordination after communications failure and unsafe approach to the mother ship.","id":"SERVICE-04","source_full_tr":["Köprüüstü–hizmet botu iletişimi, görev izinleri, çalışma bölgesinin sınırları, rapor aralıkları ve faaliyet sona erdiğinde geri dönüş haberi persone
