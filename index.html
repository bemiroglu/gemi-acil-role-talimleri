lle değerlendirilir. VHF/uygun alternatif iletişim, kayıp haberleşmede geri dönüş ve görev sonlandırma prensibi açıklanır. İşlem yalnızca geminin izni ve iletişim sürdürülebildiği sürece yürütülür."],"source_full_en":["Discuss communications between bridge and service craft, task permissions, work-area boundaries, reporting intervals and the return report when the mission ends. Explain VHF or an appropriate alternative, return arrangements after communication loss and the principle of ending the task. Operations continue only with the vessel's permission and while adequate communication can be maintained."],"source_integrity":"sha256_verified_against_embedded_blocks"},{"step":5,"title_tr":"İndirme/geri alma tertibatına özgü hazırlık","title_en":"Inspect lowering and recovery arrangements","learning_tr":"Hizmet botu için gerçekten kullanılan matafora/vinç sisteminin kurtarma botuyla aynı mı farklı mı olduğu belirlenir. Bağlantı, salınım, kaldırma kapasitesi, istif, personelin güvenli pozisyonu ve acil durdurma konusu o tertibata…","learning_en":"Establish whether the actual davit or crane arrangement used for the service boat is the same as or different from that of the rescue boat.","exercise_tr":"Hizmet botuna ait gerçek vinç/matafora konfigürasyonunu üretici şemasında belirleyin.","exercise_en":"Identify the service boat's actual crane or davit configuration on the manufacturer's diagram.","hazard_tr":"Kurtarma botunun tertibatını aynı varsaymak, kapasiteyi aşmak ve askıda yük altında kalmak.","hazard_en":"Assuming rescue-boat equipment is interchangeable, overloading and remaining below a suspended load.","id":"SERVICE-05","source_full_tr":["Hizmet botu için gerçekten kullanılan matafora/vinç sisteminin kurtarma botuyla aynı mı farklı mı olduğu belirlenir. Bağlantı, salınım, kaldırma kapasitesi, istif, personelin güvenli pozisyonu ve acil durdurma konusu o tertibata göre anlatılır. Tarihsel daughter craft fotoğraflarından bugünkü panel ve kontrol eşlemesi çıkarılmaz."],"source_full_en":["Determine whether the davit or crane actually used for the service craft is the same as or different from that for the rescue boat. Explain rigging, swinging loads, lifting capacity, stowage, safe crew positions and emergency stop arrangements for that particular equipment. Historic daughter-craft photographs must not be used to identify the present-day control panel or its functions."],"source_integrity":"sha256_verified_against_embedded_blocks"},{"step":6,"title_tr":"Kontrollü indirme ve çalışma alanına ayrılma","title_en":"Demonstrate controlled lowering where authorized","learning_tr":"Uygun koşul ve kaptan izni mevcutsa görevli personel üretici ve şirket prosedürüne göre suya indirme uygular. Botun suya inmesinden sonra yol verme/ayrılma, motor ve dümen/kumanda tepkisi, ana gemi bordasından güvenli çıkış ve…","learning_en":"When conditions are suitable and the master authorises the activity, the assigned crew launch in accordance with the manufacturer and company procedures.","exercise_tr":"İndirme ve ayrılma için emir, hava/deniz uygunluğu ve iptal noktalarını senaryo üzerinde gösterin.","exercise_en":"Demonstrate command, weather/sea suitability and abort points for launch and departure in a scenario.","hazard_tr":"Yetkisiz indirme, kontrolsüz ayrılma ve ana gemi bordasına çarpma.","hazard_en":"Unauthorised launching, uncontrolled departure and striking the mother ship.","id":"SERVICE-06","source_full_tr":["Uygun koşul ve kaptan izni mevcutsa görevli personel üretici ve şirket prosedürüne göre suya indirme uygular. Botun suya inmesinden sonra yol verme/ayrılma, motor ve dümen/kumanda tepkisi, ana gemi bordasından güvenli çıkış ve görevli personelin son teyidi birbirinden ayrı eğitim noktalarıdır. Koşullar uygun değilse fiilen suya indirme yapılmış sayılmaz; içerik masa başı veya saha gösterimi olarak tamamlanır."],"source_full_en":["If conditions are suitable and the master authorises the operation, qualified personnel launch the service craft in accordance with the manufacturer's and company's procedures. After the craft is afloat, propulsion and departure, engine and steering response, safe clearance of the parent vessel's side and final crew confirmation are distinct learning points. If conditions are unsuitable, an actual launch is not deemed to have occurred; the content is completed as a tabletop exercise or safe equipment demonstration."],"source_integrity":"sha256_verified_against_embedded_blocks"},{"step":7,"title_tr":"Görev odaklı manevra, transfer ve acil durum seçenekleri","title_en":"Practise task-specific manoeuvring","learning_tr":"Hizmet botunun onaylı görev alanında rota tutma, düşük sürat kontrolü, rüzgâr/akıntı etkisi, ana gemiye yaklaşma, uygun yük/personel transferi ve görev sahasından emniyetli ayrılma eğitim konusu yapılır.","learning_en":"Teach course-keeping, low-speed control, wind and current effects, approach to the parent ship, suitable cargo or personnel transfer and safe departure from the work area within the approved operating limits.","exercise_tr":"Onaylı görev içinde düşük sürat manevrası, transfer ve acil geri çekilme seçeneklerini vaka üzerinde karşılaştırın.","exercise_en":"Compare low-speed manoeuvring, transfer and emergency withdrawal options within an approved task scenario.","hazard_tr":"Personel/yük transferi sırasında sıkışma veya pervane tehlikesi.","hazard_en":"Crush or propeller hazards during personnel or cargo transfer.","id":"SERVICE-07","source_full_tr":["Hizmet botunun onaylı görev alanında rota tutma, düşük sürat kontrolü, rüzgâr/akıntı etkisi, ana gemiye yaklaşma, uygun yük/personel transferi ve görev sahasından emniyetli ayrılma eğitim konusu yapılır. İnsan transferi, yük kaldırma, başka gemiye yaklaşma gibi faaliyetler yalnızca ayrıca yetkilendirilmişse uygulanır. Motor arızası, kontrol kaybı veya hava durumunun bozulması hâlinde görevi durdurma/yardım çağırma/geri dönme kararları senaryo ile öğretilir."],"source_full_en":["Teach holding a course, low-speed control, wind and current effects, approach to the parent vessel, authorised cargo or personnel transfer and safe departure from the work area within the craft's approved operating limits. Transfers of people, lifting loads or approaching another ship are performed only when separately authorised. Engine failure, control loss and deteriorating weather are used to rehearse decisions to stop work, request help and return."],"source_integrity":"sha256_verified_against_embedded_blocks"},{"step":8,"title_tr":"Geri alma, tekrar hizmete hazırlama ve kayıt","title_en":"Recover the craft and complete records","learning_tr":"Botun ana gemiye yaklaşması, emniyetli bağlanması, kaldırma alanı ve personel konumları kontrol edilir; su üzeri görev tamamlandığında emniyetli geri alma gerçekleştirilir.","learning_en":"Check the approach to the parent ship, safe securing, lifting area and personnel positions; once the waterborne task is complete, recover the boat safely.","exercise_tr":"Geri alma, botun tekrar kullanıma hazırlanması ve gerçek/simüle faaliyet kaydını kontrol listesiyle eşleştirin.","exercise_en":"Match recovery, restoration of boat readiness and recording of actual versus simulated actions to a checklist.","hazard_tr":"Geri alma bağlantı hatası, ekipman arızasının gizlenmesi veya fiilî olmayan işlemin kayda geçmesi.","hazard_en":"Recovery attachment error, concealed equipment defects or logging actions not performed.","id":"SERVICE-08","source_full_tr":["Botun ana gemiye yaklaşması, emniyetli bağlanması, kaldırma alanı ve personel konumları kontrol edilir; su üzeri görev tamamlandığında emniyetli geri alma gerçekleştirilir. Kullanım sonrası motor, yakıt/sızıntı göstergeleri, ekipman sabitleme, şarj, istif ve bakım takipleri incelenir. EK-V ve ilgili risk/jurnal kayıtlarında hizmet botu adı, kurtarma botundan ayrı belirtilir; ikisinden yalnızca biri suya indirilmişse ikisinin de indirildiği yazılmaz."],"source_full_en":["Check approach to the parent vessel, safe attachment, the lifting zone and personnel positions; once the waterborne task ends, carry out safe recovery. After use, inspect engine, fuel or leak indications, securing of equipment, charging, stowage and maintenance follow-up. Name the service craft separately from the rescue boat in EK-V and relevant risk or log records; if only one was launched, do not state that both were launched."],"source_integrity":"sha256_verified_against_embedded_blocks"}]},{"key":"confined/ENTRY","family":"confined","flow":"ENTRY","title_tr":"Kapalı Mahale Giriş","title_en":"Enclosed-Space Entry","family_title_tr":"Kapalı Mahal Giriş / Kurtarma","family_title_en":"Enclosed-Space Entry and Rescue","stages":[{"step":1,"title_tr":"İşin tanımlanması ve giriş gerekliliğinin sorgulanması","title_en":"Question the need for entry","learning_tr":"Kapalı mahalde yapılacak iş, işin nedeni, mahal adı, geçmiş içeriği ve çalışmanın öngörülen süresi açıklanır. İşin mahale girilmeden uzaktan kamera, numune alma, dışarıdan mekanik kontrol gibi yöntemlerle yapılıp yapılamayacağı…","learning_en":"Describe the proposed work inside the enclosed space, why it is required, the name and previous contents of the space, and the expected duration.","exercise_tr":"Mahal planında işin gerekçesini, bağlantılı mahalleri ve girilmeden yapılabilecek alternatifleri işaretletin.","exercise_en":"Mark the job purpose, connected spaces and alternatives not requiring entry on an enclosed-space plan.","hazard_tr":"Gereksiz giriş planlanması veya izin olmadan faaliyete başlanması.","hazard_en":"Planning an unnecessary entry or commencing work without authorisation.","id":"confined-ENTRY-1","source_full_tr":["Kapalı mahalde yapılacak iş, işin nedeni, mahal adı, geçmiş içeriği ve çalışmanın öngörülen süresi açıklanır. İşin mahale girilmeden uzaktan kamera, numune alma, dışarıdan mekanik kontrol gibi yöntemlerle yapılıp yapılamayacağı değerlendirilir. Gereksiz girişler önlenir. Mahalin gemi planı, bağlantılı mahaller ve tahliye güzergâhı personelin önünde gösterilir. Girişin yalnızca yeterli ve geçerli izinle yapılacağı açıklanır. Tek kişilik giriş planlanmaz.","İlişkili kartlar: ORTAK-01, -03, -04.\nEğitim biçimi: Çizim/plan üzerinden bilgilendirme ve örnek risk değerlendirmesi incelemesi."],"source_full_en":["State the proposed work, the reason for it, the compartment name, its previous contents and expected duration. Consider whether the task can be completed without entering, for example by remote camera, sampling or external mechanical inspection, and prevent unnecessary entry. Show the ship's plan of the space, adjoining spaces and escape route to the crew. Explain that entry is permitted only with sufficient, valid authorisation. Do not plan single-person entry.","Related cards: ORTAK-01, -03, -04. Training format: familiarisation using drawings or plans and examination of a sample risk assessment."],"source_integrity":"sha256_verified_against_embedded_blocks"},{"step":2,"title_tr":"Tehlike kaynaklarının belirlenmesi ve risk tedbirleri","title_en":"Identify hazards and control measures","learning_tr":"Mahalın içindeki gaz, sıvı, tortu, kimyasal kalıntı, sıcaklık, elektrik, hareketli ekipman, basınç, fiziksel engel ve düşme riskleri ayrı ayrı incelenir. İlgili SDS ve geçmiş iş kayıtları gerektiğinde değerlendirilir.","learning_en":"Examine separately the hazards from gas, liquids, deposits, chemical residues, temperature, electricity, moving equipment, pressure, physical obstructions and falls.","exercise_tr":"Mahalın önceki içeriği ve iş türüne göre kimyasal, oksijen, elektrik ve fiziksel tehlikeleri risk tablosunda gösterin.","exercise_en":"Identify chemical, oxygen, electrical and physical hazards against previous contents and intended work in a risk table.","hazard_tr":"Bağlantılı mahallerin ve tortu/kalıntı tehlikesinin gözden kaçırılması.","hazard_en":"Overlooking connected spaces and hazardous residues or sediments.","id":"confined-ENTRY-2","source_full_tr":["Mahalın içindeki gaz, sıvı, tortu, kimyasal kalıntı, sıcaklık, elektrik, hareketli ekipman, basınç, fiziksel engel ve düşme riskleri ayrı ayrı incelenir. İlgili SDS ve geçmiş iş kayıtları gerektiğinde değerlendirilir. Özellikle bağlantılı/komşu mahalin hava ve madde akışı öğretilir. İzin veren zabit, yapılacak işe uygun kontrol ve durdurma kriterlerini açıklar; önceki değerlendirme puanı yeni talimin otomatik kabulü olarak kullanılmaz.","İlişkili kartlar: ORTAK-01, -02, -03.\nEğitim biçimi: Senaryo tartışması, mahalin tehlike haritasının tanıtılması."],"source_full_en":["Examine separately gases, liquids, sediment, chemical residues, heat, electricity, moving equipment, pressure, physical obstructions and fall hazards within the space. Consider relevant safety data sheets and previous work records where necessary. Emphasise air and material movement between the space and adjoining compartments. The authorising officer explains work-specific controls and stop-work criteria; a risk score from an earlier assessment is not automatic approval of a new exercise.","Related cards: ORTAK-01, -02, -03. Training format: scenario discussion and familiarisation with the space hazard map."],"source_integrity":"sha256_verified_against_embedded_blocks"},{"step":3,"title_tr":"İzolasyon ve havalandırmanın hazırlanması","title_en":"Prepare isolation and ventilation","learning_tr":"İşin gerektirdiği boru/valf ve enerji izolasyonları, uygun emniyet kilitlemesi, sızdırmazlık, bağlantılı mahaller ve uygun menhol/giriş düzeni anlatılır. Havalandırma güzergâhı ve kör noktalar değerlendirilir.","learning_en":"Explain task-specific pipe, valve and energy isolation, appropriate lockout, containment, connected spaces and suitable manhole and entry arrangements. Assess ventilation paths and dead zones.","exercise_tr":"Onaylı tesisat şemasında izolasyon noktaları, havalandırma yolu ve kör bölgeleri tanıtın.","exercise_en":"Identify isolation points, ventilation routes and dead zones on the approved system diagram.","hazard_tr":"Eksik izolasyon, durgun gaz birikmesi veya oksijenle havalandırma gibi uygunsuz işlem.","hazard_en":"Incomplete isolation, stagnant gas pockets or inappropriate oxygen ventilation.","id":"confined-ENTRY-3","source_full_tr":["İşin gerektirdiği boru/valf ve enerji izolasyonları, uygun emniyet kilitlemesi, sızdırmazlık, bağlantılı mahaller ve uygun menhol/giriş düzeni anlatılır. Havalandırma güzergâhı ve kör noktalar değerlendirilir. Personel, saf oksijenle havalandırma yapılmayacağını öğrenir. Gerekli testler ve enerjili tertibatın devreden çıkarılması gibi gerçek teknik işlemler, yalnızca onaylı işletme prosedürü kapsamında yapılır. Eğitimde belirli şalter ve valf kombinasyonları evrensel talimat olarak verilmez.","İlişkili kartlar: ORTAK-05, -06.\nEğitim biçimi: Donanım tanıtımı; gerektiğinde izinli ve emniyetli işbaşı gösterimi."],"source_full_en":["Explain relevant pipe and valve isolation, electrical isolation, appropriate lockout, sealing, adjacent spaces and safe manhole or access arrangements. Assess ventilation routes and stagnant pockets. Teach personnel that pure oxygen must never be used to ventilate a space. Actual technical work, including required tests or isolating energised systems, is performed only under approved operating procedures. Training does not prescribe universal combinations of switches and valves.","Related cards: ORTAK-05, -06. Training format: equipment familiarisation and, where appropriate, an authorised safe on-the-job demonstration."],"source_integrity":"sha256_verified_against_embedded_blocks"},{"step":4,"title_tr":"Gaz ölçümünün yapılması ve sonuçların yorumlanması","title_en":"Measure atmosphere and interpret readings","learning_tr":"Uygun çoklu gaz ölçerin tipi, sensörü, geçerliliği, kalibrasyonu, fonksiyon testi ve örnekleme hattı tanıtılır. O₂, yanıcı gaz, CO, H₂S ve mahal tehlikesine göre CO₂/ilave gazların neden değerlendirildiği anlatılır.","learning_en":"Introduce the type and sensors of a suitable multi-gas detector, its validity, calibration, functional check and sampling line.","exercise_tr":"Örnek gaz ölçüm sonuçlarını cihaz geçerliliği, farklı yükseklikler ve işin niteliği ile birlikte yorumlatın.","exercise_en":"Interpret sample gas readings alongside instrument validity, different sampling levels and work-specific hazards.","hazard_tr":"Tek ölçümün güvenli giriş izni sanılması veya arızalı/uygunsuz ölçerin kullanılması.","hazard_en":"Treating a single reading as entry authorisation or relying on a faulty or unsuitable meter.","id":"confined-ENTRY-4","source_full_tr":["Uygun çoklu gaz ölçerin tipi, sensörü, geçerliliği, kalibrasyonu, fonksiyon testi ve örnekleme hattı tanıtılır. O₂, yanıcı gaz, CO, H₂S ve mahal tehlikesine göre CO₂/ilave gazların neden değerlendirildiği anlatılır. Gazın farklı kotlarda veya kör bölgelerde birikebileceği öğretilir. Ölçümler giriş yapılmadan dışarıdan planlanır; sonuçlar uygun kayıt alanına değerlendirilir. %20,9 O₂ ve diğer IMO 2025 kriterleri, sadece uygun ölçüm yöntemleri ve tüm risk önlemleriyle birlikte açıklanır.","İlişkili kartlar: ORTAK-07, -08.\nEğitim biçimi: Emniyetli atmosferde cihaz ve numune alma sistemi gösterimi; gerçek tehlikeli mahalde deneme yapılmaz."],"source_full_en":["Introduce the appropriate multi-gas meter, its sensors, validity, calibration, function check and sampling line. Explain why oxygen, flammable gases, CO, H₂S and, depending on the space, CO₂ or additional gases are assessed. Gas may accumulate at different heights and in stagnant areas. Plan sampling from outside before entry and evaluate readings against the required recording method. Explain 20.9% oxygen and other criteria in the 2025 IMO guidance only in conjunction with suitable measurement methods and all other risk controls.","Related cards: ORTAK-07, -08. Training format: demonstration of the detector and sampling arrangement in a safe atmosphere; do not use an actual hazardous space for practice."],"source_integrity":"sha256_verified_against_embedded_blocks"},{"step":5,"title_tr":"Giriş izni, gözcü ve haberleşmenin kurulması","title_en":"Confirm permit, attendant and communications","learning_tr":"Kaptan/yetkili sorumlu, ölçüm sorumlusu, giriş yapan personel, gözcü ve kurtarma ekibinin görevleri ayrıştırılır. Giriş öncesi brifingde acil haberleşme kanalı, içeri girenlerin sayısı, yoklama düzeni, işin durdurulma işaretleri…","learning_en":"Separate the responsibilities of the master or authorised officer, person carrying out measurements, entrants, attendant and rescue team.","exercise_tr":"Giriş izni, içerideki personel listesi, gözcü ve acil haberleşme alanlarını örnek form üzerinde gösterin.","exercise_en":"Review entry permit, entrant list, standby attendant and emergency communications fields on a sample form.","hazard_tr":"Gözcü bulunmaması, izin şartlarının değişmesi ve girişin kontrolsüz sürdürülmesi.","hazard_en":"Absence of an attendant, changed permit conditions and uncontrolled continuation of entry.","id":"confined-ENTRY-5","source_full_tr":["Kaptan/yetkili sorumlu, ölçüm sorumlusu, giriş yapan personel, gözcü ve kurtarma ekibinin görevleri ayrıştırılır. Giriş öncesi brifingde acil haberleşme kanalı, içeri girenlerin sayısı, yoklama düzeni, işin durdurulma işaretleri ve çıkış rotası belirlenir. EYS.07.103.FR ve EYS.09.120.FR belgelerinin gerçek girişteki amaçları açıklanır. Eğitimin salt masa başı/simülasyon bölümü için gerçekte düzenlenmemiş bir çalışma izni varmış gibi işaretleme yapılmaz.","İlişkili kartlar: ORTAK-03, -04, -09.\nEğitim biçimi: Görev kartları ve örnek izin üzerinden ders; talimde elektronik form doldurulmaz."],"source_full_en":["Distinguish the roles of the master or authorised supervisor, gas-testing person, entrant, standby attendant and rescue team. The pre-entry briefing establishes the emergency communication channel, number of entrants, headcount arrangements, stop-work signals and exit route. Explain the purposes of EYS.07.103.FR and EYS.09.120.FR in an actual entry. For a purely tabletop or simulated training component, do not indicate that a work permit was issued when none was actually issued.","Related cards: ORTAK-03, -04, -09. Training format: lessons using role cards and a sample permit; no electronic permit form is completed by the application."],"source_integrity":"sha256_verified_against_embedded_blocks"},{"step":6,"title_tr":"Uygun KKD ve girişte izleme düzeni","title_en":"Check PPE and continuous monitoring","learning_tr":"Kişisel gaz ölçerin taşınması, cihaz alarmı, emniyet kemeri/halatı (mahale uygun ise), eldiven, baş koruması, aydınlatma ve anti-statik/Ex uygun ekipman türleri tanıtılır.","learning_en":"Demonstrate carrying a personal gas detector, interpreting alarms, harness and safety line where appropriate for the space, gloves, head protection, lighting and suitable antistatic or explosion-protected equipment.","exercise_tr":"Kişisel ölçüm, uygun KKD ve gözcü irtibatının örnek düzenini tanıtın; gerçek girişi gerektirmeyin.","exercise_en":"Demonstrate the arrangement for personal monitoring, suitable PPE and standby communication without requiring an actual entry.","hazard_tr":"Gaz alarmının duyulmaması, gözcünün mahal içine girmesi veya uygun olmayan KKD.","hazard_en":"Missed gas alarms, the attendant entering the space or unsuitable PPE.","id":"confined-ENTRY-6","source_full_tr":["Kişisel gaz ölçerin taşınması, cihaz alarmı, emniyet kemeri/halatı (mahale uygun ise), eldiven, baş koruması, aydınlatma ve anti-statik/Ex uygun ekipman türleri tanıtılır. Gözcünün kapalı mahal dışında görevlendirileceği ve giriş sırasında sürekli irtibatı sürdüreceği açıklanır. Ekip, gerçek girişe karar verilirse yalnızca belgelenmiş emniyet koşulları sağlandığında hareket eder. EEBD'nin kurtarma amacıyla giriş cihazı olmadığı ayrıca öğretilir.","İlişkili kartlar: ORTAK-09, -10.\nEğitim biçimi: KKD, gaz ölçer ve haberleşme araçlarının güvenli gösterimi."],"source_full_en":["Demonstrate carrying a personal gas detector, recognising its alarms, appropriate safety harness or line, gloves, head protection, lighting and antistatic or explosion-protected equipment where suitable for the space. Explain that the standby attendant remains outside and maintains continuous contact during entry. If actual entry is authorised, the team proceeds only when documented safety prerequisites have been met. Teach explicitly that an EEBD is not an entry device for rescue.","Related cards: ORTAK-09, -10. Training format: safe demonstration of PPE, gas detectors and communications equipment."],"source_integrity":"sha256_verified_against_embedded_blocks"},{"step":7,"title_tr":"Çalışma sırasında koşulların izlenmesi ve acil tahliye","title_en":"Monitor entry and emergency evacuation","learning_tr":"Atmosferin değişebileceği, havalandırmanın kesilebileceği veya beklenmeyen iş tehlikesinin ortaya çıkabileceği açıklanır.","learning_en":"Explain that the atmosphere can change, ventilation can fail and new hazards can arise during work. Use scenarios involving lost communications, gas alarms, dizziness, leakage, instrument failure or loss of an attendant. Practise stopping work, withdrawing personnel, informing the master and reassessing entry permission and atmospheric readings. The attendant must not enter alone to attempt an improvised rescue.","exercise_tr":"Gaz alarmı, havalandırma kesilmesi veya irtibat kaybı halinde durdurma ve çıkış kararını senaryoda prova ettirin.","exercise_en":"Rehearse stop-work and evacuation decisions for a gas alarm, failed ventilation or lost communication.","hazard_tr":"Değişmiş atmosfere rağmen çalışmayı sürdürme veya izinsiz kurtarma girişimi.","hazard_en":"Continuing work in a changed atmosphere or attempting an unauthorised rescue entry.","id":"confined-ENTRY-7","source_full_tr":["Atmosferin değişebileceği, havalandırmanın kesilebileceği veya beklenmeyen iş tehlikesinin ortaya çıkabileceği açıklanır. Haberleşme kopması, gaz alarmı, personelde halsizlik/baş dönmesi, malzeme sızıntısı, ölçüm cihazı arızası ve gözcünün görevini sürdürememesi senaryo kararları olarak ele alınır. Bu olaylarda işin durdurulması, personelin çıkışı, kaptana haber verilmesi ve izin/ölçümün yeniden değerlendirilmesi öğretilir. Gözcünün kurtarma için tek başına içeri girmesine izin verilmez.","İlişkili kartlar: ORTAK-02, -06, -09, -12.\nEğitim biçimi: Masa başı alarm ve tahliye senaryosu."],"source_full_en":["Explain that the atmosphere may change, ventilation may fail or an unexpected work hazard may arise. Loss of communications, gas alarms, dizziness or weakness in an entrant, leakage of materials, measuring-device failure and inability of the standby attendant to continue are used as decision scenarios. Teach stopping work, evacuating personnel, informing the master and reassessing the permit and measurements. The standby attendant must not enter alone to rescue a casualty.","Related cards: ORTAK-02, -06, -09, -12. Training format: tabletop alarm and evacuation scenario."],"source_integrity":"sha256_verified_against_embedded_blocks"},{"step":8,"title_tr":"Personel çıkışı, izin kapanışı ve kayıt değerlendirmesi","title_en":"Account for personnel, close permit and record","learning_tr":"Çıkan personelin yoklaması, kullanılan donanımın kontrolü, giriş izin kaydının kapanışı, normal işletmeye dönmek için gerekli önlemler, eksikliklerin bildirilmesi ve kurtarma planının uygulanabilirliği gözden geçirilir.","learning_en":"Account for personnel leaving the space, inspect the equipment used and close the entry permit. Review precautions before normal operations resume, deficiency reporting and the suitability of the rescue plan. Practise closeout communications between entrant, attendant and master. When no physical entry occurred, record only the training or simulation; do not create a maintenance or entry-permit record implying that work was carried out.","exercise_tr":"Çıkış yoklamasını, izin kapanışını ve ekipman kontrolünü örnek kapanış formuyla karşılaştırın.","exercise_en":"Compare exit accounting, permit closure and equipment checks to a sample close-out record.","hazard_tr":"İçeride kişi unutulması, açık izin bırakılması veya kontrol edilmemiş ekipman.","hazard_en":"Leaving someone unaccounted for, an open permit or unchecked equipment.","id":"confined-ENTRY-8","source_full_tr":["Çıkan personelin yoklaması, kullanılan donanımın kontrolü, giriş izin kaydının kapanışı, normal işletmeye dönmek için gerekli önlemler, eksikliklerin bildirilmesi ve kurtarma planının uygulanabilirliği gözden geçirilir. Eğitimde işçi/gözcü/kaptan arasındaki kapanış haberleşmesi örneklenir. Gerçek işlem yoksa yalnızca eğitim gösterimi ve simülasyon kaydı oluşturulur; fiilî iş yapılmış gibi bakım veya izin belgesi üretilmez.","İlişkili kartlar: ORTAK-04, -14.\nEğitim biçimi: Kapanış değerlendirmesi ve EK-V kayıt konularının hatırlatılması."],"source_full_en":["Review headcount after exit, equipment checks, closure of the entry permit, precautions needed to resume normal operations, deficiency reports and practicability of the rescue plan. Training includes an example of closeout communications among worker, standby attendant and master. If no actual entry was made, record only the training demonstration or simulation; do not produce maintenance or permit records suggesting work was physically performed.","Related cards: ORTAK-04, -14. Training format: closing assessment and reminder of EK-V reporting topics."],"source_integrity":"sha256_verified_against_embedded_blocks"}]},{"key":"confined/RESCUE","family":"confined","flow":"RESCUE","title_tr":"Kapalı Mahal Kurtarma","title_en":"Enclosed-Space Rescue","family_title_tr":"Kapalı Mahal Giriş / Kurtarma","family_title_en":"Enclosed-Space Entry and Rescue","stages":[{"step":1,"title_tr":"Olayın fark edilmesi, alarm ve mahale izinsiz girişin önlenmesi","title_en":"Recognize casualty and prevent unplanned entry","learning_tr":"Gözcü/olayı fark eden personel acil haberi köprüüstüne/kaptana iletir; mahal, kaza türü, son irtibat saati, içeride olması muhtemel kişi sayısı ve bilinen gaz/çalışma tehlikesi bildirimi ele alınır.","learning_en":"The attendant or person noticing the incident reports to the bridge or master, including the space, type of incident, last contact time, estimated number of persons inside and any known gas or work hazards.","exercise_tr":"Olayın mahal, son temas saati ve kişi sayısı bilgisini içeren köprüüstü ihbarını prova ettirin.","exercise_en":"Rehearse a bridge notification giving the space, last contact and number of persons potentially inside.","hazard_tr":"İkinci kişinin korumasız içeri girmesi ve birden fazla kazazede oluşması.","hazard_en":"An unprotected second entrant becoming another casualty.","id":"confined-RESCUE-1","source_full_tr":["Gözcü/olayı fark eden personel acil haberi köprüüstüne/kaptana iletir; mahal, kaza türü, son irtibat saati, içeride olması muhtemel kişi sayısı ve bilinen gaz/çalışma tehlikesi bildirimi ele alınır. Yardıma koşan ikinci kişinin mahale girmesi önlenir. Diğer personelin toplanması, rollere göre ekip oluşturulması, trafikten/operasyondan kaynaklanan ek riskler değerlendirilir. Olay sahasında yetkisiz girişin engellenmesi, ilk yardım ve teknik ekip çağrısının başlatılması öğretilir.","İlişkili kartlar: ORTAK-04, -12.\nEğitim biçimi: Alarm ve karar senaryosu; gerçek tehlike sinyali kullanılmaz."],"source_full_en":["The standby attendant or first witness alerts the bridge and master; the report covers the space, type of incident, time of last contact, probable number of persons inside and known atmospheric or work hazards. Prevent a second person rushing inside to help. Assess muster of other crew, assignment of teams under the muster list and additional risks arising from traffic or ongoing operations. Teach the protection of the site from unauthorised entry and prompt mobilisation of first-aid and technical teams.","Related cards: ORTAK-04, -12. Training format: alarm and decision scenario; no real distress signals are used."],"source_integrity":"sha256_verified_against_embedded_blocks"},{"step":2,"title_tr":"Mahal ve olay bilgisinin hızla toplanması","title_en":"Gather space and incident information","learning_tr":"Mahal planı, gaz ölçüm kayıtları, giriş izinleri, bağlantılı mahaller, çalışmanın türü, son temas, kazazedenin yaklaşık yeri, erişim geometrisi ve mevcut izolasyonlar değerlendirilir.","learning_en":"Review the space plan, gas measurement records, entry permits, connected spaces, type of work, last contact, casualty's approximate location, access geometry and existing isolations.","exercise_tr":"Mahal krokisi, son gaz ölçümü, izolasyon ve erişim yolunu bir olay bilgi kartında toplayın.","exercise_en":"Compile a casualty information card with the space plan, last gas readings, isolations and access route.","hazard_tr":"Belirsiz atmosferin güvenli varsayılması ve kritik mahal bilgisinin kaybolması.","hazard_en":"Assuming an unknown atmosphere is safe or losing critical space information.","id":"confined-RESCUE-2","source_full_tr":["Mahal planı, gaz ölçüm kayıtları, giriş izinleri, bağlantılı mahaller, çalışmanın türü, son temas, kazazedenin yaklaşık yeri, erişim geometrisi ve mevcut izolasyonlar değerlendirilir. Kaza nedeni kesin olarak bilinmiyorsa atmosfer tehlikeli varsayılır. Birden fazla kişi etkilenmiş olabileceği, iş devam ederken riskin değişmiş olabileceği anlatılır. Güvenli bir dış erişimden ölçüm yapılabilirse yalnızca yetkin personel tarafından değerlendirilir.","İlişkili kartlar: ORTAK-01, -02, -07, -08.\nEğitim biçimi: Plan, kayıt ve mahal özellikleri üzerinden değerlendirme."],"source_full_en":["Review space plans, gas-measurement records, entry permits, connected compartments, type of work, last contact, approximate casualty position, access geometry and existing isolations. If the cause is unknown, assume the atmosphere may be hazardous. Explain that more than one person may have been affected and the hazard may have changed while work continued. Where outside sampling is possible, it is assessed only by competent personnel.","Related cards: ORTAK-01, -02, -07, -08. Training format: assessment using plans, records and compartment characteristics."],"source_integrity":"sha256_verified_against_embedded_blocks"},{"step":3,"title_tr":"Olay yeri komutası, görev dağılımı ve kurtarma planı","title_en":"Establish command and rescue plan","learning_tr":"Kaptan ve olay yeri sorumlusu arasındaki yetki aktarımı, giriş onayı, kurtarma ekibi, dışarıda kalan gözcü, yedek destek, ilk yardım, donanım sorumlusu ve şirket/liman irtibat görevlisinin işlevleri açıklanır. EYS.08.103.","learning_en":"Explain the division of authority between master and on-scene officer, entry authorisation, rescue team, attendant remaining outside, standby support, first aid, equipment officer and company or port contact.","exercise_tr":"Kaptan, olay yeri amiri, dış gözcü, yedek ekip ve sağlık ekibinin görevlerini şemada gösterin.","exercise_en":"Map duties of the master, scene leader, external attendant, backup party and medical team.","hazard_tr":"Görev karmaşası, kurtarma planı olmadan giriş veya yedek ekibin bulunmaması.","hazard_en":"Confused roles, entry without a rescue plan or absence of backup personnel.","id":"confined-RESCUE-3","source_full_tr":["Kaptan ve olay yeri sorumlusu arasındaki yetki aktarımı, giriş onayı, kurtarma ekibi, dışarıda kalan gözcü, yedek destek, ilk yardım, donanım sorumlusu ve şirket/liman irtibat görevlisinin işlevleri açıklanır. EYS.08.103.PL'nin güncel kurum içi plan olması nedeniyle kurtarma sırası bu planla karşılaştırılır. Kurtarma emrinin aceleyle verilmesi değil, riskin kontrollü değerlendirilmesi esas alınır. Mahalde iki veya daha fazla kazazede varsa görev ve kaynak planı genişletilir.","İlişkili kartlar: ORTAK-04, -11, -12.\nEğitim biçimi: Rol dağıtımı, komuta ve iletişim simülasyonu."],"source_full_en":["Explain the relationship of command authority between the master and on-scene supervisor, entry authorisation, rescue team, attendant remaining outside, backup support, first-aid team, equipment custodian and company or port liaison. Compare the rescue sequence with the current institutional EYS.08.103.PL plan. Priority is not a hasty rescue order but controlled assessment of the danger. Expand roles and resources if there are two or more casualties.","Related cards: ORTAK-04, -11, -12. Training format: role allocation and simulated command and communication."],"source_integrity":"sha256_verified_against_embedded_blocks"},{"step":4,"title_tr":"Kurtarma ekipmanlarının emniyetli hazırlığı","title_en":"Prepare rescue equipment safely","learning_tr":"Uygun SCBA, gaz algılama cihazları, haberleşme, kişisel koruyucu donanım, emniyet halatı, kazazede kaldırma/taşıma tertibatı, sedye, aydınlatma ve resüsitasyon ekipmanı tanıtılır.","learning_en":"Introduce suitable SCBA, gas detectors, communications, personal protective equipment, safety lines, casualty lifting and carrying equipment, stretchers, lighting and resuscitation equipment. Review cylinder pressure, alarms, mask fit and duration in accordance with the actual manufacturer's instructions. An EEBD is not rescue-entry breathing apparatus. Distinguish certified equipment for lifting people from ordinary winches or hauling lines, and prepare a standby team and withdrawal method.","exercise_tr":"SCBA, gaz ölçer, sedye, kurtarma halatı ve haberleşme tertibatını onaylı donanım listesinde tanıtın.","exercise_en":"Identify SCBA, gas detectors, stretchers, retrieval lines and communications on the approved equipment list.","hazard_tr":"EEBD'nin kurtarma solunum cihazı sanılması veya bakımsız ekipmanın kullanılması.","hazard_en":"Mistaking an EEBD for rescue breathing apparatus or using unserviceable equipment.","id":"confined-RESCUE-4","source_full_tr":["Uygun SCBA, gaz algılama cihazları, haberleşme, kişisel koruyucu donanım, emniyet halatı, kazazede kaldırma/taşıma tertibatı, sedye, aydınlatma ve resüsitasyon ekipmanı tanıtılır. SCBA'nın basıncı, alarmı, maske sızdırmazlığı ve görev süresi üretici talimatı ve gerçek cihaz şartına göre değerlendirilir. Kurtarmacı için EEBD kullanılmaz. İnsan kaldırmaya uygun sertifikalı ekipman ile sıradan çekme vinci/halatı arasındaki fark anlatılır. Yedek ekip ve geri çekilme yöntemi planlanır.","İlişkili kartlar: ORTAK-07, -10, -11.\nEğitim biçimi: Güvenli tatbikat alanında fonksiyon ve donanım gösterimi."],"source_full_en":["Introduce suitable SCBA, gas detectors, communications, personal protective equipment, safety lines, casualty lifting and handling systems, stretchers, lighting and resuscitation equipment. Check SCBA pressure, alarms, facepiece seal and working time against the manufacturer's instructions and the actual device. EEBD must not be used by a rescuer for entry. Explain the distinction between certified equipment suitable for lifting people and an ordinary pulling winch or rope. Plan a backup team and withdrawal method.","Related cards: ORTAK-07, -10, -11. Training format: function checks and equipment demonstrations in a safe exercise area."],"source_integrity":"sha256_verified_against_embedded_blocks"},{"step":5,"title_tr":"Giriş kararı, emniyet ve gözcüyle koordinasyon","title_en":"Authorize entry and coordinate with attendant","learning_tr":"İçerideki atmosferin uygunluğu kanıtlanmamışsa girişin ilave tehlikeleri anlatılır. Kurtarma için gerçekten giriş yapılması yalnızca yürürlükteki plan, yetkili karar, yeterli personel, uygun donanım ve risk değerlendirmesi…","learning_en":"Explain the additional danger of entering an enclosed space whose atmosphere has not been demonstrated safe. A real rescue entry is considered only under the approved rescue plan, an authorised decision, sufficient trained personnel, suitable equipment and a documented risk assessment. Maintain coordination with the attendant, communication and a safe exit arrangement. A spontaneous unprotected rescue attempt must not become part of the drill.","exercise_tr":"Örnek olay üzerinde giriş yapmadan kurtarma olanağını ve yetkili giriş kararını karşılaştırın.","exercise_en":"Compare non-entry recovery options with the authorised rescue-entry decision in a tabletop scenario.","hazard_tr":"Atmosfer doğrulanmadan, yetkisiz veya korumasız giriş yapılması.","hazard_en":"Unauthorised or unprotected entry before atmosphere hazards are assessed.","id":"confined-RESCUE-5","source_full_tr":["İçerideki atmosferin uygunluğu kanıtlanmamışsa girişin ilave tehlikeleri anlatılır. Kurtarma için gerçekten giriş yapılması yalnızca yürürlükteki plan, yetkili karar, yeterli personel, uygun donanım ve risk değerlendirmesi kapsamında mümkündür. Gözcü dışarıda kalır, haberleşme ve sayımı sürdürür. Eğitim mankeniyle kontrollü eğitim alanında giriş/geri çıkış akışı gösterilebilir; gerçek tehlikeli atmosfer oluşturulmaz, personel riskli mahale yalnızca eğitim amacıyla sokulmaz.","İlişkili kartlar: ORTAK-09, -10, -12.\nEğitim biçimi: Kontrol alanında kurtarma uygulaması veya detaylı simülasyon."],"source_full_en":["Explain the additional hazards of entry where a safe atmosphere has not been demonstrated. An actual rescue entry is possible only under the applicable plan, authorised decision, adequate personnel and equipment, and risk assessment. The standby attendant remains outside and maintains communications and headcount. An entry-and-withdrawal sequence may be shown with a training dummy in a controlled area; do not create a hazardous atmosphere or send crew into a dangerous space solely for an exercise.","Related cards: ORTAK-09, -10, -12. Training format: controlled rescue exercise or detailed simulation."],"source_integrity":"sha256_verified_against_embedded_blocks"},{"step":6,"title_tr":"Kazazedenin güvenli olarak alınması ve mahallin tahliyesi","title_en":"Retrieve casualty without further harm","learning_tr":"Kazazedenin yerinin bulunması, mevcut engellerin aşılması, fiziksel yaralanma olasılığı, sedyeye sabitleme, dar geçişte hareket, düşme ve askıda kalma tehlikeleri öğretilir.","learning_en":"Teach how to locate the casualty, negotiate obstructions, assess possible physical injury, secure the person to a stretcher, move through narrow openings and avoid falls or suspension hazards.","exercise_tr":"Mankenli senaryoda dar geçiş, sedye, kaldırma hattı ve dışarıya emniyetli taşıma kısıtlarını gösterin.","exercise_en":"Use a manikin scenario to show narrow access, stretcher handling, retrieval lines and safe extraction constraints.","hazard_tr":"Dar geçitte sıkışma, düşme, askıda kalma veya kurtarıcının yaralanması.","hazard_en":"Entrapment, falls, suspension or rescuer injury in narrow access.","id":"confined-RESCUE-6","source_full_tr":["Kazazedenin yerinin bulunması, mevcut engellerin aşılması, fiziksel yaralanma olasılığı, sedyeye sabitleme, dar geçişte hareket, düşme ve askıda kalma tehlikeleri öğretilir. Mümkünse mahale girilmeden dışarıdan kurtarma/çekme yöntemleri değerlendirilir; ancak her durumda tertibatın insan kaldırmaya uygunluğu ve yeni yaralanma yaratmaması gerekir. Dikey tahliye gerektiren mahal ile yatay çıkışlı mahal aynı senaryo sayılmaz.","İlişkili kartlar: ORTAK-11, -13.\nEğitim biçimi: Mankenle güvenli sedye/harness ve mekanik tahliye gösterimi."],"source_full_en":["Teach locating the casualty, negotiating obstructions, anticipating injuries, securing the casualty to a stretcher, moving through narrow passages and avoiding falls or suspension trauma. Consider external recovery methods that avoid entry where feasible, but always confirm that the equipment is suitable for lifting a person and cannot cause further injury. A space requiring vertical extraction is not equivalent to one with a horizontal exit.","Related cards: ORTAK-11, -13. Training format: safe mannequin demonstration of stretcher or harness use and mechanical extraction."],"source_integrity":"sha256_verified_against_embedded_blocks"},{"step":7,"title_tr":"İlk yardım, resüsitasyon ve dış tıbbi yardım","title_en":"Provide first aid and emergency medical support","learning_tr":"Kazazede güvenli bir alana çıkarıldığında ilk yardım ekibi devreye girer. Bilinç, solunum, maruziyet, olası travma ve gerekiyorsa temel yaşam desteği güncel ilk yardım/CPR eğitimi kapsamında değerlendirilir.","learning_en":"Once the casualty is brought to a safe area, the first-aid team takes over. Assess consciousness, breathing, exposure, potential trauma and, when needed, basic life support under current first-aid and CPR training.","exercise_tr":"Kazazede güvenli alana alındıktan sonra ilk değerlendirme, tıbbi yardım ve teslim bilgilerini örnekle gösterin.","exercise_en":"Illustrate initial assessment, medical assistance and handover information after moving the casualty to a safe area.","hazard_tr":"Kirli atmosfere ikincil maruziyet, tıbbi müdahalenin gecikmesi veya desteklenmeyen teşhis.","hazard_en":"Secondary exposure, delayed medical care or unsupported diagnosis.","id":"confined-RESCUE-7","source_full_tr":["Kazazede güvenli bir alana çıkarıldığında ilk yardım ekibi devreye girer. Bilinç, solunum, maruziyet, olası travma ve gerekiyorsa temel yaşam desteği güncel ilk yardım/CPR eğitimi kapsamında değerlendirilir. Zehirli gaz maruziyeti veya kimyasal bulaşta ikincil maruziyetin önlenmesi açıklanır. Olayın niteliğine göre TMAS/kara sağlık/liman müdahale desteği değerlendirilir. Tıbbi oksijen ve resüsitasyon uygulamaları yetkin personelin sorumluluğudur.","İlişkili kartlar: ORTAK-12, -13.\nEğitim biçimi: Güvenli ilk yardım mankeni/ders gösterimi."],"source_full_en":["The first-aid team takes over when the casualty reaches a safe area. Consciousness, breathing, exposure, possible trauma and, if required, basic life support are assessed under current first-aid and CPR training. Explain prevention of secondary exposure after toxic-gas exposure or chemical contamination. Depending on the incident, consider telemedical assistance (TMAS), shore medical services or port emergency support. Medical oxygen and resuscitation procedures remain the responsibility of competent personnel.","Related cards: ORTAK-12, -13. Training format: safe mannequin-based first-aid demonstration or classroom instruction."],"source_integrity":"sha256_verified_against_embedded_blocks"},{"step":8,"title_tr":"Personel yoklaması, yeniden emniyet ve kayıtların kapatılması","title_en":"Muster, restore safety and document","learning_tr":"Kurtarma ve yedek ekibin sayımı, SCBA/halat/sedye/gaz ölçerin kontrolü, mahalde yeni girişin engellenmesi, olaya ilişkin rapor zinciri, ekipman arızası, eğitim ihtiyacı ve düzeltici faaliyetler değerlendirilir.","learning_en":"Review accountability of rescue and standby personnel; inspect SCBA, lines, stretchers and gas detectors; prevent further entry; and consider the reporting chain, equipment defects, training needs and corrective actions.","exercise_tr":"Kurtarma ekibi yoklamasını, donanım kontrolünü ve fiilen yapılan/simüle edilen işleri örnek raporda ayırt ettirin.","exercise_en":"Reconcile rescuer accounting, equipment checks and actual versus simulated activities in a sample report.","hazard_tr":"Mahalin kontrolsüz yeniden kullanımı veya yapılmamış kurtarmanın yapılmış gibi kaydı.","hazard_en":"Uncontrolled re-entry into the space or recording a rescue that was not performed.","id":"confined-RESCUE-8","source_full_tr":["Kurtarma ve yedek ekibin sayımı, SCBA/halat/sedye/gaz ölçerin kontrolü, mahalde yeni girişin engellenmesi, olaya ilişkin rapor zinciri, ekipman arızası, eğitim ihtiyacı ve düzeltici faaliyetler değerlendirilir. Fiilen manken çıkarma, SCBA giyme, ölçüm gösterimi veya yalnızca simüle edilen adımların raporda ayrı anlatılacağı öğretilir. Gerekli gerçek olay ve sağlık kayıtlarının kullanımı ayrıca değerlendirilir.","İlişkili kartlar: ORTAK-12, -14.\nEğitim biçimi: Kapanış, belge ve olay sonrası değerlendirme."],"source_full_en":["Review headcount of rescue and backup personnel, SCBA, lines, stretchers and gas-detector checks, prevention of further entry, incident-reporting chain, equipment defects, training needs and corrective actions. Teach separate reporting of actual mannequin extraction, SCBA donning and measuring-device demonstration versus simulated steps. The need for actual incident and medical records is assessed separately.","Related cards: ORTAK-12, -14. Training format: closeout, documentation and post-incident assessment."],"source_integrity":"sha256_verified_against_embedded_blocks"}]},{"key":"damage/Karaya","family":"damage","flow":"Karaya","title_tr":"Karaya Oturma","title_en":"Grounding","family_title_tr":"Karaya Oturma ve Su Alma","family_title_en":"Grounding and Flooding","stages":[{"step":1,"title_tr":"Olayın tanınması ve köprüüstü kararı","title_en":"Recognize grounding and decide initial response","learning_tr":"Gemi hızında beklenmedik azalma, titreşim, sürtünme, seyir değerlerinde tutarsızlık, baş/kıç draftı veya dümen/sevk davranışında değişim gibi emareler karaya temas ihtimali bakımından değerlendirilir.","learning_en":"Signs such as an unexpected reduction in speed, vibration, scraping, inconsistent navigational readings, changes in forward or aft draught, or altered steering/propulsion response are assessed as indications of possible grounding.","exercise_tr":"Senaryo mevkiini harita/ECDIS üzerinde ve mevcut iskandil–draft verileriyle karşılaştırın; köprüüstü–makine ilk ihbarını masa başında canlandırın.","exercise_en":"Compare the scenario position on the chart/ECDIS with available soundings and draughts; rehearse the initial bridge–engine-room report.","hazard_tr":"Temas sonrası hasar boyutu bilinmeden sevk verilmesi, yanlış mevki veya derinlik varsayımı.","hazard_en":"Applying propulsion before damage is assessed, or relying on an incorrect position or depth assumption.","id":"GRD-01","source_full_tr":["Gemi hızında beklenmedik azalma, titreşim, sürtünme, seyir değerlerinde tutarsızlık, baş/kıç draftı veya dümen/sevk davranışında değişim gibi emareler karaya temas ihtimali bakımından değerlendirilir. Vardiya zabiti kaptanı ve makine dairesini haberdar eder; geminin mevkiini, seyir yönünü ve o andaki deniz şartlarını doğrular. İlave hasar oluşturabilecek sevk manevraları için kaptan ve teknik ekip birlikte karar verir. Seyir emniyeti gerektiriyorsa çevredeki trafik ve geminin görünürlük durumu değerlendirilir."],"source_full_en":["Unexpected loss of speed, vibration, scraping, inconsistencies in navigation readings or changes in forward or aft draught, steering or propulsion are assessed as possible indications of grounding. The officer of the watch informs the master and engine room, and verifies the vessel's position, track and sea conditions. The master and technical team jointly decide whether propulsion manoeuvres could cause further damage. Surrounding traffic and the ship's conspicuity are considered where needed for navigational safety."],"source_integrity":"sha256_verified_against_embedded_blocks"},{"step":2,"title_tr":"Personelin toplanması, yaralanma kontrolü ve sınırlandırma","title_en":"Account for crew and prevent injury","learning_tr":"Hasar kontrol, makine, güverte ve haberleşme görevleri role cetvelindeki sorumluluklarıyla ilişkilendirilir. Personelin güvenli toplanması, eksik/yaralı kişi kontrolü ve riskli mahallere izinsiz girişin önlenmesi uygulanır.","learning_en":"Link damage-control, engineering, deck and communications responsibilities to the muster list. Demonstrate safe personnel assembly, verification of missing or injured crew, and prevention of unauthorised access to dangerous spaces. Accountability and coordination of work groups are assessed before further inspections or recovery actions.","exercise_tr":"Hasar kontrol postalarını role cetveliyle eşleştirin; personel yoklaması, yaralı bildirimi ve tehlikeli bölgenin sınırlandırılmasını senaryoda gösterin.","exercise_en":"Match damage-control stations to the muster list; rehearse personnel accounting, casualty reporting and restricting access to unsafe areas.","hazard_tr":"Eksik personelin gözden kaçması; yapısal olarak güvensiz veya su alan mahale izinsiz giriş.","hazard_en":"Overlooking missing personnel or permitting unauthorised entry into a damaged or flooding space.","id":"GRD-02","source_full_tr":["Hasar kontrol, makine, güverte ve haberleşme görevleri role cetvelindeki sorumluluklarıyla ilişkilendirilir. Personelin güvenli toplanması, eksik/yaralı kişi kontrolü ve riskli mahallere izinsiz girişin önlenmesi uygulanır. Açık kapılar, menholler, havalandırma geçişleri ve diğer olası su yolları hasar kontrol planına göre ele alınır. Bu işlemlerin personeli kapalı veya tehlikeli mahalde mahsur bırakmamasına dikkat edilir."],"source_full_en":["Relate damage-control, engineering, deck and communication duties to the muster list. Ensure safe muster, checking for missing or injured personnel and preventing unauthorised entry to hazardous areas. Assess open doors, manholes, ventilation passages and other possible water paths against the damage-control plan. Take care that these actions do not trap personnel inside an enclosed or dangerous space."],"source_integrity":"sha256_verified_against_embedded_blocks"},{"step":3,"title_tr":"Gövde, tank ve makine hasarının ilk tespiti","title_en":"Assess hull, tank and machinery damage","learning_tr":"Tekne üzerindeki temasın tahmin edilen bölgesi, bunun su girişine veya tank hasarına sebep olup olmadığı bakımından değerlendirilir. Güvenli ölçüm noktalarından tank ve sintine seviyeleri alınır; önceki değerlerle karşılaştırılır.","learning_en":"The probable area of hull contact is assessed for possible water ingress or tank damage. Tank and bilge levels are obtained from safe measuring points and compared with earlier readings.","exercise_tr":"Tekne temas bölgesini planda işaretleyin; emniyetli iskandil noktalarını, sintine/tank seviyelerini ve ölçüm eğilimini örnek veriler üzerinde karşılaştırın.","exercise_en":"Mark the suspected contact area on the hull plan; compare safe tank/bilge sounding points and example level trends.","hazard_tr":"Su basmış bölmeye girme, güvenilmeyen ölçümlerden hasarın bulunmadığı sonucunu çıkarma.","hazard_en":"Entering a flooded space or treating unreliable readings as proof that no damage exists.","id":"GRD-03","source_full_tr":["Tekne üzerindeki temasın tahmin edilen bölgesi, bunun su girişine veya tank hasarına sebep olup olmadığı bakımından değerlendirilir. Güvenli ölçüm noktalarından tank ve sintine seviyeleri alınır; önceki değerlerle karşılaştırılır. Pervane, şaft, dümen, deniz suyu emişi ve ilgili tesisatın olası etkilenmesi makine ekibince değerlendirilir. Görünmeyen bir bölmedeki hasar, yalnız uzaktan kontrolle kesin olarak dışlanmaz. Kontrol edilen ve henüz kontrol edilemeyen mahaller ayrı yazılır."],"source_full_en":["Assess the estimated area of hull contact to determine whether there is water ingress or tank damage. Take tank and bilge soundings from safe measuring points and compare them with earlier readings. The engineering team assesses possible damage to propellers, shafts, rudders, seawater intakes and associated equipment. Damage in an inaccessible compartment cannot be conclusively excluded by remote observation alone. Distinguish spaces already checked from those not yet accessible."],"source_integrity":"sha256_verified_against_embedded_blocks"},{"step":4,"title_tr":"Oturma koşulu, dip yapısı ve gelgit değerlendirmesi","title_en":"Review seabed contact, tide and condition","learning_tr":"Karaya oturmanın gemi boyunca hangi bölgede yük meydana getirdiği, çevre su derinlikleri ve gelgit koşullarıyla birlikte incelenir.","learning_en":"The distribution of ground reaction along the hull is examined alongside surrounding water depths and tidal conditions.","exercise_tr":"Harita derinliği, gelgit, akıntı, taslak ve temas dağılımını örnek olay tablosunda birlikte değerlendirin.","exercise_en":"Review charted depth, tide, current, draught and estimated bottom-contact distribution on a scenario worksheet.","hazard_tr":"Dip yükü ve gelgit etkisi belirlenmeden kurtarma manevrası planlanması.","hazard_en":"Planning a refloating manoeuvre before bottom reaction and tidal effects have been assessed.","id":"GRD-04","source_full_tr":["Karaya oturmanın gemi boyunca hangi bölgede yük meydana getirdiği, çevre su derinlikleri ve gelgit koşullarıyla birlikte incelenir. Harita, derinlik ölçümü, hava tahmini, akıntı ve olay anındaki draft bilgilerinin birlikte yorumlanması öğretilir. Gemi bir tarafa yatmış olsa bile bunun yalnız sıvı transferiyle giderilebileceği varsayılmaz. Gelgit yükselmesi/azalması, gövde dayanımı ve ilerleyen hasar riski açısından tartışılır."],"source_full_en":["Review the part of the hull carrying ground reaction, together with surrounding water depths and tidal conditions. Teach the combined interpretation of charts, soundings, weather forecasts, currents and draught at the time of the incident. A list to one side must not be presumed correctable simply by liquid transfer. Discuss rising or falling tide in relation to hull strength and progressive damage risk."],"source_integrity":"sha256_verified_against_embedded_blocks"},{"step":5,"title_tr":"Stabilite, sıvı transferleri ve çevre riski","title_en":"Assess stability, transfers and pollution risk","learning_tr":"Hasar stabilite kitabı ve mevcut yükleme koşulu kullanılarak su alma ihtimali, trim/meyil, serbest yüzey ve zemin reaksiyonu değerlendirilir.","learning_en":"The damage-stability booklet and actual loading condition are used to assess possible flooding, trim and list, free-surface effects and ground reaction.","exercise_tr":"Örnek yükleme durumunda meyil, trim, serbest yüzey ve olası yakıt/balast transferi sonuçlarını hasar stabilitesi dokümanı üzerinden tartışın.","exercise_en":"Discuss heel, trim, free-surface effects and possible fuel/ballast transfers using an example loading condition and approved damage-stability information.","hazard_tr":"Hesapsız sıvı transferiyle stabilitenin bozulması veya kirlilik oluşması.","hazard_en":"Undocumented liquid transfer worsening stability or creating pollution.","id":"GRD-05","source_full_tr":["Hasar stabilite kitabı ve mevcut yükleme koşulu kullanılarak su alma ihtimali, trim/meyil, serbest yüzey ve zemin reaksiyonu değerlendirilir. Balast, yakıt veya başka sıvıların aktarılması bir karar seçeneği olarak öğretilir; arızalı tankı ağırlaştırabilecek veya su girişini artırabilecek etkiler açıklanır. Tank kapakları, hava firarları ve sızıntı olasılığı kontrol edilir; denize kirlilik riski varsa ilgili SOPEP bilgi modülüyle bağlantı kurulur."],"source_full_en":["Use the ship's damage-stability information and actual loading condition to assess potential flooding, trim, heel, free-surface effect and ground reaction. Transferring ballast, fuel or another liquid is introduced as a decision option, with attention to effects that could load a damaged tank or worsen water ingress. Check tank closures, vents and potential leaks; if there is a risk of marine pollution, refer to the applicable SOPEP information module."],"source_integrity":"sha256_verified_against_embedded_blocks"},{"step":6,"title_tr":"Yeniden yüzdürme seçenekleri ve yardım kararı","title_en":"Evaluate refloating and outside assistance","learning_tr":"Geminin aynı mevki ve konumda tutulmasının mı, dış yardımla kontrollü kurtarmanın mı, yoksa gerekli inceleme sonunda sınırlı bir manevranın mı daha emniyetli olacağı tartışılır.","learning_en":"The team discusses whether maintaining the vessel's current position, controlled salvage with outside assistance, or a limited manoeuvre after suitable investigation would be safest.","exercise_tr":"Bekleme, dış yardım ve kontrollü yeniden yüzdürme seçeneklerini hasar, zemin, hava ve gelgit ölçütleriyle bir karar matrisinde karşılaştırın.","exercise_en":"Compare holding position, requesting assistance and controlled refloating in a decision matrix covering hull damage, seabed, weather and tide.","hazard_tr":"Gövde muayenesi ve kaptan kararı olmadan kendi gücüyle kurtulma girişimi.","hazard_en":"Attempting self-refloating before hull assessment and the master’s decision.","id":"GRD-06","source_full_tr":["Geminin aynı mevki ve konumda tutulmasının mı, dış yardımla kontrollü kurtarmanın mı, yoksa gerekli inceleme sonunda sınırlı bir manevranın mı daha emniyetli olacağı tartışılır. Teknenin hasarı, taban yapısı, çevresel tehlike, gelgit penceresi, çekme noktaları, römorkör gereksinimi ve olası pervane/dümen hasarı birlikte ele alınır. Yeniden yüzdürme için hazır olumlu karar verildiği varsayılmaz; ölçüm ve mühendislik bilgisi eksikse hareket ettirmeme kararı güçlendirilir."],"source_full_en":["Consider whether remaining in the present position, a controlled salvage operation with outside assistance, or limited movement after the necessary surveys would be safest. Assess hull damage, seabed conditions, environmental hazards, tidal window, towing points, tug requirements and possible propeller or rudder damage together. Do not presume that refloating is an immediately acceptable decision; where measurements or engineering information are inadequate, emphasise the option not to move the vessel."],"source_integrity":"sha256_verified_against_embedded_blocks"},{"step":7,"title_tr":"Haberleşme, emniyet işaretleri ve bildirim","title_en":"Coordinate communications and reporting","learning_tr":"Kaptan, gemi işletmesi ve gerekiyorsa ilgili VTS/liman/arama-kurtarma makamlarıyla haberleşmenin kapsamını belirler. Olay mevkii, gemi durumu, personel emniyeti, taslak/iskandil, hasar ve kirlilik durumu ile ihtiyaç duyulan…","learning_en":"The master determines the scope of communications with the company and, where needed, the relevant VTS, port or search-and-rescue authorities.","exercise_tr":"Olay raporundaki mevki, personel, hasar, çevre etkisi ve yardım ihtiyacı alanlarını doldurulmamış örnek form üzerinde gözden geçirin.","exercise_en":"Review the position, persons, damage, environmental impact and assistance fields on an unsubmitted sample report.","hazard_tr":"Varsayımsal tehlike çağrısını gerçek kanalda göndermek veya doğrulanmamış hasar bilgisi bildirmek.","hazard_en":"Sending a simulated distress message on a live channel or reporting unverified damage as fact.","id":"GRD-07","source_full_tr":["Kaptan, gemi işletmesi ve gerekiyorsa ilgili VTS/liman/arama-kurtarma makamlarıyla haberleşmenin kapsamını belirler. Olay mevkii, gemi durumu, personel emniyeti, taslak/iskandil, hasar ve kirlilik durumu ile ihtiyaç duyulan yardımlar kısa ve doğrulanabilir biçimde aktarılır. Karaya oturma fener/şekilleri COLREG 30 kapsamında anlatılır; otomatik olarak NUC ilanı yapılmaz. Gerçek tehlike veya acelelik mesajı yalnız gerçek olay koşullarında düzenlemelere göre yayımlanır; talimde iletişim örnekleri simüle edilir."],"source_full_en":["The master defines the scope of communications with the operator and, where necessary, VTS, port or search-and-rescue authorities. Provide concise, verifiable reports of incident position, ship and crew condition, draught or sounding information, damage, pollution and assistance required. Grounding lights and shapes are explained under COLREG Rule 30; a declaration of 'not under command' does not follow automatically. Real distress or urgency messages are transmitted only when justified by the actual situation under applicable rules; exercise messages are simulated."],"source_integrity":"sha256_verified_against_embedded_blocks"},{"step":8,"title_tr":"Talimin kapanışı, bulgular ve kayıt","title_en":"Debrief and record findings","learning_tr":"Hasar kontrol planının okunması, tank/sintine izlemi, personel görevlerinin anlaşılması, alternatif kurtarma kararları ve çevre emniyeti bakımından öğrenilenler değerlendirilir.","learning_en":"Learning outcomes are reviewed in relation to the damage-control plan, monitoring of tanks and bilges, understanding of duties, alternative salvage decisions and protection of the environment.","exercise_tr":"Talim sonrası ölçüm eğilimlerini, rol dağılımını ve varsayımsal kurtarma kararlarını gözden geçirip ekipman emniyet durumunu kontrol edin.","exercise_en":"Review sounding trends, assigned roles and hypothetical salvage decisions; check that demonstration equipment is left safe.","hazard_tr":"Simüle müdahalenin fiilen yapılmış gibi jurnal veya bakım kaydına yazılması.","hazard_en":"Recording simulated actions as completed shipboard operations in the log or maintenance record.","id":"GRD-08","source_full_tr":["Hasar kontrol planının okunması, tank/sintine izlemi, personel görevlerinin anlaşılması, alternatif kurtarma kararları ve çevre emniyeti bakımından öğrenilenler değerlendirilir. Kullanılan eğitim malzemelerinin ve gösterimi yapılan ekipmanın emniyetli durumda olduğu kontrol edilir. EK-V örnek metni, EYS.08.104.FR konu listesi ve güverte/makine jurnal hatırlatıcıları birlikte gösterilir. Uygulanmayan teknik operasyonların nedenleri ve sonraki eğitim gereksinimleri yazım diline yansıtılır."],"source_full_en":["Review lessons from reading the damage-control plan, monitoring tank and bilge levels, understanding personnel duties, considering alternative salvage decisions and protecting the environment. Check that training materials and demonstrated equipment are left safe. Present together the EK-V sample narrative, EYS.08.104.FR subject list and deck or engine log reminders. The writing reflects reasons why particular technical operations were not carried out and identifies future training needs."],"source_integrity":"sha256_verified_against_embedded_blocks"}]},{"key":"damage/Su","family":"damage","flow":"Su","title_tr":"Su Alma","title_en":"Flooding","family_title_tr":"Karaya Oturma ve Su Alma","family_title_en":"Grounding and Flooding","stages":[{"step":1,"title_tr":"Su alma ihbarı, alarm ve ilk sınıflandırma","title_en":"Identify and classify flooding","learning_tr":"Sintine seviye alarmı, iskandil artışı, gözle görülen su, pompa çalışmasında düzensizlik veya bir mahalde ses/titreşim farklılığı su alma şüphesi oluşturur.","learning_en":"A bilge high-level alarm, increasing soundings, visible water, abnormal pump operation or changed noise/vibration within a compartment may indicate flooding.","exercise_tr":"Örnek sintine alarmını, ilk iskandil kayıtlarını ve zaman çizelgesini karşılaştırarak ilk su alma ihbarını canlandırın.","exercise_en":"Compare a simulated bilge alarm with initial sounding data and timeline; rehearse the first flooding report.","hazard_tr":"Alarmı yalnız tek göstergeye dayandırmak veya su alan mahale tehlikeli biçimde yaklaşmak.","hazard_en":"Relying on one indication or approaching a flooding compartment unsafely.","id":"FLD-01","source_full_tr":["Sintine seviye alarmı, iskandil artışı, gözle görülen su, pompa çalışmasında düzensizlik veya bir mahalde ses/titreşim farklılığı su alma şüphesi oluşturur. İlk ihbarda mahal ve zaman, suyun görülen seviyesi, olası kaynak ve personel tehlikesi bildirilir. Kaptan ile makine nöbeti bilgi paylaşır; hasar kontrol ekibi görevlendirilir. Denizde serbest seyir halinde su almaya başlayan gemi için emniyetli seyir ve manevra seçenekleri ayrı değerlendirilir."],"source_full_en":["A bilge-level alarm, rising sounding, visible water, irregular pump operation or unusual sound or vibration in a compartment may indicate flooding. The first report identifies the space and time, observed water level, possible source and danger to personnel. The master and engineering watch exchange information and the damage-control team is assigned. Safe navigation and manoeuvring options are considered separately for a ship beginning to flood while underway."],"source_integrity":"sha256_verified_against_embedded_blocks"},{"step":2,"title_tr":"Personel emniyeti ve su geçirmez bölmelerin korunması","title_en":"Protect personnel and watertight boundaries","learning_tr":"Riskli mahaldeki kişilerin emniyeti sağlanır; hasar kontrol sınırlarının ve mevcut su geçirmez kapama düzeninin doğrulanması öğretilir. Kontrolsüz kapı/menhol/şaft geçişlerinin ikinci bir bölmeye su taşıyabileceği açıklanır.","learning_en":"Personnel at risk are protected; trainees learn to verify damage-control boundaries and existing watertight closures. Uncontrolled doors, manholes and shaft penetrations can allow flooding to spread to another compartment.","exercise_tr":"Su geçirmez bölme sınırlarını planda gösterin; yoklamayı ve kapama doğrulama zincirini senaryoda takip edin.","exercise_en":"Identify watertight boundaries on the plan; trace personnel accounting and closure-confirmation responsibilities.","hazard_tr":"Su geçirmez kapının kontrolsüz açılması veya tehlikeli bölmeye izinsiz giriş.","hazard_en":"Uncontrolled opening of watertight closures or unauthorised entry into unsafe spaces.","id":"FLD-02","source_full_tr":["Riskli mahaldeki kişilerin emniyeti sağlanır; hasar kontrol sınırlarının ve mevcut su geçirmez kapama düzeninin doğrulanması öğretilir. Kontrolsüz kapı/menhol/şaft geçişlerinin ikinci bir bölmeye su taşıyabileceği açıklanır. Girilmesi gereken mahallerin kapalı mahal, elektrik ve kaygan zemin riskleri değerlendirilir. Suyun yüksek olduğu veya görüşün kaybolduğu bölmede personel arama işlemleri yetkili kurtarma düzeninin parçasıdır; tek başına giriş yapılmaz."],"source_full_en":["Protect people in the affected space and verify damage-control boundaries and existing watertight closures. Explain that uncontrolled doors, manholes and shaft penetrations can allow water to enter another compartment. Assess confined-space, electrical and slippery-floor hazards in spaces that may require entry. Searches in flooded or visibility-obscured spaces are part of an authorised rescue arrangement; no one enters alone."],"source_integrity":"sha256_verified_against_embedded_blocks"},{"step":3,"title_tr":"Su giriş kaynağı, ölçüm ve hız eğilimi","title_en":"Determine ingress location and rate","learning_tr":"Suyun görünür olduğu mahal ile girişin kaynağının aynı olmayabileceği değerlendirilir. Boru/valf, deniz suyu emişi, gövde, şaft/şaft kovanı veya açıklık seçenekleri ayrı incelenir.","learning_en":"The place where water is observed may differ from the actual ingress point. Pipes and valves, sea-water intakes, hull plating, shafts or stern-tube systems and openings are assessed separately.","exercise_tr":"İskandil tablosundan su seviyesi artış hızını hesaplatın; olası gövde, boru ve şaft kaynaklarını ayrı seçenekler olarak değerlendirin.","exercise_en":"Use sample sounding records to estimate the rate of rise; compare hull, piping and shaft-related ingress hypotheses.","hazard_tr":"Su kaynağını gözlenen birikim mahaliyle karıştırma veya tek ölçümle yanlış teşhis.","hazard_en":"Confusing the flooded location with the ingress source or diagnosing from a single reading.","id":"FLD-03","source_full_tr":["Suyun görünür olduğu mahal ile girişin kaynağının aynı olmayabileceği değerlendirilir. Boru/valf, deniz suyu emişi, gövde, şaft/şaft kovanı veya açıklık seçenekleri ayrı incelenir. Güvenli noktalardan alınan iskandil ve alarm verileri zaman çizelgesine işlenir. Farklı mahallerdeki seviyelerin değişimi, pompalar devredeyken ve değilken uygun yöntemlerle karşılaştırılır. Bir seviyenin düşmesi, girişin tamamen durduğunu kanıtlamaz."],"source_full_en":["Recognise that the compartment where water is observed may not be the point of ingress. Examine pipe or valve defects, seawater intakes, hull damage, shaft or stern-tube connections and openings separately. Enter soundings and alarm readings taken from safe locations onto a timeline. Compare level changes across compartments, both with pumps running and stopped, using suitable methods. A falling level does not prove that ingress has ceased completely."],"source_integrity":"sha256_verified_against_embedded_blocks"},{"step":4,"title_tr":"İzolasyon, geçici sızdırmazlık ve kontrol bölgesi","title_en":"Isolate and contain flooding","learning_tr":"Su alma sebebi uygun şekilde değerlendirildikten sonra, müdahale yetkili personelce planlanır. Deniz suyu hattında, valfte, flanşta veya bir gövde açıklığında meydana gelen sızıntı için uygulanabilecek emniyetli izolasyon ve…","learning_en":"Once the cause of flooding has been assessed, authorised personnel plan any intervention. Safe isolation of a leaking sea-water pipe, valve or flange is distinguished from temporary sealing of a hull opening.","exercise_tr":"Boru ve valf şemalarında varsayımsal izolasyon noktalarını gösterin; geçici sızdırmazlık araçlarını kuru gösterimle tanıtın.","exercise_en":"Identify hypothetical isolation points on piping and valve diagrams; demonstrate temporary sealing materials without live operation.","hazard_tr":"Basınçlı/enerjili hattın izinsiz açılması veya emniyetsiz hasar mahalline girilmesi.","hazard_en":"Opening a pressurised or energised line without authorisation, or entering an unsafe damaged space.","id":"FLD-04","source_full_tr":["Su alma sebebi uygun şekilde değerlendirildikten sonra, müdahale yetkili personelce planlanır. Deniz suyu hattında, valfte, flanşta veya bir gövde açıklığında meydana gelen sızıntı için uygulanabilecek emniyetli izolasyon ve geçici kapatma farklı teknik müdahaleler olarak öğretilir. Kama, yama, tıkaç veya diğer malzemelerin uygunluğu, su basıncı ve erişim emniyetiyle birlikte değerlendirilir. Kapama sırasında personelin diğer bölmede kalmaması ve devrenin sistem üzerindeki etkisi kontrol edilir."],"source_full_en":["After properly assessing the likely cause, authorised personnel plan the intervention. Safe isolation and temporary closure of leaks in a seawater line, valve, flange or hull opening are introduced as different technical measures. Assess wedges, patches, plugs and other materials for suitability, water pressure and safe access. Confirm no personnel are trapped in an adjoining compartment by closure and that system isolation does not cause additional hazards."],"source_integrity":"sha256_verified_against_embedded_blocks"},{"step":5,"title_tr":"Pompalama olanakları ve teknik sınırlamalar","title_en":"Assess pumping capacity and constraints","learning_tr":"Kullanılabilir sabit/taşınabilir pompa, emiş hattı, enerji, deşarj ve çalışma güvenliği değerlendirilir. Emiş ağzının tıkanması, hava yapması, yetersiz debi, kaçıran valf veya geri basma riski eğitimde tanıtılır.","learning_en":"Available fixed or portable pumps, suction arrangements, power supply, discharge route and operational safety are assessed.","exercise_tr":"Pompa eğrisi, enerji kaynağı, emiş/deşarj güzergâhı ve örnek su giriş debisini karşılaştırarak kapasite sınırlamasını değerlendirin.","exercise_en":"Compare pump capacity, power source, suction/discharge route and a sample ingress rate to assess pumping limitations.","hazard_tr":"Pompa kapasitesini abartma, uygunsuz deşarj veya elektrik-su teması.","hazard_en":"Overestimating pump capacity, unsafe discharge or electricity–water contact.","id":"FLD-05","source_full_tr":["Kullanılabilir sabit/taşınabilir pompa, emiş hattı, enerji, deşarj ve çalışma güvenliği değerlendirilir. Emiş ağzının tıkanması, hava yapması, yetersiz debi, kaçıran valf veya geri basma riski eğitimde tanıtılır. Pompanın kapasitesi su giriş hızından düşük kalıyorsa ek önlem ve yardım seçenekleri tartışılır. Pompaya ulaşmak için tehlikeli mahale girilmez; uygun olmayan hatta izinsiz bağlama yapılmaz. Pompalamanın tekneye ve çevreye etkisi izlenir."],"source_full_en":["Assess available fixed or portable pumps, suction lines, electrical supply, discharge routes and working safety. Introduce blocked suction, loss of prime, inadequate flow, leaking valves and back-pressure risks. If pump capacity is below the inflow rate, consider additional measures and help. Do not enter a hazardous compartment merely to reach a pump or connect equipment to an unsuitable line without authorisation. Monitor effects of pumping on the hull and environment."],"source_integrity":"sha256_verified_against_embedded_blocks"},{"step":6,"title_tr":"Hasar stabilitesi, trim/meyil ve tahliye sınırı","title_en":"Review damage stability and evacuation limits","learning_tr":"Mahal dolulukları, serbest yüzey, draft, meyil, trim ve su geçirmez sınırlar gemiye ait onaylı kaynaklardan incelenir.","learning_en":"Compartment flooding, free-surface effects, draught, list, trim and watertight boundaries are assessed using the vessel's approved information.","exercise_tr":"Gemiye özgü hasar stabilitesi verileri üzerinde trim, meyil, serbest yüzey ve bölme kaybı etkilerini masa başında inceleyin.","exercise_en":"Use the vessel’s damage-stability information to discuss trim, heel, free surface and lost compartments.","hazard_tr":"Onaysız balast veya sıvı aktarma kararıyla yeni bir stabilite tehlikesi yaratılması.","hazard_en":"Creating a new stability hazard through an unauthorised ballast or liquid-transfer decision.","id":"FLD-06","source_full_tr":["Mahal dolulukları, serbest yüzey, draft, meyil, trim ve su geçirmez sınırlar gemiye ait onaylı kaynaklardan incelenir. Bir mahallin boşaltılması veya balast tanklarının değiştirilmesi ilk bakışta olumlu görünse de başka bölmedeki su girişini veya yapısal gerilmeyi artırabileceği öğretilir. Geminin hayatta kalma kapasitesi kesinleşmemişse alternatif hareketler, kaptan ve gerekliyse kıyı teknik desteğiyle değerlendirilir. Yaşam kurtarma hazırlıkları kötüleşen olay senaryosunda ayrı karar basamağı olarak ele alınır."],"source_full_en":["Review compartment filling, free-surface effect, draught, heel, trim and watertight boundaries using the vessel's approved documents. Pumping out a space or changing ballast may appear beneficial initially but can increase flooding elsewhere or structural stress. If the vessel's survivability is uncertain, consider alternatives with the master and shore technical assistance when needed. Life-saving preparations are treated as a separate decision stage when the incident deteriorates."],"source_integrity":"sha256_verified_against_embedded_blocks"},{"step":7,"title_tr":"Seyir, haberleşme, yardım ve ikincil tehlikeler","title_en":"Maintain navigation, communications and support","learning_tr":"Gemi sevk/dümen kabiliyeti, çevre trafik, hava/deniz durumu ve limana güvenli intikal ihtimaliyle birlikte değerlendirilir. Gerekli görülen kıyı/liman/arama-kurtarma koordinasyonu planlanır.","learning_en":"Propulsion and steering capability are considered alongside traffic, weather and sea conditions and the prospect of reaching port safely. Coordination with coastal, port and search-and-rescue services is planned where needed.","exercise_tr":"Kaptanın seyir emniyeti, yardım çağrısı, kirlenme ve limana intikal seçeneklerini senaryo karar tablosunda karşılaştırın.","exercise_en":"Compare navigation safety, assistance, pollution and port-of-refuge options on a scenario decision sheet.","hazard_tr":"Su baskınının sevk/dümen ve kirlilik üzerindeki etkisinin gözden kaçması; yanlış gerçek bildirim.","hazard_en":"Missing the consequences for propulsion, steering or pollution, or issuing a false real-world report.","id":"FLD-07","source_full_tr":["Gemi sevk/dümen kabiliyeti, çevre trafik, hava/deniz durumu ve limana güvenli intikal ihtimaliyle birlikte değerlendirilir. Gerekli görülen kıyı/liman/arama-kurtarma koordinasyonu planlanır. Yağ/yakıt içeren bir mahal su aldıysa kirlilik ve atık yönetimi konuları ayrıca düşünülür. Gerçek tehlike veya acelelik bildirimi, olayın gerçek boyutuna ve kaptanın değerlendirmesine bağlıdır. Talimde gerçek DSC/MAYDAY yayını yapılmadan bildirim mesajının içeriği ve aktarım sırası öğretilebilir."],"source_full_en":["Assess propulsion and steering capability together with surrounding traffic, weather, sea state and the possibility of safely reaching port. Plan required coordination with coastal, port or search-and-rescue authorities. Where an oil or fuel-containing space floods, consider pollution prevention and waste management separately. Actual distress or urgency messages depend on the true severity of the incident and the master's assessment. A drill can teach message content and reporting sequence without sending a real DSC or MAYDAY transmission."],"source_integrity":"sha256_verified_against_embedded_blocks"},{"step":8,"title_tr":"İzleme, talim değerlendirmesi ve kayıt","title_en":"Monitor, debrief and document","learning_tr":"Su seviyesinin takip yöntemi, işlenmiş varsayımsal ölçümler, müdahale kararı ve ekip performansı gözden geçirilir. Kullanılan pompa ve hasar kontrol malzemeleri emniyetli bırakılır. EK-V, EYS.08.115.","learning_en":"The method of tracking water levels, illustrative measurements, response decisions and team performance are reviewed. Pumps and damage-control materials used for training are left in a safe condition. The scope of EK-V, EYS.08.","exercise_tr":"Örnek iskandil eğilimlerini ve talim kapsamını rapor taslağına aktarın; pompa ve hasar kontrol araçlarının emniyetli bırakılmasını kontrol edin.","exercise_en":"Enter simulated sounding trends and the drill scope into a draft record; check safe stowage of pumps and damage-control tools.","hazard_tr":"Gerçek pompa çalışması yapılmadığı hâlde yapılmış gibi rapor düzenlenmesi.","hazard_en":"Recording an actual pump operation that was never performed.","id":"FLD-08","source_full_tr":["Su seviyesinin takip yöntemi, işlenmiş varsayımsal ölçümler, müdahale kararı ve ekip performansı gözden geçirilir. Kullanılan pompa ve hasar kontrol malzemeleri emniyetli bırakılır. EK-V, EYS.08.115.FR ve ilgili jurnal/eğitim kayıtlarının hangi konuları içereceği gösterilir. Gerçekte çalıştırılmayan pompa veya yapılmayan transfer, geçmiş zamanlı örnek metinde “çalıştırıldı/transfer edildi” olarak nihai kayda aktarılmaz. Değerlendirilemeyen veya geliştirilmesi gereken noktalar açıkça belirtilir."],"source_full_en":["Review the method of tracking water levels, simulated measurement results, intervention decisions and team performance. Leave pumps and damage-control materials used for trainin
