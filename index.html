installation and release system, so its training programme must reflect that design. Open, partially enclosed, and totally enclosed lifeboat types also exist. Launching procedures, engines, and recovery conditions are not identical for every lifeboat. Accordingly, the display must not give generic mechanical commands such as “open the latch, release the hook, operate the winch” before the lifeboat type has been verified. Training refers to the actual model's labels, control diagrams, and manufacturer's manual."}]},{"id":"LB-C03","family":"lifeboat","title_tr":"İndirme düzeni, askı telleri ve matafora","title_en":"Launching appliances, falls and davits","paragraphs":[{"tr":"Matafora kolları, tambur/fren, askı telleri, bağlantı elemanları, emniyet tertibatı ve filika bağlantı noktaları ayrı işlevler görür. Aşınma, aşırı korozyon, uygunsuz tel sarımı, hasarlı makara veya sıkışmış hareketli kısım indirme sırasında ciddi tehlike yaratabilir. Bu tür kusurların erken fark edilmesi bir eğitim kazanımıdır; kusurun nasıl giderileceği ise yetkili bakım prosedürünün konusudur. Filika altı, matafora dönme alanı, tel güzergâhı ve askı yükü altında kalan bölgeler tehlikeli çalışma alanlarıdır. Personelin hangi sınırın dışında kalacağı işbaşı konuşmasında açıklanır.","en":"Davit arms, drums and brakes, suspension falls, connectors, safety devices, and lifeboat attachment points perform different functions. Wear, severe corrosion, incorrect fall winding, damaged sheaves, or seized moving parts may create serious hazards during launching. Early recognition of such defects is a training outcome; how they are remedied belongs to authorised maintenance procedures. Areas below the lifeboat, within the davit's sweep, along the falls, and beneath suspended loads are hazardous work areas. The exclusion boundaries for personnel are explained during the toolbox talk."}]},{"id":"LB-C04","family":"lifeboat","title_tr":"Bırakma ve geri alma sistemi: kavramlar","title_en":"Release and retrieval systems: basic concepts","paragraphs":[{"tr":"On-load release ve off-load release terimleri, filikada bırakma tertibatının yük koşullarıyla ilişkili çalışma özelliklerini tanımlar; her modelde tek biçimde çalışmaz. Hook reset veya kilit göstergesinin doğru durumu, görsel benzerlikten değil onaylı model talimatından belirlenir. Hatalı yeniden kurulan kanca ve yanlış güvenlik göstergesi, filikanın beklenmedik şekilde düşmesine yol açabilir. Eğitimde operatörün yalnız tek göstergeye güvenmemesi, karşılıklı kontrol ve yetkili sorumlu gözetimi üzerinde durulur. Öğrenciler bir parçanın adıyla hangi tehlikeyi önlediğini eşleştirir; gerçek kilit ayarı yaptırılmaz.","en":"The terms “on-load release” and “off-load release” describe operational characteristics of lifeboat release mechanisms in relation to loading; the systems do not work identically on every model. The correct condition of a reset hook or locking indicator is determined from the approved model instructions, not from visual similarity. An improperly reset hook or misleading safety indication may cause an unexpected fall of the lifeboat. Training stresses that the operator must not rely on a single indicator and that cross-checking and supervision by an authorised person are required. Trainees relate the name of each component to the hazard it prevents; they do not adjust actual locking mechanisms."}]},{"id":"LB-C05","family":"lifeboat","title_tr":"Talim öncesi emniyet kapısı ve durdurma yetkisi","title_en":"Pre-drill safety gate and stop-work authority","paragraphs":[{"tr":"Talim faaliyeti, kaptanın ve görevlendirilen zabitin onayladığı risk değerlendirmesi, görev dağılımı ve durdurma kriteri olmadan fiziksel indirmeye geçmez. Hava/deniz durumu, geminin sürati, rüzgârın iskeleye ve filikaya etkisi, vinç alanı, su sahasındaki trafik, başka operasyonlar, liman izinleri, yeterli personel ve cihazın güncel uygunluk durumu birlikte değerlendirilir. Beklenmeyen kanca konumu, kumanda arızası, şüpheli tel veya emniyetsiz personel yerleşimi görülürse faaliyet güvenli durumda durdurulur. “Talim programını tamamlamak”, tanımlanan emniyet sınırını aşmak için gerekçe değildir.","en":"Physical launching does not begin without the risk assessment, allocation of duties, and stop criteria approved by the master and designated officer. Weather and sea conditions, vessel speed, the effects of wind on the quay and lifeboat, the winch area, traffic in the water, concurrent operations, port permits, adequate staffing, and the equipment's current fitness for use are considered together. If an unexpected hook position, control malfunction, suspect fall, or unsafe personnel position is found, the operation is stopped in a safe condition. “Completing the drill schedule” does not justify exceeding an established safety limit."}]},{"id":"LB-C06","family":"lifeboat","title_tr":"Filika ekibi ve rol dağılımı","title_en":"Lifeboat crew and assignment of duties","paragraphs":[{"tr":"Sorumlu zabit; filika kumandanı, motor operatörü, matafora/indirme tertibatı operatörü, güverte emniyet gözcüsü, haberleşme personeli ve varsa geri alma destek ekibinin görevlerini açıklar. Aynı kişi birden fazla görevi üstleniyorsa haberleşme ve müdahale kapasitesinin düşmemesi sağlanır. Filikada kapasite etiketindeki bütün yolcuların bulunması, eğitim amacıyla her zaman gerekli veya güvenli değildir. Güncel IMO rehberindeki yaklaşım gereği, personelli indirme planlanıyorsa öncelikle sistemin insansız indirilip geri alınmasıyla işlevselliğinin doğrulanması önerisi ayrıca değerlendirilir; sonrasında gerekli asgari işletme personeliyle hareket edilir. Söz konusu uygulama gemi/matafora düzenine, yetkili karara ve üretici talimatına tabidir.","en":"The officer in charge explains the duties of the lifeboat commander, engine operator, davit/launching-appliance operator, deck safety lookout, communications personnel, and any recovery-support team. If one person holds several duties, communication and response capacity must not be impaired. Filling every place shown on a lifeboat's capacity plate is not always necessary or safe for training. In line with the approach in current IMO guidance, where launching with personnel aboard is planned, the recommendation first to verify functionality by lowering and recovering the craft without personnel is considered separately; subsequent operations use the minimum operating crew required. The method remains subject to the ship and davit arrangement, authorised decisions, and manufacturer's instructions."}]},{"id":"LB-C07","family":"lifeboat","title_tr":"Biniş, oturma ve kemer kullanımı","title_en":"Embarkation, seating and seat-belt use","paragraphs":[{"tr":"Binme mahallinde sıra, hareketli yüzeyler, kablo/halat geçişleri ve üst donanımın yarattığı engeller anlatılır. Tam kapalı filikalarda koltuk, kemer ve baş koruması; serbest düşüşlü filikalarda özel oturma/kemer ve vücut pozisyonu önemlidir. Biniş ve tahliye usulü gemi tipine göre değiştiğinden genel eğitimde güvenli biniş prensipleri anlatılır, ancak model doğrulanmadan özel oturma numarası ve kemer kilit adımı verilmez. Katılan personelin can yeleği, dalma giysisi ve diğer kişisel donanımlarının uygunluğu, filika içi hareket ve oturma imkânlarıyla birlikte değerlendirilir.","en":"Training explains boarding order and hazards arising from moving surfaces, cable or rope routes, and overhead equipment at the embarkation position. Seats, restraints, and head protection are important in totally enclosed lifeboats; free-fall lifeboats require particular seating, restraint, and body positions. Because embarkation and evacuation methods vary by vessel and craft type, general instruction covers safe boarding principles without specifying seat numbers or restraint-latch steps before the model is confirmed. Suitability of lifejackets, immersion suits, and other personal equipment is considered together with movement and seating space inside the lifeboat."}]},{"id":"LB-C08","family":"lifeboat","title_tr":"Filika motoru ve sevk sistemi","title_en":"Lifeboat engine and propulsion system","paragraphs":[{"tr":"Motorun yakıt, yağlama, soğutma, akü, kumanda, hava alımı ve egzoz şartları bilinir. Donanımın kapalı mahallerde veya kuru koşullarda kontrolsüz çalıştırılması; egzoz birikmesi, aşırı ısınma ve mekanik hasar riski yaratabilir. Talimde motorun nasıl devreye alındığı gerçek üretici talimatı üzerinde gösterilir; örnek sürenin veya devrin her filika tipine uygulanabileceği söylenmez. Motor çalıştırılması, filikanın fiilen suya indirildiği anlamına gelmez; raporda bu iki işlem ayrı kaydedilir. Çalıştırma sırasında pervaneye, soğutma akışına ve personel emniyetine ilişkin koşullar ayrı izlenir.","en":"Personnel become familiar with the engine's fuel, lubrication, cooling, battery, controls, air supply, and exhaust requirements. Uncontrolled operation in an enclosed area or under dry conditions can cause exhaust accumulation, overheating, and mechanical damage. The manufacturer's actual instructions are used to demonstrate how the engine is started; a sample running time or speed is not presented as applicable to every type of lifeboat. Starting the engine does not mean that the lifeboat was actually launched, and the record distinguishes those activities. Propeller safety, cooling flow, and personnel protection are monitored separately during engine operation."}]},{"id":"LB-C09","family":"lifeboat","title_tr":"Filika içinde yaşamı sürdürme donanımı","title_en":"Survival equipment carried aboard a lifeboat","paragraphs":[{"tr":"LSA Code kapsamındaki filika donanımı; içme suyu/erzak, ilk yardım, deniz demiri, seyir ve işaretleşme malzemeleri, su tahliye malzemeleri, aydınlatma ve araca özgü diğer araçları kapsar. Eğitimde hangi donanımın nerede ve hangi amaçla bulunduğu açıklanır; bütün filikaların aynı ekipman miktarına veya yerleşimine sahip olduğu varsayılmaz. Donanımın ambalajı, son kullanma tarihi ve mühürlü servis parçalarıyla ilgili kontrol, ilgili izin ve bakım listesi içinde yapılır. Denizde hayatta kalma davranışları için ABANDON_COMMON kartlarına bağlantı verilir; burada aynı uzun metin yeniden üretilmez.","en":"Lifeboat equipment under the LSA Code includes drinking water and rations, first-aid supplies, a sea anchor, navigation and signalling materials, dewatering equipment, lighting, and other craft-specific items. Training explains where each item is stowed and its purpose; identical quantities and arrangements are not assumed for every lifeboat. Packaging, expiry dates, and sealed service components are checked through the appropriate permissions and maintenance checklist. Survival-at-sea behaviour is linked to the ABANDON_COMMON cards rather than reproducing the same long text here."}]},{"id":"LB-C10","family":"lifeboat","title_tr":"Suya indirme ile su üzerinde manevra ayrımı","title_en":"Difference between launch and manoeuvring afloat","paragraphs":[{"tr":"Filikanın denize indirilmesi, filikanın güvenli şekilde suya ulaştırılması sürecidir; manevra ettirilmesi ise görevli ekibin filika motorunu ve yönlendirme sistemini kullanarak su üzerinde hareket etmesidir. Bu iki eylem raporda ayrı gösterilir. İndirme sırasında askı/teçhizat kaynaklı tehlikeler baskınken manevrada pervane, başka deniz araçları, ana gemi ile çarpışma, dalga ve düşük görüş öne çıkar. Gemi tarafından sürekli gözetim, kontrol edilmiş haberleşme ve alternatif kurtarma imkânı risk planının parçasıdır. Fiilî manevra yapılmamışsa yalnızca “manevra usulü anlatıldı” yazılır.","en":"Launching a lifeboat means bringing it safely into the water; manoeuvring means moving it on the water using the assigned crew, engine, and steering arrangement. The record treats these as separate activities. During launching, hazards associated with falls and appliances predominate; during manoeuvring, the propeller, other craft, collision with the parent vessel, waves, and reduced visibility become prominent. Continuous monitoring from the ship, verified communications, and alternative rescue arrangements form part of the risk plan. If no actual manoeuvring occurred, the record states only that “manoeuvring procedures were explained”."}]},{"id":"LB-C11","family":"lifeboat","title_tr":"Gemi seyir hâlindeyken filika talimi","title_en":"Lifeboat drills while the ship is underway","paragraphs":[{"tr":"SOLAS III/19.3.4.7, seyir hâlindeki gemiden yapılan indirme talimlerine ilave kısıt getirir; işlem, tehlikeler nedeniyle yalnızca korunaklı sularda ve bu tür talimlerde deneyimli bir zabitin gözetimi altında uygulanır. Bu ifade, her korunaklı suda faaliyetin emniyetli olduğu anlamına gelmez. Kaptan, geminin ileri hareketi, pervane/itici etkileri, akıntı, manevra alanı ve botun dönüş yolunu somut risk olarak değerlendirmelidir. Güvenli uygulama koşulları yoksa talimin gösterim/eğitim bölümü yapılır; yapılmayan fiziki unsur ve neden kayıt altına alınır.","en":"SOLAS III/19.3.4.7 imposes additional restrictions on launching drills conducted from a ship making headway: because of the hazards involved, they are carried out only in sheltered waters and under the supervision of an officer experienced in such drills. This does not mean that every sheltered-water location is safe for the operation. The master must assess headway, propeller and thruster effects, currents, manoeuvring space, and the craft's return route as specific risks. If safe conditions cannot be met, the demonstration or instructional portion is carried out and the omitted physical activity and reason are recorded."}]},{"id":"LB-C12","family":"lifeboat","title_tr":"Serbest düşüşlü filika: eğitim ve simülasyon","title_en":"Free-fall lifeboats: training and simulated launch","paragraphs":[{"tr":"Serbest düşüşlü filikada oturma, emniyet kemeri, çıkış/giriş ve serbest düşüş ivmeleri özel eğitim konularıdır. Simüle indirme, gerçek serbest bırakma eylemiyle aynı şey değildir. SOLAS III/19.3.4.4, serbest düşüşlü filika için üç aylık ve altı aylık farklı eğitim/demonstrasyon gereklerini düzenler; bu süreçlerde alternatif indirme ve simülasyon imkânları ayrı ele alınır. MSC.1/Circ.1578/Rev.1, simülasyonun yalnızca uygun tasarlanmış ve üretici prosedürü bulunan sistemde uygulanmasına ilişkin güvenlik çerçevesi sunar. Filikanın veya indirme tertibatının tipine özgü serbest bırakma mekanizması eğitim amacıyla keyfî hareket ettirilmez. 2026 tarihli yeni teknik tasarım değişikliklerinin gemiye hangi tarihten itibaren uygulanacağını gemi belgelendirmesi belirler.","en":"Seating, safety harnesses, entry and exit, and the accelerations associated with free-fall launching are specialised training subjects. Simulated launching is not the same as actual release. SOLAS III/19.3.4.4 addresses distinct three-monthly and six-monthly training or demonstration requirements for free-fall lifeboats; alternative launching and simulation arrangements are considered separately within those processes. MSC.1/Circ.1578/Rev.1 provides a safety framework under which simulation is used only with suitably designed arrangements and a manufacturer's procedure. Release mechanisms specific to the lifeboat or launching appliance are not operated arbitrarily for training. The vessel's certification determines when new technical design requirements dated 2026 become applicable to that vessel."}]},{"id":"LB-C13","family":"lifeboat","title_tr":"Geri alma ve filikanın tekrar hazır duruma getirilmesi","title_en":"Recovery and restoration of lifeboat readiness","paragraphs":[{"tr":"Filikanın ana gemiye dönüşü, bağlama, kaldırma ve istif işlemi; indirme kadar risklidir. Bota yaklaşım, askı noktalarının eşleştirilmesi, kanca durumlarının kontrolü, tel ve vinç güzergâhı ve personelin kaldırma sırasında nerede bulunduğu üretici işletme talimatına göre planlanır. Filika su üzerinden geri alındığında operasyon bitmiş sayılmaz; istif emniyeti, enerji/fren durumu, yakıt/akü ve su alma kontrolleri, gerektiğinde malzeme ikmali ve imza/kayıt kapanışı ayrıca değerlendirilir. Kusur bulunursa arıza/onarım kayıt sistemi devreye girer; filikanın hazır olup olmadığı gemi yönetimi tarafından ayrıca teyit edilir.","en":"Returning the lifeboat to the parent ship, connecting it, hoisting it, and stowing it can be as hazardous as launching it. Approach to the craft, alignment of suspension points, hook-condition checks, fall and winch routes, and personnel positions during lifting are planned in accordance with the manufacturer's operating instructions. Recovery from the water does not, by itself, complete the operation: safe stowage, power and brake condition, fuel and battery status, water-ingress checks, replenishment where necessary, and closure of signatures and records are assessed separately. If a defect is found, the defect and repair recording system is used; ship management separately confirms the craft's readiness."}]},{"id":"LB-C14","family":"lifeboat","title_tr":"Bakım, muayene, operasyonel test ve yetki","title_en":"Maintenance, examinations, operational tests and authorization","paragraphs":[{"tr":"Talim, personelin bilginin ve donanım kullanımının eğitimidir. Bakım ve yetkili servis operasyonel testi, MSC.402(96) kapsamındaki teknik süreçtir. Filika kancası, vinç freni, bırakma tertibatı ve kritik onarımların yetkili personelce yapılması gerekir; her rutin kontrolün mutlaka dış servis gerektirdiği de söylenemez. Eğitimde haftalık/aylık rutin kontroller, yıllık ayrıntılı muayene ve gerektiğinde daha kapsamlı bakım arasındaki amaç ve kayıt farkları anlatılır. Geçerli servis belgelerinin varlığı, personelin talimden önce görünür kusurları değerlendirme sorumluluğunu ortadan kaldırmaz.","en":"A drill trains personnel in knowledge and use of equipment. Maintenance and operational testing by an authorised service provider form a separate technical process under MSC.402(96). Lifeboat hooks, winch brakes, release gear, and critical repairs must be attended to by authorised personnel; this does not mean that every routine check necessarily requires an external service provider. Training explains the different purposes and records of weekly/monthly routine checks, annual thorough examinations, and more extensive maintenance where required. The existence of valid service certificates does not remove the crew's responsibility to assess visible defects before a drill."}]},{"id":"LB-C15","family":"lifeboat","title_tr":"Talim sırasında gerçek acil durum oluşması","title_en":"An actual emergency occurring during a drill","paragraphs":[{"tr":"Fizikî indirme sırasında tel, kanca, fren, motor, personel veya haberleşme arızası gelişirse öncelik talim hedefi değil insan hayatıdır. Eğitimde durdurma işaretinin herkes tarafından bilinmesi, indirme ve geri alma rollerinin çakışmaması, filika personelinin ana gemiyle temasını sürdürebilmesi ve ikincil kurtarma imkânının hazır tutulması vurgulanır. Tehlike meydana gelirse olayla ilişkili kontrol listeleri ve uygunsa gerçek acil durum yönetim prosedürü uygulanır; bunun kendisi sıradan talim kaydıyla geçiştirilmez. Elektrik kesintisi veya beklenmeyen gemi hareketinin matafora ve güverte üzerindeki etkileri ayrıca örneklenir.","en":"If a fall, hook, brake, engine, personnel, or communications problem develops during physical launching, human life takes priority over the drill objective. Training emphasises that everyone must know the stop signal, that launching and recovery duties must not conflict, that lifeboat personnel must remain in contact with the parent ship, and that secondary rescue capability must be available. If a dangerous event occurs, the associated checklists and, where appropriate, actual emergency response procedures are used; it is not treated as an ordinary drill record. The effects of power failure or unexpected vessel movement on davits and deck operations are also considered through examples."}]},{"id":"LB-C16","family":"lifeboat","title_tr":"Belgelendirme, öğrenme çıktısı ve rapor doğruluğu","title_en":"Documentation, learning outcomes and report accuracy","paragraphs":[{"tr":"Bir filika taliminden öğrenilmesi gerekenler; personelin görevini, filikanın indirme tipini, kumanda yetkisini, tehlike alanlarını, durdurma kriterini, haberleşme düzenini ve kusur bildirim yolunu açıklayabilmesidir. Performans değerlendirmesi, “filika indirildi” ifadesinden çok ne yapıldığı, hangi safhaya kadar gidildiği, hangi riskin nasıl yönetildiği ve donanımın hangi durumda bırakıldığı bilgisine dayanır. Yalnızca sözlü eğitim yapıldıysa suya indirme veya manevra yapıldığı yazılmaz. İşlem ertelendiyse gerekçe, kısmi tamamlanan bölüm ve tekrar planlaması somut kaydedilir. Gemiye özgü bilgiler, kamu HTML'ye değil kontrollü resmî kayıt sistemine girilir.","en":"Learning outcomes from a lifeboat drill include the ability to explain individual duties, the launching type, control authority, danger zones, stop criteria, communications arrangements, and how defects are reported. Performance assessment depends less on simply saying “the lifeboat was launched” than on what was actually done, how far the activity progressed, which risks were controlled and how, and the condition in which the equipment was left. Where only verbal training occurred, launching or manoeuvring must not be recorded as completed. If an activity was deferred, its reason, the part completed, and the rescheduling plan are documented specifically. Vessel-specific information is entered in the controlled official record system, not in the public HTML."}]},{"id":"PORT-C01","family":"departure","title_tr":"Acil görev ihbarının alınması ve doğrulanması","title_en":"Receipt and verification of an emergency tasking","paragraphs":[{"tr":"Bir acil görev çağrısında ilk sorular kim bildiriyor, olay ne, nerede, ne zaman, yardım türü ve önceliği nedir sorularıdır. Bildirimin kaynağı, zaman damgası, görev talimatı, iletişim kanalı, belirsizlikler ve karşılıklı teyit gereksinimi belirlenir. Olay yeri koordinatı belirsizse uydurulmaz; teyit veya tahmini konum olduğu açıkça belirtilir. Gemi kaptanına iletilen ilk bilgiler ile sonradan gelen güncellemeler birbirinden ayrılır. Deniz hizmetleri kapsamında görev hazırlığı, dış makamın operasyon talebine ve geminin emniyetli sevk kabiliyetine göre değerlendirilir.","en":"When an emergency tasking call is received, the initial questions are: who is reporting, what happened, where and when, and what type and priority of assistance are requested? Identify the origin of the report, timestamp, tasking instructions, communications channel, uncertainties, and need for read-back or mutual confirmation. If the incident coordinates are uncertain, do not invent a position; distinguish a verified position from an estimated one. Separate information initially passed to the master from subsequent updates. Readiness for a maritime-service assignment is assessed against the requesting authority's operational requirements and the vessel's ability to proceed safely."},{"tr":"Eğitimde sorulur: Çağrının gerçek mi, tatbikat mı olduğu nasıl teyit edilir? Mevki bilgisinin datum/formatı anlaşıldı mı? Dış çağrıya verilen yanıt yetkili kişi tarafından onaylandı mı?","en":"Training questions: How is a genuine call distinguished from an exercise? Have the datum and format of the reported position been understood? Has an authorised person approved the response given to the external caller?"}]},{"id":"PORT-C02","family":"departure","title_tr":"Kaptanın emniyet kararı ve görev devri","title_en":"Master’s safety decision and handover of command","paragraphs":[{"tr":"Kaptan, gelen çağrının önemini, deniz ve hava durumunu, geminin sevk/seyir hazırlığını, gemide bulunan kişileri, kıyı bağlantılarını, liman hareket kısıtlarını ve varsa başka görevleri birlikte değerlendirir. Görevin aciliyeti, emniyet kontrollerini yok saymak için gerekçe oluşturmaz. Köprüüstü, güverte/baş-kıç postaları ve makine kontrol ekibine hangi hazırlığın ne zaman yapılacağı bildirilir. Yetki ve karar açık tutulur; personelin varsayımla halat çözmeye başlaması önlenir.","en":"The master assesses the urgency of the request together with weather and sea conditions, the vessel's propulsion and navigational readiness, people on board, shore connections, restrictions on port movements, and other current tasks. Urgency does not justify omitting safety checks. The bridge, deck teams at the forward and aft stations, and engine-control team are told what preparation is required and when. Decision-making authority is made explicit so that personnel do not begin releasing mooring lines on their own assumptions."},{"tr":"Eğitimde sorulur: Gemi kendiliğinden seyre çıkamıyorsa görev makamına hangi bilgi bildirilir? Talimde kaptan kararı masa başında sınanabilir mi?","en":"Training questions: If the vessel cannot sail under its own power, what information must be given to the tasking authority? Can the master's decision process be exercised through a tabletop drill?"}]},{"id":"PORT-C03","family":"departure","title_tr":"Personel toplanması, görev dağılımı ve emniyetli erişim","title_en":"Muster, duty assignment and safe access","paragraphs":[{"tr":"Gemi personeline talimin niteliğine uygun duyuru yapılır. Görevli personel köprüüstü, makine, baş/kıç halat yerleri ve gerektiğinde yardım/operasyon ekiplerine dağılır. Yoklama, görev ehliyeti, limandaki izinli personelin durumu, gemideki ziyaretçiler ve kara personeli dikkate alınır. İleri güverte ve kıç palamar bölgelerine giden güvenli güzergâhlar, aydınlatma ve uygun kişisel koruyucu donanım gözden geçirilir. Gereksiz personel palamar sahasına alınmaz.","en":"Personnel are notified in a manner appropriate to the exercise. Assigned personnel proceed to the bridge, engine room, forward and aft mooring stations, and, where appropriate, support or operational teams. The muster considers competency for assigned duties, crew members on shore leave, visitors on board, and shore personnel. Safe access routes to the foredeck and after mooring stations, lighting, and suitable personal protective equipment are reviewed. Unnecessary personnel are excluded from mooring areas."},{"tr":"Eğitimde sorulur: Son kişinin gemiye döndüğü teyit edilmeden hareket ne gibi riskler doğurur? İskeledeki personeli son anda geri çağırmak nasıl yönetilir?","en":"Training questions: What hazards arise if the vessel moves before the last crew member's return has been confirmed? How should the last-minute recall of personnel from the quay be managed?"}]},{"id":"PORT-C04","family":"departure","title_tr":"Köprüüstü kalkış öncesi hazırlığı","title_en":"Bridge preparations before departure","paragraphs":[{"tr":"Seyir planı, çıkış rotası, derinlik ve su çekimi, liman trafik düzeni, güncel meteoroloji, gelgit/akıntı, mevcut dâhilî/haricî haberleşme, radar/AIS/GNSS/ECDIS veya mevcut seyir araçları gözden geçirilir. Kritik cihazların doğru çalıştığı varsayılmaz; gerçek kontroller gemide geçerli usulle yapılır. Rıhtımdan güvenli açıklığa çıkış ve gerekirse bekleme mevkii ayrıca planlanır. Kısa mesafeli acil görevde dahi navigasyon emniyetinin sorumluluğu devam eder.","en":"Review the passage plan, departure route, charted depth and vessel draught, port traffic arrangements, latest weather, tidal and current information, internal and external communications, and available navigation equipment, including radar, AIS, GNSS, and ECDIS where fitted. The functioning of critical equipment must not be assumed; actual checks follow the vessel's applicable procedures. Plan the safe route clear of the berth and, if necessary, a waiting position. Responsibility for navigational safety continues even during a short emergency-response voyage."},{"tr":"Eğitimde sorulur: Çıkış güzergâhında kıyı tesisi, denizaltı kablosu, sığlık, römorkör veya diğer gemiler bulunuyor mu? Trafik birimine bilgi ne zaman verilir?","en":"Training questions: Are there port facilities, submarine cables, shoals, tugs, or other vessels along the departure route? At what point must the traffic service be notified?"}]},{"id":"PORT-C05","family":"departure","title_tr":"Makine, sevk ve dümen hazır olma kavramı","title_en":"Readiness of machinery, propulsion and steering","paragraphs":[{"tr":"Makineye kalkış hazırlık emri ve bu emrin teyidi sağlanır. Ana sevk, yardımcı jeneratörler, hidrolik sistemler, dümen, manevra alarmları ve kritik yardımcılar geminin geçerli işletme prosedürüyle değerlendirilir. Motorun çalıştırılmış olması ile manevraya tam hazır olduğu bilgisi aynı değildir. Makineden köprüüstüne kesin hazır bildirimi alınmadan pervaneye kuvvet verilmesi gibi işlemler planlanmaz. Liman bağlama durumu, halat yakınlığı, personel ve çevredeki deniz araçları dikkate alınır.","en":"An order to prepare the machinery for departure is issued and acknowledged. Main propulsion, auxiliary generators, hydraulic systems, steering, manoeuvring alarms, and critical auxiliaries are assessed under the vessel's current operating procedures. An engine that has been started is not necessarily ready for manoeuvring. No propulsive movement is planned before the engine department has explicitly confirmed readiness to the bridge. Berthing conditions, nearby ropes, personnel, and other craft must also be considered."},{"tr":"Eğitimde sorulur: Makine hazır değilse geminin rıhtımda kalması mı, römorkör yardımı mı, başka tedbir mi değerlendirilir?","en":"Training question: If the machinery is not ready, should the vessel remain alongside, request tug assistance, or consider other safeguards?"}]},{"id":"PORT-C06","family":"departure","title_tr":"Güverte ve bağlama sahalarının ilk emniyet kontrolü","title_en":"Initial safety checks of deck and mooring areas","paragraphs":[{"tr":"Baş-kıç palamar ekipleri çalışma sahasını inceler: halatların konumu ve gerilmesi, loçalar, babalar, ırgat, fren, stopper, donanım hasarı, ıslak/kaygan güverte ve kayma/düşme tehlikesi. Personel halat kasalarının, gergin hatların ve olası geri tepme alanlarının dışında güvenli çalışma yerleri seçer. Her istasyonun sorumlu zabiti açık komut ve teyit zincirini kurar. Güverte düzeni doğrulanmadan halat çözme veya ırgat çalıştırma fiilen başlatılmaz.","en":"Forward and aft mooring teams inspect their work areas: line positions and tensions, fairleads, bollards, windlasses or winches, brakes, stoppers, equipment damage, slippery or wet decks, and slip or fall hazards. Personnel choose safe working positions away from bights of rope, tensioned lines, and foreseeable snap-back zones. The responsible officer at each station establishes a clear command-and-acknowledgment sequence. Actual letting-go or winch operations do not commence until the deck arrangement has been confirmed safe."},{"tr":"Eğitimde sorulur: Ani halat kopmasında emniyet alanı yalnız boyalı bir bölgeden mi ibarettir? Gergin hatlara yakın durulabilir mi? [U3–U5]","en":"Training questions: Is the hazardous area from a broken mooring line confined to a painted zone? Is it safe to stand near a line under tension? [U3–U5]"}]},{"id":"PORT-C07","family":"departure","title_tr":"Avara manevrasında halat türleri ve sıra kararı","title_en":"Mooring-line types and sequencing of letting go","paragraphs":[{"tr":"Baş halatı, kıç halatı, baş ve kıç springlerin gemiyi farklı doğrultularda tuttuğu öğretilir. Hangi halatın önce alınacağı sabit bir bütün gemiler sırası değildir: rüzgâr, akıntı, geminin sevk özellikleri, rıhtım yerleşimi, römorkör yardımı ve kaptanın manevra planı belirleyicidir. Halat alma sırasında kılavuz ipi, çekme kuvveti, gemiye alma ve pervaneden uzak tutma konuları açıklanır. Köprüüstü emirleri geri okunur; halat tamamen emniyete alınmadan ilgili pervane/iter kullanımı değerlendirilir.","en":"Explain how head lines, stern lines, and forward and aft springs restrain the vessel in different directions. There is no universally applicable order in which to let go lines: wind, current, propulsion characteristics, berth configuration, tug assistance, and the master's manoeuvring plan determine the sequence. During line handling, messenger lines, pulling forces, taking lines aboard, and keeping ropes clear of propellers are addressed. Bridge instructions are read back; use of a propeller or thruster is considered in relation to whether the relevant lines have been fully secured."},{"tr":"Eğitimde sorulur: Bir springi almak geminin hangi eksende hareketini serbest bırakır? Halat pervane civarına düşerse ilk güvenli karar nedir?","en":"Training questions: Which component of the vessel's movement is released when a spring is let go? What is the first safe decision if a mooring line falls near a propeller?"}]},{"id":"PORT-C08","family":"departure","title_tr":"Geminin kara ile fiziksel bağlantıları","title_en":"Physical ship-to-shore connections","paragraphs":[{"tr":"Geminin bağlı olabileceği gangway, yürüme köprüsü, elektrik beslemesi, veri/telefon, yakıt/su/atık hortumları, yükleme kolu ve geçici iş bağlantıları tehlike oluşturabilir. Söz konusu bağlantıların hangilerinin gerçekten mevcut olduğu belirlenir. Operasyon kesilir, basınç/enerji kontrolü ve izolasyon yetkili kişilerce onaylı yöntemle yapılır, kıyı ekibiyle çift taraflı teyit alınır. Acil ayrılış senaryosunda bağlantının koparılmasının çevresel, yangın ve yaralanma sonuçları da değerlendirilir.","en":"A vessel may be connected to shore by a gangway or accommodation ladder, electrical shore supply, data or telephone cables, fuel, water or waste hoses, loading arms, or temporary work connections. Determine which connections are actually present. Suspend the relevant operation; authorised persons control pressure and energy and isolate the connections using approved methods, with two-way confirmation from the shore team. During an emergency departure, also assess the pollution, fire, and injury consequences of a connection being torn away."},{"tr":"Eğitimde sorulur: Sadece makine hazır oldu diye hortum sökülmüş sayılır mı? Shore power mevcutken fiş ve kabloya kimin müdahale yetkisi vardır?","en":"Training questions: Does machinery readiness mean that a hose has been disconnected? Who is authorised to handle a shore-power plug and cable while the connection is energised?"}]},{"id":"PORT-C09","family":"departure","title_tr":"Kıyı tesisi, liman başkanlığı, VTS, kılavuz ve römorkör ilişkisi","title_en":"Coordination with terminal, harbour authority, VTS, pilot and tugs","paragraphs":[{"tr":"Manevranın sorumluluk zinciri gemi kaptanı, terminal/liman tesisi, kılavuzluk teşkilatı ve ilgili trafik/liman makamları arasında olayın koşullarına göre kurulur. VTS kapsamı ve kılavuz/römorkör alma yükümlülüğü her limanda, gemide veya manevrada aynı değildir. Acil göreve çıkış, olağan bir görev emri olsa da önceden planlı seyir adımlarının hızlandırılmış biçimde yürütülmesini gerektirebilir. Kıyı tesisi tehdidinden uzaklaşmada ise can emniyetiyle birlikte sahildeki yangın/tesis müdahale ekipleriyle ortak karar alınır.","en":"The chain of operational responsibility is established, as applicable, between the master, terminal or port facility, pilotage organisation, and relevant traffic or port authorities. VTS coverage and requirements for pilots or tugs are not identical for every port, vessel, or manoeuvre. Emergency tasking may require the usual pre-departure stages to be completed on an accelerated basis. When departing to escape a threat from a shore facility, preservation of life is considered together with coordination with the shore fire and emergency-response teams."},{"tr":"Eğitimde sorulur: Gemi ayrılmaya hazır, ancak iskeledeki yürüme köprüsü hâlâ bağlıysa kim durdurur? Kılavuzun gelmesi mümkün değilse kaptan hangi makamla görüşür? [U2]","en":"Training questions: If the vessel is otherwise ready but the gangway remains connected, who orders a stop? Which authority should the master consult if pilotage assistance is unavailable? [U2]"}]},{"id":"PORT-C10","family":"departure","title_tr":"Rıhtım tehlikesi, sınır değerlendirmesi ve alternatifler","title_en":"Quayside hazards, operational limits and alternatives","paragraphs":[{"tr":"Rıhtımdaki yangın, patlama riski, yakıt sızıntısı, komşu gemi hasarı, kopan bağlama hattı veya güvenlik tehdidinde kalmak, yer değiştirmek, römorkör yardımı istemek ve ayrılmak seçenekleri karşılaştırılır. Duman/alev yayılımı, rüzgâr yönü, patlama etki alanı, geminin bağlama düzeni ve liman trafiği birlikte ele alınır. Bazı olaylarda geminin acilen uzaklaşması emniyetlidir; bazılarında bağlantılar veya yetersiz manevra alanı nedeniyle kontrolsüz ayrılma daha büyük tehlike yaratabilir.","en":"When a berth is threatened by fire, explosion, fuel leakage, damage to a neighbouring vessel, a parted mooring line, or a security incident, compare the options of remaining alongside, shifting berth, requesting tug assistance, or departing. Assess smoke and flame spread, wind direction, potential blast effects, mooring configuration, and port traffic together. In some situations immediate departure is the safer option; in others, shore connections or inadequate manoeuvring room can make an uncontrolled departure more hazardous."},{"tr":"Eğitimde sorulur: Rıhtım yangınının kıyıda mı yoksa geminin bir bölümünde mi olduğu, karar sürecini nasıl değiştirir?","en":"Training question: How does the decision process change depending on whether a berth fire is on the shore facility or on board the vessel?"}]},{"id":"PORT-C11","family":"departure","title_tr":"Römorkör yardımı ve acil çekme tertibatı","title_en":"Tug assistance and emergency towing arrangements","paragraphs":[{"tr":"Çekme yardımının gerekip gerekmediği geminin sevk kabiliyeti, rıhtım tehlikesi ve liman manevra koşullarıyla değerlendirilir. Acil çekme teli, kıç/baş tertibatı ve emergency towing-off pennant/fire wire terimleri özellikle tanker–terminal işletme belgelerinde görülebilir; her gemide aynı şekilde donatılması şartı yoktur. Kullanılacak çekme halatı, bağlantı noktası, personel yeri, yük ve kopma riski gemi/terminalin onaylı talimatı ve uygun ekipmanla belirlenir. Halata güç bindirilmesi, belirlenmemiş eğitim varsayımıyla fiilen uygulanmaz.","en":"The need for towing assistance depends on the vessel's propulsive capability, the threat at the berth, and port manoeuvring conditions. Emergency towing wires, forward or aft arrangements, and terms such as emergency towing-off pennant or fire wire may appear in tanker and terminal operating guidance; not every vessel is required to carry identical arrangements. Selection of the towline, attachment point, personnel positions, expected loading, and risk of line failure follows approved vessel or terminal procedures and equipment suitability. No pulling load is applied merely to fulfil an unspecified training assumption."},{"tr":"Eğitimde sorulur: İskeleden uzaklaşma için çekme yardımı gerekiyorsa hangi hazırlıklar liman tesisine aittir? [U3–U5]","en":"Training question: If tug assistance is necessary to clear the berth, which preparations are the responsibility of the port facility? [U3–U5]"}]},{"id":"PORT-C12","family":"departure","title_tr":"Stabilite, draft, trim, meyil ve serbestboard farkları","title_en":"Stability, draught, trim, list and freeboard: distinctions","paragraphs":[{"tr":"Acil kalkışta mevcut draftlar, trim ve meyil; geminin yük/ballast durumu ve rıhtımın asgari su derinliğiyle birlikte değerlendirilir. Tanker için hazırlanmış bir formdaki her tank ve yük alanı kurumun bütün gemilerinde mevcut olmayabilir. Stabiliteyi “normal” olarak işaretlemek için somut veri gerekir; kesinlik sağlanamıyorsa belirsizlik kaptana rapor edilir. Özel yük/operasyon durumunda geçerli stabilite kitabı ve yükleme sınırları esas alınır.","en":"For an emergency departure, existing draughts, trim, and list are assessed alongside the loading or ballast condition and minimum available water depth at the berth. Fields for tanks and cargo in a form designed for tankers may not apply to every vessel in the organisation. A stability condition should not be marked 'normal' without supporting data; unresolved uncertainty is reported to the master. The approved stability booklet and loading limits govern any special loading or operational condition."},{"tr":"Eğitimde sorulur: Denizde bir kirlilik müdahalesine gidecek geminin ilave ekipman alması draft veya meyli etkileyebilir mi?","en":"Training question: Could taking extra response equipment aboard before proceeding to a pollution incident affect the vessel's draught or list?"}]},{"id":"PORT-C13","family":"departure","title_tr":"Haberleşme: gerçek, eğitim ve acil durum ayrımı","title_en":"Communications for real operations, exercises and emergencies","paragraphs":[{"tr":"Gemi içi anons, köprüüstü–makine, baş–kıç postaları, kıyı tesisi ve dış koordinatör arasında kim, hangi kanalda, ne için konuşacağı belirlenir. Talim konuşmasında tatbikat niteliği açıkça belirtilir. Gerçek tehlike çağrısı veya port/VTS talimatı, eğitim amacıyla gerçekte gönderilmiş gibi gösterilmez. Kaptan kararının, kıyı bağlantılarının ve en son serbest halatın durumunun geri okunarak doğrulanması koordinasyonu destekler.","en":"Establish who communicates, through which channel, and for what purpose among the ship's public-address system, bridge and engine room, forward and aft stations, port facility, and external coordinator. Exercise messages must be clearly identified as such. A genuine distress call or instruction from a port or VTS authority must not be represented as having been sent or received for training when it was not. Read-back and verification of the master's decision, shore connections, and the last line let go support coordination."},{"tr":"Eğitimde sorulur: Telsiz rölesi kesilirse hangi yedek iletişim yöntemi uygulanır? [U1–U2]","en":"Training question: What backup communications method is available if the radio relay or internal link fails? [U1–U2]"}]},{"id":"PORT-C14","family":"departure","title_tr":"Talim emniyeti, uygulanabilir gerçek hareket ve durdurma","title_en":"Drill safety, permissible real movements and stop criteria","paragraphs":[{"tr":"Emniyetli talimde gerçek mahallere gidilmesi, personel yoklaması, iç haberleşme ve ekipmanların görsel incelenmesi yapılabilir; motor çalıştırma, pervane, ırgat ve halat işlemlerinin fiilî testi ise özel izin, risk değerlendirmesi, personel yeterliliği ve koşul uygunluğuna bağlıdır. Dar rıhtımda küçük bir hatalı hareketin çarpma, ezilme veya denize düşme riski oluşturduğu personelce anlaşılır. Plansız hareket, belirsiz komut, iletişim kopması, ilgisiz kişilerin sahada bulunması, bağlı hortum veya emniyetsiz halat durumunda faaliyet durdurulur.","en":"A safe drill may involve visiting actual stations, mustering personnel, internal communications, and visual equipment inspections. Actual engine starting, propeller use, winch operation, and line handling, however, require specific authorisation, risk assessment, competent personnel, and suitable conditions. Personnel are taught how even a small unintended movement at a confined berth can cause collision, crushing injuries, or a person falling overboard. Stop the activity if movements are unplanned, commands are unclear, communication is lost, unauthorised people enter the area, a hose remains connected, or a mooring line becomes unsafe."},{"tr":"Eğitimde sorulur: Kurgusal olay talimi, gerçek liman çıkışına dönüştürülmeden nasıl eksiksiz öğretilebilir?","en":"Training question: How can an emergency-departure scenario be taught comprehensively without converting the exercise into an actual port departure?"}]},{"id":"PORT-C15","family":"departure","title_tr":"Talim sonrası geri dönüş, ekipman ve tekrar hazır duruma alma","title_en":"Post-drill restoration, equipment readiness and reinstatement","paragraphs":[{"tr":"Sanal görev veya iskele tehdidi senaryosu sonuçlandırılır. Telsiz/komuta zincirinin kapanması, personelin görev yerlerinden emniyetli ayrılması, halatların gerçek durumda emniyeti ve ekipmanların önceki çalışma durumuna dönmesi değerlendirilir. Fiilen motor veya ırgat çalıştırıldıysa anormallikler ve bakım gereksinimi kaydedilir. Bir eksiklik belirlenmesi, talimin başarısızlığına ilişkin öğrenme verisi olarak açıkça rapor edilir; kaydı güzelleştirmek için gizlenmez.","en":"Conclude the simulated tasking or berth-threat scenario. Confirm that communications and command arrangements have been stood down, personnel have left their stations safely, mooring lines are secure in their actual configuration, and equipment has been returned to its prior operational condition. Where engines or winches were actually operated, record abnormalities and maintenance needs. Any deficiency is reported openly as a learning outcome rather than concealed to make the drill record appear favourable."},{"tr":"Eğitimde sorulur: Talim sonunda köprüüstü–makine hazırlık emrinin sonlandırıldığı kim tarafından teyit edilir?","en":"Training question: Who confirms to the bridge and engine room that the preparation-for-departure order has been cancelled after the drill?"}]},{"id":"PORT-C16","family":"departure","title_tr":"Görev ve olay raporunda izlenebilirlik","title_en":"Traceability in tasking and incident reports","paragraphs":[{"tr":"Talim için planlanan tarih, gerçek tarih, rol/yoklama, olay senaryosu, iletişim yöntemi, emniyet tedbirleri, fiilen gösterilen işlemler, yalnızca simüle edilenler, eksikler ve düzeltici faaliyetler ayrı değerlendirilir. Gerçek avara yapılmışsa yeri, saati, liman ve personel bilgileri; yapılmamışsa neden ve simülasyon yöntemi açık yazılır. EK-V talim özeti, güverte ve makine jurnalleri, gerekiyorsa ilgili özel kontrol listesi ve bakım/risk belgeleri tek olayın farklı işlevli kayıtlarıdır.","en":"For a drill, distinguish the planned and actual dates, muster and role assignments, incident scenario, communication methods, safety measures, activities physically demonstrated, activities simulated only, deficiencies, and corrective actions. If the vessel actually let go and departed, record the place, time, port, and personnel details; if it did not, record the reason and the simulation method. The EK-V drill summary, deck and engine logbooks, relevant specific checklists, and maintenance or risk records document different aspects of one event and are not interchangeable."},{"tr":"Eğitimde sorulur: “Acil kalkış yapıldı” ifadesi hangi fiilî işlemleri kanıtlar, hangilerini kanıtlamaz? Plan ve icra nasıl ayrılır?","en":"Training questions: What actual actions does the statement 'an emergency departure was carried out' establish, and what does it fail to establish? How are the plan and execution distinguished?"}]},{"id":"ORT-01","family":"power","title_tr":"Elektrik sisteminin işlevsel katmanları","title_en":"Functional layers of the electrical power system","paragraphs":[{"tr":"Ana elektrik üretimi, ana pano/baralar, dağıtım panoları, acil dağıtım panosu, acil jeneratör ve UPS/akü gibi geçiş kaynakları farklı işlevler görür. Ana güç kaybı olduğunda bütün elektrik tüketicileri aynı anda ve aynı süreyle beslenmeye devam etmez. Mürettebat, hangi devrelerin seyir emniyeti, haberleşme, yangın algılama, aydınlatma, dümen ve makine güvenliği için kritik olduğunu geminin elektrik tek hat şemasında tanır. Acil jeneratör, ana jeneratörle her durumda eşdeğer kapasite ve fonksiyonda değildir; gerçek yük listesi ve öncelikler ilgili belgede belirlenir.","en":"Main electrical generation, the main switchboard and busbars, distribution switchboards, the emergency switchboard, emergency generator, and transitional supplies such as UPS systems and batteries serve different functions. Following loss of main power, not all consumers remain supplied simultaneously or for the same duration. Crew members identify the circuits essential to navigation, communication, fire detection, lighting, steering, and machinery safety using the vessel's electrical single-line diagram. The emergency generator is not necessarily equivalent in capacity or purpose to a main generator; the actual essential-load schedule and priorities are set out in the relevant ship documentation."}]},{"id":"ORT-02","family":"power","title_tr":"Blackout, kısmi güç kaybı, sevk kaybı, dead ship","title_en":"Blackout, partial power loss, loss of propulsion and dead-ship condition","paragraphs":[{"tr":"Kısmi kayıp, yalnızca bazı baraların veya tüketici gruplarının enerjisiz kalmasıdır. Blackout, işletme ve alarm sistemlerinin tanımına göre ana beslemenin kaybedilmesiyle ortaya çıkan olay olarak incelenir. Sevk kaybı ise ana makine, dişli kutusu, CPP, tahrik motoru veya kritik bir yardımcı kaynaklı olabilir; elektrik tamamen mevcutken de gerçekleşebilir. SOLAS II-1/42–43 birleşik yorumundaki dead ship özel bir teknik koşuldur. Eğitimde bu sınıfların göstergeleri ayrı ayrı sorgulanır; tek bir “makine arızası” başlığına indirgenmez.","en":"A partial power failure affects only some busbars or groups of consumers. A blackout is examined as an event involving loss of main electrical supply, subject to the definitions used by the ship's operating and alarm systems. Loss of propulsion can instead arise from the main engine, gearbox, controllable-pitch propeller system, drive motor, or a critical auxiliary; it may occur while electrical power remains fully available. The 'dead ship' condition referred to in the unified interpretations of SOLAS II-1/42–43 is a particular technical condition. Training examines the indicators for each situation separately rather than treating them all as one 'engine failure'."}]},{"id":"ORT-03","family":"power","title_tr":"Acil güç ve kesintisiz güç kaynaklarının görevleri","title_en":"Roles of emergency and uninterrupted power supplies","paragraphs":[{"tr":"Acil güç kaynağı, ilgili düzenlemeler ve gemi tasarımına bağlı belirlenmiş emniyet yüklerini besler. UPS/aküler ise belirli cihazlar için kesinti sürekliliği veya güvenli kapanma sağlayabilir. Köprüüstü radarı, GPS/GNSS, cayro, ECDIS, dahili haberleşme, GMDSS ve dümen sistemlerinin bir bölümünün sürekliliği cihazın hangi besleme panosuna bağlı olduğuna bağlıdır. Eğitimde “UPS var, sistem çalışır” gibi kategorik varsayım yerine tek hat şeması ve donanım test kayıtları üzerinden besleme kaynağına bakılır.","en":"The emergency electrical source supplies designated safety services according to the applicable requirements and vessel design. UPS units and batteries may provide continuity or safe shutdown for particular equipment. Whether bridge radar, GPS/GNSS, gyrocompass, ECDIS, internal communications, GMDSS equipment, or parts of the steering system remain available depends on the distribution board supplying each device. Rather than assuming 'there is a UPS, therefore the system works', training identifies the source of supply from single-line diagrams and equipment test records."}]},{"id":"ORT-04","family":"power","title_tr":"Güç yönetim sistemi (PMS) ve yük atma","title_en":"Power management systems (PMS) and load shedding","paragraphs":[{"tr":"Bir güç yönetim sistemi mevcutsa jeneratörlerin devreye girme önceliklerini, ana bara konfigürasyonunu, yedek set seçimini ve aşırı yüklenmede önemsiz yükleri ayırma mantığını yönetebilir. Load shedding geçici olarak emniyet açısından daha az öncelikli tüketicileri ayırabilir. Elektriğin geri gelmesi, bütün motor ve pompaların kendiliğinden güvenli çalıştığını garanti etmez. Kritik yardımcılar tek tek durum teyidiyle ele alınır. Canlı PMS ayarları eğitim ekranında verilmez.","en":"Where a power-management system (PMS) is installed, it may manage generator start priorities, main-bus configuration, selection of standby sets, and the logic for disconnecting non-essential loads during overload. Load shedding may temporarily disconnect lower-priority consumers to protect critical services. Restoration of electricity does not guarantee that all motors and pumps have restarted safely. The status of each critical auxiliary is verified individually. The training interface does not provide live PMS settings."}]},{"id":"ORT-05","family":"power","title_tr":"Jeneratör, kesici ve senkronizasyon emniyeti","title_en":"Generator, circuit-breaker and synchronization safety","paragraphs":[{"tr":"Jeneratörün gerilim/frekans uygunluğu ve bir baraya bağlanma şartları, koruma röleleri, kesiciler ve üretici sistemiyle denetlenir. Yetkisiz elle paralelleme, kesici zorlaması, arızalı hatlara yeniden enerji verme veya korumaları devre dışı bırakma; ciddi ekipman hasarı, elektrik arkı ve can kaybı riskleri doğurabilir. Talimde elektrik uzmanının rolü, izinler ve haberleşme ele alınır; fiziksel manevra yalnızca yürürlükteki gemi prosedürüne göre uygulanır.","en":"Suitability of generator voltage and frequency and the conditions for connection to a busbar are controlled through protection relays, circuit breakers, and the manufacturer's system. Unauthorised manual paralleling, forcing a breaker, re-energising faulty circuits, or bypassing protection can cause severe equipment damage, arc-flash hazards, and fatalities. Training addresses the electrical specialist's role, authorisations, and communication; physical switching operations are performed only under the vessel's currently applicable procedures."}]},{"id":"ORT-06","family":"power","title_tr":"Emniyetli durdurma ve yeniden başlatma bağımlılıkları","title_en":"Safe shutdown and restart dependencies","paragraphs":[{"tr":"Sevk makinesinin yeniden çalıştırılabilmesi için yağlama, soğutma, yakıt, kumanda havası, marş sistemi, uygun elektrik beslemesi ve alarmların tatmin edici durumda olması gerekebilir. Bu yardımcıların her biri gemi tipine göre farklıdır; örneğin dizel-mekanik bir sevk sistemi ile dizel-elektrik tahrik sistemi aynı başlatma zincirini kullanmaz. Talim, “besleme geldi → ana makineyi çalıştır” kestirmesi yerine neden–önkoşul–izin–doğrulama mantığını öğretir.","en":"Restarting propulsion machinery may depend on satisfactory lubricating oil, cooling, fuel, control air, starting arrangements, electrical supply, and alarm conditions. These auxiliaries differ by vessel type: for example, diesel-mechanical propulsion and diesel-electric drive systems do not have the same starting sequence. Training teaches a sequence of cause, prerequisite, authorisation, and verification rather than the shortcut 'power is back, so start the main engine'."}]},{"id":"ORT-07","family":"power","title_tr":"Köprüüstü–makine haberleşmesi ve komuta","title_en":"Bridge–engine-room communications and command","paragraphs":[{"tr":"Kaptan seyir ve genel gemi emniyetini yönetir; başmühendis/makine amiri teknik teşhis, müdahale ve sistem emniyetini koordine eder. Köprüüstü ve makine kontrol mahalli arasında olayı tarif eden kısa, kesin mesajlar; arızanın başlangıç saati, sevk durumu, kullanılabilir manevra kabiliyeti, yeniden çalıştırma için tahmini hazırlık ve personel tehlikeleri bildirilir. Emir tekrar edilerek teyit edilir. Komuta değişimi ve alternatif dahili haberleşme yöntemleri ilgili organizasyona göre gösterilir.","en":"The master directs navigation and overall vessel safety; the chief engineer or responsible engineering officer coordinates technical diagnosis, intervention, and system safety. Short, precise messages exchanged between the bridge and engine-control location describe the event, including time of failure, propulsion status, available manoeuvring capability, estimated readiness for restart, and personnel hazards. Orders are repeated back for confirmation. Transfer of command and alternative internal communications are demonstrated according to the vessel's organisation."}]},{"id":"ORT-08","family":"power","title_tr":"Seyir emniyeti ve çevre koşulları","title_en":"Navigational safety and environmental conditions","paragraphs":[{"tr":"Mevki, sürat, akıntı, rüzgâr, sürüklenme, yakın trafik, sığlıklar, kara mesafesi, seyir yolu ve yaklaşan tehlikeler birlikte değerlendirilir. Makine kaybı, her koşulda derhal demir atmayı gerektirmez; su derinliği, demirleme alanı, manevra kabiliyeti ve trafik dikkate alınır. İlgili kural ve duruma göre kumanda altında olmayan gemi işaretleri, ses işaretleri ve uygun haberleşme değerlendirilebilir. Talimde gerçek telsiz tehlike yayını yapılmaz; dış haberleşme kurgusal olarak çalışılabilir.","en":"Position, speed, current, wind, drift, nearby traffic, shoals, distance from land, fairways, and approaching dangers are assessed together. Loss of propulsion does not in every circumstance require an immediate decision to anchor; depth, available anchorage, manoeuvring capability, and traffic must be considered. Depending on the applicable rules and actual circumstances, signals for a vessel not under command, sound signals, and appropriate communications may be evaluated. No genuine radio distress alert is transmitted for a drill; external communications can be rehearsed through a scenario."}]},{"id":"ORT-09","family":"power","title_tr":"Emniyet sistemlerinin bir arada etkilenmesi","title_en":"Concurrent effects on safety-critical systems","paragraphs":[{"tr":"Karartmada dümen, gyro, seyir fenerleri, genel anons, yangın pompaları, acil aydınlatma, makine alarmı, iticiler ve iletişim sistemleri farklı ölçülerde etkilenebilir. Ana makine arızası elektrik tesisatını doğrudan etkilemeyebilir ancak soğutma, yakıt, egzoz, manevra ve güç aktarma sistemleri tehlike oluşturabilir. Eğitimde birincil arızanın neden olduğu ikincil olaylar “kaskad arıza” olarak izlenir. İhtiyaç halinde Acil Dümen ve Yangın rehberlerine çapraz bağlantı yapılır.","en":"During a blackout, steering, gyrocompass, navigation lights, public address, fire pumps, emergency lighting, machinery alarms, thrusters, and communications may be affected to different extents. Main-engine failure need not directly affect the electrical installation, but cooling, fuel, exhaust, manoeuvring, and power-transmission systems may present hazards. Training tracks secondary events caused by the primary failure as 'cascading failures'. Cross-references to the Emergency Steering and Fire guides are used where appropriate."}]},{"id":"ORT-10","family":"power","title_tr":"Arıza teşhisi, bulgu ve yetki sınırı","title_en":"Fault diagnosis, evidence and limits of authority","paragraphs":[{"tr":"Alarm sırası, durum göstergeleri, otomasyon geçmişi, trend ekranları, jeneratör/ana makine logları ve personel gözlemleriyle teşhis yaklaşımı öğretilir. Bir alarmın sessize alınması ya da resetlenmesi, fiziksel arızanın giderildiği anlamına gelmez. Arıza nedeni netleşmeden tekrarlanan otomatik reset, korunma sistemlerinin zorlanması veya uzaktan kumanda yetkisinin belirsizliği değerlendirilir. Gereken işlemler yalnızca yetkili makine/elektrik personelince planlanır.","en":"Diagnostic training uses the alarm sequence, status indicators, automation history, trend displays, generator and main-engine logs, and personnel observations. Acknowledging, silencing, or resetting an alarm does not mean the physical defect has been rectified. Repeated automatic resets before the cause is understood, defeating protective systems, and ambiguity about remote-control authority are examined as hazards. Necessary action is planned only by authorised engineering or electrical personnel."}]},{"id":"ORT-11","family":"power","title_tr":"Geri kazanımın doğrulanması ve izleme","title_en":"Verification and monitoring of system restoration","paragraphs":[{"tr":"Güç veya sevk işlevi geri geldiğinde sıradaki soru, sistemin kararlı ve emniyetli çalıştığının nasıl teyit edileceğidir. Gerilim/frekans, yağlama-soğutma değerleri, alarm tekrarları, alternatör yükü, sevk yanıtı, kontrol modları ve yedekleme hazır durumu değerlendirilir. Köprüüstü/makine ortak teyidi olmadan “seyre dönüldü” raporu tamamlanmış sayılmaz. Talimde fiilen ölçülen değerlerle senaryo için varsayılan değerler karıştırılmaz.","en":"When electrical power or propulsion is restored, the next question is how to establish that operation is stable and safe. Review voltage and frequency, lubrication and cooling parameters, recurring alarms, alternator loading, propulsion response, control modes, and standby arrangements. A report stating that the vessel has resumed passage is not complete without coordinated verification between the bridge and engine department. Measurements actually taken in a drill must not be confused with values assumed in the scenario."}]},{"id":"ORT-12","family":"power","title_tr":"Talim kontrolü, kayıt ve düzeltici faaliyet","title_en":"Drill control, records and corrective actions","paragraphs":[{"tr":"Talim öncesi risk değerlendirmesi, sorumlu zabit, katılan ekip, senaryo, kullanılacak gerçek sistemler ve simülasyon sınırları belirlenir. Talim sonrasında başlangıç–bildirim–karar–geri kazanım süreleri, eksikler, haberleşme aksaklıkları ve öğrenilen dersler kaydedilir. Başlatılmayan bir motor, bağlanmayan kesici veya test edilmeyen acil jeneratör “başarıyla çalıştırıldı” diye yazılmaz. Gerekli arıza/uygunsuzluk kaydı, planlı bakım ve risk güncellemesi yalnızca gerçekleşen bulgular üzerinden yapılır.","en":"Before a drill, establish the risk assessment, responsible officer, participating team, scenario, equipment that may actually be operated, and simulation limits. Afterwards record the intervals for onset, reporting, decision and recovery, deficiencies, communications failures, and lessons learned. An engine not started, a circuit breaker not closed, or an emergency generator not tested must not be recorded as successfully operated. Defect and non-conformity reports, planned maintenance entries, and risk-assessment updates are raised only on the basis of findings that actually occurred."}]},{"id":"NAV-C01","family":"weather_collision","title_tr":"Emniyet kararlarının komuta düzeni","title_en":"Command arrangements for navigational safety decisions","paragraphs":[{"tr":"Gemi kaptanı, olayın seyir, personel, gemi ve çevre emniyetine etkisini değerlendirir. Köprüüstü vardiya zabiti tehlikeyi ilk fark ettiğinde kaptana gecikmeksizin bilgi verir; makine dairesi sevk/dümen/enerjiye ilişkin hazırlıkları kendi sorumluluk alanında yürütür. Başta güverte ve makine postaları olmak üzere görev dağılımında kimin gözlem, kimin haberleşme, kimin müdahale sorumlusu olduğu açıkça belirlenir. Alarmın çalması tek başına koordinasyon sağlandığı anlamına gelmez; emir, tekrar ve teyit döngüsü kullanılır. Öğretim sorusu: Kaptan köprüüstüne geldiğinde ilk üç rapor hangi personelden gelir ve neyi içerir?","en":"The master assesses the consequences of an incident for navigation, personnel, vessel, and environmental safety. When the officer of the watch first identifies a danger, the master is informed without delay; the engine department prepares propulsion, steering, and electrical systems within its own area of responsibility. Duties for observation, communications, and intervention are assigned explicitly, particularly among deck and engineering teams. Sounding an alarm alone does not establish coordination: instructions are issued, read back, and confirmed. Training question: On the master's arrival on the bridge, who provides the first three reports and what do they contain?"}]},{"id":"NAV-C02","family":"weather_collision","title_tr":"Konum, UTC ve olay zaman çizelgesi","title_en":"Position, UTC and incident timeline","paragraphs":[{"tr":"Kritik durumun fark edilme anı, manevra emri, tehlikeye en yakın yaklaşma, temas/hasar zamanı ve yardım çağrısı gibi anlar mümkün olduğunca tutarlı bir zaman referansıyla kaydedilir. GNSS mevkii ile radar kerterizi, görsel gözlem ve harita üzerindeki konum birbirini desteklemek için kullanılır. Zaman dilimi, UTC ve yerel saat karışıklığı raporlama hatasına neden olabileceğinden başlıkta tanımlanır. Bir olaydan sonra hatırlamaya dayanan anlatım ile cihaz kaydının zamanı ayrı tutulur. Öğretim sorusu: Rapor saatinde UTC+3 belirtilmemişse hangi yanlış anlaşılmalar doğabilir?","en":"The times at which danger was first observed, a manoeuvre was ordered, the closest point of approach occurred, contact or damage took place, and assistance was requested are recorded using a consistent time reference wherever possible. GNSS positions, radar bearings, visual observations, and chart positions are used as mutually supporting information. The reporting heading distinguishes UTC from local time and identifies the time zone to avoid ambiguity. A recollection made after the event is kept separate from the timestamp of an equipment record. Training question: What misunderstandings may arise when a report time does not specify UTC+3?"}]},{"id":"NAV-C03","family":"weather_collision","title_tr":"Gözcülük, radar/AIS ve çatışma riskinin değerlendirilmesi","title_en":"Lookout, radar/AIS and assessment of collision risk","paragraphs":[{"tr":"Görerek, işiterek ve mevcut bütün uygun araçlarla gözcülük COLREG Kural 5'in temelidir. Radar/ARPA hedef takibi ve CPA/TCPA değerlendirmeleri, hedefe ait verinin kalitesine, sensör ayarlarına, seyir durumuna ve manevralara bağlı olarak değişir. AIS bilgisi faydalı olmakla birlikte tek başına çatışma riskinin kesin ölçüsü veya radar/görsel gözcülüğün yerine geçecek kaynak değildir. Göreli kerteriz, yaklaşma trendi, manevra alanı ve başka hedefler birlikte göz önünde bulundurulur. Öğretim sorusu: AIS'te görünen rota-hız verisiyle radardaki göreli hareket neden farklılaşabilir?","en":"Maintaining a proper lookout by sight and hearing and by all available appropriate means is fundamental to COLREG Rule 5. Radar or ARPA target tracking and CPA/TCPA assessments depend on data quality, sensor settings, the navigation situation, and vessel manoeuvres. AIS is useful, but its information alone is not a definitive measure of collision risk and does not replace radar and visual lookout. Relative bearing, closing trend, available manoeuvring room, and other targets are considered together. Training question: Why might the course and speed displayed by AIS differ from the relative motion indicated by radar?"}]},{"id":"NAV-C04","family":"weather_collision","title_tr":"Emniyetli sürat ve yeterli manevra alanı","title_en":"Safe speed and sufficient manoeuvring room","paragraphs":[{"tr":"COLREG Kural 6'ya göre sürat; görüş, trafik, durma mesafesi, manevra kabiliyeti, rüzgâr/deniz/akıntı, derinlik ve radarın sınırlamaları dikkate alınarak değerlendirilir. Ağır havada sürat, yalnızca varış zamanına göre belirlenmez; gövde hareketlerini, makine yükünü, dalga ile karşılaşma durumunu ve güvenli manevra alanını etkiler. Temas sonrası da bir gemiyi kontrolsüz bırakmak ile gereksiz sevk hareketi yapmak ayrı riskler doğurabilir. Öğretim sorusu: Sürat azaltmak her koşulda aynı ölçüde manevra emniyeti sağlar mı; hangi sistemler etkilenir?","en":"Under COLREG Rule 6, safe speed is assessed in the light of visibility, traffic, stopping distance, manoeuvring characteristics, wind, sea state, current, available depth, and radar limitations. In heavy weather speed cannot be determined solely from arrival-time requirements; it affects vessel motions, machinery loading, wave encounter conditions, and available manoeuvring space. Following contact, leaving the vessel without control and making unnecessary propulsive movements may create different hazards. Training question: Does reducing speed improve manoeuvring safety by the same amount in every circumstance, and which systems are affected?"}]},{"id":"NAV-C05","family":"weather_collision","title_tr":"Rota ve hava/deniz tahminlerinin değerlendirilmesi","title_en":"Assessment of passage plan and weather/sea forecasts","paragraphs":[{"tr":"Güncel meteorolojik tahmin, rüzgâr, dalga yönü/yüksekliği, swell, görünürlük, akıntı, sığlık ve kıyı mesafesi, seyrin planlanmasında birlikte ele alınır. Tahminler gemide gözlenen deniz durumuyla karşılaştırılır. Rota değiştirme yalnız ağır dalgadan kaçma amacıyla değil; kıyıya sürüklenme, başka trafik, su derinliği, trafik ayrım düzenleri ve yardım imkânları bakımından da incelenir. SOLAS V/34, seyir planının olumsuz hava koşullarını öngörmesini gerektirir. Öğretim sorusu: Dalga borda başına alındığında hareket azalıyor gibi görünürken hangi yeni seyir riski doğabilir?","en":"Current weather forecasts, wind, wave direction and height, swell, visibility, currents, shoals, and distance from shore are considered together when planning a route. Forecasts are compared with conditions observed on board. Altering course is assessed not only as a means of avoiding heavy seas but also against the danger of being set toward shore, other traffic, under-keel clearance, traffic separation schemes, and access to assistance. SOLAS V/34 requires voyage planning to take adverse weather conditions into account. Training question: Which new navigational danger can arise when taking the seas on a different heading appears to reduce vessel motion?"}]},{"id":"NAV-C06","family":"weather_collision","title_tr":"Hava ve su geçirmez bütünlük","title_en":"Weathertight and watertight integrity","paragraphs":[{"tr":"Su geçirmez (watertight) ve hava koşullarına dayanıklı (weathertight) kapama tertibatlarının tasarım işlevi aynı değildir. Kaporta, lumbuz, kapak, kapı ve geçiş mahallerinin kapalı/bağlı olma durumu geminin onaylı düzenine göre denetlenir. Su girme ihtimali olan alanlarda iletişim, kaçış ve personel kontrolü planlanır. Temas veya dalga hasarı sonrasında görünürde kuru olan komşu bölmede de gizli su yolu bulunabileceği değerlendirilir. Öğretim sorusu: Kırılmış bir güverte kapağından giren su hangi aşağı mahallere ilerleyebilir?","en":"Watertight and weathertight closures do not serve identical design purposes. The securing of companionways, portholes, hatch covers, doors, and access openings is checked against the vessel's approved arrangement. Communications, escape routes, and personnel accountability are planned in spaces at risk of water ingress. Following contact damage or wave impact, a concealed path for water may exist even in a neighbouring space that appears dry. Training question: Into which lower compartments could water from a damaged deck hatch progress?"}]},{"id":"NAV-C07","family":"weather_collision","title_tr":"Stabilite, serbest yüzey ve sıvı transferleri","title_en":"Stability, free-surface effect and liquid transfers","paragraphs":[{"tr":"Metasentrik yükseklik, trim, meyil, tank doluluğu ve serbest yüzey etkisi, geminin dalga veya hasar karşısındaki davranışını belirleyen faktörlerdendir. Balast alma/boşaltma, gemiyi düzeltme veya hasarlı mahali yükseltme seçenekleri otomatik acil işlem değildir. Her transfer, onaylı stabilite bilgisi, tank/kontrol donanımı, serbest yüzey, yapısal sınırlar ve hasar ihtimaliyle birlikte yetkili kararına bağlanır. Öğretim sorusu: Gemideki meyil varken kontrolsüz bir sıvı transferi neden durumu ağırlaştırabilir?","en":"Metacentric height, trim, list, tank filling levels, and free-surface effect are among the factors governing a vessel's behaviour in waves or after damage. Taking or discharging ballast, correcting a list, or attempting to raise a damaged area is not an automatic emergency action. Any transfer must be authorised after considering approved stability data, tank and control arrangements, free surfaces, structural limits, and possible damage. Training question: Why may an uncontrolled liquid transfer worsen an existing list?"}]},{"id":"NAV-C08","family":"weather_collision","title_tr":"Güverte ve donanımın denize hazırlanması","title_en":"Preparing decks and equipment for sea","paragraphs":[{"tr":"Açık güvertede sabit olmayan malzeme, boya/kimyasal kapları, kablo, hortum, taşınabilir donanım ve servis/kurtarma botunun bağları deniz şartlarına uygun sabitlenir. Bağlama ve çekme elemanlarında gevşeme, aşınma, konum kayması veya erişimi engelleme olup olmadığı emniyetli yerden değerlendirilir. Geminin kurtarma donanımının kullanılabilirliği korunurken kuvvetli dalga altında gereksiz açık güverte maruziyetinden kaçınılır. Öğretim sorusu: Ağır hava sırasında hangi bağlama kontrolü uzaktan gözlemle yapılmalı, hangisi uygun koşullarda fiziki yapılmalıdır?","en":"Unsecured stores, paint or chemical containers, cables, hoses, portable equipment, and the lashings of service or rescue boats on exposed decks are secured for the expected sea conditions. From safe locations, personnel assess whether mooring or towing fittings have loosened, worn, shifted, or obstructed access. The readiness of life-saving equipment is maintained while avoiding unnecessary exposure on open decks in heavy seas. Training question: Which securing checks should be conducted by remote observation, and which may be performed physically when conditions permit?"}]},{"id":"NAV-C09","family":"weather_collision","title_tr":"Açık güvertede personel ve çalışma emniyeti","title_en":"Personnel and work safety on exposed decks","paragraphs":[{"tr":"Ağır havada savrulma, ıslanma, ani tekne hareketi, düşme, sıkışma ve denize düşme tehlikesi artar. Açık güvertede çalışma zorunlu değilse ertelenir; zorunlu faaliyet için uygun kişisel koruyucu donanım, yaşam hattı/uygun bağlanma yöntemi, refakat ve köprüüstü gözetimi değerlendirilir. Kurtarma yaklaşımı, personele zarar verebilecek ikinci bir acil olay yaratmayacak şekilde planlanır. Yaşam hattı olması her koşulda güverteye çıkış izni anlamına gelmez. Öğretim sorusu: Ani bir borda dalgası nedeniyle çalışmanın durdurulması kararını kim, hangi bilgiyle verir?","en":"Heavy weather increases the risks of being thrown off balance, becoming soaked, sudden ship movement, falls, crushing injuries, and persons going overboard. Open-deck work is postponed unless necessary. Where it is essential, suitable PPE, lifelines or appropriate attachment arrangements, an accompanying person, and bridge supervision are considered. Any rescue arrangement is planned to avoid creating a secondary emergency that endangers the rescuers. The mere availability of a lifeline does not authorise deck access in all conditions. Training question: Who decides to stop work when sudden boarding seas become a danger, and on the basis of which information?"}]},{"id":"NAV-C10","family":"weather_collision","title_tr":"Sevk, dümen ve elektrik sistemlerinin sürekliliği","title_en":"Continuity of propulsion, steering and electrical systems","paragraphs":[{"tr":"Makine, pervane/itici, dümen, güç üretimi ve seyir cihazlarındaki sınırlamalar köprüüstüne açık biçimde aktarılır. Ağır denizde aşırı yüklenme, pervane havalanması veya soğutma/yağlama problemleri görülebilir; çatışmada şaft, deniz suyu devresi, kıç bölme veya elektrik kabloları etkilenebilir. İlgili makineler için güvenli işletme sınırını üretici ve gemi prosedürü belirler. Öğretim sorusu: Dümen tepkisi korunurken ana makine gücü sınırlanırsa manevra değerlendirmesi nasıl değişir?","en":"Any restrictions involving the engine, propeller or thruster, steering, electrical generation, or navigation equipment are reported clearly to the bridge. Heavy seas may cause overload, propeller racing, or cooling and lubrication problems; collision damage may affect the shaft, seawater circuits, aft compartments, or electrical cables. Safe operating limits are governed by manufacturers' instructions and ship procedures for the equipment concerned. Training question: How does the manoeuvring assessment change if steering response remains available but main-engine power is limited?"}]},{"id":"NAV-C11","family":"weather_collision","title_tr":"Alarm, dahili haberleşme ve kıyı koordinasyonu","title_en":"Alarms, internal communications and shore coordination","paragraphs":[{"tr":"Dahili alarm, genel anons, VHF/GMDSS, gemi–kara irtibatı, VTS/liman birimi ve çevredeki gemilerle haberleşmenin amaçları ayrı açıklanır. Gerçek tehlike işaretleri yalnız gerçek gereklilikte ve yetkiyle kullanılır. Talimde uygulanmayan çağrı, kayıtta “gösterildi/senaryo üzerinden açıklandı” şeklinde ifade edilir. Pan-Pan ile Mayday aynı önemde değildir; seçimin olayın can/gemi emniyeti durumuna uygun olması gerekir. Öğretim sorusu: Bir talimde gerçek tehlike çağrısına dönüşmemek için telsizde hangi önlemler alınır?","en":"The purposes of internal alarms, public address, VHF/GMDSS communications, ship-to-shore contact, communications with VTS or port authorities, and messages to nearby vessels are explained separately. Genuine distress signals are used only when the situation requires them and with proper authority. A call that was not made during an exercise is recorded as 'demonstrated' or 'explained through a scenario'. PAN PAN and MAYDAY do not represent the same level of urgency: the appropriate choice depends on the actual threat to life or vessel safety. Training question: What radio precautions prevent an exercise call from becoming an unintended real distress transmission?"}]},{"id":"NAV-C12","family":"weather_collision","title_tr":"Personel yoklaması, yaralanma ve tıbbi destek","title_en":"Personnel accountability, injuries and medical support","paragraphs":[{"tr":"Olay sonrası personele güvenli toplanma veya yerinde sayım uygulaması yapılır. Güvertede, makine mahallinde, kamarada veya diğer gemide yaralı/eksik kişi olasılığı ayrı değerlendirilir. Yaralının yeri, güvenli ulaşım, ilk yardım ve gerekirse tıbbi tahliye organizasyonu karşılaştırılır. Yaralı olduğu varsayılan maket ile gerçek insanı müdahale ortamına sokmak aynı risk taşımaz. Öğretim sorusu: Eksik personel bildirildiğinde kapalı/hasarlı mahale kontrolsüz giriş neden yasaktır?","en":"After an incident, a safe muster or personnel count in place is conducted as appropriate. The possibility of missing or injured persons on deck, in the machinery space, in cabins, or aboard another vessel is assessed separately. The casualty's location, safe access, first aid, and any medical evacuation are considered together. Using a simulated casualty or dummy does not carry the same risk as placing a real person in a hazardous response setting. Training question: Why is uncontrolled entry into an enclosed or damaged space prohibited when a person is reported missing?"}]},{"id":"NAV-C13","family":"weather_collision","title_tr":"Hasar araması, tank iskandili ve sistematik izleme","title_en":"Damage surveys, tank soundings and systematic monitoring","paragraphs":[{"tr":"Hasar kontrolü, önceden belirlenmiş bölge sırasıyla ve personel emniyeti sağlanarak yapılır. Sintine/tank seviyesi, koferdam, balast, yakıt, elektrik, yangın, devre basıncı, kapama tertibatları ve kritik yapısal bileşenler değerlendirilir. Tek bir seviyenin ölçülmesi yeterli olmayabilir; zamanla değişim eğilimi ve hangi ölçümün güvenilir olduğu kayda geçirilir. Hasarlı/kapalı mahale giriş ayrıca izin ve atmosfer değerlendirmesi gerektirebilir. Öğretim sorusu: İlk iskandil normal iken ikinci iskandilin yükselmesi neyi düşündürür?","en":"Damage assessment follows a predetermined sequence of spaces while protecting personnel. Bilge and tank levels, cofferdams, ballast and fuel systems, electrical and fire hazards, line pressures, closing devices, and critical structural components are examined as appropriate. One level reading may be insufficient; trends over time and the reliability of the measurement method are recorded. Entry into a damaged or enclosed space may require separate permission and atmosphere assessment. Training question: What might a rising second sounding indicate when the initial sounding was normal?"}]},{"id":"NAV-C14","family":"weather_collision","title_tr":"İlerleyen su baskını, yangın ve deniz kirliliği bağlantısı","title_en":"Progressive flooding, fire and marine pollution interactions","paragraphs":[{"tr":"Dalga hasarı veya çarpışma, birincil tehlikenin yanında su alma, elektrik yangını, yakıt sızıntısı ve kirli su oluşmasına neden olabilir. Su geçirmez sınırlar, uygun izolasyon, pompa kapasitesi ve çevresel yayılım mevcut hasar kontrolü bilgilerinden yararlanılarak değerlendirilir. Bu kart yalnız bağlantı noktasıdır: Ayrıntılı uygulama DAMAGE_COMMON, POLLUTION_COMMON ve FIRE_COMMON kartlarına referans verir; aynı teknik dersleri tekrar içermez. Öğretim sorusu: Hasarlı yakıt tankının bulunduğu bir bölgede pompalamaya başlamadan ne kontrol edilir?","en":"Wave damage or collision may cause flooding, electrical fires, fuel leakage, and contaminated water
