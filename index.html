 bırakma tertibatının on-load/off-load tipi, yeniden kilitleme teyitleri ve gösterge usulleri için yalnızca onaylı üretici/yerel prosedür kullanılır. İşletme öncesi açık güvenlik sınırı ve bağlantının teyidi anlatılır; kamuya açık eğitim sayfası herhangi bir “şu düğmeye bas” kumanda emri vermez.","en":"A suspended boat presents not only a falling hazard but also risks from moving loads, swinging, crushing, parting, incorrect connections and uncontrolled impact with the boat or ship. Uncontrolled operation of a release mechanism while under load, or before the boat has been safely supported, is a critical hazard. Only approved manufacturer and local procedures are used for on-load/off-load hook and release-gear types, confirmation of resetting and indicator checks. Clear safety boundaries and verification of connections before operation are taught; a public training page does not issue instructions such as 'press this button'."}]},{"id":"BOATS_COMMON_06","family":"boats","title_tr":"IV.E. Bot personelinin güvenliği","title_en":"Safety of boat personnel","paragraphs":[{"tr":"Can yeleği/uygun koruyucu donanım, kaymaz ayakkabı, baş koruması, yüzme yeteneği, görevli kişilerin yeterlilikleri, el-kol sıkışma noktaları, halatın gerilim altındaki bölgesi ve köprüüstünden görülemeyen alanlar üzerinde durulur. İndirme mahalli yetkisiz personelden ayrılır. Personelin asılı bot altında bulunmaması, gevşek sapanın savrulma alanına girmemesi ve hareketli yükün güzergâhının boş tutulması hatırlatılır.","en":"Training addresses lifejackets and other suitable protective equipment, non-slip footwear, head protection, swimming ability, the qualifications of assigned personnel, hand and arm pinch points, zones with lines under tension and areas not visible from the bridge. Unauthorised personnel are kept clear of the launching area. Crew are reminded not to stand beneath a suspended boat, not to enter the sweep area of a loose sling and to keep the path of a moving load clear."}]},{"id":"BOATS_COMMON_07","family":"boats","title_tr":"IV.F. Haberleşme ve görev devri","title_en":"Communications and transfer of command","paragraphs":[{"tr":"Üçlü teyit hattı: Köprüüstü/kaptan → indirme operatörü/baş zabit → bot sorumlusu. Standartlaştırılmış kısa ve karşılıklı doğrulanan komutlar, iletişimin kaybı hâlinde işlemi durdurma kuralı, sesli/sessiz işaretlerin anlamı ve yedek haberleşme yöntemi personele aktarılır. Telsizle yapılan talim trafiği gerçek acil durum çağrısı yerine geçmez; yanlışlıkla dış istasyonlara gerçek alarm verilmez.","en":"Three-way confirmation chain: bridge/master → launching operator/chief officer → person in charge of the boat. Personnel are taught standardised short commands with mutual confirmation, the stop-work rule if communications fail, the meanings of audible and non-verbal signals, and a backup communications method. Radio traffic generated during a drill is not a substitute for a real emergency call, and an unintended real alert must not be sent to external stations."}]},{"id":"BOATS_COMMON_08","family":"boats","title_tr":"IV.G. Denizde emniyetli manevra","title_en":"Safe manoeuvring afloat","paragraphs":[{"tr":"Kurtarma/servis botunun planlanmış eğitim sahasında, kontrol edilebilir süratte ve ana gemiyle emniyetli mesafede seyir etmesi; yaklaşma açısı, rüzgâr/akıntı, geminin bordası ve pervaneler, dümen ve makine tepkisi, düşük süratte kumanda, dar alanda dönüş ve ani duruş, gerekiyorsa güvenli yedekleme/müdahale olanakları anlatılır. Bir kazazedeye yaklaşma çalışmasında kişi yerine uygun eğitim mankeni/işaret kullanılabilir; gerçek kişinin suya atlatılması eğitim için zorunlu kabul edilmez.","en":"Training covers operating the rescue/service boat in a designated exercise area at controllable speed and at a safe distance from the parent vessel; approach angle, wind and current, the ship's side and propellers, steering and engine response, low-speed handling, turns and sudden stopping in confined waters, and safe contingency/assistance arrangements where required. When practising an approach to a casualty, a suitable training dummy or marker may be used instead of a person; putting a real person into the water is not treated as necessary for training."}]},{"id":"BOATS_COMMON_09","family":"boats","title_tr":"IV.H. Sudan kurtarma ve kazazede bakımıyla ilişki","title_en":"Relationship to recovery from water and casualty care","paragraphs":[{"tr":"MOB/SAR ortak içerik çekirdeği kullanılır: kişiye yaklaşma, pervane/su akışı yönünden uzak güvenli alma alanı, uygun kurtarma ağı/sepeti, düşmenin ve ikinci yaralanmanın önlenmesi, mümkün olan durumlarda yatay/yataya yakın geri alma, soğuk su sonrası hızlı tıbbi değerlendirme ve ana gemiye güvenli aktarım. Bu çalışma kazazede kurtarma esaslarını tekrar yazmaz; ortak MOB/SAR modülüne referans verir.","en":"The shared MOB/SAR core is used: approaching the person, selecting a safe recovery area away from propellers and water flow, using appropriate rescue nets or baskets, preventing falls and secondary injuries, horizontal or near-horizontal recovery where practicable, prompt medical assessment after cold-water exposure and safe transfer to the parent vessel. This lesson does not rewrite the principles of casualty recovery; it refers to the shared MOB/SAR module."}]},{"id":"BOATS_COMMON_10","family":"boats","title_tr":"IV.I. Botun geri alınması ve kapanış","title_en":"Recovery of the boat and operational close-out","paragraphs":[{"tr":"Geri alma, indirmeden daha düşük riskli bir işlem olarak varsayılmaz. Gemi hareketi, dalga/dalga yansıması, botun mataforaya yanaşması, kancanın doğru şekilde yeniden bağlandığının teyidi, botun yüklenmesi, çalışan personelin güvenli pozisyonu, salınım, istif noktası, emniyet kilitleri ve bağlantıları ayrı ayrı eğitim konusudur. İş bitiminde koruyucu örtü, bağlar, tahliye tapası/şarj düzeni, donanımın yerleşimi ve arıza/bulgu kaydı güncel üretici talimatına göre gözden geçirilir.","en":"Recovery of the boat must not be assumed to be less hazardous than launching. Training covers ship motion, waves and reflected waves, approaching the davit, confirmation that the hook has been correctly reconnected, loading the boat onto the lifting arrangement, safe positions for personnel, swinging, the stowage position, safety locks and securing connections. At completion, the protective cover, lashings, drain plug/charging arrangements, equipment stowage and defect/findings record are reviewed in accordance with the current manufacturer's instructions."}]},{"id":"BOATS_TECHNICAL_MATRIX","family":"boats","title_tr":"Teknik öğrenme kartları (kaynak tablosu)","title_en":"Technical learning cards: source reference matrix","paragraphs":[{"tr":"Tekilleştirme: MOB/SAR raporundaki “kazazedeye yaklaşma ve sudan alma”, Gemiyi Terk raporundaki “kişisel can kurtarma teçhizatı” ve bu rapordaki BOT-01/BOT-09 başlıkları ayrı ayrı tam metin saklanmaz. Ortak modul_id üzerinden ilgili talim sayfasına bağlanır. Yeni senaryoda yalnızca görev-farkı cümleleri eklenir.","en":"Deduplication: 'approaching and recovering a casualty from the water' in the MOB/SAR report, 'personal life-saving equipment' in the Abandon Ship report and BOT-01/BOT-09 in this report are not stored separately as duplicate full texts. They are linked to the relevant drill pages through a common module_id. Only task-specific differences are added for the new scenario."}]},{"id":"CONFINED_COMMON_01","family":"confined","title_tr":"Kapalı mahal, bağlantılı mahal ve bitişik mahal","title_en":"Enclosed, connected and adjacent spaces","paragraphs":[{"tr":"Kapalı mahal, yeterli havalandırması bulunmayan, giriş-çıkışı kısıtlı olan veya sürekli insan bulunması için tasarlanmamış bir alan olabilir. Sadece küçük veya karanlık alanlar değil, hacimce büyük olup atmosferi kontrol edilmeyen alanlar da tehlikelidir. Zincirlik, double bottom, koferdam, tank, başaltı, sintine, bazı depo ve boşluklar gemiye özgü risk listesine göre değerlendirilir. MSC.581(110) terminolojisinde connected space, kapı/bağlantı üzerinden atmosfer alışverişi olabilen mahal; adjacent space ise ortak fiziksel sınır paylaşan fakat doğrudan geçiş açıklığı bulunmayan mahâldir. Bir kapının kapalı olması bağlantılı mahalin güvenli olduğunu kanıtlamaz.","en":"An enclosed space may have inadequate ventilation, restricted access or egress, or may not be designed for continuous human occupancy. Hazards are not limited to small or dark spaces: large spaces with uncontrolled atmospheres can also be dangerous. Chain lockers, double bottoms, cofferdams, tanks, forecastle spaces, bilges, certain storerooms and voids are assessed against the vessel-specific risk inventory. In the terminology of MSC.581(110), a connected space can exchange atmosphere through a door or connecting opening; an adjacent space shares a physical boundary but has no direct access opening. A closed door does not prove that a connected space is safe."},{"tr":"Öğretim noktası: Eğitimde “mahallin adı” kadar o mahallin bağlantı ve atmosfer yolu da gösterilir. Tehlike, yalnızca giriş yapılacak mahalden kaynaklanmayabilir.","en":"Teaching point: The training identifies not only the name of the space but also its connections and potential pathways for atmospheric migration. A hazard may originate outside the space to be entered."}]},{"id":"CONFINED_COMMON_02","family":"confined","title_tr":"Atmosferin tehlikeli hâle gelmesi","title_en":"Development of hazardous atmospheres","paragraphs":[{"tr":"Oksijen azalması korozyon, biyolojik aktivite, inert gaz, kaynak/yanma, depolanan ürün veya komşu mahal etkisiyle ortaya çıkabilir. Oksijen zenginleşmesi tutuşturma tehlikesini artırabilir. Hidrojen sülfür (H₂S), karbon monoksit (CO), karbondioksit (CO₂), yanıcı hidrokarbon buharı ve başka gazlar bazı mahallerde rol oynar. Koku, gözle görünüm veya kişinin kısa süre önce mahalde çalışmış olması atmosferin güvenli olduğunu göstermez. Tehlikeli atmosfer zamanla değişebilir; fan durması, iş, sıcaklık, bağlantılı bir bölmedeki hareket veya ürün değişimiyle yeniden oluşabilir.","en":"Oxygen depletion may result from corrosion, biological activity, inert gas, welding or combustion, stored products, or the effects of neighbouring spaces. Oxygen enrichment can increase ignition hazards. Hydrogen sulphide (H₂S), carbon monoxide (CO), carbon dioxide (CO₂), flammable hydrocarbon vapours and other gases may be relevant in particular spaces. Smell, visual appearance or the fact that someone worked there recently does not demonstrate that the atmosphere is safe. A hazardous atmosphere can change over time or recur because of a stopped fan, ongoing work, temperature changes, activity in a connected compartment or a change in stored product."}]},{"id":"CONFINED_COMMON_03","family":"confined","title_tr":"Risk değerlendirmesi ve mahal bazlı kayıt","title_en":"Risk assessment and space-specific records","paragraphs":[{"tr":"Önce işin kapalı mahale girilmeden yapılıp yapılamayacağı araştırılır. Giriş kaçınılmazsa mahalin iş geçmişi, bağlantıları, izolasyon noktaları, düşme/elektrik/makine riskleri, kazazede çıkarma güzergâhı, aynı anda yapılan işler ve müdahale kaynakları değerlendirilir. Her mahale aynı risk puanı atanmaz. Örneğin atık tankındaki H₂S tehlikesiyle zincirlikteki dikey erişim ve hareketli zincir riski farklıdır. Daha önce imzalanmış bir değerlendirme, yeni olayın kabul belgesi değildir.","en":"First determine whether the work can be completed without entering the enclosed space. If entry is unavoidable, assess the space's operating history, connections, isolation points, fall/electrical/machinery hazards, casualty-extraction route, simultaneous operations and emergency-response resources. The same risk score is not assigned to every space. For example, the H₂S risk in a waste tank differs from the vertical-access and moving-chain hazards in a chain locker. A previously signed assessment does not by itself authorise a new operation."}]},{"id":"CONFINED_COMMON_04","family":"confined","title_tr":"Yetki, izin ve görev paylaşımı","title_en":"Authority, permits and allocation of duties","paragraphs":[{"tr":"Görev zincirinde kaptan/yetkili sorumlu, atmosfer ölçümünden sorumlu yetkin personel, giriş yapan ekip, dışarıda kalan gözcü, yedek destek ve ilk yardım personeli birbirinden ayrılır. Kapalı mahale tek başına giriş yapılmaz. Giriş için yetkili onay, tanımlanmış iş, geçerlilik süresi ve izin kapanışı bulunur. IMO MSC.581(110) örnek giriş izninin geçerliliği sekiz saati aşmamalıdır; gerçek kullanımda yürürlükteki daha sıkı şirket kuralı da dikkate alınır. Gözcü, görevini terk edip kazazede için içeri koşmaz; alarm ve kurtarma planını harekete geçirir.","en":"The chain of responsibility distinguishes the master/authorised person, competent person responsible for atmospheric testing, entry team, attendant remaining outside, standby support and first-aid personnel. No one enters an enclosed space alone. Entry requires authorised approval, a defined task, a validity period and formal close-out of the permit. The sample entry permit in IMO MSC.581(110) should not be valid for more than eight hours; any stricter company rule in force must also be observed in actual operations. The attendant does not abandon the post and rush inside to reach a casualty: the attendant raises the alarm and activates the rescue plan."}]},{"id":"CONFINED_COMMON_05","family":"confined","title_tr":"İzolasyon ve enerjinin kontrolü","title_en":"Isolation and control of energy sources","paragraphs":[{"tr":"Giriş yapılacak mahale bağlı borular, valfler, pompalar, karıştırıcılar, elektrik ekipmanı, hareketli tertibat, hidrolik ve pnömatik hatlar uygun şekilde izole edilir; enerji depolanması, gerilim ve sıvı/ürün girişi tehlikeleri düşünülür. İzolasyonun yapıldığı yalnız sözlü beyanla değil, ilgili işletme ve kilitleme/etiketleme yöntemiyle doğrulanır. Gerçek izolasyon için anahtar/şalter/valf sırası genel HTML eğitimiyle verilmez; geminin geçerli teknik prosedürüne bağlanır.","en":"Pipes, valves, pumps, agitators, electrical equipment, moving machinery and hydraulic or pneumatic lines connected to the space to be entered are isolated as appropriate. Stored energy, electrical voltage and inflow of liquids or products are considered. Isolation is verified through the relevant operating and lockout/tagout arrangements, not solely by a verbal assurance. A generic HTML lesson does not prescribe the sequence for operating switches, breakers or valves during real isolation; that sequence is governed by the vessel's applicable technical procedure."}]},{"id":"CONFINED_COMMON_06","family":"confined","title_tr":"Havalandırma: girişi güvenli hâle getirme ve süreklilik","title_en":"Ventilation: preparing and maintaining entry conditions","paragraphs":[{"tr":"Mahalde hava değişiminin yalnız giriş açıklığı yakınında değil, erişilen derin ve kör bölgelerde de yeterli olması gerekir. Doğal ve mekanik yöntemlerin yeterliliği mahal geometrisi, kirletici ve hava çıkış yoluyla değerlendirilir. Oksijen eksikliğini gidermek için saf oksijen basılmaz. Atmosfer ölçümü, IMO'nun tavsiyesine uygun şekilde kontrollü ve kararlı koşullarda yapılır; gerçek çalışmada havalandırmanın devamı risk değerlendirmesine bağlanır. Havalandırma kesilir veya gaz değerleri değişirse çalışma durdurulur, tahliye/yeniden ölçüm süreci uygulanır. Olası kurtarmada havalandırmanın güvenli işletilmesi ayrıca planlanır.","en":"Ventilation must provide adequate air exchange not just near the entrance but also in deeper and blind areas that personnel may reach. The adequacy of natural and mechanical ventilation is assessed according to the geometry of the space, contaminants and exhaust-air path. Pure oxygen must not be introduced to correct oxygen deficiency. Atmospheric testing is performed under controlled and stable conditions consistent with IMO recommendations; the risk assessment determines whether ventilation must be maintained during actual work. If ventilation fails or gas readings change, work is stopped and evacuation/retesting procedures are followed. Safe operation of ventilation during a possible rescue is also planned."}]},{"id":"CONFINED_COMMON_07","family":"confined","title_tr":"Atmosfer ölçümü: hangi gaz, hangi cihaz, nereden?","title_en":"Atmosphere testing: gases, instruments and sampling points","paragraphs":[{"tr":"Ölçüm, girişten önce dışarıdan, mahallin niteliğine göre farklı seviye ve noktalardan, uygun numune alma düzeniyle yapılır. SOLAS XI-1/7'nin asgari kabiliyeti O₂, yanıcı gaz/buhar, H₂S ve CO ölçümüdür. CO₂ veya ürüne özgü başka gazlar için ayrıca uygun cihaz gerekebilir. Gaz algılayıcının tipine uygun kalibrasyon, kullanım öncesi fonksiyon testi (bump test), sensör ömrü, pompa/numune hattı ve alarm ayarları doğrulanır. Yanıcı gaz ölçümlerinde sensör teknolojisi ve oksijen azlığı gibi etkenlerin ölçümü etkileyebileceği öğretilir. Ekranın rakam göstermesi tek başına ölçümün geçerli olduğunu kanıtlamaz.","en":"Before entry, the atmosphere is tested from outside the space at different levels and locations appropriate to the space, using suitable sampling arrangements. The minimum measurement capability under SOLAS XI-1/7 covers O₂, flammable gas/vapour, H₂S and CO. Appropriate additional instruments may be needed for CO₂ or other product-specific gases. Calibration suitable for the detector type, pre-use functional checks (bump tests), sensor life, pump/sampling lines and alarm settings are verified. Training explains that factors such as sensor technology and oxygen deficiency may influence flammable-gas measurements. A displayed numeric reading alone does not establish that a measurement is valid."}]},{"id":"CONFINED_COMMON_08","family":"confined","title_tr":"Ölçüm sonuçlarının anlamı ve IMO 2025 referansı","title_en":"Interpretation of measurements and IMO 2025 guidance","paragraphs":[{"tr":"MSC.581(110) Bölüm 7.4'te, risk değerlendirmesine bağlı kararlı ölçümler olarak normal atmosfer için %20,9 O₂, CO₂ için %0,5 hacimden düşük, yanıcı gaz/buhar potansiyeli varsa LEL/LFL'nin %1'inden düşük, zehirli gaz için ilgili mesleki maruziyet sınırının %50'sinden düşük değerler anılır. Bunlar ölçümün tek başına yeterliliği anlamına gelmez; mahaldeki fiziksel tehlikeler, kimyasalın türü, cihazın uygunluğu, hava değişimi ve yetkili izni de zorunlu değerlendirme konularıdır. Ulusal/şirket kuralları farklı veya daha sıkı olabilir. Bu değerler, yalnızca örnek ekranda otomatik onay verecek elektronik eşiklere dönüştürülmez.","en":"Section 7.4 of MSC.581(110) refers, in the context of the risk assessment and stable measurements, to 20.9% O₂ for a normal atmosphere, less than 0.5% CO₂ by volume, less than 1% of the LEL/LFL where flammable gas or vapour may be present, and less than 50% of the applicable occupational exposure limit for toxic gases. These readings alone do not establish fitness for entry: physical hazards, the identity of the chemical, suitability of the instrument, air exchange and authorised permission must also be assessed. National or company rules may differ or impose stricter requirements. The figures are not converted into automatic electronic approval thresholds in a sample interface."}]},{"id":"CONFINED_COMMON_09","family":"confined","title_tr":"Sürekli kişisel izleme, gözcü ve haberleşme","title_en":"Continuous personal monitoring, attendants and communications","paragraphs":[{"tr":"Giriş yapan personelin uygun kişisel gaz ölçeri takması, cihaz alarmlarını bilmesi, belirlenen zaman aralıklarında durum bildirmesi, ses/telsiz/hat haberleşmesinin çalışması ve önceden mutabık kalınmış çıkış işaretlerine uyması öğretilir. Gözcü, içeri giren kişi sayısını ve kimliklerini, giriş/çıkış saatlerini ve iletişimi takip eder. Telsizin metal tank veya alt bölmede kesilebilmesi için ikinci haberleşme yöntemi düşünülür. Haberleşme kesilmesi, gaz alarmı, havalandırma durması veya iş koşulunun değişmesi bir tahliye kararı gerektirebilir.","en":"Personnel entering the space are taught to wear appropriate personal gas monitors, understand instrument alarms, provide situation reports at agreed intervals, verify voice/radio/line communications and follow prearranged exit signals. The attendant monitors the identities and number of entrants, entry and exit times and communications. Because radio contact can be lost inside metal tanks or lower compartments, a second communications method is considered. Loss of communications, a gas alarm, ventilation failure or changed working conditions may require an evacuation decision."}]},{"id":"CONFINED_COMMON_10","family":"confined","title_tr":"SCBA, EEBD ve tıbbi oksijenin ayrımı","title_en":"SCBA, EEBD and medical oxygen: different purposes","paragraphs":[{"tr":"SCBA (self-contained breathing apparatus, bağımsız solunum cihazı), uygun eğitimli kurtarma personelinin riskli atmosfere girişinde kullanılan donanımdır; cihazın basınç, sızdırmazlık, alarm, kullanım süresi, yedek ekip ve geri dönüş emniyeti üretici talimatı ve risk koşullarına göre değerlendirilir. EEBD, tehlikeli atmosferden kaçış amaçlıdır; kapalı mahalde arama veya kurtarma için giriş cihazı değildir. Kazazedeye uygulanacak yüz maskesi, resüsitasyon/oksijen cihazı ve profesyonel tıbbi müdahale de SCBA ile aynı kavramlar değildir. Kurtarma amacıyla gözcünün EEBD takıp içeri girmesi öğretilmez.","en":"SCBA (self-contained breathing apparatus) is equipment used by appropriately trained rescue personnel when entering a hazardous atmosphere; cylinder pressure, tightness, alarms, operating duration, backup team and safe return are assessed against the manufacturer's instructions and prevailing risks. An EEBD is intended for escape from a hazardous atmosphere; it is not entry equipment for search and rescue in an enclosed space. A casualty's face mask, resuscitation/oxygen equipment and professional medical treatment are also different from SCBA. Training must not suggest that an attendant should put on an EEBD and enter to attempt a rescue."}]},{"id":"CONFINED_COMMON_11","family":"confined","title_tr":"Kurtarma planı, alan geometrisi ve tahliye donanımı","title_en":"Rescue plans, space geometry and evacuation equipment","paragraphs":[{"tr":"Mahale özgü kurtarma planı girişten önce belirlenir. Dikey merdiven, dar menhol, döşeme açıklığı, tankta serbest sıvı, gaz yığılması ve sedyenin dönüş kabiliyeti değerlendirilir. Uygun kurtarma kemeri, halat, makara/üçayak, vinç, sedye, sabitleme ve düşüş önleyici tertibatlar örneklerle tanıtılır. Her halat ya da vinç insan kaldırmaya uygun değildir; donanımın tasarım amacı, yük sınırı, ankrajı ve sertifikası belirlenir. İmkân varsa eğitim mankeni ve kontrollü alanda mekanik çıkarma gösterilir; gerçek kazazede ile riskli manevra prova edilmez.","en":"A space-specific rescue plan is established before entry. Vertical ladders, narrow manholes, deck openings, free liquid in tanks, accumulated gases and the ability to turn a stretcher are assessed. Suitable rescue harnesses, lines, pulleys/tripods, winches, stretchers, securing arrangements and fall-arrest equipment are introduced by example. Not every line or winch is approved for lifting people: the equipment's intended purpose, load limit, anchorage and certification are established. Where practicable, mechanical extraction is demonstrated using a training dummy in a controlled area; hazardous manoeuvres are not rehearsed with a real casualty."}]},{"id":"CONFINED_COMMON_12","family":"confined","title_tr":"Olay yeri yönetimi, kurtarma ekibi ve ikinci kazazedeyi önleme","title_en":"Scene command, rescue teams and avoiding secondary casualties","paragraphs":[{"tr":"Kazazede bilgisi geldiğinde ilk müdahale alarm vermek ve plansız girişi önlemektir. Kurtarma ekibi olay yeri amirinin komutasında, risk değerlendirmesi ve gerekiyorsa SCBA ile hareket eder. İçerideki kazazedenin bilinçsiz olması, atmosferin temiz olduğu varsayımına neden olmaz. Mahale giriş yapan kurtarmacı sayısı, yedek ekip, ekipman kullanımı, iletişim, geri dönüş süresi ve dış ekiplerle irtibat planlanır. Şüpheli atmosferi olan mahalde eğitim adına personel sokulmaz. Güvenli ve yeterli donanım bulunmadığında yardım istenir, risk yaratacak kurtarmaya girişilmez.","en":"On receiving a casualty report, the first actions are to raise the alarm and prevent unplanned entry. The rescue team acts under the scene commander's direction after risk assessment and, where necessary, with SCBA. An unconscious casualty inside does not imply that the atmosphere is safe. The number of rescuers entering, standby team, equipment, communications, safe-return time and liaison with external responders are planned. Personnel are not sent into a space with a suspect atmosphere for training purposes. If safe and adequate equipment is unavailable, assistance is requested and a rescue attempt that would create further risk is not undertaken."}]},{"id":"CONFINED_COMMON_13","family":"confined","title_tr":"Kazazedeyi çıkarma ve ilk yardım","title_en":"Casualty extrication and first aid","paragraphs":[{"tr":"Kazazede, mahalin geometrisine uygun sedye/kemerle hareket ettirilir; baş-boyun-omurga, düşme ve askıda kalma riskleri dikkate alınır. Görevli ilk yardım ekibi güvenli ortamda solunum, dolaşım ve bilinç durumunu değerlendirir; güncel ilk yardım/CPR eğitimi ve tıbbi yönlendirme esas alınır. Zehirli gaz teması veya kimyasal bulaş varsa ikincil maruziyete karşı uygun önlemler alınır. Oksijen veya resüsitasyon ekipmanı yalnızca eğitimli, yetkili personel tarafından kullanılır. Tele-tıbbi destek ve liman/kara sağlık yardımı ihtiyacı kaptan tarafından değerlendirilir.","en":"The casualty is moved using a stretcher or harness suited to the geometry of the space, taking account of head, neck and spinal injury, falls and suspension hazards. In a safe area, the designated first-aid team assesses breathing, circulation and consciousness, following current first-aid/CPR training and medical direction. Where toxic-gas exposure or chemical contamination is possible, appropriate measures prevent secondary exposure. Oxygen or resuscitation equipment is used only by trained, authorised personnel. The master assesses the need for telemedical assistance and shore-based/port medical services."}]},{"id":"CONFINED_COMMON_14","family":"confined","title_tr":"Talim kapanışı, donanımın hazır duruma getirilmesi ve öğrenilen dersler","title_en":"Drill close-out, equipment readiness and lessons learned","paragraphs":[{"tr":"Talimden sonra gözcü, haberleşme, ölçüm, izin, SCBA, sedye ve kurtarma tertibatı işlevleri değerlendirilir. Kullanılan ekipman üretici talimatına göre yeniden hazır bulundurulur; eksiklik, arıza ve eğitim ihtiyacı ilgili kurum süreçleriyle izlenir. Önceki risk değerlendirmesinin geçerliliği ve mahal bazlı kurtarma planının işlevselliği gözden geçirilir. Kayıtlarda hangi işlem fiilen yapıldı, hangisi simüle edildi, hangi sistem hiç çalıştırılmadı ayrımı korunur.","en":"After the drill, the functions of the attendant, communications, atmospheric testing, permits, SCBA, stretcher and rescue arrangements are evaluated. Used equipment is returned to readiness in accordance with manufacturers' instructions; deficiencies, faults and training needs are followed up through the relevant company procedures. The continuing validity of earlier risk assessments and the effectiveness of the space-specific rescue plan are reviewed. Records preserve the distinction between actions actually performed, actions simulated and systems not operated at all."}]},{"id":"DMG-C01","family":"damage","title_tr":"C01 — Can emniyeti, olay idaresi ve ilk değerlendirme","title_en":"Life safety, incident command and initial assessment","paragraphs":[{"tr":"Öncelik gemideki insanların emniyeti, geminin kontrol altında tutulması, olayın yayılmasının önlenmesi ve sağlıklı bilgi üretilmesidir. Kaptan, köprüüstü, güverte hasar kontrol ekibi ve makine kontrol ekibinin görevleri ayrı belirlenir. İlk değerlendirme; mevkideki tehlike, gemideki kişiler, sevk/dümen kabiliyeti, mevcut meyil/trim, su girişi ve çevre tehdidini içerir. Gerçek bir kazada acil kararlar kaptanın emniyet yönetimi kapsamındadır. Talimde bu karar alma mantığı can ve mal güvenliğini tehlikeye sokmadan masa başında veya kontrollü gösterimle çalışılır.","en":"The priorities are the safety of persons on board, keeping the vessel under control, preventing the incident from escalating, and obtaining reliable information. The responsibilities of the master, bridge team, deck damage-control team, and engine-room control team are defined separately. The initial assessment covers hazards at the vessel's location, persons on board, propulsion and steering capability, existing list and trim, water ingress, and environmental threats. During an actual casualty, emergency decisions fall within the master's safety-management responsibilities. In a drill, this decision-making process is practised through tabletop exercises or controlled demonstrations without endangering life or property."},{"tr":"Öğretim noktası: Olayı ilk görenin bildirimi; bildirim zamanı ve ilk mevcut bilgiler ile bunların sonradan güncellenmesi birbirinden ayrılır. Kesinleşmemiş hasar boyutu “hasar yok” şeklinde raporlanmaz.","en":"Teaching point: Distinguish the initial observer's report, the time and information available when it was made, and subsequent updates. Damage of undetermined extent must not be reported as “no damage”."}]},{"id":"DMG-C02","family":"damage","title_tr":"C02 — Geminin su geçirmez bölmelendirme planı","title_en":"Watertight subdivision and damage-control plans","paragraphs":[{"tr":"Teknenin hangi perdeler, güverteler, su geçirmez kapılar, menholler, hava firarları, boru geçişleri ve kablo penetrasyonlarıyla bölündüğü gemiye özgü hasar kontrol planından okunur. Bir mahalin kapısının kapalı olması, aynı bölmeye diğer tüm su yollarının kapalı olduğunu kanıtlamaz. İkinci bir bölmeye geçiş yaratabilecek açıklıklar ve kontrol noktaları plan üzerinden işaretlenir. Personelin tahliye güzergâhının kapama işlemi nedeniyle tehlikeye girmemesi gerekir. Kapatılan mahal ve hangi sınırın emniyete alındığı kayıt dilinde açık gösterilir.","en":"The ship-specific damage-control plan is used to identify how the hull is divided by bulkheads, decks, watertight doors, manholes, air vents, pipe penetrations, and cable penetrations. A closed door to one space does not prove that every other path for water into the compartment is closed. Openings and control points through which flooding could spread to another compartment are marked on the plan. Closure actions must not put personnel evacuation routes at risk. Records must identify the space closed and the boundary secured."},{"tr":"Öğretim noktası: “Su geçirmez” ile “hava koşullarına dayanıklı/weather-tight” yapı aynı kavram değildir. Ekipten, gemideki gerçek kapama türlerini ayırt etmesi beklenir. [U1, U3]","en":"Teaching point: “Watertight” and “weathertight” do not mean the same thing. The team is expected to identify the actual types of closures fitted on board. [U1, U3]"}]},{"id":"DMG-C03","family":"damage","title_tr":"C03 — Hasar stabilitesi: trim, meyil, deplasman ve serbest yüzey","title_en":"Damage stability: trim, list, displacement and free-surface effect","paragraphs":[{"tr":"Su alan mahalin konumu, suyun serbestçe hareket etmesi, geminin yükleme durumu ve karaya oturmada tabandan gelen reaksiyon birlikte değerlendirilir. Serbest yüzey etkisi, kısmen dolu bir bölmedeki sıvının yer değiştirmesiyle geminin enine stabilitesini olumsuz etkileyebilir. Görünür meyil, hasarın boyutunun tek göstergesi değildir; simetrik dolan mahalde büyük meyil oluşmadan ciddi batma olabilir. Yalnız bir iskandil veya yalnız bir draft değeri üzerinden emniyet kararı verilmez. Hasar kontrol kitabı, onaylı stabilite bilgisi ve varsa yetkili kıyı desteği birlikte kullanılır.","en":"The location of the flooded compartment, free movement of the water, the vessel's loading condition, and, in a grounding, the reaction exerted by the seabed are considered together. Free-surface effect may adversely affect transverse stability when liquid shifts within a partly filled compartment. A visible list is not the only indication of the severity of damage: serious sinkage may occur when symmetrical flooding produces little list. Safety decisions must not rely on a single sounding or draught reading. The damage-control manual, approved stability information, and competent shore-based support, where available, are considered together."},{"tr":"Öğretim noktası: Serbest yüzeyin etkisi, kullanılan hacme ve bölme geometrisine bağlıdır. Eğitimde gelişigüzel “balast basılarak düzeltilir” talimatı verilmez. [U1–U3]","en":"Teaching point: The effect of a free surface depends on the volume involved and compartment geometry. Training must not give an indiscriminate instruction to “correct the problem by taking ballast”. [U1–U3]"}]},{"id":"DMG-C04","family":"damage","title_tr":"C04 — Tank iskandili, sintine seviye izlemesi ve kayıt doğruluğu","title_en":"Tank soundings, bilge-level monitoring and record integrity","paragraphs":[{"tr":"Başlangıçta bilinen son tank/sintine seviyeleri karşılaştırma değeri olarak alınır. Yeni ölçüm; mahalin adı, zaman, ölçüm yöntemi, koşul ve varsa cihaz belirsizliği ile kaydedilir. Iskandil ve seviye alarmı birbirini tamamlar; farklı sonuçlar varsa neden araştırılır. Tek seferlik seviye düşük diye kaçak olmadığı sonucuna varılmaz. Ölçümlerin zaman içindeki eğimi, su girişinin azaldığına, sabitlendiğine veya hızlandığına ilişkin daha anlamlı bilgi sağlar.","en":"The last known tank and bilge levels are used as reference values. A new measurement is recorded with the name of the space, time, measurement method, conditions, and any instrument uncertainty. Soundings and level alarms complement one another; discrepancies must be investigated. A low level measured on one occasion does not establish that no leak exists. Trends over time provide more useful evidence of whether ingress is slowing, stable, or accelerating."},{"tr":"Öğretim noktası: Tehlikeli veya kapalı mahale ölçüm için izinsiz giriş yapılmaz; uzaktan ölçüm, uygun gözlem ve güvenli örnekleme tercih edilir.","en":"Teaching point: No one enters a hazardous or enclosed space without authorisation simply to obtain a measurement; remote readings, appropriate observation, and safe sampling are preferred."}]},{"id":"DMG-C05","family":"damage","title_tr":"C05 — Su girişi kaynağı ve ilerleyen su baskını","title_en":"Source of water ingress and progressive flooding","paragraphs":[{"tr":"Delik/çatlak, deniz suyu emiş hattı, şaft/şaft kovanı, boru flanşı, servis valfi, kaporta, güverte girişi veya yapısal hasar farklı kaynaklardır. Su girişinin gerçek yolu, ilk görülen ıslak mahallin dışına uzanabilir. Bir bölme doldukça su hava firarı, havalandırma, boru bağlantısı, kapı ve geçişlerden diğer bölmelere yayılabilir. Bu ilerleme kontrol edilmedikçe pompanın tek bir mahalde başarılı çalışması yeterli olmayabilir.","en":"A hole or crack, seawater intake line, shaft or stern tube, pipe flange, service valve, hatch, deck opening, and structural damage are different possible sources of ingress. The actual path taken by the water may extend beyond the first space found wet. As one compartment fills, water may spread through air vents, ventilation arrangements, pipe connections, doors, and penetrations to other spaces. Unless this progressive flooding is controlled, successful pumping in a single compartment may be insufficient."},{"tr":"Öğretim noktası: Kaynağın doğrulanmadığı durumda varsayımlar ayrı yazılır; tehlikeli mahalde su altı araştırması için plansız dalış yaptırılmaz.","en":"Teaching point: Where the source has not been confirmed, assumptions are recorded separately. No unplanned dive is undertaken to inspect a submerged hazard."}]},{"id":"DMG-C06","family":"damage","title_tr":"C06 — Hasar kontrol malzemeleri ve fiziksel geçici sınırlama","title_en":"Damage-control materials and temporary physical containment","paragraphs":[{"tr":"Tahta kama, yumuşak tıkaç, sızıntı sınırlayıcı malzeme, geçici yama, sızdırmazlık takımı, hortum, el aleti ve uygun taşınabilir pompanın hangi durumlarda yardımcı olabileceği öğretilir. Malzemelerin kullanılabilmesi erişim emniyeti, su basıncı, malzeme uyumu, yangın/elektrik tehlikesi ve gövde bütünlüğüne bağlıdır. Su basıncı nedeniyle yerinden çıkabilecek geçici yama “kalıcı onarım” gibi gösterilmez. Tekne üzerindeki yükleri değiştiren işlemler mühendislik değerlendirmesi gerektirebilir.","en":"Training explains where wooden wedges, soft plugs, leak-containment materials, temporary patches, sealing kits, hoses, hand tools, and suitable portable pumps may assist. Whether these materials can be used depends on safe access, water pressure, material compatibility, fire and electrical hazards, and hull integrity. A temporary patch that could be displaced by water pressure must not be presented as a permanent repair. Actions that change loads on the hull may require an engineering assessment."},{"tr":"Öğretim noktası: Eğitimde malzemenin yerinin gösterilmesi ile çalışır durumda test edilmesi ve gerçek delik kapatılması ayrı süreçlerdir.","en":"Teaching point: Showing where equipment is stowed, functionally testing it, and actually sealing a hull opening are three separate activities."}]},{"id":"DMG-C07","family":"damage","title_tr":"C07 — Sintine, kurtarma ve taşınabilir pompa sistemi","title_en":"Bilge, salvage and portable pumping arrangements","paragraphs":[{"tr":"Pompa, su giriş hızı karşısında ancak uygun emiş hattı, güç kaynağı ve deşarj yolu varsa etkilidir. Emiş süzgeci, çekvalf, boru tıkanması, hava yapma, pompa primi, kuru çalışma ve elektrik izolasyonu başlıca arıza konularıdır. Deşarjın tekrar hasarlı bölmeye dönmemesi, başka bir tankı istenmeden doldurmaması ve çevreye kirletici boşaltmaması kontrol edilir. Büyük debi tek başına başarı değildir: pompalama geminin oturma/hasar yüklerini, serbest yüzey etkisini veya dengesini değiştirebilir.","en":"A pump is effective against water ingress only if a suitable suction path, power supply, and discharge route are available. Suction strainers, non-return valves, pipe blockage, air locking, loss of prime, dry running, and electrical isolation are key failure topics. Checks include ensuring that discharge does not return to a damaged compartment, unintentionally fill another tank, or release pollutants into the environment. High pumping capacity is not sufficient by itself: pumping may alter grounding or damage loads, free-surface effects, or the vessel's equilibrium."},{"tr":"Öğretim noktası: Gerçek pompa çalıştırma yalnız emniyetli tesisat düzeninde ve yetkili personel gözetiminde gerçekleştirilir; örnek kayıtta fiilen çalışma/simülasyon farkı yazılır.","en":"Teaching point: A pump is actually operated only with a safe piping arrangement and under authorised personnel's supervision. The record must distinguish actual operation from simulation."}]},{"id":"DMG-C08","family":"damage","title_tr":"C08 — Elektrik, makine, dümen ve sevk sistemlerinin korunması","title_en":"Protection of electrical, machinery, steering and propulsion systems","paragraphs":[{"tr":"Su girişinde ıslanan elektrik panoları, kablo kanalları, aküler, sensörler ve motorların enerjili kalması elektrik çarpması ve yangın tehlikesi doğurur. Hasarlı sistemin izolasyonu yetkili makine personelinin gemiye özgü prosedürüne dayanır. Karaya oturmada pervane, şaft, dümen ve deniz suyu emişlerinde görünmeyen hasar bulunabilir; yalnız motorun çalışabilmesi sevkin güvenli olduğu anlamına gelmez. Kaptanın seyir ve manevra emniyeti kararları, makine dairesinin teknik değerlendirmesiyle koordineli yürütülür.","en":"If electrical switchboards, cable runs, batteries, sensors, or motors become wet during flooding and remain energised, electric shock and fire hazards may arise. Isolation of a damaged system follows the ship-specific procedures of authorised engineering personnel. A grounding may cause concealed damage to the propeller, shaft, rudder, or seawater intakes; the fact that the engine can run does not establish that propulsion is safe. The master's navigational and manoeuvring decisions are coordinated with the engine department's technical assessment."},{"tr":"Öğretim noktası: Talim sırasında gerçek ana makine stopu veya karartma, yalnız kontrol edilmiş gerçek operasyon koşullarında ayrıca yetkilendirilirse uygulanır; normal eğitimde senaryo olarak çalışılır.","en":"Teaching point: An actual main-engine stop or blackout is conducted in a drill only when separately authorised under controlled real operating conditions; in ordinary training it is treated as a scenario."}]},{"id":"DMG-C09","family":"damage","title_tr":"C09 — Haberleşme: köprüüstü–makine–hasar kontrol ekipleri","title_en":"Bridge–engine room–damage-control team communications","paragraphs":[{"tr":"Bilgi üç düzeyde ilerler: ilk ihbar, doğrulanmış hasar durumu ve zamana bağlı güncelleme. Mahallin adı, su giriş yeri, görülen seviye, personel emniyeti, izolasyon, kullanılan pompa ve değişim eğilimi kısa, standart ifadelerle aktarılır. Kaptan her ekibin görevini, ekipler de haberleşme kanalını ve yedek yöntemi bilir. Bir komutun alındığı, tekrarlandığı ve sonucu bildirildiği doğrulanır. Gürültü, enerji kaybı ve haberleşme kesintisi için önceden yedek iletişim belirlenir.","en":"Information progresses through three levels: the initial report, the verified damage status, and time-dependent updates. The space concerned, ingress location, observed level, personnel safety, isolation, pump in use, and trend are communicated in brief, standardised terms. The master knows each team's assignment, and teams know the communication channel and backup method. Receipt, read-back, and outcome reporting of an instruction are verified. Backup communications for noise, power loss, or communications failure are established in advance."},{"tr":"Öğretim noktası: “Durum kontrol altında” ifadesi somut gerekçeyle desteklenir; ölçüm yoksa “henüz ölçülmedi” denir.","en":"Teaching point: The expression “the situation is under control” must be supported by specific evidence; where no reading has been taken, state “not yet measured”."}]},{"id":"DMG-C10","family":"damage","title_tr":"C10 — Gelgit, deniz dibi, çevresel yükler ve zemin reaksiyonu","title_en":"Tides, seabed, environmental loads and ground reaction","paragraphs":[{"tr":"Karaya oturmada geminin ağırlığının bir bölümü deniz dibine aktarılabilir; bu durum yüzebilirliği, serbest bordayı, hasarlı bölgelerdeki gerilimi ve trim/meyili etkiler. Gelgit yükselmesi her zaman güvenli yeniden yüzdürme anlamına gelmez: gövdenin başka bölümü sürtünebilir veya su alan bir mahal açığa çıkabilir. Gelgit alçalması, artan zemin reaksiyonu ve lokal gerilmeler yaratabilir. Dip yapısı kum, çamur, kaya veya enkaz ise müdahale kararı değişir. Hava, rüzgâr, akıntı, dalga ve gemi yönünün etkileri birlikte ele alınır.","en":"Following grounding, part of a vessel's weight may be supported by the seabed, affecting buoyancy, freeboard, stresses in damaged areas, trim, and list. A rising tide does not necessarily mean safe refloating: another part of the hull could drag on the bottom or a flooded space could become exposed. A falling tide can increase ground reaction and local stresses. Response decisions depend on whether the bottom consists of sand, mud, rock, or wreckage. Weather, wind, current, waves, and vessel orientation are considered together."},{"tr":"Öğretim noktası: “Yüksek suda kendi kendine yüzer” ifadesi, planlı hasar ve stabilite değerlendirmesi olmadan olumlu bir sonuç olarak sunulmaz.","en":"Teaching point: The statement “she will refloat by herself at high water” must not be presented as a positive outcome without planned damage and stability assessment."}]},{"id":"DMG-C11","family":"damage","title_tr":"C11 — Yeniden yüzdürme, kurtarma ve dış destek kararları","title_en":"Refloating, salvage and external assistance decisions","paragraphs":[{"tr":"Yeniden yüzdürme (refloating) kararında geminin nereye oturduğu, hasar bölgesi, kalan yüzebilirlik, zemin reaksiyonu, gelgit penceresi, dalga/akıntı, römorkör kullanımı, sevk/dümen durumu ve muhtemel petrol kirliliği birlikte incelenir. Kendi makineleriyle geri çıkma girişimi veya kontrolsüz çekme, gövde hasarını büyütebilir. Yetkili kurtarma uzmanının değerlendirmesi, gerektiğinde klas/bayrak/işletme ve liman otoritesinin koordinasyonu aranır. Bu kart yeniden yüzdürmeye ilişkin bir teknik operasyon prosedürü değildir.","en":"A refloating decision considers where the vessel is aground, the damaged area, remaining buoyancy, ground reaction, the tidal window, waves and currents, tug assistance, propulsion and steering status, and potential oil pollution. Attempts to back off using the vessel's own machinery or uncontrolled towing may worsen hull damage. Assessment by a competent salvage specialist is sought, together with coordination with class, flag State, operator, and port authority as appropriate. This card is not a technical refloating procedure."},{"tr":"Öğretim noktası: “Hareket etmeme kararı”, şartlar oluşmamışsa önemli ve olumlu bir emniyet kararıdır.","en":"Teaching point: Where the necessary conditions are absent, a decision not to move the vessel is an important and positive safety decision."}]},{"id":"DMG-C12","family":"damage","title_tr":"C12 — Hasar stabilitesi destek araçları ve kıyı desteği","title_en":"Damage-stability decision-support tools and shore assistance","paragraphs":[{"tr":"Hasar kontrol planı, bölme yerleşimi, hidrostatiğe ilişkin onaylı bilgiler, stabilite kitabı, varsa onaylı bilgisayar/hasar stabilite sistemi ve kıyı teknik desteği kullanılır. Hesapların girdileri (baş/kıç draftı, tank seviyeleri, açıklık durumu, yük, hasar yeri, dolan bölmeler) gerçeği yansıtmadıkça çıktı güvenilir olmaz. Yazılım mevcutsa bile kullanıcı eğitimi ve programın gemiye uyarlanmış/onaylanmış olması gerekir. Kâğıt planın veya yazılımın hangi konularda yetersiz kaldığı ayrıca öğretilir.","en":"Relevant resources include the damage-control plan, compartment arrangement, approved hydrostatic information, stability booklet, any approved loading computer or damage-stability system, and shore-based technical support. Results cannot be reliable unless inputs—forward and aft draughts, tank levels, closure status, loading condition, damage location, and flooded compartments—reflect actual conditions. Even where software is installed, users must be trained and the program must be configured or approved for the specific vessel. Limitations of paper plans and software are taught separately."},{"tr":"Öğretim noktası: Hasar stabilite destek araçlarının her KEGM gemisinde aynı tipte bulunduğu varsayılmaz; gemiye uygun alternatif bilgi kanalları belirlenir. [U1–U4]","en":"Teaching point: Damage-stability support tools are not assumed to be identical across all KEGM vessels. Suitable alternative information channels are identified for each vessel. [U1–U4]"}]},{"id":"DMG-C13","family":"damage","title_tr":"C13 — COLREG işaretleri, seyir güvenliği ve dış bildirimler","title_en":"COLREG signals, navigational safety and external notifications","paragraphs":[{"tr":"Karaya oturmuş geminin gösterdiği fener ve şekiller, COLREG Kural 30 kapsamında ayrıdır; gerçek koşullar, gemi boyu ve uygun uygulanabilir hükümler dikkate alınır. Su alan gemi otomatik biçimde “kumanda altında olmayan” gemi sayılmaz. Başka gemileri uyarma, seyir emniyeti ve gerektiğinde trafik/liman otoritesini bilgilendirme, olay yerine ve kaptanın değerlendirmesine bağlıdır. DSC/VHF tehlike veya acelelik yayını, gerçek tehlike ve düzenlemelere uygun yapılır; tatbikat esnasında gerçek tehlike yayını taklit edilmez.","en":"Lights and shapes displayed by a vessel aground are addressed separately in COLREG Rule 30; actual conditions, vessel length, and the applicable provisions must be considered. A vessel taking on water does not automatically qualify as a vessel not under command. Warnings to other ships, navigational safety measures, and notifications to vessel traffic services or port authorities as necessary depend on the incident location and the master's assessment. DSC/VHF distress or urgency transmissions are made only for genuine circumstances and in accordance with the applicable rules; an actual distress broadcast is not imitated during a drill."},{"tr":"Öğretim noktası: Raporun “gerçek Mayday yayınlandı” ifadesi ancak gerçek yayın yapıldıysa kullanılır; talimde “yayın usulü simüle edildi” şeklinde yazılır. [U5]","en":"Teaching point: A report may say “an actual Mayday was transmitted” only if it was. A drill should instead state that “the transmission procedure was simulated”. [U5]"}]},{"id":"DMG-C14","family":"damage","title_tr":"C14 — Kirlilik, yakıt tankları ve çevre koruma bağlantısı","title_en":"Pollution, fuel tanks and environmental protection","paragraphs":[{"tr":"Karaya oturma veya su alma sonrasında yakıt tankı, yağ devresi, atık tankı ve sintinelerde sızıntı tehlikesi değerlendirilir. Yakıt veya kirletici madde dışarı kaçmışsa olay, SOPEP/SMPEP kapsamında değerlendirilmesi gereken ayrı çevresel olay boyutu kazanır. İlk müdahale malzemelerinin hazırlığı, sızıntı kaynağının emniyetli izolasyonu, gözlem ve bildirim konuları önceki POLLUTION_COMMON ile paylaşılır. Hasarlı tanktaki sıvının aktarılması, yeni tankı aşırı doldurabilecek veya hasarlı gövdenin gerilimini değiştirebilecek bir işlem olduğundan koşulsuz çözüm değildir.","en":"After grounding or flooding, the risk of leakage from fuel tanks, oil systems, waste tanks, and bilges is assessed. If fuel or another pollutant escapes, the incident acquires a separate environmental dimension that may require assessment under SOPEP/SMPEP. Preparation of initial-response equipment, safe isolation of the source, monitoring, and notification are shared with POLLUTION_COMMON. Transferring liquid from a damaged tank is not an unconditional remedy: it could overfill a receiving tank or alter stresses on the damaged hull."},{"tr":"Öğretim noktası: “Döküntü görülmedi” gözlemiyle “tank hasarsızdır” tespiti eşdeğer değildir.","en":"Teaching point: An observation that “no spill was seen” is not equivalent to a finding that “the tank is undamaged”."}]},{"id":"DMG-C15","family":"damage","title_tr":"C15 — Risk değerlendirmesi ve fiziksel talim sınırı","title_en":"Risk assessment and limits on physical drill activities","paragraphs":[{"tr":"Talimde emniyet riski ile senaryo gereği tartışılan gerçek kaza riski ayrı ele alınır. Gerçek kapak kapatma, pompa çalıştırma, ölçüm, alarm gösterimi veya yedek enerji kullanımı gibi faaliyetler ancak mevcut gemi operasyonunu bozmayacak koşullarda yürütülür. Denize gerçek yağ dökülmez; gemi isteyerek karaya oturtulmaz; yangın/elektrik/şaft tehlikesine girilmez; gerçek GMDSS tehlike yayını yapılmaz. Personel emniyetinin, trafik veya çevre güvenliğinin bozulması hâlinde talim durdurulur.","en":"Risks arising from performance of the drill are considered separately from the risks of the actual casualty being discussed. Closing real hatches, operating pumps, taking measurements, demonstrating alarms, or using backup power is permitted only under conditions that do not disrupt the vessel's ongoing operations. No actual oil is released at sea, the vessel is not intentionally grounded, personnel are not exposed to fire, electrical or shaft hazards, and no real GMDSS distress transmission is made. The drill is stopped if personnel, traffic, or environmental safety is compromised."},{"tr":"Öğretim noktası: Gösterim ve simülasyon, fiilî mekanik/elektrik işlemden açıkça ayrılır; risk formundaki geçmiş puan yeni faaliyet için otomatik kabul edilmez.","en":"Teaching point: Demonstration and simulation are explicitly distinguished from actual mechanical or electrical operations. Historical scores on a risk assessment form are not automatically accepted for a new activity."}]},{"id":"DMG-C16","family":"damage","title_tr":"C16 — Kayıt, zaman çizelgesi ve kanıtların muhafazası","title_en":"Records, incident timeline and evidence preservation","paragraphs":[{"tr":"Talimde hangi olayın hangi saatte anons edildiği, hangi ekibin hangi işlemi gösterdiği ve gerçek/simüle kontrol sonucu belirgin olmalıdır. Gerçek kaza durumunda jurnal, ECDIS/güzergâh kayıtları, VDR/seyir verileri (varsa), makine trendleri, iskandil çizelgesi, fotoğraf ve yazışmaların kurum usulüne göre korunması önemlidir. Talim için örnek senaryo yazıldığında gerçek kazaya ait elektronik kayıtlar üretilmiş gibi gösterilmez. İlk rapor ve gelişme raporu farkı, düzeltici faaliyet ve tekrar eğitim gereksinimi anlatılır.","en":"Drill records should clearly identify when each scenario event was announced, which team demonstrated each action, and whether the check and its outcome were real or simulated. In an actual casualty, it is important to preserve, in accordance with organisational procedures, the logbook, ECDIS/track records, VDR/navigation data where fitted, machinery trends, sounding records, photographs, and correspondence. An exercise scenario must not suggest that electronic records of an actual casualty were created. The distinction between initial and progress reports, corrective action, and any need for refresher training is explained."},{"tr":"Öğretim noktası: EK-V, olay/kontrol formu, jurnal, teknik arıza bildirimi ve çevre kaydı farklı işlevler görür; biri diğerinin yerine konulmaz.","en":"Teaching point: The EK-V drill record, incident/control checklist, logbook, technical defect report, and environmental record serve different purposes and are not interchangeable."}]},{"id":"POL-C01","family":"pollution","title_tr":"C01 — Yağ/yakıt kirliliğinde ilk öncelikler","title_en":"Initial priorities in oil and fuel pollution incidents","paragraphs":[{"tr":"Olayın ilk dakikalarında can emniyeti → emniyetli şekilde kaynak kontrolü → denize kaçış yolunun kesilmesi → çevresel yayılımın sınırlanması → bildirim ve koordinasyon düşünülür. Personelin yangın, buhar, basınçlı yağ, dönen ekipman, kayma-düşme veya denize düşme tehlikesi altında kalarak hızlı müdahale etmeye çalışması uygun değildir. Talimde, bu sıralamanın herhangi birinin diğerini tamamen ortadan kaldırmadığı anlatılır; örneğin çevre tedbiri alınırken yangın ve stabilite riski gözden kaçırılmaz.","en":"In the first minutes of an incident, the priorities are considered in sequence: life safety; controlling the source safely; blocking paths by which oil could reach the sea; limiting environmental spread; and notification and coordination. Personnel must not attempt rapid intervention while exposed to fire, vapour, pressurised oil, rotating machinery, slips and falls, or falling overboard. Training explains that these priorities do not negate one another: for example, fire and stability risks must not be overlooked while environmental precautions are being taken."},{"tr":"Öğretilecek karar: “Sızıntı durdu mu?”, “Yağ güvertede mi, suya ulaştı mı?”, “Personel ve gemi emniyetli mi?” soruları ayrı ayrı cevaplandırılır. Bunların hiçbirine yalnızca koku veya gözle görülen leke üzerinden kesin hüküm verilmez.","en":"Decision to be taught: “Has the leak stopped?”, “Is the oil on deck or has it reached the water?”, and “Are personnel and the vessel safe?” are answered separately. None of these conclusions is established solely from a smell or a visible stain."}]},{"id":"POL-C02","family":"pollution","title_tr":"C02 — Kirletici maddenin tanınması","title_en":"Identification of the pollutant","paragraphs":[{"tr":"Deniz yakıtı, deniz dizeli, yağlama yağı, hidrolik yağ, atık yağ, yağlı sintine ve diğer işletme sıvıları aynı tür ve davranıştaki kirleticiler değildir. Malzemenin güvenlik bilgi formu (SDS), kullanılan devre, tahmini sıcaklık, viskozite ve miktar değerlendirilir. Akışkanlığın, uçuculuğun ve tutuşabilirliğin müdahaleye etkisi açıklanır. “Yağ gördük” ifadesi kirleticinin türünü belgelemek için tek başına yeterli değildir.","en":"Marine fuel oil, marine diesel oil, lubricating oil, hydraulic oil, waste oil, oily bilge water, and other operating fluids are not pollutants of identical type or behaviour. The material's safety data sheet (SDS), the system involved, estimated temperature, viscosity, and quantity are assessed. The effects of fluidity, volatility, and flammability on the response are explained. Saying “we saw oil” is not, by itself, sufficient to document the pollutant's identity."},{"tr":"İşaret: Maddenin türü bilinmiyorsa, personel malzemeyi güvenli varsaymaz; uygun KKD, temassız gözlem ve yetkili bilgi edinme yöntemi kullanılır.","en":"Warning: Where the substance is unknown, personnel must not assume it is safe; appropriate PPE, non-contact observation, and authorised means of obtaining information are used."}]},{"id":"POL-C03","family":"pollution","title_tr":"C03 — SOPEP / SMPEP ve olay komuta düzeni","title_en":"SOPEP / SMPEP and incident command arrangements","paragraphs":[{"tr":"Bir gemi kirlilik planında görev dağılımı, ilk müdahale, dış bildirim, olay koordinasyonu ve irtibat listeleri yer alır. Planı kimlerin kullandığı, nerede bulunduğu, hangi nüshanın geçerli olduğu ve güncel kıyı temas noktalarının nasıl temin edildiği öğretilir. Kaptan olay yönetimi ve dış koordinasyon kararından; makine ve güverte sorumluları kendi ekipmanı ve manevrası konusunda bilgi akışından sorumludur. Bu görev dağılımı gemi role cetveli ile doğrulanır; örnek personel adı yazılmaz.","en":"A shipboard pollution plan covers the allocation of duties, initial response, external reporting, incident coordination, and contact lists. Training explains who uses the plan, where it is kept, which copy is valid, and how up-to-date shore contact details are obtained. The master is responsible for incident-management and external-coordination decisions, while the engineering and deck officers are responsible for information flow concerning their equipment and operations. This allocation is checked against the ship's muster list; fictitious personnel names are not inserted."},{"tr":"IMO, ulusal operasyonel irtibat noktaları listesinin SOPEP ile birlikte güncel olarak gemide tutulması gerektiğini belirtir. Örnek belgeye eski bir telefon numarası gömülmez. (IMO, t.y.-a.)","en":"IMO states that the list of national operational contact points should be kept up to date on board alongside the SOPEP. An obsolete telephone number is not embedded in a sample document. (IMO, n.d.-a.)"}]},{"id":"POL-C04","family":"pollution","title_tr":"C04 — Risk değerlendirmesi ve işbaşı emniyet konuşması","title_en":"Risk assessment and pre-job safety briefing","paragraphs":[{"tr":"Talimin fiilen yapılacak bölümünde hava/deniz şartları, kaygan güverte, aydınlatma, kenar emniyeti, tank/hat basıncı, sıcak yüzey, yanıcı buhar, statik elektrik, kimyasal maruziyet, kaldırma donanımı, atık toplanması ve aynı anda yürüyen işler gözden geçirilir. Risk kontrolünde kaynağı ortadan kaldırma/izole etme, mühendislik tedbirleri, organizasyon ve KKD sıralaması kullanılır; KKD tek tedbir sayılmaz.","en":"For the practical part of a drill, weather and sea conditions, slippery decks, lighting, edge protection, tank and line pressure, hot surfaces, flammable vapours, static electricity, chemical exposure, lifting appliances, waste collection, and simultaneous operations are reviewed. Risk controls follow the hierarchy of eliminating or isolating the source, engineering controls, organisational measures, and PPE; PPE is not treated as the sole control."},{"tr":"Talim sonucu: Önceki bir risk formunun puanı veya kabul işareti kopyalanmaz. Eğitici içerik herhangi bir onaylı risk analizi yerine geçmez.","en":"Drill outcome: Neither a risk score nor an approval marking from an earlier assessment is copied forward automatically. Training material does not replace an approved risk assessment."}]},{"id":"POL-C05","family":"pollution","title_tr":"C05 — Tank seviyeleri, dolum/transfer planı ve taşma göstergeleri","title_en":"Tank levels, loading/transfer plan and overfill indicators","paragraphs":[{"tr":"Tank kapasitesi, kullanılabilir hacim, ullage/iskandil, dolum oranı, transfer pompası kapasitesi, hat yönlendirme ve tahliye/overflow güzergâhı birlikte incelenir. Alarmların varlığı ve gösterdiği seviye, bağımsız ölçümün yerine koşulsuz geçmez. Yanlış vana dizilimi, beklenmeyen geri dönüş, ölçü cihazı arızası, gecikmiş haberleşme ve aynı anda farklı tanklara operasyon yapılması olası senaryo nedenleridir.","en":"Tank capacity, available volume, ullage or sounding, filling rate, transfer-pump capacity, line configuration, and overflow or discharge routes are examined together. The presence of alarms and their indicated levels do not unconditionally replace independent measurement. Incorrect valve alignment, unexpected backflow, instrument failure, delayed communication, and simultaneous operations involving different tanks are possible scenario causes."},{"tr":"Eğitim sorusu: “Seviye yükselmesini hangi iki bağımsız bilgiden teyit ederiz?” Gemi üzerindeki gerçek ölçüm ve planlama imkânı esas alınır.","en":"Training question: “Which two independent sources of information can confirm a rising level?” The ship's actual measurement and planning arrangements are used."}]},{"id":"POL-C06","family":"pollution","title_tr":"C06 — Transferin ve ilgili operasyonların durdurulması","title_en":"Stopping transfer and related operations","paragraphs":[{"tr":"Kaynak kontrolünde yetkili kişinin emriyle uygun dur komutu, varsa acil stop, pompa/valf/hortum izolasyonu ve enerji kesme usulleri birbirinden ayrılır. Yağ veya yakıt transferi sırasında sızıntı tespit edildiğinde, yanlış tank/hat seçimi ve basınç etkileri değerlendirilmeden başka bir devreye körlemesine transfer başlatılmaz. Hidrolik sistemde enerji durdurulsa bile hapsolmuş basınç kalabilir.","en":"To control the source, a normal stop order, emergency shutdown if fitted, pump/valve/hose isolation, and energy-isolation procedures are distinguished and carried out under the appropriate person's authority. If a leak is detected during an oil or fuel transfer, another transfer is not started blindly before the incorrect tank or line selection and pressure effects have been assessed. Pressure may remain trapped in a hydraulic system even after its power source has been stopped."},{"tr":"Talim emniyeti: Gerçek ESD'ye basma, enerji kesme, güç devri ve aktif yakıt transferi ancak geminin yürürlükteki onaylı prosedürü, risk değerlendirmesi ve kaptan/makine sorumlusunun yetkisiyle yapılır. Diğer durumda karar adımı senaryo üzerinden gösterilir.","en":"Drill safety: Actuating an actual ESD, isolating power, transferring electrical load, or conducting an active fuel transfer is permitted only under the ship's currently approved procedure, risk assessment, and the authority of the master or responsible engineer. Otherwise the decision step is demonstrated through the scenario."}]},{"id":"POL-C07","family":"pollution","title_tr":"C07 — Frengi, tahliye, toplanma kuyuları ve güvertede sınırlandırma","title_en":"Scuppers, overboard discharges, save-alls and deck containment","paragraphs":[{"tr":"Yağın denize çıkabileceği frengi/overboard yolları, güverte drenajı, bağlantı mahalli, sızıntı toplama kuyusu ve biriktirme kapasitesi belirlenir. Uygun drenaj tapası veya bariyerin nerede, hangi koşulda kullanılacağı öğretilir. Ancak yangın suyu, yağmur, gemi stabilitesi, güvenli tahliye ve güvertede su birikmesi tehlikeleri göz ardı edilerek bütün tahliye yollarının sürekli körlenmesi önerilmez.","en":"Identify scuppers and overboard paths through which oil could reach the sea, deck drainage, connection areas, spill collection wells, and retention capacity. Training shows where and under which conditions suitable drain plugs or barriers may be used. However, permanently blocking all drainage without considering firefighting water, rain, vessel stability, safe drainage, and the accumulation of water on deck is not recommended."},{"tr":"Eğitim uygulaması: Gerçek, temiz ve kuru malzemeler kullanılarak frengi noktası işaretlenir; emici malzeme yerleştirme düzeni gösterilir. Talim için denize gerçek yağ verilmez.","en":"Training activity: Scupper locations are identified and arrangements for positioning sorbents are demonstrated using clean, dry equipment. No oil is actually released into the sea for the drill."}]},{"id":"POL-C08","family":"pollution","title_tr":"C08 — Kaçağın yeri ve tekne/boru bütünlüğü","title_en":"Locating leaks and assessing hull/piping integrity","paragraphs":[{"tr":"Kaynak, yalnızca lekelenmenin görüldüğü yer olmayabilir. Kaynak–kaçış yolu–birikme noktası ayrımı yapılır. Manifold contası, hortum/kuplaj, tank havalığı, overflow, hidrolik fitting, boru ve valf sızdırmazlığı ile güverte altı bağlantıların olası rolleri değerlendirilir. Boru izolasyonu, sıvı akışının beklenmedik yönlere değişmesini önleyecek şekilde planlanır.","en":"The source of a leak may not be the point at which staining is visible. The source, escape path, and accumulation point are distinguished. Possible contributions from a manifold gasket, hose or coupling, tank vent, overflow, hydraulic fitting, pipe or valve seal, and below-deck connection are considered. Pipe isolation is planned to avoid diverting liquid unexpectedly to other areas."},{"tr":"Sınır: Basınçlı hortum/yağ kaçağına elle müdahale edilmez; delici basınçlı sıvı yaralanmaları görünüşte küçük olsa da ağır olabilir. Hasar incelemesi, kapalı mahal veya sualtı inceleme gerektiriyorsa ayrı izin ve uzmanlık gerektirir.","en":"Limit: Do not intervene manually in a pressurised hose or oil leak; high-pressure fluid injection injuries may be severe even when they appear minor. If damage investigation requires enclosed-space entry or underwater inspection, separate authorisation and competence are required."}]},{"id":"POL-C09","family":"pollution","title_tr":"C09 — Yangın/patlama, kimyasal maruziyet ve statik elektrik","title_en":"Fire, explosion, chemical exposure and static electricity","paragraphs":[{"tr":"Yakıt sızıntısının kaynağına göre yanıcı buhar ve buharlaşma, sıcak yüzeyler, elektrikli ekipman, statik yük, havalandırma durumu ve ateşleme kaynakları incelenir. Yakıt türü, sıcaklığı ve ortamın havalandırılması riskin düzeyini değiştirir. Müdahale ekipleri uygun antistatik/alev dayanımı ve kimyasal temas koşullarını karşılayan KKD'yi, SDS ve işin niteliğine göre seçer.","en":"Depending on the fuel-leak source, flammable vapours and evaporation, hot surfaces, electrical equipment, static charge, ventilation conditions, and ignition sources are examined. Fuel type, temperature, and ventilation change the level of risk. Response teams select PPE suitable for anti-static or flame-resistance requirements and chemical contact on the basis of the SDS and the nature of the task."},{"tr":"Gözden geçirilmesi gereken konu: Bilinmeyen buhar atmosferinde standart elektrikli aydınlatma veya uygunluğu doğrulanmamış pompa/süpürme ekipmanı çalıştırılmaz.","en":"Review point: Ordinary electrical lighting, or pumping or recovery equipment whose suitability has not been verified, must not be operated in an atmosphere containing unidentified vapours."}]},{"id":"POL-C10","family":"pollution","title_tr":"C10 — Emici ped, emici bariyer ve malzeme seçimi","title_en":"Sorbent pads, sorbent booms and material selection","paragraphs":[{"tr":"Yağ emici ürünler (pad/roll/sosis/boom) malzeme türü, emme ve tutma kapasitesi, yüzerlik, kimyasal uyumluluk ve atık hacmine göre seçilir. Emici malzeme, sızıntı kaynağı kesilmeden sınırsız çözüm oluşturmaz; gereksiz kullanımı tehlikeli atık miktarını artırır. Kontamine malzeme uygun şekilde toplanır, ayrıştırılır ve geçerli atık yönetimi usulüne göre saklanır. (ITOPF, 2014b.)","en":"Oil sorbent products—pads, rolls, socks, and booms—are selected with regard to material type, absorption and retention capacity, buoyancy, chemical compatibility, and the volume of waste generated. Sorbents are not an unlimited solution if the source of the leak has not been stopped; unnecessary use increases hazardous-waste quantities. Contaminated material is collected, segregated, and stored in accordance with applicable waste-management procedures. (ITOPF, 2014b.)"},{"tr":"Eğitim uygulaması: Temiz pedlerin kuru alanda serilmesi, yerleştirilmesi ve atık kabına alınması maketle gösterilebilir; gerçek yakıt kullanılması gerekmez.","en":"Training activity: Laying out clean pads on a dry surface, positioning them, and placing them in a waste container may be demonstrated with a mock-up; actual fuel is not required."}]},{"id":"POL-C11","family":"pollution","title_tr":"C11 — Deniz bariyerleri: tutma ve yönlendirme","title_en":"Marine containment and diversion booms","paragraphs":[{"tr":"Deniz yüzeyindeki bariyer, yayılımı sınırlamak veya uygun bir toplama noktasına yönlendirmek için kullanılır. Yüzdürme elemanı, su altı etek, germe elemanı, bağlantı, ankraj ve uygun serme geometrisi tanıtılır. Akıntı, gelgit, rüzgâr, dalga, yağ viskozitesi ve gemi hareketi başarısını etkiler. Bariyerin görünüşte kurulmuş olması, yağın tutulacağı anlamına gelmez. (ITOPF, 2014a.)","en":"A boom on the sea surface is used to contain spreading oil or direct it towards a suitable recovery point. Its flotation element, submerged skirt, tension member, connections, anchoring, and appropriate deployment geometry are introduced. Currents, tides, wind, waves, oil viscosity, and vessel movement affect effectiveness. A boom that appears to have been deployed does not necessarily retain oil. (ITOPF, 2014a.)"},{"tr":"Emniyet: Halat/gergi altında personel bulundurulmaması, açık borda işi ve küçük bot operasyonunun ayrıca risklendirilmesi, seyir trafiği ve işaretlemenin değerlendirilmesi gerekir.","en":"Safety: Personnel must be kept clear of lines and tensioning arrangements under load; work at the ship's side and small-boat operations require separate risk assessments, while marine traffic and marking must also be considered."}]},{"id":"POL-C12","family":"pollution","title_tr":"C12 — Skimmer, vakum ve toplanan sıvının geçici depolanması","title_en":"Skimmers, vacuum recovery and temporary storage","paragraphs":[{"tr":"Skimmer, uygun yağın su yüzeyinden alınması için kullanılan mekanik geri kazanım aracıdır; her yağ tipine ve her deniz durumuna uygun değildir. Yağın viskozitesi, dalga, akıntı, su–yağ karışımı ve depolama hacmi kullanım kararını belirler. Geri kazanılan karışımın nereye aktarılacağı, konteyner ve tankın emniyet/uyumluluk durumu, geri basma/taşma tehlikesi ve son atık teslimi önceden düşünülür. (ITOPF, t.y.)","en":"A skimmer is a mechanical recovery device used to remove suitable oil from the water surface; it is not suitable for every oil type or sea state. Oil viscosity, waves, current, the water–oil mixture, and storage capacity govern its use. The destination of recovered liquid, the safety and compatibility of containers and tanks, the risks of backflow and overflow, and ultimate waste disposal are considered in advance. (ITOPF, n.d.)"},{"tr":"Eğitim sorusu: “Toplanan yağ-su karışımını nereye güvenli şekilde alacağız?” cevapsızsa gerçek geri kazanım harekâtına başlanmaz.","en":"Training question: “Where can we safely put the recovered oil–water mixture?” If there is no answer, actual recovery operations must not begin."}]},{"id":"POL-C13","family":"pollution","title_tr":"C13 — Denize yayılımın gözlemlenmesi ve miktar belirsizliği","title_en":"Monitoring pollution spread and quantity uncertainty","paragraphs":[{"tr":"Sızıntı kaynağının hacimsel akışı ile deniz yüzeyindeki lekenin görünür alanı farklı büyüklüklerdir. Gemi konumu, olay saati, rüzgâr/akıntı, lekenin yönü, uzanımı, görünür renk ve yoğunluk, fotoğraf ve gözlem noktası ayrı belirtilir. Yüzey alanından tek başına kesin litre hesabı yapılamaz; tahmin yöntemi ve belirsizlik not edilmelidir. Uydu/drone/tekne görüntülerinin erişimi de duruma göre değişir.","en":"The volumetric flow from a leak and the visible area of a slick on the sea surface are different quantities. Vessel position, incident time, wind and current, slick direction and extent, visible colour and thickness, photographs, and the observation point are recorded separately. A definitive volume in litres cannot be derived from surface area alone; the estimation method and uncertainty must be stated. Access to satellite, drone, or boat imagery varies with circumstances."},{"tr":"Kayıt ilkesi: “Denizde yağ yok” hükmü, yalnızca hangi kapsamda gözlem yapıldığını belirten kayıtla desteklenir; gözlenemeyen bölgeler için kesin sonuç yazılmaz.","en":"Recording principle: A conclusion that “there is no oil at sea” must be supported by a record specifying the extent of the observation; no definitive conclusion is entered for areas that could not be observed."}]},{"id":"POL-C14","family":"pollution","title_tr":"C14 — Bildirim zinciri ve gerçek/tatbikat haberleşmesi","title_en":"Notification chain: real incidents versus exercises","paragraphs":[{"tr":"SOPEP/SMPEP ve ulusal uygulama çerçevesinde kaptan, şirket/DPA, liman/terminal, kıyı devletinin irtibat noktası ve diğer ilgili tarafların hangi koşullarda bilgilendirileceği incelenir. Olayın gemi bilgisi, UTC/yerel zaman, konum, kirleticinin tipi ve tahmini miktarı, alınan tedbir, ihtiyaç duyulan yardım ve güncelleme zamanları kayıt düzeninde tutulur. MARPOL Protokol I olay raporlamasının bu temel unsurlarını açıklar. (IMO, 1973/1978, Protokol I.)","en":"Within the SOPEP/SMPEP and national implementation framework, training examines the circumstances in which the master, company or designated person ashore (DPA), port or terminal, coastal-State contact point, and other relevant parties are notified. Vessel particulars, UTC/local time, location, pollutant type and estimated quantity, measures taken, assistance needed, and times of updates are maintained in the incident record. MARPOL Protocol I describes these fundamental elements of incident reporting. (IMO, 1973/1978, Protocol I.)"},{"tr":"Talim güvenliği: Gerçek olay yokken liman otoritesine gerçek kirlilik ihbarı veya fiilî yardım talebi otomatik gönderilmez; önceden planlanmış, açıkça TALİM/EXERCISE işaretli bağlantı veya masa başı bildirim uygulaması seçilir. Gerçek telefon numarası kamuya açık HTML içine gömülmez.","en":"Drill safety: In the absence of an actual incident, a real pollution report or actual request for assistance is not automatically sent to a port authority. Use a pre-arranged contact explicitly identified as DRILL/EXERCISE or a tabletop reporting exercise. Real telephone numbers are not embedded in a public HTML file."}]},{"id":"POL-C15","family":"pollution","title_tr":"C15 — Numune, dispersant ve müdahale yöntemi sınırları","title_en":"Sampling, dispersants and limits of response methods","paragraphs":[{"tr":"Numune alma, delil ve analiz açısından yararlı olabilir; fakat kontamine alana giriş, temiz numune kabı, etiket, güvenli saklama ve gerektiğinde resmî zincirleme teslim usulü gerektirir. Her talimde numune alındığı varsayılmaz. Kimyasal dispersant denizdeki yağı toplamak yerine fiziksel davranışını değiştirir; denizel ekosistem, yerel koşullar ve yetkili izin boyutu vardır. Türkiye için Bakanlık izni/uygun görüşü olmaksızın kullanımı kamu kaynağında açıkça yasak olarak bildirilir. (Çevre Yönetimi Genel Müdürlüğü, t.y.)","en":"Sampling can help preserve evidence and support analysis, but requires safe access to the contaminated area, a clean sample container, labelling, secure storage, and, where necessary, formal chain-of-custody procedures. Sampling is not assumed to occur in every drill. A chemical dispersant changes the physical behaviour of oil in the sea rather than collecting it, and its use raises marine-ecosystem, local-condition, and authorisation considerations. A public source states that dispersants may not be used in Türkiye without permission or a favourable opinion from the Ministry. (General Directorate of Environmental Management, n.d.)"},{"tr":"Eğitim ilkesi: Personel, güverteden veya botla bilinçsizce deterjan/dispersant dökerek yağı “temizlemeyi” olağan müdahale olarak öğrenmez.","en":"Training principle: Personnel must not learn indiscriminate application of detergent or dispersant from deck or a boat as a routine method of “cleaning up” oil."}]},{"id":"POL-C16","family":"pollution","title_tr":"C16 — Olayın kapanışı, atık ve öğrenilen dersler","title_en":"Incident close-out, waste management and lessons learned","paragraphs":[{"tr":"Kaynak kontrolü, yüzey/güverte temizlik durumu, kullanılabilir ekipmanların iadesi, toplanan sıvı ve kontamine malzeme miktarı, atık depolama/teslim planı, sızdırmazlık-onarım, raporlama ve takip faaliyeti birbirinden ayrılır. Olay sonunda “görünür yağ kalmadı” değerlendirmesi, çevresel etkinin sona erdiğine tek başına kanıt değildir. Talimde kronoloji, haberleşme ve malzeme hazır bulunma eksikleri belirlenir; gerekiyorsa düzeltici faaliyet açılması yetkili kuruma bırakılır.","en":"Control of the source, condition of the sea surface and deck after cleaning, return of serviceable equipment, quantities of recovered liquid and contaminated material, plans for waste storage and disposal, leak-tightness and repair, reporting, and follow-up measures are treated separately. An assessment that “no visible oil remains” is not, by itself, proof that the environmental impact has ended. The drill identifies deficiencies in chronology, communications, and equipment readiness; the decision to initiate corrective action is left to the competent organisation."}]},{"id":"LB-C01","family":"lifeboat","title_tr":"Can filikası ne için tasarlanır?","title_en":"Purpose of a lifeboat","paragraphs":[{"tr":"Can filikası, geminin terk edilmesi hâlinde insanları denizde hayatta tutmaya yarayan, ilgili LSA şartlarına göre onaylı bir survival craft türüdür. Kurtarma botu ise öncelikle denizdeki kazazedenin veya can kurtarma aracının kurtarılmasına ve yönlendirilmesine odaklanır. Bir kurtarma botu, yalnızca ayrıca gerekli standartta onaylıysa can filikası işlevi görebilir; bu durum araç üzerindeki belge ve sertifikalarla doğrulanır. Hizmet botunun personel veya ekipman taşıması da onu otomatik olarak filika hâline getirmez. Eğitimde her geminin gerçek donanım planı kullanılır; kapasite, borda yerleşimi ve sertifika bilgileri önceden bilinmiş sayılmaz.","en":"A lifeboat is a type of survival craft approved under the applicable LSA requirements to keep people alive at sea if the ship is abandoned. A rescue boat, by contrast, is primarily intended to recover persons in the water or assist and marshal survival craft. A rescue boat can serve as a lifeboat only if it has also been approved to the required standard; this must be verified from the craft's documents and certificates. Carrying personnel or equipment in a service boat does not automatically make that craft a lifeboat. Training uses the actual equipment plan of each vessel; capacity, side arrangement, and certification details are not assumed in advance."}]},{"id":"LB-C02","family":"lifeboat","title_tr":"Filika tipleri ve indirme esasları","title_en":"Lifeboat types and launching principles","paragraphs":[{"tr":"Mataforayla indirilen filika, askı telleri ve bırakma tertibatı üzerinden kontrollü indirilir. Serbest düşüşlü (free-fall) filika ise farklı bir rampaya/yerleşime ve serbest bırakma sistemine sahiptir; eğitim planı bu tasarıma göre farklılaşır. Açık, kısmen kapalı ve tamamen kapalı filika sınıfları da bulunur. Her filikanın suya indirilme usulü, motoru ve geri alma koşulu aynı değildir. Bu nedenle ekranda filika türü doğrulanmadan “mandalı aç, kancayı çöz, vinci çalıştır” türünde tek tip mekanik komutlar verilmez. Eğitimde gerçek modelin etiketleri, kumanda şeması ve üretici el kitabı gösterilir.","en":"A davit-launched lifeboat is lowered in a controlled manner using suspension falls and a release arrangement. A free-fall lifeboat has a different ramp or
