e.","evidence":[["EYS.07.126.FR","Dynamic Positioning (DP) Gemi Spesifik Konum Kontrol Formu","ISM Manuel Full Versiyon.pdf","PDF s. 198","yalnız form listesi"]],"category":"conditional","reconciled_2023":null},{"id":"diving","title_tr":"Dalış Operasyonunda Acil Durum — Aday Konu","title_en":"Diving-Operation Emergency — Candidate","summary_tr":"Dalış sırasında oluşabilecek acil olayların; dalış ekibi, destek gemisi ve haberleşme yönünden kontrollü kaynak incelemesi için ayrı bir konu olarak tanımlanması.","summary_en":"Identify emergencies arising during diving as a separate subject for source-controlled examination of the dive team, support vessel and communications.","boundary_tr":"Dalışın gemide yapıldığı veya hangi dalış prosedürünün güncel ve uygulanabilir olduğu doğrulanmadı. Operasyonel kurtarma veya dekompresyon talimatı oluşturulmadı.","boundary_en":"It has not been confirmed that diving is conducted aboard the vessel or which diving procedure is current and applicable. No operational rescue or decompression instructions are provided.","evidence":[["EYS.07.129.FR","Dalış Kontrol Formu","ISM Manuel Full Versiyon.pdf","PDF s. 199","yalnız form listesi"]],"category":"conditional","reconciled_2023":null}],"vessel":{"version":"RC1","date":"2026-11-06","vessel":"NENE HATUN","vessel_imo":"9675004","usage_status":"OFFLINE_REVIEW_RELEASE_CANDIDATE_NOT_ERP_APPROVED","sources":[{"document":"Nene Hatun Denize Elverişlilik.pdf","page":2,"issue_date":"2026-05-13","type":"official_ship_specific_certificate"},{"document":"Emniyet Ekipman Sertifikası.pdf","pages":[1,2,5,6,7],"issue_date":"2026-05-05","type":"classification_certificate_and_equipment_record"},{"document":"user_direct_statement","date":"2026-11-06","type":"user_statement_for_equipment_name"}],"ship_equipment":[{"key":"lifeboat","tr":"Can filikası","en":"Lifeboat","quantity":0,"capacity_persons":0,"evidence":"Denize Elverişlilik s.2; Emniyet Ekipmanı Form E s.5","status":"certificate_recorded"},{"key":"rescue_boat","tr":"Kurtarma botu / FRC","en":"Rescue boat / FRC","quantity":1,"capacity_persons":15,"evidence":"Denize Elverişlilik s.2; Emniyet Ekipmanı Form E s.5","status":"quantity_capacity_certified_frc_naming_user_reported"},{"key":"service_boat","tr":"Hizmet botu / daughter craft (Munin 1000)","en":"Service boat / daughter craft (Munin 1000)","quantity":1,"capacity_persons":24,"evidence":"Denize Elverişlilik s.2 (sayı ve kapasite); kullanıcı beyanı (Munin 1000)","status":"quantity_capacity_certified_model_user_reported"},{"key":"liferafts","tr":"Can salları","en":"Liferafts","quantity":6,"capacity_persons":210,"evidence":"Denize Elverişlilik s.2; Emniyet Ekipmanı Form E s.6","status":"certificate_recorded"},{"key":"lifebuoys","tr":"Can simitleri","en":"Lifebuoys","quantity":12,"evidence":"Denize Elverişlilik s.2; Emniyet Ekipmanı Form E s.6","status":"certificate_recorded"},{"key":"lifejackets","tr":"Can yelekleri (yetişkin)","en":"Adult lifejackets","quantity":73,"evidence":"Denize Elverişlilik s.2; Emniyet Ekipmanı Form E s.6","status":"certificate_recorded"},{"key":"child_jackets","tr":"Çocuk can yelekleri","en":"Child lifejackets","quantity":7,"evidence":"Denize Elverişlilik s.2","status":"certificate_recorded"}],"calendar_policy_unchanged":true,"parent_project_data_sha256":"074e8f54ca94d3a8e5c0cab5adf5dae073b5e5c8a483a28f96acec283cf3c4b6","parent_source_file_sha256":"8d4e51d1d7a48407884ec33313c157c39144870f6fd4e33c305d0419172c1108","original_families":13,"stage_count":216,"original_findings":85,"officially_closed_findings":0,"release_blockers":["current_ERP_controlled_document_code_reconciliation","vessel_specific_launching_appliance_certificates_and_OEM_instructions","85_findings_formal_disposition","independent_technical_signoff","calendar_client_compatibility_and_authorised_release"],"live_github_modified":false,"independent_expert_approval":false,"note":"No new drills, event dates, schedule policy or EYS source texts added; source certificates document 2026 equipment counts and capacities; model name originates from user statement."},"metadata":{"source":"KEGM_Gemi_Acil_Role_Talimleri_SADE_FINAL_v1_0.html","source_project_sha256":"074e8f54ca94d3a8e5c0cab5adf5dae073b5e5c8a483a28f96acec283cf3c4b6","source_status":"editorial_first_draft_not_expert_approved","source_archive_included":false,"flow_count":27,"stage_count":216,"technical_card_count":180,"open_quality_findings":85,"applicable_drill_default":"demonstration_and_simulation_unless_approved","v34_first_phase":{"date":"2026-11-10","scope":"verified defects: 37 cut-off EN learning statements, lifeboat visual duplication, reference correction, navigation, dead code cleanup","translation_status":"editorial translations requiring independent technical language review","schedule_modified":false,"filled_drill_records_added":false,"official_evidence_code_confirmed":false},"v35_second_phase":{"scope":"read-only SOLAS practical prompts, emergency reference improvements, separate briefing view","schedule_modified":false,"record_collection_added":false,"browser_acceptance":"pending after environment Playwright stalled"},"archive_delivery":"Separated compressed source and audit archive in downloadable package; runtime content preserved","v36_rework":{"summary":"restored rich Sunday panel; mobile agenda; archive separated","canonical_calendar_changed":false,"official_record_forms":false,"long_english_technical_translation":"377/377 source-paragraph-aligned working English translations; not independently certified"},"bilingual_source_paragraphs":{"source_tr":377,"translated_en":377,"stages":216,"flows":27,"independent_expert_approval":false,"source_tr_modified":false}},"editorial_restore_v30":{"source_parent":"KEGM_NENE_HATUN_TESLIM_SURUMU_RC1.html","context_paragraphs_recovered":377,"stage_source_sha256_verified":377,"stage_count":216,"full_bilingual_context_only_where_source_linked":true,"editorial_status":"unapproved_training_first_draft","original_project_archive_included":true,"kept_calendar_policy":"KEGM-ROLE-KANONIK-1.2","original_encoded_credit_restored":true,"report_guide_from_original_v1_7_0_structure":true},"report_samples_v31":{"abandon/abandon":{"tr":"Gemiyi terk talimi kapsamında genel alarm ve talim anonsu verildi. Personel role istasyonlarında toplandı, görevli zabitlerce yoklama yapıldı ve toplanma durumu köprüüstüne bildirildi. Kaptanın gemiyi terk kararına ilişkin yetkisi ve karar öncesi durum değerlendirmesi senaryo üzerinden ele alındı.\n\nCan yeleklerinin giyilmesi ve kişisel can kurtarma donanımının hazırlanması gösterildi. Can salları, acil haberleşme cihazları, işaret vasıtaları ve tahliye güzergâhları kontrol listesi üzerinden incelendi. Geminin mevcut bot envanteri dikkate alındı; gerçek indirme yapılmadan önce gerekli izin ve emniyet şartları değerlendirildi. GMDSS tehlike mesajı yayınlanmadı; haberleşme işlemleri talim kapsamında simüle edildi.\n\nTalim sonunda personel görevleri, toplanma süresi, malzeme hazırlığı ve görülen eksiklikler değerlendirildi. Kullanılan eğitim donanımı yerine alındı ve kayıt sorumlusuna talim sonucu bildirildi.","en":"The abandon-ship drill was initiated with the appropriate alarm and a clearly identified drill announcement. Crew members assembled at their muster stations, attendance was checked, and the muster status was reported to the bridge. The master's decision-making authority and the circumstances leading to an abandon-ship order were discussed as part of the scenario.\n\nThe donning of lifejackets and preparation of personal survival equipment were demonstrated. Liferafts, emergency communication devices, distress signals and escape routes were reviewed against the applicable checklist. The vessel's actual boat inventory was taken into account, and the prerequisites for any real launching activity were assessed. No live GMDSS distress alert was transmitted; emergency communications were simulated.\n\nThe drill concluded with a review of assigned duties, muster performance, equipment readiness and observed deficiencies. Training equipment was restored and the exercise outcome was reported to the responsible officer."},"fire/deck":{"tr":"Güvertede yangın çıktığı senaryosu üzerine ilk ihbar yapıldı, yangın alarmı verildi ve olay yeri köprüüstüne bildirildi. Personel role istasyonlarında toplandı; yangın ekibi, destek ekibi ve haberleşme sorumlularının görevleri kontrol edildi. Güverte üzerindeki yanıcı malzemeler, rüzgârın etkisi ve komşu mahallere yayılma ihtimali değerlendirildi.\n\nYangın dolapları, hortumlar, lanslar ve kişisel koruyucu ekipman talim kapsamında gözden geçirildi. Yakıt ve enerji izolasyonu, geçiş alanlarının kapatılması, güvenli yaklaşma ve sınır soğutması kararları senaryo üzerinde çalışıldı. Kritik işletme devreleri talim gerekçesiyle kesilmedi; gerçek söndürme sistemi boşaltılmadı. Ekipler arasındaki haberleşme ve geri çekilme işareti denendi.\n\nSon değerlendirmede ilk müdahale hızı, personelin emniyetli mevzilenmesi, duman yönü, ekipman erişimi ve aksaklıklar ele alındı. Talim donanımı emniyetli duruma getirildi ve sonuçlar kayıt sorumlusuna aktarıldı.","en":"A deck-fire scenario was introduced and the initial report was passed to the bridge. The fire alarm was raised, crew members mustered, and the roles of the fire party, support party and communications personnel were checked. Combustible deck stores, wind direction and possible fire spread to adjacent spaces were assessed.\n\nFire hoses, nozzles, hydrants and personal protective equipment were inspected for training purposes. Decisions concerning fuel and electrical isolation, access control, safe approach and boundary cooling were discussed and simulated. Essential services were not disconnected for the drill, and no fixed extinguishing system was discharged. Team communications and withdrawal signals were practised.\n\nThe closing review covered response times, safe positioning, smoke movement, equipment access and deficiencies. Equipment was returned to a safe condition and findings were passed to the officer responsible for the drill record."},"fire/accommodation":{"tr":"Yaşam mahallinde duman tespit edildiği senaryosu başlatıldı. İlk ihbar köprüüstüne iletildi, yangın alarmı verildi ve personelin role istasyonlarındaki yoklaması tamamlandı. Yangın ve destek ekipleri görevlendirildi; mahalde bulunabilecek personelin tahliyesi ve kayıp kişi kontrolü senaryo üzerinde ele alındı.\n\nKabin ve koridorlarda duman yayılımı, yangın kapılarının durumu, havalandırma izolasyonu ve alternatif kaçış yolları değerlendirildi. Yangın kıyafeti, solunum cihazı, haberleşme araçları ve hortum hazırlıkları kontrol edildi. Güç kesme ve yangınla mücadele adımları kritik sistemlere müdahale edilmeden simüle edildi. Ekiplerin haberleşmesi ve geri çekilme düzeni denendi.\n\nTalim sonunda personel sayımı, tahliye rotalarının kullanılabilirliği, duman altında yön bulma riskleri ve görülen eksiklikler değerlendirildi. Ekipmanların yerlerine alınması sağlandı ve talim sonucu raporlamaya hazırlandı.","en":"An accommodation-space smoke scenario was initiated. The initial sighting was reported to the bridge, the fire alarm was raised and crew attendance at muster stations was checked. Fire and support teams were assigned, and evacuation and missing-person procedures were discussed.\n\nSmoke spread through cabins and corridors, fire-door arrangements, ventilation isolation and alternative escape routes were assessed. Fire suits, breathing apparatus, communications and hose preparations were inspected. Electrical isolation and firefighting decisions were simulated without interfering with essential systems. Team communication and withdrawal procedures were practised.\n\nAt the end of the drill, personnel accounting, escape-route availability, reduced-visibility hazards and identified deficiencies were reviewed. Equipment was restored and the exercise findings were prepared for reporting."},"fire/engine":{"tr":"Makine dairesinde yakıt veya yağ kaynaklı yangın çıktığı senaryosu uygulandı. İlk bildirim alındıktan sonra alarm ve personel yoklaması gerçekleştirildi; köprüüstü ile makine kontrol mahalli arasındaki iletişim sınandı. Müdahale ekibinin görevleri, makine dairesindeki sıcak yüzeyler ve yakıt püskürmesi tehlikesi değerlendirildi.\n\nYangın kıyafetleri, solunum cihazları, söndürme ekipmanı ve kaçış güzergâhları kontrol edildi. Havalandırma durdurma, yakıt çabuk kapama, enerji izolasyonu ve sabit söndürme sisteminin kullanımına ilişkin karar aşamaları senaryo üzerinde çalışıldı. Kritik donanımlar fiilen devreden çıkarılmadı ve sabit gazlı söndürme sistemi boşaltılmadı. Personelin geri çekilme ve sınır soğutma tertibi değerlendirildi.\n\nTalim sonunda alarm ve haberleşme performansı, izolasyon kararları, personel emniyeti ve gözlenen aksaklıklar görüşüldü. Kullanılan eğitim malzemesi toplandı ve değerlendirme kayıt sorumlusuna bildirildi.","en":"An engine-room fuel- or oil-fire scenario was carried out. The initial report was received, the alarm and crew muster were completed, and communications between the bridge and engine control station were tested. The response team reviewed its duties and the hazards presented by hot surfaces and pressurised fuel leaks.\n\nFire suits, breathing apparatus, firefighting equipment and escape routes were checked. Decisions regarding ventilation shutdown, quick-closing fuel valves, electrical isolation and fixed-extinguishing arrangements were worked through in a simulation. Essential machinery was not taken out of service and no fixed gaseous extinguishing agent was released. Withdrawal and boundary-cooling arrangements were reviewed.\n\nAlarm performance, communications, isolation decisions, personnel safety and identified deficiencies were discussed at the debrief. Training equipment was restored and findings were reported."},"fire/galley":{"tr":"Kuzinede pişirme yağı kaynaklı yangın meydana geldiği senaryosu başlatıldı. İlk ihbar köprüüstüne yapıldı, yangın alarmı verildi ve müdahale personeli görevlendirildi. Kuzinede bulunan personelin emniyetli çıkışı ve mahalin kontrol altına alınması değerlendirildi.\n\nPişirme cihazının ısı kaynağının kesilmesi, uygun söndürücünün seçilmesi ve yağ yangınına su uygulanmaması gerektiği ekiplerle görüşüldü. Yangın battaniyesi ve uygun söndürücülerin konumları kontrol edildi; havalandırma ve enerji izolasyonuna ilişkin işlemler senaryoda simüle edildi. Mahale yaklaşma, geri çekilme ve komşu mahallerin korunması konuları ele alındı.\n\nTalim sonunda ilk ihbarın açıklığı, söndürme vasıtası seçimi, personelin emniyetli davranışı ve ekipman erişimi değerlendirildi. Görülen eksiklikler kayıt altına alınmak üzere bildirildi.","en":"A galley cooking-oil fire scenario was initiated. The initial report was passed to the bridge, the alarm was raised and response personnel were assigned. Safe evacuation from the galley and isolation of the affected space were discussed.\n\nThe team reviewed stopping the heat source, choosing a suitable extinguisher and avoiding the use of water on burning cooking oil. Locations of the fire blanket and appropriate extinguishers were checked. Ventilation and electrical-isolation actions were simulated. Safe approach, withdrawal and protection of adjacent spaces were considered.\n\nThe final discussion covered the clarity of the initial report, extinguisher selection, crew safety and access to equipment. Observed deficiencies were passed on for inclusion in the drill record."},"steering/steering":{"tr":"Dümen kumandasının kaybedildiği senaryosu köprüüstüne bildirildi. Kaptanın bilgilendirilmesi, çevredeki trafik ve seyir emniyeti durumu değerlendirildi. Köprüüstü, makine kontrol mahalli ve dümen dairesi arasındaki görev ve haberleşme düzeni kuruldu.\n\nAna kumandadan yedek veya mahallî kumandaya geçiş sırası, geminin kendi sistem düzeni dikkate alınarak talim kapsamında gösterildi veya simüle edildi. Emirlerin açık verilmesi, tekrar edilmesi ve dümen göstergelerinin çapraz kontrolü çalışıldı. Yedek güç, hidrolik devre ve mekanik sınırlar teknik talimat üzerinden gözden geçirildi; izinsiz kumanda devri ve işletme emniyetini bozacak müdahale yapılmadı.\n\nTalim sonunda alternatif kumandanın kullanılabilirliği, haberleşme kalitesi, seyir emniyeti kararları ve tespit edilen eksiklikler değerlendirildi. Sonuç kaptana ve kayıt sorumlusuna bildirildi.","en":"A steering-control failure was reported to the bridge. The master was informed and surrounding traffic and navigational risks were assessed. Duties and communications between the bridge, engine control station and steering-gear compartment were established.\n\nThe sequence for transferring from normal to alternative or local steering control was demonstrated or simulated with reference to the vessel's actual arrangement. Clear orders, read-backs and rudder-angle indicator cross-checks were practised. Backup power, hydraulic arrangements and mechanical limitations were reviewed against equipment instructions. No unauthorised control transfer was performed.\n\nThe drill concluded with a review of alternative steering readiness, communication quality, navigation decisions and deficiencies. Findings were reported to the master and the officer responsible for the record."},"mob_sar/MOB":{"tr":"Denize adam düştüğü senaryosu üzerine ilk gören personelin ihbarı ve sürekli işaret etme görevi çalışıldı. Köprüüstü bilgilendirildi, MOB mevkiinin işaretlenmesi ve gözcü görevlendirilmesi gösterildi. Personel toplanması, kazazede arama düzeni ve görev dağılımı değerlendirildi.\n\nKöprüüstünde geminin seyir durumu, pervane tehlikesi ve emniyetli dönüş manevrası senaryo üzerinde incelendi; talim gerekçesiyle tehlikeli gerçek manevra yapılmadı. Can simidi, kurtarma hattı, sudan alma vasıtası ve varsa kurtarma botunun kullanılma şartları gözden geçirildi. Kazazedenin emniyetli alınması, hipotermi riski ve ilk yardım hazırlığı çalışıldı. Haricî tehlike çağrısı yapılmadı; bildirim usulü simüle edildi.\n\nTalim sonunda gözcülük sürekliliği, haberleşme, kurtarma yöntemi seçimi ve ekipman hazırlığı değerlendirildi. Gözlemler kayıt sorumlusuna aktarıldı.","en":"A man-overboard scenario was introduced. The first observer's warning and continuous pointing duty were practised. The bridge was informed, the MOB position was marked and a dedicated lookout was assigned. Crew organisation and search duties were reviewed.\n\nThe bridge team discussed vessel movement, propeller hazards and an appropriate recovery manoeuvre without conducting an unsafe live turn. Lifebuoys, recovery lines, retrieval appliances and any available rescue boat were considered against the vessel's equipment and operating limitations. Safe recovery, hypothermia risks and first-aid preparations were practised. External distress communications were simulated without transmitting a live alert.\n\nThe closing review addressed lookout continuity, communications, recovery-method selection and equipment readiness. Observations were passed to the officer responsible for reporting."},"mob_sar/SAR":{"tr":"Arama ve kurtarma yardım çağrısının alındığı senaryosu başlatıldı. Gelen ihbarda olay yeri, zaman, kişi sayısı ve yardım ihtiyacına ilişkin bilgiler derlendi; kaptan bilgilendirildi. RCC/MRCC ile koordinasyon, haberleşme kanalları, görev dağılımı ve durum raporu düzeni senaryo üzerinde çalışıldı.\n\nMuhtemel arama alanı, sürüklenme etkileri, gözcü istasyonları ve arama paterni seçenekleri değerlendirildi. Seyir emniyeti, diğer gemilerle bilgi paylaşımı ve olay yeri koordinasyonuna ilişkin görevler tartışıldı. Güvertede kazazede kabulü, sudan alma donanımı, sağlık müdahalesi ve hipotermi önlemleri kontrol edildi. Haricî telsiz yayınları gerçek acil çağrıya dönüşmeyecek şekilde simüle edildi.\n\nTalim sonunda arama bilgisi aktarımı, kurtarma hazırlığı, kazazede sayımı ve kayıt düzeni değerlendirildi. Aramayı sonlandırma kararının ilgili koordinasyon makamına ait olduğu hatırlatıldı ve eğitim sonucu raporlandı.","en":"A search-and-rescue assistance call was used as the drill scenario. Position, time, persons involved and assistance requirements were compiled from the simulated report, and the master was informed. Coordination with RCC/MRCC, communication channels, duty allocation and situation reporting were practised.\n\nThe probable search area, drift effects, lookout stations and possible search patterns were assessed. Navigation safety, information exchange with other vessels and on-scene coordination duties were discussed. Casualty reception arrangements, recovery equipment, medical preparations and hypothermia precautions were checked. External radio messages were simulated without issuing an actual distress transmission.\n\nThe debrief covered search-data transfer, recovery readiness, casualty accounting and records. The appropriate coordination authority for terminating a search was identified and the drill outcome was reported."},"boats/RESCUE":{"tr":"Kurtarma botu/FRC talimi öncesinde görevli personel belirlendi ve emniyet konuşması yapıldı. Hava ve deniz koşulları, geminin durumu, indirici ekip ile bot mürettebatının haberleşmesi ve işi durdurma işaretleri değerlendirildi. Botun dış görünümü, donanım listesi, yakıt durumu ve haberleşme araçları kontrol edildi.\n\nMatafora, kaldırma bağlantıları, kanca mekanizması, parima ve çalışma alanındaki sıkışma/çarpma noktaları üretici talimatı çerçevesinde gözden geçirildi. İndirme ve geri alma için komut sırası ile yetki zinciri çalışıldı. Gerçek indirme şartlarının uygunluğu ayrıca değerlendirildi; talim sırasında icra edilmeyen safhalar simüle edildi. Botun yaklaşma, kurtarma ve geri alma manevraları senaryo kapsamında anlatıldı.\n\nTalim sonunda personel emniyeti, yük altına girilmemesi, askı donanımı ve haberleşme disiplinine ilişkin gözlemler değerlendirildi. Botun emniyetli yerleşimi ve raporlama işlemleri tamamlandı.","en":"The rescue boat/FRC drill began with assignment of personnel and a safety briefing. Weather and sea conditions, vessel status, communications between the launching party and boat crew, and stop-work signals were reviewed. The boat's external condition, equipment list, fuel status and communication devices were checked.\n\nThe davit, lifting connections, hook release arrangement, painter and pinch or strike points were reviewed against the manufacturer's instructions. The command sequence and authority for launching and recovery were practised. Suitability for any actual launching operation was assessed separately, and stages not physically conducted were simulated. Boat approach, casualty recovery and retrieval manoeuvres were discussed.\n\nThe debrief covered personnel safety, avoidance of suspended loads, lifting gear and communication discipline. The boat was left secured and the exercise results were reported."},"boats/SERVICE":{"tr":"Hizmet botu/daughter craft görevi için örnek operasyon senaryosu oluşturuldu. Botun görev sınırları ve kurtarma botundan farklı onay durumu personelle görüşüldü. Kaptan izni, görev dağılımı, hava-deniz koşulları, haberleşme ve personel taşıma emniyeti değerlendirildi.\n\nBotun yakıtı, donanımı, can kurtarma teçhizatı, bağlama elemanları ve haberleşme cihazları kontrol edildi. Botun indirilmesi, çalışma sahasına sevki, ana gemiye yaklaşması ve geri alınmasına ilişkin komutlar eğitim kapsamında gözden geçirildi. Asılı yük, bota giriş-çıkış, ana gemiyle temas ve pervane tehlikeleri üzerinde duruldu; uygun olmayan safhalar gerçek manevra yerine simüle edildi.\n\nTalim sonunda botun görevine uygun kullanımı, personel kontrolü, dönüş hazırlığı ve çalışma alanı emniyeti değerlendirildi. Botun emniyete alınması ve gözlemlerin ilgili sorumluya bildirilmesi tamamlandı.","en":"A service boat/daughter craft exercise scenario was prepared. The boat's assigned tasks and its approval status, which differed from that of a rescue boat, were discussed with the crew. The master's permission, duty allocation, sea conditions, communications and personnel-transfer safety were assessed.\n\nFuel, onboard equipment, survival appliances, securing arrangements and radios were checked. Launching, transit to the work area, approach to the parent vessel and recovery commands were reviewed. Suspended loads, embarkation, contact with the ship and propeller hazards received particular attention. Stages unsuitable for live execution were simulated.\n\nThe closing review addressed permitted use, crew accounting, return preparations and safety of the work area. The boat was secured and findings were passed to the responsible officer."},"confined/ENTRY":{"tr":"Kapalı mahale giriş taliminde örnek iş emri üzerinden giriş ihtiyacı ve alternatif çalışma yöntemleri değerlendirildi. Mahal tehlikeleri, atmosfere ilişkin riskler, enerji ve hat izolasyonu, yetkilendirme ve gözcü görevleri görüşüldü. Görevli personelin bilgilendirilmesi ve giriş öncesi risk değerlendirmesi çalışıldı.\n\nHavalandırma düzeni, atmosfer ölçüm cihazı, haberleşme, aydınlatma ve giriş-çıkış yolları kontrol listesi üzerinden incelendi. Ölçüm noktaları, kabul ölçütleri ve ölçümlerin tekrarı hakkında eğitim verildi. Oksijenle havalandırma yapılmaması ve kurtarma hazırlığı tamamlanmadan mahale girilmemesi hususları vurgulandı. Gerçek riskli giriş işlemi yapılmadan giriş izni ve gözcü–giren personel haberleşmesi simüle edildi.\n\nTalim sonunda izin belgesi akışı, durdurma kriterleri, atmosfer takibi ve acil tahliye hazırlığı değerlendirildi. Eksik görülen donanım ve düzenlemeler kayıt sorumlusuna bildirildi.","en":"An enclosed-space entry exercise was carried out using a sample work order. The necessity of entry, alternative working methods, atmospheric hazards, isolation requirements, authorisation and attendant duties were assessed. Personnel briefing and pre-entry risk assessment were practised.\n\nVentilation, atmosphere-testing equipment, communications, lighting and access arrangements were reviewed against the checklist. Sampling locations, acceptance criteria and repeat measurements were discussed. The prohibition on oxygen ventilation and the need for rescue readiness before entry were emphasised. Permit authorisation and entrant–attendant communication were simulated without making a hazardous entry.\n\nThe closing review covered permit control, stop-work criteria, atmosphere monitoring and emergency evacuation readiness. Equipment or procedural deficiencies were reported."},"confined/RESCUE":{"tr":"Kapalı mahalde personelin rahatsızlandığı senaryosu üzerine alarm ve ilk ihbar düzeni çalışıldı. Olay yerinde izinsiz kurtarma girişinin önlenmesi, mahalin izole edilmesi ve olay komutasının kurulması değerlendirildi. İçerideki kişi sayısı, muhtemel atmosfer tehlikeleri ve erişim yolları hakkında bilgiler derlendi.\n\nKurtarma personelinin görevleri, uygun solunum koruması, kurtarma halatı/üçayak gibi mevcut donanım, haberleşme ve sağlık desteği kontrol edildi. Giriş izni, atmosfer ölçümü ve sürekli gözcü görevine ilişkin şartlar gözden geçirildi. Mahale plansız giriş yapılmadı; kazazedeye ulaşma ve dışarı alma safhaları kontrollü eğitim senaryosu üzerinden simüle edildi.\n\nTalim sonunda ilk müdahale organizasyonu, ilave kazazede oluşmasını önleyen tedbirler, ekipman hazırlığı ve ilk yardım akışı değerlendirildi. Eksiklikler ve düzeltici faaliyet ihtiyaçları raporlamaya aktarıldı.","en":"An incapacitated-person scenario in an enclosed space was introduced. The alarm and initial notification sequence were practised. Prevention of unauthorised rescue entry, isolation of the space and establishment of incident command were assessed. Information about personnel inside, possible atmospheric hazards and access routes was collected.\n\nRescuer assignments, suitable breathing protection, available extraction equipment, communications and medical support were checked. Entry permits, atmospheric testing and continuous attendant duties were reviewed. No unplanned entry was made; access to the casualty and extraction were simulated under controlled training conditions.\n\nThe debrief addressed response organisation, prevention of secondary casualties, equipment readiness and first-aid arrangements. Deficiencies and corrective-action needs were passed on for reporting."},"damage/Karaya":{"tr":"Karaya oturma senaryosu üzerine seyir emniyeti değerlendirmesi yapıldı ve kaptan bilgilendirildi. Personel görevleri belirlendi; yaralanma, su alma, yakıt sızıntısı ve makine hasarı olasılıkları kontrol edildi. Gemi mevkii, deniz durumu, dip yapısı ve çevre trafik bilgileri senaryoya işlendi.\n\nGövde ve tank ölçümleri, sintine seviyelerinin takibi, makine ve sevk sistemlerinin kontrolü, su geçirmez bütünlüğün korunması ve kirliliği önleme tedbirleri görevli ekiplerle gözden geçirildi. Gemiyi yeniden yüzdürmeye veya hareket ettirmeye yönelik kararın hasar değerlendirmesi tamamlanmadan alınmaması gerektiği tartışıldı. Dış bildirimler ve yardım talebi usulü talim kapsamında simüle edildi.\n\nTalim sonunda hasar bilgisinin köprüüstüne aktarılması, kayıtların tutulması, çevresel riskler ve personel emniyeti değerlendirildi. Bulgular talim sonuç raporuna iletildi.","en":"A grounding scenario was introduced and the navigational situation was assessed. The master was informed, duties were assigned and possible injuries, flooding, pollution and machinery damage were considered. Position, sea state, seabed conditions and surrounding traffic information were included in the scenario.\n\nHull and tank soundings, bilge-level monitoring, machinery checks, watertight integrity and pollution-prevention actions were reviewed with the assigned teams. The need to assess damage before deciding on any refloating or vessel movement was discussed. External notification and assistance procedures were simulated.\n\nThe closing review covered information transfer to the bridge, record keeping, environmental risks and personnel safety. Findings were passed into the drill reporting process."},"damage/Su":{"tr":"Gemide bir bölmeye su girdiği senaryosu başlatıldı. İlk ihbar üzerine su alma bölgesi, muhtemel kaynak ve personel emniyeti değerlendirildi; görevli ekipler ve köprüüstü arasında haberleşme kuruldu. Su geçirmez kapı ve bölme düzeninin korunması, yaralanma ve kayıp personel kontrolü çalışıldı.\n\nSintine ve tank seviye ölçümleri, su yükselme hızının takibi, pompa ve drenaj imkânları ile elektrik emniyeti ele alındı. Pompa kapasitesi, enerji ihtiyacı ve sınırlandırma kararları geminin mevcut sistemleri üzerinden değerlendirildi. Gerçek su basma veya kritik devreyi kesme işlemi yapılmadı; izolasyon ve karşı önlemler senaryo üzerinde simüle edildi.\n\nTalim sonunda su alma bilgilerinin zamanında raporlanması, personelin emniyetli görevlendirilmesi, stabiliteye etkiler ve acil yardım ihtiyacı değerlendirildi. Tespit edilen aksaklıklar kayıt sorumlusuna bildirildi.","en":"A compartment-flooding scenario was initiated. The location, likely source and personnel hazards were assessed after the initial report. Communications were established between assigned teams and the bridge. Preservation of watertight boundaries and checks for injured or missing personnel were practised.\n\nBilge and tank levels, the rate of water ingress, pumping arrangements and electrical safety were reviewed. Pump capacity, power requirements and containment decisions were assessed against the ship's actual systems. No compartment was deliberately flooded and no essential circuit was disconnected; isolation and response actions were simulated.\n\nThe debrief covered timely reporting, safe crew assignments, stability implications and any need for external assistance. Observed deficiencies were reported."},"pollution/overflow":{"tr":"Yakıt transferi sırasında tankın taşmaya başladığı senaryosu uygulandı. Taşmanın fark edilmesi ve köprüüstü/makineye ilk ihbar çalışıldı. Görevli personelin korunması, transferin durdurulması, sızıntı bölgesinin emniyete alınması ve ateşleme kaynaklarının kontrol edilmesi senaryo üzerinde değerlendirildi.\n\nTransfer hatları, vanalar, tank seviye göstergeleri, güverte drenajları ve taşma önleme ekipmanı kontrol listesi üzerinden incelendi. Yakıtın denize ulaşmasını önleme, döküntü kitinin kullanımı, atıkların toplanması ve bildirim zinciri çalışıldı. Gerçek yakıt dökülmesi veya izinsiz vanalama yapılmadı; müdahale safhaları talim olarak simüle edildi.\n\nTalim sonunda başlangıç bildirim süresi, ekip görevlendirmesi, transfer kontrolü, kirliliğin sınırlandırılması ve kayıt sorumluluğu değerlendirildi. Tespit edilen eksiklikler ilgili sorumluya aktarıldı.","en":"A fuel-tank overflow during transfer was used as the exercise scenario. Recognition of the overflow and initial notification to the bridge and engine team were practised. Crew protection, stopping the transfer, securing the area and controlling ignition sources were assessed.\n\nTransfer lines, valves, tank-level indicators, deck drains and spill-prevention equipment were reviewed against the checklist. Preventing discharge overboard, using the spill kit, collecting waste and following the notification chain were practised. No fuel was released and no unauthorised valve operation was performed; response stages were simulated.\n\nThe debrief addressed reporting speed, team assignments, transfer control, spill containment and recording responsibilities. Identified deficiencies were passed to the responsible officer."},"pollution/leak":{"tr":"Güvertede veya makine mahallinde sızıntı tespit edildiği senaryosu başlatıldı. İlk ihbarla birlikte sızıntının konumu, madde türü ve yayılma yönü belirlendi; personelin emniyetli yaklaşma mesafesi değerlendirildi. Ateşleme kaynakları ve denize deşarj ihtimali kontrol edildi.\n\nKaçak kaynağının belirlenmesi, transferin veya pompanın güvenli durdurulması, uygun vanaların izolasyonu ve döküntünün sınırlandırılması adımları senaryo üzerinde çalışıldı. Emici malzemeler, toplama kapları, drenaj kapakları ve kişisel koruyucu ekipman gözden geçirildi. Gerçek kirletici madde salınmadı; olay bildirimi ve atık yönetimi uygulamaları simüle edildi.\n\nTalim sonunda tehlikeli madde tanımlama, ekip haberleşmesi, çevre koruma tedbirleri ve eksiklikler değerlendirildi. Bulgular ile takip gerektiren hususlar rapor sorumlusuna iletildi.","en":"A leak or spill in a deck or machinery area was used as the scenario. The location, substance and likely spread path were identified from the initial report, and safe approach distances were considered. Ignition sources and possible discharge to the sea were assessed.\n\nLocating the leak, safely stopping the affected pump or transfer, isolating valves and containing the spill were practised as simulated actions. Absorbent materials, collection containers, drain covers and personal protective equipment were reviewed. No pollutant was released; notification and waste-management arrangements were simulated.\n\nThe closing review covered substance identification, team communications, environmental safeguards and deficiencies. Findings and follow-up items were passed to the reporting officer."},"lifeboat/lifeboat":{"tr":"Can filikası eğitiminde kullanılan donanımın türü ve gemide uygulanabilirliği değerlendirildi. Can kurtarma aracı, binme istasyonu, personel görevleri ve indirme öncesi emniyet tedbirleri eğitim görselleri ve ilgili teknik talimat üzerinden incelendi. Can yelekleri, iletişim, motor hazırlığı ve kişisel güvenlik konuları görüşüldü.\n\nİndirme tertibatındaki askı yükleri, kanca bağlantıları, hareketli parçalar ve düşme tehlikeleri değerlendirildi. Komut sırası, biniş düzeni, serbest bırakma ve geri alma aşamaları senaryo üzerinden çalışıldı. NENE HATUN örneğinde gemide can filikası bulunmadığı için gerçek filika indirme faaliyeti gerçekleştirilmedi; eğitim genel tanıtım olarak tamamlandı.\n\nTalim sonunda personelin can filikası ile kurtarma botu arasındaki farkı kavraması, kullanılan eğitim kaynakları ve teknik sorular değerlendirildi. Sonuçlar eğitim kaydına aktarılmak üzere bildirildi.","en":"The lifeboat familiarisation exercise reviewed the type of survival craft and its applicability to the vessel. Embarkation stations, assigned duties and pre-launch safeguards were studied using training illustrations and the relevant technical instructions. Lifejackets, communications, engine preparation and crew safety were discussed.\n\nSuspended loads, hook connections, moving machinery and fall hazards were considered. Command sequences, boarding, release and recovery procedures were worked through as a scenario. In the NENE HATUN example, no lifeboat was carried and no actual lifeboat launching operation was conducted; the session was completed as general familiarisation.\n\nThe debrief addressed the distinction between a lifeboat and a rescue boat, the resources used and the technical questions raised. The outcome was passed on for inclusion in the training record."},"departure/emergency_departure":{"tr":"Geminin acilen kalkış yapmasını gerektiren bir durum senaryosu başlatıldı. Kaptana ilk bildirim yapıldı; hava, trafik, kıyı bağlantıları, personel ve makine hazırlığı birlikte değerlendirildi. Köprüüstü, güverte ve makine ekiplerinin görevleri ile haberleşme zinciri belirlendi.\n\nPalamar mahallindeki tehlikeli bölgeler, halat gerilimi ve kopma yönleri personele hatırlatıldı. Kara elektriği, hortum, gangway ve diğer gemi–kıyı bağlantılarının kontrol sırası gözden geçirildi. Sevk ve dümen hazırlığı, emniyetli manevra alanı, römorkör ihtiyacı ve liman otoritesiyle koordinasyon senaryo üzerinden çalışıldı. Gerçek acil kalkış gerçekleştirilmedi; ayrılma komutları talim olarak simüle edildi.\n\nSon değerlendirmede personel sayımı, görev sırası, haberleşme ve rıhtımdan ayrılma ön koşulları ele alındı. Görülen eksiklikler kayıt sorumlusuna bildirildi.","en":"An emergency-departure scenario was initiated. The initial report was made to the master, and weather, traffic, shore connections, personnel readiness and machinery status were assessed together. Bridge, deck and engine-team duties and communications were established.\n\nDanger areas at mooring stations, line tension and snap-back zones were reviewed. The sequence for checking shore power, hoses, gangway and other ship–shore connections was discussed. Propulsion and steering readiness, manoeuvring space, tug assistance and port-authority coordination were worked through as a scenario. No actual emergency departure took place; departure commands were simulated.\n\nCrew accounting, duty sequence, communication and safe conditions for leaving the berth were reviewed at the debrief. Findings were reported."},"departure/break_away_from_jetty":{"tr":"Rıhtımda gemiyi tehdit eden bir olay nedeniyle iskeleden acil uzaklaşma senaryosu uygulandı. Kaptan ve ilgili ekipler bilgilendirildi; gemi–kıyı haberleşmesi, çevredeki trafik ve mevcut bağlama durumu değerlendirildi. Rıhtım personeliyle koordinasyon ve personel sayımı ele alındı.\n\nYük veya yakıt transferinin durdurulması, hortum ve diğer bağlantıların güvenli ayrılması, gangway kontrolü ve palamarların emniyetli çözülme sırası gözden geçirildi. Halatların kopma bölgeleri, pervane yakınındaki riskler, römorkör ihtiyacı ve manevra alanı tartışıldı. Gerçek hat kesme, kıyı bağlantısı ayırma veya acil uzaklaşma yapılmadı; işlem sırası kontrollü olarak simüle edildi.\n\nTalim sonunda kıyı–gemi koordinasyonu, ekiplerin komut tekrarı, ayrılma öncesi kontrol noktaları ve eksiklikler değerlendirildi. Sonuçlar ilgili kayıt sorumlusuna iletildi.","en":"An emergency break-away-from-berth scenario was carried out following a simulated threat at the quay. The master and assigned teams were informed, and ship–shore communications, traffic and mooring status were assessed. Coordination with shore personnel and crew accounting were reviewed.\n\nStopping transfers, safely disconnecting hoses and services, controlling the gangway and releasing moorings in the correct sequence were discussed. Snap-back zones, propeller hazards, tug assistance and available manoeuvring space were considered. No lines were cut, no shore services were disconnected and the vessel did not make an actual emergency departure; the sequence was simulated.\n\nThe debrief addressed ship–shore coordination, command read-backs, pre-departure checks and deficiencies. Findings were passed to the officer responsible for reporting."},"power/blackout":{"tr":"Gemi elektrik enerjisinin kaybedildiği karartma senaryosu başlatıldı. Köprüüstü ve makine ekipleri bilgilendirildi; seyir, dümen, haberleşme, aydınlatma ve emniyet sistemlerinin etkilenme olasılığı değerlendirildi. Personel görevleri ve ilk haberleşme düzeni çalışıldı.\n\nAcil jeneratör, acil aydınlatma, gerekli yedek beslemeler ve elektrik dağıtım düzeni teknik talimat üzerinden incelendi. Arızanın kaynağının saptanması, güvenli yeniden enerjilendirme, yük sıralaması ve koruma sistemlerinin kontrolü senaryo üzerinde değerlendirildi. Kritik devreler talim için kesilmedi; canlı pano müdahalesi veya kontrolsüz yeniden çalıştırma yapılmadı.\n\nTalim sonunda köprüüstü–makine haberleşmesi, acil güç kapasitesine ilişkin bilgi, enerji dönüş sırası ve personel emniyeti değerlendirildi. Eksikler ile takip gerektiren kontroller kayıt sorumlusuna bildirildi.","en":"A shipboard blackout scenario was initiated. The bridge and engine teams were informed, and possible effects on navigation, steering, communications, lighting and safety systems were assessed. Duties and initial communication arrangements were practised.\n\nEmergency generation, emergency lighting, backup supplies and the distribution arrangement were reviewed against the technical instructions. Fault identification, safe restoration of power, load sequencing and protective-device checks were considered as simulated decisions. Essential circuits were not disconnected for the exercise, and no unauthorised live-switchboard intervention or uncontrolled restart was performed.\n\nThe debrief addressed bridge–engine communication, emergency-power awareness, restoration sequence and personnel safety. Deficiencies and follow-up checks were reported."},"power/main_engine_failure":{"tr":"Ana makinenin devreden çıktığı senaryosu köprüüstüne ve makine kontrol mahalline bildirildi. Geminin hız ve yön kontrolü, trafik durumu ve seyir emniyeti değerlendirildi. Kaptan ve başmühendisin karar yetkileri ile ekipler arası haberleşme düzeni gözden geçirildi.\n\nMakine alarmları, yağlama, soğutma, yakıt, elektrik beslemesi ve sevk sistemine ilişkin temel göstergeler eğitim kapsamında incelendi. Arıza tanımlama, emniyetli durdurma, yeniden çalıştırmadan önce kontrol ve sevk kabiliyetinin doğrulanması aşamaları senaryo üzerinde çalışıldı. Çalışan ana makine talim nedeniyle durdurulmadı; arıza giderme ve yeniden çalıştırma kararları simüle edildi.\n\nTalim sonunda seyir emniyeti bildirimleri, alternatif yardım seçenekleri, makine kontrol zinciri ve kayıt gereksinimleri değerlendirildi. Görülen eksiklikler ilgili zabitlere bildirildi.","en":"A main-engine failure was reported to the bridge and engine control station. Loss of speed and directional control, surrounding traffic and navigational safety were assessed. The decision-making roles of the master and chief engineer and interdepartmental communications were reviewed.\n\nMachinery alarms and key indications for lubrication, cooling, fuel, electrical supply and propulsion were studied. Fault identification, safe shutdown, pre-restart checks and verification of restored propulsion capability were worked through as a scenario. An operating main engine was not stopped for the drill; fault correction and restart decisions were simulated.\n\nThe final review covered navigational notifications, alternative assistance, machinery control and recording requirements. Deficiencies were passed to the responsible officers."},"weather_collision/heavy_weather":{"tr":"Ağır hava koşullarına girildiği senaryosu üzerinden güncel meteorolojik bilgi ve seyir planı değerlendirildi. Kaptan ve vardiya personeli bilgilendirildi; rota, sürat, trafik, dalga yönü ve geminin hareketleri üzerindeki riskler görüşüldü. Köprüüstü ve güverte ekiplerinin haberleşmesi gözden geçirildi.\n\nGüverte malzemesinin bağlanması, kapak ve geçişlerin kontrolü, personelin açık güverteye çıkışının sınırlandırılması ve can kurtarma donanımının emniyeti çalışıldı. Makine ve dümen hazırlığı ile gerekli destek sistemleri değerlendirildi. Rota/sürat değiştirme kararları ve riskli işlerin durdurulması senaryo üzerinde simüle edildi; gerçek tehlikeli manevra yapılmadı.\n\nTalim sonunda hava takibi, karar verme sınırları, personelin korunması ve gemi donanımının hazırlanmasına ilişkin gözlemler değerlendirildi. Eksikler kayıt sorumlusuna aktarıldı.","en":"A heavy-weather scenario was considered using current weather information and the voyage plan. The master and watchkeeping team were briefed. Route, speed, traffic, wave direction and vessel-motion hazards were assessed. Bridge–deck communications were reviewed.\n\nSecuring deck equipment, checking closures and accessways, restricting exposed-deck work and protecting survival appliances were discussed. Machinery and steering readiness and supporting systems were assessed. Route or speed alterations and suspension of unsafe work were simulated; no hazardous live manoeuvre was undertaken.\n\nThe final review covered weather monitoring, decision thresholds, crew protection and equipment readiness. Deficiencies were reported."},"weather_collision/collision":{"tr":"Yakın çatışma tehlikesinin geliştiği ve sonrasında temas meydana geldiği senaryosu başlatıldı. Köprüüstünde gözcülük, radar/AIS takibi, rota ve sürat bilgilerinin değerlendirilmesi çalışıldı. Kaptana bildirim, çatışmayı önleme kararları ve olay sonrası personel emniyeti gözden geçirildi.\n\nTemasın ardından olası yaralanmalar, su alma, tank ve gövde hasarı, yangın ve kirlilik riski değerlendirildi. Makine ve dümen durumu, su geçirmez bütünlük ve hasar raporlarının köprüüstüne aktarılması senaryo üzerinde çalışıldı. Diğer gemiyle haberleşme, konum ve olay bilgilerinin kaydı ile yardım gereksinimi ele alındı. Gerçek tehlikeli manevra veya gemileri ayırma işlemi yapılmadı.\n\nTalim sonunda karar ve haberleşme sırası, hasar kontrolü, çevresel emniyet ve raporlama gereksinimleri değerlendirildi. Bulgular ilgili sorumluya bildirildi.","en":"A developing collision risk followed by simulated vessel contact was used as the scenario. Lookout, radar/AIS monitoring, course and speed assessment were practised on the bridge. Notification of the master, collision-avoidance decisions and post-impact crew safety were reviewed.\n\nPossible injuries, flooding, hull and tank damage, fire and pollution were assessed. Machinery and steering status, watertight integrity and damage reports to the bridge were worked through as simulated actions. Communication with the other vessel, recording of position and incident details, and assistance requirements were considered. No hazardous live manoeuvre or vessel-separation action was undertaken.\n\nThe debrief covered decision sequence, communications, damage control, environmental safety and reporting. Findings were passed to the responsible officer."},"helicopter/landing":{"tr":"Helikopter iniş operasyonu için hazırlık senaryosu uygulandı. Geminin helikopter operasyon kabiliyeti ve izin şartları değerlendirildi; köprüüstü, güverte ve uçuş ekibi arasındaki haberleşme düzeni gözden geçirildi. Görevli personelin konumları ve durdurma işaretleri belirlendi.\n\nİniş alanı, gevşek malzemeler, rotor akımı, yaklaşma sektörü, yangınla mücadele hazırlığı ve kişisel koruyucu ekipman kontrol edildi. Rüzgâr ve gemi hareketleri ile uçuş ekibi talimatlarına bağlı işletme sınırları senaryo üzerinde değerlendirildi. Gerçek helikopter yaklaşması ve inişi yapılmadı; uçuş safhaları masa başı ve görsel eğitimle simüle edildi.\n\nTalim sonunda alan güvenliği, haberleşme disiplini, yetki sınırları ve acil müdahale hazırlığı değerlendirildi. Tespit edilen konular kayıt sorumlusuna bildirildi.","en":"A helicopter-landing preparation scenario was conducted. The vessel's helicopter-operating capability and authorisation requirements were assessed. Communications between the bridge, deck team and flight crew were reviewed, and personnel positions and stop signals were assigned.\n\nThe landing area, loose objects, rotor wash, approach sectors, fire-response readiness and personal protective equipment were checked. Wind, vessel motion and limits established by the flight crew were considered. No helicopter approached or landed; flight stages were simulated through briefing and visual training.\n\nThe debrief covered deck-area safety, communication discipline, operational authority and emergency readiness. Findings were passed to the reporting officer."},"helicopter/winching":{"tr":"Helikopterle vinçli tahliye ihtiyacı bulunan bir kazazede senaryosu başlatıldı. Kaptan, köprüüstü ve güverte ekibi arasında görev dağılımı yapıldı; SAR koordinasyonu, sağlık durumu, haberleşme ve uçuş ekibinin talimat zinciri değerlendirildi. Tahliye bölgesi ve güvenli yaklaşma düzeni gözden geçirildi.\n\nGevşek malzemeler, rotor akımı, vinç halatı, kanca ve statik elektrik riskleri personele hatırlatıldı. Kazazedenin hazırlanması, kişisel koruma, vinç donanımına temas yetkisi ve görevli güverte personelinin konumları uçuş ekibinin prosedürleri doğrultusunda ele alındı. Gerçek helikopter/vinç operasyonu yapılmadı; tahliye sırası simüle edildi.\n\nTalim sonunda emniyetli saha hazırlığı, uçuş ekibi ile haberleşme, yaralı aktarımı ve operasyonu durdurma şartları değerlendirildi. Gözlemler kayıt sorumlusuna iletildi.","en":"A helicopter winching evacuation involving a casualty was used as the scenario. Duties were assigned between the master, bridge and deck team. SAR coordination, medical status, communications and the flight crew's instructions were reviewed. The winching area and safe approach arrangements were assessed.\n\nLoose objects, rotor wash, hoist cables, hooks and static-electricity hazards were discussed. Casualty preparation, personal protection, authority to touch hoisting equipment and deck-team positions were considered in accordance with the flight crew's procedures. No live helicopter or hoist operation was carried out; the evacuation sequence was simulated.\n\nThe debrief addressed deck preparation, communications with the aircrew, casualty transfer and stop-work conditions. Findings were reported."},"helicopter/helideck_emergency":{"tr":"Helikopter operasyon alanında yangın ve yaralanma meydana geldiği senaryosu uygulandı. Alarm verilmesi, uçuş ekibiyle haberleşme, köprüüstü komutası ve olay alanının sınırlandırılması ele alındı. Personel sayımı ve yaralıların güvenli bölgeye alınmasına ilişkin görevler belirlendi.\n\nRotor ve hareketli parça tehlikeleri, yakıt sızıntısı, elektrik kaynakları, yangın yayılımı ve kaçış yolları değerlendirildi. Yangınla mücadele ve sağlık ekiplerinin koruyucu donanımı kontrol edildi; kurtarma, söndürme ve yakıt izolasyonu kararları senaryo üzerinde çalışıldı. Gerçek yakıt boşaltılması veya helikopter müdahalesi yapılmadı; operasyon güvenli biçimde simüle edildi.\n\nTalim sonunda müdahale organizasyonu, alan emniyeti, ekipler arası haberleşme ve raporlama zinciri değerlendirildi. Eksiklikler sorumlulara bildirildi.","en":"A helideck fire and injury scenario was introduced. The alarm, communication with the flight crew, bridge command and area access control were practised. Personnel accounting and casualty evacuation duties were assigned.\n\nRotor and moving-part hazards, fuel leakage, ignition sources, fire spread and escape routes were assessed. Protective equipment for firefighting and medical teams was checked. Rescue, extinguishing and fuel-isolation decisions were worked through in a simulation. No actual fuel release or intervention on an aircraft was carried out.\n\nThe debrief covered response organisation, helideck security, team communications and reporting. Deficiencies were passed to the responsible officers."},"helicopter/ditching":{"tr":"Deniz üzerinde helikopterin zorunlu iniş yaptığı ihbarına dayalı SAR senaryosu başlatıldı. Olay mevkii, zaman, hava/deniz koşulları ve olası kazazede sayısı derlendi; kaptan ve kurtarma ekibi bilgilendirildi. RCC/MRCC koordinasyonu, haberleşme görevleri ve gözcü tertibi senaryo üzerinde çalışıldı.\n\nArama sahası, sürüklenme, kazazedelerin görüşle tespiti ve yaklaşma emniyeti değerlendirildi. Gemi veya kurtarma botuyla alma seçeneği, pervane tehlikesi, yaralıların taşınması, hipotermi ve sağlık desteği ele alındı. Helikopter enkazı, yakıt ve rotor parçalarına yaklaşma riskleri üzerinde duruldu. Gerçek kurtarma ve tehlike yayını yapılmadı; faaliyetler simüle edildi.\n\nTalim sonunda kurtarılan kişi sayımı, olay bilgilerinin raporlanması, aramanın ilgili koordinasyon yetkisiyle sürdürülmesi/sonlandırılması ve ekipman hazırlığı değerlendirildi. Sonuç raporlamaya aktarıldı.","en":"A SAR scenario was initiated following a simulated report of a helicopter ditching at sea. Position, time, weather, sea conditions and possible casualty numbers were compiled, and the master and recovery team were informed. RCC/MRCC coordination, communications and lookout duties were practised.\n\nSearch area, drift, visual detection and safe approach were assessed. Shipboard or rescue-boat recovery, propeller hazards, casualty handling, hypothermia and medical support were considered. Risks associated with wreckage, fuel and rotor components were discussed. No live rescue or distress broadcast took place; actions were simulated.\n\nThe debrief covered casualty accounting, situation reporting, coordination authority for continuing or terminating the search, and recovery readiness. Findings were passed on for reporting."}},"editorial_v31":{"version":"3.1","changes":["Two-column full-length stage cards at wide breakpoints","27 distinct Turkish and English past-tense report samples","Removed redundant fictitious-record warnings from report page"],"parent_version":"3.0","previous_data_preserved":true,"original_signature_preserved":true,"report_examples_are_training_text":true}}</script>
<script>'use strict';
const DB=JSON.parse(document.getElementById('viewer-data').textContent);
const familyById=Object.fromEntries(DB.families.map(x=>[x.id,x]));
const flowById=Object.fromEntries(DB.flows.map(x=>[x.family+'~'+x.flow,x]));
const technicalByFamily=DB.technical.reduce((acc,x)=>{(acc[x.family]??=[]).push(x);return acc},{});
const date0=new Date();
const appState={lang:getLocal('role_lang')==='en'?'en':'tr',profile:getLocal('role_profile')==='general'?'general':'nene',search:''};
const queryState={drill:'',emergency:''};const scrollState=new Map();let lastRouteHash=location.hash;
const $=s=>document.querySelector(s);
const ehtml=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const L=(tr,en)=>appState.lang==='en'?en:tr;
function getLocal(k){try{return localStorage.getItem(k)}catch{return null}}
function saveLocal(k,v){try{localStorage.setItem(k,v)}catch{}}
function label(x,k){return x[k+'_'+appState.lang]||x[k+'_tr']||''}
function fmtMonth(y,m){return new Intl.DateTimeFormat(appState.lang==='en'?'en-GB':'tr-TR',{month:'long',year:'numeric',timeZone:'UTC'}).format(new Date(Date.UTC(y,m-1,1)))}
function shortDate(s){const a=s.split('-');return new Intl.DateTimeFormat(appState.lang==='en'?'en-GB':'tr-TR',{day:'numeric',month:'long',weekday:'long',timeZone:'UTC'}).format(new Date(Date.UTC(+a[0],+a[1]-1,+a[2])))}
function dayISO(y,m,d){return `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`}
function todayLocal(){const parts=new Intl.DateTimeFormat('en-CA',{year:'numeric',month:'2-digit',day:'2-digit',timeZone:'Europe/Istanbul'}).formatToParts(new Date());const o=Object.fromEntries(parts.map(p=>[p.type,p.value]));return {y:+o.year,m:+o.month,d:+o.day}}
const TODAY=todayLocal();

// Verbatim canonical policy: source release KEGM-ROLE-KANONIK-1.2.
function monthSundays(y,m){const first=new Date(Date.UTC(y,m,1));const offset=(7-first.getUTCDay())%7;let a=[];for(let d=1+offset;d<=new Date(Date.UTC(y,m+1,0)).getUTCDate();d+=7)a.push(new Date(Date.UTC(y,m,d)));return a;}
function iso(d){return d.toISOString().slice(0,10)}
function anchorDate(y,m,n){return monthSundays(y,m)[n-1]}
function fiveFire(y){let choices=[];for(let m=0;m<12;m++)if(monthSundays(y,m).length===5)choices.push(m);
 const base=[];for(let m=0;m<12;m++){const sun=monthSundays(y,m);base.push({d:sun[0],c:m%2?3:1},{d:sun[2],c:m%2?4:2})}
 const pref=[4,1,3,2], seq=[];let best=null,bestA=null;
 function rec(i){if(i===choices.length){const events=base.concat(choices.map((m,j)=>({d:monthSundays(y,m)[4],c:seq[j]}))).sort((a,b)=>a.d-b.d);const counts=[0,0,0,0];events.forEach(e=>counts[e.c-1]++);const D=Math.max(...counts)-Math.min(...counts);
  let R=0;for(let j=1;j<events.length;j++)if(events[j].c===events[j-1].c)R++;if(events.length&&events.at(-1).c===1)R++;
  const score=[D,R,...seq.map(c=>pref.indexOf(c))];if(best===null||cmp(score,best)<0){best=score;bestA=seq.slice()}return;}
  for(const c of [1,2,3,4]){seq.push(c);rec(i+1);seq.pop()}}
 function cmp(a,b){for(let i=0;i<a.length;i++)if(a[i]!==b[i])return a[i]-b[i];return 0}rec(0);
 return Object.fromEntries(choices.map((m,i)=>[m,bestA[i]]));}
const scenario={1:'Güverte',2:'Yaşam Mahalli',3:'Makine Dairesi',4:'Kuzine'};
function calendar(y){let events=[],fives=fiveFire(y);function add(d,family,title,kind='special',code='',note=''){events.push({date:iso(d),family,title,kind,code,note})}
 for(let m=0;m<12;m++){
 const ss=monthSundays(y,m);ss.forEach((d,i)=>{if(i===0||i===2){const c=m%2?(i===0?3:4):(i===0?1:2);add(d,'fire','Yangın — '+scenario[c],'fire','*'+c)}else if(i===4){add(d,'fire','Yangın — '+scenario[fives[m]],'fire','*'+fives[m])}
 if(i===1||i===3||i===4)add(d,'abandon','Gemiyi Terk','abandon','',m===3&&i===3?'Gemi–kara bağlantısı':'');add(d,'weekly','Haftalık kontrol','check')});
 add(ss[0],'monthly','Aylık kontrol hatırlatması','check');
 if([2,5,8,11].includes(m))add(ss[0],'quarterly','Üç aylık kontrol hatırlatması','check');
 if([0,3,6,9].includes(m)){add(ss[2],'steering','Acil Dümen (donanıma bağlı)','special','','3. pazar Yangın sonrası');const boatDay=(m===0||m===6)?ss[3]:ss[1];add(boatDay,'lifeboat','Filika İndirme (varsa)','special');add(boatDay,'boats','Kurtarma / Hizmet Botu (varsa)','special')}
 if(m===11)add(ss[1],'damage','Karaya Oturma');if(m===5)add(ss[0],'damage','Su Alma');
 if([1,4,7,10].includes(m))add(ss[1],'mob_sar','Denize Adam Düştü / Kurtarma');
 if(m===1)add(ss[0],'pollution','Deniz Kirliliği — *1 Tank Taşması');if(m===7)add(ss[0],'pollution','Deniz Kirliliği — *2 Sızıntı');
 if([2,8].includes(m))add(ss[1],'mob_sar','Arama ve Kurtarma');
 if([0,2,4,6,8,10].includes(m))add(ss[1],'confined','Kapalı Mahal — '+({0:'*1 Makine Dairesi',2:'*2 Tanklar',4:'*3 Başaltı',6:'*1 Makine Dairesi',8:'*2 Tanklar',10:'*3 Başaltı'}[m]));
 if(m===5)add(ss[1],'departure','Acil Kalkış');
 }
 return events.sort((a,b)=>a.date.localeCompare(b.date));}
function eventKey(ev){const f=ev.family;
 if(f==='fire')return 'fire~'+({'*1':'deck','*2':'accommodation','*3':'engine','*4':'galley'}[ev.code]||'deck');
 if(f==='mob_sar')return ev.title.includes('Arama')?'mob_sar~SAR':'mob_sar~MOB';
 if(f==='pollution')return ev.title.includes('Taşması')?'pollution~overflow':'pollution~leak';
 if(f==='damage')return ev.title.includes('Su Alma')?'damage~Su':'damage~Karaya';
 if(f==='boats')return 'boats~RESCUE';
 if(f==='confined')return 'confined~ENTRY';
 return {abandon:'abandon~abandon',steering:'steering~steering',lifeboat:'lifeboat~lifeboat',departure:'departure~emergency_departure'}[f]||null;
}
function evName(ev){if(ev.kind==='check')return ({weekly:L('Haftalık kontrol','Weekly check'),monthly:L('Aylık kontrol','Monthly check'),quarterly:L('Üç aylık kontrol','Quarterly check')})[ev.family]||ev.title;
 const k=eventKey(ev);const flow=flowById[k];return flow?label(flow,'title'):ev.title;}
function nonapplicable(ev){return appState.profile==='nene'&&ev.family==='lifeboat'}
function route(){const parts=decodeURIComponent((location.hash||'').replace(/^#\/?/,'')).split('/').filter(Boolean);return parts.length?parts:['takvim',String(TODAY.y),String(TODAY.m),String(TODAY.d)]}
function rootCalendar(y=TODAY.y,m=TODAY.m,d=TODAY.d){return `#/takvim/${y}/${m}/${d}`}
function appHeader(active){return `<header class="top"><div class="topInner">
 <a href="${rootCalendar()}" class="brand"><div class="brandMark" aria-hidden="true">R</div><div class="brandText"><strong>${L('Gemi Acil Role Talimleri','Shipboard Emergency Drills')}</strong><small>${L('Sürüm 3.6.1 · Kullanılabilir örnek plan ve rehber','Version 3.6.1 · Ready-to-use drill calendar and guide')}</small></div></a>
 <div class="topRight"><form id="globalSearchForm" role="search"><input id="globalSearch" aria-label="${L('Genel arama','Global search')}" class="selectDark" style="width:205px" placeholder="${L('Hızlı ara… ↵','Quick search… ↵')}" autocomplete="off"></form>
 <select id="profileSelect" class="selectDark" aria-label="${L('Gemi profili','Vessel profile')}"><option value="nene" ${appState.profile==='nene'?'selected':''}>${L('NENE HATUN · örnek','NENE HATUN · example')}</option><option value="general" ${appState.profile==='general'?'selected':''}>${L('Genel gemi','Generic vessel')}</option></select>
 <div class="langSwitch" aria-label="Language"><button data-lang="tr" class="${appState.lang==='tr'?'active':''}" aria-pressed="${appState.lang==='tr'}">TR</button><button data-lang="en" class="${appState.lang==='en'?'active':''}" aria-pressed="${appState.lang==='en'}">EN</button></div><button type="button" class="downloadHtmlBtn" data-download-html title="${L('Açık olan uygulamanın HTML dosyasını indir','Download this HTML application')}">${L('HTML İndir','Download HTML')}</button></div></div>
 <div class="navwrap"><nav class="nav" aria-label="${L('Ana menü','Main menu')}">
 <a href="${rootCalendar()}" class="${['takvim','yil'].includes(active)?'active':''}">${L('Takvim','Calendar')}</a>
 <a href="#/talimler" class="${['talimler','talim','brifing','kayit','teknik'].includes(active)?'active':''}">${L('Talim kartları','Drill cards')}</a>
 <a href="#/aciller" class="${['aciller','acil'].includes(active)?'active':''}">${L('Acil durumlar','Emergencies')}</a>
 </nav></div></header>`}
function monthLinks(y,m){const prev=new Date(Date.UTC(y,m-2,1)),next=new Date(Date.UTC(y,m,1));return {prev:rootCalendar(prev.getUTCFullYear(),prev.getUTCMonth()+1,1),next:rootCalendar(next.getUTCFullYear(),next.getUTCMonth()+1,1)}}
function weeklySunday(dateStr){
 const p=dateStr.split('-').map(Number), d=new Date(Date.UTC(p[0],p[1]-1,p[2]));
 d.setUTCDate(d.getUTCDate()+((7-d.getUTCDay())%7));return iso(d);
}
const CALENDAR_DESCRIPTIONS={
 abandon:['Role cetveline uygun toplanma, bildirim ve can kurtarma hazırlıkları.','Muster, reports and life-saving preparations according to assigned duties.'],
 fire:['Yangının mahalline özgü alarm, müdahale tertibi ve ekipman eğitimi.','Fire-location-specific alarms, response teams and equipment instruction.'],
 steering:['Köprüüstü ve dümen dairesi arasında kumanda devri, haberleşme ve yedek kumanda.','Steering changeover, bridge–steering-space communications and alternative controls.'],
 boats:['Kurtarma botu ve hizmet botu için ayrı hazırlık, indirme, manevra ve geri alma rehberleri.','Separate rescue- and service-craft guides for preparation, launch, manoeuvring and recovery.'],
 confined:['Kapalı mahale giriş ve personel kurtarma; atmosfer emniyeti ve görev paylaşımı.','Enclosed-space entry and personnel rescue; atmosphere safety and assigned roles.'],
 mob_sar:['Denize adam düşmesi, gözle takip, arama ve emniyetli sudan kurtarma.','Man overboard, lookout, search and safe recovery from the water.'],
 lifeboat:['Gemide mevcutsa filika donanımı, indirme ve geri alma prosedürü.','Lifeboat preparation, launching and recovery, if the vessel carries a lifeboat.'],
 pollution:['Kirliliğin kaynağı, yayılımın sınırlandırılması ve haberleşme.','Identify pollution sources, contain spread and coordinate communications.'],
 damage:['Gövde hasarı, su alma ve gemi emniyetinin değerlendirilmesi.','Assess hull damage, flooding and vessel safety.'],
 departure:['Acil kalkış hazırlığı, personel güvenliği ve güvenli manevra kararları.','Emergency departure preparations, crew safety and manoeuvring decisions.']
};
function richEventRow(ev){
 const check=ev.kind==='check',key=eventKey(ev),flow=key&&flowById[key],family=familyById[ev.family],noLifeboat=nonapplicable(ev);
 const icon=ev.kind==='fire'?'Y':ev.kind==='abandon'?'T':check?'✓':'+';
 const title=check?evName(ev):(ev.family==='confined'?L('Kapalı Mahalle Giriş ve Kapalı Mahalden Adam Kurtarma','Enclosed-Space Entry and Rescue'):(ev.family==='boats'?L('Kurtarma ve Hizmet Botu Talimi','Rescue and Service Craft Drill'):(ev.family==='mob_sar'&&ev.title.includes('Denize')?L('Denize Adam Düştü ve Denizden Adam Kurtarma','Man Overboard and Recovery'):evName(ev))));
 const description=check?L('Nöbetteki personelin haftalık kontrol hatırlatması; EK-III.','Weekly inspection reminder for the duty watch; EK-III.'):
 (CALENDAR_DESCRIPTIONS[ev.family]?CALENDAR_DESCRIPTIONS[ev.family][appState.lang==='en'?1:0]:family?label(family,'summary'):L('İlgili talim rehberine bakın.','Open the related drill guide.'));
 let note=ev.note||'';
 if(ev.family==='confined')note=ev.title.split('—')[1]?.trim()||ev.note||'';
 const code=check?'EK-III':(ev.family==='confined'?'EK-V':ev.kind==='special'?'EK-V':'EK-V');
 const badge=L(check?'HATIRLATMA':'PLANLANDI',check?'REMINDER':'PLANNED');
 const links=check?'':(ev.family==='confined'?`<a href="#/talim/confined~ENTRY">${L('Giriş rehberi','Entry guide')}</a><a href="#/talim/confined~RESCUE">${L('Kurtarma rehberi','Rescue guide')}</a><a href="#/kayit/confined~ENTRY">${L('Rapor Yazım Rehberi','Reporting guide')}</a>`:

       if(raw.includes('id="viewer-data"')&&raw.includes('Gemi Acil Role Talimleri')){
         download(filename,raw,'text/html;charset=utf-8');return;

}

function csvCell(value){return '"'+String(value).replaceAll('"','""')+'"'}
function exportCSV(y){const header=['Tarih','Olay','Aile','Tür','Varyant','Not'];const body=calendar(y).map(ev=>[ev.date,ev.title,ev.family,ev.kind,ev.code,(nonapplicable(ev)?L('NENE HATUN: can filikası bulunmadığından uygulanamaz; örnek koşullu plan kaydı.','NENE HATUN: not applicable; no lifeboat fitted, illustrative conditional entry.')+(ev.note?' | '+ev.note:''):ev.note)].map(csvCell).join(';'));download(`Gemi_Role_Talim_Ornek_${y}.csv`,'\ufeff'+[header.map(csvCell).join(';'),...body].join('\r\n'),'text/csv;charset=utf-8')}
function icsEsc(x){return String(x).replaceAll('\\','\\\\').replaceAll(';','\\;').replaceAll(',','\\,').replaceAll('\r\n','\\n').replaceAll('\n','\\n')}
function foldICAL(s){const enc=new TextEncoder();let rows=[],cur='',bytes=0;for(const c of s){const b=enc.encode(c).length;if(bytes+b>75){rows.push(cur);cur=' ';bytes=1}cur+=c;bytes+=b}rows.push(cur);return rows.join('\r\n')}
function exportICS(y){const events=calendar(y).filter(x=>x.kind!=='check');const lines=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Shipboard Emergency Drill Programme//KEGM-KANONIK-1.2//TR','CALSCALE:GREGORIAN','METHOD:PUBLISH','X-WR-CALNAME:Gemi Acil Role Talimleri '+y];for(let i=0;i<events.length;i++){const e=events[i],a=e.date.replaceAll('-','');const d=new Date(e.date+'T00:00:00Z');d.setUTCDate(d.getUTCDate()+1);lines.push('BEGIN:VEVENT','UID:role-'+y+'-'+(i+1)+'-'+a+'@shipboard-drills.local','DTSTAMP:20261109T000000Z','DTSTART;VALUE=DATE:'+a,'DTEND;VALUE=DATE:'+d.toISOString().slice(0,10).replaceAll('-',''),'SUMMARY:'+icsEsc(nonapplicable(e)?e.title+' — NENE HATUN: uygulanamaz (filika yok)':e.title),'DESCRIPTION:'+icsEsc('Örnek talim programı; geminin onaylı planı önceliklidir.'+(nonapplicable(e)?' NENE HATUN sertifikasında can filikası 0; bu kayıt yalnız koşullu genel örnektir.':'')),'END:VEVENT')}lines.push('END:VCALENDAR');download(`Gemi_Role_Talim_Ornek_${y}.ics`,lines.map(foldICAL).join('\r\n')+'\r\n','text/calendar;charset=utf-8')}
