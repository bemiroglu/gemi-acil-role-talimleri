body{font-size:15px;line-height:1.61;letter-spacing:.002em}
.topInner,.nav,.main,.foot{max-width:1450px}
.main{padding-bottom:35px}
.brandText strong{font-size:18px}
.pageHeading h1{font-size:clamp(26px,3vw,36px)}
.heroCard h1{font-size:clamp(27px,3vw,36px)}
.heroTop p,.boxHead p,.pageHeading p{font-size:13px;line-height:1.65}
.card{box-shadow:0 3px 14px rgba(10,49,66,.048)}
.eventLine strong{font-size:14px}.eventLine small{font-size:12px}
.stepCard{padding:22px 25px;margin-bottom:15px}
.stepTop{gap:12px;margin-bottom:12px}
.stepTop h2{font-size:19px;line-height:1.45;margin:0}
.stepNumber{font-weight:800;min-width:35px;height:35px;display:grid;place-items:center;border-radius:9px;font-size:13px}
.stepBlock{display:grid;grid-template-columns:145px minmax(0,1fr);align-items:start;gap:17px;padding:13px 3px;border-top:1px solid #e6eef1}
.stepBlock strong{font-size:12px;line-height:1.6;color:#4b6877}
.stepBlock p{font-size:14px;line-height:1.82;margin:0;color:#243d4c;overflow-wrap:anywhere}
.stepBlock.risk{padding:13px 14px;border:1px solid #eedbbd;background:#fff9f1;border-radius:9px;margin-top:11px}
.stepBlock.risk strong{color:#845d1c}
.detailedText p+p{margin-top:11px}
.detailedText p{line-height:1.82}
.stepBlock.context{background:#f8fbfc;border-radius:9px;border:1px solid #e1eaee;padding:15px;margin-top:3px}
.stepBlock.context strong{color:#0b716b}
.stepIndex{top:17px}
.stepIndex a{font-size:12px;line-height:1.5;padding-top:8px;padding-bottom:8px}
.tabStrip{display:flex;gap:5px;padding:7px;background:#eaf0f3;border:1px solid #cbdbe1;border-radius:12px;width:max-content;max-width:100%;flex-wrap:wrap;margin:14px 0 20px}
.tabStrip a{padding:12px 20px;border-radius:9px;color:#254b5c;font-size:14px;font-weight:800;line-height:1.4}
.tabStrip a.active{background:var(--navy);color:#fff;box-shadow:0 2px 7px #17344823}
.tabStrip a:not(.active):hover{background:#fff}
.returnBar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:8px 0 14px}
.returnBar a{font-size:13px;font-weight:700;color:var(--teal);padding:6px 0}
.returnBar .returnHint{font-size:11px;color:var(--muted)}
.guidanceLead{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:15px 0 20px}
.guideNote{border:1px solid var(--line);background:#fff;border-radius:11px;padding:19px}
.guideNote h3{font-size:15px;margin:0 0 8px}.guideNote p,.guideNote li{font-size:13px;line-height:1.8;margin:6px 0}
.guideNote ul,.guideNote ol{padding-left:21px;margin:9px 0}
.guideLabel{font-size:11px;font-weight:800;letter-spacing:.055em;color:#06786e;text-transform:uppercase;margin-bottom:7px}
.reportShell{max-width:1100px;margin:auto}
.guideHero{background:#fff;border:1px solid var(--line);border-radius:13px;padding:20px 23px}
.guideHero h1{font-size:clamp(26px,3vw,35px);margin:2px 0 5px}
.guideHero p{font-size:13px;color:var(--muted);margin:0}
.sampleBox{border:1px solid #c9dde0;background:#f1f8f8;border-left:4px solid var(--teal);border-radius:10px;padding:19px 21px;margin:18px 0}
.sampleBox h3{font-size:16px;margin:0 0 8px}
.sampleBox .sampleText{white-space:pre-line;font-size:14px;line-height:1.85;color:#173a47;margin-top:10px}
.sampleBox .sampleWarn{font-size:12px;color:#76571e;margin:8px 0;padding:9px 11px;background:#fff8e7;border-radius:8px}
.exampleTable{border-collapse:collapse;width:100%;background:#fff;border:1px solid var(--line);font-size:13px;margin:12px 0 0}
.exampleTable th,.exampleTable td{border-bottom:1px solid #e1e9ed;padding:11px 12px;text-align:left;vertical-align:top}
.exampleTable th{background:#edf4f5;font-size:12px;color:#254b59}
.exampleTable tr:last-child td{border-bottom:0}
.exampleTable td:first-child{font-weight:800;color:var(--teal);width:42px}
.creditMark{font-size:10px!important;opacity:.24!important;letter-spacing:.018em;user-select:none;color:#52697a}
.deepLink{border:1px solid #cadbdc;border-radius:9px;background:#f4faf9;padding:13px 15px;margin:20px 0;display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap}
.deepLink strong{font-size:13px}.deepLink span{font-size:12px;color:#53717b}
.languageStatus{background:#f3f7f8;border-left:3px solid #699baa;color:#496575;padding:8px 12px;margin:8px 0 0;border-radius:0 7px 7px 0;font-size:12px}
.shipOverview{border:1px solid #cbdddf;background:#f5faf9;border-radius:10px;padding:12px 15px;margin:12px 0 18px;font-size:13px;color:#2d5864}

<div id="app"><div style="padding:24px;font-family:Arial">Gemi Acil Role Talimleri · Loading…</div></div>
<script id="viewer-data" type="application/json">{"technical":[{"id":"AB-C01","family":"abandon","title_tr":"Terk kararı ve komuta","title_en":"Decision to abandon ship and command authority","paragraphs":[{"tr":"Gemiyi terk, personelin kendi kendine başlatacağı bir faaliyet değil; kaptanın olayın ciddiyetini, geminin emniyetli kalma olasılığını ve mevcut tahliye seçeneklerini değerlendirerek yönettiği bir acil durum safhasıdır. Kontrol altına alınamayan yangın, ilerleyen su alma, denge kaybı, çatışma, karaya oturma veya başka bir tehlikede öncelikle gemi üzerinde kalmanın riski ile gemiden ayrılmanın riski karşılaştırılır. Geminin mevkii, denizin durumu, rüzgâr yönü, yakın gemiler, kurtarma birimlerinin ulaşma süresi, su sıcaklığı, karanlık ve mevcut can kurtarma araçlarının kullanılabilirliği kararı etkiler.","en":"Abandoning ship is not an action to be initiated independently by individual crew members. It is an emergency phase directed by the master after assessing the severity of the event, the likelihood that the vessel can remain safe, and the available evacuation options. In an uncontrolled fire, progressive flooding, loss of stability, collision, grounding or other threat, the risks of remaining aboard must first be weighed against those of leaving the vessel. The vessel's position, sea state, wind direction, nearby ships, estimated arrival time of rescue units, water temperature, darkness and availability of life-saving appliances all affect the decision."},{"tr":"Talimde kaptana ulaşacak bilgiler senaryo sırasına göre geliştirilir: ilk ihbar, can/mal emniyeti, bölmenin durumu, müdahale başarısızlığı, personel sayısı ve yardım imkânı. Toplanma emri ile gemiyi fiilen terk emri farklıdır. Personelin güvenle toplanması, can kurtarma araçlarının hazırlanması ve ayrılmaya karar verilmesi farklı komuta safhalarıdır. Bazı olaylarda dış yardım gelene kadar gemide kalmak daha emniyetli olabilir; karar tek bir değişkene bağlanmaz.","en":"During the exercise, information reaching the master is developed as the scenario progresses: the initial report, threats to life and property, compartment condition, failure of response measures, personnel numbers and assistance available. An order to muster is distinct from an order actually to abandon ship. Safe assembly of personnel, preparation of life-saving appliances and the decision to leave are separate command phases. In some situations remaining aboard until outside assistance arrives may be safer; the decision must not be reduced to a single factor."}]},{"id":"AB-C02","family":"abandon","title_tr":"Alarm, role cetveli ve personel yoklaması","title_en":"Alarms, muster list and personnel accountability","paragraphs":[{"tr":"Personel, genel acil durum alarmının tanınmasını ve talim anonsunun gerçek olayla karışmayacak biçimde yapılmasını öğrenir. Göreve çağrı, genel alarm, yangın/terk talimi duyurusu ve kaptanın komutları rollerine göre ayrıştırılır. Gemideki rol cetvelinden istasyon, yedek görevli, toplanma sorumlusu, kurtarma botu ekibi, sağlık personeli ve haberleşme görevlileri gösterilir.","en":"Crew members learn to recognise the general emergency alarm and to distinguish a drill announcement clearly from a real emergency. A call to duties, the general alarm, announcements for fire or abandon-ship drills and the master's orders are differentiated according to their purpose. The muster list is used to identify stations, alternates, the person responsible for accounting, the rescue-boat crew, medical personnel and communications personnel."},{"tr":"Toplanma sırasında bütün personelin hesabı yapılır. Vardiyada kalan köprüüstü ve makine personeli, farklı mahallerde çalışanlar, yaralı/yardıma muhtaç kişi ve ulaşılmayan bir personel için özel senaryo kurulur. Personelin uygun giysi ve ayakkabı ile gelmesi, soğuktan korunma, hareket güzergâhının açıklığı ve panik kontrolü anlatılır. Sayım sonucu kaptana açık, kısa ve yeniden doğrulanabilir bir formatta rapor edilir.","en":"All persons must be accounted for at muster. Separate scenarios address bridge and engine-room watchkeepers who remain on duty, personnel working in other spaces, an injured or dependent person, and a person who cannot be contacted. Appropriate clothing and footwear, protection against cold, unobstructed access routes and avoidance of panic are explained. The headcount is reported to the master in a clear, concise and independently verifiable form."}]},{"id":"AB-C03","family":"abandon","title_tr":"Can yeleği ve uygunluk kontrolü","title_en":"Lifejackets and fit checks","paragraphs":[{"tr":"Can yeleği kişinin suda yüzdürülmesi ve hava yolunun açık tutulmasına yardımcı olan bir can kurtarma aracıdır. Donanımın boy/beden uygunluğu, üreticinin giyme işaretleri, bağların kapatılması ve sıkılması, varsa bacak kayışı, düdük, ışık, reflektif alanlar ve depolandığı yer personel üzerinde gösterilir. Can yeleği gevşek bırakılmaz; aynı zamanda solunumu engelleyecek biçimde aşırı sıkılmaz. Bir başkasının yeleğinin doğru giyildiği eşli kontrolle değerlendirilir.","en":"A lifejacket is a life-saving appliance designed to support a person afloat and help keep the airway clear. Suitable size, the manufacturer's donning markings, fastening and adjustment of straps, any crotch strap, whistle, light, retroreflective areas and storage location are demonstrated on a wearer. The lifejacket must not be left loose, nor tightened to the point of restricting breathing. Correct donning by another person is assessed using a buddy check."}]},{"id":"AB-C04","family":"abandon","title_tr":"Dalma giysisi ve TPA ayrımı","title_en":"Immersion suits versus thermal protective aids (TPAs)","paragraphs":[{"tr":"Dalma giysisi (immersion suit) soğuk suya maruziyette ısı kaybını azaltmak için tasarlanır. Uygun beden seçilir; fermuar, yüz çevresi, eldiven, başlık ve bütünlük kontrol edilir. Kullanıcı emniyetli zeminde oturarak ayak–gövde–kol–başlık sırasıyla giyer; fermuarı ve kapakçıkları üretici şemasına göre kapatır. Bazı giysiler can yeleğiyle birlikte kullanılmak zorundadır; bazılarının yüzdürme özelliği farklıdır. Giysi üzerinde açıkça belirtilen model talimatı belirleyicidir. LSA Code'daki iki dakika içinde giyilebilme koşulu bir tasarım/performans kıstasıdır; talimde tehlikeli bir hız yarışına dönüştürülmez.","en":"An immersion suit is designed to reduce heat loss during exposure to cold water. The correct size is selected, and the zip, face seal, gloves, hood and integrity are checked. On a stable surface, the wearer dons the suit in the sequence feet, torso, arms and hood, and closes the zip and flaps according to the manufacturer's diagram. Some suits must be used with a lifejacket; buoyancy characteristics differ between models. The instructions marked on the particular suit are decisive. The two-minute donning performance criterion in the LSA Code is a design/performance requirement and must not be turned into an unsafe speed competition during a drill."},{"tr":"Isıl koruyucu yardım malzemesi (thermal protective aid/TPA), dalma giysisinden farklıdır. Genellikle can kurtarma aracına alındıktan sonra ısı kaybını azaltmak için kullanılan bir korunma malzemesidir; can yeleği veya dalma giysisinin doğrudan ikamesi sayılmaz. Hangi malzemenin, kim tarafından ve ne zaman kullanılacağı ayrı anlatılır.","en":"A thermal protective aid (TPA) differs from an immersion suit. It is generally a protective item used after boarding a survival craft to reduce heat loss; it must not be treated as a direct substitute for a lifejacket or immersion suit. The appropriate item, intended user and circumstances of use are explained separately."}]},{"id":"AB-C05","family":"abandon","title_tr":"Şişirilebilir can salı, painter, HRU ve weak link","title_en":"Inflatable liferafts, painter, HRU and weak link","paragraphs":[{"tr":"Can salının üzerindeki kapasite, tip, konteyner kimliği, bakım/servis durumu ve yerleşim noktası tanıtılır. Personel; bağlama tertibatı, painter (salın bağlantı/şişirme halatı), hidrostatik serbest bırakma tertibatı (HRU) ve gerektiğinde kullanılan weak link (kopma bağı) kavramlarını ayırt eder. Bunların farklı görevleri ve yanlış bağlantı durumunda salın gemiyle birlikte sürüklenme veya gereken şekilde çalışmama riski değerlendirilir. Bu parçalar eğitim amacıyla yerinden sökülmez, yeniden bağlanmaz veya kullanılır hâle getirilerek tüketilmez; gerçek hazırlık, yetkili bakım ve üretici prosedürüne tabidir.","en":"The liferaft's marked capacity, type, container identification, servicing status and stowage position are introduced. Crew members distinguish the securing arrangement, painter (the raft's securing/inflation line), hydrostatic release unit (HRU) and, where applicable, weak link. Their different functions and the risks of incorrect connections—including failure to deploy correctly or being dragged down with the ship—are considered. These fittings are not dismantled, reconnected or consumed for instructional purposes; actual preparation must follow authorised maintenance and manufacturer procedures."},{"tr":"Salın denize bırakılması ve şişirilmesinin teorik sırası, gemideki gerçek tipin şeması üzerinden gösterilir. Can salı içindeki giriş alanı, biniş yardımı, tutamak, merdiven, çadır/koruyucu örtü, yüzdürücü hacim, deniz demiri, su tahliye araçları, el pompası, kürek, onarım malzemesi, ışık, işaret ve temel yaşam donanımının işlevleri açıklanır. Gerçek ekipman paketi, salın sınıf ve tipine göre değişir; bütün sayılan malzemelerin gemideki her salda mevcut olduğu varsayılmaz.","en":"The theoretical sequence for launching and inflating the liferaft is demonstrated using the diagram for the actual type installed aboard. The functions of the entrance, boarding aids, handholds, ladder, canopy, buoyancy chambers, sea anchor, bailers, hand pump, paddles, repair materials, lights, signals and basic survival equipment are explained. The actual equipment pack depends on the class and type of raft: no assumption is made that every listed item is carried in every raft aboard."}]},{"id":"AB-C06","family":"abandon","title_tr":"Can salına emniyetli biniş ve tahliye güzergâhı","title_en":"Safe liferaft boarding and evacuation routes","paragraphs":[{"tr":"Personel mümkün olduğunda suya girmeden, emniyetli biniş noktasından sala erişmeyi hedefler. Suda kalma zorunluluğu, yüksek borda, dalga, rüzgâr altı/üstü ve yorgun kazazedeye yardım gibi alternatifler ayrı senaryo olarak ele alınır. Eğitim, canlı can salının gereksiz yere şişirilmesini veya düşürülmesini gerektirmez.","en":"Wherever practicable, personnel should aim to board from a safe embarkation position without entering the water. Alternatives involving unavoidable immersion, a high freeboard, sea and wind conditions, or assisting an exhausted survivor are considered as separate scenarios. Training does not require unnecessary inflation or release of a serviceable liferaft."}]},{"id":"AB-C07","family":"abandon","title_tr":"Can salında hayatta kalma ve görev yönetimi","title_en":"Survival aboard a liferaft and allocation of duties","paragraphs":[{"tr":"Can salı içinde öncelik, insanların sayısının doğrulanması, yaralıların korunması, ıslaklığın ve ısı kaybının azaltılması, salın dengesinin sağlanması ve kurtarma ekiplerine bulunabilir hâle gelmektir. Ekip, görev dağılımı yapar; çadır/giriş açıklıkları, havalandırma, deniz demiri, su tahliyesi ve nöbet düzeni sal tipine göre tanıtılır. Su ve yiyecek kaynaklarının kayda alınması, kullanımın yönlendirilmesi ve işaret donanımının uygun zamanda kullanılması ayrı eğitim konusu oluşturur.","en":"In a liferaft, immediate priorities include confirming the number of persons, protecting injured survivors, reducing wet exposure and heat loss, maintaining raft stability and ensuring that rescuers can locate the occupants. Duties are assigned. Canopy/entrance openings, ventilation, sea anchor, bailing and watchkeeping arrangements are explained according to the raft type. Recording water and food stores, managing their use and deploying signalling appliances at appropriate times are separate training topics."}]},{"id":"AB-C08","family":"abandon","title_tr":"Soğuk su, hipotermi ve ilk yardım","title_en":"Cold-water exposure, hypothermia and first aid","paragraphs":[{"tr":"Hipotermi, vücudun ürettiğinden daha fazla ısı kaybetmesiyle gelişen tehlikeli durumdur. Soğuk suya girişte ilk şok, solunum kontrolünün kaybı, yüzme/iş yapma becerisinin bozulması ve uzun süreli ısı kaybı birbirinden ayrılır. İlk yardım öğretiminde mümkünse kişinin sudan çıkarılması, rüzgârdan korunması, uygun örtü ve kuru yalıtım sağlanması, bilinç ve solunumun izlenmesi ve tıbbi yardım çağrılması vurgulanır. Bilinci bozuk kişiye ağızdan içecek verilmez; müdahale güncel tıbbi ilk yardım eğitimine göre yürütülür.","en":"Hypothermia is a dangerous condition arising when the body loses heat faster than it produces it. Initial cold-water shock, loss of breathing control, deterioration in swimming or work capability and longer-term cooling are distinguished. First-aid instruction emphasises recovering the person from the water when possible, shielding them from wind, providing appropriate covering and dry insulation, monitoring consciousness and breathing, and seeking medical assistance. Nothing is given orally to an unconscious or impaired-consciousness casualty. Treatment follows current medical first-aid training."}]},{"id":"AB-C09","family":"abandon","title_tr":"Ağır hava ve alternatif tahliye","title_en":"Heavy weather and alternative evacuation options","paragraphs":[{"tr":"Kötü hava, gece ve görüş kaybı; sal seçimi, gemiden ayrılma yönü, biniş, yaralı taşıma, bot manevrası ve arama-kurtarma birimleriyle temas üzerinde etkili olur. Alternatifler arasında başka geminin yardımı, kurtarma botuyla transfer ve yetkili kurtarma ekiplerinin helikopterle tahliyesi bulunabilir. Helikopterin kapasite, menzil ve güvenli yaklaşma durumu cihaz ve olay özelinde değişir; arşivdeki genel sayısal menzil örnekleri güncel, evrensel bilgi gibi kullanılmaz.","en":"Heavy weather, darkness and loss of visibility affect the choice of survival craft, the direction of departure from the ship, embarkation, casualty transfer, boat manoeuvring and communication with search-and-rescue units. Possible alternatives include assistance from another ship, transfer by rescue boat and helicopter evacuation by authorised rescue teams. Helicopter capacity, range and safe approach conditions are specific to the equipment and circumstances; general historical range figures must not be presented as current universal limits."}]},{"id":"SAR-C01","family":"abandon","title_tr":"Can kurtarma haberleşmesi ve gerçek alarm ayrımı","title_en":"Survival-craft communications versus genuine distress alerts","paragraphs":[{"tr":"VHF/GMDSS: Gemi istasyonu ve taşınabilir can kurtarma VHF cihazlarının görevleri açıklanır. Tehlike çağrısının ve takibindeki sesli mesajın kimin yetkisiyle yapılacağı, gemi adı/mevkii, tehlikenin niteliği, gemideki kişi sayısı ve gereken yardım türü gibi bilgi unsurları senaryoda çalışılır. Gerçek DSC veya sesli tehlike çağrısı, talim mesajı olarak yayınlanmaz. Eğitimde senaryo kâğıdı, rol paylaşımı, uygun eğitim prosedürü ve cihazın onaylı test işlevi kullanılabilir.","en":"VHF/GMDSS: The purposes of the ship's radio station and portable survival-craft VHF radios are explained. The exercise covers who is authorised to initiate a distress alert and associated voice message, together with the information required: ship's name and position, nature of distress, number of persons aboard and assistance requested. No real DSC or voice distress alert is transmitted as a drill message. Scenario cards, assigned roles, an approved training procedure and an authorised device test function may be used instead."}]},{"id":"SAR-C02","family":"abandon","title_tr":"EPIRB, radar SART ve AIS-SART farkları","title_en":"EPIRB, radar SART and AIS-SART: distinctions","paragraphs":[{"tr":"EPIRB, etkinleştirildiğinde uydu tabanlı arama-kurtarma alarm zincirine katkı sağlayan cihazdır. Braketi/yuvası, kayıt ve bakım etiketi, gerekliyse otomatik salıverme tertibatı ve üreticinin self-test usulü tanıtılır. EPIRB'nin gerçek alarm modunda çalıştırılması normal bir eğitim testi değildir. Testin sıklığı ve yöntemi üretici el kitabındaki sınırlara uygun olmalıdır.","en":"An EPIRB, when activated, contributes to the satellite-based search-and-rescue alerting chain. Its bracket or housing, registration and service labels, any automatic release arrangement and the manufacturer's self-test procedure are introduced. Activating the EPIRB in its real distress mode is not a routine training test. Self-test frequency and method must comply with the device manufacturer's instructions."},{"tr":"Radar SART ve AIS-SART, kurtarma birimlerinin kazazedeleri yerelleştirmesine yardımcı olan farklı cihaz aileleridir; radar yanıtı ile AIS tabanlı yayın aynı mekanizma değildir. Personelin anten/yükseltme yeri, aktivasyon yöntemi ve varsa test fonksiyonu, gemide mevcut cihazın tipine göre anlatılır.","en":"Radar SART and AIS-SART are different device types that assist rescue units in locating survivors; radar response and AIS-based transmission do not use the same mechanism. Antenna/elevated placement, activation procedure and any test function are explained according to the actual equipment carried aboard."}]},{"id":"SAR-C03","family":"abandon","title_tr":"Piroteknik ve görsel işaretlerin güvenli tanıtımı","title_en":"Safe familiarization with pyrotechnic and visual signals","paragraphs":[{"tr":"İşaretler: El maytabı, paraşütlü işaret fişeği, duman kandili, Aldis/projektör, düdük, dümen ve bayrak işaretlerinin amaçları ayırt edilir. Pirotekniklerin gösterimi inert eğitim modeli veya görsel malzemeyle yapılır; yetkili prosedür ve izin olmadan gerçek fişek kullanılmaz.","en":"Signals: The functions of handheld flares, rocket parachute flares, smoke signals, Aldis/signalling lamps, whistles, steering-related signals and flags are differentiated. Pyrotechnics are demonstrated with inert training models or visual material; no live flare is used without the authorised procedure and permission."}]},{"id":"BL-C01","family":"abandon","title_tr":"Can filikası, kurtarma botu ve hizmet botu ayrımı","title_en":"Lifeboats, rescue boats and service boats: distinctions","paragraphs":[{"tr":"Can salı, can filikası (lifeboat), kurtarma botu (rescue boat) ve hizmet botu (service/work boat) ayrı görev ve sertifikasyon kavramlarıdır. Geminin kurtarma botunun bulunması, ayrıca bir can filikasının bulunduğu anlamına gelmez. Bir botun gemiyi terk veya kurtarma görevindeki kullanımı, gerçek donanımın onay ve kullanım sınırlarına göre belirlenir.","en":"Inflatable liferafts, lifeboats, rescue boats and service/work boats have distinct purposes and certification categories. A vessel carrying a rescue boat does not necessarily carry a lifeboat. Whether a particular boat may be used for abandonment or recovery depends on the approval and operating limitations of the equipment actually installed."},{"tr":"Mevzuat ayrımı: SOLAS III/19.3.4.3 can filikalarıyla, III/19.3.4.6 kurtarma botlarıyla ilgilidir. İkinci hüküm kurtarma botunun koşullar elverdiğince aylık, her durumda en az üç ayda bir suya indirilip mürettebatça manevra yaptırılmasına ilişkin genel kuralı içerir; geminin bayrak/sertifika uygulaması ayrıca doğrulanır. NENE HATUN'a can filikası indirme talimi varmış gibi atama yapılmaz. Kurtarma botunun suya indirilmesine yönelik EYS.09.124.FR risk formu, gemide yürürlükteyse ilgili faaliyetin hazırlığında gözden geçirilir.","en":"Regulatory distinction: SOLAS III/19.3.4.3 addresses lifeboats, whereas III/19.3.4.6 addresses rescue boats. The latter generally calls for launching and manoeuvring with the assigned crew each month as far as reasonable and practicable, and in any case at least once every three months. Flag and certification requirements applicable to the vessel must also be confirmed. No fictional lifeboat-launching assignment is made for NENE HATUN. If EYS.09.124.FR is the current applicable risk assessment form, it is reviewed when preparing an actual rescue-boat launching activity."}]},{"id":"BL-C02","family":"abandon","title_tr":"Suya indirme öncesi risk, izin ve gözetim","title_en":"Pre-launch risk assessment, authorization and supervision","paragraphs":[{"tr":"Gerçek suya indirme faaliyeti planlanıyorsa ayrı işe özgü risk değerlendirmesi yapılır ve izinli/sorumlu personel belirlenir. Hava-deniz durumu, geminin hızı ve konumu, indirme tertibatının emniyeti, insan taşıma yetkisi, vinç/davit, askı sistemleri, haberleşme, kişisel donanım, tehlikeli alanların sınırlandırılması ve botun geri alınabilmesi ele alınır. Talim sırasında botun yanlış yüklenmesi, emniyet tertibatlarının gelişi güzel işletilmesi veya sadece senaryo gereği gerçek emniyet kritik sisteminin devreden çıkarılması kabul edilemez.","en":"If an actual launching operation is planned, a task-specific risk assessment is carried out and authorised/responsible personnel are designated. Weather and sea conditions, the vessel's speed and position, launching-appliance condition, certification for carrying persons, davit/crane, suspension arrangements, communications, personal protective equipment, exclusion zones and the ability to recover the boat are assessed. Incorrect loading, arbitrary operation of safety devices or disabling a safety-critical system merely to create a drill scenario is unacceptable."}]},{"id":"RP-C01","family":"abandon","title_tr":"Gerçek uygulama, simülasyon ve jurnal kayıt ayrımı","title_en":"Actual operations versus simulations and logbook entries","paragraphs":[{"tr":"Kayıt ilkesi: Tarih, saat, gemi/mevki, talimin senaryosu, sorumlu zabit, katılan posta/personel sayısı, gerçek yapılan işlemler, yalnızca simüle edilen adımlar, can kurtarma aracı indirilmişse hangi araç olduğu ve indirme tarihi, haberleşme eğitimi, hipotermi/ağır hava eğitimi, eksiklikler ve düzeltici faaliyetler raporda açıkça ayrılır. EK-V'deki 12 Gemiyi Terk kontrol konusu ve ilgili EYS.08.103.FR kurum içi kontrol listesi referansı gözden geçirilir. EK-VI'nin güverte/makine jurnali talimatı, kurumun güncel kayıt usulüne göre uygulanır. Personel, role ve risk analizi çevrimiçi ayrıca doldurulmaz.","en":"Recording principle: The report separately identifies the date, time, vessel/position, scenario, responsible officer, watch or personnel numbers, actions actually performed, steps only simulated, any survival craft actually launched (its identity and launching time), communications training, hypothermia/heavy-weather instruction, deficiencies and corrective actions. The twelve abandon-ship checklist topics in EK-V and the separate institutional emergency checklist EYS.08.103.FR are reviewed without conflating the two. EK-VI deck/engine logbook instructions are applied according to the organisation's current recording procedure. No duplicate online muster or risk-analysis form is completed in this application."},{"tr":"Raporun güvenilirliği: Her iki metin yazım örneğidir; gerçek resmi kayda yalnızca o talimde fiilen yapılan veya açıkça simüle edilen işlemler geçirilir. Örnek raporlar uygulamada serbestçe kopyalanıp düzenlenebilir; ayrı web formu gerekmez.","en":"Record integrity: Both narratives are writing examples; official records must include only the actions actually performed during that drill or expressly simulated as such. Sample reports may be copied and edited within the application; a separate web form is unnecessary."}]},{"id":"RP-C02","family":"abandon","title_tr":"Talim sonrası ekipmanın yeniden hazır hâle alınması","title_en":"Restoring life-saving appliances to readiness after drills","paragraphs":[{"tr":"Talimde kullanılan kişisel donanım, haberleşme cihazları, bot/indirme tertibatı ve güvenlik malzemeleri kullanım sonrasında kontrol edilir. Islak veya kullanılmış ekipman uygun şekilde temizlenip kurutulur, bakım gerektiren malzemeler ilgili usulle ayrılır, eksiklikler kaptana ve teknik sorumlulara bildirilir. Cihaz veya bağlama donanımı gerçek görevi yerine getiremeyecek durumda bırakılmaz.","en":"After the exercise, personal equipment, radios, boats/launching arrangements and safety gear used during the drill are inspected. Wet or used equipment is cleaned and dried appropriately; items requiring maintenance are segregated under the relevant procedure, and defects are reported to the master and responsible technical personnel. Communications devices or securing arrangements must not be left unfit for their actual emergency function."}]},{"id":"AB-C10","family":"abandon","title_tr":"Can kurtarma donanımında acil onarımın yetki sınırları","title_en":"Authority limits for emergency repairs to life-saving appliances","paragraphs":[{"tr":"Önerilen yeni teknik kartlar: (i) acil aydınlatma ve tahliye güzergâhı, (ii) hidrostatik bırakma ve painter tertibatının güvenli kavramsal anlatımı, (iii) TPA ile dalma giysisi farkı, (iv) sal içi yaşam ve görev yönetimi, (v) güvenli geri alma/yeniden hazır hâle getirme, (vi) arıza ve acil onarımın yetki sınırları.","en":"Proposed additional technical cards: (i) emergency lighting and evacuation routes; (ii) a safe conceptual explanation of hydrostatic release, the painter arrangement and its weak link; (iii) the distinction between a thermal protective aid (TPA) and an immersion suit; (iv) survival and duty allocation inside a liferaft; (v) safe recovery and restoration of equipment readiness; and (vi) the limits of authorisation for fault rectification and emergency repairs."}]},{"id":"FIRE-COMMON-01","family":"fire","title_tr":"Yangının bilimsel temeli","title_en":"Scientific principles of fire","paragraphs":[{"tr":"Yangın, yanıcı madde, oksitleyici ortam ve yeterli enerjinin meydana getirdiği; ilerleyişi kimyasal zincir reaksiyonlarıyla sürdürülebilen bir yanma olayıdır. Gemide metal yapı ile ısı iletimi, sıcak gaz ve dumanın taşınımı, yakındaki nesnelere ışınım ve doğrudan alev teması ayrı yayılma yollarıdır. Yangına yaklaşırken yalnızca görülen alev değil, kapı arkasındaki ısının ve havalandırma ağının yangını nerelere taşıyabileceği de değerlendirilir.","en":"Fire is a combustion process involving fuel, an oxidising environment and sufficient energy; its propagation can be sustained by chemical chain reactions. On board a ship, heat conduction through metal structures, convection of hot gases and smoke, radiation to nearby objects, and direct flame contact are distinct mechanisms of fire spread. When approaching a fire, responders assess not only the visible flames but also heat behind doors and the possible spread of fire through the ventilation system."}]},{"id":"FIRE-COMMON-02","family":"fire","title_tr":"Yangın sınıfları ve ajan seçimi","title_en":"Fire classes and selection of extinguishing media","paragraphs":[{"tr":"Yangın sınıfları yanan maddeye ve kullanılan standarda göre açıklanır. Katı yanıcılar (A), sıvı/çözücü kaynaklı yangınlar (B), yanıcı gaz tehlikesi ve elektrik enerjisi taşıyan donanım özel riskler oluşturur. Canlı elektrik altında su ve iletken ajan kullanımının riski ayrı öğretilir. Kızgın pişirme yağı için Avrupa sınıflandırmasında F, ABD'de K kodu kullanılır. Ulusal sınıf etiketleri birbirinin yerine varsayılmaz; söndürücünün etikette tanımlanan uygulanabilirliği esas alınır.","en":"Fire classes are explained by reference to the burning material and the classification standard in use. Solid combustibles (Class A), flammable liquids and solvents (Class B), flammable gases, and electrically energised equipment present different hazards. The risks of applying water or conductive extinguishing agents to live electrical equipment are taught separately. Fires involving hot cooking oils and fats are designated Class F under European classification and Class K in the United States. National class labels must not be treated as interchangeable; the extinguisher’s stated suitability on its label governs its selection."}]},{"id":"FIRE-COMMON-03","family":"fire","title_tr":"Organizasyon ve haberleşme","title_en":"Emergency organization and communications","paragraphs":[{"tr":"İlk fark eden personel, mahal–yangın/duman görünümü–varsa tehlikede kişi–ilk güvenli hareket bilgisini süratle bildirir. Köprüüstü/kaptan koordinasyonu, yangınla mücadele ekipleri, makine–elektrik destek, yaralı/ilk yardım ve sınır soğutma görevlileri role cetveli üzerinden tanıtılır. Her ekibin giriş/çıkış, personel sayısı ve telsiz haberleşme düzeni değerlendirilir. Talim anonsu gerçek tehlike mesajından ayrılır; gerçek tehlike frekanslarında sahte çağrı oluşturulmaz.","en":"The person first discovering a fire promptly reports the location, the appearance of the fire or smoke, any persons at risk, and the first safe action taken. Coordination by the bridge and master, firefighting teams, machinery and electrical support, casualty and first-aid personnel, and boundary-cooling teams is explained using the muster list. Each team’s entry and exit arrangements, personnel accountability and radio communications are reviewed. The drill announcement is distinguished from a real emergency message, and no false distress communication is transmitted on actual emergency frequencies."}]},{"id":"FIRE-COMMON-04","family":"fire","title_tr":"Kişisel donanım SCBA/EEBD ayrımı","title_en":"Personal protective equipment: SCBA versus EEBD","paragraphs":[{"tr":"Yangın müdahale giysisi, baret/yüz koruması, eldiven, bot, uygun SCBA/BA, kişisel aydınlatma ve haberleşme cihazının işlevleri gösterilir. BA basıncı, uygunluğu, yüz maskesi sızdırmazlığı, düşük hava uyarısı ve geri çekilme iletişimi ekipman modeline göre öğrenilir. Personel yedek emniyet planı olmadan dumanlı kapalı mahale gönderilmez. EEBD yalnızca kaçış içindir; yangına girişte BA yerine kullanılamaz. Talim bitiminde kullanım görmüş tüp ve koruyucuların emniyetli durumu geri sağlanır.","en":"The functions of protective firefighting clothing, helmet or face protection, gloves, boots, appropriate self-contained breathing apparatus (SCBA/BA), personal lighting and communication equipment are demonstrated. Personnel learn the equipment-specific procedures for checking cylinder pressure, suitability, facepiece seal, low-air warning and withdrawal communications. No one is sent into a smoke-filled enclosed space without a backup safety plan. An emergency escape breathing device (EEBD) is intended for escape only and must not be substituted for breathing apparatus used for firefighting entry. After the drill, used cylinders and protective equipment are restored to a safe, ready condition."}]},{"id":"FIRE-COMMON-05","family":"fire","title_tr":"Yangın devresi ve sınır soğutma","title_en":"Fire main and boundary cooling","paragraphs":[{"tr":"Yangın pompası, yangın ana devresi, hortum, uygun nozul ve en az iki jet uygulamasının amacı ve haberleşmesi açıklanır. Gerçek su testi için denize/mahalle su verilmesinin etkileri; kaygan zemin, elektrik, soğutma suyu birikimi, kapalı alan drenajı, serbest yüzey ve kirlilik yönünden değerlendirilir. İki su jetiyle sistem yeterliliğinin gösterilmesi, her tür yanan maddeye doğrudan su uygulanması anlamına gelmez. Söndürme ajanı seçimi yangın tipi ve güvenli uygulamaya bağlıdır.","en":"The purpose and communications associated with the fire pump, fire main, hoses, suitable nozzles and demonstration of at least two jets of water are explained. Before a live water test, the consequences of discharging water overboard or into a compartment are assessed, including slippery surfaces, electrical hazards, water accumulation, drainage in enclosed areas, free-surface effects and pollution. Demonstrating the system’s capacity with two jets does not mean that water should be applied directly to every burning material. Selection of the extinguishing medium depends on the type of fire and the safety of its application."}]},{"id":"FIRE-COMMON-06","family":"fire","title_tr":"Tecrit ve sabit sistemlerde emniyet","title_en":"Isolation and safety of fixed fire-extinguishing systems","paragraphs":[{"tr":"Havalandırmanın durdurulması, yangın kapısı/damperi, elektrik ve yakıt izolasyonu ile komşu mahallerin korunması yer–görev–izin ilişkisi içinde anlatılır. Bir sistemi durdurmanın seyir ve yaşam güvenliğine etkisi, alternatif enerji ve kumanda imkânlarıyla birlikte değerlendirilir. Sabit CO₂ gibi gazlı söndürme sistemleri hakkında kompartmanın tamamen boşaltılması, personelin sayılması, hava girişlerinin kontrolü, yetkili karar, boğulma tehlikesi, yeniden tutuşma ve emniyetli yeniden giriş kavramları anlatılır. Talimde gaz boşaltımı gerçekleştirilmez.","en":"Stopping ventilation, closing fire doors and dampers, isolating electricity and fuel, and protecting adjacent compartments are explained in terms of location, responsibility and authorisation. The effects of shutting down a system on navigational safety and the safety of persons on board are considered together with alternative power and control arrangements. For fixed gaseous extinguishing systems such as CO₂, the training covers complete evacuation of the protected compartment, personnel accountability, control of air inlets, an authorised decision to release the agent, asphyxiation hazards, possible re-ignition and safe re-entry. No extinguishing gas is discharged during the drill."}]},{"id":"FIRE-COMMON-07","family":"fire","title_tr":"Talim sonlandırma ve kayıt doğruluğu","title_en":"Drill termination and record accuracy","paragraphs":[{"tr":"Talimde denenmiş donanımın çalışır durumda bırakılması, arıza/eksikliklerin giderilmesi, gerçek yapılan işlem ile sadece senaryo üzerinde değerlendirilen işlemin ayrı anlatılması, kaptan ve sorumlu zabitin değerlendirmesi, uygun jurnal ve EK-V kayıt süreci açıklanır. Geçmiş örnek raporda “yangın söndürüldü” ifadesi senaryo yangınına işaret edebilir; gerçek söndürücü boşaltılmışsa bu ayrı kaydedilir. Gerçekte yapılmayan dış bildirimler ve sabit sistem çalıştırması yapılmış gibi kaydedilmez.","en":"The drill close-out includes restoring tested equipment to operational readiness, reporting or rectifying defects, distinguishing actions actually performed from actions considered only within the scenario, assessment by the master and responsible officer, and appropriate logbook and EK-V training records. In an illustrative past-tense report, the phrase “the fire was extinguished” may refer to a simulated fire; any actual discharge of an extinguisher must be recorded separately. External notifications and operation of fixed systems that did not occur must not be recorded as if they had taken place."}]},{"id":"STEERING_COMMON_01","family":"steering","title_tr":"Ana dümen, yardımcı dümen ve alternatif kumanda ayrımı","title_en":"Main, auxiliary and alternative steering arrangements","paragraphs":[{"tr":"“Yedek dümen” tek tip bir cihaz adı değildir. Gemi tasarımında ayrı yardımcı dümen sistemi, birden çok tahrik/güç ünitesi, birden fazla uzaktan kumanda devresi veya doğrudan yerel kumanda bulunabilir. Bir sistemdeki yedeklilik, diğer sistemin tamamen bağımsız olduğu anlamına gelmez; elektrik beslemesi, hidrolik devre, sensör ve kontrol devreleri bakımından tek arıza noktaları değerlendirilir. Eğitim sırasında güncel geminin onaylı sistem blok şeması ve köprüüstü/dümen dairesi yerleşimi esas alınır. Eski prosedürde belirtilen “iki güç ünitesi” bilgisi, bugün bütün gemiler için kesin envanter verisi olarak genellenmez.","en":"“Emergency” or “backup” steering does not denote one universal piece of equipment. Depending on the ship’s design, the arrangement may include a separate auxiliary steering gear, multiple drive or power units, more than one remote-control circuit, or direct local control. Redundancy in one subsystem does not mean that other subsystems are fully independent; possible single points of failure in electrical supplies, hydraulic circuits, sensors and control circuits must be examined. Training uses the ship’s current approved system block diagram and the actual bridge and steering-gear compartment layout. A statement in an older procedure referring to “two power units” must not be generalised as confirmed equipment inventory for every ship."}]},{"id":"STEERING_COMMON_02","family":"steering","title_tr":"Kumanda zinciri ve geri besleme","title_en":"Steering command chain and feedback","paragraphs":[{"tr":"Dümen simidi/joystick veya otomatik pilot komutu, kumanda sistemi üzerinden tahrik ünitesine ulaşır. Dümenin gerçek konumu, ayrı gösterge veya geri besleme üzerinden izlenir; geminin pruva yönündeki değişim ise dümenin hidrodinamik etkisine, hıza ve dış kuvvetlere bağlıdır. Bu nedenle emredilen açı, görülen gerçek açı ve gemi başının değişimi birbirinin aynı değildir. Talimde bu üç bilgi arasında yanlış eşleşme veya gecikme olması hâlinde hangi gözlemin esas alınacağı öğretilir.","en":"A command from the helm, joystick or autopilot reaches the steering drive through the control system. The rudder’s actual position is monitored using a separate indication or feedback signal, while the vessel’s heading response depends on rudder hydrodynamics, speed and external forces. Consequently, the ordered rudder angle, displayed actual rudder angle and change of heading are not the same quantity. The drill explains which observations take precedence if these three indications disagree or exhibit a delay."}]},{"id":"STEERING_COMMON_03","family":"steering","title_tr":"Follow-up, non-follow-up ve yerel kumanda kavramları","title_en":"Follow-up, non-follow-up and local steering control","paragraphs":[{"tr":"Follow-up (FU) kumandada dümen belirlenen açıya otomatik geri beslemeyle gider; non-follow-up (NFU) veya başka yerel yöntemlerde kumanda karakteri farklı olabilir. “Yerel kontrol”, “NFU”, “acil dümen” ve “yardımcı dümen” terimleri donanımın üreticisine göre aynı anlama gelmeyebilir. Personel, köprüüstü ve yerel panel üzerindeki gerçek etiketleri, sistem değiştirme şemasını, kullanılacak güç ünitesini ve komutların hangi durumda geçerli olacağını inceler. Birden çok kumanda mevkisinin aynı anda emir üretmesi önlenir; devir/teslim kararı kesinleştirilir.","en":"With follow-up (FU) control, feedback automatically brings the rudder to the selected angle; non-follow-up (NFU) and other local-control methods may operate differently. Depending on the manufacturer and installation, “local control”, “NFU”, “emergency steering” and “auxiliary steering” do not necessarily mean the same thing. Personnel examine the actual markings on bridge and local panels, the changeover diagram, the selected power unit and the conditions under which each command takes effect. Simultaneous commands from multiple control stations are prevented, and transfer of control authority is clearly confirmed."}]},{"id":"STEERING_COMMON_04","family":"steering","title_tr":"Köprüüstü ile dümen dairesi haberleşmesi","title_en":"Bridge-to-steering-gear-room communications","paragraphs":[{"tr":"Köprüüstü geminin konumunu, trafik ve manevra durumunu görür; yerel kumanda personeli çoğu zaman deniz trafiğini doğrudan görmez. Köprüüstünden verilen emrin tekrar edilmesi (read-back), yerine getirildiğinin bildirilmesi ve gerçek dümen pozisyonuyla teyidi gerekir. Örnek iç haberleşme, gemiye uygun dümen kumanda terminolojisiyle kurulur: “İskele ...”, “İskele ... alındı”, “Dümen ... iskelede”. Kesin açı, geminin test emniyet sınırına ve kaptan kararına bağlıdır. Haberleşme kesilirse tahmini/uydurulmuş komutla hareket edilmez; önceden belirlenmiş emniyetli haberleşme kaybı planı uygulanır.","en":"The bridge has situational awareness of the vessel’s position, traffic and manoeuvring, whereas personnel at the local steering station often have no direct view of maritime traffic. Orders from the bridge must be read back, their execution reported and the actual rudder position confirmed. Internal communications are practised using steering terminology appropriate to the vessel, for example “Port …”, “Port … received” and “Rudder … to port”. The exact angles depend on the vessel’s safe testing limits and the master’s decision. If communications fail, personnel must not act on guessed or invented orders; the predetermined safe loss-of-communications procedure applies."}]},{"id":"STEERING_COMMON_05","family":"steering","title_tr":"Dümen açısı göstergeleri, gyro ve gerçek dümen konumu","title_en":"Rudder-angle indicators, gyro information and actual rudder position","paragraphs":[{"tr":"Bir gyro repeaterın gösterdiği baş açısı ile dümen açı göstergesinin gösterdiği dümen konumu farklıdır. Gyro arızası, mutlaka dümenin arızalandığını göstermez; dümen hareket ediyor görünse de komuta uygun cevap vermiyor olabilir. Farklı göstergeler arasında tutarsızlık olduğunda bağımsız sensör, yerel gösterge ve manevra tepkisi üzerinden kontrollü karşılaştırma yapılır. Bir arızayı doğrudan kontrol sistemi arızası kabul edip gereksiz kumanda devri yapılmaz.","en":"A gyro repeater indicates ship’s heading, whereas a rudder-angle indicator shows rudder position. Failure of a gyro does not necessarily indicate steering-gear failure; conversely, apparent rudder movement may not correspond to the required command response. When different indications disagree, a controlled comparison is made using independent sensors, local indications and the vessel’s manoeuvring response. An observed discrepancy must not automatically be classified as control-system failure, leading to an unnecessary changeover."}]},{"id":"STEERING_COMMON_06","family":"steering","title_tr":"Hidrolik tehlikeler ve güvenli gözlem","title_en":"Hydraulic hazards and safe observation","paragraphs":[{"tr":"Yüksek basınçlı hidrolik yağın küçük bir kaçak noktasından çıkması ciddi enjeksiyon yaralanmasına neden olabilir. Personel olası kaçağı elle aramaz, basınç altındaki bağlantıyı sökmez ve aktif hareketli bağlantıların içine girmez. Yağ birikmesi kayma, yangın ve çevre kirlenmesi riski yaratır. Sızıntı şüphesi, basınç düşmesi, sıcaklık artışı veya anormal ses varsa yetkili makine personeli devreyi güvenli şekilde değerlendirir; gerçek onarım, enerji izolasyonu ve kilitleme/etiketleme kurallarına tabidir.","en":"High-pressure hydraulic oil escaping through a small leak can cause serious injection injuries. Personnel must not search for a suspected leak by hand, disconnect pressurised fittings or enter the path of moving linkages. Accumulated oil creates slip, fire and pollution hazards. If leakage, pressure loss, rising temperature or unusual noise is suspected, authorised engineering personnel assess the circuit safely; any physical repair is subject to energy isolation and lockout/tagout controls."}]},{"id":"STEERING_COMMON_07","family":"steering","title_tr":"Elektrik beslemesi, güç ünitesi ve alarmlar","title_en":"Electrical supplies, power units and alarms","paragraphs":[{"tr":"Dümen tahrik gücü ile kumanda elektriği farklı devrelerden beslenebilir; bir güç ünitesinin kaybı, tüm kumandaların kaybına eşdeğer olmayabilir. Köprüüstündeki uzaktan kumanda güç kaybı, güç ünitesi arızası, aşırı yük ve düşük seviye gibi göstergeler tasarıma bağlıdır. Alarm görüldüğünde alarmın anlamı, bağlı olduğu güç ünitesi, mevcut dümen kapasitesi ve alternatife geçiş yöntemi incelenir. Bir alarmı üretmek için bilerek kritik sistemi enerjisiz bırakmak, talimin olağan bir gereği değildir.","en":"Steering drive power and steering-control electricity may be supplied by different circuits; loss of one power unit is not necessarily equivalent to loss of all control functions. Indications of remote-control power failure, power-unit failure, overload and low fluid level on the bridge depend on the design. When an alarm occurs, personnel review its meaning, the associated power unit, the remaining steering capability and the approved method of changing to an alternative arrangement. Deliberately de-energising a critical system merely to generate an alarm is not a routine requirement of a drill."}]},{"id":"STEERING_COMMON_08","family":"steering","title_tr":"Kumanda kaybında seyir kararı ve makinelerin rolü","title_en":"Navigational decisions following loss of steering and machinery support","paragraphs":[{"tr":"Dümen kumandası arızalandığında ilk hedef geminin başka bir gemiyle, sığlıkla veya yapıyla çatışmasını önlemektir. Kaptan; deniz odası, su derinliği, trafik, rüzgâr, akıntı, sürat ve pervane/itici etkisini değerlendirir. Ana makine, değişken hatve veya iticiyle manevra geminin donanımına ve manevra karakteristiğine bağlıdır. “Pitch sıfırlanır”, “makine durdurulur” veya “yanal itici çalıştırılır” türü işlemler, bütün gemiler için otomatik talimat değildir; gerçek talimde kaptan/başmühendis izni olmadan yapılmaz.","en":"Following steering-control failure, the immediate objective is to prevent contact with other vessels, shallow water or structures. The master assesses available sea room, water depth, traffic, wind, current, speed and the effects of the propeller and thrusters. Manoeuvring with the main engine, controllable-pitch propeller or thrusters depends on the vessel’s equipment and handling characteristics. Instructions such as “set pitch to zero”, “stop the engine” or “operate the bow thruster” are not universally applicable automatic responses and must not be carried out during a real drill without the master’s and chief engineer’s authorisation."}]},{"id":"STEERING_COMMON_09","family":"steering","title_tr":"Kumanda altında olmayan gemi ve seyir işaretleri","title_en":"Not-under-command status and navigation signals","paragraphs":[{"tr":"Kumanda altında olmayan gemi (NUC), istisnai bir durum nedeniyle COLREG'in gerektirdiği manevrayı yapamayan ve diğer gemilerden uzak duramayan gemidir. Sadece talim ilanı veya bir kumanda kipinin değiştirilmesi, tek başına NUC statüsü doğurmaz. Fiilî durum doğmuşsa Kural 27 ışık/şekil ve seyir tedbirleri değerlendirilir. Talimde işaretlerin tanıtılması eğitim/gösterim biçiminde yapılabilir; seyreden başka gemileri yanıltacak biçimde gerçek NUC işareti kullanılmaz.","en":"A vessel not under command (NUC) is one which, through exceptional circumstances, is unable to manoeuvre as required by the COLREGs and is therefore unable to keep out of the way of another vessel. Merely announcing a drill or changing a steering mode does not, by itself, establish NUC status. Where the actual circumstances meet the definition, lights, shapes and navigational precautions under Rule 27 are considered. In a drill, the signals may be presented through instruction or demonstration; actual NUC signals must not be displayed in a manner that misleads other vessels."}]},{"id":"STEERING_COMMON_10","family":"steering","title_tr":"Tehlike, acelelik ve rutin haberleşme","title_en":"Distress, urgency and routine communications","paragraphs":[{"tr":"Mayday; yakın ve ciddi tehlike altında derhal yardım gerektiren gerçek durumlar için, Pan-Pan ise uygun acelelik durumları için değerlendirilir. Tatbikat sırasında gerçek acil çağrıların VHF kanal 16 veya GMDSS üzerinden yayınlanması standart uygulama değildir. Senaryoda hangi durumda hangi çağrı seçileceği, gönderilecek konum ve yardım talebi öğretilir; gerçek yayına ihtiyaç varsa bunun nedeni talim değil fiilî olayın kendisidir. İç haberleşme, tatbikat anonsu ve onaylı test yöntemleri birbirinden ayrılır.","en":"Mayday is considered for an actual grave and imminent danger requiring immediate assistance; Pan-Pan is considered for an appropriate urgency situation. Broadcasting genuine emergency calls on VHF Channel 16 or through GMDSS is not normal practice for an exercise. The scenario teaches which type of call would be chosen, what position would be reported and what assistance would be requested; any need for a real transmission must arise from an actual event, not merely from the drill. Internal communications, drill announcements and approved testing methods remain distinct."}]},{"id":"STEERING_COMMON_11","family":"steering","title_tr":"Talimde ölçülen başarı: sadece dümenin hareketi değil","title_en":"Drill performance: beyond observing rudder movement","paragraphs":[{"tr":"Başarılı talimin ölçütü yalnızca bir dümen açısı elde etmek değildir. Köprüüstü ile dümen dairesinin aynı kumanda durumunu anlaması, tek kumanda otoritesinin korunması, emir-tekrar-gerçek açı zinciri, gecikmenin fark edilmesi, personelin emniyette olması, arızanın güvenli sınırlanması ve sistemin normal duruma dönmesinin teyidi de değerlendirilir. Fiilen yapılanlar ile teorik kararlar ayrı kaydedilir.","en":"Successful performance is not measured solely by attaining a particular rudder angle. The assessment also includes shared understanding between bridge and steering-gear personnel of the active control mode, maintenance of one control authority, the order–read-back–actual-angle sequence, recognition of delays, personnel safety, safe containment of the fault, and confirmation that the system has returned to normal. Actions actually performed are documented separately from theoretical decisions."}]},{"id":"STEERING_COMMON_12","family":"steering","title_tr":"Ekipmanın tekrar hizmete hazırlanması ve kayıt bütünlüğü","title_en":"Returning steering gear to service and maintaining accurate records","paragraphs":[{"tr":"Talim bittiğinde kumanda yetkisinin köprüüstüne geri verildiği, yürürlükteki normal otomatik/manuel kumanda düzeninin sağlandığı, güç üniteleri ve alarmların uygun olduğu ve yerel panelin güvenli durumda bırakıldığı teyit edilir. Talimde gerçek bir arıza bulunmuşsa arıza bildirimi/bakım talebi açılır; sırf senaryoda “arıza varsayıldı” diye gerçek arıza kaydı oluşturulmaz. Her faaliyetin tarihi, yeri, kapsamı, sorumlu personeli, fiilen/simüle edilen uygulama türü ve sonuç değerlendirmesi birbirleriyle tutarlı olur.","en":"At the end of the drill, it is confirmed that steering-control authority has been returned to the bridge, the normal automatic or manual control arrangement in force has been reinstated, power units and alarms are satisfactory, and the local panel has been left in a safe condition. If a genuine defect was discovered, a defect report or maintenance request is raised; a fictional fault assumed solely for the scenario does not warrant a false real-world defect record. The date, location, scope, responsible personnel, actual or simulated nature of each action, and assessment of results must be consistent across records."}]},{"id":"MOB_SAR_COMMON_01","family":"mob_sar","title_tr":"IV.A. Kurtarma organizasyonu ve işin güvenli sınırı","title_en":"Rescue organization and safe operating boundaries","paragraphs":[{"tr":"Denize düşen veya denizde yardım bekleyen kişi birden fazla tehlikeye aynı anda maruz kalır: boğulma, soğuk, dalga/spray, yorgunluk, yaralanma ve yön kaybı. Kurtarıcı gemi personeli için ise borda kenarına yaklaşma, halat dolaşması, gövde–kurtarma teknesi arasında sıkışma, pervane akımı ve deniz durumuyla ilgili ayrı riskler bulunur. Talimde kazazedenin hayatı ile kurtarıcı personelin emniyeti birlikte değerlendirilir; ikinci bir kazazede oluşturacak hareketlerden kaçınılır.","en":"A person who falls overboard or awaits assistance at sea may face several simultaneous hazards: drowning, cold exposure, waves and spray, exhaustion, injuries and disorientation. Rescuing crew members face different risks when approaching the ship's side, including entanglement in lines, being crushed between the ship and a rescue craft, propeller wash and prevailing sea conditions. The drill assesses both the casualty's survival and rescuers' safety, avoiding actions that could create a second casualty."},{"tr":"Kaptan/olay komutanı, köprüüstü seyir idaresi, sabit gözcü, kurtarma güvertesi, kurtarma botu mürettebatı, makine/elektrik destek, ilk yardım ekibi ve haberleşme görevlileri role cetvelinde gösterilen yetkilere göre tanıtılır. Operasyona başlamadan önce personel durumunun, iletişim yönteminin, görev devirlerinin, deniz/hava koşullarının ve kullanılması düşünülen kurtarma araçlarının uygunluğu belirlenir. Manevra ve kurtarma sahasının ticari trafik veya kıyı tehlikeleriyle kesişmesi hâlinde koruyucu seyir tedbirleri açıklanır.","en":"The master/incident commander, bridge navigation team, dedicated lookout, recovery-deck team, rescue-boat crew, machinery/electrical support, first-aid team and communications personnel are introduced according to the authority and duties shown on the muster list. Before starting the operation, the condition of the crew, communications arrangements, handovers of responsibility, weather and sea conditions, and suitability of the intended rescue equipment are established. If the manoeuvring and recovery area overlaps with commercial traffic or coastal hazards, protective navigation measures are explained."}]},{"id":"MOB_SAR_COMMON_02","family":"mob_sar","title_tr":"IV.B. İlk durum raporu ve haberleşmenin niteliği","title_en":"Initial situation reports and communications protocols","paragraphs":[{"tr":"İlk haber; olayın türü, saat, mevki, kişi sayısı, kişinin görülüp görülmediği, rüzgâr/akıntı/görüş, geminin durumu ve mevcut yardım kapasitesi gibi doğrulanabilir unsurları içerir. Gemi içi genel alarm ve role haberleşmesi gerçek tehlike alarmıyla karıştırılmaz. “MOB mevkii”nin elektronik seyir cihazına işaretlenmesi öğretildiğinde, kaydedilen koordinatın kişinin kesin güncel yeri değil, ilk olayın referans noktası olduğu vurgulanır; akıntı ve rüzgârla sürüklenme değerlendirilmeye devam edilir.","en":"The initial report contains verifiable details such as the type of incident, time, position, number of persons, whether the person is in sight, wind/current/visibility, the ship's condition and available assistance capability. The ship's general alarm and drill communications must not be confused with a real distress alert. When personnel learn to mark the 'MOB position' on electronic navigation equipment, it is stressed that the recorded coordinates are the reference position at the time of the incident, not the person's certain current location; drift due to wind and current continues to be assessed."},{"tr":"VHF ve GMDSS cihazları; dinleme, çağrı önceliği, koordinasyon, adreslenen birim ve bilgi tekrar/teyidi bakımından tanıtılır. MAYDAY ve PAN PAN, sırf talim yapılıyor diye gerçek frekansta yayımlanmaz. Gerçek acil durumda mesajın niteliği, olayın ciddiyeti ve yetkili kaptan/operatörün kararıyla belirlenir; eğitimde durum raporu örnekleri uygulama içi simülasyon olarak okunur. Distress butonları, EPIRB, DSC ve benzer cihazlarda gerçek alarm oluşturmayacak eğitim/yetkili test modu esas alınır.","en":"VHF and GMDSS equipment are explained in terms of watchkeeping, call priority, coordination, intended recipient and read-back/confirmation of information. MAYDAY and PAN PAN calls are not transmitted on operational frequencies merely because a drill is taking place. In a real emergency, the type of message is determined by the severity of the event and the decision of the authorised master/operator; during training, sample situation reports are read as internal simulations. For distress buttons, EPIRBs, DSC and similar equipment, an authorised test or training mode that does not trigger a real alert is used."}]},{"id":"MOB_SAR_COMMON_03","family":"mob_sar","title_tr":"IV.C. Görüşü koruma, son mevki ve sürüklenme","title_en":"Maintaining visual contact, last known position and drift","paragraphs":[{"tr":"Kişinin görüldüğü olayda sabit gözcü yalnızca denizdeki kişiyi takip etmekle görevlendirilebilir; gözlemi sürdürmek için vardiya devri veya yedek gözcü gerekliliği değerlendirilir. Dürbün, projektör, MOB işaretleri, GPS/ECDIS/AIS gibi mevcut araçlar aramanın farklı bileşenleridir. Gece projektörü kullanırken köprüüstünün gece görüşünü bozma, kurtarma botunu kamaştırma ve çevredeki seyri etkileme tehlikeleri açıklanır.","en":"When the person remains in sight, a dedicated lookout may be assigned solely to tracking the person in the water; relief of the lookout or provision of an additional lookout is considered to maintain continuous observation. Binoculars, searchlights, MOB markers and available equipment such as GPS, ECDIS and AIS serve different functions in the search. When a searchlight is used at night, the risk of degrading the bridge team's night vision, dazzling the rescue boat and affecting nearby navigation is explained."},{"tr":"Kişinin görüşten kaybolduğu olayda başlangıç mevkisi, olay saati ve son güvenilir gözlem ayırt edilir. Olay noktası ve tahmini datum, rüzgâr, akıntı, dalga ve mümkünse kazazedenin sürüklenme özelliğiyle güncellenebilir. “Bir kez MOB butonuna basıldı, mevki sonsuza kadar sabittir” yaklaşımı doğru değildir. Güncellenen hesaplar harita üzerinde işaretlenir; kaynak verilerin belirsizliği karar verecek sorumlu kişiye belirtilir.","en":"If visual contact is lost, the initial position, incident time and last reliable sighting are distinguished. The incident position and estimated datum may be updated using wind, current, waves and, where available, the casualty's drift characteristics. The assumption that 'the MOB button was pressed once, so the position stays fixed forever' is incorrect. Updated estimates are plotted on the chart, and the uncertainty of the input data is reported to the person responsible for decisions."}]},{"id":"MOB_SAR_COMMON_04","family":"mob_sar","title_tr":"IV.D. Gemi manevrası, pervane ve borda yakınında emniyet","title_en":"Ship manoeuvring, propeller hazards and alongside safety","paragraphs":[{"tr":"Kurtarma dönüşü öğretiminde Anderson/tek dönüş, Williamson dönüşü, Scharnow dönüşü gibi bilinen yaklaşımların hangi bağlamlarda ele alındığı kavramsal olarak gösterilebilir. Ancak hiçbir manevranın her gemi, hız, akıntı veya görüş durumu için otomatik emir olmadığı açıklanır. Geminin manevra özellikleri, itici donanımlar, DP/seyir modu, çevre trafik, rüzgâr ve mevcut makine/enerji koşulları kaptanın planına göre değerlendirilir. Gerçek talimde ani dümen/itici müdahalesi, manevra yetkisi ve risk değerlendirmesi olmadan başlatılmaz.","en":"In teaching recovery turns, the contexts in which established manoeuvres such as the Anderson (single) turn, Williamson turn and Scharnow turn are used may be demonstrated conceptually. However, none is an automatic instruction for every ship, speed, current or visibility condition. The ship's manoeuvring characteristics, thrusters, DP/navigation mode, surrounding traffic, wind and available propulsion and power are assessed in accordance with the master's plan. During a live drill, abrupt rudder or thruster movements are not initiated without manoeuvring authority and risk assessment."},{"tr":"Kurtarma noktasının pervaneye, su jeti akımına, bordo açıklığına ve gemi hareketine göre emniyeti ele alınır. Bordaya sıkışmayı azaltacak ve kazazedenin akıntıyla tekne altına girmesini önleyecek yaklaşım seçenekleri tartışılır. “Kazazedeyi mutlaka rüzgâraltına al” gibi tek koşullu kural yerine somut gemi–deniz–kurtarma donanımı uyumu değerlendirilir.","en":"The safety of the recovery point is examined in relation to the propeller, water-jet wash, hull openings and vessel movement. Approach options that reduce the likelihood of crushing against the ship's side and prevent the casualty being swept under the hull are discussed. Rather than using a single-condition rule such as 'always place the casualty on the lee side', the actual combination of ship, sea conditions and recovery equipment is assessed."}]},{"id":"MOB_SAR_COMMON_05","family":"mob_sar","title_tr":"IV.E. Sudan alma seçenekleri ve fiziksel kısıtlar","title_en":"Recovery-from-water options and physical limitations","paragraphs":[{"tr":"Kurtarma botu, uygun hizmet botu, borda kurtarma ağı, çarmıh, kurtarma sepeti/kepçesi, güvenlik halatı, can simidi, kurtarma sapanı ve diğer araçlar aynı işlevi ve yetkiyi taşımaz. Ayakta ve güçlü bir kazazedenin yardımcı olarak tutunabildiği araç ile bilinçsiz, yaralı veya ileri derecede hipotermik kazazedenin alınmasına uygun tertibat ayrı öğretilir. Kaygan, ıslak çarmıhın hareketsiz kazazede için etkili tek yöntem olarak sunulmaması gerekir.","en":"A rescue boat, suitable service boat, ship-side recovery net, pilot ladder, recovery basket/scoop, safety line, lifebuoy, recovery sling and other devices do not all perform the same function or carry the same approvals. Equipment to which a conscious and strong casualty can actively hold on is taught separately from equipment suitable for recovering an unconscious, injured or severely hypothermic person. A slippery, wet ladder must not be presented as the only effective means for a non-responsive casualty."},{"tr":"Gövdeye veya kaldırma tertibatına çarpma, sapanın yanlış yerleştirilmesi, kancanın açılması, kaldırma sırasında dönme/sallanma, operatör–köprüüstü–güverte personelinin görüş kesişimi ve kapasite limitleri gösterilir. MSC.1/Circ.1447 uyarınca mümkün olduğunda kazazede yatay veya yataya yakın biçimde alınır; özellikle hipotermik kişiyi uzun süre dikey asılı tutmak ciddi risk oluşturabilir. Ancak hava yoluna su gelmesi gibi acil tehlikede yaşamı kurtaracak en hızlı güvenli yöntem öncelikli olabilir. Asıl bağlama ve kaldırma tekniği, cihazın güncel onaylı işletme kılavuzundan öğrenilir.","en":"The hazards demonstrated include impact against the hull or lifting appliance, incorrect placement of a sling, inadvertent hook opening, rotation or swinging during hoisting, intersecting sightlines between the operator, bridge and deck team, and capacity limits. Under MSC.1/Circ.1447, recovery should be in a horizontal or near-horizontal position whenever possible; keeping a hypothermic person suspended vertically for a prolonged period may present serious risks. However, where an immediate hazard such as water entering the airway exists, the fastest safe life-saving method may take priority. The actual attachment and hoisting procedure must be learned from the equipment's current approved operating manual."}]},{"id":"MOB_SAR_COMMON_06","family":"mob_sar","title_tr":"IV.F. Kurtarma botu ve hizmet botu organizasyonu","title_en":"Rescue-boat and service-boat coordination","paragraphs":[{"tr":"Gemi kurtarma botunun ve varsa hizmet botunun ayrı fiziksel varlık, görev ve yetkinlikleri ele alınır. Botun suya verilmesi kararı; hava/deniz durumu, geminin seyir veya demir/liman durumu, indirme tertibatı, ekip yeterliliği, yakıt/enerji, telsiz, kişisel koruyucu donanım, MOB işaretleri, geri alma imkânı ve kurtarma botu risk değerlendirmesi üzerinden açıklanır. FR-09.124 biçimindeki indirme/manevra risk analizleri, FR-09.110 MOB risk değerlendirmesinin yerine geçirilmez.","en":"The ship's rescue boat and, if fitted, its service boat are treated as distinct physical craft with different duties and authorisations. The decision to launch a boat is explained by reference to weather and sea conditions; whether the mother ship is underway, at anchor or in port; the launching appliance; crew competence; fuel and power; radio; personal protective equipment; MOB marking equipment; means of recovery; and the rescue-boat risk assessment. Launching/manoeuvring risk assessments identified as FR-09.124 do not replace the MOB risk assessment FR-09.110."},{"tr":"Kurtarma botu ile ilgili SOLAS III/19.3.4.6 esasları, can filikası indirmenin III/19.3.4.3 esaslarından farklıdır. SOLAS'ın uygulanabilir hükümleri çerçevesinde kurtarma botunun mürettebatıyla indirilip manevra ettirilmesi olanaklı ve makul ise aylık, her durumda en az üç ayda bir öngörülür; ancak bu ifadeyi bütün gemilere uygulanacak koşulsuz pratik emir gibi okumadan, bayrak/uygulanabilirlik, iş izni ve emniyet değerlendirmesi doğrulanır. Botun her MOB taliminde fiilen indirilmesi gerektiği sonucuna ulaşılmaz.","en":"The provisions for rescue boats in SOLAS III/19.3.4.6 are different from the lifeboat launching provisions in III/19.3.4.3. Within the applicable SOLAS requirements, a rescue boat is to be launched with its crew and manoeuvred monthly when practicable and reasonable, and in any case at least every three months. This wording must not be read as an unconditional operational order for all ships: flag-state applicability, work authorisation and safety assessments must be confirmed. It does not follow that the boat has to be physically launched during every MOB drill."}]},{"id":"MOB_SAR_COMMON_07","family":"mob_sar","title_tr":"IV.G. Soğuk su, hipoksi, yaralanma ve kazazede bakımı","title_en":"Cold-water exposure, hypoxia, injuries and casualty care","paragraphs":[{"tr":"Soğuk suya ani giriş; kontrolsüz solunum, panik, yüzme yetisinin azalması, hipotermi ve kalp-dolaşım sorunlarına yol açabilir. Gemi personeline soğuk şokun, hipoterminin ve boğulma sonrası solunum sorununun aynı şey olmadığı anlatılır. Kurtarılan kişinin bilinci, hava yolu, solunumu, dolaşımı, yaralanmaları ilk yardım eğitimine uygun olarak değerlendirilir. Isı kaybını önleme, ıslak ortamdan uzaklaştırma, kuru/koruyucu örtü, gereksiz hareketten kaçınma ve tıbbi yardım isteği açıklanır.","en":"Sudden immersion in cold water may cause uncontrolled breathing, panic, impaired swimming ability, hypothermia and cardiovascular complications. Crew members learn that cold shock, hypothermia and post-drowning respiratory problems are not the same condition. The rescued person's consciousness, airway, breathing, circulation and injuries are assessed in accordance with first-aid training. Measures explained include preventing further heat loss, moving away from wet conditions, providing dry protective covering, avoiding unnecessary movement and seeking medical assistance."},{"tr":"Bilinç kaybı veya normal solunum olmaması hâlinde uygun eğitimli personel güncel ilk yardım/temel yaşam desteği protokolünü uygular. Tıbben karmaşık hipotermi yönetimi yalnızca kısa bir internet eğitimi metninden yürütülmez; geminin tıbbi rehberi, uzaktan tıbbi danışma ve yetkin sağlık personeli esas alınır. Kurtarma simülasyonunda kişinin gerçekten suya atılması ya da soğuk suya sokulması zorunlu değildir; manken, şamandıra veya masa başı araçları kullanılabilir.","en":"If the person is unconscious or not breathing normally, appropriately trained personnel follow current first-aid/basic life support protocols. Complex medical management of hypothermia must not be undertaken solely from a short online training text; the ship's medical guide, telemedical advice and qualified healthcare personnel take precedence. A recovery drill need not involve throwing a person into the water or exposing anyone to cold water: a training dummy, buoy or tabletop exercise may be used."}]},{"id":"MOB_SAR_COMMON_08","family":"mob_sar","title_tr":"IV.H. Operasyon bitişi, ekipman ve olay kaydı","title_en":"Ending operations, restoring equipment and documenting events","paragraphs":[{"tr":"Kazazede sayısı ve kimliği, kurtarılan/aranmaya devam edilen kişi sayısı, ilk ve son mevki, karar–manevra saatleri, ekipman arızası, tıbbi sevk, sahil/muhabere merkezi irtibatı, varsa kirlilik ve çevredeki tehlikeler kontrol edilir. Bot, kreyn, halat, sepet/kepçe ve haberleşme cihazlarının hazır duruma dönüşü açıklanır. Sorumlu zabit talimi değerlendirir; eksiklik ve düzeltici faaliyetler tespit edilir. Örnek rapor metni gerçekleşmiş gibi geçmiş zaman kullanır; nihai tutanak yalnızca yapılmış, anlatılmış veya simüle edilmiş işlemi doğru sınıflandırır.","en":"The number and identities of casualties, numbers recovered and still missing, initial and last known positions, times of decisions and manoeuvres, equipment defects, medical evacuation, contacts with shore/communications centres, any pollution and surrounding hazards are checked. Returning the boat, crane, lines, basket/scoop and communications equipment to operational readiness is explained. The responsible officer evaluates the drill and identifies deficiencies and corrective actions. A sample report uses the past tense as if describing a completed event; the final record must accurately distinguish what was performed, discussed or simulated."}]},{"id":"BOATS_CLASSIFICATION","family":"boats","title_tr":"Kurtarma botu, hizmet botu ve can filikası: görev ve onay ayrımı","title_en":"Rescue boats, service boats and lifeboats: purposes and approvals","paragraphs":[{"tr":"IV.A. Botların işlev sınıfları","en":"IV.A. Functional classifications of boats"},{"tr":"Kurtarma botu (rescue boat): Denizdeki kişiye hızlı ve kontrollü müdahale, kazazedenin alınması, can sallarına yardım ve ilgili kurtarma görevleri için onaylı düzenine göre kullanılır. Düşük borda/yüksek borda, pervane, yaklaşma tarafı, kurtarma ağının veya sepetin kullanımı, ilk yardım ve gemiye geri alma birlikte öğretilir. LSA kapsamında onaylı olması, belirli bir hava-deniz durumunda risksiz kullanılabileceği anlamına gelmez.","en":"Rescue boat: Used in accordance with its approved arrangement for rapid, controlled assistance to persons in the water, recovery of casualties, assistance to liferafts and related rescue tasks. Low and high freeboard, propellers, approach side, use of recovery nets or baskets, first aid and transfer back to the parent vessel are taught together. Approval under the Life-Saving Appliances (LSA) framework does not mean the boat can be operated without risk in any particular weather or sea condition."},{"tr":"Hizmet botu (service/work boat; bazı dokümanlarda daughter craft): Geminin görev ve yetki kapsamına göre deniz üstünde personel, ekipman, hazırlık ve operasyonel destek faaliyetleriyle ilgili olabilir. Taşıma kapasitesi, mürettebat kompozisyonu, kurtarma yükü, onaylı seyir sahası ve kaldırma düzeneği gemiye özgüdür. Kurtarma botunun bütün SOLAS niteliklerine otomatik olarak sahip varsayılmaz. Hizmet botu, şirketin eğitim planında kurtarma destek rolünde kullanılabilir; görev ve hukukî statüsü ayrı teyit edilir.","en":"Service/work boat (called a daughter craft in some documents): Depending on the vessel's operational role and authorisations, the craft may be used for personnel and equipment transport, preparation and operational support at sea. Passenger capacity, crew composition, rescue load, approved operating area and lifting arrangement are vessel-specific. The craft must not automatically be assumed to meet all SOLAS rescue-boat requirements. A service boat may be assigned a rescue-support role in the company's training plan, but its tasking and legal status must be verified separately."},{"tr":"Can filikası (lifeboat): Gemiyi terk için onaylanmış can kurtarma aracıdır. Kurtarma botuyla, hizmet botuyla veya can salıyla aynı teknik sınıf değildir. Gemide filika bulunmaması, kurtarma botunun filikaya dönüştüğü anlamına gelmez.","en":"Lifeboat: An approved survival craft intended for abandoning ship. It is not the same technical class as a rescue boat, service boat or liferaft. The absence of a lifeboat on a vessel does not make its rescue boat a lifeboat."}]},{"id":"BOATS_COMMON_03","family":"boats","title_tr":"IV.B. Talim öncesi işbaşı konuşması — toolbox talk (TBT)","title_en":"Pre-drill toolbox talk (TBT)","paragraphs":[{"tr":"Kaptan/zabit, bot sorumlusu, matafora operatörü, kaldırma bölgesindeki görevli, bot personeli ve köprüüstü arasında şu kararlar açıklanır: Talimin amacı; gerçek yapılacak işlemler; simüle edilecek işlemler; hava-deniz ve trafiğin uygunluğu; geminin hızı/konumu; haberleşme kanalı ve yedek yöntem; tek kişinin komuta ve durdurma yetkisi; personelin güvenli çalışma alanı; herhangi bir nedenle faaliyet durdurulursa güvenli geri dönüş; acil yardım tertibatı. Bunlar tamamlanmadan yalnızca programda talim bulunması operasyon başlatma yetkisi oluşturmaz.","en":"The following decisions are explained in a pre-drill toolbox talk involving the master/officer, boat supervisor, davit operator, lifting-area attendant, boat crew and bridge: the drill objective; tasks that will actually be performed; tasks that will be simulated; suitability of weather, sea and traffic; ship's speed and position; communications channel and fallback method; the authority of a single designated person to command and stop the operation; safe working areas; return to a safe state if the operation is interrupted for any reason; and arrangements for emergency assistance. Having a drill on the schedule does not in itself authorise the operation to begin before these matters are addressed."}]},{"id":"BOATS_COMMON_04","family":"boats","title_tr":"IV.C. Ön kontrolün anlamı","title_en":"Meaning and scope of pre-use checks","paragraphs":[{"tr":"Talim öncesi kontrol; botun dış görünüm ve yapısal hasar işaretleri, emniyetli istif/bağlama, doluluk ve ekipman sabitliği, yakıt/sızıntı göstergeleri, motor/kumanda hazırlığı, acil durdurma tertibatı, telsiz, seyir/ışık donanımı, can kurtarma ve ilk yardım araçları, kişisel koruyucu donanım, yedek/manuel sistemlerin erişilebilirliği ve yürürlükteki bakım/servis kayıtlarının durumunu kapsayacak şekilde öğretilir. Bu bir eğitim konu listesidir; üreticiye özgü tork, basınç, gerilim, pin/kanca veya kumanda sıraları burada üretilmez.","en":"Pre-drill checks are taught as covering external condition and signs of structural damage; secure stowage and fastening; loading and securement of equipment; fuel and leakage indications; readiness of engine and controls; emergency-stop arrangements; radio, navigation and lighting equipment; life-saving and first-aid equipment; personal protective equipment; availability of backup/manual systems; and the status of current maintenance and service records. This is a list of training topics: no manufacturer-specific torque, pressure, voltage, pin/hook setting or control sequence is invented here."}]},{"id":"BOATS_COMMON_05","family":"boats","title_tr":"IV.D. Matafora, vinç, sapan ve kanca","title_en":"Davits, winches, slings and hooks","paragraphs":[{"tr":"Askıdaki bot, yalnızca düşme riski değil, hareket eden yük, salınım, sıkışma, kopma, bağlantının yanlış kurulması ve bota/gemiye kontrolsüz darbe tehlikesi yaratır. Yük altında veya bot henüz emniyetli desteklenmiyorken bırakma mekanizmasının kontrolsüz işletilmesi kritik tehlikedir. Kanca ve
