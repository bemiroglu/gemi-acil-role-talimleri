hen the officer of the watch should call the master, what system information is needed from the engineering watch and who checks deck and accommodation areas. Combine wind, rolling, shipping water on deck, course and speed, possible crew injuries and navigational instrument faults into a common situation report. Explain order read-back between bridge and engine room, backup communication methods when appropriate and timing of log entries.","Demonstration: Rehearse a concise tasking-and-report exchange for a 'deteriorating seas' announcement. Related cards: NAV-C01, C02, C10, C11. Expected learning: Each assigned person states what must be reported, to whom and in what order of priority."],"source_integrity":"sha256_verified_against_embedded_blocks"},{"step":3,"title_tr":"Güverte, üst yapı ve can kurtarma donanımının hazırlanması","title_en":"Secure deck, superstructure and survival equipment","learning_tr":"Başaltı, kıç güverte, servis alanları, kapaklar, kaportalar, menholler, lumbuzlar, kurtarma ve hizmet botu emniyeti, hortum/kablo ve serbest malzeme kontrolü eğitim başlığına alınır.","learning_en":"Training addresses the forecastle, aft deck, service spaces, covers, doors, manholes, side scuttles, rescue and service-boat securing arrangements, hoses, cables and loose equipment.","exercise_tr":"Emniyetli bir noktada bağlama tertibatını, kapama elemanlarını ve bot emniyet kontrolünü görsel olarak gösterin.","exercise_en":"Demonstrate securing arrangements, closures and boat-securing checks in a safe training area.","hazard_tr":"Ağır havada açık güverteye gereksiz çıkış; sabitlemenin yalnız görünüşüne güvenme.","hazard_en":"Unnecessary exposure on an open deck in heavy seas; assuming visible lashings are effective without verification.","id":"HW-03","source_full_tr":["Başaltı, kıç güverte, servis alanları, kapaklar, kaportalar, menholler, lumbuzlar, kurtarma ve hizmet botu emniyeti, hortum/kablo ve serbest malzeme kontrolü eğitim başlığına alınır. Sabitleme (lashing) donanımının yalnız varlığının değil, doğru bağlanmış ve uygun durumda olduğunun önemi anlatılır. Kapağın kapalı olması ile su/hava geçirmez bütünlüğünün devam etmesi aynı şey değildir. Kontrolün uygun zaman ve emniyetli güzergâhta yapılması gerektiği değerlendirilir.","Gösterim: Güvenli yerde bağ örneği, kapama tertibatının işlevi veya görsel/plan üzerinde kontrol noktası gösterilir. Kartlar: NAV-C06, C08, C09. Beklenen öğrenme: Kontrol edilmesi gereken mahal ve riskli erişim farklılaştırılır."],"source_full_en":["Include the forecastle, aft deck, service areas, doors, hatches, manholes, portholes, rescue and service craft securing, hoses, cables and loose material in the preparations. Explain that lashings must not merely exist but be correctly fitted and in suitable condition. A closure being shut is not proof that its watertight or weathertight integrity is maintained. Assess the proper time and safe access route for inspections.","Demonstration: Show a securing arrangement in a safe area, demonstrate a closure mechanism or identify inspection points on diagrams. Related cards: NAV-C06, C08, C09. Expected learning: Distinguish areas needing inspection from areas with unsafe access."],"source_integrity":"sha256_verified_against_embedded_blocks"},{"step":4,"title_tr":"Geminin hareketlerinin ve dinamik stabilite tehlikelerinin öğretilmesi","title_en":"Review ship motions and stability risks","learning_tr":"Yalpa (roll), baş-kıç vurma (pitch), baş vurma (slamming), ağır dalganın güverteye çıkması (green water) ve geminin dalgaya göre bağıl hareketi ayrı kavramlar olarak açıklanır.","learning_en":"Rolling, pitching, slamming, green water on deck and the ship's relative motion with waves are explained as distinct concepts.","exercise_tr":"Örnek dalga–sürat diyagramında yalpa, baş-kıç vurma, green water ve broaching risklerini karşılaştırın.","exercise_en":"Compare rolling, pitching, green water and broaching risks on a sample wave-versus-speed diagram.","hazard_tr":"Parametrik yalpa veya surf-riding eşiğini gemiye özgü veri olmadan kesin sayı gibi sunma.","hazard_en":"Treating parametric-rolling or surf-riding thresholds as universal figures without vessel-specific data.","id":"HW-04","source_full_tr":["Yalpa (roll), baş-kıç vurma (pitch), baş vurma (slamming), ağır dalganın güverteye çıkması (green water) ve geminin dalgaya göre bağıl hareketi ayrı kavramlar olarak açıklanır. Kıç omuzluktan gelen dalgada surf-riding ve broaching-to, senkron yalpa ile parametrik yalpanın oluşum mantığı, dalga tepesinde değişen hidrostatik stabiliteyle ilişkilendirilir. Bu fenomenlerin her gemide aynı süratte ve şiddette oluşmadığı vurgulanır. Kaptanın kararında yalnız gemi sürati değil deniz alanı, seyir sınırlamaları ve mevcut gemi stabilitesi belirleyicidir.","Gösterim: Dalga–gemi doğrultularını gösteren şema üzerinde olası hareketler tartışılır. Kartlar: NAV-C04, C05, C07. Beklenen öğrenme: Ağır hava manevrasında “her zaman dalgaya baş ver” gibi tek cümleli formüllerin neden yetersiz olduğu açıklanır. Kaynak: MSC.1/Circ.1228."],"source_full_en":["Explain roll, pitch, slamming, green water and vessel motion relative to waves as separate phenomena. Describe surf-riding and broaching-to in quartering seas, and the mechanisms of synchronous and parametric rolling in relation to changes in hydrostatic stability near wave crests. Emphasise that these phenomena do not occur at the same speeds and severity on every vessel. The master's decision depends on sea room, navigational restrictions and actual stability as well as speed.","Demonstration: Discuss possible motions using a diagram of ship headings relative to waves. Related cards: NAV-C04, C05, C07. Expected learning: Explain why simplistic instructions such as 'always put the bow into the waves' are inadequate in heavy weather. Source: MSC.1/Circ.1228."],"source_integrity":"sha256_verified_against_embedded_blocks"},{"step":5,"title_tr":"Rota, sürat, sevk ve dümen seçeneklerinin değerlendirilmesi","title_en":"Evaluate course, speed and propulsion choices","learning_tr":"Ağır deniz şartlarında rota veya sürat ayarı, güvenli deniz alanı, dalga doğrultusu, pervane yük değişimleri, dümen etkinliği ve çarpışma/karaya oturma tehlikesi ile birlikte değerlendirilir.","learning_en":"Adjustments to course and speed in heavy seas are considered in relation to available sea room, wave direction, changes in propeller loading, steering effectiveness and risks of collision or grounding.","exercise_tr":"Seyir planında iki rota/sürat seçeneğinin emniyetli deniz alanı, sevk yükü ve dümen etkisi bakımından artı ve eksilerini tartışın.","exercise_en":"Compare two route/speed options for sea room, propulsion loading and steering effectiveness on a passage plan.","hazard_tr":"Eğitimde gerçek rota/sürat emri vermek; yalnız dalgadan kaçınırken çatışma veya sığlık tehlikesi yaratmak.","hazard_en":"Issuing real course or speed orders during a tabletop exercise; creating collision or grounding exposure while avoiding waves.","id":"HW-05","source_full_tr":["Ağır deniz şartlarında rota veya sürat ayarı, güvenli deniz alanı, dalga doğrultusu, pervane yük değişimleri, dümen etkinliği ve çarpışma/karaya oturma tehlikesi ile birlikte değerlendirilir. Makine zabiti olası aşırı yüklenme, yağlama/soğutma sınırlaması ve acil güç imkânlarına ilişkin bilgileri köprüüstüne aktarır. Süratin azaltılmasının ve daha korunaklı bir rota seçiminin yararları ile manevra kabiliyeti bakımından maliyetleri karşılaştırılır.","Gösterim: Bir seyir planındaki iki alternatif rota/sürat seçeneğinin artı ve eksileri tartışılır. Kartlar: NAV-C04, C05, C10, C16. Beklenen öğrenme: Kararın gerekçesi birden fazla emniyet ölçütüne dayanır."],"source_full_en":["Assess changes of course or speed in heavy seas in conjunction with sea room, wave direction, variable propeller loading, rudder effectiveness and collision or grounding risk. The engineering officer reports possible overloading, lubrication and cooling limitations and emergency power capabilities to the bridge. Compare benefits of reducing speed or selecting a more sheltered track with possible costs to manoeuvrability.","Demonstration: Compare advantages and disadvantages of two alternative routes or speeds on a passage plan. Related cards: NAV-C04, C05, C10, C16. Expected learning: The decision is justified by multiple safety criteria."],"source_integrity":"sha256_verified_against_embedded_blocks"},{"step":6,"title_tr":"Personel emniyeti ve ikincil acil durumlara hazırlık","title_en":"Protect crew and prepare for secondary incidents","learning_tr":"Açık güverteye çıkma kısıtları, kayma ve denize düşme riski, refakat, uygun KKD, güvenli geçiş ve yaşam hatları değerlendirilir.","learning_en":"Restrictions on access to exposed decks, slips and falls overboard, escort arrangements, appropriate PPE, safe passage and lifelines are assessed.","exercise_tr":"Güverteye çıkışın iptali, personel refakati ve ikincil yangın/su alma durumları için senaryo karar kartları kullanın.","exercise_en":"Use scenario decision cards for suspending deck access, personnel escort and secondary fire/flooding events.","hazard_tr":"Güverteye kontrolsüz çıkış, kayma, denize düşme ve gevşek donanımın personele çarpması.","hazard_en":"Uncontrolled deck access, slips, man-overboard exposure and impact from loose gear.","id":"HW-06","source_full_tr":["Açık güverteye çıkma kısıtları, kayma ve denize düşme riski, refakat, uygun KKD, güvenli geçiş ve yaşam hatları değerlendirilir. Kamaralarda düşebilecek eşyalar, güvertedeki hareketli donanım, aşırı hareket nedeniyle yaralanma ve deniz tutmasının operasyon üzerindeki etkileri açıklanır. Yangın, makine arızası, bot/kaporta hasarı ve su alma senaryolarının hangi aşamada ayrı acil durum ekiplerini harekete geçireceği belirlenir.","Gösterim: Tehlikeli güverte geçişi fotoğrafı üzerinde işe devam/işi durdur kararı tartışılır. Kartlar: NAV-C08, C09, C12, C14. Beklenen öğrenme: Gereksiz personel maruziyetini önleyen karar sırası açıklanır."],"source_full_en":["Assess restrictions on going onto open decks, slipping and falling overboard, escorts, appropriate PPE, safe routes and lifelines. Explain objects falling in cabins, moving deck equipment, injuries from violent motion and the effect of seasickness on operations. Identify when fire, machinery failure, damage to craft or closures, or flooding scenarios should activate separate emergency teams.","Demonstration: Use an image of a hazardous deck passage to discuss the decision to continue or stop work. Related cards: NAV-C08, C09, C12, C14. Expected learning: Explain the sequence of decisions that avoids unnecessary personnel exposure."],"source_integrity":"sha256_verified_against_embedded_blocks"},{"step":7,"title_tr":"Ağır hava hasarının tanınması, izlenmesi ve yardım değerlendirmesi","title_en":"Monitor damage and the need for assistance","learning_tr":"Bir kaporta hasarı, güverte ekipmanının kopması, tank/sintine seviyesinin yükselmesi veya sevk arızası varsayımında önce personel ve erişim güvenliği değerlendirilir.","learning_en":"In an assumed case involving a damaged closure, loose deck equipment, rising tank or bilge levels or propulsion failure, personnel safety and safe access are assessed first.","exercise_tr":"Örnek tank seviye eğilimleriyle hasarın gelişimini izleyin; yardım ve emniyetli limana yönelme kararlarını masa başında karşılaştırın.","exercise_en":"Track hypothetical damage using example tank-level trends; compare assistance and place-of-refuge options in a tabletop exercise.","hazard_tr":"Tek ölçümle hasarın kontrol altında olduğunu varsayma veya tehlikeli mahale kontrolsüz giriş.","hazard_en":"Assuming damage is stable from a single reading or entering an unsafe compartment without controls.","id":"HW-07","source_full_tr":["Bir kaporta hasarı, güverte ekipmanının kopması, tank/sintine seviyesinin yükselmesi veya sevk arızası varsayımında önce personel ve erişim güvenliği değerlendirilir. Hasarın yeri, büyüme eğilimi, su geçirmez bölmelere etkisi, yangın ve kirlilik tehlikesi sistematik biçimde incelenir. Gerekiyorsa kaptanın dış yardım, rota değiştirme, emniyetli limana yönelme ve ilgili mercilere bildirim kararına temel olacak veriler sıralanır. Tek bir ölçüm değil, yeniden ölçüm ve gelişim trendi öğretilir.","Gösterim: Örnek tank seviye tablosundan su alma eğilimi yorumlanır; gerçek tank transferi yapılmaz. Kartlar: NAV-C07, C13–C15, C17. Beklenen öğrenme: Önleyici ağır hava tedbiri ile hasar kontrolü karıştırılmaz."],"source_full_en":["If damage to a hatch, loss of deck equipment, rising tank or bilge level or propulsion fault is assumed, first assess personnel safety and whether the area can be accessed. Systematically review damage location, progression, watertight boundaries, fire and pollution hazards. List the information needed by the master when considering external help, course alteration, a safe port or notification to relevant authorities. Teach repeated measurements and trends rather than reliance on a single reading.","Demonstration: Interpret a flooding trend from a sample tank-level table; no real tank transfer is performed. Related cards: NAV-C07, C13–C15, C17. Expected learning: Distinguish preventive heavy-weather measures from damage control."],"source_integrity":"sha256_verified_against_embedded_blocks"},{"step":8,"title_tr":"Eğitim sonuçları, sistemlerin hazır duruma alınması ve kayıt","title_en":"Restore systems and record lessons","learning_tr":"Eğitimin sonunda personelin hava bilgisi, rapor akışı, emniyetli kontrol alanı, sabitleme tertibi, dinamik hareket bilgisi ve kayıt disiplini değerlendirilir.","learning_en":"At the end of training, the crew's understanding of meteorological information, reporting lines, safe inspection areas, securing arrangements, dynamic vessel motions and recordkeeping is assessed.","exercise_tr":"Varsayımsal talim zaman çizelgesi ve kontrol listesinde gerçek yapılan işlemlerle yalnız tartışılanları ayrı işaretleyin.","exercise_en":"Mark actual actions separately from discussed scenarios on a sample drill timeline and checklist.","hazard_tr":"Yapılmamış rota değişimini, VHF çağrısını veya balast transferini gerçek seyir kaydına geçirmek.","hazard_en":"Recording unperformed course changes, VHF transmissions or ballast transfers as real operations.","id":"HW-08","source_full_tr":["Eğitimin sonunda personelin hava bilgisi, rapor akışı, emniyetli kontrol alanı, sabitleme tertibi, dinamik hareket bilgisi ve kayıt disiplini değerlendirilir. Sadece gösterilen sistemler ile gerçekten çalıştırılan donanım ayrıştırılır. Varsayımsal rota değişikliği, gerçek VHF çağrısı veya gerçek balast transferi yapılmış gibi kayıt yazılmaz. Eksiklik, sorumlu ve takip tedbiri kayda bağlanır.","Gösterim: Bir sayfalık örnek talim zaman çizelgesinden eğitim sonucu yazılır. Kartlar: NAV-C02, C17, C18. Beklenen öğrenme: Öğrenme hedefi ve gerçekte uygulanmış işlem kanıta dayalı ayrılır."],"source_full_en":["At the end of training, assess the crew's understanding of weather information, reporting chains, safe operating limits, securing arrangements, dynamic vessel motions and recording discipline. Distinguish systems only demonstrated from equipment actually operated. Do not record a hypothetical course alteration, real VHF call or ballast transfer as though it occurred. Link deficiencies to a responsible person and follow-up measure.","Demonstration: Write training conclusions from a sample one-page drill timeline. Related cards: NAV-C02, C17, C18. Expected learning: Distinguish learning objectives from physical activities using evidence."],"source_integrity":"sha256_verified_against_embedded_blocks"}]},{"key":"weather_collision/collision","family":"weather_collision","flow":"collision","title_tr":"Çatışma / Çatma","title_en":"Collision / Allision","family_title_tr":"Ağır Hava / Çatışma–Çatma","family_title_en":"Heavy Weather / Collision and Contact","stages":[{"step":1,"title_tr":"Seyirde yakın tehlikenin ve çatışma riskinin fark edilmesi","title_en":"Recognize close-quarters collision risk","learning_tr":"Gözcülük, radar/ARPA, görsel kerteriz, AIS, emniyetli sürat ve mevcut su alanı üzerinden yakın tehlike değerlendirilir. Hedefin tek bir CPA değeriyle değil, izlenen hareketi ve veri kalitesiyle yorumlanması öğretilir.","learning_en":"Close-quarters risks are assessed using visual lookout, radar/ARPA, visual bearings, AIS, safe speed and available sea room.","exercise_tr":"İki örnek radar/ARPA görüntüsünde kerteriz eğilimi, CPA/TCPA, AIS sınırlaması ve görüş koşullarını karşılaştırın.","exercise_en":"Compare bearing trends, CPA/TCPA, AIS limitations and visibility in two sample radar/ARPA plots.","hazard_tr":"Tek CPA değerine körü körüne güvenme; kısıtlı görüş ve sabit cisim tehlikesini farklı kurallarla değerlendirememe.","hazard_en":"Blind reliance on a single CPA value; confusing restricted-visibility encounters with hazards involving fixed objects.","id":"COL-01","source_full_tr":["Gözcülük, radar/ARPA, görsel kerteriz, AIS, emniyetli sürat ve mevcut su alanı üzerinden yakın tehlike değerlendirilir. Hedefin tek bir CPA değeriyle değil, izlenen hareketi ve veri kalitesiyle yorumlanması öğretilir. Görüş kısıtlı ise Kural 19'un, gemiler birbirini görüyorsa ilgili karşılaşma kurallarının uygulanabilirliği açıklanır. Sabit cisme yaklaşma tehlikesi, gemi–gemi karşılaşmasıyla aynı manevra kuralları kullanılarak basitleştirilmez.","Gösterim: Çizilmiş iki radar plotunda kerteriz eğilimi ve yaklaşma değerlendirilir. Kartlar: NAV-C03–C05, C16. Beklenen öğrenme: Riski oluşturan veri ve düzenleme belirlenir."],"source_full_en":["Assess close-quarters danger using proper lookout, radar/ARPA, visual bearings, AIS, safe speed and available sea room. Teach that a target must be interpreted through observed motion and data quality, not a single closest-point-of-approach (CPA) figure. Explain the applicability of COLREG Rule 19 in restricted visibility and the relevant encounter rules when vessels are in sight of one another. Do not reduce approach to a fixed structure to the same manoeuvring rules as a vessel-to-vessel encounter.","Demonstration: Compare bearing trends and closure on two drawn radar plots. Related cards: NAV-C03–C05, C16. Expected learning: Identify the observations and rules that define the risk."],"source_integrity":"sha256_verified_against_embedded_blocks"},{"step":2,"title_tr":"Önleme manevrası, kaptanın bilgilendirilmesi ve çatışmanın ayırt edilmesi","title_en":"Review avoidance action and reporting","learning_tr":"COLREG Kural 8'e göre emniyetli, zamanında ve belirgin hareketin önemi; Kural 16–17'deki yol verme ve yolunu koruma yükümlülükleri, karşılaşma türüne göre açıklanır.","learning_en":"The importance of substantial, timely and readily apparent avoiding action under COLREG Rule 8, together with the give-way and stand-on obligations of Rules 16–17, is explained for the encounter concerned.","exercise_tr":"Örnek karşılaşma çiziminde COLREG kapsamında seçenekleri, kaptanı çağırma ve diğer hedeflere etkileri tartışın.","exercise_en":"Discuss COLREG avoidance options, master notification and effects on other targets using encounter diagrams.","hazard_tr":"Talim adına fiilî manevra uygulamak veya tek hedefe odaklanarak diğer gemileri gözden kaçırmak.","hazard_en":"Executing a live manoeuvre solely for the drill or losing awareness of other vessels while focusing on one target.","id":"COL-02","source_full_tr":["COLREG Kural 8'e göre emniyetli, zamanında ve belirgin hareketin önemi; Kural 16–17'deki yol verme ve yolunu koruma yükümlülükleri, karşılaşma türüne göre açıklanır. Köprüüstü zabiti kaptanı uygun zamanda çağırır ve tüm hedeflere yönelik etkileri değerlendirir. Başka gemiler, trafik ayrım düzeni ve sığlık varken tek hedefe odaklanmanın sakıncaları öğretilir. Kaza önleme aşamasında gerçek rota/sürat değişikliği yapma zorunluluğu olmayan talimlerde masa başı manevra değerlendirmesi kullanılır.","Gösterim: “Hedef B için seçilen manevra hedef C'ye ne yapar?” sorusu üzerinde çalışılır. Kartlar: NAV-C01, C03–C05, C16. Beklenen öğrenme: Manevra ve hukukî bağlam birbirine karıştırılmaz."],"source_full_en":["Explain the importance of safe, early and substantial action under COLREG Rule 8, and of give-way and stand-on obligations under Rules 16–17 according to encounter type. The bridge officer calls the master in good time and evaluates effects on all targets. Teach the dangers of focusing on only one target amid other vessels, traffic separation schemes and shoals. Where a drill does not require actual alteration of course or speed, evaluate the avoiding manoeuvre on a tabletop exercise.","Demonstration: Work through the question 'What effect would the manoeuvre selected for target B have on target C?' Related cards: NAV-C01, C03–C05, C16. Expected learning: Distinguish the manoeuvre decision from its legal context."],"source_integrity":"sha256_verified_against_embedded_blocks"},{"step":3,"title_tr":"Çatışma meydana geldiğinde ilk emniyet değerlendirmesi","title_en":"Assess immediate safety after collision","learning_tr":"Varsayımsal temas anında geminin konumu, saat, temas yeri, diğer geminin durumu ve personel tehlikesi ayrı ayrı değerlendirilir.","learning_en":"For an assumed collision, the ship's position, time, point of impact, other vessel's condition and risks to personnel are assessed separately.","exercise_tr":"Maket üzerinde varsayımsal temas yerini işaretleyerek personel yoklaması, yangın ve hasar kontrolü sırasını gösterin.","exercise_en":"Mark a hypothetical impact point on a model and show the sequence of personnel accounting, fire and damage assessment.","hazard_tr":"Gerçek makine stopu, acil yayın veya beklenmeyen manevrayı otomatik talim eylemi saymak.","hazard_en":"Treating actual engine stops, distress transmissions or unexpected manoeuvres as automatic drill actions.","id":"COL-03","source_full_tr":["Varsayımsal temas anında geminin konumu, saat, temas yeri, diğer geminin durumu ve personel tehlikesi ayrı ayrı değerlendirilir. Kaptanın köprüüstünde olay idaresi, makineyle ilişki, personel yoklaması, yaralı ve yangın kontrolü önceliklendirilir. İlgili alarmlar olayın gerektirdiği kapsamda ele alınır; gerçek seyirde makineyi durdurmak, ani manevra yapmak veya tehlike çağrısı yayınlamak tek satırlık otomatik işlem değildir.","Gösterim: Maket üzerinde temas noktası ve tehlike bölgeleri işaretlenir. Kartlar: NAV-C01, C02, C10–C12, C18. Beklenen öğrenme: Komuta, kişi emniyeti ve seyir durumunun eşzamanlı değerlendirilmesi sağlanır."],"source_full_en":["At a hypothetical moment of contact, assess vessel position, time, contact location, condition of the other vessel and danger to personnel separately. Prioritise the master's incident management on the bridge, engineering coordination, crew muster, casualty checks and fire detection. Consider alarms only as required by the event; stopping machinery, making an abrupt manoeuvre or broadcasting distress during an actual voyage are not automatic one-line instructions.","Demonstration: Mark the point of contact and hazardous areas on a model. Related cards: NAV-C01, C02, C10–C12, C18. Expected learning: Evaluate command, human safety and navigational condition simultaneously."],"source_integrity":"sha256_verified_against_embedded_blocks"},{"step":4,"title_tr":"Su alma, gövde ve kritik devrelerin sistematik kontrolü","title_en":"Check flooding, hull and critical systems","learning_tr":"Gövdenin su üstü ve su altı hasarı olasılığı, sintine/tank iskandili, koferdam, makine mahalli, kablo/hidrolik/yakıt devreleri ve su geçirmez sınırlar ile birlikte incelenir.","learning_en":"Possible hull damage above and below the waterline is reviewed together with bilge and tank soundings, cofferdams, machinery spaces, electrical cables, hydraulic and fuel systems and watertight boundaries.","exercise_tr":"Bölmelendirme planı ile örnek iskandil verilerini karşılaştırarak su geçirmez sınır ve kritik devre kontrolünü canlandırın.","exercise_en":"Compare compartmentation plans with sample soundings to rehearse watertight-boundary and critical-system checks.","hazard_tr":"Görünür hasar küçük diye iç su almayı dışlamak; kapalı veya su alan mahale izinsiz giriş.","hazard_en":"Excluding hidden flooding because visible damage appears small; entering enclosed or flooded areas without authorisation.","id":"COL-04","source_full_tr":["Gövdenin su üstü ve su altı hasarı olasılığı, sintine/tank iskandili, koferdam, makine mahalli, kablo/hidrolik/yakıt devreleri ve su geçirmez sınırlar ile birlikte incelenir. Darbe yerinde görünür hasarın küçük olması, bağlantılı mahalde su sızıntısı bulunmadığını kanıtlamaz. Bir kontrol ekibi, emniyetli erişim ve haberleşme sağlanmadan kapalı/hasarlı bölmeye sevk edilmez. Tekrarlı ölçüm sonuçlarının eğilimi değerlendirilir.","Gösterim: Çatışma noktasıyla bölmelendirme planı karşılaştırılır; örnek iskandil dizisi yorumlanır. Kartlar: NAV-C06, C07, C13, C14. Beklenen öğrenme: Gövde–sistem–personel hasarı ayrı raporlanır."],"source_full_en":["Review possible damage above and below the waterline together with bilge and tank soundings, cofferdams, machinery spaces, electrical, hydraulic and fuel circuits, and watertight boundaries. Minor visible damage at the impact point does not prove that connected compartments have not flooded. Do not send an inspection team into an enclosed or damaged space without safe access and communications. Assess trends from repeated measurements.","Demonstration: Compare the collision point with the subdivision plan and interpret a sample series of soundings. Related cards: NAV-C06, C07, C13, C14. Expected learning: Report hull, system and personnel damage separately."],"source_integrity":"sha256_verified_against_embedded_blocks"},{"step":5,"title_tr":"Gemilerin bağlı kalması veya ayrılması durumunda karar ölçütleri","title_en":"Evaluate connected vessels and separation risks","learning_tr":"Çatışan gemilerin temas yerindeki basınç veya sıkışmanın olası su girişini geçici olarak sınırlayabileceği; kontrolsüz ayrılmanın açılan hasar yolunu büyütebileceği anlatılır.","learning_en":"Participants learn that contact pressure or compression between two ships can temporarily restrict water entering a damaged opening, and uncontrolled separation may worsen it.","exercise_tr":"Bağlı kalma ve ayrılma kararlarının olası su girişi, yangın ve stabilite sonuçlarını senaryo karar tablosunda karşılaştırın.","exercise_en":"Compare consequences of remaining in contact versus separating for flooding, fire and stability in a decision matrix.","hazard_tr":"Kaptan ve teknik değerlendirme olmadan iki geminin ayrılmasına ilişkin fiilî kumanda uygulanması.","hazard_en":"Applying a real separation manoeuvre without the master's direction and technical assessment.","id":"COL-05","source_full_tr":["Çatışan gemilerin temas yerindeki basınç veya sıkışmanın olası su girişini geçici olarak sınırlayabileceği; kontrolsüz ayrılmanın açılan hasar yolunu büyütebileceği anlatılır. Buna karşılık bağlı kalmanın yangın, dalga etkisi, yeni darbe ve devrilme riskleri doğurabileceği de değerlendirilir. Diğer kaptanla koordinasyon, çevre şartları, kurtarma/tug desteği ve iki geminin stabilitesi kararın unsurlarıdır. Bu aşama “gemileri ayır” veya “ayırma” şeklinde evrensel emir içermez.","Gösterim: İki alternatif ayrılma/bağlı kalma senaryosu için riskler karşılaştırılır. Kartlar: NAV-C07, C13–C15. Beklenen öğrenme: Manevra kararı hasar ve emniyet değerlendirmesine bağlanır."],"source_full_en":["Explain that pressure at the contact point between two vessels can temporarily restrict water ingress, so uncontrolled separation may enlarge a damaged opening. Remaining in contact can also increase fire, wave impact, further collision or capsize risks. Coordination with the other master, environmental conditions, salvage or tug assistance and the stability of both vessels are relevant decisions. This stage contains no universal order either to separate or to remain connected.","Demonstration: Compare risk profiles for two alternative scenarios, separation and remaining in contact. Related cards: NAV-C07, C13–C15. Expected learning: Base manoeuvring decisions on damage and safety assessment."],"source_integrity":"sha256_verified_against_embedded_blocks"},{"step":6,"title_tr":"Diğer gemiyle, liman/VTS ile ve kıyı birimleriyle koordinasyon","title_en":"Coordinate with other vessel, VTS and authorities","learning_tr":"Kendi gemisindeki can emniyeti korunurken diğer gemiden yaralı, yangın, kirlilik, manevra kabiliyeti ve yardım talebi bilgisi istenir.","learning_en":"While safeguarding life aboard the own vessel, the crew seeks information from the other ship concerning injuries, fire, pollution, manoeuvring capability and any request for assistance.","exercise_tr":"Diğer gemi, VTS/liman ve kıyı birimleri için bilgi alışverişi alanlarını örnek mesaj kartlarına yerleştirin.","exercise_en":"Populate sample communication cards for the other vessel, VTS/port and shore authorities.","hazard_tr":"Varsayımsal olay için gerçek kanaldan yanıltıcı acil bildirim yapmak veya doğrulanmamış hasarı kesin bilgi diye iletmek.","hazard_en":"Transmitting misleading live emergency alerts or presenting unverified damage as confirmed.","id":"COL-06","source_full_tr":["Kendi gemisindeki can emniyeti korunurken diğer gemiden yaralı, yangın, kirlilik, manevra kabiliyeti ve yardım talebi bilgisi istenir. Kaptan, olayın ciddiyetine göre VTS, liman birimi, arama-kurtarma veya ilgili makamları bilgilendirme seçeneklerini değerlendirir. VHF üzerinden verilen senaryo bilgisi gerçek tehlike çağrısının yerine geçmez. Kural 34 seda/ışık işaretlerinin karşılaşma koşullarındaki anlamı; Kural 27 işaretlerinin ancak gerçek durumunu sağlayan gemiye uygulanacağı açıklanır.","Gösterim: Acil olmayan eğitim kanalı/kapalı devre üzerinden kısa olay raporu canlandırılır. Kartlar: NAV-C11, C15, C16. Beklenen öğrenme: Haberleşme içeriği ile tehlike çağrısının hukuki ve operasyonel niteliği ayrılır."],"source_full_en":["While protecting lives aboard, seek information from the other vessel about casualties, fire, pollution, manoeuvrability and assistance needed. Depending on severity, the master considers notifying VTS, port authorities, search-and-rescue services or other competent bodies. Scenario messages spoken by VHF do not replace actual distress communications. Explain the meaning of COLREG Rule 34 sound and light signals in encounter situations and that Rule 27 signals apply only where the ship's actual condition warrants them.","Demonstration: Rehearse a concise incident report using a non-emergency training channel or closed circuit. Related cards: NAV-C11, C15, C16. Expected learning: Distinguish communication content from the legal and operational status of a distress call."],"source_integrity":"sha256_verified_against_embedded_blocks"},{"step":7,"title_tr":"İkincil risklerin kontrolü ve olayın izlenmesi","title_en":"Control secondary hazards and monitor","learning_tr":"Su alma, hasar stabilitesi, elektrik, yangın, yakıt/yağ sızıntısı ve çevre tehlikesi eşzamanlı değerlendirilir. Geçici izolasyon ve pompalama kararları geminin teknik imkânları ve onaylı planlarıyla ilişkilendirilir.","learning_en":"Flooding, damaged stability, loss of electricity, fire, fuel or oil leakage and environmental hazards are assessed concurrently.","exercise_tr":"Örnek olay tablosunda su alma, yangın, kirlilik, sevk/dümen ve stabilite risklerini birlikte izleyin.","exercise_en":"Track flooding, fire, pollution, propulsion/steering and stability risks together on a sample incident dashboard.","hazard_tr":"Bir riski azaltırken izinsiz sıvı transferi veya uygunsuz elektrik izolasyonuyla yeni tehlike yaratmak.","hazard_en":"Creating secondary hazards through unauthorised liquid transfers or unsafe electrical isolation.","id":"COL-07","source_full_tr":["Su alma, hasar stabilitesi, elektrik, yangın, yakıt/yağ sızıntısı ve çevre tehlikesi eşzamanlı değerlendirilir. Geçici izolasyon ve pompalama kararları geminin teknik imkânları ve onaylı planlarıyla ilişkilendirilir. Olayın sonucu sabit kabul edilmez; yaralı sayısı, su seviyesi, gemilerin hareketi, hava şartı ve yardım durumu belirli aralıklarla yeniden raporlanır. Gemi terk ihtimalinin değerlendirilmesi, gerçekleşmiş gemi terk işlemi olarak anlatılmaz.","Gösterim: Artan sintine seviyesi ve düşen güç kapasitesi varsayımında görev önceliği tartışılır. Kartlar: NAV-C07, C10, C12–C15. Beklenen öğrenme: İkincil acil durumların ilk olayı nasıl değiştirdiği anlaşılır."],"source_full_en":["Assess flooding, damage stability, electricity, fire, fuel or oil leakage and environmental dangers simultaneously. Relate temporary isolation and pumping decisions to the ship's technical capability and approved plans. Do not assume the incident condition is static: periodically report casualty numbers, water levels, vessel movement, weather and assistance status. Consideration of abandon-ship contingency must not be described as though abandonment actually occurred.","Demonstration: Discuss priorities assuming rising bilge levels and declining available power. Related cards: NAV-C07, C10, C12–C15. Expected learning: Understand how secondary emergencies change the initial incident."],"source_integrity":"sha256_verified_against_embedded_blocks"},{"step":8,"title_tr":"Talim sonlandırma, kayıtların korunması ve öğrenilen dersler","title_en":"Preserve records and conclude drill","learning_tr":"Talim sonunda tehlikenin fark edilmesi, manevra değerlendirmesi, personel yoklaması, hasar kontrolü, diğer gemiyle haberleşme ve sonuç raporlarının öğrenme düzeyi gözden geçirilir.","learning_en":"At the conclusion, the crew's understanding of hazard recognition, avoiding-action assessment, personnel accounting, damage control, communications with the other vessel and subsequent reporting is reviewed.","exercise_tr":"Kaynak zaman çizelgesi, VDR/ECDIS kayıtlarının korunması ve talimde simüle edilen işlemlerin işaretlenmesini örnek raporda gösterin.","exercise_en":"Demonstrate evidence preservation, VDR/ECDIS timeline references and simulated-action labels in a sample report.","hazard_tr":"Kurgusal teması gerçek olaymış gibi kaydetmek veya gerçek veri kayıtlarını talim gerekçesiyle değiştirmek.","hazard_en":"Recording a fictional collision as a real casualty or altering actual navigation data for drill purposes.","id":"COL-08","source_full_tr":["Talim sonunda tehlikenin fark edilmesi, manevra değerlendirmesi, personel yoklaması, hasar kontrolü, diğer gemiyle haberleşme ve sonuç raporlarının öğrenme düzeyi gözden geçirilir. Gerçek olayda VDR/ECDIS/veri, köprüüstü ve makine jurnalleri, görsel kayıtlar, tanık ifadeleri ve ilgili mühendislik kayıtlarının korunması açıklanır. Öğretim senaryosunun “olmuş gibi” geçmiş zamanlı bir rapor örneği bulunabilir; bunun fiilen yapılmış işlem belgesi olmadığı, doğru fiiller seçilerek gösterilir.","Gösterim: Bir olay zaman çizelgesi ve örnek EK-V konu listesi üzerinden rapor düzeni değerlendirilir. Kartlar: NAV-C02, C17, C18. Beklenen öğrenme: Rapor iddiası ve eldeki kayıt birbiriyle uyumlu olur."],"source_full_en":["At closeout assess training on detection of the danger, avoiding manoeuvres, headcount, damage control, communication with the other vessel and final situation reports. Explain preservation of VDR and ECDIS data, bridge and engine logs, photographs, witness accounts and relevant engineering records in an actual incident. A training scenario may include a sample report written in the past tense; demonstrate selection of verbs consistent with the activities actually performed.","Demonstration: Review reporting arrangements using an incident timeline and the sample EK-V subject list. Related cards: NAV-C02, C17, C18. Expected learning: Align reported claims with the evidence available."],"source_integrity":"sha256_verified_against_embedded_blocks"}]},{"key":"helicopter/landing","family":"helicopter","flow":"landing","title_tr":"Helikopter İniş Operasyonu","title_en":"Helicopter Landing Operation","family_title_tr":"Helikopter / Gemi Operasyonları","family_title_en":"Helicopter / Ship Operations","stages":[{"step":1,"title_tr":"Amaç ve operasyon yeteneği belirlenir","title_en":"Assess purpose and vessel capability","learning_tr":"Eğitimde geminin helikopterle görev yapma kabiliyeti yalnız “helideck var/yok” şeklinde değerlendirilmez. Onaylı alanın işletme sınırları, kabul edilebilecek hava aracı sınıfları, operasyon amacının yolcu, pilot, malzeme veya…","learning_en":"A vessel's capability for helicopter operations is not established simply by the presence of a deck. Review approval limits of the operating area, permitted aircraft types, mission purpose (passengers, pilot, stores or medical evacuation) and agreements with the aircraft operator. The master remains responsible for vessel and crew safety, while the pilot is responsible for flight safety. Discuss abort/postponement authority and hazard reporting. An unverified deck must not be represented as an approved landing area.","exercise_tr":"Gemiye ait onaylı helikopter operasyon planında saha tipi, uçuş görevi ve işletme sınırlarının hangi belgelerde bulunduğunu gösterin.","exercise_en":"Identify the approved operating area, mission type and aircraft limits in the vessel's helicopter operations documentation.","hazard_tr":"Yalnız helideck varlığına bakarak her hava aracı veya operasyon için uygunluk varsaymak.","hazard_en":"Assuming suitability for any aircraft or mission merely because a helideck is present.","id":"A1","source_full_tr":["Eğitimde geminin helikopterle görev yapma kabiliyeti yalnız “helideck var/yok” şeklinde değerlendirilmez. Onaylı alanın işletme sınırları, kabul edilebilecek hava aracı sınıfları, operasyon amacının yolcu, pilot, malzeme veya tıbbi tahliye olup olmadığı ve hava aracı işleticisiyle sağlanan mutabakat açıklanır. Kaptan, geminin seyir ve personel emniyetinden; pilot, uçuş emniyetinden sorumludur. Kaptan ile pilot arasındaki karar alanı, güvenli bir noktadan operasyonu iptal/erteleme yetkisi ve görevlilerin kritik bulguları bildirme sorumluluğu tartışılır. Bu aşamada uygunluğu doğrulanmamış bir güverte alanı iniş sahası olarak adlandırılmaz."],"source_full_en":["The training does not assess a vessel's capability to undertake helicopter operations simply by whether a helideck is present. Explain the approved area's operating limitations, the aircraft classes it can accept, whether the purpose is passenger or pilot transfer, cargo transport or medical evacuation, and the agreement with the aircraft operator. The master is responsible for navigation and the safety of the vessel and its personnel; the pilot is responsible for flight safety. Discuss their respective decision-making responsibilities, the authority to cancel or postpone an unsafe operation, and the obligation of assigned personnel to report critical observations. A deck area whose suitability has not been confirmed must not be described as an approved landing area."],"source_integrity":"sha256_verified_against_embedded_blocks"},{"step":2,"title_tr":"Operasyon öncesi risk değerlendirmesi yapılır","title_en":"Conduct operational risk assessment","learning_tr":"Operasyonun saati, deniz durumu, rüzgâr yönü, görüş, geminin hareketi, helikopter tipi, yolcu/yük niteliği ve eşzamanlı güverte çalışmaları birlikte değerlendirilir.","learning_en":"The planned time, sea state, wind direction, visibility, vessel motion, helicopter type, passengers or cargo and simultaneous deck operations are assessed together.","exercise_tr":"Örnek hava/deniz durumu ve gemi hareketi tablosuyla operasyon öncesi risk değerlendirme toplantısını canlandırın.","exercise_en":"Rehearse a pre-operation risk briefing using sample weather, sea-state and vessel-motion data.","hazard_tr":"Rüzgâr, görüş, gemi hareketi veya eşzamanlı güverte işlerini tek başına ele alıp toplam riski kaçırmak.","hazard_en":"Failing to consider combined risks from wind, visibility, vessel motion and simultaneous deck work.","id":"A2","source_full_tr":["Operasyonun saati, deniz durumu, rüzgâr yönü, görüş, geminin hareketi, helikopter tipi, yolcu/yük niteliği ve eşzamanlı güverte çalışmaları birlikte değerlendirilir. Risk değerlendirmesi yalnız genel yangın ve düşme tehlikeleriyle sınırlanmaz: üstyapı türbülansı, baca gazı, statik yük, elektrik/anten donanımı, açık kapaklar, gemi güvertesinde kayma ve gece aydınlatması gibi birbirini etkileyen unsurlar incelenir. Risklerin kabul edilebilir düzeye indirilemediği durumda uçuştan vazgeçilmesi veya farklı yöntem kullanılması, yeterli bir emniyet kararı olarak öğretilir. EYS.09.117.FR ve EYS.09.118.FR kurumsal başlıkları anılır; hangi formun seçileceği onaylı güncel prosedüre bağlıdır."],"source_full_en":["Assess together the operation time, sea state, wind direction, visibility, vessel motion, aircraft type, type of passengers or cargo, and simultaneous deck activities. The assessment must not be limited to generic fire and falling hazards: examine interacting factors including superstructure turbulence, exhaust gases, static charge, electrical and antenna installations, open hatches, slippery decks and night lighting. Teach that cancelling the flight or using another method is an appropriate safety decision if risk cannot be reduced to an acceptable level. The corporate form titles EYS.09.117.FR and EYS.09.118.FR may be mentioned; which form applies depends on the current approved procedure."],"source_integrity":"sha256_verified_against_embedded_blocks"},{"step":3,"title_tr":"Rol, haberleşme ve hazırlık toplantısı gerçekleştirilir","title_en":"Confirm roles and pre-operation briefing","learning_tr":"Kaptan, sorumlu zabit/HLO, köprüüstü vardiyası, yangın ekibi, ilk yardımcı, alan gözcüsü ve varsa yolcu aktarım ekibinin görevleri açıklanır.","learning_en":"The duties of the master, responsible officer or helicopter landing officer (HLO), bridge watch, firefighting team, first-aid personnel, deck-area lookout and any passenger-transfer team are explained.","exercise_tr":"HLO/saha sorumlusu, köprüüstü, yangın ve ilk yardım ekipleri için rol ve haberleşme kartlarını eşleştirin.","exercise_en":"Match role and communication cards for the HLO/site lead, bridge, fire party and first-aid team.","hazard_tr":"Birden fazla kişinin çelişkili uçuş talimatı vermesi veya haberleşme kaybının fark edilmemesi.","hazard_en":"Conflicting directions from multiple persons or an undetected communications failure.","id":"A3","source_full_tr":["Kaptan, sorumlu zabit/HLO, köprüüstü vardiyası, yangın ekibi, ilk yardımcı, alan gözcüsü ve varsa yolcu aktarım ekibinin görevleri açıklanır. Uçuş ekibiyle iletişimin tek ve belirli bir sorumlu kanal üzerinden yürütülmesi, sahadaki ekibin komut kargaşasını azaltır. Personelin toplanma, bekleme ve güvenli yaklaşma noktaları tanımlanır. Durdurma sinyalinin kimden geleceği ve köprüüstünün operasyona etkisi anlatılır. Ekipman listesi anlatılırken yalnız bulunduğu varsayılan malzemeler değil, gerçek donanımın nerede ve hangi durumda olduğu üzerinden gösterim yapılır. İşletici, görevli personel ve gemi arasında kısa bir ön toplantı (toolbox talk) uygulanır."],"source_full_en":["Explain the duties of the master, responsible officer or helicopter landing officer (HLO), bridge watch, fire team, first aider, area lookout and, where applicable, passenger-transfer team. Communications with the flight crew through one designated and accountable channel reduce conflicting instructions on deck. Define muster, standby and safe approach areas. Explain who can initiate a stop signal and how bridge operations affect the activity. Equipment must be demonstrated by its actual location and condition, not merely as items assumed to exist. Conduct a short pre-operation toolbox talk involving the operator, assigned personnel and vessel."],"source_integrity":"sha256_verified_against_embedded_blocks"},{"step":4,"title_tr":"İniş sahasının fiziksel ve yangın hazırlığı incelenir","title_en":"Prepare deck area and fire protection","learning_tr":"Operasyon alanındaki engeller, gevşek malzeme, açık kapaklar, yanıcı stoklar, yüzey kayganlığı, beklenen rotor akımı ve güvenli kaçış yolları değerlendirilir.","learning_en":"Obstructions, loose equipment, open hatches, flammable stores, slippery surfaces, expected rotor downwash and safe escape routes in the operating area are assessed.","exercise_tr":"Eğitim alanında FOD, kapak, yangın donanımı, kaçış yolu ve helikopter sahası tehlikelerini bir kontrol planında işaretleyin.","exercise_en":"Mark FOD, openings, firefighting equipment, escape routes and landing-area hazards on a training checklist.","hazard_tr":"Rotor etkisi altında gevşek malzeme; kapalı olmayan kapak veya emniyetsiz erişim güzergâhı.","hazard_en":"Loose material in rotor wash, unsecured openings or unsafe access routes.","id":"A4","source_full_tr":["Operasyon alanındaki engeller, gevşek malzeme, açık kapaklar, yanıcı stoklar, yüzey kayganlığı, beklenen rotor akımı ve güvenli kaçış yolları değerlendirilir. Yangın ve kurtarma ekibi onaylı plana göre hazır pozisyon alır; köpük, uygun söndürme ajanı, yangın suyu ve kurtarma donanımının erişilebilirliği açıklanır. Yakıt ikmali veya yük aktarımı varsa bu ilave faaliyetin kendi izin ve yangın tedbirleri gerektirdiği belirtilir; varsayılan bir yakıt ikmal süreci eğitim metnine otomatik dâhil edilmez. Gece operasyonunda engel işaretlerinin ve aydınlatmanın pilot görüşünü bozmayacak şekilde değerlendirilmesi vurgulanır. Saha uygunluğu, tek başına eğitmen gözlemiyle sertifikalandırılmış sayılmaz."],"source_full_en":["Assess obstructions, loose articles, open hatches, flammable stores, slippery surfaces, expected rotor downwash and safe escape routes in the operating area. The firefighting and rescue team takes its assigned standby positions under the approved plan; explain access to foam, suitable extinguishing media, fire water and rescue equipment. If refuelling or cargo transfer is involved, explain the separate permissions and fire precautions required; do not automatically include an assumed refuelling operation. For night operations, consider obstacle markings and lighting without impairing the pilot's vision. A trainer's observation alone does not certify the landing area's suitability."],"source_integrity":"sha256_verified_against_embedded_blocks"},{"step":5,"title_tr":"Gemi–helikopter bilgi değişimi ve yaklaşma izlenir","title_en":"Exchange ship-aircraft information","learning_tr":"Gemi konumu, çağrı işareti, rota/sürat, baş-kıç doğrultusu, rüzgâr/görüş ve sahadaki kısıtlamalar helikopter görevlisine iletilecek bilgi grupları olarak öğretilir.","learning_en":"The vessel's position, call sign, course and speed, heading, wind, visibility and operating-area restrictions are taught as information to be provided to the helicopter crew.","exercise_tr":"Örnek gemi–uçuş ekibi bilgi kartında konum, rota/sürat, rüzgâr, görüş ve saha kısıtlarını karşılaştırın.","exercise_en":"Compare position, course/speed, wind, visibility and deck restrictions on a sample ship–aircraft briefing card.","hazard_tr":"Gerçek uçuş ekibine doğrulanmamış bilgi aktarmak veya eğitim nedeniyle gerçek seyir komutu vermek.","hazard_en":"Passing unverified information to an actual flight crew or issuing live navigation orders for a tabletop exercise.","id":"A5","source_full_tr":["Gemi konumu, çağrı işareti, rota/sürat, baş-kıç doğrultusu, rüzgâr/görüş ve sahadaki kısıtlamalar helikopter görevlisine iletilecek bilgi grupları olarak öğretilir. Gemi kendi hareketlerini kaptan talimatıyla düzenler; uçuş yaklaşması ve iniş kararı hava aracının pilotu tarafından verilir. Operasyon mahallinde görevli zabit, izinsiz kişi girişini ve yeni FOD oluşmasını önlemek için gözetim sağlar. Haberleşmenin kesilmesi veya sahada uygun olmayan yeni bir durumun görülmesi hâlinde onaylı durdurma işaretleri ve haberleşme kesme planı değerlendirilir. Eğitim, “pilotun istediği her manevranın başka gemi trafiğine bakılmadan yapılacağı” şeklinde anlatılmaz."],"source_full_en":["Teach the information groups to be sent to the helicopter crew: vessel position, call sign, course and speed, heading, wind and visibility, and restrictions at the site. The master directs vessel movements, while the aircraft pilot makes approach and landing decisions. The responsible deck officer watches for unauthorised entry and newly arising foreign-object debris (FOD). If communications fail or an unsuitable condition develops, review the approved stop signals and loss-of-communications procedure. Training must not imply that every requested vessel manoeuvre is performed without regard to other marine traffic."],"source_integrity":"sha256_verified_against_embedded_blocks"},{"step":6,"title_tr":"İniş/aktarım sırasında personel ve yük emniyeti öğretilir","title_en":"Protect personnel during landing and transfers","learning_tr":"Personelin helikoptere yaklaşma ve uzaklaşması, pilot/uçuş ekibinden izin alma, rotor ve kuyruk rotor emniyetinden ayrılmama, seyahat edecek kişiye verilen özel bilgilendirme ile ilişkilendirilir.","learning_en":"Safe approaches to and departures from the helicopter are linked to permission from the pilot or flight crew, avoidance of main- and tail-rotor hazards and a specific briefing for anyone travelling.","exercise_tr":"Maket veya video üzerinden mürettebatın hava aracına yalnız uçuş ekibinin izniyle yaklaşmasını ve yük/hasta teslim sınırlarını gösterin.","exercise_en":"Use a model or video to demonstrate crew approach only on flight-crew permission and the handover limits for loads or patients.","hazard_tr":"Rotor/kuyruk rotor yaklaşma tehlikesi; gevşek yükün rotor akımıyla savrulması.","hazard_en":"Main/tail rotor exposure and unsecured material being displaced by rotor wash.","id":"A6","source_full_tr":["Personelin helikoptere yaklaşma ve uzaklaşması, pilot/uçuş ekibinden izin alma, rotor ve kuyruk rotor emniyetinden ayrılmama, seyahat edecek kişiye verilen özel bilgilendirme ile ilişkilendirilir. Yük, bagaj, sedye veya tıbbi malzemenin aktarımında gevşek parçalar, emniyet bağları ve ağır/tehlikeli madde taşıma sınırları tartışılır. Yolcuların kendi kendine iniş sahasında hareket etmemesi ve sorumlu zabit yönlendirmesinin takip edilmesi esastır. Fiilî operasyon yapılmayan talimde gerçek helikopter inişi veya yolcu nakli gerçekleşmiş gibi kayıt tutulmaz. Eğitim araçlarıyla temsilî yük aktarımı yapılırsa bunun sınırları kayıtta açıklanır."],"source_full_en":["Relate safe approach to and departure from the helicopter to permission from the pilot or flight crew, and to main- and tail-rotor hazards. Discuss loose items, restraints and limits on heavy or dangerous goods when transferring cargo, baggage, stretchers or medical equipment. Passengers must not move around the landing area independently; they follow the responsible officer's directions. Where no actual aviation activity took place, do not record a helicopter landing or passenger transfer as having occurred. If representative loads were transferred with training aids, describe the scope of that exercise in the report."],"source_integrity":"sha256_verified_against_embedded_blocks"},{"step":7,"title_tr":"Beklenmeyen durum ve acil kesme kararı çalışılır","title_en":"Practise abort and contingency decisions","learning_tr":"Yaklaşma sırasında ani rüzgâr değişimi, telsiz kopması, personelin korumasız sahaya girmesi, FOD görülmesi, yangın başlangıcı veya helikopterin yaklaşmadan vazgeçmesi gibi olaylar değerlendirilir.","learning_en":"Scenarios include a sudden wind shift on approach, radio failure, entry by an unprotected person, FOD detection, outbreak of fire or a helicopter discontinuing its approach.","exercise_tr":"Örnek FOD, rüzgâr değişimi ve telsiz kaybı kartlarıyla devam–durdur–yeniden değerlendirme kararlarını çalışın.","exercise_en":"Use FOD, changing-wind and radio-failure scenarios to rehearse continue/stop/reassess decisions.","hazard_tr":"Uçuş ekibinin emniyet kararı yerine gemi personelinin yetkisiz yönlendirme yapması.","hazard_en":"Ship personnel attempting to override flight-crew safety decisions.","id":"A7","source_full_tr":["Yaklaşma sırasında ani rüzgâr değişimi, telsiz kopması, personelin korumasız sahaya girmesi, FOD görülmesi, yangın başlangıcı veya helikopterin yaklaşmadan vazgeçmesi gibi olaylar değerlendirilir. Her olay için “kim görür, kim bildirir, kararı kim verir, hangi ekip hazır bekler?” soruları cevaplandırılır. Güverte personelinin kendi insiyatifiyle helikopterin motoruna veya uçuş kumandalarına müdahale edemeyeceği; uçuş görevlileriyle mutabakatın gerekli olduğu öğretilir. Gerçek olay geliştiğinde yangın, kaza, kurtarma ve haberleşme prosedürleri birbirine bağlanır. Uygulama sırasında emniyet kriterinin kaybolması, talimin başarısızlığı değil doğru bir durdurma kararıdır."],"source_full_en":["Consider sudden wind changes, loss of radio contact, unauthorised entry into the protected area, FOD, incipient fire and an aborted approach. Answer for each scenario: who observes, who reports, who decides and which team remains on standby? Teach that deck personnel may not independently interfere with helicopter engines or flight controls; coordination with flight personnel is essential. When a real emergency develops, link fire, accident, rescue and communications procedures. Halting an exercise when a safety criterion is lost is an appropriate stop decision, not a training failure."],"source_integrity":"sha256_verified_against_embedded_blocks"},{"step":8,"title_tr":"Operasyon sonrası alan ve kayıtlar kontrol edilir","title_en":"Inspect area and complete records","learning_tr":"Helikopter ayrıldıktan sonra sahanın ve bağlantılı mahallerin yangın, yakıt, gevşek parça, donanım hasarı ve yaralanma yönünden kontrol edilmesi öğretilir.","learning_en":"After departure, the operating area and adjacent spaces are checked for fire hazards, fuel, loose objects, damaged equipment and injuries.","exercise_tr":"Eğitim sonunda saha, yangın sistemi, gevşek malzeme ve rapor doğruluğu kontrolünü örnek kapanış formunda gösterin.","exercise_en":"Demonstrate post-event checks of the deck, fire readiness, loose gear and report accuracy on a sample close-out form.","hazard_tr":"Gerçekte yapılmayan iniş veya tahliyeyi tamamlanmış operasyon olarak rapora yazmak.","hazard_en":"Recording a landing or evacuation that did not actually occur as completed.","id":"A8","source_full_tr":["Helikopter ayrıldıktan sonra sahanın ve bağlantılı mahallerin yangın, yakıt, gevşek parça, donanım hasarı ve yaralanma yönünden kontrol edilmesi öğretilir. İlgili ekipten kısa değerlendirme alınır; beklenen işlemlerin hangilerinin fiilen yapıldığı ve hangilerinin senaryo üzerinden görüşüldüğü ayrıştırılır. Uygulama örneğinde köprüüstü ve güverte jurnali, EYS.07.125.FR operasyon formu, uygun risk değerlendirmesi ve varsa EK-V kaydının ilişkisi anlatılır. Aksaklık bulunan ekipmanın hizmete dönmesi, bakım ve yetkili onay süreçlerine bağlanır. Aynı bilginin farklı kayıtlarda çelişkili yazılmasını önlemek amacıyla saat–mevki–faaliyet zinciri açıklanır."],"source_full_en":["After the helicopter departs, teach inspection of the landing area and adjoining spaces for fire, fuel, loose objects, equipment damage and injuries. Obtain a short debrief from the teams; distinguish actions actually performed from those discussed only as a scenario. Explain the relationship, where applicable, between bridge and deck logs, the EYS.07.125.FR operations form, risk assessment and an EK-V record. Returning defective equipment to service requires maintenance and authorised approval. Teach an unambiguous time–position–activity sequence to prevent inconsistent entries in different records."],"source_integrity":"sha256_verified_against_embedded_blocks"}]},{"key":"helicopter/winching","family":"helicopter","flow":"winching","title_tr":"Helikopterle Vinçli Tahliye","title_en":"Helicopter Winching","family_title_tr":"Helikopter / Gemi Operasyonları","family_title_en":"Helicopter / Ship Operations","stages":[{"step":1,"title_tr":"Tahliye ihtiyacı ve yöntem değerlendirilir","title_en":"Evaluate evacuation need and options","learning_tr":"Yardım talebinin nedeni, hastanın/kazazedenin durumu, geminin konumu, deniz ve hava koşulları, onaylı helikopter çalışma alanları ve alternatif tahliye imkânları tanımlanır.","learning_en":"The reason for requesting assistance, the condition of the patient or casualty, the vessel's position, weather and sea conditions, approved helicopter operating areas and alternative evacuation routes are identified.","exercise_tr":"Hasta/kazazede durumu ve mevcut tahliye yöntemlerini bir karar matrisinde değerlendirerek vinçli almanın koşullarını tartışın.","exercise_en":"Compare casualty condition and available evacuation options in a decision matrix before considering winching.","hazard_tr":"Gemi sahasının onayı veya hasta durumunun elverişliliği teyit edilmeden yöntem seçmek.","hazard_en":"Selecting a transfer method without confirming deck suitability and patient limitations.","id":"B1","source_full_tr":["Yardım talebinin nedeni, hastanın/kazazedenin durumu, geminin konumu, deniz ve hava koşulları, onaylı helikopter çalışma alanları ve alternatif tahliye imkânları tanımlanır. Vinçle alma, helikopterin güverteye inemediği durumda dahi kendiliğinden güvenli seçenek sayılmaz; uygun açıklık, engel durumu ve uçuş ekibinin kabiliyeti gerektirir. Eğitimde helikopterin sedye, sepet, kurtarma personeli veya farklı özel donanımlarla çalışabileceği açıklanır; hangisinin kullanılacağı havadaki ekibin kararı ve tıbbi gereksinimlerle ilişkilendirilir. Kurtarma botuyla kıyı/başka gemi üzerinden tahliye seçeneği de karşılaştırmalı değerlendirilir."],"source_full_en":["Define the reason for the request for assistance, the condition of the patient or casualty, vessel position, sea and weather conditions, approved helicopter operating areas and alternative evacuation methods. Winching is not automatically safe merely because the helicopter cannot land: suitable clearance, obstruction limits and flight-crew capability are required. Explain that helicopters may work with a stretcher, basket, rescue personnel or other special equipment; selection depends on the airborne crew's decisions and clinical needs. Compare possible evacuation via rescue boat, shore or another vessel."],"source_integrity":"sha256_verified_against_embedded_blocks"},{"step":2,"title_tr":"SAR/sağlık ve uçuş birimiyle koordinasyon kurulur","title_en":"Coordinate with SAR, medical and flight units","learning_tr":"Gerekli durumlarda koordinasyon merkezi, helikopter işletici makamı ve gemi arasında vaka özeti ve zaman kritik bilgileri paylaşılır.","learning_en":"When required, a case summary and time-critical information are shared among the coordination centre, helicopter operator and vessel.","exercise_tr":"Örnek hasta durum kartını RCC/MRCC, helikopter birimi ve gemi arasında hangi bilgilerin paylaşılacağına göre düzenleyin.","exercise_en":"Prepare a sample patient-status card for information exchange between RCC/MRCC, aircraft unit and ship.","hazard_tr":"Kimliği veya tıbbi bilgileri doğrulamadan bildirmek; gerçek tehlike çağrısını talim sanmak.","hazard_en":"Reporting unverified identity or medical information, or mistaking an actual distress call for exercise traffic.","id":"B2","source_full_tr":["Gerekli durumlarda koordinasyon merkezi, helikopter işletici makamı ve gemi arasında vaka özeti ve zaman kritik bilgileri paylaşılır. Hastanın bilinci, hareket imkânı, tahmini ağırlığı, tıbbi cihaz bağımlılığı ve bulunulan mahale erişim konuları eğitimde yer alır; sağlık bilgilerinin gerektiği kadar ve yetkili kişiyle paylaşılması gerektiği anlatılır. Mevki, gemi hareketi, rüzgâr, tahliyeye uygun görülen alanın özellikleri ve yakın tehlikeler iletilir. Gemideki bir zabitin helikopter pilotuna uçuş emri vermediği, sahaya ilişkin gemi emniyeti bilgisini sağladığı açıklanır. Görevli gemi personelinin havadaki kurtarma görevlisiyle ortak çalışma çerçevesi netleştirilir."],"source_full_en":["Where necessary, share a case summary and time-critical information between the coordination centre, helicopter operating authority and vessel. Training covers consciousness, mobility, estimated patient weight, dependence on medical devices and access to the patient; medical information must be shared only as needed and with authorised parties. Communicate the position, vessel motion, wind, characteristics of the proposed transfer area and nearby hazards. Explain that a ship's officer supplies vessel-safety information rather than issuing flight orders to the helicopter pilot. Clarify how the assigned vessel team coordinates with the airborne rescue crew."],"source_integrity":"sha256_verified_against_embedded_blocks"},{"step":3,"title_tr":"Güverte ve erişim bölgesi emniyete hazırlanır","title_en":"Prepare and secure transfer area","learning_tr":"Vinç alanının çevresindeki anten, direk, tel, tente, gevşek donanım ve hareketli parçaların etkisi değerlendirilir. Alanı neta etmek yalnız ortadaki birkaç metreyi boşaltmak değildir; vinç donanımının sarkabileceği ve…","learning_en":"Assess antennas, masts, wires, awnings, unsecured equipment and moving objects around the winching zone. Clearing the area includes adjacent spaces within possible hoist and rotor hazard envelopes, not just the centre of the deck. Preserve escape routes, remove non-essential personnel and confirm protective arrangements. CAP 437 provides technical context for obstacle control and marking; actual limits are determined by the approved vessel and helicopter arrangements.","exercise_tr":"Güverte planında antenler, kablolar, tente, gevşek donanım ve vinç halatı hareket alanını işaretleyin.","exercise_en":"Mark antennas, wires, awnings, loose gear and the likely hoist-line envelope on a deck plan.","hazard_tr":"Sadece transfer noktasını boşaltıp çevredeki engel ve düşen yük riskini gözden kaçırmak.","hazard_en":"Clearing only the pickup point while missing nearby obstructions and falling-load hazards.","id":"B3","source_full_tr":["Vinç alanının çevresindeki anten, direk, tel, tente, gevşek donanım ve hareketli parçaların etkisi değerlendirilir. Alanı neta etmek yalnız ortadaki birkaç metreyi boşaltmak değildir; vinç donanımının sarkabileceği ve helikopterin rotor alanıyla etkileşebilecek bitişik bölgeler de incelenir. Uygun personel koruması, yeterli kaçış yolları ve görevli olmayanların uzaklaştırılması anlatılır. CAP 437 Bölüm 10, vinç alanlarında engellerin belirlenmesi ve aydınlatılması için teknik çerçeve sağlar; ölçüler ve işaretleme ihtiyaçları onaylı gemi/helikopter planına göre doğrulanır. Çalışma alanının kapatılması gemide acil kaçış yolunu engellememelidir."],"source_full_en":["Assess antennas, masts, wires, awnings, loose gear and moving parts around the winching area. Clearing the area involves more than freeing a few metres at its centre: consider adjacent zones where suspended winching equipment and the aircraft rotor envelope may create hazards. Explain appropriate protective equipment, sufficient escape routes and exclusion of non-essential personnel. CAP 437, Chapter 10, offers a technical framework for identifying and lighting obstructions in winching areas; dimensions and marking requirements must be checked against the approved vessel and helicopter plan. Closing the working area must not block an emergency escape route aboard the vessel."],"source_integrity":"sha256_verified_against_embedded_blocks"},{"step":4,"title_tr":"Transfer edilecek kişi ve kurtarma malzemesi hazırlanır","title_en":"Prepare patient and recovery equipment","learning_tr":"Hastanın bulunduğu yerden alana transferi sırasında düşme, sert hareket, omurga/uzuv yaralanması ve sedyeden kayma tehlikesi anlatılır.","learning_en":"Risks of falls, sudden movements, spinal or limb injuries and slipping from a stretcher during transfer from the patient's location to the operating area are discussed.","exercise_tr":"Maket sedye/sepet üzerinde hasta hazırlığı, refakatçi ve teslim sorumluluğunu simüle edin; gerçek hasta taşımayın.","exercise_en":"Simulate casualty preparation, escort and handover using a training stretcher or basket without moving a real patient.","hazard_tr":"Yanlış kaldırma donanımı seçimi, omurga/travma riski veya hastanın sabitlenmemesi.","hazard_en":"Inappropriate lifting equipment, spinal/trauma exposure or inadequate casualty restraint.","id":"B4","source_full_tr":["Hastanın bulunduğu yerden alana transferi sırasında düşme, sert hareket, omurga/uzuv yaralanması ve sedyeden kayma tehlikesi anlatılır. Kullanılacak sedye, sepet veya kemer sistemi hava kurtarma ekibi tarafından seçilen ve doğrulanan türde olmalıdır. Isıl koruma, kişisel can yeleği, takılabilir uç parçaları, oksijen/diğer tıbbi sistemler ve helikopter kabiniyle uyumlu donanım açıklanır. Görevli personel hastayı taşırken hem tıbbi durumun hem de transfer alanına yaklaşan rotor akımının yaratacağı tehlikeyi takip eder. Gerçek kişi kaldırma talimi yapılmasa dahi malzemenin yeri, tıbbi bilgilerin iletilmesi ve sorumluluklar öğretilebilir."],"source_full_en":["Explain risks of falling, abrupt movement, spinal or limb injuries and slipping from a stretcher while moving the patient from the original location to the transfer area. The stretcher, basket or harness must be of the type selected and confirmed by the air-rescue team. Discuss thermal protection, personal flotation equipment, items that could snag, oxygen or other medical systems and equipment compatibility with the helicopter cabin. Personnel moving the patient monitor both the clinical condition and the hazard caused by rotor downwash approaching the transfer area. Even without a live lift of a person, training can cover the location of equipment, transfer of medical information and assigned responsibilities."],"source_integrity":"sha256_verified_against_embedded_blocks"},{"step":5,"title_tr":"Vinç halatı ve statik elektrik tehlikesi açıklanır","title_en":"Review hoist cable and static electricity hazards","learning_tr":"Havada asılı helikopterin vinç sistemi statik elektrik biriktirebilir; halat, kanca, sepet veya kurtarma ekipmanı güverteye yaklaşırken personel elektrik boşalmasına maruz kalabilir.","learning_en":"A hovering helicopter's hoist system may accumulate static electricity; personnel can be exposed to a discharge as the cable, hook, basket or rescue equipment approaches the deck.","exercise_tr":"Vinç kancası, statik elektrik ve uçuş ekibinin kumanda yetkisini şema/video üzerinde tartışın.","exercise_en":"Discuss hoist hooks, static electricity and flight-crew control using diagrams or training video.","hazard_tr":"Uçuş ekibinin talimatı olmadan vinç donanımına temas; elektrik boşalması veya halata dolanma.","hazard_en":"Touching hoist gear without aircrew direction, electrical discharge or entanglement.","id":"B5","source_full_tr":["Havada asılı helikopterin vinç sistemi statik elektrik biriktirebilir; halat, kanca, sepet veya kurtarma ekipmanı güverteye yaklaşırken personel elektrik boşalmasına maruz kalabilir. Halatın veya sepetin ne zaman tutulabileceği uçuş ekibinin sistemine ve kumandasına bağlıdır. Eğitimde temas öncesi güvenli boşalma/grounding ihtiyacı, bağlantının gemi yapısına kendiliğinden sabitlenmemesi ve halatın güverte donanımına takılmaması üzerinde durulur. Her hava aracı için tek ve evrensel bir “el ile halatı tutma” tekniği öğretilmez. Halatın personelin etrafına dolanması, salınması ve geminin ani hareketi olasılıkları tartışılır."],"source_full_en":["A hovering helicopter's winch system may accumulate static electricity; personnel may experience a discharge as the cable, hook, basket or rescue equipment approaches the deck. When a cable or basket may be touched depends on the aircraft system and flight-crew instruction. Discuss the need for safe discharge or grounding before contact, avoiding improvised attachment to the ship's structure and preventing entanglement with deck fittings. Do not teach one universal method for grasping a winch cable by hand for all aircraft. Consider entanglement around personnel, pendulum movement and sudden vessel motion."],"source_integrity":"sha256_verified_against_embedded_blocks"},{"step":6,"title_tr":"Temsili alma–verme süreci ve iletişim gösterilir","title_en":"Rehearse transfer and communications","learning_tr":"Saha sorumlusu, köprüüstü ve hava kurtarma ekibi arasındaki görev sırası açıklanır. Güvenli işaret, sağlık personelinin hazır bulunması, hasta teslimi, vinç operatörünün komutunun beklenmesi ve beklenmeyen hareketin bildirilmesi…","learning_en":"Practise the sequence of responsibilities among the deck supervisor, bridge and airborne rescue team: signals, medical readiness, casualty handover, waiting for the hoist operator's instruction and reporting unexpected movement. Discuss abort decisions for unsafe swing, obstruction contact, loss of communication or deterioration of casualty safety. A hoist not physically operated must not be reported as used. Practical exercises require suitable approvals and competent flight personnel.","exercise_tr":"Köprüüstü–saha sorumlusu–hava kurtarma ekibi bilgi akışını rol kartlarıyla canlandırın.","exercise_en":"Rehearse communication among bridge, deck lead and air-rescue team using role cards.","hazard_tr":"Çoklu/çelişkili komutlar veya gerçek helikopter hareketinin eğitim personelince yönlendirilmesi.","hazard_en":"Multiple or conflicting commands, or exercise personnel directing a real aircraft movement.","id":"B6","source_full_tr":["Saha sorumlusu, köprüüstü ve hava kurtarma ekibi arasındaki görev sırası açıklanır. Güvenli işaret, sağlık personelinin hazır bulunması, hasta teslimi, vinç operatörünün komutunun beklenmesi ve beklenmeyen hareketin bildirilmesi örneklenir. İşlemin devamı ile iptali arasındaki karar noktaları çalışılır: uygunsuz salınım, engelle temas riski, iletişim kaybı veya hasta güvenliğinde değişiklik. Fiilen yapılmayan vinç kaldırma, canlandırma sırasında uygulandı gibi sunulmaz. Uygulamalı eğitim yalnız teknik olarak onaylanmış, yetkin hava ekibinin bulunduğu koşullarda değerlendirilir."],"source_full_en":["Explain the coordination sequence between the area supervisor, bridge and airborne rescue crew. Demonstrate safe signals, availability of medical staff, patient handover, waiting for the winch operator's command and reporting unexpected movement. Practise decision points for continuation or cancellation: unsafe swinging, risk of contact with an obstacle, communication failure or deterioration in patient safety. A winch lift that did not occur must not be described as performed during a simulation. Practical training must be limited to operations technically authorised and staffed by a competent flight crew."],"source_integrity":"sha256_verified_against_embedded_blocks"},{"step":7,"title_tr":"Acil durum varyantlarıyla karar eğitimi yapılır","title_en":"Test contingency decisions by scenario","learning_tr":"Ani kötüleşen hava, helikopterin yakıt/operasyon sınırı, vinç takılması, sedye hareketinin kontrol edilememesi, güvertede görevlinin düşmesi, hastanın durumunun değişmesi veya helikopterin denize zorunlu inişi senaryoları ayrı…","learning_en":"Separate scenarios address rapidly deteriorating weather, aircraft fuel or operational limits, hoist snagging, uncontrolled stretcher movement, a deck-team member falling, a patient's condition worsening and helicopter ditching.","exercise_tr":"Örnek vinç takılması, kötüleşen hava ve hastanın durumunun değişmesi kartlarında iptal/yeniden değerlendirme ölçütlerini ele alın.","exercise_en":"Use jammed-hoist, worsening-weather and changing-patient-condition cards to discuss abort/reassessment triggers.","hazard_tr":"Güvensiz vinç hareketinde operasyonu sürdürme veya hastanın klinik durumunu göz ardı etme.","hazard_en":"Continuing an unsafe hoist or ignoring deterioration in casualty condition.","id":"B7","source_full_tr":["Ani kötüleşen hava, helikopterin yakıt/operasyon sınırı, vinç takılması, sedye hareketinin kontrol edilememesi, güvertede görevlinin düşmesi, hastanın durumunun değişmesi veya helikopterin denize zorunlu inişi senaryoları ayrı ayrı ele alınır. Uçuş ekibi ile gemi arasında güvenli kesme/geri çekilme kararının iletilmesi ve yeni çözümün aranması anlatılır. İşlem iptal olduğunda alternatif tıbbi yardım, kıyı koordinasyonu ve hastanın gemide bakım sürekliliği planlanır. Bu aşamada IAMSAR'ın ilgili SAR/helikopter konu başlıklarıyla önceki MOB ve kurtarma botu eğitimleri ilişkilendirilir."],"source_full_en":["Review worsening weather and sea conditions, limits of visibility or vessel motion, winch malfunction, a person falling from the deck, medical deterioration and a helicopter ditching scenario. Identify who stops the activity, which communication channel is used, and alternatives for medical evacuation or rescue. Link search and rescue coordination to the applicable IAMSAR guidance. Do not treat a shipboard exercise as authority to direct an aircraft's flight or winch operation."],"source_integrity":"sha256_verified_against_embedded_blocks"},{"step":8,"title_tr":"Teslim, kayıt ve debriefing tamamlanır","title_en":"Complete handover and debrief","learning_tr":"Tıbbi tahliyenin tamamlanması durumunda hasta teslim noktası, teslimi alan kişi/kurum, saat, kullanılan yöntem, varsa gecikme veya olaylar ve gemide kalan tıbbi/donanım yükümlülükleri değerlendirilir.","learning_en":"Where medical evacuation has actually taken place, the handover location, receiving person or organisation, time, method, any delays or incidents, and residual medical or equipment obligations aboard are reviewed.","exercise_tr":"Örnek teslim tutanağında fiilî tahliye ile masa başı gösterimini ayrı işaretleyin; alan/donanım emniyet kontrolünü hatırlatın.","exercise_en":"Mark actual transfer separately from tabletop demonstration on a sample handover record and review equipment checks.","hazard_tr":"Hiç gerçekleşmemiş helikopter tahliyesinin resmî kayda fiilî işlem gibi geçirilmesi.","hazard_en":"Entering an unperformed helicopter evacuation in an official record as a real operation.","id":"B8","source_full_tr":["Tıbbi tahliyenin tamamlanması durumunda hasta teslim noktası, teslimi alan kişi/kurum, saat, kullanılan yöntem, varsa gecikme veya olaylar ve gemide kalan tıbbi/donanım yükümlülükleri değerlendirilir. Temsili talimde bunlar örnek rapor başlıkları olarak gösterilir; gerçek hasta transferi gerçekleşmediği açıkça belirtilir. EYS.07.125.FR, uygun risk değerlendirmesi, jurnal, gerekiyorsa SAR kayıtları ve EK-V'nin kullanım koşulları anlatılır. Personelin bir sonraki operasyonda geliştirmesi gereken haberleşme, alan hazırlığı ve donanım bilgisi debriefing notlarında belirlenir."],"source_full_en":["At closeout explain patient handover, confirmation of receipt, debriefing, identification of deficiencies and the relationship between EYS.07.125.FR, risk assessment, vessel log and applicable SAR or medical reports. Clearly separate demonstrated preparations and simulated transfers from actual helicopter movements and patient evacuation. Any deficiencies affecting further operations must be referred to authorised personnel before the area or equipment is used again."],"source_integrity":"sha256_verified_against_embedded_blocks"}]},{"key":"helicopter/helideck_emergency","family":"helicopter","flow":"helideck_emergency","title_tr":"Helikopter Sahası Acil Durumu","title_en":"Helideck Emergency","family_title_tr":"Helikopter / Gemi Operasyonları","family_title_en":"Helicopter / Ship Operations","stages":[{"step":1,"title_tr":"Olay ve mahal bilgisi doğrulanır","title_en":"Confirm incident and scene","learning_tr":"Eğitimde helikopterin yaklaşması, inişi veya gemi üzerinde bulunduğu sırada duman, alev, darbe, yakıt sızıntısı ya da sert iniş işareti görülmesi örneklenir.","learning_en":"Training covers possible observations of smoke, flame, impact, fuel leakage or hard landing while a helicopter is approaching, landing or on deck.","exercise_tr":"Maket üzerinde duman, sert iniş, yakıt sızıntısı ve yaralı bilgilerini ayrı olay kartlarında eşleştirin.","exercise_en":"Match smoke, hard-landing, fuel-leak and casualty information on separate model incident cards.","hazard_tr":"Olayın tipini doğrulamadan sahaya personel sevki veya rotor alanına kontrolsüz yaklaşım.","hazard_en":"Dispatching personnel before assessing the event or uncontrolled approach to a rotor area.","id":"C1","source_full_tr":["Eğitimde helikopterin yaklaşması, inişi veya gemi üzerinde bulunduğu sırada duman, alev, darbe, yakıt sızıntısı ya da sert iniş işareti görülmesi örneklenir. İlk gözleyen kişinin olayı sorumlu zabite ve köprüüstüne bildirmesi, olayın yeri, görünür işaretleri ve yakın personel hakkında güvenilir bilgi aktarılması öğretilir. Motor bölgesinden duman çıkması, yakıt sızıntısı, gövde altında alev, yaralı yolcu ve kuyruk rotor hasarı aynı yangın türü olarak değerlendirilmez. İlk ihbarın amacı kesin uçak teşhisi yapmak değil, güvenli müdahale ve komuta organizasyonunu başlatmaktır."],"source_full_en":["Distinguish initial signs such as smoke, open fire, a hard landing, collision, fuel leak and an aircraft component striking the deck. Describe what an observer should report: location, observed condition, persons affected, visible fuel or fire and immediate hazards, without claiming an unconfirmed aircraft diagnosis. A rotor strike, fuel spill and cabin fire do not automatically require the same response sequence. The purpose of the first report is to initiate safe response and command, not to identify the exact aircraft fault."],"source_integrity":"sha256_verified_against_embedded_blocks"},{"step":2,"title_tr":"Alarm ve acil durum organizasyonu açıklanır","title_en":"Activate alarms and emergency organization","learning_tr":"Kaptanın durumu değerlendirmesiyle olayın seviyesine uygun alarm, anons, ekip toplama ve dış haberleşme düzeni incelenir.","learning_en":"Following the master's assessment, the alarm, announcement, team muster and external communications appropriate to the severity of the event are reviewed.","exercise_tr":"Kaptan, saha sorumlusu, yangın, kurtarma ve ilk yardım görevlerini olay seviyesi kartlarıyla ilişkilendirin.","exercise_en":"Link the master, area lead, fire party, rescue team and first aid to graduated incident cards.","hazard_tr":"Yanlış alarmın veya gecikmiş ekip çağrısının müdahale düzenini bozması.","hazard_en":"Incorrect alarms or delayed team mobilisation disrupting the response.","id":"C2","source_full_tr":["Kaptanın durumu değerlendirmesiyle olayın seviyesine uygun alarm, anons, ekip toplama ve dış haberleşme düzeni incelenir. Yangın ekibi, kurtarma ekibi, ilk yardımcılar, alan gözcüsü, köprüüstü ve makine vardiyasının görevleri ayrıştırılır. Personel sayımı ve olay mahallinde bulunabilecek uçuş personeli/yolcu bilgisi ayrıca değerlendirilir. HLO/sorumlu zabit, helikopter pilotundan alınabilen güvenilir teknik bilgiyi komuta zincirine iletir. Kontrolsüz personel yaklaşmasını önleyen emniyet çevresi oluşturulması ve geminin diğer bölümlerindeki risklerin izlenmesi vurgulanır. Talim anonsunda gerçek olayla karışma ihtimali yönetilir."],"source_full_en":["Following the master's assessment, examine alarms, announcements, team mobilisation and external communications appropriate to the incident's severity. Distinguish the duties of the fire team, rescue team, first aiders, area lookouts, bridge and engine-room watch. Separately assess headcount and information about flight crew and passengers who may be at the site. The HLO or responsible officer relays reliable technical information from the pilot through the chain of command. Stress a controlled safety perimeter and monitoring of threats elsewhere aboard the vessel. Ensure a drill announcement cannot readily be mistaken for an actual emergency."],"source_integrity":"sh
