departure/emergency_departure","family":"departure","flow":"emergency_departure","title_tr":"Acil Kalkış","title_en":"Emergency Departure","family_title_tr":"Acil Kalkış / İskeleden Uzaklaşma","family_title_en":"Emergency Departure / Leaving a Berth","stages":[{"step":1,"title_tr":"Acil ihbar, olay bilgisi ve kaptana bildirim","title_en":"Receive emergency call and notify master","learning_tr":"Kurgusal acil görev çağrısının kaynağı, alındığı saat ve görev tipi değerlendirilir. İlk ihbarın doğruluğu, koordinatlar, kazazede sayısı, yangın/kirlilik/teknik yardım ihtiyacı, olayın ciddiyeti ve mevcut belirsizlikler…","learning_en":"Identify the source, receipt time and nature of an assumed emergency tasking. Evaluate the reliability of the first report, coordinates, casualty count, possible fire, pollution or technical support requirements, seriousness and outstanding uncertainty. Even if the vessel is ready, correct understanding and transmission to the master come first. The instructor adds new information to test how the team revises its plan and verifies conflicting positions with the coordinator.","exercise_tr":"Tutarsız iki koordinat içeren kurgusal görev çağrısını verin; personelden alındı teyidi ve kaptana özet bildirim isteyin.","exercise_en":"Present a fictional tasking message with conflicting coordinates; require read-back and a concise report to the master.","hazard_tr":"Doğrulanmamış ihbara dayanarak yanlış görev/mevki kararı verilmesi.","hazard_en":"Acting on an unverified request or incorrect position.","id":"01-departure","source_full_tr":["Kurgusal acil görev çağrısının kaynağı, alındığı saat ve görev tipi değerlendirilir. İlk ihbarın doğruluğu, koordinatlar, kazazede sayısı, yangın/kirlilik/teknik yardım ihtiyacı, olayın ciddiyeti ve mevcut belirsizlikler belirlenir. Gemi hazır durumda olsa bile ihbarın anlaşılması ve kaptana aktarılması ilk basamaktır. Talim sorumlusu, birinci ihbarın ardından yeni bilgiler vererek ekibin planını nasıl güncellediğini sınar. Gerektiğinde koordinasyon birimiyle geri bildirim usulü öğretilir.","Eğitim sorusu: “Bir yardım çağrısı birbiriyle tutarsız iki mevki içeriyorsa nasıl hareket edilir?”\nOrtak kartlar: PORT-C01, PORT-C02, PORT-C13."],"source_full_en":["Assess the source, receipt time and type of a hypothetical emergency tasking. Establish the reliability of the initial report, coordinates, number of casualties, need for fire, pollution or technical assistance, incident severity and remaining uncertainties. Even if the ship is ready, understanding the report and passing it to the master is the first step. The instructor provides updated information after the initial call to test how the team revises its plan. Teach feedback to the coordination unit when required.","Training question: 'What action is taken if an assistance request provides two mutually inconsistent positions?' Related cards: PORT-C01, PORT-C02, PORT-C13."],"source_integrity":"sha256_verified_against_embedded_blocks"},{"step":2,"title_tr":"Kaptanın görev kararı ve risklerin belirlenmesi","title_en":"Make command decision and assess risks","learning_tr":"Görevin türüne uygun ekipman/personel, mevcut liman durumu, hava/deniz, yakıt, geminin teknik hazırlığı, kısıtlı manevra alanı ve personelin hazır bulunması değerlendirilir.","learning_en":"Equipment and crew appropriate to the task, current port conditions, weather and sea state, fuel, technical readiness, restricted manoeuvring space and crew availability are assessed.","exercise_tr":"Görev tipi, personel, yakıt, hava/deniz ve liman koşulları için kaptan başkanlığında hazırlık karar tablosu oluşturun.","exercise_en":"Build a master-led readiness decision matrix covering mission type, personnel, fuel, weather and harbour conditions.","hazard_tr":"Göreve yetişme baskısıyla geminin hazırlık sınırlarının atlanması.","hazard_en":"Skipping vessel-readiness limits under time pressure.","id":"02-departure","source_full_tr":["Görevin türüne uygun ekipman/personel, mevcut liman durumu, hava/deniz, yakıt, geminin teknik hazırlığı, kısıtlı manevra alanı ve personelin hazır bulunması değerlendirilir. Kaptanın görev organizasyonu, köprüüstü, makine ve güverte sorumlularına net biçimde aktarılır. Göreve ulaşmak için hızlı hareket edilmesi gereken durumlarda hangi hazırlıkların öncelikli yapılacağı, hangilerinin vazgeçilmez emniyet şartı olduğu tartışılır. Talimde gerçek sefer yapılacaksa liman, personel ve geçerli izin gereksinimleri tamamlanır.","Eğitim sorusu: “Yetersiz makine veya dümen hazırlığına rağmen göreve çıkış kararı verilebilir mi?”\nOrtak kartlar: PORT-C02, PORT-C04, PORT-C14."],"source_full_en":["Review task-specific equipment and personnel, port conditions, weather and sea state, fuel, technical readiness, restricted manoeuvring areas and availability of personnel. The master's organisation of the task is communicated unambiguously to bridge, engine and deck supervisors. Where a prompt departure is necessary, discuss which preparations may be prioritised and which remain non-negotiable safety prerequisites. Actual sailing as part of an exercise requires appropriate port, personnel and valid permissions.","Training question: 'Can the ship be committed to a task despite inadequate machinery or steering readiness?' Related cards: PORT-C02, PORT-C04, PORT-C14."],"source_integrity":"sha256_verified_against_embedded_blocks"},{"step":3,"title_tr":"Alarm, personel toplanması ve posta teşkili","title_en":"Muster assigned personnel","learning_tr":"Talimin niteliğine uygun anons yapılır. Personel belirlenen görev yerlerine yönelir; gemide bulunmayan kişi, ziyaretçi, geçici görevli ve kıyı bağlantıları ayrıca kontrol edilir.","learning_en":"An announcement appropriate to the drill is made. Crew members proceed to their assigned stations; absent crew, visitors, temporary workers and shore connections are checked separately.","exercise_tr":"Role kartlarıyla baş/kıç posta yoklamasını ve ziyaretçi–kıyı personeli kontrolünü masa başında canlandırın.","exercise_en":"Rehearse head/stern station muster and visitor/shore-personnel checks using role cards.","hazard_tr":"Eksik personel veya gemide unutulmuş ziyaretçi nedeniyle emniyetsiz hareket.","hazard_en":"Unsafe departure with missing personnel or unaccounted visitors.","id":"03-departure","source_full_tr":["Talimin niteliğine uygun anons yapılır. Personel belirlenen görev yerlerine yönelir; gemide bulunmayan kişi, ziyaretçi, geçici görevli ve kıyı bağlantıları ayrıca kontrol edilir. Baş/kıç postalarındaki personel sayısı ile her postanın sorumlusu belirlenir. Makine ve güverte ekipleri uygun kişisel koruyucu donanım ve haberleşme araçları bakımından değerlendirilir. Liman sahasında görevli olmayan kişiler manevra alanına alınmaz.","Eğitim sorusu: “İzinli personel halen karada bulunuyorsa görev ve hareket kararı nasıl yeniden değerlendirilir?”\nOrtak kartlar: PORT-C03, PORT-C06, PORT-C13."],"source_full_en":["Make an announcement appropriate to the exercise. Personnel go to assigned stations; people absent from the vessel, visitors, temporary workers and shore connections are checked separately. Identify headcounts and responsible persons at forward and aft mooring stations. Assess the deck and engine teams for suitable personal protective and communication equipment. Keep unauthorised persons outside the manoeuvring area in port.","Training question: 'How should the tasking and departure decision be reconsidered if a crew member on leave is still ashore?' Related cards: PORT-C03, PORT-C06, PORT-C13."],"source_integrity":"sha256_verified_against_embedded_blocks"},{"step":4,"title_tr":"Köprüüstü seyre hazırlığı ve liman koordinasyonu","title_en":"Prepare bridge and coordinate with port","learning_tr":"Gemiye uygun kalkış öncesi seyir kontrol konuları hatırlanır: harita/rota, rıhtım yaklaşımı, akıntı, meteoroloji, gemi trafiği, seyir cihazları, dümen, haberleşme ve gerekli liman bildirimi.","learning_en":"The vessel's relevant pre-departure navigational checks are reviewed: charts and route, berth approaches, currents, weather, marine traffic, navigational equipment, steering, communications and required port notifications.","exercise_tr":"Kalkış öncesi köprüüstü kontrol çizelgesinde rota, dümen, cihazlar, trafik ve liman bildirimlerini örnek olayla eşleştirin.","exercise_en":"Use a sample bridge departure checklist to relate route, steering, equipment, traffic and port notifications.","hazard_tr":"Rota, dümen durumu veya liman izni teyidi olmadan hareket varsayılması.","hazard_en":"Assuming departure can proceed without route, steering or port-clearance confirmation.","id":"04-departure","source_full_tr":["Gemiye uygun kalkış öncesi seyir kontrol konuları hatırlanır: harita/rota, rıhtım yaklaşımı, akıntı, meteoroloji, gemi trafiği, seyir cihazları, dümen, haberleşme ve gerekli liman bildirimi. Talim, seçilen görev senaryosunun seyir planlaması üzerindeki etkilerini sınar. Liman başkanlığı, VTS, kılavuzluk ve römorkör gereklilikleri genel bir muafiyet varsayılmadan değerlendirilir. Çıkış rotasına ilişkin risk ve kısıtlamalar kaptana rapor edilir.","Eğitim sorusu: “Acil yardım görevinde liman dışına çıkmadan önce hangi navigasyon bilgileri vazgeçilmezdir?”\nOrtak kartlar: PORT-C04, PORT-C09, PORT-C12."],"source_full_en":["Review vessel-specific pre-departure navigation checks: chart and route, berth approach, current, weather, traffic, navigational devices, steering, communications and port notification. The drill tests how the selected tasking scenario affects voyage planning. Consider harbourmaster, VTS, pilotage and tug requirements without assuming any general exemption. Report departure-route risks and restrictions to the master.","Training question: 'Which navigational information is essential before leaving port for an urgent assistance task?' Related cards: PORT-C04, PORT-C09, PORT-C12."],"source_integrity":"sha256_verified_against_embedded_blocks"},{"step":5,"title_tr":"Makine, sevk, dümen ve yardımcı sistemlerin hazırlanması","title_en":"Prepare propulsion, steering and support systems","learning_tr":"Köprüüstü–makine arasında hazırlık emri ve hazır bildirimi pratik edilir. Ana sevk sistemi, güç üretimi, hidrolik/dümen, manevra kumandaları ve kritik alarm durumları konuşulur.","learning_en":"Preparation orders and readiness reports are practised between bridge and engine control. Main propulsion, electrical generation, hydraulic/steering arrangements, manoeuvring controls and critical alarm conditions are reviewed.","exercise_tr":"Makine hazır bildirimi ve köprüüstü teyidini konuşma kartlarıyla canlandırın; gerçek makina start/stop işlemi talim gereği yapılmasın.","exercise_en":"Rehearse engine-room readiness reports and bridge acknowledgements using scripted exchanges; do not start or stop machinery merely for the drill.","hazard_tr":"Sevk veya elektrik sisteminin fiilî durumunun sözlü varsayımla karıştırılması.","hazard_en":"Confusing assumed machinery availability with its actual operating state.","id":"05-departure","source_full_tr":["Köprüüstü–makine arasında hazırlık emri ve hazır bildirimi pratik edilir. Ana sevk sistemi, güç üretimi, hidrolik/dümen, manevra kumandaları ve kritik alarm durumları konuşulur. Çalışan/çalışmaya hazır/yedekte ayrımı yapılır; makine ekibinden gelen sınırlamalar ve süre bilgileri kaptana iletilir. Gerekirse güç kaybı veya dümen problemi gelişmesi, senaryoya kontrollü bir yan olay olarak eklenir. Gerçek makine çalıştırma ve sevk uygulamaları yalnız ilgili izin ve emniyet koşulları sağlandığında yapılır.","Eğitim sorusu: “Baş ve kıç halatları emniyete alınmadan sevk gücü uygulanırsa hangi tehlike doğar?”\nOrtak kartlar: PORT-C05, PORT-C07, PORT-C14; bağlı aile: POWER_PROPULSION_COMMON, STEERING_COMMON."],"source_full_en":["Practise readiness orders and acknowledgements between the bridge and engine room. Discuss main propulsion, power generation, hydraulic and steering systems, manoeuvring controls and critical alarms. Distinguish equipment currently running, ready to start and on standby; communicate engineering restrictions and time requirements to the master. If useful, add controlled loss-of-power or steering-fault developments to the scenario. Actual machinery starting and propulsion operations occur only with relevant permissions and safety conditions.","Training question: 'What danger arises if propulsion power is applied before the forward and aft mooring arrangements are safely secured?' Related cards: PORT-C05, PORT-C07, PORT-C14. Related families: POWER_PROPULSION_COMMON and STEERING_COMMON."],"source_integrity":"sha256_verified_against_embedded_blocks"},{"step":6,"title_tr":"Güverte, kıyı bağlantıları ve halat postalarının hazırlanması","title_en":"Prepare deck, shore connections and moorings","learning_tr":"Baş/kıç postaları halatların tipi, yerleşimi ve gerilmesini gözden geçirir; ırgat, loça, babalar, personel yerleşimi ve haberleşme değerlendirilir.","learning_en":"The forward and aft mooring parties review line types, layout and tension, and assess winches, fairleads, bollards, personnel positioning and communications.","exercise_tr":"Palamar planında baş/kıç halatlarını, gangway ve kıyı besleme bağlantılarını işaretleyin; tehlikeli halat bölgesini gösterin.","exercise_en":"Mark head/stern lines, gangway and shore-service connections on the mooring plan; identify rope snap-back hazards.","hazard_tr":"Gergin halatın geri tepmesi veya bağlı kara hizmetinin unutulması.","hazard_en":"Rope snap-back or overlooked shore-service connections.","id":"06-departure","source_full_tr":["Baş/kıç postaları halatların tipi, yerleşimi ve gerilmesini gözden geçirir; ırgat, loça, babalar, personel yerleşimi ve haberleşme değerlendirilir. Gangway ve geminin varsa kıyıdan aldığı enerji, yakıt, su ve hizmet bağlantılarının durumu öğrenilir. Talim için fiilen halat alınmayacaksa doğru kumanda ve teyit zinciri güvenli simülasyonla öğretilir. Gerçek avara gerçekleştirilecekse kaptanın manevra planı, liman koordinasyonu ve uygun deniz/hava koşulları belirleyicidir.","Eğitim sorusu: “Bir halatın kasası koptuğunda geri tepme bölgesi neresi olabilir?”\nOrtak kartlar: PORT-C06, PORT-C07, PORT-C08."],"source_full_en":["Forward and aft stations review the types, layout and tension of mooring lines; winches, fairleads, bollards, personnel positions and communications are assessed. Review the gangway and any shore-supplied power, fuel, water or service connections. If no lines will actually be released for the exercise, rehearse the correct command and confirmation chain by safe simulation. An actual unmooring manoeuvre depends on the master's manoeuvring plan, port coordination and suitable sea and weather conditions.","Training question: 'Where might the snap-back zone be if a mooring-line eye parts?' Related cards: PORT-C06, PORT-C07, PORT-C08."],"source_integrity":"sha256_verified_against_embedded_blocks"},{"step":7,"title_tr":"Avara kararı, limandan çıkış ve görev mahalline seyir","title_en":"Review departure and transit decision","learning_tr":"Kaptan, gerekli personel ve ekipman hazırlığının tamamlandığını teyit eder. Avara komutunun verildiği, postaların hangi sıra ve teyitle işlem yapacağı, manevra sahası emniyeti ve varsa römorkör/kılavuz koordinasyonu…","learning_en":"The master confirms that crew and equipment preparations are complete. Review the order to let go, mooring-station sequence and read-backs, safe manoeuvring space and any tug or pilot coordination. If the vessel remains alongside, test the orders, acknowledgements and communications on a plan or simulator rather than treating departure as performed. Link subsequent SAR, firefighting, pollution or towing preparation to the appropriate dedicated drill topic.","exercise_tr":"Avara emirlerini ve posta teyitlerini maket/masa başı senaryoda sıralayın; gerçek halat çözme yapılmadıysa kayda açıkça belirtin.","exercise_en":"Sequence letting-go orders and station confirmations in a tabletop exercise; explicitly record if no lines were released.","hazard_tr":"Gerçek manevrayı, römorkör/kılavuz koordinasyonunu veya liman iznini simülasyondan ayıramama.","hazard_en":"Confusing simulated unmooring with actual pilot/tug coordination or port authorisation.","id":"07-departure","source_full_tr":["Kaptan, gerekli personel ve ekipman hazırlığının tamamlandığını teyit eder. Avara komutunun verildiği, postaların hangi sıra ve teyitle işlem yapacağı, manevra sahası emniyeti ve varsa römorkör/kılavuz koordinasyonu değerlendirilir. Gerçek ayrılış yapılmadığında personelin emir–teyit–rapor zinciri, grafik/plan ve telsiz simülasyonuyla sınanır. Görev alanına ilişkin daha ayrıntılı SAR, yangın, kirlilik veya çekme operasyonu hazırlıkları ilgili ayrı talim ailesine bağlanır; aynı metin tekrar yazılmaz.","Eğitim sorusu: “Avara işlemi tamamlandığı halde görev mahalline henüz intikal edilmemişse kayıt nasıl yazılır?”\nOrtak kartlar: PORT-C07, PORT-C09, PORT-C13, PORT-C14."],"source_full_en":["The master confirms that required personnel and equipment preparations are complete. Review the unmooring order, sequence of actions and confirmations at each station, manoeuvring-area safety and any tug or pilot coordination. Where no actual departure takes place, test the order–confirmation–reporting chain using diagrams, plans and radio simulation. Detailed SAR, fire, pollution or towing preparations are linked to the relevant separate drill family rather than repeating the same content here.","Training question: 'How should the report read if unmooring was completed but transit to the task area did not take place?' Related cards: PORT-C07, PORT-C09, PORT-C13, PORT-C14."],"source_integrity":"sha256_verified_against_embedded_blocks"},{"step":8,"title_tr":"Hazırlığın değerlendirilmesi ve talimin kapatılması","title_en":"Evaluate preparedness and close drill","learning_tr":"Ekipler hazırlık süresi, haberleşme, görev paylaşımı, saptanan eksiklikler, liman yetkilileriyle koordinasyon ve fiilen yapılan/simüle edilen işlemleri değerlendirir.","learning_en":"The teams evaluate preparation time, communications, division of duties, deficiencies identified, coordination with port authorities and the distinction between performed and simulated operations.","exercise_tr":"Hazırlık süresi, iletişim aksaklığı ve simüle edilen işlemleri değerlendirme formunda ayrı alanlara yazdırın.","exercise_en":"Record readiness time, communication issues and simulated steps in separate debrief fields.","hazard_tr":"Gerçek görev çağrısı yokken jurnal veya olay raporuna fiilî kalkış işlenmesi.","hazard_en":"Logging an actual sailing or tasking when only a drill took place.","id":"08-departure","source_full_tr":["Ekipler hazırlık süresi, haberleşme, görev paylaşımı, saptanan eksiklikler, liman yetkilileriyle koordinasyon ve fiilen yapılan/simüle edilen işlemleri değerlendirir. Gerçek görev çağrısı yoksa simülasyon sona erdirilir ve gemi önceki emniyetli durumuna döndürülür. Talim raporu, EK-V, güverte ve makine jurnalleriyle bağlantılı bilgi başlıkları hatırlanır. Acil kalkışın yalnız bilgi/komut bölümünün çalışılması, fiilî avara veya görev seyri yapıldığı anlamına gelmez.","Eğitim sorusu: “Talimde makine hazırlığı yapılabildi, fakat gerçek halat manevrası yapılmadıysa sonuç nasıl anlatılır?”\nOrtak kartlar: PORT-C15, PORT-C16."],"source_full_en":["Teams assess preparation time, communications, task allocation, identified deficiencies, port-authority coordination and activities actually performed or simulated. If no genuine tasking has occurred, end the simulation and return the vessel to its previous safe condition. Review information needed for the drill account, EK-V and deck or engine logs. Exercising only the reporting and command phase of an emergency departure does not mean that unmooring or passage to the task site took place.","Training question: 'How should the outcome be described if machinery preparation was demonstrated but no real mooring-line manoeuvre was made?' Related cards: PORT-C15, PORT-C16."],"source_integrity":"sha256_verified_against_embedded_blocks"}]},{"key":"departure/break_away_from_jetty","family":"departure","flow":"break_away_from_jetty","title_tr":"İskeleden Acil Uzaklaşma","title_en":"Emergency Departure from Berth","family_title_tr":"Acil Kalkış / İskeleden Uzaklaşma","family_title_en":"Emergency Departure / Leaving a Berth","stages":[{"step":1,"title_tr":"Rıhtım tehdidinin tanınması, ilk haber ve kaptan değerlendirmesi","title_en":"Identify berth threat and notify master","learning_tr":"Tehlikenin geminin kendi üzerinde, iskelede, komşu gemide veya yakındaki tesiste başladığı belirlenir. Yangın/alev, patlama ihtimali, zehirli duman, sıvı sızıntısı, sert hava, güvenlik tehdidi ve halat kopması farklı müdahale…","learning_en":"The team identifies whether the threat originated on board, at the berth, on a neighbouring vessel or at an adjacent facility.","exercise_tr":"Rıhtım yangını, zehirli duman, halat kopması ve tesis sızıntısı kartlarını ayrı tehditler olarak sınıflandırın.","exercise_en":"Classify berth fire, toxic smoke, parted mooring line and terminal spill as distinct threats using scenario cards.","hazard_tr":"Tek bir acil uzaklaşma yönteminin bütün olaylara uygun varsayılması.","hazard_en":"Assuming one emergency departure method suits every berth incident.","id":"01-departure","source_full_tr":["Tehlikenin geminin kendi üzerinde, iskelede, komşu gemide veya yakındaki tesiste başladığı belirlenir. Yangın/alev, patlama ihtimali, zehirli duman, sıvı sızıntısı, sert hava, güvenlik tehdidi ve halat kopması farklı müdahale gerekçeleridir. Tehdit ilk gözlemle sınıflandırılır; kaptana, gemi içi ekiplere ve kıyıdaki ilgili personele zamanında bilgi aktarılır. Talimde “hemen halat çöz” sonucu önceden verilmez; kalma, korunma ve ayrılma seçenekleri değerlendirilir.","Ortak kartlar: PORT-C02, PORT-C10, PORT-C13."],"source_full_en":["Determine whether the initial danger is on board, on the quay, on a neighbouring ship or at an adjacent installation. Fire or flames, risk of explosion, toxic smoke, liquid leakage, severe weather, security threats and parted moorings are different reasons to consider intervention. Classify the threat from first observations and report promptly to the master, onboard teams and relevant shore personnel. The exercise does not predetermine 'release lines immediately'; remaining alongside, protection and moving away are assessed as alternatives.","Related cards: PORT-C02, PORT-C10, PORT-C13."],"source_integrity":"sha256_verified_against_embedded_blocks"},{"step":2,"title_tr":"Gemi–kıyı acil durum yönetimi ve haberleşme","title_en":"Coordinate ship and shore emergency response","learning_tr":"Kaptan, iskele/terminal sorumlusu, liman başkanlığı veya trafik birimi, kılavuzluk/römorkör birimleri ve gerekirse itfaiye/diğer müdahale ekipleri arasındaki irtibat kanalları belirlenir.","learning_en":"Communication channels are identified between the master, berth or terminal operator, harbour master or traffic service, pilotage and tug units and, where needed, firefighters or other responders.","exercise_tr":"Terminal, liman otoritesi, VTS, römorkör ve gemi irtibat hatlarını varsayımsal haberleşme şemasında gösterin.","exercise_en":"Map terminal, port authority, VTS, tugs and ship contacts on a simulated communications diagram.","hazard_tr":"Kıyı-gemi emirlerinin çelişmesi veya dış makamlara sahte acil çağrı yapılması.","hazard_en":"Conflicting shore–ship instructions or transmitting a false live emergency call.","id":"02-departure","source_full_tr":["Kaptan, iskele/terminal sorumlusu, liman başkanlığı veya trafik birimi, kılavuzluk/römorkör birimleri ve gerekirse itfaiye/diğer müdahale ekipleri arasındaki irtibat kanalları belirlenir. Haberleşme, gerçek olayın ne olduğu, geminin manevra kabiliyeti ve uzaklaşma amacı temelinde yürütülür. Bir kıyı yangınında liman müdahalesine engel olmamak ve personel tahliyesini tehlikeye atmamak kararın parçasıdır. Emniyetli çıkış için gereken yardımın ne zaman geleceği, bilinmeyen bir bilgi ise tahmin diye işaretlenir.","Ortak kartlar: PORT-C09, PORT-C10, PORT-C13."],"source_full_en":["Identify communication channels among the master, berth or terminal supervisor, harbourmaster or traffic service, pilot or tug teams and, if needed, firefighters or other responders. Communications reflect the actual nature of the incident, vessel manoeuvring capability and purpose of moving away. During a shore fire, avoiding obstruction of port response and preventing danger to people evacuating ashore are part of the decision. Unknown arrival times for necessary assistance are identified as estimates rather than confirmed facts.","Related cards: PORT-C09, PORT-C10, PORT-C13."],"source_integrity":"sha256_verified_against_embedded_blocks"},{"step":3,"title_tr":"Operasyonların durdurulması ve kara bağlantılarının ayrılması","title_en":"Suspend operations and handle shore connections","learning_tr":"Geminin o anda yürüttüğü işler belirlenir: yakıt, sintine, atık teslimi, su/elektrik bağlantısı, malzeme/personel geçişi, bakım veya yanaşık operasyon.","learning_en":"Current shipboard activities are identified, including bunkering, bilge or waste reception, water or electrical shore supplies, movement of stores or personnel, maintenance and berth-side operations.","exercise_tr":"Yakıt/su/enerji bağlantısı ve gangway durumunu bağlantı kontrol listesinde örnekleyin; gerçek sistemleri talim için ayırmayın.","exercise_en":"Review fuel, water, power and gangway connections on a checklist without disconnecting live systems for the drill.","hazard_tr":"Canlı transfer hattının veya gerilimli kıyı elektriğinin emniyetsiz ayrılması.","hazard_en":"Unsafe disconnection of an active transfer line or energised shore power.","id":"03-departure","source_full_tr":["Geminin o anda yürüttüğü işler belirlenir: yakıt, sintine, atık teslimi, su/elektrik bağlantısı, malzeme/personel geçişi, bakım veya yanaşık operasyon. Ayrılmadan önce gerçek bağlılık durumunun gemide ve sahilde karşılıklı teyidi esas alınır. Yakıt hortumu/yükleme kolu varsa basınç ve izolasyon onaylı usulle emniyete alınır; kıyı personeli, hortum ve gangway hâlâ bağlıyken istemsiz gemi hareketinin ciddi sonuçları anlatılır. Elektrik kabloları veya transfer bağlantıları talimde fiilen ayrılacaksa ayrıca izin gerekir.","Ortak kartlar: PORT-C08, PORT-C12, PORT-C14."],"source_full_en":["Identify current shipboard operations: bunkering, bilge or waste transfer, shore power and water connections, stores or personnel access, maintenance or other alongside work. Before moving, mutually confirm actual ship–shore connections on both sides. Where a fuel hose or loading arm is fitted, pressure and isolation are made safe under the approved procedure; explain the serious consequences of unintended ship movement while shore personnel, hoses or the gangway remain connected. Disconnecting electrical cables or transfer connections physically during a drill requires separate permission.","Related cards: PORT-C08, PORT-C12, PORT-C14."],"source_integrity":"sha256_verified_against_embedded_blocks"},{"step":4,"title_tr":"Personel, yangın/kurtarma donanımı ve seyir hazırlığı","title_en":"Muster crew and prepare navigational systems","learning_tr":"Gemi üzerindeki ve karadaki personelin durumu; gemiden ayrılması gereken ziyaretçiler, tahliye güzergâhı, güvenli toplanma yerleri ve kritik görev postaları bakımından değerlendirilir.","learning_en":"The location and safety of personnel aboard and ashore are assessed, including visitors who need to leave, evacuation routes, safe assembly points and critical duty stations.","exercise_tr":"Gemide/kıyıda personel sayımı ve yangın-kurtarma görevlerini rol dağıtımı çizelgesinde eşleştirin.","exercise_en":"Cross-check onboard/ashore personnel accounting and fire/rescue assignments on a muster diagram.","hazard_tr":"Acil uzaklaşma hazırlığında kıyıda kalan personelin unutulması.","hazard_en":"Leaving shore personnel unaccounted for during emergency departure preparations.","id":"04-departure","source_full_tr":["Gemi üzerindeki ve karadaki personelin durumu; gemiden ayrılması gereken ziyaretçiler, tahliye güzergâhı, güvenli toplanma yerleri ve kritik görev postaları bakımından değerlendirilir. Uygulanabilir yangınla mücadele ve can kurtarma donanımı görsel olarak kontrol edilir. Köprüüstü ve makine, seyir ve manevra hazırlığı hakkında birbirini bilgilendirir. Hızlı ayrılma baskısı altında tek bir emniyet personelinin unutulması, kıyıda personel bırakılması veya yürüme köprüsünün bağlı kalması önemli risklerdir.","Ortak kartlar: PORT-C03, PORT-C04, PORT-C05, PORT-C14."],"source_full_en":["Assess the location of persons aboard and ashore, visitors who must leave, evacuation routes, safe muster points and critical duty stations. Visually check applicable firefighting and life-saving appliances. Bridge and engine-room teams exchange information about navigation and manoeuvring readiness. Under pressure to depart rapidly, overlooking a safety watchkeeper, leaving personnel on the quay or keeping the gangway attached are major risks.","Related cards: PORT-C03, PORT-C04, PORT-C05, PORT-C14."],"source_integrity":"sha256_verified_against_embedded_blocks"},{"step":5,"title_tr":"Çekme/römorkör yardımının ve bağlama düzeninin değerlendirilmesi","title_en":"Assess tug assistance and moorings","learning_tr":"Gemi kendi sevkiyle güvenle ayrılabiliyor mu, yoksa römorkör desteği mi gerekiyor sorusu yanıtlanır. Baş ve kıç halat düzeni, gerginlik, rüzgâr, akıntı, kıyı donanımı, römorkör yanaşma ve halat bağlantısı seçenekleri incelenir.","learning_en":"Assess whether the vessel can clear the berth safely under its own propulsion or requires tug assistance. Examine forward and aft moorings, line tension, wind and current, shore fittings, tug approach and towline attachment. Terminal-specific fire wires or tow arrangements are discussed only where the actual approved berth and vessel procedures provide for them. Highlight snap-back and propeller entanglement hazards without prescribing universal line geometry.","exercise_tr":"Palamar yükleri, halat açıları ve römorkör desteği seçeneklerini bağlama planı üzerinde tartışın.","exercise_en":"Discuss mooring loads, line leads and tug-assistance options on the mooring plan.","hazard_tr":"Snap-back bölgesine girilmesi veya uygun olmayan çeki tertibatının kullanılması.","hazard_en":"Entering a snap-back zone or using an unsuitable towing arrangement.","id":"05-departure","source_full_tr":["Gemi kendi sevkiyle güvenle ayrılabiliyor mu, yoksa römorkör desteği mi gerekiyor sorusu yanıtlanır. Baş ve kıç halat düzeni, gerginlik, rüzgâr, akıntı, kıyı donanımı, römorkör yanaşma ve halat bağlantısı seçenekleri incelenir. Yangın/çekme teli gibi özel terminal tertipleri ancak geminin fiilî donanımı ve o terminalin onaylı talimatı varsa eğitimde somutlaşır; genel eğitimde belirli bir tel yüksekliği veya halat donatma yöntemi emredilmez. Kopma ve pervaneye dolanma tehlikeleri öğretilir.","Ortak kartlar: PORT-C06, PORT-C07, PORT-C11."],"source_full_en":["Determine whether the vessel can move clear safely under its own propulsion or requires tug support. Review forward and aft moorings, tension, wind, current, shore installations, tug approach and line connection options. Special arrangements such as fire wires or emergency towing wires are discussed concretely only where fitted and governed by approved instructions for that terminal; no universal wire height or rigging sequence is prescribed. Teach snap-back and propeller entanglement hazards.","Related cards: PORT-C06, PORT-C07, PORT-C11."],"source_integrity":"sha256_verified_against_embedded_blocks"},{"step":6,"title_tr":"Manevra alanı, draft/stabilite ve ayrılma sırasının seçimi","title_en":"Review manoeuvring room and release sequence","learning_tr":"Geminin su çekimi, trim, meyil, rıhtım derinliği, liman trafiği, komşu gemiler, römorkör alanı ve yangın/duman yönü birlikte değerlendirilir.","learning_en":"The vessel's draught, trim, list, depth alongside, port traffic, neighbouring ships, tug operating space and direction of fire or smoke are assessed together.","exercise_tr":"Taslak, rıhtım derinliği, akıntı ve trafik verileriyle örnek uzaklaşma güzergâhı ve karar noktalarını işaretleyin.","exercise_en":"Plot sample clearing manoeuvre options and decision points using draught, berth depth, current and traffic data.","hazard_tr":"Yetersiz derinlik veya manevra sahasında gemi/tesis çarpması.","hazard_en":"Insufficient under-keel clearance or collision with vessels/port structures.","id":"06-departure","source_full_tr":["Geminin su çekimi, trim, meyil, rıhtım derinliği, liman trafiği, komşu gemiler, römorkör alanı ve yangın/duman yönü birlikte değerlendirilir. Manevradaki ilk hareketin gemiyi tehlikeli bölgeye daha fazla yaklaştırıp yaklaştırmayacağı tartışılır. Hangi bağlama hattının önce çözülmesi gerektiği gerçek manevra planından öğrenilir; evrensel “baş sonra kıç” veya “spring önce” komutu verilmez. Kaptan, acil durumda dahi ön hazırlığın ve postalar arası teyidin gerekli olduğunu öğretir.","Ortak kartlar: PORT-C07, PORT-C09, PORT-C12."],"source_full_en":["Assess draught, trim, list, berth depth, port traffic, nearby ships, tug manoeuvring room and fire or smoke direction together. Discuss whether the first movement could bring the ship closer to danger. The sequence for releasing mooring lines comes from the actual manoeuvring plan: no universal 'forward first, then aft' or 'spring line first' command is given. Even in an emergency, the master emphasises preparation and confirmation between stations.","Related cards: PORT-C07, PORT-C09, PORT-C12."],"source_integrity":"sha256_verified_against_embedded_blocks"},{"step":7,"title_tr":"Kontrollü uzaklaşma, güvenli bekleme ve devam eden tehlike","title_en":"Move clear only under approved operational control","learning_tr":"Bağlı kara bağlantıları emniyete alındıktan, personel teyitleri tamamlandıktan ve gerekli koordinasyon sağlandıktan sonra geminin emniyetli uzaklaşma/yer değiştirme seçenekleri değerlendirilir.","learning_en":"Once shore connections are made safe, personnel checks are complete and necessary coordination has been achieved, options for safely moving the vessel away or shifting berth are assessed.","exercise_tr":"Kontrollü uzaklaşma, açıkta bekleme ve geri dönme seçeneklerini masa başı senaryoda karşılaştırın.","exercise_en":"Compare controlled clearing, safe waiting area and return options in a tabletop exercise.","hazard_tr":"Bağlantılar ve personel tamamlanmadan manevra başlatılması; talimde fiilî avara iddiası.","hazard_en":"Manoeuvring before personnel and connections are secured; claiming a real letting-go occurred during simulation.","id":"07-departure","source_full_tr":["Bağlı kara bağlantıları emniyete alındıktan, personel teyitleri tamamlandıktan ve gerekli koordinasyon sağlandıktan sonra geminin emniyetli uzaklaşma/yer değiştirme seçenekleri değerlendirilir. Talim gerçek avara içermiyorsa halat alma, makine telgrafı, manevra ve kıyı bildirimleri komut-teyit simülasyonu ile sınanır. Liman içi güvenli bekleme mevkii, ikinci bir risk yaratmadan seçilmesi gereken karardır. Yangın, duman, kirlilik veya güvenlik tehdidi hâlâ sürüyorsa olay yönetimi talim raporunun dışında ayrı prosedüre bağlanır.","Ortak kartlar: PORT-C09, PORT-C10, PORT-C13, PORT-C14."],"source_full_en":["After ship–shore connections are made safe, personnel confirmed and coordination completed, assess options to move or relocate the vessel safely. If no actual unmooring is included, test line handling, engine telegraph, manoeuvring and shore notification through command-and-confirmation simulation. A safe waiting position in port must be selected without creating another risk. If fire, smoke, pollution or a security threat continues, incident management is linked to the relevant separate procedure beyond the drill account.","Related cards: PORT-C09, PORT-C10, PORT-C13, PORT-C14."],"source_integrity":"sha256_verified_against_embedded_blocks"},{"step":8,"title_tr":"Emniyet değerlendirmesi, bildirimler ve başlangıç raporu","title_en":"Assess status and submit initial report","learning_tr":"Olayın başlama saati, ilk bildirim, manevra kararına esas bilgiler, geminin mevcut/önceki mevkii, draft, hava/deniz koşulları, bağlantıların durumu, verilen ve alınan emirler ve sonuç değerlendirilir.","learning_en":"Review incident start time, initial report, basis for the manoeuvring decision, present and previous positions, draught, weather and sea state, shore-connection status, orders and acknowledgements, and outcome. The organisation's applicable notification and record topics are identified. If no actual departure occurred, describe only the simulated sequence; real incidents additionally require reporting according to the particular damage or pollution situation.","exercise_tr":"Senaryo zaman çizelgesi, iptal nedenleri, gerçek/simüle emir ve bildirimleri rapor taslağında ayrı gösterin.","exercise_en":"Separate the scenario timeline, abort criteria, real/simulated orders and notifications in a draft report.","hazard_tr":"Gerçekte gerçekleşmeyen iskeleden ayrılmanın olay tutanağına yazılması.","hazard_en":"Recording a simulated departure as an actual unberthing.","id":"08-departure","source_full_tr":["Olayın başlama saati, ilk bildirim, manevra kararına esas bilgiler, geminin mevcut/önceki mevkii, draft, hava/deniz koşulları, bağlantıların durumu, verilen ve alınan emirler ve sonuç değerlendirilir. Kurumun özel kontrol listesindeki bildirim ve kayıt başlıkları hatırlanır. Talimde gerçek avara yapılmamışsa raporda yalnız simüle edilen faaliyetler açıkça belirtilir. Gerçek bir olayda bildirim yükümlülükleri, hasar veya kirlilik durumuna göre ilgili diğer prosedürlerle tamamlanır."],"source_full_en":["Review the incident start time, first report, facts supporting the manoeuvring decision, present and previous positions, draught, weather and sea, condition of connections, orders given and received, and outcome. Recall notification and recording topics in the organisation's specific checklist. If no actual unmooring occurred, the report clearly identifies only simulated activities. In a real incident, additional notification obligations depend on damage or pollution and the applicable related procedures."],"source_integrity":"sha256_verified_against_embedded_blocks"}]},{"key":"power/blackout","family":"power","flow":"blackout","title_tr":"Karartma / Blackout","title_en":"Blackout","family_title_tr":"Karartma / Ana Makine Arızası","family_title_en":"Blackout / Main Engine Failure","stages":[{"step":1,"title_tr":"Senaryo, kapsam, risk ve roller","title_en":"Define blackout scenario and roles","learning_tr":"Amaç: Ana besleme kaybında geminin hangi yeteneklerini kaybedebileceğini ve emniyetli karar zincirini öğretmek.","learning_en":"Objective: Teach which capabilities a vessel may lose when its main electrical supply fails, and the sequence of decisions necessary to maintain safety.","exercise_tr":"Tam/kısmi güç kaybı örnek senaryosunda köprüüstü, makine ve elektrik görev paylaşımını rol kartlarında gösterin.","exercise_en":"Use role cards to demonstrate bridge, engine-room and electrical responsibilities in a full/partial blackout scenario.","hazard_tr":"Gerçek enerji kesme işleminin yetkisiz talim uygulaması olarak yapılması.","hazard_en":"Performing an unauthorised live power interruption for training.","id":"KRT-01","source_full_tr":["Amaç: Ana besleme kaybında geminin hangi yeteneklerini kaybedebileceğini ve emniyetli karar zincirini öğretmek.","Kaptan ve başmühendis, talimin yalnızca simüle edilecek safhalarını ve izin verilmiş gerçek ekipman gösterimlerini önceden belirler. Gemi operasyonu, deniz-hava koşulları, yakındaki trafik ve kritik manevra görevleri değerlendirilir. Köprüüstü, makine kontrol mahalli, elektrik personeli ve yardımcı ekiplerin haberleşme sorumlulukları tanıtılır. Senaryonun tam veya kısmi güç kaybı olduğu açıklanır; acil jeneratörün çalışması varsayımı, geminin gerçek donanımına ve eğitim hedefine göre seçilir.","Öğretim konusu: Tam/kısmi kesinti farkı; manevra ve görev kabiliyetinin kaybı; canlı sistem testinin izin/risk gerekçesi."],"source_full_en":["Objective: Teach which vessel capabilities may be lost if the main electrical supply fails and how to establish a safe chain of decisions.","The master and chief engineer establish in advance which phases will be simulated and which actual equipment demonstrations are authorised. Assess the ship's operation, weather and sea state, nearby traffic and critical manoeuvring duties. Explain communications responsibilities of the bridge, machinery control room, electrical personnel and supporting teams. Clarify whether the scenario involves total or partial power loss; choose assumptions about emergency generator operation in light of the vessel's actual equipment and training objective.","Teaching topic: Difference between total and partial blackout; loss of manoeuvring or operational capability; the permission and risk basis for testing live systems."],"source_integrity":"sha256_verified_against_embedded_blocks"},{"step":2,"title_tr":"İlk belirtiler ve acil alarmın değerlendirilmesi","title_en":"Recognize initial symptoms and alarms","learning_tr":"Ana pano gerilimi, otomasyon alarmı, köprüüstü cihaz göstergeleri, makinelerin durumu ve aydınlatma değişikliği gibi belirtiler karşılaştırılır.","learning_en":"Indicators such as main switchboard voltage, automation alarms, bridge instrument indications, machinery status and lighting changes are compared.","exercise_tr":"Örnek ana pano gerilimi, otomasyon alarmı ve aydınlatma değişimi kayıtlarını zaman çizelgesine yerleştirin.","exercise_en":"Place sample switchboard voltage, automation alarms and lighting changes on an event timeline.","hazard_tr":"Alarmın yanlış yorumlanması veya elektrik arızasına korunmasız müdahale.","hazard_en":"Misinterpreting alarms or approaching electrical faults without protection.","id":"KRT-02","source_full_tr":["Ana pano gerilimi, otomasyon alarmı, köprüüstü cihaz göstergeleri, makinelerin durumu ve aydınlatma değişikliği gibi belirtiler karşılaştırılır. Arıza ve alarmın hangi panelde ve hangi saatte görüldüğü not edilmesi gereken bilgi olarak anlatılır. Genel alarm veya mühendis çağırma alarmının gerekli kullanım şartları, geminin SMS esaslarıyla açıklanır. Her elektrik kaybının aynı alarm işaretini veya aynı personel toplanma düzenini zorunlu kılmadığı belirtilir.","Öğretim konusu: Birinci gözlem, alarmın kaynağı, doğru bildirim, acil telefon/alternatif haberleşme."],"source_full_en":["Compare signs such as main-switchboard voltage, automation alarms, bridge instrument indications, machinery condition and changes in lighting. Teach which panel showed the fault or alarm and when, as information to be recorded. Explain when general alarms or engineering-call alarms are appropriate under the vessel's SMS. Not every electrical loss requires the same alarm signal or crew muster arrangements.","Teaching topic: First observation, alarm source, accurate reporting and emergency telephone or alternative communications."],"source_integrity":"sha256_verified_against_embedded_blocks"},{"step":3,"title_tr":"Köprüüstünde seyir ve çevre emniyeti","title_en":"Maintain bridge and navigational safety","learning_tr":"Kaptan, geminin serbest sürüklenme veya sınırlı manevra durumunu; yakın gemileri, deniz derinliğini, akıntı ve rüzgârı; mevcut mevki ve dümen durumunu değerlendirir.","learning_en":"The master assesses whether the ship is drifting freely or has restricted manoeuvring capability, taking account of nearby vessels, water depth, current, wind, position and steering condition.","exercise_tr":"Gemi mevkii, sürüklenme, yakın trafik ve çalışan seyir cihazlarıyla ilgili köprüüstü durum kartını inceletin.","exercise_en":"Review a bridge status card covering position, drift, nearby traffic and available navigation equipment.","hazard_tr":"Kısıtlı manevra durumunun ve çevre trafiğinin göz ardı edilmesi.","hazard_en":"Overlooking restricted manoeuvrability and surrounding traffic.","id":"KRT-03","source_full_tr":["Kaptan, geminin serbest sürüklenme veya sınırlı manevra durumunu; yakın gemileri, deniz derinliğini, akıntı ve rüzgârı; mevcut mevki ve dümen durumunu değerlendirir. Seyir fenerleri, seyir yardımcıları, dümen, iticiler ve haberleşme sistemlerinden hangilerinin işlevini koruduğu belirlenir. Gerekli durumlarda uygun işaretler, uyarı yayınları ve yardım talebi için karar ölçütleri incelenir. Mayday/Pan-Pan gerçek acil tehlike koşulları dışında talim nedeniyle yayınlanmaz.","Öğretim konusu: Mevki ve trafik değerlendirmesi, NUC kavramı, uygun çapa/yardım seçimi, köprüüstü sorumluluğu."],"source_full_en":["The master assesses whether the ship is drifting freely or has limited manoeuvring capability, together with nearby vessels, water depth, current, wind, position and steering status. Establish which navigation lights, aids, steering equipment, thrusters and communication systems remain operational. Examine criteria for appropriate signals, warning broadcasts and requests for assistance when needed. MAYDAY or PAN PAN must not be transmitted merely for a drill where no actual distress or urgency exists.","Teaching topic: Position and traffic assessment, the not-under-command concept, appropriate anchor or assistance options and bridge responsibilities."],"source_integrity":"sha256_verified_against_embedded_blocks"},{"step":4,"title_tr":"Acil güç kaynakları ve emniyet tüketicileri","title_en":"Review emergency power and essential loads","learning_tr":"Ana kaynağın kaybında acil jeneratör, acil pano, UPS ve bataryaların hangi hizmetleri yürüttüğü geminin elektrik dağıtım şeması üzerinde gösterilir.","learning_en":"The ship's electrical distribution diagram is used to demonstrate which services are supplied by the emergency generator, emergency switchboard, UPS units and batteries following loss of the main source.","exercise_tr":"Acil pano, jeneratör, UPS ve bataryadan beslenen tüketicileri geminin elektrik tek hat şemasında işaretletin.","exercise_en":"Identify emergency switchboard, generator, UPS and battery-fed services on the vessel’s electrical single-line diagram.","hazard_tr":"UPS veya acil jeneratörün bütün tüketicileri beslediğinin varsayılması.","hazard_en":"Assuming UPS or emergency generation supplies every consumer.","id":"KRT-04","source_full_tr":["Ana kaynağın kaybında acil jeneratör, acil pano, UPS ve bataryaların hangi hizmetleri yürüttüğü geminin elektrik dağıtım şeması üzerinde gösterilir. Acil aydınlatma, yangın algılama, dahili haberleşme, GMDSS ve ilgili köprüüstü cihazlarının güç kaynağı ayrı ayrı incelenir. Acil jeneratörün çalıştığı varsayılsa bile belirli bir cihazın mutlaka beslendiği ileri sürülmez; bu sonuç geminin fiilî dağıtım planından teyit edilir. İzin verilmemiş gerçek güç kesilmesi, şalter transferi veya koruma bypass işlemi yapılmaz.","Öğretim konusu: Acil/ana pano farkı; UPS sınırı; besleme sürekliliği; yük önceliği."],"source_full_en":["Use the ship's electrical distribution drawing to demonstrate what services emergency generators, emergency switchboards, UPS units and batteries can supply after loss of the main source. Examine the power sources for emergency lighting, fire detection, internal communications, GMDSS and relevant bridge equipment separately. Even when the scenario assumes the emergency generator has started, do not presume that a particular device must be supplied: verify this against the vessel's actual distribution plan. No unauthorised actual power interruption, breaker transfer or protection bypass is performed.","Teaching topic: Main versus emergency switchboards, UPS limitations, continuity of supply and load priority."],"source_integrity":"sha256_verified_against_embedded_blocks"},{"step":5,"title_tr":"Arıza teşhisinin ve otomatik kurtarmanın öğretilmesi","title_en":"Understand fault diagnosis and automatic recovery","learning_tr":"Elektrik personeli ve başmühendis, varsayımsal alarm geçmişinden olası arızayı değerlendirir: jeneratörün durması, frekans/gerilim sapması, koruma açması, yakıt/soğutma/yakıt kontrolü veya aşırı yük gibi nedenler ele alınır.","learning_en":"The electrical team and chief engineer examine possible causes using a simulated alarm history: generator shutdown, frequency or voltage deviations, protective trips, fuel or cooling problems, control faults and overload.","exercise_tr":"Arıza alarm sırasını ve PMS yük yönetimi seçeneklerini örnek kayıtlar üzerinde tartışın; kesici kumandası yapmayın.","exercise_en":"Review alarm sequences and PMS load-management options using sample records without operating breakers.","hazard_tr":"Koruma açmasının sebebi anlaşılmadan yanlış kesicinin kapatılması.","hazard_en":"Closing the wrong breaker before understanding the protective trip.","id":"KRT-05","source_full_tr":["Elektrik personeli ve başmühendis, varsayımsal alarm geçmişinden olası arızayı değerlendirir: jeneratörün durması, frekans/gerilim sapması, koruma açması, yakıt/soğutma/yakıt kontrolü veya aşırı yük gibi nedenler ele alınır. PMS varsa otomatik yedek jeneratör devreye alma ve yük atma prensibi anlatılır. “Güç neden gitti?”, “hangi kaynak halen mevcut?”, “hangi sistem daha güvenli öncelikli?” sorularıyla bir karar egzersizi yapılır.","Öğretim konusu: Teşhis ve ihtimalleri ayırma; koruma rölesi; yanlış reset ve yetkisiz bağlama riski."],"source_full_en":["Electrical personnel and the chief engineer assess the simulated alarm history for likely causes such as generator stoppage, frequency or voltage deviation, protective trip, fuel or cooling problems and overload. If a power-management system (PMS) is fitted, explain automatic starting of standby generators and load shedding. Practise decisions through the questions: 'Why was power lost?', 'Which sources remain available?', and 'Which services must be prioritised safely?'","Teaching topic: Distinguishing diagnostic possibilities, protective relays and the risks of an incorrect reset or unauthorised connection."],"source_integrity":"sha256_verified_against_embedded_blocks"},{"step":6,"title_tr":"Kontrollü güç geri kazanım planının oluşturulması","title_en":"Plan controlled power restoration","learning_tr":"Gerilim geri dönmeden önce kısa devre, yangın, su teması, ekipman hasarı ve personel çalışma durumu gibi emniyet koşulları değerlendirilir.","learning_en":"Before restoring voltage, safety conditions are reviewed, including short circuits, fire, contact with water, equipment damage and the status of personnel working on the system.","exercise_tr":"Örnek restorasyon planında personel emniyeti, yangın/su teması kontrolü ve yüklerin kademeli geri alınmasını sıralayın.","exercise_en":"Sequence personnel safety, fire/water exposure checks and staged load restoration in a sample recovery plan.","hazard_tr":"Kısa devre/ıslak ekipman kontrol edilmeden enerji verilmesi veya aşırı yük oluşması.","hazard_en":"Energising damaged or wet equipment or causing overload.","id":"KRT-06","source_full_tr":["Gerilim geri dönmeden önce kısa devre, yangın, su teması, ekipman hasarı ve personel çalışma durumu gibi emniyet koşulları değerlendirilir. Başmühendis, geminin güncel elektrik prosedüründe gösterilen sırayla yapılacak işlemleri eğitim amaçlı açıklar; panoya yönelik canlı ve genellenmiş kesici işlemleri verilmez. Öncelikli yardımcılar, acil jeneratörün normal bekleme düzenine dönüşü ve kritik tüketicilerin yeniden başlatılması için önkoşullar tanımlanır. Gemiye uygun olmayan bir “otomatik şalter sıralaması” öğretilmez.","Öğretim konusu: Yeniden enerjilendirmeden önce izolasyon/hasar kontrolü; kritik tüketici önceliği."],"source_full_en":["Before voltage is restored, assess safety conditions including short circuits, fire, contact with water, equipment damage and personnel working on the system. The chief engineer explains an instructional restoration sequence based on the vessel's current electrical procedure; no generic live switchboard breaker sequence is prescribed. Define prerequisites for restarting priority auxiliaries and critical consumers and returning the emergency generator to its normal standby arrangement. Do not teach an 'automatic breaker sequence' that may not apply to the ship.","Teaching topic: Isolation and damage checks before re-energisation; prioritisation of critical consumers."],"source_integrity":"sha256_verified_against_embedded_blocks"},{"step":7,"title_tr":"Sevk ve dümen kabiliyetinin yeniden doğrulanması","title_en":"Confirm propulsion and steering readiness","learning_tr":"Ana dağıtımın geri gelmesinin sevkin döndüğü anlamına gelmediği açıklanır. Ana makine/sevk motoru, yağlama-soğutma pompaları, kumanda havası, dümen, pervane adımı veya tahrik sisteminin çalışabilirliği, her biri kendi onaylı…","learning_en":"Restoring the main electrical supply does not in itself restore propulsion. Assess the readiness of the main engine or drive motor, lubricating and cooling pumps, control air, steering, propeller pitch and propulsion controls using their approved methods. Confirm control mode and bridge–engine communication. Review stable operation, recurring alarms and the standby readiness of alternative electrical supplies. Power restoration and safe navigability are distinct decisions.","exercise_tr":"Elektrik geri kazanımı ile dümen ve sevk teyidini ayrı kontrol sütunlarında gösterin.","exercise_en":"Use separate checklist columns for electrical restoration and verification of steering/propulsion availability.","hazard_tr":"Ana pano geriliminin gelmesini sevk kabiliyetinin geri dönmesi sanmak.","hazard_en":"Equating restored switchboard voltage with restored propulsion capability.","id":"KRT-07","source_full_tr":["Ana dağıtımın geri gelmesinin sevkin döndüğü anlamına gelmediği açıklanır. Ana makine/sevk motoru, yağlama-soğutma pompaları, kumanda havası, dümen, pervane adımı veya tahrik sisteminin çalışabilirliği, her biri kendi onaylı yöntemiyle değerlendirilir. Köprüüstü/makine kontrolü ve kumanda modu açıkça teyit edilir. Yeniden çalıştırılan sistemin kararlılığı, alarmların tekrarı ve alternatif güç kaynağının tekrar hazır bekleme durumuna alınması, izinli göstergeler üzerinden anlatılır.","Öğretim konusu: Güç geri kazanımı ≠ seyir kabiliyeti; kumanda devri ve izleme."],"source_full_en":["Explain that restoration of main distribution power does not itself mean propulsion has been restored. Review the operability of the main engine or propulsion motor, lubricating and cooling pumps, control air, steering, propeller pitch or drive system under each system's approved method. Confirm bridge and machinery control authority and the selected control mode explicitly. Explain monitoring of restored-system stability, recurrent alarms and return of alternative power sources to standby using permitted indications.","Teaching topic: Recovering electrical power is not the same as recovering navigation capability; control transfer and monitoring."],"source_integrity":"sha256_verified_against_embedded_blocks"},{"step":8,"title_tr":"İletişim, rapor, hasar sonrası işlemler ve talim kapanışı","title_en":"Communicate, debrief and document","learning_tr":"Meydana geldiği varsayılan olayın başlangıç saati, etkilenen donanımlar, seyir emniyeti tedbirleri, kullanılan acil kaynak, gerçekleştirilen veya simüle edilen teşhis, restorasyonun kontrol noktaları ve şirket irtibatı üzerinde…","learning_en":"Practise a report covering the assumed time of failure, affected equipment, navigational safety measures, emergency supply used, checks actually performed or simulated, conditions for restoration and company contacts. Explain how real defects would be entered into fault reports and maintenance planning. Check that drill equipment is ready for service, identify any stop-work conditions and record learning points without confusing drill, defect and repair records.","exercise_tr":"Talim sonunda alarmları, emniyet kararlarını, varsayımsal restorasyon safhalarını ve kayıt sınırlarını özetletin.","exercise_en":"Debrief alarm chronology, safety decisions, simulated restoration steps and record limitations.","hazard_tr":"Gerçekte olmayan devreye alma veya kesici testlerinin bakım kaydına geçirilmesi.","hazard_en":"Entering nonexistent breaker or commissioning tests in maintenance records.","id":"KRT-08","source_full_tr":["Meydana geldiği varsayılan olayın başlangıç saati, etkilenen donanımlar, seyir emniyeti tedbirleri, kullanılan acil kaynak, gerçekleştirilen veya simüle edilen teşhis, restorasyonun kontrol noktaları ve şirket irtibatı üzerinde rapor eğitimi yapılır. Gerçek eksiklik saptanmışsa uygunsuzluk/arıza bildirimi ve bakım planına işleme süreci açıklanır. Kullanılan eğitim ekipmanlarının hazır bırakılması, talimin durdurulmasına yol açan koşullar ve öğrenilen dersler değerlendirilir.","Öğretim konusu: Karartma kontrol listesi; olay, eğitim ve bakım kaydının ayrılması."],"source_full_en":["Train report writing around the assumed incident start time, affected equipment, navigational safety measures, emergency supply used, diagnosis actually performed or simulated, restoration check points and company contacts. If a real deficiency has been identified, explain the non-conformity or defect-reporting and maintenance-planning process. Review readiness of training equipment, circumstances that would require stopping the exercise and lessons learned.","Teaching topic: Blackout checklist and the distinction between incident, training and maintenance records."],"source_integrity":"sha256_verified_against_embedded_blocks"}]},{"key":"power/main_engine_failure","family":"power","flow":"main_engine_failure","title_tr":"Ana Makine Arızası","title_en":"Main Engine Failure","family_title_tr":"Karartma / Ana Makine Arızası","family_title_en":"Blackout / Main Engine Failure","stages":[{"step":1,"title_tr":"Arıza senaryosu, sevk mimarisi ve görev organizasyonu","title_en":"Define propulsion-failure scenario and roles","learning_tr":"Dizel-mekanik, dizel-elektrik veya diğer sevk mimarilerinde “ana makine arızası”nın aynı sonuçlara yol açmayabileceği açıklanır.","learning_en":"It is explained that 'main engine failure' may have different consequences in diesel-mechanical, diesel-electric and other propulsion arrangements.","exercise_tr":"Geminin gerçek sevk mimarisini blok şema üzerinde gösterip arızalı bileşen varsayımlarını karşılaştırın.","exercise_en":"Show the vessel’s actual propulsion architecture on a block diagram and compare component-failure assumptions.","hazard_tr":"Farklı sevk sistemlerini aynı arıza tanısı veya yedekleme yöntemiyle değerlendirmek.","hazard_en":"Using the same failure diagnosis or backup method for different propulsion systems.","id":"MAK-01","source_full_tr":["Dizel-mekanik, dizel-elektrik veya diğer sevk mimarilerinde “ana makine arızası”nın aynı sonuçlara yol açmayabileceği açıklanır. Ana makine, şanzıman/redüksiyon, CPP, tahrik motoru, iticiler ve kritik yardımcılar arasındaki ilişki geminin mevcut sistem şemasından gösterilir. Kaptan, başmühendis, köprüüstü ve makine kontrol mahalli arasındaki koordinasyon belirlenir. Gerçek sevkin kesilmesi yerine varsayımsal arıza senaryosu kullanılır.","Öğretim konusu: Elektrik mevcutken sevk kaybı; alarm ve kontrol zinciri; rol dağılımı."],"source_full_en":["Explain that 'main engine failure' can have different consequences on diesel-mechanical, diesel-electric and other propulsion architectures. Use the installed system drawing to show relationships among the main engine, gearbox or reduction gear, controllable-pitch propeller (CPP), drive motor, thrusters and essential auxiliaries. Establish coordination among the master, chief engineer, bridge and machinery control station. Use a hypothetical breakdown scenario instead of deliberately stopping propulsion.","Teaching topic: Loss of propulsion despite electrical power remaining available; alarm and control chain; distribution of roles."],"source_integrity":"sha256_verified_against_embedded_blocks"},{"step":2,"title_tr":"Belirtileri değerlendirme ve ilk emniyet kararı","title_en":"Identify symptoms and immediate priorities","learning_tr":"Devir, yağ basıncı, sıcaklık, yakıt beslemesi, soğutma, kumanda yanıtı, titreşim, duman ve koruma alarmı gibi göstergelerin neden önemli olduğu öğretilir.","learning_en":"The significance of engine speed, lubricating oil pressure, temperature, fuel supply, cooling, control response, vibration, smoke and protective alarms is explained.","exercise_tr":"Örnek devir, yağ basıncı, sıcaklık, titreşim ve stop alarmını olay dizisiyle birlikte yorumlatın.","exercise_en":"Interpret sample speed, oil-pressure, temperature, vibration and stop alarms against the event sequence.","hazard_tr":"Makine korumalarının neden devreye girdiği anlaşılmadan yeniden çalıştırma.","hazard_en":"Restarting machinery before the reason for a protective shutdown is understood.","id":"MAK-02","source_full_tr":["Devir, yağ basıncı, sıcaklık, yakıt beslemesi, soğutma, kumanda yanıtı, titreşim, duman ve koruma alarmı gibi göstergelerin neden önemli olduğu öğretilir. Bir otomatik stop veya güç azaltma korumasının hangi genel amaçla gerçekleştiği açıklanır. Başmühendisin değerlendirmesi kaptana eksiksiz bildirilir; sistemin koşulsuz yeniden çalıştırılacağı varsayılmaz.","Öğretim konusu: Anormalliğin tanınması, doğru alarm kaydı, güvenlik korumalarının önemi."],"source_full_en":["Teach why engine speed, oil pressure, temperature, fuel supply, cooling, control response, vibration, smoke and protective alarms are important. Explain the general purpose of automatic shutdown or power-reduction safeguards. The chief engineer reports the assessment fully to the master; unconditional restart is never presumed.","Teaching topic: Recognising abnormalities, correct alarm records and the importance of protective devices."],"source_integrity":"sha256_verified_against_embedded_blocks"},{"step":3,"title_tr":"Köprüüstü seyir emniyeti","title_en":"Maintain navigational safety","learning_tr":"Gemi süratinin azalması, sevk itkisinin kaybı, rotayı koruma zorluğu, baş rüzgâr ve akıntının gemiyi sürüklemesi, yakın trafik ve sığlık riskleri değerlendirilir.","learning_en":"A reduction in speed, loss of thrust, difficulty maintaining course, drift caused by headwind or current, nearby traffic and shallow-water hazards are assessed.","exercise_tr":"Sürüklenme, trafik, sığlık, rüzgâr ve mevcut dümen imkânlarını köprüüstü karar kartında karşılaştırın.","exercise_en":"Compare drift, traffic, shallow water, wind and remaining steering capability on a bridge decision card.","hazard_tr":"Sevk kaybında geminin çevre emniyetinin ikincil görülmesi.","hazard_en":"Treating external navigation hazards as secondary during loss of propulsion.","id":"MAK-03","source_full_tr":["Gemi süratinin azalması, sevk itkisinin kaybı, rotayı koruma zorluğu, baş rüzgâr ve akıntının gemiyi sürüklemesi, yakın trafik ve sığlık riskleri değerlendirilir. Kullanılabilir durumdaki dümen ve alternatif tahrik imkânı sorgulanır. Demirleme, refakat, römorkör veya emniyetli bekleme kararı geminin gerçek durumuna göre incelenir. Uygulanabilir olduğunda gündüz/gece işaretleri ve telsiz uyarıları doğru alarm türünden ayrılır.","Öğretim konusu: Seyir üstünlüğü değil manevra yetersizliği; karar süresi; kıyı/operasyon merkezi iletişimi."],"source_full_en":["Assess reduced speed, loss of thrust, difficulty maintaining course, wind and current setting the vessel off, nearby traffic and shallow-water risks. Consider the remaining steering capability and any alternative propulsion available. Evaluate anchoring, escort, tug support or safe holding decisions based on the actual situation. Where applicable, distinguish day or night signals and radio warnings from the various alarm types.","Teaching topic: Inability to manoeuvre rather than priority in navigation; decision time and communication with shore or the operations centre."],"source_integrity":"sha256_verified_against_embedded_blocks"},{"step":4,"title_tr":"Makine mahallinde güvenli teşhis","title_en":"Review safe engine-room diagnosis","learning_tr":"Makine personelinin elektrik enerjisi, sıcak yüzey, basınçlı hat, hareketli parçalar, sıcak akışkan ve yangın gibi tehlikelere yaklaşım prensipleri açıklanır.","learning_en":"Machinery personnel are taught how to assess hazards associated with electrical energy, hot surfaces, pressurised lines, moving parts, hot fluids and fire.","exercise_tr":"Makine alarm geçmişini şemada işaretleyin; sıcak yüzey, basınçlı hat ve hareketli parça sınırlarını görsel olarak tanıtın.","exercise_en":"Mark alarm history on the machinery diagram and visually identify hot surfaces, pressurised lines and moving parts.","hazard_tr":"Sıcak, basınçlı veya hareketli ekipmana izolasyonsuz müdahale.","hazard_en":"Working on hot, pressurised or moving equipment without isolation.","id":"MAK-04","source_full_tr":["Makine personelinin elektrik enerjisi, sıcak yüzey, basınçlı hat, hareketli parçalar, sıcak akışkan ve yangın gibi tehlikelere yaklaşım prensipleri açıklanır. Alarm dizisi, yağlama-soğutma-yakıt zinciri, hava ve kumanda sistemi ile planlı bakım kayıtları karşılaştırılır. Yetkili personel, hangi kontrolün güvenli gözlem, hangisinin fiziksel müdahale olduğunu ayırt eder. Talim canlı koruma bypass'ı veya arıza yaratma faaliyetlerine dönüşmez.","Öğretim konusu: İkincil arızayı önleme; kilitleme–etiketleme; yanlış teşhisin sonuçları."],"source_full_en":["Explain safe approaches to electrical energy, hot surfaces, pressurised lines, moving parts, hot fluids and fire hazards in the machinery space. Compare the sequence of alarms with lubrication, cooling and fuel systems, air and control systems and planned-maintenance records. Authorised personnel distinguish safe observation from physical intervention. The exercise must not become a live protection bypass or an activity that deliberately creates a fault.","Teaching topic: Preventing secondary failure, lockout/tagout and the consequences of incorrect diagnosis."],"source_integrity":"sha256_verified_against_embedded_blocks"},{"step":5,"title_tr":"Alternatif sevk ve manevra olanakları","title_en":"Assess alternative propulsion and manoeuvring","learning_tr":"Gemide gerçek olarak mevcut ve yetkili belgede tanımlanmışsa yedek sevk, bağımsız itici, dümen ya da başka manevra düzenlerinin kullanılabilirliği değerlendirilir.","learning_en":"Alternative propulsion, independent thrusters, steering or other manoeuvring arrangements are considered only where they are actually installed and described in approved vessel documentation.","exercise_tr":"Yalnız gemide mevcut olan yedek sevk, bağımsız itici veya CPP seçeneklerini gemiye ait çizim üzerinde karşılaştırın.","exercise_en":"Compare only installed alternative propulsion, independent thrusters or CPP options on ship-specific drawings.","hazard_tr":"Varsayımsal yedek tahrikin gerçekten kullanılabilir olduğu sanılması.","hazard_en":"Assuming a hypothetical standby drive is actually available.","id":"MAK-05","source_full_tr":["Gemide gerçek olarak mevcut ve yetkili belgede tanımlanmışsa yedek sevk, bağımsız itici, dümen ya da başka manevra düzenlerinin kullanılabilirliği değerlendirilir. Bir pervanenin adım kontrolünün arızalanması ile tahrik motorunun tamamen durması farklı teknik olaylardır. NENE HATUN'un belirli konvertör/CPP/itici kombinasyonunun güncel, kesin envanteri bu eğitim taslağından çıkarsanmaz. Eğitimde yalnızca uygulanabilirliği teyit edilmiş alternatifler gösterilir.","Öğretim konusu: Yardımcı iticinin sevk yerine geçip geçemeyeceği; kumanda modu ve emniyet."],"source_full_en":["If actually fitted and described in authorised documents, assess alternative propulsion, independent thrusters, steering or other manoeuvring arrangements. Failure of a propeller's pitch control differs technically from complete stoppage of its driving motor. Do not infer the definitive current inventory of NENE HATUN's converters, CPPs or thrusters from this generic training draft. Demonstrate only alternatives whose applicability has been established.","Teaching topic: Whether an auxiliary thruster can substitute for propulsion; control mode and safety."],"source_integrity":"sha256_verified_against_embedded_blocks"},{"step":6,"title_tr":"Tamir, dış yardım ve operasyon kararı","title_en":"Plan repairs, assistance and operational choice","learning_tr":"Başmühendis, gemide müdahalenin güvenli olup olmayacağını ve olası onarım hazırlığını teknik açıdan değerlendirir. Kaptan, mevcut hava/deniz/mesafe koşullarında bekleme, güvenli bölgeye geçiş, römorkör talebi veya görevin askıya…","learning_en":"The chief engineer assesses whether intervention aboard the vessel could be carried out safely and what repair preparations might be required.","exercise_tr":"Kaptan ve başmühendis rol kartlarıyla teknik tamir, bekleme, römorkör ve görev iptali seçeneklerini değerlendirin.","exercise_en":"Use master/chief engineer role cards to assess repair, holding position, tug assistance and mission suspension.","hazard_tr":"Emniyetsiz sahada onarım ısrarı veya dış yardım talebinin geciktirilmesi.","hazard_en":"Persisting with unsafe repair work or delaying necessary assistance.","id":"MAK-06","source_full_tr":["Başmühendis, gemide müdahalenin güvenli olup olmayacağını ve olası onarım hazırlığını teknik açıdan değerlendirir. Kaptan, mevcut hava/deniz/mesafe koşullarında bekleme, güvenli bölgeye geçiş, römorkör talebi veya görevin askıya alınmasına ilişkin seçenekleri değerlendirir. Şirket, ilgili otoriteler ve gerektiğinde üçüncü taraflar için bilgilerin içeriği ve haberleşme kademeleri öğretilir. Tek başına talimin yapılması, fiilen yardım çağrısı gerektirmez.","Öğretim konusu: Tamir süresi belirsizliği, riskin süreyle artması, kontrol dışı sürüklenme."],"source_full_en":["The chief engineer assesses technical safety of onboard intervention and possible repair preparations. The master considers waiting, moving to a safe area, requesting tugs or suspending the mission under the prevailing weather, sea and distance conditions. Teach what information is needed and the communication sequence for the company, authorities and third parties where relevant. Performing a drill alone does not require a real request for assistance.","Teaching topic: Uncertainty in repair duration, risks increasing over time and uncontrolled drift."],"source_integrity":"sha256_verified_against_embedded_blocks"},{"step":7,"title_tr":"Güvenli geri kazanım, test ve işletmeye dönüş","title_en":"Confirm restoration and safe return to service","learning_tr":"Onarımın veya geçici tedbirin başarılı olduğu kabul edilse dahi, uygun yağlama/soğutma/yakıt/kumanda şartları ve ilgili makine korumalarının normal durumda olup olmadığı değerlendirilir.","learning_en":"Even when a repair or temporary remedy is presumed successful, assess correct lubricating, cooling, fuel and control conditions and the normal status of machinery protections. Confirm readiness and transfer of control between the engine department and bridge. Actual starting, load testing or restoration of propulsion is undertaken only under current vessel procedures and coordination between master and chief engineer. Do not force a system while unexplained alarms or faults persist.","exercise_tr":"Geri kazanım kontrol listesinde yağlama, soğutma, kumanda, korumalar ve köprüüstü teyidini ayrı imza alanları olarak gösterin.","exercise_en":"Use separate verification fields for lubrication, cooling, control, protections and bridge confirmation before return to service.","hazard_tr":"Gerekli test ve izinler tamamlanmadan sevke geri dönülmesi.","hazard_en":"Returning to propulsion before required checks and authorisation.","id":"MAK-07","source_full_tr":["Onarımın veya geçici tedbirin başarılı olduğu kabul edilse dahi, uygun yağlama/soğutma/yakıt/kumanda şartları ve ilgili makine korumalarının normal durumda olup olmadığı değerlendirilir. Köprüüstü ile makine mahalli arasında kontrol devri ve hazır olma teyidi yapılır. Gerçek çalıştırma, yük denemesi veya sevke dönüş işlemleri ancak geminin güncel teknik prosedürü ve kaptan/başmühendis koordinasyonuyla yapılır. Devam eden alarm veya şüpheli arıza varlığında sistemin zorlanmaması öğretilir.","Öğretim konusu: Güvenli hazır olma koşulları, kararlı çalışma ve izleme."],"source_full_en":["Even when repair or a temporary remedy is assumed successful, check appropriate lubrication, cooling, fuel and control conditions and whether relevant machinery protections are normal. Confirm transfer of control and readiness between the bridge and machinery station. Actual engine start, load test or return to propulsion occurs only in accordance with the vessel's current technical procedure and coordination of the master and chief engineer. Teach that a system must not be forced to run while alarms persist or a fault is suspected.","Teaching topic: Safe readiness prerequisites, stable operation and monitoring."],"source_integrity":"sha256_verified_against_embedded_blocks"},{"step":8,"title_tr":"Sonuç değerlendirmesi, evrak ve öğrenilen dersler","title_en":"Debrief, document and identify lessons","learning_tr":"Talim olgularının sırası, ilk bildirim, kaptanın seyir emniyeti kararları, makine arızasının varsayılan/gerçek nedeni, müdahale sınırları, destek seçenekleri ve geri kazanımın kontrolü özetlenir.","learning_en":"The sequence of the exercise, initial report, master's navigational safety decisions, assumed or actual cause of machinery failure, limits of intervention, support options and verification of recovery are summarised.","exercise_tr":"Arıza günlüğünü, talim tartışmasını, varsa gerçek bakım ve düzenleyici faaliyetleri farklı kayıt türlerine ayırın.","exercise_en":"Separate the simulated fault log, training discussion and any real maintenance or corrective work into distinct records.","hazard_tr":"Kurgusal arıza nedeninin gerçek bakım bulgusu gibi yazılması.","hazard_en":"Recording a fictional fault cause as an actual maintenance finding.","id":"MAK-08","source_full_tr":["Talim olgularının sırası, ilk bildirim, kaptanın seyir emniyeti kararları, makine arızasının varsayılan/gerçek nedeni, müdahale sınırları, destek seçenekleri ve geri kazanımın kontrolü özetlenir. Hangi bilgilerin EK-V'deki Diğer Role Talimi anlatımına, hangilerinin EYS.08.118.FR'ye, güverte/makine jurnallerine veya arıza–bakım kaydına uygun olduğu açıklanır. Gerçek ekipman arızası oluşmamışsa arıza yapıldı veya onarıldı diye bakım kaydı açılmaz.","Öğretim konusu: Talim senaryosu, gerçek ekipman bulgusu ve kurum bildiriminin ayrılması."],"source_full_en":["Summarise the sequence of exercise facts, initial report, master's navigation-safety decisions, assumed or actual cause, intervention boundaries, support options and recovery checks. Explain what information belongs in the EK-V 'Other Drill' narrative, EYS.08.118.FR, deck or engine logs, or defect and maintenance records. If no actual equipment failure occurred, do not open a maintenance record suggesting that a failure was created or repaired.","Teaching topic: Distinguishing the drill scenario, a real equipment finding and institutional notification."],"source_integrity":"sha256_verified_against_embedded_blocks"}]},{"key":"weather_collision/heavy_weather","family":"weather_collision","flow":"heavy_weather","title_tr":"Ağır Hava","title_en":"Heavy Weather","family_title_tr":"Ağır Hava / Çatışma–Çatma","family_title_en":"Heavy Weather / Collision and Contact","stages":[{"step":1,"title_tr":"Meteorolojik tehlikenin tanınması ve seyrin yeniden değerlendirilmesi","title_en":"Recognize weather hazards and reassess voyage","learning_tr":"Köprüüstünde son tahminler, denizcilere duyurular, rüzgâr/akıntı, dalga ve swell bileşenleri, cephe geçişi, görüş ve sığlık tehlikeleri bir arada incelenir.","learning_en":"On the bridge, the latest forecasts, notices to mariners, wind and current, wave and swell components, frontal passages, visibility and shallow-water hazards are reviewed together.","exercise_tr":"Örnek meteoroloji haritası ve seyir planında rüzgâr, dalga, görüş ve alternatif rotaları karşılaştırın.","exercise_en":"Compare wind, waves, visibility and alternative routes on a sample weather chart and passage plan.","hazard_tr":"Tek tahmine aşırı güvenme; geminin gerçek deniz ve stabilite sınırlarını göz ardı etme.","hazard_en":"Overreliance on one forecast; overlooking actual sea conditions and vessel stability limits.","id":"HW-01","source_full_tr":["Köprüüstünde son tahminler, denizcilere duyurular, rüzgâr/akıntı, dalga ve swell bileşenleri, cephe geçişi, görüş ve sığlık tehlikeleri bir arada incelenir. Tahmin edilen koşulların gemide gözlenenlerle uyuşup uyuşmadığı karşılaştırılır. Kaptan; seyir planının sürdürülebilirliğini, güvenli rota alternatiflerini, emniyetli deniz alanını ve gerekirse bekleme/korunaklı bölge seçeneklerini değerlendirir. Ekip, bir tahmindeki belirsizliğin tek bir rüzgâr rakamıyla temsil edilemeyeceğini öğrenir.","Gösterim: Örnek bir meteoroloji haritası veya eğitim verisi üzerinde dalga yönü ve gemi rotası karşılaştırılır; gerçek seferin rotası değiştirilmez. İlgili kartlar: NAV-C01, C02, C05. Beklenen öğrenme: Hava tehdidi, uygun veri kaynağı ve olası rota kararı gerekçesi açıklanır."],"source_full_en":["Review recent forecasts, navigational warnings, wind and current, wind-wave and swell components, frontal passage, visibility and shoal hazards together on the bridge. Compare forecast conditions with those observed aboard. The master assesses whether the passage plan remains viable, safe alternative routes, sufficient sea room and, if necessary, holding or sheltered-area options. Personnel learn that forecast uncertainty cannot be represented by a single wind-speed figure.","Demonstration: Compare wave direction and ship's track on a sample weather chart or training dataset without changing the route of an actual voyage. Related cards: NAV-C01, C02, C05. Expected learning: Explain the weather threat, relevant data source and reasons supporting possible route decisions."],"source_integrity":"sha256_verified_against_embedded_blocks"},{"step":2,"title_tr":"Komuta düzeni, görev paylaşımı ve emniyetli iletişim","title_en":"Establish command and communications","learning_tr":"Vardiya zabitinin kaptanı hangi değişimlerde çağıracağı, makine vardiyasından hangi sistem bilgilerinin isteneceği ve güverte/kamara birimlerinin kimlerce kontrol edileceği belirlenir.","learning_en":"Conditions requiring the officer of the watch to call the master are identified, together with the machinery information needed and the personnel responsible for inspecting deck and accommodation areas.","exercise_tr":"Köprüüstü–makine–güverte görev kartlarıyla kötüleşen hava ihbarını ve kaptana rapor zincirini canlandırın.","exercise_en":"Rehearse deteriorating-weather reports and the call-the-master chain using bridge, engine-room and deck role cards.","hazard_tr":"Gecikmiş kaptan çağrısı, eksik tekrar teyidi veya birimlerin farklı durum bilgisiyle hareket etmesi.","hazard_en":"Delayed escalation, missing read-back or inconsistent situation information between teams.","id":"HW-02","source_full_tr":["Vardiya zabitinin kaptanı hangi değişimlerde çağıracağı, makine vardiyasından hangi sistem bilgilerinin isteneceği ve güverte/kamara birimlerinin kimlerce kontrol edileceği belirlenir. Rüzgâr, yalpa, güverte ıslanması, rota/sürat, yaralı personel ihtimali ve seyir cihazı arızaları aynı durum raporunda toplanır. Köprüüstü ile makine arasındaki emir tekrarları, uygun olduğunda yedek iletişim yöntemleri ve kayıt zamanı açıklanır.","Gösterim: “Kötüleşen dalga” anonsu için kısa görev-rapor konuşması örneklenir. Kartlar: NAV-C01, C02, C10, C11. Beklenen öğrenme: Her görevli neyi, kime ve hangi öncelikle bildireceğini açıklar."],"source_full_en":["Determine w
