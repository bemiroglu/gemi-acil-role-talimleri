a256_verified_against_embedded_blocks"},{"step":3,"title_tr":"Yangın–yakıt–rotor–elektrik risk resmi oluşturulur","title_en":"Evaluate fire, fuel, rotor and electrical hazards","learning_tr":"Uçak yakıtı, yakıt buharı, yanmış yakıt, motor sıcaklığı, elektrik ve hidrolik sistemler, hareketli rotor, hasarlı gövde ve basınçlı bileşenler eğitimde ayrı risk grupları olarak tanıtılır.","learning_en":"Aircraft fuel and vapours, burning fuel, engine heat, electrical and hydraulic systems, rotating rotors, damaged structure and pressurised components are presented as distinct hazard groups.","exercise_tr":"Yakıt, sıcak motor, rotor, basınçlı devre ve elektrik tehlikelerini saha planında farklı risk bölgeleri olarak işaretleyin.","exercise_en":"Mark fuel, hot-engine, rotor, pressure-system and electrical hazards as separate risk zones on an area plan.","hazard_tr":"Yanıcı buhar veya hareketli rotor varken hasarlı hava aracına yaklaşma.","hazard_en":"Approaching a damaged aircraft with flammable vapour or moving rotor components present.","id":"C3","source_full_tr":["Uçak yakıtı, yakıt buharı, yanmış yakıt, motor sıcaklığı, elektrik ve hidrolik sistemler, hareketli rotor, hasarlı gövde ve basınçlı bileşenler eğitimde ayrı risk grupları olarak tanıtılır. Yangının yayılma yönü, personelin güvenli yaklaşma alanı, mevcut rüzgâr ve güverte bağlantıları birlikte değerlendirilir. Olayın dışarıdan yalnız küçük alev görünmesi gizli yakıt veya sıcak yüzey riskini ortadan kaldırmaz. Yangın müdahale ekibinin nerede korunaklı beklediği ve kazazedelere nasıl erişim planladığı, gemiye özgü helideck acil planı üzerinden gösterilir."],"source_full_en":["Introduce aviation fuel, fuel vapour, burning fuel, engine heat, electrical and hydraulic systems, moving rotors, damaged aircraft structure and pressurised components as distinct hazard groups. Evaluate fire spread, safe personnel approach, prevailing wind and connections with adjacent deck areas. A small visible flame does not exclude hidden fuel or hot-surface hazards. Demonstrate the firefighting team's protected standby position and casualty-access plan against the vessel-specific helideck emergency plan."],"source_integrity":"sha256_verified_against_embedded_blocks"},{"step":4,"title_tr":"Uygun söndürme ve personel koruması açıklanır","title_en":"Review fire protection and personnel safety","learning_tr":"Söndürücünün türü ve uygulama biçimi hava aracı, yakıt, yangın bölgesi ve geminin onaylı yangın/helikopter prosedürüne göre değerlendirilir.","learning_en":"The type and method of application of extinguishing agents are assessed against the aircraft, fuel, fire location and the vessel's approved fire and helicopter procedures.","exercise_tr":"Onaylı helikopter yangın planına göre köpük, hortum, solunum koruması ve kaçış yollarının yerlerini kuru gösterimde tanıtın.","exercise_en":"Locate foam, hoses, respiratory protection and escape routes during a dry familiarisation based on the approved helicopter fire plan.","hazard_tr":"Uygunsuz söndürücü ajan seçimi veya eğitim sırasında sabit sistemi gerçekten boşaltmak.","hazard_en":"Inappropriate extinguishing-agent selection or actual fixed-system discharge during a drill.","id":"C4","source_full_tr":["Söndürücünün türü ve uygulama biçimi hava aracı, yakıt, yangın bölgesi ve geminin onaylı yangın/helikopter prosedürüne göre değerlendirilir. Köpük sistemi, hortum, yangın pompası, yangıncı elbisesi ve gerektiğinde solunum korumasının görevleri tanıtılır; donanımın fiziksel olarak nerede bulunduğu gösterilir. Yangın başlangıcında pilotun uçak üzerindeki kendi sistemini kullanabilme olasılığı, gemi müdahalesini zamanlama ve koordinasyon yönünden etkiler. Eğitimde “her motor yangınına belirli bir ajan uygulanır”, “uçağın motoru mutlaka güvertedeki personelce durdurulur” gibi evrensel reçeteler verilmez. Gerçek uygulamada onaylı uçuş/yangın ekipleri birlikte karar verir."],"source_full_en":["Select extinguishing media and application methods according to the aircraft, fuel, seat of fire and the vessel's approved firefighting and helicopter procedures. Explain the functions and physical locations of foam equipment, hoses, fire pumps, protective clothing and, where required, breathing apparatus. The pilot's ability to operate onboard aircraft systems at the onset of a fire may affect the timing and coordination of shipboard response. Do not teach universal directions such as applying one agent to all engine fires or requiring deck personnel to shut down every aircraft engine. Actual actions require coordinated decisions by authorised flight and fire personnel."],"source_integrity":"sha256_verified_against_embedded_blocks"},{"step":5,"title_tr":"Kurtarma ve yaralı alma organizasyonu öğretilir","title_en":"Organize casualty rescue and care","learning_tr":"Uçaktaki ve yakınındaki insanların durumu, tahliye kapıları, darbe sonrası gövde hasarı, yangının ilerleme ihtimali, rotor ve yakıt riskleri birlikte incelenir.","learning_en":"The condition of occupants and people nearby, exit openings, impact damage to the aircraft, possible spread of fire, rotor and fuel hazards are assessed together.","exercise_tr":"Kaza maketinde ekip emniyeti, tahliye güzergâhı, sedye konumu ve uçuş ekibinden alınacak bilgileri tartışın.","exercise_en":"Discuss rescuer safety, escape route, stretcher location and aircraft information on a casualty model.","hazard_tr":"Dönen rotor, kararsız enkaz ve yakıt nedeniyle ikinci kazazede oluşturmak.","hazard_en":"Creating additional casualties from rotating blades, unstable wreckage or fuel exposure.","id":"C5","source_full_tr":["Uçaktaki ve yakınındaki insanların durumu, tahliye kapıları, darbe sonrası gövde hasarı, yangının ilerleme ihtimali, rotor ve yakıt riskleri birlikte incelenir. Kurtarıcıların önce kendi emniyetini sağlaması ve uygun giriş güzergâhı seçmesi öğretilir. Uçuş ekibi kurtarma için gerekli uçak bilgilerini iletebiliyorsa bunlar değerlendirilir. Kaza türüne bağlı olarak yangın ekibiyle kurtarma ekibinin eşzamanlı çalışması, sedye ve ilk yardım donanımının güvenli noktada hazır tutulması açıklanır. Uçak tipine özgü kapı, emniyet kemeri ve acil kapatma mekanizmaları, üretici/işletici bilgisi doğrulanmadan ayrıntılı kumanda tarifi olarak verilmez."],"source_full_en":["Assess people in and around the aircraft, escape doors, impact damage, possible fire development, rotor movement and fuel hazards. Teach rescuers to secure their own safety and select a safe route of access. Use aircraft information supplied by the flight crew where available. Explain concurrent work by fire and rescue teams, with stretchers and first-aid equipment available at a safe location. Do not give aircraft-type-specific door, harness or emergency shutdown commands without verified manufacturer or operator instructions."],"source_integrity":"sha256_verified_against_embedded_blocks"},{"step":6,"title_tr":"Sert iniş/çarpışma sonrası ikincil tehlikeler değerlendirilir","title_en":"Assess hazards following a hard landing","learning_tr":"Sert iniş sonucu helideck yapısının etkilenmesi, yakıt veya hidrolik kaçağı, elektrik tesisatında hasar, dönmeye devam eden rotor, düşen parçalar ve geminin komşu mahallerinde yangın/su alma olasılıkları eğitimde yer alır.","learning_en":"After a hard landing, discuss structural damage to the helideck, fuel or hydraulic leaks, electrical faults, rotating rotor blades, falling debris and fire or flooding in adjacent spaces. Visual cleanup is not sufficient to return a damaged platform to service: technical inspection and authorised acceptance are required. Even without fire, control ignition sources and isolate any fuel leak safely. Avoid exposing personnel to an unsecured wreckage area.","exercise_tr":"Örnek sert iniş hasar şemasında yapı, yakıt/hidrolik, elektrik ve komşu mahal kontrollerini gösterin.","exercise_en":"Demonstrate structure, fuel/hydraulic, electrical and adjacent-space checks on a hard-landing damage diagram.","hazard_tr":"Teknik değerlendirme olmadan hasarlı sahayı yeniden kullanıma açma veya sızıntıda ateşleme kaynağını göz ardı etme.","hazard_en":"Reopening a damaged deck without technical assessment or overlooking ignition sources around a leak.","id":"C6","source_full_tr":["Sert iniş sonucu helideck yapısının etkilenmesi, yakıt veya hidrolik kaçağı, elektrik tesisatında hasar, dönmeye devam eden rotor, düşen parçalar ve geminin komşu mahallerinde yangın/su alma olasılıkları eğitimde yer alır. Hasar alan platformun tekrar kullanımına izin verilmesi yalnız gözlemsel temizlikle sağlanmaz; teknik inceleme ve yetkili onay gerektirir. Yangınsız yakıt sızıntısı durumunda dahi ateşleme kaynağının kontrolü, emniyetli izolasyon ve gerektiğinde çevre kirliliği süreci dikkate alınır. Personelin yakın tehdit olmadan enkaz sahasına girmemesi, ikinci bir olayın önlenmesine hizmet eder."],"source_full_en":["Discuss possible helideck structural damage after a hard landing, fuel or hydraulic leaks, damage to electrical installations, rotors still turning, falling debris and fire or flooding in adjacent vessel spaces. An impacted platform must not be returned to use merely after visual cleaning; engineering inspection and authorised approval are required. Even without fire, a fuel leak requires consideration of ignition-source control, safe isolation and possible environmental pollution procedures. Prevent a secondary accident by excluding personnel from the wreckage area unless a compelling immediate threat requires intervention."],"source_integrity":"sha256_verified_against_embedded_blocks"},{"step":7,"title_tr":"Birleşik acil durum ve dış destek senaryosu işlenir","title_en":"Rehearse combined emergency response","learning_tr":"Helikopter yangınının gemi yangınına dönüşmesi, kazazedenin denize düşmesi, platformdan yakıtın denize karışması veya acil tıbbi tahliye gerektirmesi hâlleri çalışılır.","learning_en":"The exercise covers an aircraft fire spreading to the ship, a casualty falling overboard, fuel entering the sea from the platform and a need for urgent medical evacuation.","exercise_tr":"Yangın–MOB–kirlilik–tıbbi tahliye dallanmalarını gösteren birleşik olay akış şeması oluşturun.","exercise_en":"Build a combined-event flowchart linking fire, MOB, pollution and medical evacuation scenarios.","hazard_tr":"Bir müdahaleyi başlatırken kurtarma botu indirme veya dış bildirimi yapılmış gibi varsaymak.","hazard_en":"Assuming rescue-boat launch or external notification has occurred merely because it appears in the scenario.","id":"C7","source_full_tr":["Helikopter yangınının gemi yangınına dönüşmesi, kazazedenin denize düşmesi, platformdan yakıtın denize karışması veya acil tıbbi tahliye gerektirmesi hâlleri çalışılır. Bu durumlarda Yangın, MOB, SAR, Deniz Kirliliği ve Gemiyi Terk ailelerindeki genel bilgilerin hangisinin kullanılacağı gösterilir. Kaptanın dış yardım talebi ve ilgili makam bildirimi, olayın gerçek ciddiyeti ve yürürlükteki planla ilişkilendirilir. Gerekli olduğunda kurtarma botunun hazırlanmasıyla gerçekten indirilmesi birbirinden ayrılır. Talimde gerçek acil durum yayınlarının yapılmadığı durumlar ayrıca kayda doğru şekilde yansıtılır."],"source_full_en":["Consider helicopter fire spreading to the vessel, a casualty falling overboard, fuel entering the sea from the platform, or an urgent medical evacuation requirement. Show how Fire, Man Overboard, SAR, Marine Pollution and Abandon Ship guidance may be combined. External assistance requests and official notifications by the master depend on actual severity and the current applicable plan. Distinguish making a rescue boat ready from actually launching it. The training report must distinguish any exercise without real emergency transmissions from an actual distress response."],"source_integrity":"sha256_verified_against_embedded_blocks"},{"step":8,"title_tr":"Müdahale sonuçları, güvenliğe dönüş ve rapor konuları değerlendirilir","title_en":"Evaluate outcome and document","learning_tr":"Senaryo sonunda personel sayımı, olay kontrolü, yaralılar, eksik donanım, yangın sistemi hazırlığı ve tekrar tutuşma riski ele alınır. EYS.08.112.FR helikopter acil durum kontrol listesi, EYS.08.105.","learning_en":"At the end of the scenario, personnel accounting, control of the incident, injuries, equipment deficiencies, readiness of firefighting systems and the risk of re-ignition are reviewed. EYS.08.112.","exercise_tr":"Son kontrol çizelgesinde personel yoklaması, tekrar tutuşma, sistem hazır olma ve kayıt ayrımını gözden geçirin.","exercise_en":"Review personnel accounting, re-ignition, system readiness and record categories on a closing checklist.","hazard_tr":"Tatbikatta kullanılmayan köpüğün boşaltılmış veya gerçek tahliyenin yapılmış gibi raporlanması.","hazard_en":"Reporting foam discharge or real evacuation when only a drill discussion took place.","id":"C8","source_full_tr":["Senaryo sonunda personel sayımı, olay kontrolü, yaralılar, eksik donanım, yangın sistemi hazırlığı ve tekrar tutuşma riski ele alınır. EYS.08.112.FR helikopter acil durum kontrol listesi, EYS.08.105.FR yangın kontrolü, olaya göre çevre/MOB/SAR listeleri ve EK-V raporunun birbirinin yerine geçmediği açıklanır. Tatbikatta yalnız ekipman tanıtımı ve simülasyon gerçekleştirilmişse kullanılan rapor dili buna uygun olur; köpük boşaltımı veya gerçek uçak tahliyesi yapılmış sayılmaz. Yapılan debriefing, personel koordinasyonu, müdahale hazırlığı ve gemiye özel acil planın eksik anlaşılmış noktalarını açığa çıkarır."],"source_full_en":["At exercise closeout review headcount, incident control, injuries, unavailable equipment, firefighting-system readiness and rekindling risks. Explain that the helicopter emergency checklist EYS.08.112.FR, the fire checklist EYS.08.105.FR, incident-dependent pollution/MOB/SAR lists and EK-V records are not interchangeable. Where only equipment familiarisation and simulated response took place, report wording must not imply foam discharge or a real aircraft evacuation. Debriefing should identify deficiencies in team coordination, response readiness and understanding of the vessel-specific helideck emergency plan."],"source_integrity":"sha256_verified_against_embedded_blocks"}]},{"key":"helicopter/ditching","family":"helicopter","flow":"ditching","title_tr":"Helikopterin Denize İnişi / SAR","title_en":"Helicopter Ditching / SAR","family_title_tr":"Helikopter / Gemi Operasyonları","family_title_en":"Helicopter / Ship Operations","stages":[{"step":1,"title_tr":"Deniz üzerindeki havacılık kazası ihbarı değerlendirilir","title_en":"Evaluate an aircraft ditching report","learning_tr":"Helikopterin denize indiği, denize düşen bir kişi görüldüğü veya uçakla bağlantının kesildiği durumlar birbirinden ayrılır.","learning_en":"A helicopter ditching, a person observed falling into the sea and loss of contact with an aircraft are distinguished as different situations.","exercise_tr":"Örnek son görülen mevki, saat, kişi sayısı ve gözlem güvenilirliği kartlarını değerlendirin.","exercise_en":"Review sample last-known-position, time, persons-on-board and observation-reliability cards.","hazard_tr":"Kesin olmayan düşüş mevkiini kesin konum gibi kaydetmek veya kayıp kişi sayısını doğrulanmış saymak.","hazard_en":"Reporting an uncertain ditching position or number of missing persons as confirmed.","id":"D1","source_full_tr":["Helikopterin denize indiği, denize düşen bir kişi görüldüğü veya uçakla bağlantının kesildiği durumlar birbirinden ayrılır. İlk gözlemde mevki, saat, görüş yönü, helikopterin son görüldüğü nokta, uçak üzerindeki insan sayısı hakkında bilinenler ve yüzeyde görülen donanım kayda konu edilir. Kesinleşmemiş bilgilerin tahmin olarak işaretlenmesi ve arama alanı oluşturmak için koordinasyon merkezine doğru aktarılması öğretilir. Geminin kazayı doğrudan görmediği durumda tek bir tahmini konum, kesin düşüş mevkii olarak kabul edilmez."],"source_full_en":["Distinguish a helicopter reported to have made a forced landing on the water, a person seen falling into the sea and loss of contact with an aircraft. In the initial observation, document the position and time, direction of sighting, last known aircraft location, confirmed information on the number of persons aboard and equipment visible on the surface. Teach that unconfirmed details must be marked as estimates and accurately passed to the coordination centre for search-area planning. If the vessel did not witness the accident, a single estimated position must not be presented as a confirmed impact location."],"source_integrity":"sha256_verified_against_embedded_blocks"},{"step":2,"title_tr":"Kaptan, SAR koordinasyonu ve haberleşme düzenini kurar","title_en":"Establish SAR command and communications","learning_tr":"Kaptan geminin konumunu, kendi seyir güvenliğini, yakındaki tehlikeleri ve yardım imkânlarını değerlendirir. RCC/MRCC ve ilgili haberleşme birimleriyle koordine hareket etme, gerçek tehlike bildirimi ile tatbikat konuşmasını…","learning_en":"The master evaluates the vessel's position, navigational safety, nearby hazards and ability to assist. Practise coordination with RCC/MRCC, relevant radio services and dedicated lookouts; distinguish genuine distress transmissions from drill communications. Update the last information received from the aircraft or shore authority. The ship does not automatically become on-scene coordinator (OSC) simply because it assists in a rescue.","exercise_tr":"Kaptan–RCC/MRCC–gözcü haberleşme zincirini senaryo haritasında gösterin ve tatbikat çağrısını açıkça ayırın.","exercise_en":"Show master–RCC/MRCC–lookout communications on a scenario chart while clearly separating exercise messages.","hazard_tr":"Tatbikatta gerçek tehlike alarmı gönderme veya koordinasyon yetkisini kendiliğinden üstlenme.","hazard_en":"Sending a real distress alert for training or assuming coordination authority without assignment.","id":"D2","source_full_tr":["Kaptan geminin konumunu, kendi seyir güvenliğini, yakındaki tehlikeleri ve yardım imkânlarını değerlendirir. RCC/MRCC ve ilgili haberleşme birimleriyle koordine hareket etme, gerçek tehlike bildirimi ile tatbikat konuşmasını ayırma ve görevli gözcüler atama konuları anlatılır. Helikopterden veya sahil makamından alınan son bilgiler güncellenir. Gemi SAR unsurlarından biri olarak görevlendirilmişse yerel koordinasyon ve varsa OSC ilişkisi açıklanır; bir kurtarma olayında otomatik olarak OSC yetkisi üstlenildiği varsayılmaz."],"source_full_en":["The master assesses vessel position, navigation safety, nearby hazards and available assistance capabilities. Explain coordination with RCC/MRCC and other competent communications units, the distinction between real distress traffic and training communications, and assignment of lookouts. Update the last information from the helicopter or shore authorities. If the vessel is tasked as a SAR unit, clarify local coordination arrangements and any designated on-scene coordinator (OSC); participation in a rescue incident does not confer OSC authority automatically."],"source_integrity":"sha256_verified_against_embedded_blocks"},{"step":3,"title_tr":"Gözcülük ve arama bilgileri düzenlenir","title_en":"Organize lookout and search data","learning_tr":"Denize zorunlu iniş, rüzgâr, akıntı ve geçen zaman nedeniyle kazazedelerin başlangıç konumundan uzaklaşmasına yol açabilir. Sürekli görsel gözetim, konum işaretleme, görüş şartları ve sürüklenme bilgileri eğitimde işlenir.","learning_en":"Following a ditching, wind, current and elapsed time may carry survivors away from their initial position. Continuous visual observation, position marking, visibility and drift information are addressed.","exercise_tr":"Örnek rüzgâr ve akıntı verilerinde sürüklenme ihtimalini tartışıp arama gözlem noktalarını işaretleyin.","exercise_en":"Use sample wind/current data to discuss drift and mark lookout sectors for an illustrative search.","hazard_tr":"Tek enkaz parçasını veya varsayımsal datum noktasını kazazedenin kesin konumu saymak.","hazard_en":"Treating a debris item or hypothetical datum as the confirmed location of a survivor.","id":"D3","source_full_tr":["Denize zorunlu iniş, rüzgâr, akıntı ve geçen zaman nedeniyle kazazedelerin başlangıç konumundan uzaklaşmasına yol açabilir. Sürekli görsel gözetim, konum işaretleme, görüş şartları ve sürüklenme bilgileri eğitimde işlenir. Deniz üzerindeki bir yüzer enkazın veya kurtarma salının her zaman kazazede yerini göstermeyeceği belirtilir. Gemi hareketi, diğer SAR unsurları ve radar/optik gözlemin sınırlamaları değerlendirilir. Kullanılacak arama yöntemi, IAMSAR çerçevesindeki koordinasyon ve eldeki somut olay verileriyle ilişkilendirilir; yalnız genel ders metnine bakılarak otomatik bir paternde manevra başlatılmaz."],"source_full_en":["A forced landing at sea, wind, current and elapsed time may cause casualties to drift from the initial location. Teach continuous visual watch, position marking, visibility conditions and drift information. Floating wreckage or a liferaft does not necessarily indicate the casualties' location. Evaluate vessel movements, other SAR units and the limits of radar and optical observation. Search methodology must reflect IAMSAR coordination and the actual incident data; do not initiate a generic search pattern automatically merely because it appears in a training text."],"source_integrity":"sha256_verified_against_embedded_blocks"},{"step":4,"title_tr":"Kurtarma imkânı ve yaklaşma emniyeti belirlenir","title_en":"Assess safe vessel approach and rescue means","learning_tr":"Geminin borda yüksekliği, deniz şartları, mevcut kurtarma botu, pervane hareketi, hava aracı enkazı, sarkmış kablolar, yakıt yüzeyi ve rotordan kaynaklanabilecek tehlikeler değerlendirilir.","learning_en":"Freeboard, sea state, available rescue boat, propeller movement, aircraft wreckage, trailing wires, surface fuel and possible rotor hazards are evaluated.","exercise_tr":"Kurtarma botu, borda, pervane ve enkaz tehlikelerini maket üzerinde karşılaştırarak güvenli yaklaşma seçeneklerini tartışın.","exercise_en":"Compare rescue boat, ship-side, propeller and wreckage risks on a model to discuss safe approach options.","hazard_tr":"Yüzey yakıtı, kablo veya dönmekte olan parçalar yakınında kontrolsüz bot indirme.","hazard_en":"Uncontrolled boat launch near surface fuel, cables or moving components.","id":"D4","source_full_tr":["Geminin borda yüksekliği, deniz şartları, mevcut kurtarma botu, pervane hareketi, hava aracı enkazı, sarkmış kablolar, yakıt yüzeyi ve rotordan kaynaklanabilecek tehlikeler değerlendirilir. Kurtarma botu için izinli indirme şartları, kaptan kararı ve görevli personel hazırlığı ayrıca açıklanır. Denizdeki kişilere yaklaşırken ana geminin sevk ve manevra etkisi ile küçük botun kontrol imkânları birlikte ele alınır. Kurtarma botunun motorunun çalıştırılması, özel indirme tertibatı ve kanca ayrılması için modelden bağımsız bir kumanda dizisi verilmez; ilgili bot ailesinin onaylı işletme talimatı kullanılır."],"source_full_en":["Assess vessel freeboard, sea conditions, available rescue craft, propeller movement, aircraft wreckage, trailing cables, fuel on the sea surface and possible rotor hazards. Explain separately the conditions for an authorised rescue-boat launch, the master's decision and assigned personnel readiness. When approaching people in the water, consider the main vessel's propulsion and manoeuvring effect alongside small-craft controllability. Do not give a model-independent sequence for starting the boat engine, operating its launching system or releasing hooks; use the applicable craft's approved operating instructions."],"source_integrity":"sha256_verified_against_embedded_blocks"},{"step":5,"title_tr":"Kazazedenin sudan alınması ve ilk yardım planlanır","title_en":"Plan recovery and first aid","learning_tr":"Sudaki kişinin bilinci, hipotermi riski, yanık, travma, inhalasyon, boğulma ve hareket ettirme sınırları öğretici biçimde açıklanır.","learning_en":"Training addresses the person's consciousness, risk of hypothermia, burns, trauma, inhalation, drowning and limitations on moving the casualty.","exercise_tr":"Mankenle veya senaryo kartlarıyla sudan alma, hipotermi/yaralanma değerlendirmesi ve sağlık ekibine teslimi gösterin.","exercise_en":"Use a dummy or scenario cards to rehearse recovery from water, hypothermia/injury assessment and medical handover.","hazard_tr":"Kazazedeye uygunsuz kaldırma, olası omurga yaralanmasını ağırlaştırma veya kurtarıcıyı riske atma.","hazard_en":"Unsafe lifting, aggravation of possible spinal injury or exposing rescuers to danger.","id":"D5","source_full_tr":["Sudaki kişinin bilinci, hipotermi riski, yanık, travma, inhalasyon, boğulma ve hareket ettirme sınırları öğretici biçimde açıklanır. Uygun kurtarma aracı ve gemiye alma yöntemi, kazazedenin durumuna ve mevcut donanıma göre seçilir. Yaralıya emniyetli yaklaşma ve su üzerindeki enkaz/yakıt alanından uzak durma, kurtarıcı emniyeti bakımından öne çıkar. Gemide ilk yardım ve tıbbi yardım talebi, önceki MOB/SAR eğitimindeki ortak konulara bağlanır; ilk yardımın her vakada aynı müdahale sırasını izleyen mekanik bir işlem olmadığı vurgulanır."],"source_full_en":["Explain consciousness, hypothermia, burns, trauma, inhalation injury, drowning risk and limitations on moving a casualty. Select the recovery craft and means of bringing the person aboard according to casualty condition and available equipment. Protect rescuers during approach and avoid wreckage and fuel slicks. Link shipboard first aid and requests for medical support to MOB/SAR training. Emphasise that first aid is not a mechanical sequence identical in every case."],"source_integrity":"sha256_verified_against_embedded_blocks"},{"step":6,"title_tr":"Yangın, yakıt kirliliği ve gemi emniyeti birlikte değerlendirilir","title_en":"Review fire, fuel pollution and ship safety","learning_tr":"Deniz üzerindeki hava aracı yakıtı alevlenme, kayganlık, toksik buhar ve çevresel kirlenme tehlikesi yaratabilir. Gemi veya botun olay yerine yaklaşmasında motor, egzoz, sıcak yüzey, radar/elektrik donanımı ve personel emniyeti…","learning_en":"Aircraft fuel on the water may cause ignition, slipping, toxic vapours and pollution. During approach by ship or boat, assess engines, exhausts, hot surfaces, radar/electrical equipment and personnel safety. Designate a safe area for recovered persons and equipment. If pollution is suspected, connect the response with the ship's pollution-control procedures. Assistance must not create a second emergency through collision, grounding or flooding.","exercise_tr":"Örnek hava aracı yakıtı sızıntısını ve alevlenme riskini deniz kirliliği olay şemasıyla ilişkilendirin.","exercise_en":"Link a hypothetical aviation-fuel spill and ignition hazard to a marine-pollution response diagram.","hazard_tr":"Yakıt buharı yakınında ateşleme kaynağı veya kirli alana emniyetsiz gemi/bot yaklaşımı.","hazard_en":"Ignition sources near fuel vapour or unsafe vessel/boat approach to contaminated water.","id":"D6","source_full_tr":["Deniz üzerindeki hava aracı yakıtı alevlenme, kayganlık, toksik buhar ve çevresel kirlenme tehlikesi yaratabilir. Gemi veya botun olay yerine yaklaşmasında motor, egzoz, sıcak yüzey, radar/elektrik donanımı ve personel emniyeti birlikte dikkate alınır. Gemide toplanan kazazede ve kurtarma ekipmanı için güvenli alan belirlenir. Yakıt kirliliği olasılığı saptanırsa gerekli çevre bildirimi ve sızıntıyı sınırlandırma eğitimi Deniz Kirliliği ailesinden çağrılır. Çatışma/karaya oturma/su alma gibi ikinci bir gemi acil durumu doğurmadan yardım edilmesi temel hedeftir."],"source_full_en":["Aircraft fuel on the water may create fire, slippery-surface, toxic-vapour and pollution hazards. Consider engines, exhausts, hot surfaces, radar and electrical equipment, and personnel safety as the ship or rescue boat approaches. Allocate a safe area for recovered casualties and equipment aboard. If pollution is suspected, link necessary environmental reporting and spill-containment training to the Marine Pollution family. The principal objective is to assist without causing a second vessel emergency such as collision, grounding or flooding."],"source_integrity":"sha256_verified_against_embedded_blocks"},{"step":7,"title_tr":"Kurtarma sonrası personel sayımı ve tıbbi takip düzenlenir","title_en":"Account for survivors and medical follow-up","learning_tr":"Kurtarılan ve kayıp kişi sayıları, güvenilir kaynaklarla karşılaştırılır. Tıbbi durumu ağır olanlar için tahliye ve sağlık birimi koordinasyonu sürdürülür.","learning_en":"Numbers rescued and still missing are checked against reliable sources. Coordination with medical services and evacuation arrangements continues for casualties in serious condition.","exercise_tr":"Kurtarılan, kayıp ve aranmaya devam edilen kişileri örnek olay cetvelinde ayrı güncelleyin.","exercise_en":"Update recovered, missing and still-sought persons separately in a sample incident tracker.","hazard_tr":"Tek kişinin kurtarılmasını bütün kazazedelerin bulunduğu veya SAR'ın sona erdiği şeklinde yorumlamak.","hazard_en":"Assuming recovery of one person proves all are safe or that the SAR operation is finished.","id":"D7","source_full_tr":["Kurtarılan ve kayıp kişi sayıları, güvenilir kaynaklarla karşılaştırılır. Tıbbi durumu ağır olanlar için tahliye ve sağlık birimi koordinasyonu sürdürülür. Kurtarma botuyla gelen malzeme ve personelin güvenli geri alınması, bakım ve donanım kontrolü açıklanır. Olayın devam ettiği ve aramanın sona erdiği anlar açıkça ayrılır; yalnız bir kişinin alınmış olması bütün kişilerin kurtarıldığı anlamına gelmez. İlgili SAR birimiyle durum güncellemeleri ve kaptan raporu çalışma kapsamına alınır."],"source_full_en":["Reconcile rescued and missing-person counts against reliable information. Continue medical and evacuation coordination for seriously injured persons. Explain safe recovery of personnel and gear returning in the rescue boat, followed by maintenance and equipment checks. Distinguish clearly between an ongoing incident and the authorised end of a search; recovering one person does not establish that everyone has been rescued. Include situation updates to the relevant SAR authority and reports to the master in the training scope."],"source_integrity":"sha256_verified_against_embedded_blocks"},{"step":8,"title_tr":"Olay bilgileri, kayıt ve debriefing tamamlanır","title_en":"Report event and conclude debrief","learning_tr":"Mevki/saat, gözlenen hava aracı, ilk ihbar, arama ve kurtarma faaliyetleri, kullanılan bot/donanım, yaralılar, dış haberleşme ve olayın sonucu kayda ilişkin örnek alanlar olarak gösterilir.","learning_en":"Sample record fields include position and time, aircraft observations, initial notification, search and rescue actions, boats and equipment used, injuries, external communications and outcome.","exercise_tr":"Kurgusal arama ve kurtarma zaman çizelgesini gerçek mevki/cihaz kayıtlarından ayırarak taslak raporda gösterin.","exercise_en":"Demonstrate separation of fictional search timelines from actual position/equipment records in a draft report.","hazard_tr":"Tatbikat verilerini gerçek SAR raporuna veya bakım/kaza kaydına fiilî olay gibi aktarmak.","hazard_en":"Entering exercise data into an actual SAR, maintenance or casualty record as real events.","id":"D8","source_full_tr":["Mevki/saat, gözlenen hava aracı, ilk ihbar, arama ve kurtarma faaliyetleri, kullanılan bot/donanım, yaralılar, dış haberleşme ve olayın sonucu kayda ilişkin örnek alanlar olarak gösterilir. Gerçek olayda ayrıca kaza ve tehlikeli durum bildirimi, işleticiler ve ilgili makamlarla yürütülecek bildirim süreçleri gündeme gelir. Eğitim taliminde hayalî enkaz, kazazede ve pilot bilgileri gerçek vaka gibi yazılmaz. EYS.08.112.FR ancak helikopter acil durumunun kapsamına uygun olduğu ölçüde; MOB, SAR ve bot kontrol listeleri ise ilgili faaliyetlerin gerçekten işlendiği ölçüde hatırlatılır. Gözlemci ekibin zayıf noktaları debriefing'de kayda bağlanır."],"source_full_en":["For reporting practice, identify position and time, observed aircraft, initial alert, search and rescue actions, craft and equipment used, injuries, external communications and outcome. A real incident may also require accident and dangerous-occurrence reporting and notifications to operators and authorities. Do not describe imaginary wreckage, casualties or pilots from an exercise as real events. Refer to EYS.08.112.FR only where the helicopter emergency scope makes it applicable; MOB, SAR and rescue-boat checklists apply only to the activities actually covered. Record observed weaknesses during the debrief."],"source_integrity":"sha256_verified_against_embedded_blocks"}]}],"additional":[{"id":"gyro","title_tr":"Cayro Pusula Arızası","title_en":"Gyrocompass Failure","summary_tr":"Cayro pusula arızasının seyir ve yön bilgisi üzerindeki etkilerinin değerlendirilmesi; alternatif kaynak ve köprüüstü haberleşme düzeninin teyidi.","summary_en":"Assess how gyrocompass failure affects navigational heading information; verify alternative sources and bridge communications.","boundary_tr":"Alternatif baş referansı, sensör geçişi ve seyir kararları geminin fiilî cihazlarına ve onaylı köprüüstü usullerine bağlıdır.","boundary_en":"Alternative heading references, sensor changeover and navigation decisions depend on actual onboard equipment and approved bridge procedures.","evidence":[["EYS.08.005.PR","Cayro Arızası Acil Durum Prosedürü","ISM Manuel Full Versiyon.pdf","PDF s. 2","ISM indeksindeki atıf; 2023 imzalı prosedür gövdesindeki kod farklıdır. Yürürlük teyidi gereklidir."],["EYS.08.119.FR","Gyro Arızası Kontrol Formu","ISM Manuel Full Versiyon.pdf","PDF s. 203","form listesi"]],"category":"navigation","reconciled_2023":{"historical_code":"EYS.08.006.PR","historical_source":"8. Bölüm Prosedürleri.pdf · 2023 Rev.014 · PDF s.7","indicated_in_v68":"EYS.08.005.PR"}},{"id":"anchor","title_tr":"Demirin Denize Düşmesi / Kontrolsüz Bırakılması","title_en":"Unintended Anchor Release","summary_tr":"Demir donanımında kontrolsüz hareket veya demirin denize düşmesi halinde seyir, güverte personeli ve donanım emniyeti etkilerinin belirlenmesi.","summary_en":"Identify effects on navigation, deck personnel and equipment from uncontrolled anchor movement or unintended release.","boundary_tr":"Zincir, fren, ırgat ve gemi hareketine müdahale yalnız gemiye özgü talimat ve yetkili komuta kapsamında değerlendirilir.","boundary_en":"Intervention involving chain, brake, windlass or vessel movement requires vessel-specific instructions and authorised command.","evidence":[["EYS.08.008.PR","Demiri Denize Düşürme Acil Durum Prosedürü","ISM Manuel Full Versiyon.pdf","PDF s. 2","ISM indeksindeki atıf; 2023 imzalı prosedür gövdesindeki kod farklıdır. Yürürlük teyidi gereklidir."],["EYS.08.120.FR","Demiri Denize Düşürme Kontrol Formu","ISM Manuel Full Versiyon.pdf","PDF s. 203","form listesi"]],"category":"deck","reconciled_2023":{"historical_code":"EYS.08.009.PR","historical_source":"8. Bölüm Prosedürleri.pdf · 2023 Rev.014 · PDF s.11","indicated_in_v68":"EYS.08.008.PR"}},{"id":"fatal_injury","title_tr":"Ciddi Yaralanma veya Ölüm","title_en":"Serious Injury or Death","summary_tr":"Ciddi yaralanma veya ölüm olayında personel emniyeti, tıbbi destek ihtiyacı, haberleşme ve olay kayıtlarının ilgili yetki zinciriyle ele alınması.","summary_en":"Address personnel safety, medical support, communications and incident records through the appropriate command chain following serious injury or death.","boundary_tr":"Tıbbi müdahale, delil muhafazası, adli bildirim ve olay yönetimi ilgili uzmanlık, yetki ve güncel gemi prosedürlerine tabidir.","boundary_en":"Medical treatment, evidence preservation, legal notifications and incident management require relevant expertise, authority and current shipboard procedures.","evidence":[["EYS.08.006.PR","Ciddi Yaralanma Ölüm Acil Durum Prosedürü","ISM Manuel Full Versiyon.pdf","PDF s. 2","ISM indeksindeki at
